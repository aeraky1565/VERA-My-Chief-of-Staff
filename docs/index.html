                </button>
              </div>
            );
          })}
        </div>
      )}

      {/* Aliases management */}
      {aliases.length > 0 && (
        <div className="bento-card" style={{ cursor: 'default', marginBottom: 16 }}>
          <div style={{ display: 'flex', alignItems: 'center', justifyContent: 'space-between', marginBottom: showAliases ? 10 : 0 }}>
            <div className="bento-card-title" style={{ margin: 0 }}>🔗 Transaction Mappings ({aliases.length})</div>
            <button onClick={function() { setShowAliases(!showAliases); }}
              style={{ fontSize: 11, padding: '2px 10px', borderRadius: 8, background: '#0d1b3e', border: '1px solid #1e3060', color: '#6b7fa8', cursor: 'pointer' }}>
              {showAliases ? 'Hide' : 'Show'}
            </button>
          </div>
          {showAliases && aliases.map(function(a, i) {
            return (
              <div key={i} style={{ display: 'flex', alignItems: 'center', gap: 8, padding: '5px 0', borderBottom: '1px solid #0d1b3e', fontSize: 12 }}>
                <div style={{ flex: 1, color: '#6b7fa8', fontFamily: 'monospace' }}>{a.keyword}</div>
                <div style={{ color: '#4d6080' }}>→</div>
                <div style={{ flex: 1, color: '#dde1f0' }}>{a.bill}</div>
                <button onClick={function() { handleDeleteAlias(a.keyword); }} disabled={busy}
                  style={{ fontSize: 10, padding: '2px 8px', borderRadius: 6, background: 'rgba(239,83,80,.1)', border: '1px solid rgba(239,83,80,.3)', color: '#ef5350', cursor: 'pointer' }}>
                  ✕
                </button>
              </div>
            );
          })}
        </div>
      )}

      {/* Empty state */}
      {cashflow && income.length === 0 && expenses.length === 0 && (
        <div className="empty-state" style={{ marginTop: 8 }}>
          <div style={{ fontSize: 28, marginBottom: 10 }}>💰</div>
          <div style={{ color: '#dde1f0', marginBottom: 6 }}>No cashflow data for {monthLabel}</div>
          <div style={{ fontSize: 12, color: '#4d6080' }}>
            Add income entries via "+ Add Bill" (select Income type) to see your cashflow timeline.
            Expenses come from your Bills sheet due dates.
          </div>
        </div>
      )}

      {/* TxAliasPicker modal */}
      {aliasTarget && (
        <TxAliasPicker
          txName={aliasTarget.txName}
          bills={bills}
          busy={busy}
          onSave={handleSaveAlias}
          onClose={function() { setAliasTarget(null); }}
        />
      )}
    </div>
  );
}

// Helper: stable color chip per card name (hashes name to a hue)
function cardChipColor(name) {
  var h = 0;
  for (var i = 0; i < name.length; i++) h = (h * 31 + name.charCodeAt(i)) & 0xffff;
  return 'hsl(' + (h % 360) + ',55%,40%)';
}

// Helper: days since a date string
function daysSince(dateStr) {
  if (!dateStr) return null;
  var d = new Date(dateStr); d.setHours(0,0,0,0);
  var today = new Date(); today.setHours(0,0,0,0);
  return Math.round((today - d) / 86400000);
}

// Helper: format number with commas
function fmtPts(n) {
  if (n == null || n === '') return '0';
  return Number(n).toLocaleString();
}

function CardDetailModal({ card, rewards, perks, onClose, onAddReward, onDeleteReward, onAddPerk, onDeletePerk, onTogglePerk, busy }) {

  const cardPerks   = perks.filter(function(p) { return p.cardName === card.cardName; });
  const [newReward, setNewReward] = React.useState({ category:'', rate:'', rateType:'x points', conditions:'' });
  const [newPerk,   setNewPerk]   = React.useState({ perk:'', amount:'', frequency:'Monthly', category:'' });

  const setPk = (k, v) => setNewPerk(prev => Object.assign({}, prev, { [k]: v }));

  // Compute current period for perk used status
  const now = new Date();
  const curMonth = now.getFullYear() + '-' + String(now.getMonth()+1).padStart(2,'0');
  const curYear  = String(now.getFullYear());

  function isPerkUsed(perk) {
    if (!perk.lastUsed) return false;
    return perk.frequency === 'Annual' ? perk.lastUsed === curYear : perk.lastUsed === curMonth;
  }

  // Group perks by frequency

  const panelStyle = { background:'#161926', border:'1px solid #2a2f45', borderRadius:10, padding:16, marginBottom:16 };

          </span>
          {card.authUser && (
            <span style={{ fontSize:12, color:'#a0a8c0' }}>
              <span style={{ color:'#6b7280' }}>Auth User: </span>{card.authUser}
            </span>
          )}
          {card.annualFee != null && (
            <span style={{ fontSize:12, color:'#a0a8c0' }}>
              <span style={{ color:'#6b7280' }}>Annual Fee: </span>{card.annualFee === 0 ? 'None' : '$' + card.annualFee}
            </span>
          )}
        </div>

        {/* Rewards */}
        <div style={panelStyle}>
          <div style={{ fontWeight:700, fontSize:13, color:'#dde1f0', marginBottom:10 }}>💰 Reward Categories</div>
          {cardRewards.length === 0
            ? <div style={{ fontSize:12, color:'#6b7280', marginBottom:10 }}>No reward categories yet.</div>
            : <table style={{ width:'100%', fontSize:12, borderCollapse:'collapse', marginBottom:10 }}>

                  ))}</tr>
                </thead>
                <tbody>
                  {cardRewards.map(r => (
                    <tr key={r.id}>
                      <td style={{ padding:'4px 8px 4px 0', color:'#dde1f0' }}>{r.category}</td>
                      <td style={{ padding:'4px 8px 4px 0', color:'#4f6ef7', fontWeight:600 }}>{r.rate}</td>
                      <td style={{ padding:'4px 8px 4px 0', color:'#a0a8c0' }}>{r.rateType}</td>
                      <td style={{ padding:'4px 8px 4px 0', color:'#6b7280', fontSize:11 }}>{r.conditions}</td>

              style={Object.assign({}, inputStyle, { width:55 })} />
            <select value={newReward.rateType} onChange={e => setRw('rateType', e.target.value)} style={inputStyle}>

            </select>
            <input placeholder="Conditions (optional)" value={newReward.conditions} onChange={e => setRw('conditions', e.target.value)}

            return (
              <div key={freq} style={{ marginBottom:10 }}>

                      <span style={{ fontSize:11, color: used ? '#22c55e' : '#6b7280' }}>
                        {used ? 'Used' : 'Not used'} {freq === 'Annual' ? 'this year' : 'this month'}
                      </span>
                      <button onClick={() => onDeletePerk(pk.id)} disabled={busy}
                        style={{ background:'none', border:'none', color:'#ef4444', cursor:'pointer', fontSize:14, marginLeft:'auto' }}>×</button>
                    </div>
                  );
                })}
              </div>
            );

          {cardPerks.length === 0 && <div style={{ fontSize:12, color:'#6b7280', marginBottom:10 }}>No perks tracked yet.</div>}

          </div>
        </div>
      </div>
    </div>
  );
}

  const [rewards,   setRewards]   = React.useState([]);
  const [perks,     setPerks]     = React.useState([]);
  const [programs,  setPrograms]  = React.useState([]);
  const [goals,     setGoals]     = React.useState([]);
  const [loading,   setLoading]   = React.useState(true);
  const [busy,      setBusy]      = React.useState(false);
  const [error,     setError]     = React.useState('');
  const [ownerFilter, setOwnerFilter] = React.useState('all');
  const [modal,     setModal]     = React.useState(null); // { type, data }

  async function load() {
    setLoading(true); setError('');
    try {
      const res = await apiGet(apiUrl, apiToken, { action: 'cards' });
      setCards(res.cards || []);
      setRewards(res.rewards || []);
      setPerks(res.perks || []);
      setPrograms(res.programs || []);
      setGoals(res.goals || []);
    } catch (err) { setError('Could not load cards: ' + err.message); }
    setLoading(false);
  }

  React.useEffect(() => { load(); }, []);

  // Filtered cards by owner — matches primary owner OR authorized user
  const visibleCards = React.useMemo(() => {
    if (ownerFilter === 'all') return cards;
    return cards.filter(function(c) {
      return c.owner === ownerFilter || c.authUser === ownerFilter;
    });
  }, [cards, ownerFilter]);

  // Cheat sheet: top 2 cards per category, filtered by visible cards
  const cheatSheet = React.useMemo(() => {
    var visibleNames = new Set(visibleCards.filter(function(c) { return c.active === 'Yes'; }).map(function(c) { return c.cardName; }));
    var byCat = {};
    rewards.forEach(function(r) {
      if (!visibleNames.has(r.cardName)) return;
      if (!byCat[r.category]) byCat[r.category] = [];
      byCat[r.category].push(r);
    });
    var result = [];
    Object.keys(byCat).sort().forEach(function(cat) {
      var sorted = byCat[cat].slice().sort(function(a, b) { return parseFloat(b.rate) - parseFloat(a.rate); });
      result.push({ category: cat, top: sorted.slice(0, 2) });
    });
    return result;
  }, [rewards, visibleCards]);

  function copyCheatSheet() {
    var now = new Date();
    var monthName = now.toLocaleString('default', { month: 'long', year: 'numeric' });
    var lines = ['💳 Ahmed & Victoria\'s Card Cheat Sheet – ' + monthName];
    cheatSheet.forEach(function(row) {
      var cardStrs = row.top.map(function(r) {
        var s = r.cardName + ' (' + r.rate + ' ' + r.rateType + ')';
        if (r.conditions) s += ' | ' + r.conditions;
        return s;
      }).join(' / ');
      lines.push(row.category.padEnd(18) + '→ ' + cardStrs);
    });
    if (navigator.clipboard) {
      navigator.clipboard.writeText(lines.join('\n'));
    }
  }

  // --- CARD CRUD ---
  async function handleSaveCard(form) {
    setBusy(true);
    try {
      var params = Object.assign({ action: modal.data ? 'update_card' : 'add_card' }, form);
      if (modal.data) params.id = modal.data.id;
      await apiGet(apiUrl, apiToken, params);
      setModal(null);
      await load();
    } catch (err) { setError('Save failed: ' + err.message); }
    setBusy(false);
  }

  async function handleDeleteCard(id) {
    if (!confirm('Delete this card and all its rewards/perks?')) return;
    setBusy(true);
    try {
      await apiGet(apiUrl, apiToken, { action: 'delete_card', id });
      await load();
    } catch (err) { setError('Delete failed: ' + err.message); }
    setBusy(false);
  }

  // --- REWARD CRUD ---
  async function handleAddReward(cardName, r) {
    setBusy(true);
    try {
      await apiGet(apiUrl, apiToken, { action: 'add_card_reward', cardName, category: r.category, rate: r.rate, rateType: r.rateType, conditions: r.conditions || '' });
      await load();
    } catch (err) { setError('Add reward failed: ' + err.message); }
    setBusy(false);
  }

  async function handleDeleteReward(id) {
    setBusy(true);
    try {
      await apiGet(apiUrl, apiToken, { action: 'delete_card_reward', id });
      await load();
    } catch (err) { setError('Delete reward failed: ' + err.message); }
    setBusy(false);
  }

  // --- PERK CRUD + TOGGLE ---
  async function handleAddPerk(cardName, pk) {
    setBusy(true);
    try {
      await apiGet(apiUrl, apiToken, { action: 'add_card_perk', cardName, perk: pk.perk, amount: pk.amount || '', frequency: pk.frequency, category: pk.category || '' });
      await load();
    } catch (err) { setError('Add perk failed: ' + err.message); }
    setBusy(false);
  }

  async function handleDeletePerk(id) {
    setBusy(true);
    try {
      await apiGet(apiUrl, apiToken, { action: 'delete_card_perk', id });
      await load();
    } catch (err) { setError('Delete perk failed: ' + err.message); }
    setBusy(false);
  }

  async function handleTogglePerk(id) {
    setBusy(true);
    try {
      await apiGet(apiUrl, apiToken, { action: 'toggle_card_perk', id });
      await load();
    } catch (err) { setError('Toggle perk failed: ' + err.message); }
    setBusy(false);
  }

  // --- LOYALTY + GOALS CRUD ---
  async function handleSaveProgram(form) {
    setBusy(true);
    try {
      var params = Object.assign({ action: modal.data ? 'update_loyalty_program' : 'add_loyalty_program' }, form);
      if (modal.data) params.id = modal.data.id;
      await apiGet(apiUrl, apiToken, params);
      setModal(null);
      await load();
    } catch (err) { setError('Save failed: ' + err.message); }
    setBusy(false);
  }

  async function handleDeleteProgram(id) {
    if (!confirm('Delete this loyalty program?')) return;
    setBusy(true);
    try { await apiGet(apiUrl, apiToken, { action: 'delete_loyalty_program', id }); await load(); }
    catch (err) { setError('Delete failed: ' + err.message); }
    setBusy(false);
  }

  async function handleSaveGoal(form) {
    setBusy(true);
    try {
      var params = Object.assign({ action: modal.data ? 'update_rewards_goal' : 'add_rewards_goal' }, form);
      if (modal.data) params.id = modal.data.id;
      await apiGet(apiUrl, apiToken, params);
      setModal(null);
      await load();
    } catch (err) { setError('Save failed: ' + err.message); }
    setBusy(false);
  }

  async function handleDeleteGoal(id) {
    if (!confirm('Delete this goal?')) return;
    setBusy(true);
    try { await apiGet(apiUrl, apiToken, { action: 'delete_rewards_goal', id }); await load(); }
    catch (err) { setError('Delete failed: ' + err.message); }
    setBusy(false);
  }

  if (loading) return <div style={{ color:'#a0a8c0', padding:24, textAlign:'center' }}>Loading Credit Card Hub…</div>;

  const panelHead = (title, actions) => (
    <div style={{ display:'flex', justifyContent:'space-between', alignItems:'center', marginBottom:12 }}>
      <span style={{ fontWeight:700, fontSize:14, color:'#dde1f0' }}>{title}</span>
      <div style={{ display:'flex', gap:6 }}>{actions}</div>
    </div>
  );

  const pillBtn = (label, onClick, color) => (
    <button onClick={onClick} disabled={busy}
      style={{ background: color || '#2a2f45', color:'#dde1f0', border:'none', borderRadius:6, padding:'5px 12px', cursor:'pointer', fontSize:12 }}>
      {label}
    </button>
  );

  return (
    <div style={{ padding:'4px 0' }}>
      {/* Header */}
      <div style={{ display:'flex', justifyContent:'space-between', alignItems:'center', marginBottom:14, flexWrap:'wrap', gap:8 }}>
        <div>
          <div style={{ fontWeight:700, fontSize:17, color:'#dde1f0' }}>💳 Ahmed &amp; Victoria's Credit Card Hub</div>
          <div style={{ fontSize:12, color:'#6b7280' }}>Updated: {new Date().toLocaleDateString('en-US', { month:'short', day:'numeric', year:'numeric' })}</div>
        </div>
        {/* Owner filter */}
        <div style={{ display:'flex', gap:4 }}>
          {['all','Ahmed','Victoria'].map(function(o) {
            return (
              <button key={o} onClick={() => setOwnerFilter(o)}
                style={{ background: ownerFilter === o ? '#4f6ef7' : '#2a2f45', color: ownerFilter === o ? '#fff' : '#a0a8c0', border:'none', borderRadius:20, padding:'4px 12px', cursor:'pointer', fontSize:12 }}>
                {o === 'all' ? 'All Owners' : o}
              </button>
            );
          })}
        </div>
      </div>

      {error && <div style={{ color:'#ef4444', marginBottom:12, fontSize:13 }}>{error}</div>}

      {/* 2-column grid: left = cheat sheet, right = card tracker + rewards hub */}
      <div style={{ display:'grid', gridTemplateColumns:'2fr 3fr', gap:16, alignItems:'start' }}>

        {/* ── LEFT: Quick-Reference Cheat Sheet ─────────────── */}
        <div style={{ background:'#1a2744', border:'1px solid #2a3f6f', borderRadius:12, padding:16 }}>
          {panelHead('💳 Quick-Reference Cheat Sheet',
            [<span key="sub" style={{ fontSize:11, color:'#6b7280', marginRight:6 }}>(Where to Use Which Card)</span>,
             pillBtn('📋 Copy', copyCheatSheet)]
          )}
          {cheatSheet.length === 0
            ? <div style={{ color:'#6b7280', fontSize:13, textAlign:'center', padding:'20px 0' }}>Add reward categories to your cards to generate the cheat sheet.</div>
            : cheatSheet.map(function(row) {
                var icon = CARD_CATEGORY_ICONS[row.category] || '💰';
                return (
                  <div key={row.category} style={{ display:'flex', gap:10, alignItems:'flex-start', padding:'8px 0', borderBottom:'1px solid #2a3f6f' }}>
                    <div style={{ fontSize:22, lineHeight:1, marginTop:2, minWidth:28 }}>{icon}</div>
                    <div>
                      <div style={{ fontWeight:700, fontSize:13, color:'#dde1f0', textTransform:'uppercase', letterSpacing:'0.5px', marginBottom:3 }}>{row.category}</div>
                      {row.top.map(function(r, idx) {
                        var label = r.cardName + ' (' + r.rate + ' ' + r.rateType + ')';
                        if (r.conditions) label += ' | ' + r.conditions;
                        return <div key={idx} style={{ fontSize:12, color:'#a0a8c0' }}>{label}</div>;
                      })}
                    </div>
                  </div>
                );
              })
          }
        </div>

        {/* ── RIGHT: stacked panels ─────────────────────────── */}
        <div style={{ display:'flex', flexDirection:'column', gap:16 }}>

          {/* Card Tracker */}
          <div style={{ background:'#183028', border:'1px solid #1f4033', borderRadius:12, padding:16 }}>
            {panelHead('📋 Your Card Tracker', [pillBtn('＋ Add Card', () => setModal({ type:'card', data:null }), '#22c55e')])}
            {visibleCards.length === 0
              ? <div style={{ color:'#6b7280', fontSize:13, textAlign:'center', padding:'12px 0' }}>No cards yet. Click ＋ Add Card to get started.</div>
              : <table style={{ width:'100%', fontSize:12, borderCollapse:'collapse' }}>
                  <thead>
                    <tr>{['Card','Owner','Annual Fee','Due','Statement Credit','Status'].map(h => (
                      <th key={h} style={{ textAlign:'left', color:'#6b7280', padding:'4px 8px 8px 0', borderBottom:'1px solid #1f4033', whiteSpace:'nowrap' }}>{h}</th>
                    ))}</tr>
                  </thead>
                  <tbody>
                    {visibleCards.map(function(c) {
                      var ds = daysSince(c.lastUsed);
                      var inactiveWarn = ds != null && ds > 60;
                      return (
                        <tr key={c.id} style={{ cursor:'pointer' }}
                          onClick={() => setModal({ type:'detail', data:c })}>
                          <td style={{ padding:'6px 8px 6px 0', color:'#dde1f0' }}>
                            <div style={{ display:'flex', alignItems:'center', gap:6 }}>
                              <span style={{ display:'inline-block', width:10, height:10, borderRadius:2, background:cardChipColor(c.cardName), flexShrink:0 }}></span>
                              <span style={{ fontWeight:600 }}>{c.cardName}</span>
                              {inactiveWarn && <span style={{ color:'#ef4444', fontSize:11 }} title={'Last used ' + ds + ' days ago — inactivity risk!'}>⚠</span>}
                            </div>
                          </td>
                          <td style={{ padding:'6px 8px 6px 0', color:'#a0a8c0' }}>
                            <div style={{ display:'flex', flexDirection:'column', gap:2 }}>
                              <span>{c.owner}</span>
                              {c.authUser && <span style={{ fontSize:10, color:'#6b7280' }}>+{c.authUser} (auth)</span>}
                            </div>
                          </td>
                          <td style={{ padding:'6px 8px 6px 0', color:'#a0a8c0' }}>{c.annualFee != null && c.annualFee !== '' ? '$' + c.annualFee : '—'}</td>
                          <td style={{ padding:'6px 8px 6px 0', color:'#a0a8c0' }}>{c.dueDay ? c.dueDay + 'th' : '—'}</td>
                          <td style={{ padding:'6px 8px 6px 0', color:'#a0a8c0', fontSize:11 }}>{c.statementCredit || '—'}</td>
                          <td style={{ padding:'6px 8px 6px 0' }}>
                            <div style={{ display:'flex', alignItems:'center', gap:6 }}>
                              <span style={{ background: c.active === 'Yes' ? '#166534' : '#374151', color: c.active === 'Yes' ? '#86efac' : '#9ca3af',
                                fontSize:10, fontWeight:700, borderRadius:4, padding:'2px 6px' }}>
                                {c.active === 'Yes' ? 'ACTIVE' : 'INACTIVE'}
                              </span>
                              <button onClick={e => { e.stopPropagation(); setModal({ type:'card', data:c }); }} disabled={busy}
                                style={{ background:'none', border:'none', color:'#a0a8c0', cursor:'pointer', fontSize:12 }}>✏️</button>
                              <button onClick={e => { e.stopPropagation(); handleDeleteCard(c.id); }} disabled={busy}
                                style={{ background:'none', border:'none', color:'#ef4444', cursor:'pointer', fontSize:13 }}>×</button>
                            </div>
                          </td>
                        </tr>
                      );
                    })}
                  </tbody>
                </table>
            }
          </div>

          {/* Rewards & Redemption Hub */}
          <div style={{ background:'#2a1a0a', border:'1px solid #4a3010', borderRadius:12, padding:16 }}>
            {panelHead('🎁 Rewards & Redemption Hub', [
              pillBtn('＋ Program', () => setModal({ type:'program', data:null }), '#f59e0b'),
              pillBtn('＋ Goal', () => setModal({ type:'goal', data:null }), '#f59e0b'),
            ])}
            {/* Programs table */}
            {programs.length === 0
              ? <div style={{ color:'#6b7280', fontSize:13, marginBottom:12 }}>No loyalty programs added yet.</div>
              : <table style={{ width:'100%', fontSize:12, borderCollapse:'collapse', marginBottom:16 }}>
                  <thead>
                    <tr>{['Program','Total Points','Est. Value','Best Use',''].map(h => (
                      <th key={h} style={{ textAlign:'left', color:'#a07030', padding:'4px 8px 8px 0', borderBottom:'1px solid #4a3010' }}>{h}</th>
                    ))}</tr>
                  </thead>
                  <tbody>
                    {programs.map(function(pg) {
                      var estVal = Math.round(pg.totalPoints * (pg.centsPerPoint || 1) / 100);
                      var ds90  = pg.expiry && pg.expiry !== 'Never' && pg.expiry
                        ? Math.round((new Date(pg.expiry) - new Date()) / 86400000) : null;
                      return (
                        <tr key={pg.id}>
                          <td style={{ padding:'5px 8px 5px 0', color:'#f0c060', fontWeight:600 }}>
                            {pg.program}
                            {ds90 != null && ds90 <= 90 && <span style={{ color:'#f59e0b', fontSize:11, marginLeft:4 }}>⚠ expires {pg.expiry}</span>}
                          </td>
                          <td style={{ padding:'5px 8px 5px 0', color:'#dde1f0' }}>{fmtPts(pg.totalPoints)}</td>
                          <td style={{ padding:'5px 8px 5px 0', color:'#22c55e' }}>${estVal.toLocaleString()}</td>
                          <td style={{ padding:'5px 8px 5px 0', color:'#a0a8c0' }}>{pg.bestUse}</td>
                          <td style={{ whiteSpace:'nowrap' }}>
                            <button onClick={() => setModal({ type:'program', data:pg })} disabled={busy}
                              style={{ background:'none', border:'none', color:'#a0a8c0', cursor:'pointer', fontSize:12 }}>✏️</button>
                            <button onClick={() => handleDeleteProgram(pg.id)} disabled={busy}
                              style={{ background:'none', border:'none', color:'#ef4444', cursor:'pointer', fontSize:13 }}>×</button>
                          </td>
                        </tr>
                      );
                    })}
                  </tbody>
                </table>
            }
            {/* Goals */}
            {goals.length > 0 && (
              <div>
                <div style={{ fontWeight:700, fontSize:12, color:'#f0c060', marginBottom:10 }}>Goals</div>
                {goals.map(function(g) {
                  var pct     = g.targetPoints > 0 ? Math.min(100, Math.round(g.currentPoints / g.targetPoints * 100)) : 0;
                  var needed  = Math.max(0, g.targetPoints - g.currentPoints);
                  return (
                    <div key={g.id} style={{ background:'#3a2510', borderRadius:8, padding:'10px 12px', marginBottom:8 }}>
                      <div style={{ display:'flex', justifyContent:'space-between', alignItems:'flex-start', marginBottom:6, flexWrap:'wrap', gap:4 }}>
                        <span style={{ fontWeight:700, color:'#f0c060', fontSize:13 }}>{g.goal}</span>
                        <div style={{ display:'flex', alignItems:'center', gap:6 }}>
                          <span style={{ background:'#22c55e', color:'#fff', fontSize:10, fontWeight:700, borderRadius:10, padding:'2px 8px' }}>{pct}% Achieved</span>
                          <span style={{ fontSize:11, color:'#a0a8c0' }}>Need {fmtPts(needed)} more</span>
                          <span style={{ fontSize:11, color:'#f59e0b' }}>Target: {g.targetProgram}</span>
                          <button onClick={() => setModal({ type:'goal', data:g })} disabled={busy}
                            style={{ background:'none', border:'none', color:'#a0a8c0', cursor:'pointer', fontSize:12 }}>✏️</button>
                          <button onClick={() => handleDeleteGoal(g.id)} disabled={busy}
                            style={{ background:'none', border:'none', color:'#ef4444', cursor:'pointer', fontSize:13 }}>×</button>
                        </div>
                      </div>
                      <div style={{ background:'#4a3010', borderRadius:4, height:8, overflow:'hidden' }}>
                        <div style={{ background:'#22c55e', height:'100%', width: pct + '%', borderRadius:4, transition:'width 0.3s' }}></div>
                      </div>
                    </div>
                  );
                })}
              </div>
            )}
          </div>
        </div>
      </div>

      {/* Modals */}
      {modal && modal.type === 'card' && (
        <CardModal mode={modal.data ? 'edit' : 'add'} card={modal.data} busy={busy}
          onSave={handleSaveCard} onClose={() => setModal(null)} />
      )}
      {modal && modal.type === 'detail' && (
        <CardDetailModal card={modal.data} rewards={rewards} perks={perks} busy={busy}
          onClose={() => setModal(null)}
          onAddReward={handleAddReward} onDeleteReward={handleDeleteReward}
          onAddPerk={handleAddPerk} onDeletePerk={handleDeletePerk} onTogglePerk={handleTogglePerk} />
      )}
      {modal && modal.type === 'program' && (
        <LoyaltyModal mode={modal.data ? 'edit' : 'add'} program={modal.data} busy={busy}
          onSave={handleSaveProgram} onClose={() => setModal(null)} />
      )}
      {modal && modal.type === 'goal' && (
        <RewardsGoalModal mode={modal.data ? 'edit' : 'add'} goal={modal.data} programs={programs} busy={busy}
          onSave={handleSaveGoal} onClose={() => setModal(null)} />
      )}
    </div>
  );
}

// ---- Contracts Tab (Issue #146) ---------------------------------------------

function ContractsTab({ apiUrl, apiToken }) {
  const [contracts, setContracts]   = React.useState([]);
  const [loading,   setLoading]     = React.useState(true);
  const [error,     setError]       = React.useState(null);
  const [showAdd,   setShowAdd]     = React.useState(false);
  const [editing,   setEditing]     = React.useState(null);
  const [busy,      setBusy]        = React.useState(false);
  const [actionId,  setActionId]    = React.useState(null); // for log-action modal
  const [actionType,setActionType]  = React.useState(null); // 'Renewed' | 'Terminated'
  const [newEndDate,setNewEndDate]  = React.useState('');

  function load() {
    setLoading(true); setError(null);
    fetch(apiUrl + '?action=get_contracts&token=' + encodeURIComponent(apiToken))
      .then(function(r) { return r.json(); })
      .then(function(d) {
        setContracts((d.contracts || []).sort(function(a, b) {
          var da = a.daysUntil === null || a.daysUntil === undefined ? 9999 : a.daysUntil;
          var db = b.daysUntil === null || b.daysUntil === undefined ? 9999 : b.daysUntil;
          return da - db;
        }));
        setLoading(false);
      })
      .catch(function(e) { setError(e.message); setLoading(false); });
  }

  React.useEffect(function() { load(); }, []);

  function save(fields) {
    setBusy(true);
    var isEdit = !!fields.id;
    var params = new URLSearchParams(Object.assign({ token: apiToken }, fields));
    fetch(apiUrl + '?action=' + (isEdit ? 'update_contract' : 'add_contract') + '&' + params.toString())
      .then(function(r) { return r.json(); })
      .then(function() { setBusy(false); setShowAdd(false); setEditing(null); load(); })
      .catch(function(e) { setBusy(false); alert('Save failed: ' + e.message); });
  }

  function del(id) {
    if (!confirm('Delete this contract?')) return;
    setBusy(true);
    fetch(apiUrl + '?action=delete_contract&token=' + encodeURIComponent(apiToken) + '&id=' + encodeURIComponent(id))
      .then(function(r) { return r.json(); })
      .then(function() { setBusy(false); load(); })
      .catch(function(e) { setBusy(false); alert('Delete failed: ' + e.message); });
  }

  function logAction(id, action, newEnd) {
    setBusy(true);
    var params = 'action=log_contract_action&token=' + encodeURIComponent(apiToken) +
                 '&id=' + encodeURIComponent(id) +
                 '&action=' + encodeURIComponent(action) +
                 (newEnd ? '&newEndDate=' + encodeURIComponent(newEnd) : '');
    fetch(apiUrl + '?' + params)
      .then(function(r) { return r.json(); })
      .then(function() { setBusy(false); setActionId(null); load(); })
      .catch(function(e) { setBusy(false); alert('Action failed: ' + e.message); });
  }

  function alertBadge(status) {
    if (status === 'Critical') return { bg: '#fdecea', color: '#c62828', label: '🔴 Critical' };
    if (status === 'Warning')  return { bg: '#fff8e1', color: '#e65100', label: '🟡 Notice' };
    if (status === 'Expired')  return { bg: '#fce4ec', color: '#880e4f', label: '⚠ Expired' };
    return null;
  }

  var CATEGORIES = ['Housing','Insurance','Auto','Services','Professional','Financial','Other'];
  var byCategory = {};
  contracts.forEach(function(c) {
    var cat = c.category || 'Other';
    if (!byCategory[cat]) byCategory[cat] = [];
    byCategory[cat].push(c);
  });

  if (loading) return React.createElement('div', { style: { padding: 32, color: '#6b7fa8', fontSize: 14 } }, 'Loading contracts…');
  if (error)   return React.createElement('div', { style: { padding: 32, color: '#ef5350', fontSize: 14 } }, 'Error: ' + error);

  var alertCount = contracts.filter(function(c) { return c.alertStatus === 'Critical' || c.alertStatus === 'Warning' || c.alertStatus === 'Expired'; }).length;

  return (
    <div>
      {/* Header row */}
      <div style={{ display: 'flex', alignItems: 'center', justifyContent: 'space-between', marginBottom: 16 }}>
        <div style={{ fontSize: 13, color: '#4d6080' }}>
          {contracts.length} contract{contracts.length !== 1 ? 's' : ''}
          {alertCount > 0 && <span style={{ marginLeft: 8, background: '#fdecea', color: '#c62828', borderRadius: 4, padding: '2px 8px', fontSize: 12, fontWeight: 700 }}>{alertCount} need attention</span>}
        </div>
        <button className="btn btn-small" onClick={function() { setEditing(null); setShowAdd(true); }} disabled={busy}>+ Add Contract</button>
      </div>

      {contracts.length === 0 && (
        <div className="empty-state">
          <div style={{ fontSize: 32, marginBottom: 12 }}>📋</div>
          <div>No contracts yet. Add your first one.</div>
        </div>
      )}

      {/* Cards grouped by category */}
      {Object.keys(byCategory).sort().map(function(cat) {
        return (
          <div key={cat} style={{ marginBottom: 24 }}>
            <div style={{ fontSize: 11, fontWeight: 700, color: '#0d1b3e', letterSpacing: '0.08em', textTransform: 'uppercase', marginBottom: 10 }}>{cat}</div>
            {byCategory[cat].map(function(c) {
              var badge = alertBadge(c.alertStatus);
              var expired = c.status !== 'Active';
              return (
                <div key={c.id} className="bento-card" style={{ cursor: 'default', marginBottom: 10, opacity: expired ? 0.6 : 1 }}>
                  <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'flex-start', flexWrap: 'wrap', gap: 8 }}>
                    <div style={{ flex: 1 }}>
                      <div style={{ fontWeight: 600, fontSize: 14, color: '#c9a84c', marginBottom: 3 }}>
                        {c.name}
                        {badge && <span style={{ marginLeft: 8, background: badge.bg, color: badge.color, fontSize: 11, fontWeight: 700, padding: '2px 7px', borderRadius: 4 }}>{badge.label}</span>}
                        {expired && <span style={{ marginLeft: 8, background: '#e8eaf6', color: '#5c6bc0', fontSize: 11, padding: '2px 7px', borderRadius: 4 }}>{c.status}</span>}
                      </div>
                      {c.counterparty && <div style={{ fontSize: 12, color: '#6b7fa8' }}>{c.counterparty}</div>}
                      <div style={{ fontSize: 12, color: '#4d6080', marginTop: 4 }}>
                        {c.endDate && <span>Expires: <strong>{c.endDate}</strong>{c.daysUntil !== null && c.daysUntil >= 0 ? ' (' + c.daysUntil + 'd)' : c.daysUntil < 0 ? ' (expired)' : ''}</span>}
                        {c.autoRenews === 'Yes' && <span style={{ marginLeft: 10, color: '#43a047' }}>↻ auto-renews</span>}
                        {c.autoRenews === 'No'  && <span style={{ marginLeft: 10, color: '#e65100' }}>✗ no auto-renewal</span>}
                        {c.monthlyCost ? <span style={{ marginLeft: 10 }}>${c.monthlyCost}/mo</span> : null}
                      </div>
                      {c.notes && <div style={{ fontSize: 12, color: '#4d6080', marginTop: 3, fontStyle: 'italic' }}>{c.notes}</div>}
                    </div>
                    <div style={{ display: 'flex', gap: 6, flexShrink: 0 }}>
                      {c.docLink && <a href={c.docLink} target="_blank" rel="noopener noreferrer" style={{ fontSize: 11, color: '#4d6080', textDecoration: 'none', border: '1px solid #2a3f6f', borderRadius: 4, padding: '3px 8px' }}>📄 Doc</a>}
                      {c.status === 'Active' && <button className="btn btn-small" style={{ fontSize: 11 }} onClick={function() { setActionId(c.id); setActionType('Renewed'); setNewEndDate(''); }} disabled={busy}>Log Renewal</button>}
                      {c.status === 'Active' && <button className="btn btn-small" style={{ fontSize: 11, background: 'transparent', border: '1px solid #ef5350', color: '#ef5350' }} onClick={function() { logAction(c.id, 'Terminated', ''); }} disabled={busy}>Terminate</button>}
                      <button className="btn btn-small" style={{ fontSize: 11 }} onClick={function() { setEditing(c); setShowAdd(true); }} disabled={busy}>Edit</button>
                      <button className="btn btn-small" style={{ fontSize: 11, background: 'transparent', border: '1px solid #3d5fa0', color: '#8b9dc3' }} onClick={function() { del(c.id); }} disabled={busy}>Delete</button>
                    </div>
                  </div>
                </div>
              );
            })}
          </div>
        );
      })}

      {/* Add/Edit Modal */}
      {showAdd && (
        <ContractModal
          contract={editing}
          categories={CATEGORIES}
          busy={busy}
          onClose={function() { setShowAdd(false); setEditing(null); }}
          onSave={save}
        />
      )}

      {/* Log Renewal Modal */}
      {actionId && actionType === 'Renewed' && (
        <div style={{ position: 'fixed', inset: 0, background: 'rgba(0,0,0,0.55)', zIndex: 1000, display: 'flex', alignItems: 'center', justifyContent: 'center' }}>
          <div style={{ background: '#0d1b3e', borderRadius: 10, padding: 28, width: 360, border: '1px solid #2a3f6f' }}>
            <div style={{ fontWeight: 700, fontSize: 15, color: '#c9a84c', marginBottom: 16 }}>Log Renewal</div>
            <label style={{ fontSize: 12, color: '#8b9dc3', display: 'block', marginBottom: 4 }}>New End Date (leave blank to keep existing)</label>
            <input type="date" value={newEndDate} onChange={function(ev) { setNewEndDate(ev.target.value); }}
              style={{ width: '100%', padding: '6px 10px', borderRadius: 5, border: '1px solid #2a3f6f', background: '#06112a', color: '#c9d9ff', marginBottom: 16 }} />
            <div style={{ display: 'flex', gap: 8, justifyContent: 'flex-end' }}>
              <button className="btn btn-small" style={{ background: 'transparent', border: '1px solid #3d5fa0', color: '#8b9dc3' }} onClick={function() { setActionId(null); }}>Cancel</button>
              <button className="btn btn-small" onClick={function() { logAction(actionId, 'Renewed', newEndDate); }} disabled={busy}>Confirm Renewal</button>
            </div>
          </div>
        </div>
      )}
    </div>
  );
}

function ContractModal({ contract, categories, busy, onClose, onSave }) {
  var isEdit = !!contract;
  const [form, setForm] = React.useState(contract ? {
    id:           contract.id,
    name:         contract.name         || '',
    category:     contract.category     || '',
    counterparty: contract.counterparty || '',
    startDate:    contract.startDate    || '',
    endDate:      contract.endDate      || '',
    autoRenews:   contract.autoRenews   || 'Unknown',
    noticeDays:   String(contract.noticeDays || 30),
    monthlyCost:  contract.monthlyCost  !== null ? String(contract.monthlyCost) : '',
    status:       contract.status       || 'Active',
    docLink:      contract.docLink      || '',
    notes:        contract.notes        || '',
  } : {
    id: '', name: '', category: '', counterparty: '', startDate: '', endDate: '',
    autoRenews: 'Unknown', noticeDays: '30', monthlyCost: '', status: 'Active', docLink: '', notes: ''
  });

  function field(label, key, type, opts) {
    var inp;
    if (type === 'select') {
      inp = React.createElement('select', {
        value: form[key], onChange: function(ev) { setForm(Object.assign({}, form, { [key]: ev.target.value })); },
        style: { width: '100%', padding: '6px 10px', borderRadius: 5, border: '1px solid #2a3f6f', background: '#06112a', color: '#c9d9ff', fontSize: 13 }
      }, (opts || []).map(function(o) { return React.createElement('option', { key: o, value: o }, o); }));
    } else {
      inp = React.createElement('input', {
        type: type || 'text', value: form[key],
        onChange: function(ev) { setForm(Object.assign({}, form, { [key]: ev.target.value })); },
        style: { width: '100%', padding: '6px 10px', borderRadius: 5, border: '1px solid #2a3f6f', background: '#06112a', color: '#c9d9ff', fontSize: 13 }
      });
    }
    return (
      <div key={key} style={{ marginBottom: 12 }}>
        <label style={{ fontSize: 11, color: '#8b9dc3', display: 'block', marginBottom: 3 }}>{label}</label>
        {inp}
      </div>
    );
  }

  return (
    <div style={{ position: 'fixed', inset: 0, background: 'rgba(0,0,0,0.55)', zIndex: 1000, display: 'flex', alignItems: 'center', justifyContent: 'center' }}>
      <div style={{ background: '#0d1b3e', borderRadius: 10, padding: 28, width: 480, maxHeight: '90vh', overflowY: 'auto', border: '1px solid #2a3f6f' }}>
        <div style={{ fontWeight: 700, fontSize: 15, color: '#c9a84c', marginBottom: 20 }}>{isEdit ? 'Edit Contract' : 'Add Contract'}</div>
        {field('Name *', 'name')}
        {field('Category', 'category', 'select', categories)}
        {field('Counterparty (landlord, insurer, etc.)', 'counterparty')}
        <div style={{ display: 'grid', gridTemplateColumns: '1fr 1fr', gap: 12 }}>
          {field('Start Date', 'startDate', 'date')}
          {field('End Date', 'endDate', 'date')}
        </div>
        <div style={{ display: 'grid', gridTemplateColumns: '1fr 1fr 1fr', gap: 12 }}>
          {field('Auto-Renews', 'autoRenews', 'select', ['Yes','No','Unknown'])}
          {field('Notice Period (days)', 'noticeDays', 'number')}
          {field('Monthly Cost ($)', 'monthlyCost', 'number')}
        </div>
        {isEdit && field('Status', 'status', 'select', ['Active','Expired','Terminated','Renewed'])}
        {field('Document Link (Google Drive)', 'docLink')}
        {field('Notes', 'notes')}
        <div style={{ display: 'flex', gap: 8, justifyContent: 'flex-end', marginTop: 8 }}>
          <button className="btn btn-small" style={{ background: 'transparent', border: '1px solid #3d5fa0', color: '#8b9dc3' }} onClick={onClose}>Cancel</button>
          <button className="btn btn-small" onClick={function() { if (!form.name.trim()) return alert('Name is required'); onSave(form); }} disabled={busy}>
            {isEdit ? 'Save Changes' : 'Add Contract'}
          </button>
        </div>
      </div>
    </div>
  );
}

function FinancesTab({ summaries, budget, budgetLoading, bills, billsLoading, onBillToggle,
                       calBills, onCalBillToggle, onAddBill, onSyncTransactions, txList,
                       busy, apiUrl, apiToken,
                       financialGoals, goalsLoading, onLoadGoals, onAddGoal, onUpdateGoal, onDeleteGoal }) {
  const [sub, setSub]           = React.useState('overview');
  const [showAddBill, setShowAddBill] = React.useState(false);
  const hasTxData = summaries.some(s => s.source === '[AUTO] Transactions');
  // Count sheet bills that have a transaction match but aren't yet paid this month
  const syncCount = ((bills && bills.bills) || []).filter(function(b) { return b.txMatch && !b.paid; }).length;

  // Format a cell value as currency (numbers → $X,XXX) or dash (null/empty)
  function fmtMoney(v) {
    if (v === null || v === undefined || v === '') return '—';
    if (typeof v === 'number') return '$' + Math.round(v).toLocaleString();
    return String(v);
  }

  const budgetRows    = (budget && budget.rows)    || [];
  const budgetReady   = budget !== null;
  const budgetMissing = budget && !budget.configured;

  const subTabs = [
    { id: 'overview',   label: '💸 Overview' },
    { id: 'budget',     label: '📊 Budget' },
    { id: 'bills',      label: '🧾 Bills' },
    { id: 'cashflow',   label: '💰 Cashflow' },
    { id: 'cards',      label: '💳 Cards' },
    { id: 'contracts',  label: '📋 Contracts' },
    { id: 'goals',      label: '🎯 Goals' },

  return (
    <div>
      {/* Sub-tab pills */}
      <div className="subtab-row">
        {subTabs.map(s => (
          <button key={s.id} className={`subtab-btn${sub === s.id ? ' active' : ''}`}
            onClick={() => setSub(s.id)}>{s.label}</button>
        ))}
      </div>

      {/* ── Overview: Bento Dashboard (Coming Soon) ─────── */}
      {sub === 'overview' && (
        <div className="empty-state" style={{ paddingTop: 48 }}>
          <div style={{ fontSize: 40, marginBottom: 12 }}>🚧</div>
          <div style={{ fontWeight: 600, fontSize: 15, color: '#a0b0c8', marginBottom: 6 }}>Coming Soon</div>
          <div style={{ fontSize: 13, color: '#4d6080' }}>The Finance Overview dashboard is on its way.</div>
        </div>
      )}

      {/* ── Budget: Spending Chart + Monthly Budget ─────── */}
      {sub === 'budget' && (
        <div>
          {hasTxData
            ? <SpendingChart summaries={summaries} budget={budget} />
            : (
              <div className="bento-card" style={{ cursor: 'default', textAlign: 'center' }}>
                <div style={{ fontSize: 13, color: '#4d6080', padding: '12px 0' }}>
                  💸 No transaction data yet — connect your Transactions sheet in Config.
                </div>
              </div>
            )
          }

          <div className="bento-card" style={{ marginTop: 16, cursor: 'default' }}>
            <div className="bento-card-title" style={{ marginBottom: 14 }}>📊 Monthly Budget</div>

            {budgetLoading && (
              <div style={{ fontSize: 13, color: '#6b7fa8', padding: '8px 0' }}>Loading budget…</div>
            )}

            {!budgetLoading && budgetMissing && (
              <div style={{ fontSize: 13, color: '#4d6080' }}>
                SAT_SHEET_ID not configured — set it in Apps Script → Script Properties.
              </div>
            )}

            {!budgetLoading && budgetReady && !budgetMissing && budgetRows.length === 0 && (
              <div style={{ fontSize: 13, color: '#4d6080' }}>No rows found in the Budget tab.</div>
            )}

            {!budgetLoading && budgetRows.length > 0 && (
              <table style={{ width: '100%', borderCollapse: 'collapse', fontSize: 13 }}>
                <tbody>
                  {budgetRows.map((r, i) => {
                    const isHeader = r.value === null;

                    return isHeader
                      ? (
                        <tr key={i}>
                          <td colSpan={hasSplit ? 4 : 2} style={{

                            paddingBottom: 4,
                            fontWeight: 700,

                            letterSpacing: '0.06em',

                      )

              + Add Bill

          </div>
          <BillTrackerView
            bills={bills}
            calBills={calBills}
            billsLoading={billsLoading}
            txList={txList || []}
            onToggle={onBillToggle}
            onCalToggle={onCalBillToggle}
          />
          {showAddBill && (
            <AddBillModal
              busy={busy}
              onClose={function() { setShowAddBill(false); }}
              onSave={function(fields) {
                if (onAddBill) onAddBill(fields);

      {/* ── Cashflow ─────────────────────────────────────── */}
      {sub === 'cashflow' && (

      {/* ── Cards: Credit Card Hub ───────────────────────── */}
      {sub === 'cards' && (
        <CardsTab apiUrl={apiUrl} apiToken={apiToken} />

      {/* ── Contracts: Active Contract & Agreement Tracker ── */}
      {sub === 'contracts' && (
        <ContractsTab apiUrl={apiUrl} apiToken={apiToken} />

      {/* ── Goals: Financial Goals + What-If Planner ─────── */}
      {sub === 'goals' && (
        <FinancialGoalsTab
          goals={financialGoals}
          goalsLoading={goalsLoading}
          busy={busy}
          onLoad={onLoadGoals}
          onAdd={onAddGoal}
          onUpdate={onUpdateGoal}
          onDelete={onDeleteGoal}
          apiUrl={apiUrl}
          apiToken={apiToken}
        />
      )}

    </div>
  );
}

// ---- Morning Routine checklist (Issue #101) ---------------------------------

function MorningRoutineTab({ apiUrl, apiToken }) {
  // All state is server-backed (Google Sheet) — no localStorage.
  // Checked state is per-item from the sheet, reset nightly by nightlyRun().
  const [items,     setItems]     = React.useState([]);
  const [loading,   setLoading]   = React.useState(true);
  const [apiError,  setApiError]  = React.useState('');
  const [newItem,   setNewItem]   = React.useState('');
  const [generating, setGenerating] = React.useState(false);
  const [genError,  setGenError]  = React.useState('');

  React.useEffect(() => { loadItems(); }, []);

  async function loadItems() {
    setLoading(true);
    setApiError('');
    try {
      const data = await apiGet(apiUrl, apiToken, { action: 'morning_routine' });
      setItems(data.items || []);
    } catch (err) {
      setApiError('Could not load routine: ' + err.message);
    } finally {
      setLoading(false);
    }
  }

  async function toggleCheck(id) {
    // Optimistic update: flip locally immediately, sync to server in background
    setItems(prev => prev.map(i => i.id === id ? { ...i, checked: !i.checked } : i));
    try {
      await apiGet(apiUrl, apiToken, { action: 'morning_routine_toggle', id });
    } catch (err) {
      // Revert on failure
      setItems(prev => prev.map(i => i.id === id ? { ...i, checked: !i.checked } : i));
      setApiError('Toggle failed: ' + err.message);
    }
  }

  async function addItem(e) {
    e.preventDefault();
    if (!newItem.trim()) return;
    try {
      await apiGet(apiUrl, apiToken, { action: 'morning_routine_add', text: newItem.trim(), source: 'manual' });
      setNewItem('');
      await loadItems();
    } catch (err) { setApiError('Add failed: ' + err.message); }
  }

  async function deleteItem(id) {
    try {
      await apiGet(apiUrl, apiToken, { action: 'morning_routine_delete', id });
      await loadItems();
    } catch (err) { setApiError('Delete failed: ' + err.message); }
  }

  async function moveItem(index, dir) {
    const id = items[index] && items[index].id;
    if (!id) return;
    try {
      await apiGet(apiUrl, apiToken, { action: 'morning_routine_move', id, dir });
      await loadItems();
    } catch (err) { setApiError('Move failed: ' + err.message); }
  }

  async function generateRoutine() {
    setGenerating(true);
    setGenError('');
    try {
      // Server now writes to sheet and returns full updated item list
      const data = await apiGet(apiUrl, apiToken, { action: 'generate_morning_routine' });
      if (data.ok && Array.isArray(data.items)) setItems(data.items);
    } catch (err) { setGenError('Could not generate routine: ' + err.message); }
    setGenerating(false);
  }

  const doneCount = items.filter(i => i.checked).length;
  const pct = items.length > 0 ? Math.round((doneCount / items.length) * 100) : 0;

  if (loading) return (
    <div style={{ color: '#a0b0c8', fontSize: 14, paddingTop: 32, textAlign: 'center' }}>
      ⏳ Loading morning routine…
    </div>
  );

  return (
    <div style={{ maxWidth: 640 }}>
      {/* Header */}
      <div style={{ display: 'flex', alignItems: 'center', justifyContent: 'space-between', marginBottom: 16, flexWrap: 'wrap', gap: 10 }}>
        <div>
          <span style={{ fontWeight: 700, color: '#e8eaed', fontSize: 14 }}>{doneCount}/{items.length} completed today</span>
          {items.length > 0 && (
            <div style={{ width: 180, height: 5, background: '#1e2a3a', borderRadius: 3, marginTop: 6 }}>
              <div style={{ width: pct + '%', height: '100%', background: '#4ade80', borderRadius: 3, transition: 'width 0.3s' }} />
            </div>
          )}
        </div>
        <button disabled={generating} onClick={generateRoutine}
          style={{ padding: '7px 16px', borderRadius: 6, border: 'none',
                   cursor: generating ? 'not-allowed' : 'pointer',
                   background: generating ? '#1e2a3a' : '#8ab4f8',
                   color: generating ? '#5f6368' : '#0d1117',
                   fontWeight: 600, fontSize: 13, whiteSpace: 'nowrap' }}>
          {generating ? '⏳ Generating…' : '✨ Generate with VERA'}
        </button>
      </div>

      {genError && <div style={{ color: '#e57373', fontSize: 12, marginBottom: 10 }}>{genError}</div>}
      {apiError && (
        <div style={{ color: '#e57373', fontSize: 12, marginBottom: 10, display: 'flex', alignItems: 'center', gap: 8 }}>
          {apiError}
          <button onClick={loadItems} style={{ background: 'none', border: '1px solid #e57373', borderRadius: 4,
            color: '#e57373', fontSize: 11, padding: '2px 8px', cursor: 'pointer' }}>Retry</button>
        </div>
      )}

      {/* Checklist */}
      {items.length === 0 ? (
        <div className="empty-state" style={{ paddingTop: 32 }}>
          <div style={{ fontSize: 32, marginBottom: 10 }}>☀️</div>
          <div style={{ color: '#a0b0c8', fontSize: 14, marginBottom: 6 }}>No routine items yet</div>
          <div style={{ color: '#4d6080', fontSize: 12 }}>Add items below or click "Generate with VERA" to build your morning routine.</div>
        </div>
      ) : (
        <div style={{ display: 'flex', flexDirection: 'column', gap: 6, marginBottom: 16 }}>
          {items.map((item, idx) => {
            const checked = item.checked;
            return (
              <div key={item.id} style={{
                display: 'flex', alignItems: 'center', gap: 10,
                background: checked ? '#0f1f12' : '#1e2a3a',
                borderRadius: 8, padding: '10px 12px',
                border: '1px solid ' + (checked ? '#2d6a4f' : '#2a3a50'),
                transition: 'all 0.15s',
              }}>
                <input type="checkbox" checked={checked} onChange={() => toggleCheck(item.id)}
                  style={{ width: 16, height: 16, accentColor: '#4ade80', flexShrink: 0, cursor: 'pointer' }} />
                <span style={{ flex: 1, fontSize: 14, color: checked ? '#5a7a60' : '#e8eaed',
                               textDecoration: checked ? 'line-through' : 'none', transition: 'all 0.15s' }}>
                  {item.text}
                </span>
                {item.source === 'vera' && (
                  <span style={{ fontSize: 10, padding: '1px 6px', borderRadius: 8,
                                 background: '#1a3050', color: '#8ab4f8', flexShrink: 0 }}>VERA</span>
                )}
                <div style={{ display: 'flex', gap: 2, flexShrink: 0 }}>
                  <button onClick={() => moveItem(idx, -1)} disabled={idx === 0} title="Move up"
                    style={{ background: 'none', border: 'none', padding: '0 3px', fontSize: 13,
                             cursor: idx === 0 ? 'default' : 'pointer',
                             color: idx === 0 ? '#2a3a50' : '#5f6368' }}>↑</button>
                  <button onClick={() => moveItem(idx, 1)} disabled={idx === items.length - 1} title="Move down"
                    style={{ background: 'none', border: 'none', padding: '0 3px', fontSize: 13,
                             cursor: idx === items.length - 1 ? 'default' : 'pointer',
                             color: idx === items.length - 1 ? '#2a3a50' : '#5f6368' }}>↓</button>
                  <button onClick={() => deleteItem(item.id)} title="Remove"
                    style={{ background: 'none', border: 'none', padding: '0 3px', fontSize: 13,
                             cursor: 'pointer', color: '#5f6368' }}>✕</button>
                </div>
              </div>
            );
          })}
        </div>
      )}

      {/* Add item form */}
      <form onSubmit={addItem} style={{ display: 'flex', gap: 8 }}>
        <input value={newItem} onChange={e => setNewItem(e.target.value)}
          placeholder="Add a routine item…"
          style={{ flex: 1, background: '#0d1117', border: '1px solid #2a3a50', borderRadius: 6,
                   color: '#e8eaed', padding: '8px 10px', fontSize: 13 }} />
        <button type="submit" disabled={!newItem.trim()}
          style={{ padding: '8px 16px', borderRadius: 6, border: 'none', fontWeight: 600, fontSize: 13,
                   background: newItem.trim() ? '#8ab4f8' : '#1e2a3a',
                   color: newItem.trim() ? '#0d1117' : '#5f6368',
                   cursor: newItem.trim() ? 'pointer' : 'default' }}>
          + Add
        </button>
      </form>
    </div>
  );
}

function GymLogTab({ apiUrl, apiToken }) {
  const [sessions, setSessions] = React.useState(null); // null = loading
  const [busy,     setBusy]     = React.useState(false);
  const [scanning, setScanning] = React.useState(false);
  const [scanMsg,  setScanMsg]  = React.useState('');

  React.useEffect(() => { load(); }, []);

  async function load() {
    setSessions(null);
    try {
      const data = await apiGet(apiUrl, apiToken, { action: 'gym_log' });
      setSessions((data.sessions || []).slice().reverse()); // newest first
    } catch (e) { setSessions([]); }
  }

  async function respond(id, action) {
    setBusy(true);
    try {
      await apiAction(apiUrl, apiToken, action, { id });
      await load();
    } catch (e) { alert('Error: ' + e.message); }
    setBusy(false);
  }

  async function scanPast() {
    setScanning(true); setScanMsg('');
    try {
      const data = await apiGet(apiUrl, apiToken, { action: 'gym_backfill', days: 30 });
      setScanMsg('✓ ' + data.added + ' new session(s) found, ' + data.skipped + ' already existed.');
      if (data.added > 0) await load();
    } catch (e) { setScanMsg('⚠ Scan failed: ' + e.message); }
    setScanning(false);
  }

  if (sessions === null) return <div className="loading-text">Loading gym log…</div>;

  const pending = sessions.filter(s => !s.attended);
  const history = sessions.filter(s =>  s.attended);

  function fmtSessionDate(dateStr) {
    if (!dateStr) return '';
    const d = new Date(dateStr + 'T12:00:00');
    if (isNaN(d)) return dateStr;
    return d.toLocaleDateString('en-US', { weekday: 'short', month: 'short', day: 'numeric', year: 'numeric' });
  }

  // Group history sessions into labelled buckets
  function getGroupLabel(dateStr) {
    const now   = new Date();
    const today = new Date(now.getFullYear(), now.getMonth(), now.getDate());
    const d     = new Date(dateStr + 'T12:00:00'); // noon to avoid DST edge
    const diffDays = Math.floor((today - d) / 86400000);
    // ISO week helper
    function isoWeek(dt) {
      const tmp = new Date(Date.UTC(dt.getFullYear(), dt.getMonth(), dt.getDate()));
      tmp.setUTCDate(tmp.getUTCDate() + 4 - (tmp.getUTCDay() || 7));
      const y = new Date(Date.UTC(tmp.getUTCFullYear(), 0, 1));
      return Math.ceil(((tmp - y) / 86400000 + 1) / 7);
    }
    const thisWeek = isoWeek(today);
    const sessWeek = isoWeek(d);
    const weekDiff = thisWeek - sessWeek + (d.getFullYear() < today.getFullYear() ? 52 : 0);
    if (weekDiff === 0) return 'This Week';
    if (weekDiff === 1) return 'Last Week';
    if (weekDiff === 2) return '2 Weeks Ago';
    if (weekDiff === 3) return '3 Weeks Ago';
    // Fall back to month name
    const months = ['January','February','March','April','May','June','July','August','September','October','November','December'];
    const label = months[d.getMonth()];
    return d.getFullYear() === today.getFullYear() ? label : label + ' ' + d.getFullYear();
  }

  function buildGroups(list) {
    const map = {}, order = [];
    list.forEach(function(s) {
      const label = getGroupLabel(s.date);
      if (!map[label]) { map[label] = []; order.push(label); }
      map[label].push(s);
    });
    return order.map(label => ({ label, sessions: map[label] }));
  }
  const historyGroups = buildGroups(history);
  const pendingGroups = buildGroups(pending);

  return (
    <div style={{ display: 'flex', flexDirection: 'column', gap: 24 }}>

      {/* Scan past sessions */}
      <div style={{ display: 'flex', alignItems: 'center', gap: 12 }}>
        <button
          disabled={scanning || busy}
          onClick={scanPast}
          style={{
            background: 'rgba(92,158,255,0.1)', border: '1px solid rgba(92,158,255,0.3)',
            color: '#5c9eff', borderRadius: 8, padding: '7px 16px',
            fontSize: 12, fontWeight: 600, cursor: 'pointer',
          }}>
          {scanning ? '⏳ Scanning…' : '🔍 Scan Past 30 Days'}
        </button>
        {scanMsg && (
          <span style={{ fontSize: 12, color: scanMsg.startsWith('✓') ? '#43a047' : '#e57373' }}>
            {scanMsg}
          </span>
        )}
      </div>

      {/* Pending check-ins — grouped */}
      {pending.length > 0 && (
        <div>
          <div style={{ fontSize: 12, fontWeight: 700, color: '#8a9abf',
                        textTransform: 'uppercase', letterSpacing: 1, marginBottom: 14 }}>
            Pending Check-ins ({pending.length})
          </div>
          <div style={{ display: 'flex', flexDirection: 'column', gap: 20 }}>
            {pendingGroups.map(group => (
              <div key={group.label}>
                <div style={{ fontSize: 11, fontWeight: 700, color: '#4d6080', textTransform: 'uppercase',
                              letterSpacing: '0.08em', marginBottom: 8 }}>
                  {group.label}
                </div>
                <div style={{ display: 'flex', flexDirection: 'column', gap: 6 }}>
                  {group.sessions.map(s => (
                    <div key={s.id} style={{
                      display: 'flex', alignItems: 'center', gap: 12,
                      padding: '12px 16px', borderRadius: 8,
                      background: '#0d1b3e', border: '1px solid #c9a84c',
                    }}>
                      <div style={{ flex: 1 }}>
                        <div style={{ fontWeight: 600, fontSize: 14, color: '#e8eaed' }}>{s.title}</div>
                        <div style={{ fontSize: 12, color: '#8a9abf', marginTop: 2 }}>{fmtSessionDate(s.date)}</div>
                      </div>
                      <button disabled={busy} onClick={() => respond(s.id, 'gym_attend')}
                        style={{ background: 'rgba(67,160,71,0.15)', border: '1px solid #43a047',
                                 color: '#43a047', borderRadius: 6, padding: '6px 14px',
                                 fontSize: 13, fontWeight: 700, cursor: 'pointer' }}>
                        ✓ Yes
                      </button>
                      <button disabled={busy} onClick={() => respond(s.id, 'gym_skip')}
                        style={{ background: 'rgba(229,57,53,0.1)', border: '1px solid #e53935',
                                 color: '#e53935', borderRadius: 6, padding: '6px 14px',
                                 fontSize: 13, fontWeight: 700, cursor: 'pointer' }}>
                        ✗ No
                      </button>
                    </div>
                  ))}
                </div>
              </div>
            ))}
          </div>
        </div>
      )}

      {/* History */}
      <div>
        <div style={{ fontSize: 12, fontWeight: 700, color: '#8a9abf',
                      textTransform: 'uppercase', letterSpacing: 1, marginBottom: 10 }}>
          History
        </div>
        {pending.length === 0 && history.length === 0 ? (
          <div className="empty-state" style={{ padding: 32 }}>
            <div style={{ fontSize: 32, marginBottom: 8 }}>🏋️</div>
            <div>No gym sessions logged yet.</div>
            <div style={{ fontSize: 12, color: '#6b7fa8', marginTop: 6 }}>
              Add <code style={{ background: '#13244d', padding: '1px 5px', borderRadius: 3 }}>EXERCISE</code> to
              a Google Calendar event description — VERA will prompt you after each session.
            </div>
          </div>
        ) : history.length === 0 ? (
          <div style={{ fontSize: 13, color: '#4d6080', padding: '12px 0' }}>No answered sessions yet.</div>
        ) : (
          <div style={{ display: 'flex', flexDirection: 'column', gap: 20 }}>
            {historyGroups.map(group => (
              <div key={group.label}>
                <div style={{ fontSize: 11, fontWeight: 700, color: '#4d6080', textTransform: 'uppercase',
                              letterSpacing: '0.08em', marginBottom: 8 }}>
                  {group.label}
                  <span style={{ fontWeight: 400, marginLeft: 6, color: '#3a4860' }}>
                    ({group.sessions.filter(s => s.attended === 'Yes').length}/{group.sessions.length})
                  </span>
                </div>
                <div style={{ display: 'flex', flexDirection: 'column', gap: 5 }}>
                  {group.sessions.map(s => (
                    <div key={s.id} style={{
                      display: 'flex', alignItems: 'center', gap: 12,
                      padding: '10px 16px', borderRadius: 8,
                      background: s.attended === 'Yes' ? 'rgba(67,160,71,0.07)' : 'rgba(229,57,53,0.07)',
                      border: '1px solid ' + (s.attended === 'Yes' ? 'rgba(67,160,71,0.2)' : 'rgba(229,57,53,0.2)'),
                    }}>
                      <span style={{ fontSize: 16 }}>{s.attended === 'Yes' ? '✅' : '❌'}</span>
                      <div style={{ flex: 1 }}>
                        <span style={{ fontSize: 14, color: '#dde1f0' }}>{s.title}</span>
                        <span style={{ fontSize: 12, color: '#6b7fa8', marginLeft: 8 }}>{fmtSessionDate(s.date)}</span>
                      </div>
                      <span style={{
                        fontSize: 11, fontWeight: 700, padding: '2px 8px', borderRadius: 10,
                        background: s.attended === 'Yes' ? 'rgba(67,160,71,0.2)' : 'rgba(229,57,53,0.15)',
                        color: s.attended === 'Yes' ? '#43a047' : '#e57373',
                      }}>{s.attended}</span>
                    </div>
                  ))}
                </div>
              </div>
            ))}
          </div>
        )}
      </div>

    </div>
  );
}

function refillBadge(refillDate) {
  if (!refillDate) return { label: 'No refill date', color: '#6b7280' };
  var today = new Date(); today.setHours(0,0,0,0);
  var d = new Date(refillDate); d.setHours(0,0,0,0);
  var days = Math.round((d - today) / 86400000);
  if (days < 0)  return { label: 'Refill overdue',       color: '#ef4444' };
  if (days <= 7) return { label: 'Refill in ' + days + ' days ⚠', color: '#ef4444' };
  if (days <= 14) return { label: 'Refill in ' + days + ' days', color: '#f59e0b' };
  return { label: 'Refill in ' + days + ' days', color: '#22c55e' };
}

function PrescriptionsTab({ apiUrl, apiToken }) {
  const [prescriptions, setPrescriptions] = React.useState([]);
  const [loading, setLoading]             = React.useState(false);
  const [busy, setBusy]                   = React.useState(false);
  const [error, setError]                 = React.useState('');
  const [modal, setModal]                 = React.useState(null); // null | { mode:'add'|'edit', rx, person }

  async function load() {
    setLoading(true); setError('');
    try {
      const res = await apiGet(apiUrl, apiToken, { action: 'prescriptions' });
      setPrescriptions(res.prescriptions || []);
    } catch (err) { setError('Could not load prescriptions: ' + err.message); }
    setLoading(false);
  }

  React.useEffect(() => { load(); }, []);

  // Derive unique persons in stable order: Ahmed first, Victoria second, others after
  const persons = React.useMemo(() => {
    const seen = new Set();
    const order = [];
    ['Ahmed', 'Victoria'].forEach(p => { seen.add(p); order.push(p); });
    prescriptions.forEach(rx => { if (!seen.has(rx.person)) { seen.add(rx.person); order.push(rx.person); } });
    return order;
  }, [prescriptions]);

  async function handleSave(form) {
    setBusy(true);
    try {
      if (modal.mode === 'edit') {
        await apiGet(apiUrl, apiToken, Object.assign({ action: 'update_prescription' }, form, { id: modal.rx.id }));
      } else {
        await apiGet(apiUrl, apiToken, Object.assign({ action: 'add_prescription' }, form));
      }
      setModal(null);
      await load();
    } catch (err) { setError('Save failed: ' + err.message); }
    setBusy(false);
  }

  async function handleDelete(id) {
    if (!confirm('Delete this prescription?')) return;
    setBusy(true);
    try {
      await apiGet(apiUrl, apiToken, { action: 'delete_prescription', id });
      await load();
    } catch (err) { setError('Delete failed: ' + err.message); }
    setBusy(false);
  }

  async function handleToggleActive(id, newActive) {
    setBusy(true);
    try {
      await apiGet(apiUrl, apiToken, { action: 'update_prescription', id: id, active: newActive });
      await load();
    } catch (err) { setError('Update failed: ' + err.message); }
    setBusy(false);
  }

  if (loading) return <div style={{ color: '#a0a8c0', padding: 24, textAlign: 'center' }}>Loading prescriptions…</div>;

  return (
    <div style={{ padding: '4px 0' }}>
      {error && <div style={{ color: '#ef4444', marginBottom: 12, fontSize: 13 }}>{error}</div>}
      <div style={{ display: 'grid', gridTemplateColumns: 'repeat(auto-fit, minmax(280px, 1fr))', gap: 20 }}>
        {persons.map(person => (
          <PersonPanel
            key={person}
            person={person}
            prescriptions={prescriptions.filter(rx => rx.person === person)}
            busy={busy}
            onAdd={p => setModal({ mode: 'add', rx: null, person: p })}
            onEdit={rx => setModal({ mode: 'edit', rx, person: rx.person })}
            onDelete={handleDelete}
            onToggleActive={handleToggleActive}
          />
        ))}
      </div>
      {modal && (
        <PrescriptionModal
          mode={modal.mode}
          rx={modal.rx}
          person={modal.person}
          busy={busy}
          onSave={handleSave}
          onClose={() => setModal(null)}
        />
      )}
    </div>
  );
}

function HealthAppointmentsTab({ apiUrl, apiToken }) {

  const [busy,         setBusy]         = React.useState(false);

  const [error,        setError]        = React.useState('');

    setLoading(true);

      .finally(function() { setLoading(false); });
  }

  React.useEffect(load, [apiUrl, apiToken]);

  async function handleLogVisit(person, type) {
    if (!window.confirm('Log a visit for ' + person + ' · "' + type + '" today?\nThis creates a calendar event.')) return;
    setBusy(true);
    setLogMsg('');
    try {
      var res = await apiGet(apiUrl, apiToken, { action: 'log_health_visit', person: person, type: type });
      if (res.ok) {
        setLogMsg('✓ Logged on ' + res.visitDate + ' · Next due: ' + (res.nextDue || '?') + ' (' + res.calendarName + ')');
        load();
      }
    } catch (e) { setError(e.message); }
    setBusy(false);
  }

  function statusBadge(a) {
    if (a.daysUntil === null) return { label: 'No history', color: '#6b7fa8', bg: 'rgba(107,127,168,.1)' };
    if (a.daysUntil < 0)     return { label: 'Overdue',    color: '#ef5350', bg: 'rgba(239,83,80,.1)' };
    if (a.daysUntil <= 30)   return { label: 'Due soon',   color: '#ffa726', bg: 'rgba(255,167,38,.1)' };
    return                          { label: 'OK',          color: '#66bb6a', bg: 'rgba(102,187,106,.1)' };
  }

  // Derive unique people for filter tabs
  var people = ['All'];
  (appointments || []).forEach(function(a) {
    if (people.indexOf(a.person) === -1) people.push(a.person);
  });

  var visible = (appointments || []).filter(function(a) {
    return personFilter === 'All' || a.person === personFilter;
  });

  if (loading) return <div style={{ fontSize: 13, color: '#6b7fa8', padding: 16 }}>Loading appointments…</div>;

  return (
    <div>
      {error   && <div style={{ color: '#ef5350', fontSize: 13, marginBottom: 10 }}>{error}</div>}
      {logMsg  && <div style={{ color: '#66bb6a', fontSize: 12, marginBottom: 10, padding: '6px 12px', background: 'rgba(102,187,106,.08)', borderRadius: 6 }}>{logMsg}</div>}

      {/* Instructional note */}
      <div style={{ fontSize: 12, color: '#4d6080', background: '#111e35', border: '1px solid #1e2e4a', borderRadius: 8, padding: '8px 14px', marginBottom: 14 }}>
        Add appointments to Google Calendar with the title format <strong style={{ color: '#7ab4ff' }}>DR: Ahmed - Annual Physical</strong> — VERA tracks them automatically.
        Optionally add <code style={{ color: '#a0b0c8' }}>interval:6</code> in the event description to override the default check frequency.
      </div>

      {/* Top bar */}
      <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center', marginBottom: 12, flexWrap: 'wrap', gap: 8 }}>
        {/* Person filter pills */}
        <div style={{ display: 'flex', gap: 6 }}>
          {people.map(function(p) {
            return (
              <button key={p} onClick={function() { setPersonFilter(p); }}
                style={{ padding: '4px 12px', borderRadius: 20, fontSize: 12, cursor: 'pointer',
                         background: personFilter === p ? 'rgba(100,160,255,.2)' : 'transparent',
                         border: '1px solid ' + (personFilter === p ? 'rgba(100,160,255,.5)' : '#2a3a5a'),
                         color: personFilter === p ? '#7ab4ff' : '#6b7fa8' }}>
                {p}
              </button>
            );
          })}
        </div>
        <button onClick={load} disabled={busy}
          style={{ padding: '5px 12px', borderRadius: 8, background: 'rgba(100,160,255,.1)', border: '1px solid rgba(100,160,255,.3)', color: '#7ab4ff', fontSize: 12, cursor: 'pointer' }}>
          ↻ Refresh
        </button>
      </div>

      {(!appointments || appointments.length === 0) && (
        <div className="empty-state" style={{ paddingTop: 32 }}>
          <div style={{ fontSize: 36, marginBottom: 10 }}>🩺</div>
          <div style={{ fontWeight: 600, fontSize: 14, color: '#a0b0c8', marginBottom: 6 }}>No DR: events found in calendar</div>
          <div style={{ fontSize: 13, color: '#4d6080' }}>Add events like "DR: Ahmed - Annual Physical" to Google Calendar to start tracking.</div>
        </div>
      )}

      <div style={{ display: 'flex', flexDirection: 'column', gap: 8 }}>
        {visible.map(function(a) {
          var badge = statusBadge(a);
          var key   = a.person + '|' + a.type;
          return (
            <div key={key} style={{ background: '#1a2540', border: '1px solid #2a3a5a', borderRadius: 10, padding: '12px 16px', display: 'flex', alignItems: 'center', gap: 12, flexWrap: 'wrap' }}>
              {/* Person pill */}
              <div style={{ flex: '0 0 auto' }}>
                <span style={{ padding: '2px 9px', borderRadius: 20, fontSize: 11, fontWeight: 600,
                               background: a.person === 'Victoria' ? 'rgba(186,104,200,.15)' : 'rgba(100,160,255,.12)',
                               color:      a.person === 'Victoria' ? '#ce93d8' : '#7ab4ff',
                               border: '1px solid ' + (a.person === 'Victoria' ? 'rgba(186,104,200,.3)' : 'rgba(100,160,255,.3)') }}>
                  {a.person}
                </span>
              </div>
              {/* Type + provider */}
              <div style={{ flex: '1 1 160px' }}>
                <div style={{ fontWeight: 700, fontSize: 14, color: '#e8d9b0', marginBottom: 2 }}>{a.type}</div>
                {a.provider && <div style={{ fontSize: 12, color: '#6b7fa8' }}>{a.provider}</div>}
              </div>
              {/* Last visit */}
              <div style={{ flex: '0 1 110px', fontSize: 12, color: '#a0b0c8', textAlign: 'center' }}>
                <div style={{ color: '#6b7fa8', marginBottom: 2 }}>Last visit</div>
                <div>{a.lastVisit || '—'}</div>
              </div>
              {/* Next due */}
              <div style={{ flex: '0 1 110px', fontSize: 12, color: '#a0b0c8', textAlign: 'center' }}>
                <div style={{ color: '#6b7fa8', marginBottom: 2 }}>Next due</div>
                <div>{a.nextDue || '—'}</div>
                {a.scheduledNext && a.scheduledNext !== a.nextDue && (
                  <div style={{ fontSize: 11, color: '#4d9f6a', marginTop: 2 }}>Scheduled {a.scheduledNext}</div>
                )}
              </div>
              {/* Status badge */}
              <div style={{ flex: '0 0 auto' }}>
                <span style={{ padding: '3px 10px', borderRadius: 20, fontSize: 11, fontWeight: 600,
                               background: badge.bg, color: badge.color, border: '1px solid ' + badge.color + '55' }}>
                  {badge.label}
                  {a.daysUntil !== null && a.daysUntil < 0 ? ' ' + Math.abs(a.daysUntil) + 'd' : ''}
                  {a.daysUntil !== null && a.daysUntil >= 0 && a.daysUntil <= 30 ? ' (' + a.daysUntil + 'd)' : ''}
                </span>
              </div>
              {/* Log Visit */}
              <div style={{ flex: '0 0 auto' }}>
                <button onClick={function() { handleLogVisit(a.person, a.type); }} disabled={busy}
                  style={{ padding: '4px 10px', borderRadius: 6, background: 'rgba(100,160,255,.1)', border: '1px solid rgba(100,160,255,.3)', color: '#7ab4ff', fontSize: 11, cursor: 'pointer' }}>
                  Log Visit
                </button>
              </div>
            </div>
          );
        })}
      </div>
    </div>
  );
}

        <div style={{ fontSize: 32, marginBottom: 12 }}>🎯</div>
        <div style={{ color: '#dde1f0', marginBottom: 8 }}>No upcoming milestones</div>
        <div style={{ fontSize: 12, color: '#4d6080', maxWidth: 380, margin: '0 auto', lineHeight: 1.6 }}>
          Add all-day events to calendars listed in Config → <code style={{ background: '#13244d', padding: '1px 5px', borderRadius: 3 }}>gap_calendars</code> whose
          titles contain keywords from <code style={{ background: '#13244d', padding: '1px 5px', borderRadius: 3 }}>milestone_keywords</code> (e.g. Trip, Vacation, Wedding).
        </div>
      </div>
    );
  }

  const activeFlags = flags.filter(f => !f.resolved && !f.acknowledged);

  return (
    <div>
      {milestones.map((m, i) => {
        const relFlags = activeFlags.filter(f =>
          matchesMilestone(m, f.flag + ' ' + f.reason)
        );
        const relTasks = tasks.filter(t =>
          matchesMilestone(m, t.task + ' ' + t.notes)
        );
        const isSoon  = m.daysUntil <= 30;
        const hasHigh = relFlags.some(f => f.urgency === 'High');

        return (
          <div key={i} className={`milestone-card${hasHigh ? ' urgent' : ''}`}>
            <div className="milestone-header">
              <span className="milestone-name">{m.label}</span>
              <span className={`milestone-countdown${isSoon ? ' soon' : ''}`}>
                <DaysAway n={m.daysUntil} format="in" />
              </span>
            </div>

            <div className="milestone-section-label">🚩 Related Flags ({relFlags.length})</div>
            {relFlags.length === 0
              ? <div className="milestone-empty">No active flags tied to this milestone</div>
              : relFlags.map(flag => (
                  <FlagCard key={flag.id} flag={flag} onAction={onAction} busy={busy} />
                ))
            }

            <div className="milestone-section-label">✅ Related Tasks ({relTasks.length})</div>
            {relTasks.length === 0
              ? <div className="milestone-empty">No open tasks tied to this milestone</div>
              : relTasks.map((task, ti) => (
                  <TaskCard key={task.id || ti} task={task}
                    onComplete={() => {}} onEdit={() => {}} completing={false} />

            }

            <div style={{ fontSize: 11, color: '#3d5280', marginTop: 14, paddingTop: 12, borderTop: '1px solid #13244d' }}>
              📅 {m.date} · {m.calendarName}

          </div>
        );
      })}
    </div>
  );
}
