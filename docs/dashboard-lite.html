<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>VERA — Shopping</title>
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: #080f1e;
      color: #dde1f0;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif;
      min-height: 100vh;
    }

    /* ---- Scrollbar ---- */
    ::-webkit-scrollbar { width: 6px; }
    ::-webkit-scrollbar-track { background: #0d1b3e; }
    ::-webkit-scrollbar-thumb { background: #2a3a5e; border-radius: 3px; }

    /* ---- Header ---- */
    .header {
      background: linear-gradient(135deg, #0d1b3e 0%, #152547 100%);
      border-bottom: 1px solid #1e3060;
      padding: 0 28px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      height: 60px;
      position: sticky;
      top: 0;
      z-index: 100;
    }
    .logo { display: flex; align-items: baseline; gap: 10px; }
    .logo-name {
      font-size: 22px;
      font-weight: 800;
      letter-spacing: 4px;
      color: #fff;
    }
    .logo-sub {
      font-size: 10px;
      letter-spacing: 2px;
      color: #c9a84c;
      text-transform: uppercase;
    }
    .header-actions { display: flex; align-items: center; gap: 8px; }

    /* ---- Buttons ---- */
    .btn {
      border: none;
      border-radius: 6px;
      cursor: pointer;
      font-size: 12px;
      font-weight: 600;
      padding: 6px 14px;
      transition: opacity .15s, transform .1s;
    }
    .btn:hover  { opacity: 0.85; transform: translateY(-1px); }
    .btn:active { transform: translateY(0); }
    .btn:disabled { opacity: 0.4; cursor: not-allowed; transform: none; }
    .btn-primary  { background: #c9a84c; color: #0d1b3e; }
    .btn-ghost    { background: #13244d; color: #8a9abf; }
    .btn-refresh  { background: #13244d; border: 1px solid #1e3060; color: #8a9abf; }
    .btn-settings { background: none; border: none; color: #6b7fa8; cursor: pointer; font-size: 18px; padding: 4px 8px; }
    .btn-settings:hover { color: #c9a84c; }

    /* ---- Modal ---- */
    .modal-overlay {
      background: rgba(0,0,0,0.75);
      bottom: 0; left: 0; right: 0; top: 0;
      display: flex;
      /* flex-start plus margin-block:auto on the child, NOT align-items:center.
         A centred flex child taller than its container overflows equally off
         both ends, and a scroll container cannot scroll above its own start
         edge — so the top of a tall modal becomes permanently unreachable.
         Auto margins centre it when there is room and top-align it when there
         is not, which is the behaviour that actually works in both cases. */
      align-items: flex-start;
      justify-content: center;
      position: fixed;
      z-index: 200;
      /* The overlay was fixed with no overflow, so a modal taller than the
         viewport had nowhere to scroll: its save button sat off-screen while
         the page behind scrolled freely. */
      overflow-y: auto;
      overscroll-behavior: contain;      /* don't chain the scroll to the page behind */
      -webkit-overflow-scrolling: touch;
      /* Vertical only. .modal is max-width:95vw, and horizontal padding here
         would push it past the viewport and add a sideways scrollbar. */
      padding: 24px 0;
    }
    .modal-overlay > * { margin-block: auto; }
    .modal {
      background: #0d1b3e;
      border: 1px solid #1e3060;
      border-radius: 14px;
      padding: 32px;
      width: 480px;
      max-width: 95vw;
    }
    .modal h2 { color: #fff; font-size: 18px; margin-bottom: 6px; }
    .modal p  { color: #6b7fa8; font-size: 13px; margin-bottom: 24px; }
    .form-group  { margin-bottom: 16px; }
    .form-label  { color: #8a9abf; display: block; font-size: 12px; font-weight: 700; letter-spacing: 0.5px; margin-bottom: 6px; text-transform: uppercase; }
    .form-input  {
      background: #13244d;
      border: 1px solid #1e3060;
      border-radius: 8px;
      color: #e8ecf8;
      font-family: monospace;
      font-size: 13px;
      outline: none;
      padding: 10px 14px;
      transition: border-color .15s;
      width: 100%;
    }
    .form-input:focus { border-color: #c9a84c; }
    .form-hint   { color: #4d6080; font-size: 11px; margin-top: 4px; }
    .modal-actions { display: flex; gap: 10px; justify-content: flex-end; margin-top: 24px; }

    /* ---- Feedback states ---- */
    .empty-state {
      background: #0d1b3e;
      border: 1px dashed #1e3060;
      border-radius: 10px;
      color: #4d6080;
      font-size: 14px;
      padding: 48px;
      text-align: center;
    }
    .error-banner {
      background: #3d1515;
      border: 1px solid #e53935;
      border-radius: 8px;
      color: #ff8a80;
      font-size: 13px;
      margin-bottom: 16px;
      padding: 12px 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }
    .error-dismiss {
      background: none;
      border: none;
      color: #ff8a80;
      cursor: pointer;
      font-size: 16px;
      flex-shrink: 0;
      padding: 0 4px;
    }

    /* ---- Toast ---- */
    .toast {
      position: fixed;
      bottom: 28px;
      right: 28px;
      background: #0f3020;
      border: 1px solid #43a047;
      border-radius: 10px;
      color: #69f0ae;
      font-size: 14px;
      font-weight: 600;
      padding: 14px 22px;
      z-index: 300;
      box-shadow: 0 4px 20px rgba(0,0,0,0.5);
      animation: slideUp 0.2s ease;
    }
    .toast.error { background: #3d1515; border-color: #e53935; color: #ff8a80; }
    @keyframes slideUp {
      from { opacity: 0; transform: translateY(12px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    /* ---- Responsive ---- */
    @media (max-width: 768px) {
      .header { padding: 0 16px; }
    }
    @media (max-width: 480px) {
      .header { padding: 0 12px; height: 54px; }
      .logo-sub { display: none; }
      .modal { padding: 20px; border-radius: 10px; }
      .modal-overlay { padding: 12px 0; }
    }

    /* ---- Chat ---- */
    .chat-wrap { display: flex; flex-direction: column; height: calc(100vh - 200px); min-height: 400px; }
    .chat-messages { flex: 1; overflow-y: auto; padding: 16px 0; display: flex; flex-direction: column; gap: 10px; }
    .chat-msg { max-width: 80%; padding: 10px 14px; border-radius: 12px; font-size: 14px; line-height: 1.5; white-space: pre-wrap; word-break: break-word; }
    .chat-msg.user { align-self: flex-end; background: #1a3a6e; color: #dde1f0; border-bottom-right-radius: 4px; }
    .chat-msg.vera { align-self: flex-start; background: #0d1b3e; border: 1px solid #1e3060; color: #dde1f0; border-bottom-left-radius: 4px; }
    .chat-msg.vera.vera-typing { color: #6b7fa8; font-style: italic; }
    .chat-input-area { padding-top: 12px; border-top: 1px solid #1e3060; }
    .chat-input-row { display: flex; gap: 8px; align-items: flex-end; }
    .chat-input { flex: 1; background: #0d1b3e; border: 1px solid #1e3060; border-radius: 10px; color: #dde1f0; font-size: 14px; font-family: inherit; padding: 10px 14px; resize: none; outline: none; transition: border-color .15s; }
    .chat-input:focus { border-color: #c9a84c; }
    .chat-input::placeholder { color: #3d5280; }
    .chat-send { background: #c9a84c; border: none; border-radius: 8px; color: #0d1b3e; cursor: pointer; font-size: 18px; font-weight: 700; padding: 10px 14px; transition: opacity .15s; flex-shrink: 0; }
    .chat-send:hover:not(:disabled) { opacity: 0.85; }
    .chat-send:disabled { opacity: 0.4; cursor: not-allowed; }
    .subtab-row { display:flex; gap:8px; margin-bottom:18px; flex-wrap:wrap; }
    .subtab-btn { background:none; border:1px solid #1e3060; border-radius:20px; color:#6b7fa8;
                  font-size:12px; padding:5px 14px; cursor:pointer;
                  transition:border-color .15s, color .15s; white-space:nowrap; }
    .subtab-btn:hover  { border-color:#3d5fa0; color:#c9d9ff; }
    .subtab-btn.active { border-color:#c9a84c; color:#c9a84c; background:rgba(201,168,76,.08); }
    @keyframes vera-pulse {
      0%, 100% { opacity: 1; }
      50%       { opacity: 0.35; }
    }
    .vera-inair { animation: vera-pulse 1.5s ease-in-out infinite; }
    .bento-card {
      background: #0d1b3e;
      border: 1px solid #1e3060;
      border-radius: 10px;
      padding: 20px;
      cursor: pointer;
      transition: border-color .15s, transform .1s;
    }
    .bento-card:hover { border-color: #3d5fa0; transform: translateY(-2px); }
    .bento-card-title {
      font-size: 12px;
      font-weight: 700;
      color: #8a9abf;
      letter-spacing: 0.5px;
      text-transform: uppercase;
      margin-bottom: 12px;
    }
    .bento-card-main {
      font-size: 28px;
      font-weight: 800;
      color: #c9a84c;
      margin-bottom: 4px;
    }
    .bento-card-sub { font-size: 12px; color: #6b7fa8; margin-bottom: 10px; }
    .bento-card-list { display: flex; flex-direction: column; gap: 4px; }
    .loading-text { color: #6b7fa8; font-size: 13px; padding: 48px; text-align: center; }
    .toolbar { display: flex; align-items: center; gap: 12px; margin-bottom: 20px; }
    .count-badge { background: #13244d; border-radius: 10px; color: #6b7fa8; font-size: 12px; margin-left: auto; padding: 3px 10px; }
    .chat-img-preview { position: relative; display: inline-flex; align-items: flex-start; margin-bottom: 8px; }
    .chat-img-preview img { max-height: 80px; max-width: 120px; border-radius: 8px; border: 1px solid #1e3060; object-fit: cover; }
    .chat-img-remove {
      position: absolute; top: -6px; right: -6px; background: #e53935; color: #fff; border: none;
      border-radius: 50%; width: 18px; height: 18px; font-size: 11px; cursor: pointer; line-height: 18px;
      padding: 0; display: flex; align-items: center; justify-content: center;
    }
    .chat-attach, .chat-mic {
      background: none; border: 1px solid #2a4070; border-radius: 10px; color: #8899cc; font-size: 18px;
      padding: 0 12px; cursor: pointer; align-self: flex-end; height: 44px; transition: border-color .15s, color .15s;
    }
    .chat-attach:hover, .chat-mic:hover { border-color: #c9a84c; color: #c9a84c; }
    .chat-attach:disabled, .chat-mic:disabled { opacity: .4; cursor: not-allowed; }
    .chat-mic.listening { border-color: #ef5350; color: #ef5350; animation: mic-pulse 1s ease-in-out infinite; }
    @keyframes mic-pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.4; } }
    .voice-status { font-size: 11px; color: #ef5350; margin-bottom: 4px; padding-left: 2px; letter-spacing: 0.03em; }
    .chat-msg-img { display: block; max-width: 200px; max-height: 140px; border-radius: 8px; margin-bottom: 6px; object-fit: cover; border: 1px solid rgba(255,255,255,.1); }
  </style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
const { useState, useEffect, useRef } = React;

// ---- Helpers ----------------------------------------------------------------

function stored(key, fallback = '') {
  return localStorage.getItem(key) || fallback;
}

function makeUrl(base, token, params = {}) {
  const url = new URL(base);
  url.searchParams.set('token', token);
  Object.entries(params).forEach(([k, v]) => { if (v) url.searchParams.set(k, v); });
  return url.toString();
}

async function apiGet(apiUrl, token, params) {
  const res = await fetch(makeUrl(apiUrl, token, params), { cache: 'no-store' });
  const json = await res.json();
  if (!json.ok) throw new Error(json.error || 'API error');
  return json;
}

// All write operations use GET to avoid CORS preflight from file:// origin
async function apiAction(apiUrl, token, action, params) {
  return apiGet(apiUrl, token, Object.assign({ action }, params));
}

// POST without Content-Type → simple CORS request (no preflight)
async function apiPost(apiUrl, token, body) {
  const url = new URL(apiUrl);
  url.searchParams.set('token', token);
  const res = await fetch(url.toString(), { method: 'POST', body: JSON.stringify(body) });
  const json = await res.json();
  if (!json.ok) throw new Error(json.error || 'API error');
  return json;
}

// Resize image File to maxDim on longest side, re-encode as JPEG @ 85%
function resizeImage(file, maxDim = 1600) {
  return new Promise(resolve => {
    const img = new Image();
    const blobUrl = URL.createObjectURL(file);
    img.onload = () => {
      const scale = Math.min(1, maxDim / Math.max(img.width, img.height));
      const w = Math.round(img.width * scale), h = Math.round(img.height * scale);
      const canvas = document.createElement('canvas');
      canvas.width = w; canvas.height = h;
      canvas.getContext('2d').drawImage(img, 0, 0, w, h);
      URL.revokeObjectURL(blobUrl);
      const dataUrl = canvas.toDataURL('image/jpeg', 0.85);
      resolve({ base64: dataUrl.split(',')[1], mimeType: 'image/jpeg' });
    };
    img.src = blobUrl;
  });
}

// ---- Settings modal ---------------------------------------------------------

function SettingsModal({ initial, onSave, onClose }) {
  const [url, setUrl]     = useState(initial.url);
  const [token, setToken] = useState(initial.token);

  function save() {
    const u = url.trim();
    const t = token.trim();
    if (!u || !t) return;
    localStorage.setItem('vera_url', u);
    localStorage.setItem('vera_token', t);
    onSave(u, t);
  }

  return (
    <div className="modal-overlay" onClick={e => e.target === e.currentTarget && onClose && onClose()}>
      <div className="modal">
        <h2>⚙️ Connect to VERA API</h2>
        <p>Enter your Apps Script Web App URL and the token from Script Properties.</p>

        <div className="form-group">
          <label className="form-label">Web App URL</label>
          <input
            className="form-input"
            placeholder="https://script.google.com/macros/s/.../exec"
            value={url}
            onChange={e => setUrl(e.target.value)}
          />
        </div>

        <div className="form-group">
          <label className="form-label">VERA_WEB_TOKEN</label>
          <input
            className="form-input"
            placeholder="vera-b479..."
            type="password"
            value={token}
            onChange={e => setToken(e.target.value)}
          />
          <div className="form-hint">Set in Apps Script → Project Settings → Script Properties</div>
        </div>

        <div className="modal-actions">
          {onClose && <button className="btn btn-ghost" onClick={onClose}>Cancel</button>}
          <button className="btn btn-primary" onClick={save} disabled={!url.trim() || !token.trim()}>
            Connect
          </button>
        </div>
      </div>
    </div>
  );
}

// ---- Chat tab ---------------------------------------------------------------

function ChatLiteView({ apiUrl, apiToken }) {
  const [messages, setMessages] = useState(function() {
    try {
      var saved = localStorage.getItem('vera_lite_chat');
      return saved ? JSON.parse(saved) : [];
    } catch(e) { return []; }
  });
  const [input,   setInput]   = useState('');
  const [loading, setLoading] = useState(false);
  const [pendingImage, setPendingImage] = useState(null); // {base64, mimeType, preview} | null
  const [listening, setListening] = useState(false);
  const bottomRef = useRef(null);
  const fileRef = useRef(null);
  const recogRef = useRef(null);

  useEffect(function() {
    if (bottomRef.current) bottomRef.current.scrollIntoView({ behavior: 'smooth' });
  }, [messages]);

  useEffect(function() {
    try {
      localStorage.setItem('vera_lite_chat', JSON.stringify(messages.slice(-80)));
    } catch(e) {}
  }, [messages]);

  async function sendWithText(text, imgSnap) {
    if ((!text && !imgSnap) || loading) return;
    setInput('');
    setPendingImage(null);
    setMessages(function(prev) { return [...prev, { role: 'user', text: text, image: imgSnap ? imgSnap.preview : null }]; });
    setLoading(true);
    try {
      var data;
      if (imgSnap) {
        data = await apiPost(apiUrl, apiToken, {
          action: 'chat', message: text, session: 'victoria_dashboard',
          imageBase64: imgSnap.base64, imageMimeType: imgSnap.mimeType,
        });
      } else {
        data = await apiGet(apiUrl, apiToken, { action: 'chat', message: text, session: 'victoria_dashboard' });
      }
      var veraMsg = { role: 'vera', text: data.reply };
      if (data.sources && data.sources.length > 0) veraMsg.sources = data.sources;
      setMessages(function(prev) { return [...prev, veraMsg]; });
    } catch(e) {
      setMessages(function(prev) { return [...prev, { role: 'vera', text: '\u26a0 Error: ' + e.message }]; });
    }
    setLoading(false);
  }

  function send() {
    sendWithText(input.trim(), pendingImage);
  }

  function handleKey(e) {
    if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); send(); }
  }

  function startVoice() {
    const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
    if (!SR) { alert('Speech recognition is not supported in this browser. Please use Chrome or Edge.'); return; }
    if (listening) { recogRef.current && recogRef.current.stop(); setListening(false); return; }
    const recog = new SR();
    recog.continuous = false;
    recog.interimResults = false;
    recog.lang = 'en-US';
    recog.onstart = function() { setListening(true); };
    recog.onend = function() { setListening(false); };
    recog.onresult = function(event) {
      const transcript = event.results[0][0].transcript.trim();
      setInput(transcript);
      sendWithText(transcript, null);
    };
    recog.onerror = function(event) { console.error('VERA voice error:', event.error); setListening(false); };
    recogRef.current = recog;
    recog.start();
  }

  async function handleFileChange(e) {
    const file = e.target.files[0];
    if (!file) return;
    e.target.value = '';
    if (file.size > 10 * 1024 * 1024) { alert('Image too large (max 10 MB). Please choose a smaller image.'); return; }
    const result = await resizeImage(file);
    setPendingImage(result);
  }

  return (
    <div className="chat-wrap">
      <input ref={fileRef} type="file" accept="image/*" style={{ display: 'none' }} onChange={handleFileChange} />
      <div className="chat-messages">
        {messages.length === 0 && (
          <div style={{ color: '#4d6080', fontSize: 14, textAlign: 'center', padding: '40px 20px' }}>
            <div style={{ fontSize: 28, marginBottom: 10 }}>💬</div>
            Ask VERA about home, travel, upcoming dates…
          </div>
        )}
        {messages.map(function(m, i) {
          return (
            <div key={i} className={'chat-msg ' + m.role}>
              {m.image && <img src={m.image} className="chat-msg-img" alt="attachment" />}
              {m.text && <span>{m.text}</span>}
              {m.sources && m.sources.length > 0 && (
                <div style={{ marginTop: 10, paddingTop: 8, borderTop: '1px solid #1e2d42', fontSize: 12 }}>
                  <div style={{ color: '#6b7fa8', fontWeight: 600, marginBottom: 5 }}>🌐 Web Sources</div>
                  {m.sources.map(function(s, si) {
                    return (
                      <a key={si} href={s.link} target="_blank" rel="noopener noreferrer"
                        style={{ display: 'block', color: '#5c9eff', marginBottom: 4, overflow: 'hidden', textOverflow: 'ellipsis', whiteSpace: 'nowrap', maxWidth: '100%' }}>
                        {s.title || s.link}
                      </a>
                    );
                  })}
                </div>
              )}
            </div>
          );
        })}
        {loading && <div className="chat-msg vera vera-typing">VERA is thinking…</div>}
        <div ref={bottomRef} />
      </div>
      <div className="chat-input-area">
        {pendingImage && (
          <div className="chat-img-preview">
            <img src={pendingImage.preview} alt="attachment" />
            <button className="chat-img-remove" onClick={function() { setPendingImage(null); }} title="Remove image">×</button>
          </div>
        )}
        {listening && <div className="voice-status">🔴 Listening…</div>}
        <div className="chat-input-row">
          <button className="chat-attach" onClick={function() { fileRef.current.click(); }} disabled={loading || !apiUrl || !apiToken} title="Attach image">📎</button>
          <textarea
            className="chat-input"
            rows={2}
            placeholder="Ask VERA about home, travel, upcoming dates…"
            value={input}
            onChange={function(e) { setInput(e.target.value); }}
            onKeyDown={handleKey}
            disabled={loading || !apiUrl || !apiToken}
          />
          <button className={'chat-mic' + (listening ? ' listening' : '')} onClick={startVoice} disabled={loading || !apiUrl || !apiToken} title={listening ? 'Stop listening' : 'Speak to VERA'}>🎤</button>
          <button className="chat-send" onClick={send} disabled={(!input.trim() && !pendingImage) || loading || !apiUrl || !apiToken}>
            ↑
          </button>
        </div>
      </div>
    </div>
  );
}

// ---- Log Run Modal ----------------------------------------------------------

function LogRunModal({ store, checkedItems, onConfirm, onClose, busy }) {
  const [selected, setSelected] = React.useState(() => new Set(checkedItems.map((_, i) => i)));

  const toggle = (i) => setSelected(prev => {
    const next = new Set(prev);
    next.has(i) ? next.delete(i) : next.add(i);
    return next;
  });

  const selectedItems = checkedItems.filter((_, i) => selected.has(i));
  const cleanText = (t) => t.replace(/^🤖\s*/, '').replace(/\s*\(est\..*?\)$/, '').trim();

  return (
    <div style={{
      position: 'fixed', inset: 0, background: 'rgba(0,0,0,0.6)',
      display: 'flex', alignItems: 'center', justifyContent: 'center', zIndex: 9999,
    }} onClick={onClose}>
      <div style={{
        background: '#0d1b3e', border: '1px solid #1e3060', borderRadius: 12,
        padding: '28px 32px', minWidth: 320, maxWidth: 440, width: '90%',
      }} onClick={e => e.stopPropagation()}>
        <div style={{ fontSize: 16, fontWeight: 700, color: '#c9a84c', marginBottom: 6 }}>
          📦 Log Shopping Run — {store}
        </div>
        <div style={{ fontSize: 13, color: '#8a9abf', marginBottom: 16 }}>
          {selectedItems.length} of {checkedItems.length} item{checkedItems.length !== 1 ? 's' : ''} will be logged. Uncheck anything you didn't buy:
        </div>
        <div style={{ maxHeight: 240, overflowY: 'auto', marginBottom: 20 }}>
          {checkedItems.map((text, i) => (
            <div key={i} onClick={() => toggle(i)} style={{
              display: 'flex', alignItems: 'center', gap: 10,
              fontSize: 13, padding: '6px 0', cursor: 'pointer',
              borderBottom: i < checkedItems.length - 1 ? '1px solid #1a2a50' : 'none',
              color: selected.has(i) ? '#dde1f0' : '#4a5a7a',
              textDecoration: selected.has(i) ? 'none' : 'line-through',
            }}>
              <input
                type="checkbox"
                checked={selected.has(i)}
                onChange={() => toggle(i)}
                onClick={(e) => e.stopPropagation()}
                style={{ accentColor: '#c9a84c', width: 15, height: 15, flexShrink: 0 }}
              />
              {cleanText(text)}
            </div>
          ))}
        </div>
        <div style={{ display: 'flex', gap: 10, justifyContent: 'flex-end' }}>
          <button onClick={onClose} disabled={busy}
            style={{ background: 'none', border: '1px solid #2a3a60', borderRadius: 6,
                     color: '#8a9abf', padding: '7px 18px', fontSize: 13, cursor: 'pointer' }}>
            Cancel
          </button>
          <button onClick={() => onConfirm(selectedItems)} disabled={busy || selectedItems.length === 0}
            style={{ background: '#c9a84c', border: 'none', borderRadius: 6,
                     color: '#0d1b3e', fontWeight: 700, padding: '7px 18px', fontSize: 13,
                     cursor: (busy || selectedItems.length === 0) ? 'not-allowed' : 'pointer',
                     opacity: (busy || selectedItems.length === 0) ? 0.5 : 1 }}>
            {busy ? 'Logging…' : `✓ Log ${selectedItems.length} Item${selectedItems.length !== 1 ? 's' : ''}`}
          </button>
        </div>
      </div>
    </div>
  );
}

function ShoppingTab({ stores, onToggle, onAddItem, onDelete, onEdit, busy, onLogRun }) {
  const [activeStore,   setActiveStore]   = React.useState(null);
  const [editingIndex,  setEditingIndex]  = React.useState(null); // { tabId, index } | null
  const [editText,      setEditText]      = React.useState('');
  const [logRunModal,   setLogRunModal]   = React.useState(false);

  React.useEffect(() => {
    if (stores.length > 0) {
      setActiveStore(prev =>
        stores.find(s => s.tabId === prev) ? prev : stores[0].tabId
      );
    } else {
      setActiveStore(null);
    }
  }, [stores]);

  if (!stores.length) {
    return (
      <div className="empty-state">
        <div style={{ fontSize: 32, marginBottom: 12 }}>🛒</div>
        <div>No shopping list connected.</div>
        <div style={{ fontSize: 13, color: '#6b7fa8', marginTop: 8 }}>
          Set <code style={{ background: '#13244d', padding: '1px 6px', borderRadius: 4 }}>SHOPPING_LIST_DOC_ID</code> in Script Properties to connect your Google Doc.
        </div>
      </div>
    );
  }

  const current      = stores.find(s => s.tabId === activeStore);
  const checkedItems = current ? current.items.filter(i => i.done).map(i => i.text) : [];

  return (
    <div>
      {/* Store sub-tabs */}
      <div style={{
        display: 'flex', gap: 2, flexWrap: 'wrap', alignItems: 'center',
        borderBottom: '1px solid #1e3060', marginBottom: 20,
      }}>
        {stores.map(s => {
          const pending  = s.items.filter(i => !i.done).length;
          const isActive = s.tabId === activeStore;
          return (
            <button
              key={s.tabId}
              onClick={() => setActiveStore(s.tabId)}
              style={{
                background: isActive ? '#0d1b3e' : 'none',
                border: 'none', cursor: 'pointer',
                padding: '9px 16px', fontSize: 13, fontWeight: 600,
                color: isActive ? '#c9a84c' : '#8a9abf',
                borderBottom: isActive ? '2px solid #c9a84c' : '2px solid transparent',
                marginBottom: -1, display: 'flex', alignItems: 'center', gap: 7,
                borderRadius: '4px 4px 0 0',
              }}
            >
              {s.storeName}
              <span style={{
                background: pending === 0 ? 'rgba(67,160,71,0.2)' : 'rgba(201,168,76,0.15)',
                color: pending === 0 ? '#43a047' : '#c9a84c',
                borderRadius: 20, padding: '1px 7px', fontSize: 11, fontWeight: 700,
              }}>
                {pending === 0 ? '✓' : pending}
              </span>
            </button>
          );
        })}
        {/* Action buttons */}
        <React.Fragment>
          {checkedItems.length > 0 && (
            <button
              style={{
                background: 'none', border: '1px solid #c9a84c', borderRadius: 6,
                color: '#c9a84c', fontSize: 12, fontWeight: 600,
                padding: '5px 12px', cursor: busy ? 'wait' : 'pointer',
                marginLeft: 4, marginBottom: 4, flexShrink: 0,
              }}
              disabled={busy}
              onClick={() => setLogRunModal(true)}
            >
              📦 Log Shopping Run ({checkedItems.length})
            </button>
          )}
          <button
            className="btn btn-primary"
            style={{ fontSize: 12, marginLeft: checkedItems.length > 0 ? 4 : 'auto', marginBottom: 4, flexShrink: 0 }}
            disabled={busy}
            onClick={() => onAddItem && onAddItem(activeStore)}
          >
            + Add Item
          </button>
        </React.Fragment>
      </div>

      {/* Item list */}
      {current && (
        current.items.length === 0
          ? <div className="empty-state" style={{ padding: 32 }}>This store has no items listed.</div>
          : <div style={{ display: 'flex', flexDirection: 'column', gap: 6 }}>
              {[...current.items].sort((a, b) => a.done - b.done).map((item, i) => {
                const isEditing  = editingIndex !== null &&
                                   editingIndex.tabId === current.tabId &&
                                   editingIndex.index === item.index;
                const isVERA     = item.text.startsWith('🤖');
                return (
                  <div key={i} style={{
                    display: 'flex', alignItems: 'center', gap: 12,
                    padding: '11px 16px', borderRadius: 8,
                    background: item.done ? 'rgba(67,160,71,0.05)' : '#0d1b3e',
                    border: '1px solid ' + (item.done ? 'rgba(67,160,71,0.15)' : '#1e3060'),
                    opacity: isVERA && !item.done ? 0.82 : 1,
                    transition: 'background 0.15s',
                  }}>
                    {/* Checkbox — disabled while editing */}
                    <input type="checkbox" checked={item.done} readOnly
                      onClick={e => { e.stopPropagation(); if (!busy && !isEditing) onToggle(current.tabId, item.index, item.done); }}
                      style={{ accentColor: '#43a047', width: 16, height: 16, flexShrink: 0, cursor: isEditing ? 'default' : 'pointer' }} />

                    {/* Inline edit mode */}
                    {isEditing ? (
                      <React.Fragment>
                        <input
                          autoFocus
                          value={editText}
                          onChange={e => setEditText(e.target.value)}
                          onKeyDown={e => {
                            if (e.key === 'Enter') { e.preventDefault(); if (editText.trim()) { onEdit(current.tabId, item.index, editText); setEditingIndex(null); } }
                            if (e.key === 'Escape') setEditingIndex(null);
                          }}
                          style={{ flex: 1, background: '#13244d', border: '1px solid #c9a84c', borderRadius: 4,
                                   color: '#e8eaed', padding: '4px 8px', fontSize: 14 }}
                        />
                        <button onClick={() => { if (editText.trim()) { onEdit(current.tabId, item.index, editText); setEditingIndex(null); } }}
                          disabled={!editText.trim()}
                          style={{ background: '#c9a84c', border: 'none', borderRadius: 4, color: '#0d1b3e',
                                   fontWeight: 700, fontSize: 12, padding: '4px 10px', cursor: editText.trim() ? 'pointer' : 'default' }}>
                          Save
                        </button>
                        <button onClick={() => setEditingIndex(null)}
                          style={{ background: 'none', border: '1px solid #2a3a60', borderRadius: 4,
                                   color: '#8a9abf', fontSize: 12, padding: '4px 10px', cursor: 'pointer' }}>
                          Cancel
                        </button>
                      </React.Fragment>
                    ) : (
                      <React.Fragment>
                        <span style={{ flex: 1, fontSize: 14, color: item.done ? '#4a5a7a' : '#dde1f0',
                                       textDecoration: item.done ? 'line-through' : 'none',
                                       cursor: busy ? 'wait' : 'pointer' }}
                              onClick={() => !busy && onToggle(current.tabId, item.index, item.done)}>
                          {item.text}
                        </span>
                        {/* VERA suggestion chip */}
                        {isVERA && !item.done && (
                          <span style={{
                            fontSize: 9, fontWeight: 700, color: '#c9a84c',
                            background: 'rgba(201,168,76,0.12)', border: '1px solid rgba(201,168,76,0.3)',
                            borderRadius: 20, padding: '1px 6px', flexShrink: 0, letterSpacing: '0.5px',
                          }}>VERA</span>
                        )}
                        {/* Edit button */}
                        <button title="Edit" onClick={e => { e.stopPropagation(); setEditingIndex({ tabId: current.tabId, index: item.index }); setEditText(item.text); }}
                          style={{ background: 'none', border: 'none', cursor: 'pointer', color: '#5f6a8a',
                                   fontSize: 13, padding: '0 4px', flexShrink: 0 }}>✎</button>
                        {/* Delete button */}
                        <button title="Delete" onClick={e => { e.stopPropagation(); onDelete && onDelete(current.tabId, item.index); }}
                          style={{ background: 'none', border: 'none', cursor: 'pointer', color: '#5f6a8a',
                                   fontSize: 13, padding: '0 4px', flexShrink: 0 }}>✕</button>
                      </React.Fragment>
                    )}
                  </div>
                );
              })}
            </div>
      )}

      {/* Log Run confirmation modal */}
      {logRunModal && current && (
        <LogRunModal
          store={current.storeName}
          checkedItems={checkedItems}
          busy={busy}
          onClose={() => setLogRunModal(false)}
          onConfirm={(selectedItems) => {
            setLogRunModal(false);
            onLogRun && onLogRun(current.tabId, selectedItems);
          }}
        />
      )}
    </div>
  );
}

function refillBadge(refillDate) {
  if (!refillDate) return { label: 'No refill date', color: '#6b7280' };
  var today = new Date(); today.setHours(0,0,0,0);
  var d = new Date(refillDate); d.setHours(0,0,0,0);
  var days = Math.round((d - today) / 86400000);
  if (days < 0)  return { label: 'Refill overdue',       color: '#ef4444' };
  if (days <= 7) return { label: 'Refill in ' + days + ' days ⚠', color: '#ef4444' };
  if (days <= 14) return { label: 'Refill in ' + days + ' days', color: '#f59e0b' };
  return { label: 'Refill in ' + days + ' days', color: '#22c55e' };
}

function PrescriptionsTab({ apiUrl, apiToken }) {
  const [prescriptions, setPrescriptions] = React.useState([]);
  const [loading, setLoading]             = React.useState(false);
  const [busy, setBusy]                   = React.useState(false);
  const [error, setError]                 = React.useState('');
  const [modal, setModal]                 = React.useState(null); // null | { mode:'add'|'edit', rx, person }

  async function load() {
    setLoading(true); setError('');
    try {
      const res = await apiGet(apiUrl, apiToken, { action: 'prescriptions' });
      setPrescriptions(res.prescriptions || []);
    } catch (err) { setError('Could not load prescriptions: ' + err.message); }
    setLoading(false);
  }

  React.useEffect(() => { load(); }, []);

  // Derive unique persons in stable order: Ahmed first, Victoria second, others after
  const persons = React.useMemo(() => {
    const seen = new Set();
    const order = [];
    ['Ahmed', 'Victoria'].forEach(p => { seen.add(p); order.push(p); });
    prescriptions.forEach(rx => { if (!seen.has(rx.person)) { seen.add(rx.person); order.push(rx.person); } });
    return order;
  }, [prescriptions]);

  async function handleSave(form) {
    setBusy(true);
    try {
      if (modal.mode === 'edit') {
        await apiGet(apiUrl, apiToken, Object.assign({ action: 'update_prescription' }, form, { id: modal.rx.id }));
      } else {
        await apiGet(apiUrl, apiToken, Object.assign({ action: 'add_prescription' }, form));
      }
      setModal(null);
      await load();
    } catch (err) { setError('Save failed: ' + err.message); }
    setBusy(false);
  }

  async function handleDelete(id) {
    if (!confirm('Delete this prescription?')) return;
    setBusy(true);
    try {
      await apiGet(apiUrl, apiToken, { action: 'delete_prescription', id });
      await load();
    } catch (err) { setError('Delete failed: ' + err.message); }
    setBusy(false);
  }

  async function handleToggleActive(id, newActive) {
    setBusy(true);
    try {
      await apiGet(apiUrl, apiToken, { action: 'update_prescription', id: id, active: newActive });
      await load();
    } catch (err) { setError('Update failed: ' + err.message); }
    setBusy(false);
  }

  if (loading) return <div style={{ color: '#a0a8c0', padding: 24, textAlign: 'center' }}>Loading prescriptions…</div>;

  return (
    <div style={{ padding: '4px 0' }}>
      {error && <div style={{ color: '#ef4444', marginBottom: 12, fontSize: 13 }}>{error}</div>}
      <div style={{ display: 'grid', gridTemplateColumns: 'repeat(auto-fit, minmax(280px, 1fr))', gap: 20 }}>
        {persons.map(person => (
          <PersonPanel
            key={person}
            person={person}
            prescriptions={prescriptions.filter(rx => rx.person === person)}
            busy={busy}
            onAdd={p => setModal({ mode: 'add', rx: null, person: p })}
            onEdit={rx => setModal({ mode: 'edit', rx, person: rx.person })}
            onDelete={handleDelete}
            onToggleActive={handleToggleActive}
          />
        ))}
      </div>
      {modal && (
        <PrescriptionModal
          mode={modal.mode}
          rx={modal.rx}
          person={modal.person}
          busy={busy}
          onSave={handleSave}
          onClose={() => setModal(null)}
        />
      )}
    </div>
  );
}

function cardChipColor(name) {
  var h = 0;
  for (var i = 0; i < name.length; i++) h = (h * 31 + name.charCodeAt(i)) & 0xffff;
  return 'hsl(' + (h % 360) + ',55%,40%)';
}

function daysSince(dateStr) {
  if (!dateStr) return null;
  var d = new Date(dateStr); d.setHours(0,0,0,0);
  var today = new Date(); today.setHours(0,0,0,0);
  return Math.round((today - d) / 86400000);
}

// Dates arrive from the sheet as "yyyy-MM-dd" (what VERA writes and what
// jsonOut_ normalises Date cells to), "MM-DD" for a year-agnostic Important
// Date, or occasionally a raw ISO timestamp from a String() that ran before
// jsonOut_ saw it. All of them come out as "Sep 20, 2026"; anything that is not
// a date is returned untouched.
const MONTH_ABBR_ = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
function fmtDate(v) {
  if (v === null || v === undefined || v === '') return '';
  const s = String(v).trim();
  if (!s) return '';
  // Read yyyy-MM-dd straight from the string — building a Date from it would
  // shift the day by one for any viewer east of UTC.
  const m = s.match(/^(\d{4})-(\d{2})-(\d{2})$/);
  if (m) return MONTH_ABBR_[parseInt(m[2], 10) - 1] + ' ' + parseInt(m[3], 10) + ', ' + m[1];
  const md = s.match(/^(\d{2})-(\d{2})$/);
  if (md && parseInt(md[1], 10) >= 1 && parseInt(md[1], 10) <= 12)
    return MONTH_ABBR_[parseInt(md[1], 10) - 1] + ' ' + parseInt(md[2], 10);
  if (/\d{4}/.test(s)) {
    const d = new Date(s);
    if (!isNaN(d.getTime())) return MONTH_ABBR_[d.getMonth()] + ' ' + d.getDate() + ', ' + d.getFullYear();
  }
  return s;
}

function fmtPts(n) {
  if (n == null || n === '') return '0';
  return Number(n).toLocaleString();
}

// One label for the cheat sheet, used by BOTH the panel and the Copy button. They each
// built this string independently, which is how a fee-free card with no general-spend
// rate came to render as "Citi Double Cash (  )" in two places at once. Degrades to
// the bare card name when there is no rate to show.
function cheatLabel(r) {
  // `basis` names the category a rate came from, and only the International Travel row
  // sets it. That row ranks a card's BEST applicable rate, which may be a conditional
  // one — "4 x points" on a dining-only card next to "2 x points" on an everything card
  // reads as the better deal when it is not. Naming the basis makes the comparison
  // honest. Rows built from a single category pass no basis and are unchanged.
  var s = r.rate
    ? (r.cardName + ' (' + r.rate + ' ' + r.rateType + (r.basis ? ' · ' + r.basis : '') + ')')
    : r.cardName;
  if (r.conditions) s += ' | ' + r.conditions;
  return s;
}

function CardDetailModal({ card, rewards, perks, onClose, onAddReward, onDeleteReward, onAddPerk, onEditPerk, onDeletePerk, onTogglePerk, onClearReview, onSetPerkLastUsed, busy }) {
  const cardRewards = rewards.filter(function(r) { return r.cardName === card.cardName; });
  const cardPerks   = perks.filter(function(p) { return p.cardName === card.cardName; });
  const [newReward, setNewReward] = React.useState({ category:'', rate:'', rateType:'x points', conditions:'' });
  const blankPerk = { perk:'', amount:'', frequency:'Monthly', category:'', autopay:false, lastUsed:'' };
  const [newPerk,   setNewPerk]   = React.useState(blankPerk);
  const [editingPerkId, setEditingPerkId] = React.useState(null);
  const setRw = (k, v) => setNewReward(prev => Object.assign({}, prev, { [k]: v }));
  const setPk = (k, v) => setNewPerk(prev => Object.assign({}, prev, { [k]: v }));

  function startEditPerk(pk) {
    setEditingPerkId(pk.id);
    setNewPerk({ perk: pk.perk, amount: pk.amount != null ? String(pk.amount) : '', frequency: pk.frequency, category: pk.category || '', autopay: !!pk.autopay, lastUsed: pk.lastUsed || '' });
  }

  // Changing the cadence to a multi-year one has to drop a stamp that is not a
  // date. An Annual row leaves '2023' behind, which a date input cannot display
  // and the server rejects — the user would get an error for a field they never
  // touched. Going the other way the stamp is dropped from the request anyway,
  // since only a multi-year perk sends one.
  function setPerkFrequency(freq) {
    setNewPerk(prev => {
      const keep = perkCycleYears(freq) && /^\d{4}-\d{2}-\d{2}$/.test(String(prev.lastUsed || ''));
      return Object.assign({}, prev, { frequency: freq, lastUsed: keep ? prev.lastUsed : '' });
    });
  }
  function resetPerkForm() {
    setEditingPerkId(null);
    setNewPerk(blankPerk);
  }
  function submitPerkForm() {
    if (editingPerkId) { onEditPerk(editingPerkId, newPerk); }
    else { onAddPerk(card.cardName, newPerk); }
    resetPerkForm();
  }

  const now = new Date();
  const curMonth   = now.getFullYear() + '-' + String(now.getMonth()+1).padStart(2,'0');
  const curYear    = String(now.getFullYear());
  const curQuarter = curYear + '-Q' + (Math.floor(now.getMonth() / 3) + 1);
  const curHalf    = curYear + '-H' + (now.getMonth() < 6 ? 1 : 2);
  const todayMid   = new Date(now.getFullYear(), now.getMonth(), now.getDate());
  // For the date inputs' max: you cannot have claimed something in the future, and
  // a stray 2033 would hide the perk for a decade with no error anywhere.
  const todayIso   = curMonth + '-' + String(now.getDate()).padStart(2,'0');

  // 'Every 4 Years' -> 4, everything else -> 0. The browser cannot call Apps
  // Script, so this mirrors perkCycleYears_ (Code.js) and a test asserts the two
  // agree on every frequency.
  function perkCycleYears(freq) {
    const m = /^every\s+(\d{1,2})\s+years?$/i.exec(String(freq || '').trim());
    return m && +m[1] >= 1 ? +m[1] : 0;
  }

  // The day a use-anchored credit comes back: the 'yyyy-MM-dd' anchor plus N years.
  function perkEligibleFrom(lastUsed, years) {
    const m = /^(\d{4})-(\d{2})-(\d{2})$/.exec(String(lastUsed || '').trim());
    if (!m || !years) return null;
    const y = +m[1], mo = +m[2], d = +m[3];
    const a = new Date(y, mo - 1, d);
    if (a.getFullYear() !== y || a.getMonth() !== mo - 1 || a.getDate() !== d) return null;
    let from = new Date(y + years, mo - 1, d);
    if (from.getMonth() !== mo - 1) from = new Date(y + years, mo, 0); // Feb 29 -> Feb 28
    from.setHours(0, 0, 0, 0);
    return from;
  }

  function isPerkUsed(perk) {
    // A standing benefit has no period, so "used this month" is meaningless.
    // Without this it falls through to the monthly comparison and always reads
    // "Not used this month".
    if (perk.frequency === 'Standing') return false;
    if (!perk.lastUsed) return false;
    // Use-anchored: a RANGE test from the anchor, not an equality test against a
    // key derived from today. Comparing years alone would report a credit used in
    // Dec 2023 as available on 1 Jan 2027 — eleven months early, which for Global
    // Entry is a rejected application and a lost fee.
    const yrs = perkCycleYears(perk.frequency);
    if (yrs) {
      const from = perkEligibleFrom(perk.lastUsed, yrs);
      return from ? todayMid < from : false;
    }
    if (perk.frequency === 'Annual') return perk.lastUsed === curYear;
    if (perk.frequency === 'Semiannual') return perk.lastUsed === curHalf;
    if (perk.frequency === 'Quarterly') return perk.lastUsed === curQuarter;
    return perk.lastUsed === curMonth;
  }

  function fmtPerkDay(d) {
    return d ? d.toLocaleDateString(undefined, { month:'short', day:'numeric', year:'numeric' }) : '';
  }

  // The line under a perk. A multi-year perk cannot say "not used this month" —
  // its period runs from the last use, so the only honest line names the dates.
  function perkStatusLabel(perk, used) {
    const yrs = perkCycleYears(perk.frequency);
    if (yrs) {
      if (!perk.lastUsed) return 'Never claimed · once every ' + yrs + ' years';
      const from = perkEligibleFrom(perk.lastUsed, yrs);
      if (!from) return 'Last Used needs a date (yyyy-mm-dd)';
      return used ? 'Used ' + perk.lastUsed + ' · available ' + fmtPerkDay(from)
                  : 'Available now · last used ' + perk.lastUsed;
    }
    const per = perk.frequency === 'Annual' ? 'this year'
              : perk.frequency === 'Semiannual' ? 'this half'
              : perk.frequency === 'Quarterly' ? 'this quarter' : 'this month';
    return (used ? 'Used ' : 'Not used ') + per;
  }

  // One section per entry, and anything not listed renders nowhere at all — a
  // frequency missing here makes the perk invisible with no error. Which is why
  // the filter below groups through perkGroupOf rather than comparing the
  // frequency string directly: 'Every 4 Years' carries a number, so no fixed list
  // of literals could ever contain it.
  function perkGroupOf(freq) {
    return perkCycleYears(freq) ? 'Multi-year' : String(freq || 'Monthly');
  }
  const perkGroups = ['Monthly', 'Quarterly', 'Semiannual', 'Annual', 'Multi-year', 'Standing'];

  const panelStyle = { background:'#161926', border:'1px solid #2a2f45', borderRadius:10, padding:16, marginBottom:16 };
  const inputStyle = { background:'#161926', color:'#dde1f0', border:'1px solid #2a2f45', borderRadius:6, padding:'5px 8px', fontSize:12 };

  return (
    <div style={{ position:'fixed', inset:0, background:'rgba(0,0,0,0.7)', zIndex:1000, display:'flex', alignItems:'center', justifyContent:'center', padding:16 }}>
      <div style={{ background:'#1e2235', border:'1px solid #2a2f45', borderRadius:14, padding:24, width:'100%', maxWidth:600, maxHeight:'90vh', overflowY:'auto' }}>
        <div style={{ display:'flex', justifyContent:'space-between', alignItems:'center', marginBottom:6 }}>
          <h3 style={{ margin:0, color:'#dde1f0' }}>{card.cardName}</h3>
          <button onClick={onClose} style={{ background:'none', border:'none', color:'#a0a8c0', fontSize:20, cursor:'pointer' }}>×</button>
        </div>
        <div style={{ display:'flex', gap:10, marginBottom:16, flexWrap:'wrap' }}>
          <span style={{ fontSize:12, color:'#a0a8c0' }}>
            <span style={{ color:'#6b7280' }}>Primary: </span>{card.owner}
          </span>
          {card.authUser && (
            <span style={{ fontSize:12, color:'#a0a8c0' }}>
              <span style={{ color:'#6b7280' }}>Auth User: </span>{card.authUser}
            </span>
          )}
          {card.annualFee != null && (
            <span style={{ fontSize:12, color:'#a0a8c0' }}>
              <span style={{ color:'#6b7280' }}>Annual Fee: </span>{card.annualFee === 0 ? 'None' : '$' + card.annualFee}
            </span>
          )}
          {card.creditLimit != null && card.creditLimit !== '' && (
            <span style={{ fontSize:12, color:'#a0a8c0' }}>
              <span style={{ color:'#6b7280' }}>Credit Limit: </span>{'$' + Number(card.creditLimit).toLocaleString()}
            </span>
          )}
        </div>

        {/* Rewards */}
        <div style={panelStyle}>
          <div style={{ fontWeight:700, fontSize:13, color:'#dde1f0', marginBottom:10 }}>💰 Reward Categories</div>
          {cardRewards.length === 0
            ? <div style={{ fontSize:12, color:'#6b7280', marginBottom:10 }}>No reward categories yet.</div>
            : <table style={{ width:'100%', fontSize:12, borderCollapse:'collapse', marginBottom:10 }}>
                <thead>
                  <tr>{['Category','Rate','Type','Conditions',''].map(h => (
                    <th key={h} style={{ textAlign:'left', color:'#6b7280', padding:'4px 8px 4px 0', borderBottom:'1px solid #2a2f45' }}>{h}</th>
                  ))}</tr>
                </thead>
                <tbody>
                  {cardRewards.map(r => (
                    <tr key={r.id}>
                      <td style={{ padding:'4px 8px 4px 0', color:'#dde1f0' }}>{r.category}</td>
                      <td style={{ padding:'4px 8px 4px 0', color:'#4f6ef7', fontWeight:600 }}>{r.rate}</td>
                      <td style={{ padding:'4px 8px 4px 0', color:'#a0a8c0' }}>{r.rateType}</td>
                      <td style={{ padding:'4px 8px 4px 0', color:'#6b7280', fontSize:11 }}>{r.conditions}</td>
                      <td><button onClick={() => onDeleteReward(r.id)} disabled={busy}
                        style={{ background:'none', border:'none', color:'#ef4444', cursor:'pointer', fontSize:14 }}>×</button></td>
                    </tr>
                  ))}
                </tbody>
              </table>
          }
          <div style={{ display:'flex', gap:6, flexWrap:'wrap', alignItems:'center' }}>
            <input placeholder="Category" value={newReward.category} onChange={e => setRw('category', e.target.value)}
              style={Object.assign({}, inputStyle, { width:110 })} />
            <input placeholder="Rate" value={newReward.rate} onChange={e => setRw('rate', e.target.value)}
              style={Object.assign({}, inputStyle, { width:55 })} />
            <select value={newReward.rateType} onChange={e => setRw('rateType', e.target.value)} style={inputStyle}>
              <option>x points</option><option>% cashback</option><option>x miles</option>
            </select>
            <input placeholder="Conditions (optional)" value={newReward.conditions} onChange={e => setRw('conditions', e.target.value)}
              style={Object.assign({}, inputStyle, { flex:1, minWidth:100 })} />
            <button onClick={() => { onAddReward(card.cardName, newReward); setNewReward({ category:'', rate:'', rateType:'x points', conditions:'' }); }}
              disabled={busy || !newReward.category || !newReward.rate}
              style={{ background:'#4f6ef7', color:'#fff', border:'none', borderRadius:6, padding:'5px 12px', cursor:'pointer', fontSize:12 }}>＋ Add</button>
          </div>
        </div>

        {/* Perks */}
        <div style={panelStyle}>
          <div style={{ fontWeight:700, fontSize:13, color:'#dde1f0', marginBottom:10 }}>🎁 Perks</div>
          {perkGroups.map(function(freq) {
            var grp = cardPerks.filter(function(p) { return perkGroupOf(p.frequency) === freq; });
            if (!grp.length) return null;
            return (
              <div key={freq} style={{ marginBottom:10 }}>
                <div style={{ fontSize:11, color:'#6b7280', marginBottom:4 }}>{freq}</div>
                {grp.map(function(pk) {
                  var used = isPerkUsed(pk);
                  return (
                    <div key={pk.id} style={{ display:'flex', alignItems:'center', gap:8, marginBottom:4 }}>
                      {pk.autopay ? (
                        <span title="On autopay — excluded from used/unused tracking"
                          style={{ fontSize:10, fontWeight:700, color:'#93c5fd', background:'#1e3a5f', borderRadius:4, padding:'2px 6px', flexShrink:0 }}>
                          🔁 Autopay
                        </span>
                      ) : pk.frequency === 'Standing' ? (
                        <span title="Always available — nothing to use up, so no expiry tracking"
                          style={{ fontSize:10, fontWeight:700, color:'#86efac', background:'#14532d', borderRadius:4, padding:'2px 6px', flexShrink:0 }}>
                          ♾️ Standing
                        </span>
                      ) : perkCycleYears(pk.frequency) ? (
                        // No checkbox for a use-anchored perk: the exact DAY is what the
                        // next cycle is measured from, so a one-click "today" is the wrong
                        // control. Clearing the box clears the cell.
                        <input type="date" value={/^\d{4}-\d{2}-\d{2}$/.test(String(pk.lastUsed || '')) ? pk.lastUsed : ''}
                          max={todayIso} disabled={busy}
                          onChange={e => onSetPerkLastUsed(pk.id, e.target.value)}
                          title="The day you claimed this credit — the next cycle is counted from here"
                          style={{ background:'#161926', color:'#dde1f0', border:'1px solid #2a2f45', borderRadius:4, padding:'1px 4px', fontSize:11, flexShrink:0 }} />
                      ) : (
                        <button onClick={() => onTogglePerk(pk.id)} disabled={busy}
                          style={{ width:18, height:18, borderRadius:4, border:'2px solid ' + (used ? '#22c55e' : '#374151'),
                            background: used ? '#166534' : 'transparent', cursor:'pointer', flexShrink:0 }}>
                          {used ? <span style={{ color:'#86efac', fontSize:11, lineHeight:'14px' }}>✓</span> : null}
                        </button>
                      )}
                      <span style={{ fontSize:13, color: used ? '#86efac' : '#dde1f0' }}>{pk.perk}</span>
                      {pk.amount && <span style={{ fontSize:11, color:'#a0a8c0' }}>${pk.amount}</span>}
                      {!pk.autopay && pk.frequency !== 'Standing' && (
                        <span style={{ fontSize:11, color: used ? '#22c55e' : '#6b7280' }}>
                          {perkStatusLabel(pk, used)}
                        </span>
                      )}
                      {pk.needsReview && (
                        <span title="VERA couldn't confirm this benefit is still current — review the terms, then clear this flag."
                          style={{ background:'#78350f', color:'#fcd34d', fontSize:10, fontWeight:700, borderRadius:4, padding:'2px 6px', display:'flex', alignItems:'center', gap:4 }}>
                          ⚠ Needs Review
                          <button onClick={() => onClearReview(pk.id)} disabled={busy}
                            style={{ background:'none', border:'none', color:'#fcd34d', cursor:'pointer', fontSize:11, padding:0, lineHeight:1 }}>×</button>
                        </span>
                      )}
                      <button onClick={() => startEditPerk(pk)} disabled={busy} title="Edit"
                        style={{ background:'none', border:'none', color:'#a0a8c0', cursor:'pointer', fontSize:12, marginLeft:'auto' }}>✏️</button>
                      <button onClick={() => onDeletePerk(pk.id)} disabled={busy}
                        style={{ background:'none', border:'none', color:'#ef4444', cursor:'pointer', fontSize:14, marginLeft:'auto' }}>×</button>
                    </div>
                  );
                })}
              </div>

function CardsTab({ apiUrl, apiToken }) {
  const [cards,     setCards]     = React.useState([]);
  const [rewards,   setRewards]   = React.useState([]);
  const [perks,     setPerks]     = React.useState([]);
  const [programs,  setPrograms]  = React.useState([]);
  const [goals,     setGoals]     = React.useState([]);
  const [loading,   setLoading]   = React.useState(true);
  const [busy,      setBusy]      = React.useState(false);
  const [error,     setError]     = React.useState('');
  const [ownerFilter, setOwnerFilter] = React.useState('all');
  const [modal,     setModal]     = React.useState(null); // { type, data }

  async function load() {
    setLoading(true); setError('');
    try {
      const res = await apiGet(apiUrl, apiToken, { action: 'cards' });
      setCards(res.cards || []);
      setRewards(res.rewards || []);
      setPerks(res.perks || []);
      setPrograms(res.programs || []);
      setGoals(res.goals || []);
    } catch (err) { setError('Could not load cards: ' + err.message); }
    setLoading(false);
  }

  React.useEffect(() => { load(); }, []);

  const visibleCards = React.useMemo(() => {
    if (ownerFilter === 'all') return cards;
    return cards.filter(function(c) {
      return c.owner === ownerFilter || c.authUser === ownerFilter;
    });
  }, [cards, ownerFilter]);

  const cheatSheet = React.useMemo(() => {
    var visibleNames = new Set(visibleCards.filter(function(c) { return c.active === 'Yes'; }).map(function(c) { return c.cardName; }));
    var byCat = {};
    rewards.forEach(function(r) {
      if (!visibleNames.has(r.cardName)) return;
      if (!byCat[r.category]) byCat[r.category] = [];
      byCat[r.category].push(r);
    });
    var result = [];
    Object.keys(byCat).sort().forEach(function(cat) {
      var sorted = byCat[cat].slice().sort(function(a, b) { return parseFloat(b.rate) - parseFloat(a.rate); });
      result.push({ category: cat, top: sorted.slice(0, 2) });
    });

    // ---- INTERNATIONAL TRAVEL: a RESERVED category ------------------------------
    //
    // This row is built from the CARD LIST, never from byCat. That is the whole point,
    // and it is the fix for a shipped bug: byCat groups reward rows by their free-text
    // category and is gated only on the card being active — it never looks at noFxFee.
    // Category is a free-text field, so 'International Travel' is also typeable as an
    // ordinary reward row, and before the flag existed that was HOW you recorded "use
    // this card abroad". Those rows then landed in byCat, and the old merge was
    //
    //     existing.top = existing.top.concat(intl).slice(0, 2);
    //
    // so two typed entries filled both slots, the correctly-filtered cards were appended
    // behind them, and slice(0,2) threw every one away. The row ended up listing exactly
    // the cards that DO charge a foreign transaction fee. It was silent because
    // cheatLabel formats a typed row and a derived entry identically. Worse, the whole
    // reconciliation sat inside `if (intl.length)`, so with nothing marked a typed row
    // rendered alone — the one case the row is supposed to be absent.
    //
    // Deleting the byCat row and rebuilding from the cards makes the leak impossible
    // rather than guarded against. Matched on a NORMALISED category, because an exact
    // === let 'international travel' or a trailing space make a second, visually
    // identical row that escaped every check.
    var isIntlCat = function(cat) {
      return String(cat).trim().toLowerCase() === 'international travel';
    };
    result = result.filter(function(row) { return !isIntlCat(row.category); });

    // Each qualifying card contributes ONE entry, from the best basis available to it.
    // Tier beats rate, and that ordering is the point: a card earning 2x on EVERYTHING
    // abroad beats one earning 4x on dining only. cheatLabel renders the basis, so a
    // conditional rate never reads as an unconditional one.
    //   1  the card's own typed 'International Travel' row — the user said so outright
    //   2  General Spend / Everything Else — applies to any purchase abroad
    //   3  a category whose name hints at travel — conditional, so always shown WITH it
    //   4  nothing — still listed, it is still free to use abroad
    var GENERAL_SPEND_CATS = { 'General Spend': 1, 'Everything Else': 1 };
    // Keyword-matched against free text, which is a heuristic: 'HOTELS (PREPAID)' and
    // 'IHG HOTELS' match, 'ONLINE GROCERIES' and 'RENT' do not. Acceptable ONLY because
    // the category is rendered beside the rate — a questionable match is then visible
    // rather than silently inflating what a card looks worth abroad.
    var ABROAD_HINTS = ['travel', 'hotel', 'flight', 'airfare', 'dining', 'restaurant', 'transit'];
    var abroadHinted = function(cat) {
      var c = String(cat).trim().toLowerCase();
      return ABROAD_HINTS.some(function(h) { return c.indexOf(h) !== -1; });
    };

    var intl = (visibleCards || [])
      .filter(function(c) { return c.active === 'Yes' && c.noFxFee; })
      .map(function(c) {
        var pick = null;   // { tier, row }
        rewards.forEach(function(r) {
          if (r.cardName !== c.cardName) return;
          var tier = isIntlCat(r.category) ? 1
                   : GENERAL_SPEND_CATS[r.category] ? 2
                   : abroadHinted(r.category) ? 3
                   : 0;
          if (!tier) return;
          if (!pick || tier < pick.tier ||
              (tier === pick.tier && parseFloat(r.rate) > parseFloat(pick.row.rate))) {
            pick = { tier: tier, row: r };
          }
        });
        if (!pick) return { cardName: c.cardName, rate: '', rateType: '', conditions: '', tier: 4, basis: '' };
        return {
          cardName: c.cardName, rate: pick.row.rate, rateType: pick.row.rateType,
          conditions: pick.row.conditions, tier: pick.tier,
          // Tiers 1 and 2 already mean "applies to what you are buying", so naming them
          // would be noise. Tier 3 is the conditional one and must say so.
          basis: pick.tier === 3 ? String(pick.row.category).trim().toLowerCase() : '',
        };
      })
      .sort(function(a, b) {
        if (a.tier !== b.tier) return a.tier - b.tier;
        var ar = parseFloat(a.rate), br = parseFloat(b.rate);
        if (isNaN(ar) && isNaN(br)) return a.cardName.localeCompare(b.cardName);
        if (isNaN(ar)) return 1;
        if (isNaN(br)) return -1;
        return br - ar;
      });

    // Unconditional: no qualifying card means NO ROW, not a stale one left behind.
    if (intl.length) {
      result.push({ category: 'International Travel', top: intl.slice(0, 2) });
      result.sort(function(a, b) { return a.category.localeCompare(b.category); });
    }
    return result;
  }, [rewards, visibleCards]);

  function copyCheatSheet() {
    var now = new Date();
    var monthName = now.toLocaleString('default', { month: 'long', year: 'numeric' });
    var lines = ['💳 Ahmed & Victoria\'s Card Cheat Sheet – ' + monthName];
    cheatSheet.forEach(function(row) {
      var cardStrs = row.top.map(cheatLabel).join(' / ');
      lines.push(row.category.padEnd(18) + '→ ' + cardStrs);
    });
    if (navigator.clipboard) {
      navigator.clipboard.writeText(lines.join('\n'));
    }
  }

  async function handleSaveCard(form) {
    setBusy(true);
    try {
      var params = Object.assign({ action: modal.data ? 'update_card' : 'add_card' }, form);
      if (modal.data) params.id = modal.data.id;
      await apiGet(apiUrl, apiToken, params);
      setModal(null);
      await load();
    } catch (err) { setError('Save failed: ' + err.message); }
    setBusy(false);
  }

  // A one-field update_card, so it rides the route that already runs
  // ensureCreditCardSchema_ — the first toggle on a 13-column sheet widens it to 14 and
  // writes the 'No FX Fee' header before storing anything.
  //
  // Toggles the EFFECTIVE value: an unset card has noFxFee === false, so the first click
  // writes 'Yes', which is the intent when working through which cards are fee-free.
  async function handleToggleFx(c) {
    setBusy(true);
    try {
      await apiGet(apiUrl, apiToken,
        { action: 'update_card', id: c.id, noFxFee: c.noFxFee ? 'No' : 'Yes' });
      await load();
    } catch (err) { setError('Could not update the FX flag: ' + err.message); }
    setBusy(false);
  }

  async function handleDeleteCard(id) {
    if (!confirm('Delete this card and all its rewards/perks?')) return;
    setBusy(true);
    try {
      await apiGet(apiUrl, apiToken, { action: 'delete_card', id });
      await load();
    } catch (err) { setError('Delete failed: ' + err.message); }
    setBusy(false);
  }

  async function handleAddReward(cardName, r) {
    setBusy(true);
    try {
      await apiGet(apiUrl, apiToken, { action: 'add_card_reward', cardName, category: r.category, rate: r.rate, rateType: r.rateType, conditions: r.conditions || '' });
      await load();
    } catch (err) { setError('Add reward failed: ' + err.message); }
    setBusy(false);
  }

  async function handleDeleteReward(id) {
    setBusy(true);
    try {
      await apiGet(apiUrl, apiToken, { action: 'delete_card_reward', id });
      await load();
    } catch (err) { setError('Delete reward failed: ' + err.message); }
    setBusy(false);
  }

  async function handleAddPerk(cardName, pk) {
    setBusy(true);
    try {
      await apiGet(apiUrl, apiToken, { action: 'add_card_perk', cardName, perk: pk.perk, amount: pk.amount || '', frequency: pk.frequency, category: pk.category || '', autopay: pk.autopay ? 'yes' : '', lastUsed: pk.lastUsed || '' });
      await load();
    } catch (err) { setError('Add perk failed: ' + err.message); }
    setBusy(false);
  }

  // autopaySet and lastUsedSet exist because makeUrl drops falsy values, so a blank
  // never reaches the server and reads as "leave this field alone". Without the
  // flags, un-checking Autopay and clearing a date are both silent no-ops.
  async function handleEditPerk(id, pk) {
    setBusy(true);
    try {
      await apiGet(apiUrl, apiToken, { action: 'update_card_perk', id, perk: pk.perk, amount: pk.amount || '', frequency: pk.frequency, category: pk.category || '', autopay: pk.autopay ? 'yes' : '', autopaySet: 'yes', lastUsed: pk.lastUsed || '', lastUsedSet: 'yes' });
      await load();
    } catch (err) { setError('Edit perk failed: ' + err.message); }
    setBusy(false);
  }

  // The inline date box on a multi-year perk row. Goes through the SAME action as
  // the edit form, so there is exactly one write path to that cell — two of them is
  // how the toggle and the marker drifted apart before. No frequency is sent, so
  // the server validates against the row's own.
  async function handleSetPerkLastUsed(id, value) {
    setBusy(true);
    try {
      await apiGet(apiUrl, apiToken, { action: 'update_card_perk', id, lastUsed: value || '', lastUsedSet: 'yes' });
      await load();
    } catch (err) { setError('Set last claimed failed: ' + err.message); }
    setBusy(false);
  }

  async function handleDeletePerk(id) {
    setBusy(true);
    try {
      await apiGet(apiUrl, apiToken, { action: 'delete_card_perk', id });
      await load();
    } catch (err) { setError('Delete perk failed: ' + err.message); }
    setBusy(false);
  }

  async function handleTogglePerk(id) {
    const now = new Date();
    const curMonth   = now.getFullYear() + '-' + String(now.getMonth() + 1).padStart(2, '0');
    const curYear    = String(now.getFullYear());
    const curQuarter = curYear + '-Q' + (Math.floor(now.getMonth() / 3) + 1);
  const curHalf    = curYear + '-H' + (now.getMonth() < 6 ? 1 : 2);
    let prevPerks = null;
    // Optimistic update — flip locally right away so the checkbox responds
    // instantly, then reconcile with the server in the background.
    setPerks(function(prev) {
      prevPerks = prev;
      return prev.map(function(p) {
        if (p.id !== id) return p;
        const period = p.frequency === 'Annual' ? curYear : p.frequency === 'Semiannual' ? curHalf : p.frequency === 'Quarterly' ? curQuarter : curMonth;
        return Object.assign({}, p, { lastUsed: p.lastUsed === period ? '' : period });
      });
    });
    try {
      await apiGet(apiUrl, apiToken, { action: 'toggle_card_perk', id });
    } catch (err) {
      setError('Toggle perk failed: ' + err.message);
      if (prevPerks) setPerks(prevPerks);
    }
  }

  async function handleClearReview(id) {
    setBusy(true);
    try {
      await apiGet(apiUrl, apiToken, { action: 'clear_perk_review', id });
      await load();
    } catch (err) { setError('Clear review failed: ' + err.message); }
    setBusy(false);
  }

  async function handleSaveProgram(form) {

    try {
      var params = Object.assign({ action: modal.data ? 'update_loyalty_program' : 'add_loyalty_program' }, form);
      if (modal.data) params.id = modal.data.id;
      await apiGet(apiUrl, apiToken, params);
      setModal(null);
      await load();
    } catch (err) { setError('Save failed: ' + err.message); }
    setBusy(false);
  }

  async function handleDeleteProgram(id) {

    setBusy(true);

    catch (err) { setError('Delete failed: ' + err.message); }

      if (modal.data) params.id = modal.data.id;

      setModal(null);

    } catch (err) { setError('Save failed: ' + err.message); }
    setBusy(false);
  }

  async function handleDeleteGoal(id) {
