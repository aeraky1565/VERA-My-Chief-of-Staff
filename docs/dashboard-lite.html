<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>VERA — Shopping</title>
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: #080f1e;
      color: #dde1f0;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif;
      min-height: 100vh;
    }

    /* ---- Scrollbar ---- */
    ::-webkit-scrollbar { width: 6px; }
    ::-webkit-scrollbar-track { background: #0d1b3e; }
    ::-webkit-scrollbar-thumb { background: #2a3a5e; border-radius: 3px; }

    /* ---- Header ---- */
    .header {
      background: linear-gradient(135deg, #0d1b3e 0%, #152547 100%);
      border-bottom: 1px solid #1e3060;
      padding: 0 28px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      height: 60px;
      position: sticky;
      top: 0;
      z-index: 100;
    }
    .logo { display: flex; align-items: baseline; gap: 10px; }
    .logo-name {
      font-size: 22px;
      font-weight: 800;
      letter-spacing: 4px;
      color: #fff;
    }
    .logo-sub {
      font-size: 10px;
      letter-spacing: 2px;
      color: #c9a84c;
      text-transform: uppercase;
    }
    .header-actions { display: flex; align-items: center; gap: 8px; }

    /* ---- Buttons ---- */
    .btn {
      border: none;
      border-radius: 6px;
      cursor: pointer;
      font-size: 12px;
      font-weight: 600;
      padding: 6px 14px;
      transition: opacity .15s, transform .1s;
    }
    .btn:hover  { opacity: 0.85; transform: translateY(-1px); }
    .btn:active { transform: translateY(0); }
    .btn:disabled { opacity: 0.4; cursor: not-allowed; transform: none; }
    .btn-primary  { background: #c9a84c; color: #0d1b3e; }
    .btn-ghost    { background: #13244d; color: #8a9abf; }
    .btn-refresh  { background: #13244d; border: 1px solid #1e3060; color: #8a9abf; }
    .btn-settings { background: none; border: none; color: #6b7fa8; cursor: pointer; font-size: 18px; padding: 4px 8px; }
    .btn-settings:hover { color: #c9a84c; }

    /* ---- Modal ---- */
    .modal-overlay {
      background: rgba(0,0,0,0.75);
      bottom: 0; left: 0; right: 0; top: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      position: fixed;
      z-index: 200;
    }
    .modal {
      background: #0d1b3e;
      border: 1px solid #1e3060;
      border-radius: 14px;
      padding: 32px;
      width: 480px;
      max-width: 95vw;
    }
    .modal h2 { color: #fff; font-size: 18px; margin-bottom: 6px; }
    .modal p  { color: #6b7fa8; font-size: 13px; margin-bottom: 24px; }
    .form-group  { margin-bottom: 16px; }
    .form-label  { color: #8a9abf; display: block; font-size: 12px; font-weight: 700; letter-spacing: 0.5px; margin-bottom: 6px; text-transform: uppercase; }
    .form-input  {
      background: #13244d;
      border: 1px solid #1e3060;
      border-radius: 8px;
      color: #e8ecf8;
      font-family: monospace;
      font-size: 13px;
      outline: none;
      padding: 10px 14px;
      transition: border-color .15s;
      width: 100%;
    }
    .form-input:focus { border-color: #c9a84c; }
    .form-hint   { color: #4d6080; font-size: 11px; margin-top: 4px; }
    .modal-actions { display: flex; gap: 10px; justify-content: flex-end; margin-top: 24px; }

    /* ---- Feedback states ---- */
    .empty-state {
      background: #0d1b3e;
      border: 1px dashed #1e3060;
      border-radius: 10px;
      color: #4d6080;
      font-size: 14px;
      padding: 48px;
      text-align: center;
    }
    .error-banner {
      background: #3d1515;
      border: 1px solid #e53935;
      border-radius: 8px;
      color: #ff8a80;
      font-size: 13px;
      margin-bottom: 16px;
      padding: 12px 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }
    .error-dismiss {
      background: none;
      border: none;
      color: #ff8a80;
      cursor: pointer;
      font-size: 16px;
      flex-shrink: 0;
      padding: 0 4px;
    }

    /* ---- Toast ---- */
    .toast {
      position: fixed;
      bottom: 28px;
      right: 28px;
      background: #0f3020;
      border: 1px solid #43a047;
      border-radius: 10px;
      color: #69f0ae;
      font-size: 14px;
      font-weight: 600;
      padding: 14px 22px;
      z-index: 300;
      box-shadow: 0 4px 20px rgba(0,0,0,0.5);
      animation: slideUp 0.2s ease;
    }
    .toast.error { background: #3d1515; border-color: #e53935; color: #ff8a80; }
    @keyframes slideUp {
      from { opacity: 0; transform: translateY(12px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    /* ---- Responsive ---- */
    @media (max-width: 768px) {
      .header { padding: 0 16px; }
    }
    @media (max-width: 480px) {
      .header { padding: 0 12px; height: 54px; }
      .logo-sub { display: none; }
      .modal { padding: 20px; border-radius: 10px; }
    }

    /* ---- Chat ---- */
    .chat-wrap { display: flex; flex-direction: column; height: calc(100vh - 200px); min-height: 400px; }
    .chat-messages { flex: 1; overflow-y: auto; padding: 16px 0; display: flex; flex-direction: column; gap: 10px; }
    .chat-msg { max-width: 80%; padding: 10px 14px; border-radius: 12px; font-size: 14px; line-height: 1.5; white-space: pre-wrap; word-break: break-word; }
    .chat-msg.user { align-self: flex-end; background: #1a3a6e; color: #dde1f0; border-bottom-right-radius: 4px; }
    .chat-msg.vera { align-self: flex-start; background: #0d1b3e; border: 1px solid #1e3060; color: #dde1f0; border-bottom-left-radius: 4px; }
    .chat-msg.vera.vera-typing { color: #6b7fa8; font-style: italic; }
    .chat-input-area { padding-top: 12px; border-top: 1px solid #1e3060; }
    .chat-input-row { display: flex; gap: 8px; align-items: flex-end; }
    .chat-input { flex: 1; background: #0d1b3e; border: 1px solid #1e3060; border-radius: 10px; color: #dde1f0; font-size: 14px; font-family: inherit; padding: 10px 14px; resize: none; outline: none; transition: border-color .15s; }
    .chat-input:focus { border-color: #c9a84c; }
    .chat-input::placeholder { color: #3d5280; }
    .chat-send { background: #c9a84c; border: none; border-radius: 8px; color: #0d1b3e; cursor: pointer; font-size: 18px; font-weight: 700; padding: 10px 14px; transition: opacity .15s; flex-shrink: 0; }
    .chat-send:hover:not(:disabled) { opacity: 0.85; }
    .chat-send:disabled { opacity: 0.4; cursor: not-allowed; }
    .subtab-row { display:flex; gap:8px; margin-bottom:18px; flex-wrap:wrap; }
    .subtab-btn { background:none; border:1px solid #1e3060; border-radius:20px; color:#6b7fa8;
                  font-size:12px; padding:5px 14px; cursor:pointer;
                  transition:border-color .15s, color .15s; white-space:nowrap; }
    .subtab-btn:hover  { border-color:#3d5fa0; color:#c9d9ff; }
    .subtab-btn.active { border-color:#c9a84c; color:#c9a84c; background:rgba(201,168,76,.08); }
  </style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
const { useState, useEffect, useRef } = React;

// ---- Helpers ----------------------------------------------------------------

function stored(key, fallback = '') {
  return localStorage.getItem(key) || fallback;
}

function makeUrl(base, token, params = {}) {
  const url = new URL(base);
  url.searchParams.set('token', token);
  Object.entries(params).forEach(([k, v]) => { if (v) url.searchParams.set(k, v); });
  return url.toString();
}

async function apiGet(apiUrl, token, params) {
  const res = await fetch(makeUrl(apiUrl, token, params));
  const json = await res.json();
  if (!json.ok) throw new Error(json.error || 'API error');
  return json;
}

// All write operations use GET to avoid CORS preflight from file:// origin
async function apiAction(apiUrl, token, action, params) {
  return apiGet(apiUrl, token, Object.assign({ action }, params));
}

// POST without Content-Type → simple CORS request (no preflight)
async function apiPost(apiUrl, token, body) {
  const url = new URL(apiUrl);
  url.searchParams.set('token', token);
  const res = await fetch(url.toString(), { method: 'POST', body: JSON.stringify(body) });
  const json = await res.json();
  if (!json.ok) throw new Error(json.error || 'API error');
  return json;
}

// Resize image File to maxDim on longest side, re-encode as JPEG @ 85%
function resizeImage(file, maxDim = 1600) {
  return new Promise(resolve => {
    const img = new Image();
    const blobUrl = URL.createObjectURL(file);
    img.onload = () => {
      const scale = Math.min(1, maxDim / Math.max(img.width, img.height));
      const w = Math.round(img.width * scale), h = Math.round(img.height * scale);
      const canvas = document.createElement('canvas');
      canvas.width = w; canvas.height = h;
      canvas.getContext('2d').drawImage(img, 0, 0, w, h);
      URL.revokeObjectURL(blobUrl);
      const dataUrl = canvas.toDataURL('image/jpeg', 0.85);
      resolve({ base64: dataUrl.split(',')[1], mimeType: 'image/jpeg' });
    };
    img.src = blobUrl;
  });
}

// ---- Settings modal ---------------------------------------------------------

function SettingsModal({ initial, onSave, onClose }) {
  const [url, setUrl]     = useState(initial.url);
  const [token, setToken] = useState(initial.token);

  function save() {
    const u = url.trim();
    const t = token.trim();
    if (!u || !t) return;
    localStorage.setItem('vera_url', u);
    localStorage.setItem('vera_token', t);
    onSave(u, t);
  }

  return (
    <div className="modal-overlay" onClick={e => e.target === e.currentTarget && onClose && onClose()}>
      <div className="modal">
        <h2>⚙️ Connect to VERA API</h2>
        <p>Enter your Apps Script Web App URL and the token from Script Properties.</p>

        <div className="form-group">
          <label className="form-label">Web App URL</label>
          <input
            className="form-input"
            placeholder="https://script.google.com/macros/s/.../exec"
            value={url}
            onChange={e => setUrl(e.target.value)}
          />
        </div>

        <div className="form-group">
          <label className="form-label">VERA_WEB_TOKEN</label>
          <input
            className="form-input"
            placeholder="vera-b479..."
            type="password"
            value={token}
            onChange={e => setToken(e.target.value)}
          />
          <div className="form-hint">Set in Apps Script → Project Settings → Script Properties</div>
        </div>

        <div className="modal-actions">
          {onClose && <button className="btn btn-ghost" onClick={onClose}>Cancel</button>}
          <button className="btn btn-primary" onClick={save} disabled={!url.trim() || !token.trim()}>
            Connect
          </button>
        </div>
      </div>
    </div>
  );
}

// ---- Chat tab ---------------------------------------------------------------

function ChatLiteView({ apiUrl, apiToken }) {
  const [messages, setMessages] = useState(function() {
    try {
      var saved = localStorage.getItem('vera_lite_chat');
      return saved ? JSON.parse(saved) : [];
    } catch(e) { return []; }
  });
  const [input,   setInput]   = useState('');
  const [loading, setLoading] = useState(false);
  const bottomRef = useRef(null);

  useEffect(function() {
    if (bottomRef.current) bottomRef.current.scrollIntoView({ behavior: 'smooth' });
  }, [messages]);

  useEffect(function() {
    try {
      localStorage.setItem('vera_lite_chat', JSON.stringify(messages.slice(-80)));
    } catch(e) {}
  }, [messages]);

  async function send() {
    const text = input.trim();
    if (!text || loading) return;
    setInput('');
    setMessages(function(prev) { return [...prev, { role: 'user', text: text }]; });
    setLoading(true);
    try {
      const data = await apiGet(apiUrl, apiToken, { action: 'chat', message: text, session: 'victoria_dashboard' });
      setMessages(function(prev) { return [...prev, { role: 'vera', text: data.reply }]; });
    } catch(e) {
      setMessages(function(prev) { return [...prev, { role: 'vera', text: '\u26a0 Error: ' + e.message }]; });
    }
    setLoading(false);
  }

  function handleKey(e) {
    if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); send(); }
  }

  return (
    <div className="chat-wrap">
      <div className="chat-messages">
        {messages.length === 0 && (
          <div style={{ color: '#4d6080', fontSize: 14, textAlign: 'center', padding: '40px 20px' }}>
            <div style={{ fontSize: 28, marginBottom: 10 }}>💬</div>
            Ask VERA about home, travel, upcoming dates…
          </div>
        )}
        {messages.map(function(m, i) {
          return (
            <div key={i} className={'chat-msg ' + m.role}>
              {m.text}
            </div>
          );
        })}
        {loading && <div className="chat-msg vera vera-typing">VERA is thinking…</div>}
        <div ref={bottomRef} />
      </div>
      <div className="chat-input-area">
        <div className="chat-input-row">
          <textarea
            className="chat-input"
            rows={2}
            placeholder="Ask VERA about home, travel, upcoming dates…"
            value={input}
            onChange={function(e) { setInput(e.target.value); }}
            onKeyDown={handleKey}
            disabled={loading || !apiUrl || !apiToken}
          />
          <button className="chat-send" onClick={send} disabled={loading || !input.trim() || !apiUrl || !apiToken}>
            ↑
          </button>
        </div>
      </div>
    </div>
  );
}

// ---- Log Run Modal ----------------------------------------------------------

function LogRunModal({ store, checkedItems, onConfirm, onClose, busy }) {
  const [selected, setSelected] = React.useState(() => new Set(checkedItems.map((_, i) => i)));

  const toggle = (i) => setSelected(prev => {
    const next = new Set(prev);
    next.has(i) ? next.delete(i) : next.add(i);
    return next;
  });

  const selectedItems = checkedItems.filter((_, i) => selected.has(i));
  const cleanText = (t) => t.replace(/^🤖\s*/, '').replace(/\s*\(est\..*?\)$/, '').trim();

  return (
    <div style={{
      position: 'fixed', inset: 0, background: 'rgba(0,0,0,0.6)',
      display: 'flex', alignItems: 'center', justifyContent: 'center', zIndex: 9999,
    }} onClick={onClose}>
      <div style={{
        background: '#0d1b3e', border: '1px solid #1e3060', borderRadius: 12,
        padding: '28px 32px', minWidth: 320, maxWidth: 440, width: '90%',
      }} onClick={e => e.stopPropagation()}>
        <div style={{ fontSize: 16, fontWeight: 700, color: '#c9a84c', marginBottom: 6 }}>
          📦 Log Shopping Run — {store}
        </div>
        <div style={{ fontSize: 13, color: '#8a9abf', marginBottom: 16 }}>
          {selectedItems.length} of {checkedItems.length} item{checkedItems.length !== 1 ? 's' : ''} will be logged. Uncheck anything you didn't buy:
        </div>
        <div style={{ maxHeight: 240, overflowY: 'auto', marginBottom: 20 }}>
          {checkedItems.map((text, i) => (
            <div key={i} onClick={() => toggle(i)} style={{
              display: 'flex', alignItems: 'center', gap: 10,
              fontSize: 13, padding: '6px 0', cursor: 'pointer',
              borderBottom: i < checkedItems.length - 1 ? '1px solid #1a2a50' : 'none',
              color: selected.has(i) ? '#dde1f0' : '#4a5a7a',
              textDecoration: selected.has(i) ? 'none' : 'line-through',
            }}>
              <input
                type="checkbox"
                checked={selected.has(i)}
                onChange={() => toggle(i)}
                onClick={(e) => e.stopPropagation()}
                style={{ accentColor: '#c9a84c', width: 15, height: 15, flexShrink: 0 }}
              />
              {cleanText(text)}
            </div>
          ))}
        </div>
        <div style={{ display: 'flex', gap: 10, justifyContent: 'flex-end' }}>
          <button onClick={onClose} disabled={busy}
            style={{ background: 'none', border: '1px solid #2a3a60', borderRadius: 6,
                     color: '#8a9abf', padding: '7px 18px', fontSize: 13, cursor: 'pointer' }}>
            Cancel
          </button>
          <button onClick={() => onConfirm(selectedItems)} disabled={busy || selectedItems.length === 0}
            style={{ background: '#c9a84c', border: 'none', borderRadius: 6,
                     color: '#0d1b3e', fontWeight: 700, padding: '7px 18px', fontSize: 13,
                     cursor: (busy || selectedItems.length === 0) ? 'not-allowed' : 'pointer',
                     opacity: (busy || selectedItems.length === 0) ? 0.5 : 1 }}>
            {busy ? 'Logging…' : `✓ Log ${selectedItems.length} Item${selectedItems.length !== 1 ? 's' : ''}`}
          </button>
        </div>
      </div>
    </div>
  );
}

// ---- Shopping tab -----------------------------------------------------------

function ShoppingTab({ stores, onToggle, onAddItem, onDelete, onEdit, busy, onLogRun }) {
  const [activeStore,   setActiveStore]   = React.useState(null);
  const [editingIndex,  setEditingIndex]  = React.useState(null); // { tabId, index } | null
  const [editText,      setEditText]      = React.useState('');
  const [logRunModal,   setLogRunModal]   = React.useState(false);

  React.useEffect(() => {
    if (stores.length > 0) {
      setActiveStore(prev =>
        stores.find(s => s.tabId === prev) ? prev : stores[0].tabId
      );
    } else {
      setActiveStore(null);
    }
  }, [stores]);

  if (!stores.length) {
    return (
      <div className="empty-state">
        <div style={{ fontSize: 32, marginBottom: 12 }}>🛒</div>
        <div>No shopping list connected.</div>
        <div style={{ fontSize: 13, color: '#6b7fa8', marginTop: 8 }}>
          Set <code style={{ background: '#13244d', padding: '1px 6px', borderRadius: 4 }}>SHOPPING_LIST_DOC_ID</code> in Script Properties to connect your Google Doc.
        </div>
      </div>
    );
  }

  const current      = stores.find(s => s.tabId === activeStore);
  const checkedItems = current ? current.items.filter(i => i.done).map(i => i.text) : [];

  return (
    <div>
      {/* Store sub-tabs */}
      <div style={{
        display: 'flex', gap: 2, flexWrap: 'wrap', alignItems: 'center',
        borderBottom: '1px solid #1e3060', marginBottom: 20,
      }}>
        {stores.map(s => {
          const pending  = s.items.filter(i => !i.done).length;
          const isActive = s.tabId === activeStore;
          return (
            <button
              key={s.tabId}
              onClick={() => setActiveStore(s.tabId)}
              style={{
                background: isActive ? '#0d1b3e' : 'none',
                border: 'none', cursor: 'pointer',
                padding: '9px 16px', fontSize: 13, fontWeight: 600,
                color: isActive ? '#c9a84c' : '#8a9abf',
                borderBottom: isActive ? '2px solid #c9a84c' : '2px solid transparent',
                marginBottom: -1, display: 'flex', alignItems: 'center', gap: 7,
                borderRadius: '4px 4px 0 0',
              }}
            >
              {s.storeName}
              <span style={{
                background: pending === 0 ? 'rgba(67,160,71,0.2)' : 'rgba(201,168,76,0.15)',
                color: pending === 0 ? '#43a047' : '#c9a84c',
                borderRadius: 20, padding: '1px 7px', fontSize: 11, fontWeight: 700,
              }}>
                {pending === 0 ? '✓' : pending}
              </span>
            </button>
          );
        })}
        {/* Action buttons */}
        <React.Fragment>
          {checkedItems.length > 0 && (
            <button
              style={{
                background: 'none', border: '1px solid #c9a84c', borderRadius: 6,
                color: '#c9a84c', fontSize: 12, fontWeight: 600,
                padding: '5px 12px', cursor: busy ? 'wait' : 'pointer',
                marginLeft: 4, marginBottom: 4, flexShrink: 0,
              }}
              disabled={busy}
              onClick={() => setLogRunModal(true)}
            >
              📦 Log Shopping Run ({checkedItems.length})
            </button>
          )}
          <button
            className="btn btn-primary"
            style={{ fontSize: 12, marginLeft: checkedItems.length > 0 ? 4 : 'auto', marginBottom: 4, flexShrink: 0 }}
            disabled={busy}
            onClick={() => onAddItem && onAddItem(activeStore)}
          >
            + Add Item
          </button>
        </React.Fragment>
      </div>

      {/* Item list */}
      {current && (
        current.items.length === 0
          ? <div className="empty-state" style={{ padding: 32 }}>This store has no items listed.</div>
          : <div style={{ display: 'flex', flexDirection: 'column', gap: 6 }}>
              {[...current.items].sort((a, b) => a.done - b.done).map((item, i) => {
                const isEditing  = editingIndex !== null &&
                                   editingIndex.tabId === current.tabId &&
                                   editingIndex.index === item.index;
                const isVERA     = item.text.startsWith('🤖');
                return (
                  <div key={i} style={{
                    display: 'flex', alignItems: 'center', gap: 12,
                    padding: '11px 16px', borderRadius: 8,
                    background: item.done ? 'rgba(67,160,71,0.05)' : '#0d1b3e',
                    border: '1px solid ' + (item.done ? 'rgba(67,160,71,0.15)' : '#1e3060'),
                    opacity: isVERA && !item.done ? 0.82 : 1,
                    transition: 'background 0.15s',
                  }}>
                    {/* Checkbox — disabled while editing */}
                    <input type="checkbox" checked={item.done} readOnly
                      onClick={e => { e.stopPropagation(); if (!busy && !isEditing) onToggle(current.tabId, item.index, item.done); }}
                      style={{ accentColor: '#43a047', width: 16, height: 16, flexShrink: 0, cursor: isEditing ? 'default' : 'pointer' }} />

                    {/* Inline edit mode */}
                    {isEditing ? (
                      <React.Fragment>
                        <input
                          autoFocus
                          value={editText}
                          onChange={e => setEditText(e.target.value)}
                          onKeyDown={e => {
                            if (e.key === 'Enter') { e.preventDefault(); if (editText.trim()) { onEdit(current.tabId, item.index, editText); setEditingIndex(null); } }
                            if (e.key === 'Escape') setEditingIndex(null);
                          }}
                          style={{ flex: 1, background: '#13244d', border: '1px solid #c9a84c', borderRadius: 4,
                                   color: '#e8eaed', padding: '4px 8px', fontSize: 14 }}
                        />
                        <button onClick={() => { if (editText.trim()) { onEdit(current.tabId, item.index, editText); setEditingIndex(null); } }}
                          disabled={!editText.trim()}
                          style={{ background: '#c9a84c', border: 'none', borderRadius: 4, color: '#0d1b3e',
                                   fontWeight: 700, fontSize: 12, padding: '4px 10px', cursor: editText.trim() ? 'pointer' : 'default' }}>
                          Save
                        </button>

                          style={{ background: 'none', border: '1px solid #2a3a60', borderRadius: 4,

                          {item.text}
                        </span>
                        {/* VERA suggestion chip */}
                        {isVERA && !item.done && (
                          <span style={{
                            fontSize: 9, fontWeight: 700, color: '#c9a84c',

                          style={{ background: 'none', border: 'none', cursor: 'pointer', color: '#5f6a8a',
                                   fontSize: 13, padding: '0 4px', flexShrink: 0 }}>✎</button>
                        {/* Delete button */}
                        <button title="Delete" onClick={e => { e.stopPropagation(); onDelete && onDelete(current.tabId, item.index); }}
                          style={{ background: 'none', border: 'none', cursor: 'pointer', color: '#5f6a8a',
                                   fontSize: 13, padding: '0 4px', flexShrink: 0 }}>✕</button>
                      </React.Fragment>
                    )}
                  </div>
                );
              })}
            </div>
      )}

      {/* Log Run confirmation modal */}
      {logRunModal && current && (
        <LogRunModal
          store={current.storeName}
          checkedItems={checkedItems}
          busy={busy}
          onClose={() => setLogRunModal(false)}
          onConfirm={(selectedItems) => {
            setLogRunModal(false);
            onLogRun && onLogRun(current.tabId, selectedItems);
          }}
        />
      )}
    </div>
  );
}

function refillBadge(refillDate) {
  if (!refillDate) return { label: 'No refill date', color: '#6b7280' };
  var today = new Date(); today.setHours(0,0,0,0);
  var d = new Date(refillDate); d.setHours(0,0,0,0);
  var days = Math.round((d - today) / 86400000);
  if (days < 0)  return { label: 'Refill overdue',       color: '#ef4444' };
  if (days <= 7) return { label: 'Refill in ' + days + ' days ⚠', color: '#ef4444' };
  if (days <= 14) return { label: 'Refill in ' + days + ' days', color: '#f59e0b' };
  return { label: 'Refill in ' + days + ' days', color: '#22c55e' };
}

function PrescriptionsTab({ apiUrl, apiToken }) {
  const [prescriptions, setPrescriptions] = React.useState([]);
  const [loading, setLoading]             = React.useState(false);
  const [busy, setBusy]                   = React.useState(false);
  const [error, setError]                 = React.useState('');
  const [modal, setModal]                 = React.useState(null); // null | { mode:'add'|'edit', rx, person }

  async function load() {
    setLoading(true); setError('');
    try {
      const res = await apiGet(apiUrl, apiToken, { action: 'prescriptions' });
      setPrescriptions(res.prescriptions || []);
    } catch (err) { setError('Could not load prescriptions: ' + err.message); }
    setLoading(false);
  }

  React.useEffect(() => { load(); }, []);

  // Derive unique persons in stable order: Ahmed first, Victoria second, others after
  const persons = React.useMemo(() => {
    const seen = new Set();
    const order = [];
    ['Ahmed', 'Victoria'].forEach(p => { seen.add(p); order.push(p); });
    prescriptions.forEach(rx => { if (!seen.has(rx.person)) { seen.add(rx.person); order.push(rx.person); } });
    return order;
  }, [prescriptions]);

  async function handleSave(form) {
    setBusy(true);
    try {
      if (modal.mode === 'edit') {
        await apiGet(apiUrl, apiToken, Object.assign({ action: 'update_prescription' }, form, { id: modal.rx.id }));
      } else {
        await apiGet(apiUrl, apiToken, Object.assign({ action: 'add_prescription' }, form));
      }
      setModal(null);
      await load();
    } catch (err) { setError('Save failed: ' + err.message); }
    setBusy(false);
  }

  async function handleDelete(id) {
    if (!confirm('Delete this prescription?')) return;
    setBusy(true);
    try {
      await apiGet(apiUrl, apiToken, { action: 'delete_prescription', id });
      await load();
    } catch (err) { setError('Delete failed: ' + err.message); }
    setBusy(false);
  }

  async function handleToggleActive(id, newActive) {
    setBusy(true);
    try {
      await apiGet(apiUrl, apiToken, { action: 'update_prescription', id: id, active: newActive });
      await load();
    } catch (err) { setError('Update failed: ' + err.message); }
    setBusy(false);
  }

  if (loading) return <div style={{ color: '#a0a8c0', padding: 24, textAlign: 'center' }}>Loading prescriptions…</div>;

  return (
    <div style={{ padding: '4px 0' }}>
      {error && <div style={{ color: '#ef4444', marginBottom: 12, fontSize: 13 }}>{error}</div>}
      <div style={{ display: 'grid', gridTemplateColumns: 'repeat(auto-fit, minmax(280px, 1fr))', gap: 20 }}>
        {persons.map(person => (
          <PersonPanel
            key={person}
            person={person}
            prescriptions={prescriptions.filter(rx => rx.person === person)}
            busy={busy}
            onAdd={p => setModal({ mode: 'add', rx: null, person: p })}
            onEdit={rx => setModal({ mode: 'edit', rx, person: rx.person })}
            onDelete={handleDelete}
            onToggleActive={handleToggleActive}
          />
        ))}
      </div>
      {modal && (
        <PrescriptionModal
          mode={modal.mode}
          rx={modal.rx}
          person={modal.person}
          busy={busy}
          onSave={handleSave}
          onClose={() => setModal(null)}
        />
      )}
    </div>
  );
}

function cardChipColor(name) {
  var h = 0;
  for (var i = 0; i < name.length; i++) h = (h * 31 + name.charCodeAt(i)) & 0xffff;

}

function daysSince(dateStr) {
  if (!dateStr) return null;
  var d = new Date(dateStr); d.setHours(0,0,0,0);
  var today = new Date(); today.setHours(0,0,0,0);
  return Math.round((today - d) / 86400000);
}

          <h3 style={{ margin:0, color:'#dde1f0' }}>{card.cardName}</h3>
          <button onClick={onClose} style={{ background:'none', border:'none', color:'#a0a8c0', fontSize:20, cursor:'pointer' }}>×</button>
        </div>
        <div style={{ display:'flex', gap:10, marginBottom:16, flexWrap:'wrap' }}>
          <span style={{ fontSize:12, color:'#a0a8c0' }}>
            <span style={{ color:'#6b7280' }}>Primary: </span>{card.owner}
          </span>
          {card.authUser && (
            <span style={{ fontSize:12, color:'#a0a8c0' }}>
              <span style={{ color:'#6b7280' }}>Auth User: </span>{card.authUser}
            </span>
          )}
          {card.annualFee != null && (
            <span style={{ fontSize:12, color:'#a0a8c0' }}>
              <span style={{ color:'#6b7280' }}>Annual Fee: </span>{card.annualFee === 0 ? 'None' : '$' + card.annualFee}
            </span>
          )}
        </div>

        {/* Rewards */}
        <div style={panelStyle}>
          <div style={{ fontWeight:700, fontSize:13, color:'#dde1f0', marginBottom:10 }}>💰 Reward Categories</div>
          {cardRewards.length === 0
            ? <div style={{ fontSize:12, color:'#6b7280', marginBottom:10 }}>No reward categories yet.</div>
            : <table style={{ width:'100%', fontSize:12, borderCollapse:'collapse', marginBottom:10 }}>
                <thead>
                  <tr>{['Category','Rate','Type','Conditions',''].map(h => (
                    <th key={h} style={{ textAlign:'left', color:'#6b7280', padding:'4px 8px 4px 0', borderBottom:'1px solid #2a2f45' }}>{h}</th>
                  ))}</tr>
                </thead>
                <tbody>
                  {cardRewards.map(r => (
                    <tr key={r.id}>
                      <td style={{ padding:'4px 8px 4px 0', color:'#dde1f0' }}>{r.category}</td>
                      <td style={{ padding:'4px 8px 4px 0', color:'#4f6ef7', fontWeight:600 }}>{r.rate}</td>
                      <td style={{ padding:'4px 8px 4px 0', color:'#a0a8c0' }}>{r.rateType}</td>
                      <td style={{ padding:'4px 8px 4px 0', color:'#6b7280', fontSize:11 }}>{r.conditions}</td>
                      <td><button onClick={() => onDeleteReward(r.id)} disabled={busy}
                        style={{ background:'none', border:'none', color:'#ef4444', cursor:'pointer', fontSize:14 }}>×</button></td>
                    </tr>
                  ))}
                </tbody>
              </table>
          }
          <div style={{ display:'flex', gap:6, flexWrap:'wrap', alignItems:'center' }}>
            <input placeholder="Category" value={newReward.category} onChange={e => setRw('category', e.target.value)}
              style={Object.assign({}, inputStyle, { width:110 })} />
            <input placeholder="Rate" value={newReward.rate} onChange={e => setRw('rate', e.target.value)}
              style={Object.assign({}, inputStyle, { width:55 })} />
            <select value={newReward.rateType} onChange={e => setRw('rateType', e.target.value)} style={inputStyle}>
              <option>x points</option><option>% cashback</option><option>x miles</option>
            </select>
            <input placeholder="Conditions (optional)" value={newReward.conditions} onChange={e => setRw('conditions', e.target.value)}
              style={Object.assign({}, inputStyle, { flex:1, minWidth:100 })} />
            <button onClick={() => { onAddReward(card.cardName, newReward); setNewReward({ category:'', rate:'', rateType:'x points', conditions:'' }); }}
              disabled={busy || !newReward.category || !newReward.rate}
              style={{ background:'#4f6ef7', color:'#fff', border:'none', borderRadius:6, padding:'5px 12px', cursor:'pointer', fontSize:12 }}>＋ Add</button>
          </div>
        </div>

        {/* Perks */}
        <div style={panelStyle}>
          <div style={{ fontWeight:700, fontSize:13, color:'#dde1f0', marginBottom:10 }}>🎁 Perks</div>
          {perkGroups.map(function(freq) {
            var grp = cardPerks.filter(function(p) { return p.frequency === freq; });
            if (!grp.length) return null;
            return (
              <div key={freq} style={{ marginBottom:10 }}>
                <div style={{ fontSize:11, color:'#6b7280', marginBottom:4 }}>{freq}</div>
                {grp.map(function(pk) {
                  var used = isPerkUsed(pk);
                  return (
                    <div key={pk.id} style={{ display:'flex', alignItems:'center', gap:8, marginBottom:4 }}>
                      <button onClick={() => onTogglePerk(pk.id)} disabled={busy}
                        style={{ width:18, height:18, borderRadius:4, border:'2px solid ' + (used ? '#22c55e' : '#374151'),
                          background: used ? '#166534' : 'transparent', cursor:'pointer', flexShrink:0 }}>
                        {used ? <span style={{ color:'#86efac', fontSize:11, lineHeight:'14px' }}>✓</span> : null}
                      </button>
                      <span style={{ fontSize:13, color: used ? '#86efac' : '#dde1f0' }}>{pk.perk}</span>
                      {pk.amount && <span style={{ fontSize:11, color:'#a0a8c0' }}>${pk.amount}</span>}
                      <span style={{ fontSize:11, color: used ? '#22c55e' : '#6b7280' }}>
                        {used ? 'Used' : 'Not used'} {freq === 'Annual' ? 'this year' : 'this month'}
                      </span>
                      <button onClick={() => onDeletePerk(pk.id)} disabled={busy}
                        style={{ background:'none', border:'none', color:'#ef4444', cursor:'pointer', fontSize:14, marginLeft:'auto' }}>×</button>
                    </div>
                  );
                })}
              </div>
            );
          })}
          {cardPerks.length === 0 && <div style={{ fontSize:12, color:'#6b7280', marginBottom:10 }}>No perks tracked yet.</div>}
          <div style={{ display:'flex', gap:6, flexWrap:'wrap', alignItems:'center', marginTop:8 }}>
            <input placeholder="Perk name" value={newPerk.perk} onChange={e => setPk('perk', e.target.value)}
              style={Object.assign({}, inputStyle, { flex:1, minWidth:120 })} />
            <input placeholder="$amt" value={newPerk.amount} onChange={e => setPk('amount', e.target.value)}
              style={Object.assign({}, inputStyle, { width:55 })} />
            <select value={newPerk.frequency} onChange={e => setPk('frequency', e.target.value)} style={inputStyle}>
              <option>Monthly</option><option>Quarterly</option><option>Annual</option>
            </select>
            <button onClick={() => { onAddPerk(card.cardName, newPerk); setNewPerk({ perk:'', amount:'', frequency:'Monthly', category:'' }); }}
              disabled={busy || !newPerk.perk}
              style={{ background:'#4f6ef7', color:'#fff', border:'none', borderRadius:6, padding:'5px 12px', cursor:'pointer', fontSize:12 }}>＋ Add</button>
          </div>
        </div>
      </div>
    </div>
  );
}

function CardsTab({ apiUrl, apiToken }) {
  const [cards,     setCards]     = React.useState([]);
  const [rewards,   setRewards]   = React.useState([]);
  const [perks,     setPerks]     = React.useState([]);
  const [programs,  setPrograms]  = React.useState([]);
  const [goals,     setGoals]     = React.useState([]);
  const [loading,   setLoading]   = React.useState(true);
  const [busy,      setBusy]      = React.useState(false);
  const [error,     setError]     = React.useState('');
  const [ownerFilter, setOwnerFilter] = React.useState('all');
  const [modal,     setModal]     = React.useState(null); // { type, data }

  async function load() {
    setLoading(true); setError('');
    try {
      const res = await apiGet(apiUrl, apiToken, { action: 'cards' });
      setCards(res.cards || []);
      setRewards(res.rewards || []);
      setPerks(res.perks || []);
      setPrograms(res.programs || []);
      setGoals(res.goals || []);
    } catch (err) { setError('Could not load cards: ' + err.message); }
    setLoading(false);
  }

  React.useEffect(() => { load(); }, []);

  const visibleCards = React.useMemo(() => {
    if (ownerFilter === 'all') return cards;
    return cards.filter(function(c) {
      return c.owner === ownerFilter || c.authUser === ownerFilter;
    });
  }, [cards, ownerFilter]);

  const cheatSheet = React.useMemo(() => {
    var visibleNames = new Set(visibleCards.filter(function(c) { return c.active === 'Yes'; }).map(function(c) { return c.cardName; }));
    var byCat = {};
    rewards.forEach(function(r) {
      if (!visibleNames.has(r.cardName)) return;
      if (!byCat[r.category]) byCat[r.category] = [];
      byCat[r.category].push(r);
    });
    var result = [];
    Object.keys(byCat).sort().forEach(function(cat) {
      var sorted = byCat[cat].slice().sort(function(a, b) { return parseFloat(b.rate) - parseFloat(a.rate); });
      result.push({ category: cat, top: sorted.slice(0, 2) });
    });
    return result;
  }, [rewards, visibleCards]);

  function copyCheatSheet() {
    var now = new Date();
    var monthName = now.toLocaleString('default', { month: 'long', year: 'numeric' });
    var lines = ['💳 Ahmed & Victoria\'s Card Cheat Sheet – ' + monthName];
    cheatSheet.forEach(function(row) {
      var cardStrs = row.top.map(function(r) {
        var s = r.cardName + ' (' + r.rate + ' ' + r.rateType + ')';
        if (r.conditions) s += ' | ' + r.conditions;
        return s;
      }).join(' / ');
      lines.push(row.category.padEnd(18) + '→ ' + cardStrs);
    });
    if (navigator.clipboard) {
      navigator.clipboard.writeText(lines.join('\n'));
    }
  }

  async function handleSaveCard(form) {
    setBusy(true);
    try {
      var params = Object.assign({ action: modal.data ? 'update_card' : 'add_card' }, form);
      if (modal.data) params.id = modal.data.id;
      await apiGet(apiUrl, apiToken, params);
      setModal(null);
      await load();
    } catch (err) { setError('Save failed: ' + err.message); }
    setBusy(false);
  }

  async function handleDeleteCard(id) {
    if (!confirm('Delete this card and all its rewards/perks?')) return;
    setBusy(true);
    try {
      await apiGet(apiUrl, apiToken, { action: 'delete_card', id });
      await load();
    } catch (err) { setError('Delete failed: ' + err.message); }
    setBusy(false);
  }

  async function handleAddReward(cardName, r) {
    setBusy(true);
    try {
      await apiGet(apiUrl, apiToken, { action: 'add_card_reward', cardName, category: r.category, rate: r.rate, rateType: r.rateType, conditions: r.conditions || '' });
      await load();
    } catch (err) { setError('Add reward failed: ' + err.message); }
    setBusy(false);
  }

  async function handleDeleteReward(id) {
    setBusy(true);
    try {
      await apiGet(apiUrl, apiToken, { action: 'delete_card_reward', id });
      await load();
    } catch (err) { setError('Delete reward failed: ' + err.message); }
    setBusy(false);
  }

  async function handleAddPerk(cardName, pk) {
    setBusy(true);
    try {
      await apiGet(apiUrl, apiToken, { action: 'add_card_perk', cardName, perk: pk.perk, amount: pk.amount || '', frequency: pk.frequency, category: pk.category || '' });
      await load();
    } catch (err) { setError('Add perk failed: ' + err.message); }
    setBusy(false);
  }

  async function handleDeletePerk(id) {
    setBusy(true);
    try {
      await apiGet(apiUrl, apiToken, { action: 'delete_card_perk', id });
      await load();
    } catch (err) { setError('Delete perk failed: ' + err.message); }
    setBusy(false);
  }

  async function handleTogglePerk(id) {
    setBusy(true);
    try {
      await apiGet(apiUrl, apiToken, { action: 'toggle_card_perk', id });
      await load();
    } catch (err) { setError('Toggle perk failed: ' + err.message); }
    setBusy(false);
  }

  async function handleSaveProgram(form) {
    setBusy(true);
    try {
      var params = Object.assign({ action: modal.data ? 'update_loyalty_program' : 'add_loyalty_program' }, form);
      if (modal.data) params.id = modal.data.id;
      await apiGet(apiUrl, apiToken, params);
      setModal(null);
      await load();
    } catch (err) { setError('Save failed: ' + err.message); }
    setBusy(false);
  }

  async function handleDeleteProgram(id) {
    if (!confirm('Delete this loyalty program?')) return;
    setBusy(true);
    try { await apiGet(apiUrl, apiToken, { action: 'delete_loyalty_program', id }); await load(); }
    catch (err) { setError('Delete failed: ' + err.message); }
    setBusy(false);
  }

  async function handleSaveGoal(form) {
    setBusy(true);
    try {
      var params = Object.assign({ action: modal.data ? 'update_rewards_goal' : 'add_rewards_goal' }, form);
      if (modal.data) params.id = modal.data.id;
      await apiGet(apiUrl, apiToken, params);
      setModal(null);
      await load();
    } catch (err) { setError('Save failed: ' + err.message); }
    setBusy(false);
  }

  async function handleDeleteGoal(id) {
    if (!confirm('Delete this goal?')) return;
    setBusy(true);
    try { await apiGet(apiUrl, apiToken, { action: 'delete_rewards_goal', id }); await load(); }
    catch (err) { setError('Delete failed: ' + err.message); }
    setBusy(false);
  }

  if (loading) return <div style={{ color:'#a0a8c0', padding:24, textAlign:'center' }}>Loading Credit Card Hub…</div>;

  const panelHead = (title, actions) => (
    <div style={{ display:'flex', justifyContent:'space-between', alignItems:'center', marginBottom:12 }}>
      <span style={{ fontWeight:700, fontSize:14, color:'#dde1f0' }}>{title}</span>
      <div style={{ display:'flex', gap:6 }}>{actions}</div>
    </div>
  );

  const pillBtn = (label, onClick, color) => (
    <button onClick={onClick} disabled={busy}
      style={{ background: color || '#2a2f45', color:'#dde1f0', border:'none', borderRadius:6, padding:'5px 12px', cursor:'pointer', fontSize:12 }}>
      {label}
    </button>
  );

  return (
    <div style={{ padding:'4px 0' }}>
      {/* Header */}
      <div style={{ display:'flex', justifyContent:'space-between', alignItems:'center', marginBottom:14, flexWrap:'wrap', gap:8 }}>
        <div>
          <div style={{ fontWeight:700, fontSize:17, color:'#dde1f0' }}>💳 Ahmed &amp; Victoria's Credit Card Hub</div>
          <div style={{ fontSize:12, color:'#6b7280' }}>Updated: {new Date().toLocaleDateString('en-US', { month:'short', day:'numeric', year:'numeric' })}</div>
        </div>
        {/* Owner filter */}
        <div style={{ display:'flex', gap:4 }}>
          {['all','Ahmed','Victoria'].map(function(o) {
            return (
              <button key={o} onClick={() => setOwnerFilter(o)}
                style={{ background: ownerFilter === o ? '#4f6ef7' : '#2a2f45', color: ownerFilter === o ? '#fff' : '#a0a8c0', border:'none', borderRadius:20, padding:'4px 12px', cursor:'pointer', fontSize:12 }}>
                {o === 'all' ? 'All Owners' : o}
              </button>
            );
          })}
        </div>
      </div>

      {error && <div style={{ color:'#ef4444', marginBottom:12, fontSize:13 }}>{error}</div>}

      {/* 2-column grid */}
      <div style={{ display:'grid', gridTemplateColumns:'2fr 3fr', gap:16, alignItems:'start' }}>

        {/* LEFT: Quick-Reference Cheat Sheet */}
        <div style={{ background:'#1a2744', border:'1px solid #2a3f6f', borderRadius:12, padding:16 }}>
          {panelHead('💳 Quick-Reference Cheat Sheet',
            [<span key="sub" style={{ fontSize:11, color:'#6b7280', marginRight:6 }}>(Where to Use Which Card)</span>,
             pillBtn('📋 Copy', copyCheatSheet)]
          )}
          {cheatSheet.length === 0
            ? <div style={{ color:'#6b7280', fontSize:13, textAlign:'center', padding:'20px 0' }}>Add reward categories to your cards to generate the cheat sheet.</div>
            : cheatSheet.map(function(row) {
                var icon = CARD_CATEGORY_ICONS[row.category] || '💰';
                return (
                  <div key={row.category} style={{ display:'flex', gap:10, alignItems:'flex-start', padding:'8px 0', borderBottom:'1px solid #2a3f6f' }}>
                    <div style={{ fontSize:22, lineHeight:1, marginTop:2, minWidth:28 }}>{icon}</div>
                    <div>
                      <div style={{ fontWeight:700, fontSize:13, color:'#dde1f0', textTransform:'uppercase', letterSpacing:'0.5px', marginBottom:3 }}>{row.category}</div>
                      {row.top.map(function(r, idx) {
                        var label = r.cardName + ' (' + r.rate + ' ' + r.rateType + ')';
                        if (r.conditions) label += ' | ' + r.conditions;
                        return <div key={idx} style={{ fontSize:12, color:'#a0a8c0' }}>{label}</div>;
                      })}
                    </div>
                  </div>
                );
              })
          }
        </div>

        {/* RIGHT: stacked panels */}
        <div style={{ display:'flex', flexDirection:'column', gap:16 }}>

          {/* Card Tracker */}
          <div style={{ background:'#183028', border:'1px solid #1f4033', borderRadius:12, padding:16 }}>
            {panelHead('📋 Your Card Tracker', [pillBtn('＋ Add Card', () => setModal({ type:'card', data:null }), '#22c55e')])}
            {visibleCards.length === 0
              ? <div style={{ color:'#6b7280', fontSize:13, textAlign:'center', padding:'12px 0' }}>No cards yet. Click ＋ Add Card to get started.</div>

                    <tr>{['Card','Owner','Annual Fee','Due','Statement Credit','Status'].map(h => (

                    ))}</tr>
                  </thead>
                  <tbody>
                    {visibleCards.map(function(c) {
                      var ds = daysSince(c.lastUsed);
                      var inactiveWarn = ds != null && ds > 60;
                      return (
                        <tr key={c.id} style={{ cursor:'pointer' }}
                          onClick={() => setModal({ type:'detail', data:c })}>

                              {inactiveWarn && <span style={{ color:'#ef4444', fontSize:11 }} title={'Last used ' + ds + ' days ago — inactivity risk!'}>⚠</span>}
                            </div>
                          </td>
                          <td style={{ padding:'6px 8px 6px 0', color:'#a0a8c0' }}>
                            <div style={{ display:'flex', flexDirection:'column', gap:2 }}>
                              <span>{c.owner}</span>
                              {c.authUser && <span style={{ fontSize:10, color:'#6b7280' }}>+{c.authUser} (auth)</span>}
                            </div>
                          </td>
                          <td style={{ padding:'6px 8px 6px 0', color:'#a0a8c0' }}>{c.annualFee != null && c.annualFee !== '' ? '$' + c.annualFee : '—'}</td>
                          <td style={{ padding:'6px 8px 6px 0', color:'#a0a8c0' }}>{c.dueDay ? c.dueDay + 'th' : '—'}</td>
                          <td style={{ padding:'6px 8px 6px 0', color:'#a0a8c0', fontSize:11 }}>{c.statementCredit || '—'}</td>
                          <td style={{ padding:'6px 8px 6px 0' }}>
                            <div style={{ display:'flex', alignItems:'center', gap:6 }}>
                              <span style={{ background: c.active === 'Yes' ? '#166534' : '#374151', color: c.active === 'Yes' ? '#86efac' : '#9ca3af',
                                fontSize:10, fontWeight:700, borderRadius:4, padding:'2px 6px' }}>
                                {c.active === 'Yes' ? 'ACTIVE' : 'INACTIVE'}
                              </span>
                              <button onClick={e => { e.stopPropagation(); setModal({ type:'card', data:c }); }} disabled={busy}
                                style={{ background:'none', border:'none', color:'#a0a8c0', cursor:'pointer', fontSize:12 }}>✏️</button>
                              <button onClick={e => { e.stopPropagation(); handleDeleteCard(c.id); }} disabled={busy}
                                style={{ background:'none', border:'none', color:'#ef4444', cursor:'pointer', fontSize:13 }}>×</button>
                            </div>
                          </td>
                        </tr>
                      );
                    })}
                  </tbody>
                </table>
            }
          </div>

          {/* Rewards & Redemption Hub */}
          <div style={{ background:'#2a1a0a', border:'1px solid #4a3010', borderRadius:12, padding:16 }}>
            {panelHead('🎁 Rewards & Redemption Hub', [
              pillBtn('＋ Program', () => setModal({ type:'program', data:null }), '#f59e0b'),
              pillBtn('＋ Goal', () => setModal({ type:'goal', data:null }), '#f59e0b'),
            ])}
            {programs.length === 0
              ? <div style={{ color:'#6b7280', fontSize:13, marginBottom:12 }}>No loyalty programs added yet.</div>
              : <table style={{ width:'100%', fontSize:12, borderCollapse:'collapse', marginBottom:16 }}>
                  <thead>
                    <tr>{['Program','Total Points','Est. Value','Best Use',''].map(h => (
                      <th key={h} style={{ textAlign:'left', color:'#a07030', padding:'4px 8px 8px 0', borderBottom:'1px solid #4a3010' }}>{h}</th>
                    ))}</tr>
                  </thead>
                  <tbody>
                    {programs.map(function(pg) {
                      var estVal = Math.round(pg.totalPoints * (pg.centsPerPoint || 1) / 100);
                      var ds90  = pg.expiry && pg.expiry !== 'Never' && pg.expiry
                        ? Math.round((new Date(pg.expiry) - new Date()) / 86400000) : null;
                      return (
                        <tr key={pg.id}>
                          <td style={{ padding:'5px 8px 5px 0', color:'#f0c060', fontWeight:600 }}>
                            {pg.program}
                            {ds90 != null && ds90 <= 90 && <span style={{ color:'#f59e0b', fontSize:11, marginLeft:4 }}>⚠ expires {pg.expiry}</span>}
                          </td>
                          <td style={{ padding:'5px 8px 5px 0', color:'#dde1f0' }}>{fmtPts(pg.totalPoints)}</td>
                          <td style={{ padding:'5px 8px 5px 0', color:'#22c55e' }}>${estVal.toLocaleString()}</td>
                          <td style={{ padding:'5px 8px 5px 0', color:'#a0a8c0' }}>{pg.bestUse}</td>
                          <td style={{ whiteSpace:'nowrap' }}>
                            <button onClick={() => setModal({ type:'program', data:pg })} disabled={busy}
                              style={{ background:'none', border:'none', color:'#a0a8c0', cursor:'pointer', fontSize:12 }}>✏️</button>
                            <button onClick={() => handleDeleteProgram(pg.id)} disabled={busy}
                              style={{ background:'none', border:'none', color:'#ef4444', cursor:'pointer', fontSize:13 }}>×</button>
                          </td>
                        </tr>
                      );
                    })}
                  </tbody>
                </table>
            }
            {goals.length > 0 && (
              <div>
                <div style={{ fontWeight:700, fontSize:12, color:'#f0c060', marginBottom:10 }}>Goals</div>
                {goals.map(function(g) {
                  var pct     = g.targetPoints > 0 ? Math.min(100, Math.round(g.currentPoints / g.targetPoints * 100)) : 0;
                  var needed  = Math.max(0, g.targetPoints - g.currentPoints);
                  return (
                    <div key={g.id} style={{ background:'#3a2510', borderRadius:8, padding:'10px 12px', marginBottom:8 }}>
                      <div style={{ display:'flex', justifyContent:'space-between', alignItems:'flex-start', marginBottom:6, flexWrap:'wrap', gap:4 }}>
                        <span style={{ fontWeight:700, color:'#f0c060', fontSize:13 }}>{g.goal}</span>
                        <div style={{ display:'flex', alignItems:'center', gap:6 }}>
                          <span style={{ background:'#22c55e', color:'#fff', fontSize:10, fontWeight:700, borderRadius:10, padding:'2px 8px' }}>{pct}% Achieved</span>
                          <span style={{ fontSize:11, color:'#a0a8c0' }}>Need {fmtPts(needed)} more</span>
                          <span style={{ fontSize:11, color:'#f59e0b' }}>Target: {g.targetProgram}</span>
                          <button onClick={() => setModal({ type:'goal', data:g })} disabled={busy}
                            style={{ background:'none', border:'none', color:'#a0a8c0', cursor:'pointer', fontSize:12 }}>✏️</button>
                          <button onClick={() => handleDeleteGoal(g.id)} disabled={busy}
                            style={{ background:'none', border:'none', color:'#ef4444', cursor:'pointer', fontSize:13 }}>×</button>
                        </div>
                      </div>
                      <div style={{ background:'#4a3010', borderRadius:4, height:8, overflow:'hidden' }}>
                        <div style={{ background:'#22c55e', height:'100%', width: pct + '%', borderRadius:4, transition:'width 0.3s' }}></div>
                      </div>
                    </div>
                  );
                })}
              </div>
            )}
          </div>
        </div>
      </div>

      {/* Modals */}
      {modal && modal.type === 'card' && (
        <CardModal mode={modal.data ? 'edit' : 'add'} card={modal.data} busy={busy}
          onSave={handleSaveCard} onClose={() => setModal(null)} />
      )}
      {modal && modal.type === 'detail' && (
        <CardDetailModal card={modal.data} rewards={rewards} perks={perks} busy={busy}
          onClose={() => setModal(null)}
          onAddReward={handleAddReward} onDeleteReward={handleDeleteReward}
          onAddPerk={handleAddPerk} onDeletePerk={handleDeletePerk} onTogglePerk={handleTogglePerk} />
      )}
      {modal && modal.type === 'program' && (
        <LoyaltyModal mode={modal.data ? 'edit' : 'add'} program={modal.data} busy={busy}
          onSave={handleSaveProgram} onClose={() => setModal(null)} />
      )}
      {modal && modal.type === 'goal' && (
        <RewardsGoalModal mode={modal.data ? 'edit' : 'add'} goal={modal.data} programs={programs} busy={busy}
          onSave={handleSaveGoal} onClose={() => setModal(null)} />
      )}
    </div>
  );
}
