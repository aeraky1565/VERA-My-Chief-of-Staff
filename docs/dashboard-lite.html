function TaxPreparerModal({ preparer, year, busy, onSave, onDelete, onClose }) {
  const SOFTWARE_OPTIONS = ['TurboTax', 'H&R Block', 'FreeTaxUSA', 'TaxAct', 'TaxSlayer', 'Other'];
  const blank = { type: 'Accountant', name: '', firm: '', phone: '', email: '', software: 'TurboTax', filingStatus: 'Not Started', filedDate: '', confirmation: '', notes: '' };
  const [form, setForm] = React.useState(preparer ? {
    type: preparer.type || 'Accountant', name: preparer.name || '', firm: preparer.firm || '',
    phone: preparer.phone || '', email: preparer.email || '', software: preparer.software || 'TurboTax',
    filingStatus: preparer.filingStatus || 'Not Started', filedDate: preparer.filedDate || '',
    confirmation: preparer.confirmation || '', notes: preparer.notes || '',
  } : blank);
  const set = (k, v) => setForm(p => Object.assign({}, p, { [k]: v }));
  const inp = { background: '#161926', border: '1px solid #2a2f45', borderRadius: 6, color: '#dde1f0', padding: '7px 10px', width: '100%', fontSize: 13, boxSizing: 'border-box' };
  const lbl = { fontSize: 11, color: '#6b7280', marginBottom: 3, display: 'block' };
  const showFiled = form.filingStatus === 'Filed' || form.filingStatus === 'Complete';

  return (
    <div style={{ position: 'fixed', inset: 0, background: 'rgba(0,0,0,0.75)', zIndex: 1000, display: 'flex', alignItems: 'center', justifyContent: 'center', padding: 16 }}>
      <div style={{ background: '#1e2235', border: '1px solid #2a2f45', borderRadius: 14, padding: 24, width: '100%', maxWidth: 480, maxHeight: '90vh', overflowY: 'auto' }}>
        <h3 style={{ margin: '0 0 18px', color: '#dde1f0', fontSize: 15 }}>{preparer ? 'Edit Tax Preparer' : 'Set Tax Preparer'} — {year}</h3>

        {/* Type toggle */}
        <div style={{ display: 'flex', gap: 8, marginBottom: 16 }}>
          {['Accountant', 'Software'].map(function(t) { return (
            <button key={t} onClick={() => set('type', t)}
              style={{ flex: 1, padding: '8px 0', borderRadius: 8, border: '1px solid #2a2f45', cursor: 'pointer', fontWeight: 600, fontSize: 13,
                       background: form.type === t ? '#2a3a6e' : 'transparent', color: form.type === t ? '#dde1f0' : '#6b7280' }}>
              {t === 'Accountant' ? '🧑‍💼 Accountant' : '💻 Software'}
            </button>
          ); })}
        </div>

        {form.type === 'Accountant' && (
          <div style={{ display: 'grid', gridTemplateColumns: '1fr 1fr', gap: '10px 16px', marginBottom: 12 }}>
            <div style={{ gridColumn: '1 / -1' }}>
              <label style={lbl}>Name *</label>
              <input style={inp} value={form.name} placeholder="e.g. John Smith, CPA" onChange={e => set('name', e.target.value)} />
            </div>
            <div><label style={lbl}>Firm</label><input style={inp} value={form.firm} onChange={e => set('firm', e.target.value)} /></div>
            <div><label style={lbl}>Phone</label><input style={inp} value={form.phone} onChange={e => set('phone', e.target.value)} /></div>
            <div style={{ gridColumn: '1 / -1' }}><label style={lbl}>Email</label><input style={inp} value={form.email} onChange={e => set('email', e.target.value)} /></div>
          </div>
        )}

        {form.type === 'Software' && (
          <div style={{ marginBottom: 12 }}>
            <label style={lbl}>Software</label>
            <select style={inp} value={form.software} onChange={e => set('software', e.target.value)}>
              {SOFTWARE_OPTIONS.map(s => <option key={s} value={s}>{s}</option>)}
            </select>
          </div>
        )}

        <div style={{ display: 'grid', gridTemplateColumns: '1fr 1fr', gap: '10px 16px', marginBottom: 12 }}>
          <div style={{ gridColumn: showFiled ? '1' : '1 / -1' }}>
            <label style={lbl}>Filing Status</label>
            <select style={inp} value={form.filingStatus} onChange={e => set('filingStatus', e.target.value)}>
              {['Not Started', 'In Progress', 'Filed', 'Complete'].map(s => <option key={s} value={s}>{s}</option>)}
            </select>
          </div>
          {showFiled && <>
            <div><label style={lbl}>Filed Date</label><input type="date" style={inp} value={form.filedDate} onChange={e => set('filedDate', e.target.value)} /></div>
            <div style={{ gridColumn: '1 / -1' }}><label style={lbl}>Confirmation #</label><input style={inp} value={form.confirmation} placeholder="e.g. 2XK-9901" onChange={e => set('confirmation', e.target.value)} /></div>
          </>}
        </div>

        <div style={{ marginBottom: 20 }}>
          <label style={lbl}>Notes</label>
          <textarea rows={2} style={{ ...inp, resize: 'vertical' }} value={form.notes} onChange={e => set('notes', e.target.value)} />
        </div>

        <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center' }}>
          {preparer
            ? <button onClick={onDelete} disabled={busy} style={{ background: 'none', border: '1px solid #ef4444', color: '#ef4444', borderRadius: 8, padding: '7px 14px', cursor: 'pointer', fontSize: 12 }}>🗑 Remove</button>
            : <div />}
          <div style={{ display: 'flex', gap: 8 }}>
            <button onClick={onClose} style={{ background: '#2a2f45', color: '#a0a8c0', border: 'none', borderRadius: 8, padding: '7px 16px', cursor: 'pointer' }}>Cancel</button>
            <button onClick={() => onSave(form)} disabled={busy || (form.type === 'Accountant' && !form.name.trim())}
              style={{ background: '#4f6ef7', color: '#fff', border: 'none', borderRadius: 8, padding: '7px 18px', cursor: 'pointer', fontWeight: 600,
                       opacity: busy || (form.type === 'Accountant' && !form.name.trim()) ? 0.5 : 1 }}>
              {busy ? 'Saving…' : 'Save'}
            </button>
          </div>
        </div>
      </div>
    </div>
  );
}

function TaxPreparerCard({ preparer, year, onEdit }) {
  const STATUS_COLORS = { 'Not Started': '#6b7280', 'In Progress': '#c9a84c', 'Filed': '#4f6ef7', 'Complete': '#22c55e' };
  if (!preparer) {
    return (
      <div onClick={onEdit} style={{ background: 'transparent', border: '1px dashed #2a2f45', borderRadius: 10,
          padding: '14px 18px', cursor: 'pointer', color: '#6b7280', fontSize: 14, textAlign: 'center', marginTop: 20 }}
        onMouseEnter={e => e.currentTarget.style.borderColor = '#4f6ef7'}
        onMouseLeave={e => e.currentTarget.style.borderColor = '#2a2f45'}>
        ＋ Set Tax Preparer for {year}
      </div>
    );
  }
  const statusColor  = STATUS_COLORS[preparer.filingStatus] || '#6b7280';
  const isAccountant = preparer.type === 'Accountant';
  return (
    <div style={{ background: '#161926', border: '1px solid #2a2f45', borderRadius: 10, padding: '14px 16px', marginTop: 20 }}>
      <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'flex-start' }}>
        <div style={{ fontWeight: 600, fontSize: 12, color: '#6b7280', letterSpacing: 0.5 }}>{isAccountant ? '🧑‍💼' : '💻'} TAX PREPARER — {year}</div>
        <button onClick={onEdit} style={{ background: 'none', border: 'none', color: '#4f6ef7', cursor: 'pointer', fontSize: 13 }}>✏ Edit</button>
      </div>
      <div style={{ marginTop: 8 }}>
        {isAccountant ? (
          <>
            <div style={{ color: '#dde1f0', fontWeight: 600, fontSize: 14 }}>{preparer.name}{preparer.firm ? ` — ${preparer.firm}` : ''}</div>
            <div style={{ display: 'flex', gap: 14, marginTop: 4, flexWrap: 'wrap' }}>
              {preparer.phone && <span style={{ color: '#a0a8c0', fontSize: 13 }}>📞 {preparer.phone}</span>}
              {preparer.email && <span style={{ color: '#a0a8c0', fontSize: 13 }}>✉️ {preparer.email}</span>}
            </div>
          </>
        ) : (
          <div style={{ color: '#dde1f0', fontWeight: 600, fontSize: 14 }}>{preparer.software}</div>
        )}
      </div>
      <div style={{ display: 'flex', alignItems: 'center', gap: 8, marginTop: 10, flexWrap: 'wrap' }}>
        <span style={{ fontSize: 12, fontWeight: 700, color: statusColor, background: '#161926', border: `1px solid ${statusColor}`, borderRadius: 12, padding: '2px 10px' }}>{preparer.filingStatus}</span>
        {preparer.filedDate && <span style={{ fontSize: 12, color: '#a0a8c0' }}>{new Date(preparer.filedDate + 'T00:00:00').toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' })}</span>}
        {preparer.confirmation && <span style={{ fontSize: 12, color: '#a0a8c0' }}>· Conf: {preparer.confirmation}</span>}
      </div>
      {preparer.notes && <div style={{ marginTop: 8, fontSize: 12, color: '#6b7280', fontStyle: 'italic' }}>{preparer.notes}</div>}
    </div>
  );
}

// ---- TaxTab -----------------------------------------------------------------

function TaxTab({ apiUrl, apiToken }) {
  const currentTaxYear = new Date().getFullYear() - 1;
  const [year,          setYear]          = React.useState(currentTaxYear);
  const [docs,          setDocs]          = React.useState(null);
  const [preparer,      setPreparer]      = React.useState(null);
  const [preparerModal, setPreparerModal] = React.useState(false);
  const [ownerFilter,   setOwnerFilter]   = React.useState('All');
  const [editing,       setEditing]       = React.useState(null);
  const [showAdd,       setShowAdd]       = React.useState(false);
  const [busy,          setBusy]          = React.useState(false);
  const [error,         setError]         = React.useState(null);
  const [copyYear,      setCopyYear]      = React.useState('');
  const [showCopy,      setShowCopy]      = React.useState(false);

  function api(params) {
    const qs = Object.entries({ token: apiToken, ...params })
      .map(([k, v]) => `${encodeURIComponent(k)}=${encodeURIComponent(v)}`).join('&');
    return fetch(`${apiUrl}?${qs}`).then(r => r.json());
  }

  function load() {
    setDocs(null);
    api({ action: 'get_tax_documents', year })
      .then(d => setDocs(d.ok ? d.documents : []))
      .catch(() => { setDocs([]); setError('Failed to load'); });
  }

  function loadPreparer() {
    setPreparer(null);
    api({ action: 'get_tax_preparer', year })
      .then(d => setPreparer(d.ok ? (d.preparer || false) : false))
      .catch(() => setPreparer(false));
  }

  React.useEffect(() => { if (apiUrl && apiToken) { load(); loadPreparer(); } }, [year, apiUrl, apiToken]);

  function cycleStatus(doc) {
    const order = ['not_received','received','verified','uploaded'];
    const next  = order[(order.indexOf(doc.status) + 1) % order.length];
    setBusy(true);
    api({ action: 'update_tax_document', id: doc.id, status: next })
      .then(() => { load(); setBusy(false); }).catch(() => setBusy(false));
  }

  function saveDoc(form) {
    setBusy(true);
    const action = editing ? 'update_tax_document' : 'add_tax_document';
    const params = { action, ...form };
    if (editing) params.id = editing.id;
    api(params).then(() => { setBusy(false); setEditing(null); setShowAdd(false); load(); })
      .catch(() => setBusy(false));
  }

  function deleteDoc(doc) {
    if (!confirm(`Delete ${doc.formType} from ${doc.issuer}?`)) return;
    api({ action: 'delete_tax_document', id: doc.id }).then(load);
  }

  function savePreparer(form) {
    setBusy(true);
    api({ action: 'save_tax_preparer', year, ...form })
      .then(() => { setBusy(false); setPreparerModal(false); loadPreparer(); })
      .catch(() => setBusy(false));
  }

  function deletePreparer() {
    if (!confirm('Remove tax preparer info for ' + year + '?')) return;
    setBusy(true);
    api({ action: 'delete_tax_preparer', year })
      .then(() => { setBusy(false); setPreparerModal(false); setPreparer(false); })
      .catch(() => setBusy(false));
  }

  function doCopyYear() {
    if (!copyYear) return;
    setBusy(true);
    api({ action: 'copy_tax_year', fromYear: copyYear, toYear: year })
      .then(() => { setBusy(false); setShowCopy(false); load(); })
      .catch(() => setBusy(false));
  }

  const STATUS_META = {
    not_received: { label: '⬜ Not Received', color: '#6b7280' },
    received:     { label: '📬 Received',     color: '#c9a84c' },
    verified:     { label: '✅ Verified',      color: '#4f6ef7' },
    uploaded:     { label: '📤 Uploaded',      color: '#22c55e' },
  };

  const filtered  = (docs || []).filter(d => ownerFilter === 'All' || d.owner === ownerFilter);
  const total     = filtered.length;
  const uploaded  = filtered.filter(d => d.status === 'uploaded').length;
  const notRec    = filtered.filter(d => d.status === 'not_received').length;
  const received  = filtered.filter(d => d.status === 'received').length;
  const verified  = filtered.filter(d => d.status === 'verified').length;
  const categories = ['Income','Investment','Deduction','Business','Last Year Return','Other'];
  const grouped   = {};
  categories.forEach(c => { grouped[c] = []; });
  filtered.forEach(d => { (grouped[d.category] || grouped['Other']).push(d); });
  const pillStyle = active => ({ background: active ? '#2a2f45' : 'transparent', color: active ? '#dde1f0' : '#6b7280', border: '1px solid #2a2f45', borderRadius: 20, padding: '4px 14px', fontSize: 12, cursor: 'pointer' });

  return (
    <div>
      {/* Year nav + Add */}
      <div style={{ display: 'flex', alignItems: 'center', gap: 12, marginBottom: 16 }}>
        <button onClick={() => setYear(y => y - 1)} style={{ background: 'transparent', color: '#4f6ef7', border: 'none', fontSize: 20, cursor: 'pointer' }}>‹</button>
        <span style={{ fontWeight: 700, fontSize: 16, color: '#dde1f0', minWidth: 60, textAlign: 'center' }}>{year}</span>
        <button onClick={() => setYear(y => y + 1)} style={{ background: 'transparent', color: '#4f6ef7', border: 'none', fontSize: 20, cursor: 'pointer' }}>›</button>
        <div style={{ flex: 1 }} />
        <button onClick={() => setShowCopy(true)} style={{ background: 'transparent', color: '#4f6ef7', border: '1px solid #2a2f45', borderRadius: 8, padding: '6px 14px', fontSize: 12, cursor: 'pointer' }}>Copy Year</button>
        <button onClick={() => setShowAdd(true)} style={{ background: '#4f6ef7', color: '#fff', border: 'none', borderRadius: 8, padding: '6px 16px', fontSize: 13, cursor: 'pointer', fontWeight: 600 }}>+ Add</button>
      </div>

      {/* Progress bar */}
      {docs && docs.length > 0 && (
        <div style={{ background: '#161926', border: '1px solid #2a2f45', borderRadius: 10, padding: '12px 16px', marginBottom: 14 }}>
          <div style={{ display: 'flex', justifyContent: 'space-between', marginBottom: 6 }}>
            <span style={{ color: '#dde1f0', fontWeight: 600, fontSize: 13 }}>{uploaded} of {total} documents uploaded</span>
            <span style={{ color: '#22c55e', fontSize: 13 }}>{total > 0 ? Math.round(uploaded / total * 100) : 0}%</span>
          </div>
          <div style={{ background: '#2a2f45', borderRadius: 4, height: 6, marginBottom: 10 }}>
            <div style={{ background: '#22c55e', borderRadius: 4, height: 6, width: `${total > 0 ? (uploaded / total * 100) : 0}%`, transition: 'width 0.3s' }} />
          </div>
          <div style={{ display: 'flex', gap: 16, fontSize: 12, flexWrap: 'wrap' }}>
            <span style={{ color: '#6b7280' }}>⬜ {notRec} missing</span>
            <span style={{ color: '#c9a84c' }}>📬 {received} received</span>
            <span style={{ color: '#4f6ef7' }}>✅ {verified} verified</span>
            <span style={{ color: '#22c55e' }}>📤 {uploaded} uploaded</span>
          </div>
        </div>
      )}

      {/* Owner filter */}
      <div style={{ display: 'flex', gap: 8, marginBottom: 14, flexWrap: 'wrap' }}>
        {['All','Ahmed','Victoria','Joint'].map(o => (
          <button key={o} onClick={() => setOwnerFilter(o)} style={pillStyle(ownerFilter === o)}>{o}</button>
        ))}
      </div>

      {docs === null && <div style={{ color: '#6b7280', textAlign: 'center', padding: 40 }}>Loading…</div>}
      {error && <div style={{ color: '#ef4444', marginBottom: 12 }}>{error}</div>}

      {docs && docs.length === 0 && (
        <div style={{ background: '#161926', border: '1px dashed #2a2f45', borderRadius: 10, padding: 32, textAlign: 'center' }}>
          <div style={{ fontSize: 32, marginBottom: 10 }}>📄</div>
          <div style={{ color: '#dde1f0', marginBottom: 6 }}>No documents for {year}</div>
          <div style={{ display: 'flex', gap: 10, justifyContent: 'center', marginTop: 12 }}>
            <button onClick={() => setShowAdd(true)} style={{ background: '#4f6ef7', color: '#fff', border: 'none', borderRadius: 8, padding: '7px 16px', fontSize: 13, cursor: 'pointer' }}>+ Add Document</button>
            <button onClick={() => setShowCopy(true)} style={{ background: 'transparent', color: '#4f6ef7', border: '1px solid #2a2f45', borderRadius: 8, padding: '7px 16px', fontSize: 13, cursor: 'pointer' }}>Copy from Previous Year</button>
          </div>
        </div>
      )}

      {/* Document list grouped by category */}
      {docs && docs.length > 0 && categories.map(cat => {
        const catDocs = grouped[cat];
        if (!catDocs || catDocs.length === 0) return null;
        return (
          <div key={cat} style={{ marginBottom: 18 }}>
            <div style={{ fontSize: 11, fontWeight: 700, color: '#6b7280', textTransform: 'uppercase', letterSpacing: 1, marginBottom: 8 }}>{cat}</div>
            {catDocs.map(doc => {
              const sm = STATUS_META[doc.status] || STATUS_META.not_received;
              return (
                <div key={doc.id} style={{ background: '#1e2235', border: '1px solid #2a2f45', borderRadius: 8, padding: '10px 14px', marginBottom: 6, display: 'flex', alignItems: 'center', gap: 10 }}>
                  <button onClick={() => cycleStatus(doc)} disabled={busy} title="Click to advance status"
                    style={{ background: '#161926', border: '1px solid #2a2f45', borderRadius: 6, color: sm.color, padding: '3px 10px', fontSize: 11, cursor: 'pointer', whiteSpace: 'nowrap', fontWeight: 600, minWidth: 110 }}>
                    {sm.label}
                  </button>
                  <div style={{ flex: 1 }}>
                    <div style={{ color: '#dde1f0', fontWeight: 600, fontSize: 13 }}>{doc.formType}</div>
                    <div style={{ color: '#a0a8c0', fontSize: 12 }}>{doc.issuer}{doc.account ? ` — ${doc.account}` : ''}</div>
                  </div>
                  <span style={{ fontSize: 11, color: '#6b7280', background: '#161926', border: '1px solid #2a2f45', borderRadius: 10, padding: '2px 8px', whiteSpace: 'nowrap' }}>{doc.owner}</span>
                  {doc.docLink && <a href={doc.docLink} target="_blank" style={{ color: '#4f6ef7', fontSize: 13, textDecoration: 'none' }}>🔗</a>}
                  <button onClick={() => setEditing(doc)} style={{ background: 'none', border: 'none', color: '#c9a84c', cursor: 'pointer', fontSize: 14, padding: '0 4px' }}>✏</button>
                  <button onClick={() => deleteDoc(doc)} style={{ background: 'none', border: 'none', color: '#ef4444', cursor: 'pointer', fontSize: 14, padding: '0 4px' }}>🗑</button>
                </div>
              );
            })}
          </div>
        );
      })}

      {/* Copy year modal */}
      {showCopy && (
        <div style={{ position: 'fixed', inset: 0, background: 'rgba(0,0,0,0.75)', zIndex: 1000, display: 'flex', alignItems: 'center', justifyContent: 'center' }}>
          <div style={{ background: '#1e2235', border: '1px solid #2a2f45', borderRadius: 12, padding: 24, width: 320 }}>
            <div style={{ fontWeight: 700, color: '#dde1f0', marginBottom: 14 }}>Copy from Previous Year</div>
            <select style={{ background: '#161926', border: '1px solid #2a2f45', borderRadius: 6, color: '#dde1f0', padding: '7px 10px', width: '100%', fontSize: 13, marginBottom: 16 }}
              value={copyYear} onChange={ev => setCopyYear(ev.target.value)}>
              <option value="">— select year —</option>
              {[year-1, year-2, year-3].map(y => <option key={y} value={y}>{y}</option>)}
            </select>
            <div style={{ display: 'flex', gap: 10, justifyContent: 'flex-end' }}>
              <button onClick={() => setShowCopy(false)} style={{ background: '#2a2f45', color: '#a0a8c0', border: 'none', borderRadius: 8, padding: '7px 16px', cursor: 'pointer' }}>Cancel</button>
              <button onClick={doCopyYear} disabled={!copyYear || busy} style={{ background: '#4f6ef7', color: '#fff', border: 'none', borderRadius: 8, padding: '7px 16px', cursor: 'pointer', fontWeight: 600 }}>{busy ? 'Copying…' : 'Copy'}</button>
            </div>
          </div>
        </div>
      )}

      {(showAdd || editing) && (
        <TaxDocModal doc={editing || null} busy={busy}
          onClose={() => { setShowAdd(false); setEditing(null); }} onSave={saveDoc} />
      )}

      {/* Tax Preparer card + modal */}
      <div style={{ marginTop: 24 }}>
        <TaxPreparerCard preparer={preparer} year={year} onEdit={() => setPreparerModal(true)} />
      </div>
      {preparerModal && (
        <TaxPreparerModal
          preparer={preparer || null}
          year={year}
          busy={busy}
          onSave={savePreparer}
          onDelete={deletePreparer}
          onClose={() => setPreparerModal(false)}
        />
      )}
    </div>
  );
}

// ---- Coupons ----------------------------------------------------------------

function CouponsLiteTab({ apiUrl, apiToken }) {
  const [coupons,     setCoupons]     = React.useState([]);
  const [loading,     setLoading]     = React.useState(false);
  const [busy,        setBusy]        = React.useState(false);
  const [uploading,   setUploading]   = React.useState(false);
  const [confirmForm, setConfirmForm] = React.useState(null);
  const [copyTip,     setCopyTip]     = React.useState(null);
  const fileInputRef = React.useRef(null);

  function load() {
    if (!apiUrl || !apiToken) return;
    setLoading(true);
    apiGet(apiUrl, apiToken, { action: 'get_coupons' })
      .then(d => setCoupons(d.coupons || []))
      .catch(() => {})
      .finally(() => setLoading(false));
  }

  React.useEffect(() => { load(); }, [apiUrl, apiToken]);

  function expiryInfo(expiresStr) {
    if (!expiresStr) return { label: '', color: '#6b7280', days: null };
    const exp  = new Date(expiresStr + 'T00:00:00');
    const now  = new Date(); now.setHours(0,0,0,0);
    const days = Math.round((exp - now) / 86400000);
    if (days < 0)   return { label: 'EXPIRED',              color: '#6b7280', days };
    if (days === 0) return { label: '⚠ Expires Today',      color: '#ef4444', days };
    if (days <= 3)  return { label: `⚠ Expires in ${days}d`, color: '#ef4444', days };
    return { label: `Valid · ${days}d`, color: '#22c55e', days };
  }

  function copyCode(id, field, text) {
    navigator.clipboard.writeText(text).catch(() => {});
    setCopyTip({ id, field });
    setTimeout(() => setCopyTip(null), 1500);
  }

  async function handleFileChange(e) {
    const file = e.target.files && e.target.files[0];
    if (!file) return;
    e.target.value = '';
    setUploading(true);
    try {
      const { base64, mimeType } = await resizeImage(file, 1600);
      const data = await apiPost(apiUrl, apiToken, { action: 'extract_coupon', imageBase64: base64, imageMimeType: mimeType });
      const ex = data.extracted || {};
      setConfirmForm({
        store: ex.store || '', offer: ex.offer || '', discount: ex.discount || '',
        minSpend: ex.minSpend || '', offerCode: ex.offerCode || '',
        customerCode: ex.customerCode || '', expires: ex.expires || '',
        channel: ex.channel || '', addressedTo: ex.addressedTo || '',
      });
    } catch (err) { alert('Could not extract coupon: ' + err.message); }
    setUploading(false);
  }

  async function handleSave() {
    if (!confirmForm) return;
    setBusy(true);
    try {
      await apiPost(apiUrl, apiToken, { action: 'save_coupon', ...confirmForm });
      setConfirmForm(null);
      load();
    } catch (err) { alert('Save failed: ' + err.message); }
    setBusy(false);
  }

  async function handleDelete(id) {
    if (!confirm('Delete this coupon?')) return;
    setBusy(true);
    try { await apiGet(apiUrl, apiToken, { action: 'delete_coupon', id }); load(); }
    catch (err) { alert('Delete failed: ' + err.message); }
    setBusy(false);
  }

  async function handleMarkUsed(id) {
    setBusy(true);
    try { await apiGet(apiUrl, apiToken, { action: 'mark_coupon_used', id }); load(); }
    catch (err) { alert('Failed: ' + err.message); }
    setBusy(false);
  }

  // Sort: soonest expiry first, no-expiry last, expired at bottom
  const sorted = [...coupons].sort((a, b) => {
    const now = new Date(); now.setHours(0,0,0,0);
    const da  = a.Expires ? new Date(a.Expires + 'T00:00:00') : null;
    const db  = b.Expires ? new Date(b.Expires + 'T00:00:00') : null;
    const dA  = da ? Math.round((da - now) / 86400000) : 9999;
    const dB  = db ? Math.round((db - now) / 86400000) : 9999;
    return (dA < 0 ? 99999 : dA) - (dB < 0 ? 99999 : dB);
  });

  return (
    <div>
      {/* Toolbar */}
      <div style={{ display: 'flex', alignItems: 'center', gap: 10, marginBottom: 16 }}>
        <button
          onClick={() => fileInputRef.current && fileInputRef.current.click()}
          disabled={busy || uploading}
          style={{ background: '#4f6ef7', color: '#fff', border: 'none', borderRadius: 8, padding: '7px 16px', fontSize: 13, cursor: 'pointer', fontWeight: 600 }}
        >
          {uploading ? '⏳ Extracting…' : '📷 Add Coupon'}
        </button>
        <span style={{ fontSize: 12, color: '#6b7280' }}>{sorted.length} coupon{sorted.length !== 1 ? 's' : ''}</span>
        <input ref={fileInputRef} type="file" accept="image/*" style={{ display: 'none' }} onChange={handleFileChange} />
      </div>

      {loading && sorted.length === 0 && <div style={{ color: '#6b7280', textAlign: 'center', padding: 32 }}>Loading…</div>}

      {!loading && sorted.length === 0 && (
        <div style={{ background: '#161926', border: '1px dashed #2a2f45', borderRadius: 10, padding: 32, textAlign: 'center' }}>
          <div style={{ fontSize: 36, marginBottom: 10 }}>🎟️</div>
          <div style={{ color: '#a0a8c0' }}>No coupons saved. Snap a photo to add one.</div>
        </div>
      )}

      {sorted.map(c => {
        const exp      = expiryInfo(c.Expires);
        const expiring = exp.days !== null && exp.days >= 0 && exp.days <= 3;
        const expired  = exp.days !== null && exp.days < 0;
        return (
          <div key={c.ID} style={{
            background: '#1e2235',
            border: `1px solid ${expiring ? '#ef4444' : '#2a2f45'}`,
            borderLeft: expiring ? '4px solid #ef4444' : expired ? '4px solid #555' : '4px solid transparent',
            borderRadius: 10, padding: '14px 16px', marginBottom: 10,
            opacity: expired ? 0.6 : 1,
          }}>
            <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'flex-start', gap: 8 }}>
              <div style={{ flex: 1 }}>
                {/* Store + channel + discount */}
                <div style={{ display: 'flex', alignItems: 'center', gap: 8, flexWrap: 'wrap', marginBottom: 4 }}>
                  <span style={{ fontWeight: 700, fontSize: 15, color: '#dde1f0' }}>{c.Store || '—'}</span>
                  {c.Channel && (
                    <span style={{ fontSize: 11, background: '#2a2f45', color: '#a0a8c0', borderRadius: 4, padding: '2px 6px' }}>{c.Channel}</span>
                  )}
                  {c.Discount && (
                    <span style={{ fontSize: 12, fontWeight: 700, color: '#22c55e' }}>{c.Discount}</span>
                  )}
                </div>
                {c.Offer && <div style={{ fontSize: 13, color: '#a0a8c0', marginBottom: 6 }}>{c.Offer}</div>}
                {/* Expiry chip */}
                {c.Expires && (
                  <span style={{ fontSize: 11, color: exp.color, fontWeight: 600,
                                 background: expired ? '#2a2a2a' : expiring ? '#3e1010' : '#0d2e12',
                                 borderRadius: 4, padding: '2px 7px', display: 'inline-block', marginBottom: 8 }}>
                    {exp.label}
                  </span>
                )}
                {/* Codes */}
                {c['Offer Code'] && (
                  <div style={{ display: 'flex', alignItems: 'center', gap: 6, fontSize: 13, marginBottom: 3 }}>
                    <span style={{ color: '#6b7280', minWidth: 95 }}>Offer Code:</span>
                    <span style={{ fontFamily: 'monospace', color: '#dde1f0', letterSpacing: 1 }}>{c['Offer Code']}</span>
                    <button onClick={() => copyCode(c.ID, 'offer', c['Offer Code'])}
                      style={{ background: 'none', border: 'none', cursor: 'pointer', fontSize: 14, color: '#4f6ef7', padding: '0 4px' }}>
                      {copyTip && copyTip.id === c.ID && copyTip.field === 'offer' ? '✓' : '📋'}
                    </button>
                  </div>
                )}
                {c['Customer Code'] && (
                  <div style={{ display: 'flex', alignItems: 'center', gap: 6, fontSize: 13, marginBottom: 3 }}>
                    <span style={{ color: '#6b7280', minWidth: 95 }}>Customer Code:</span>
                    <span style={{ fontFamily: 'monospace', color: '#dde1f0', letterSpacing: 1 }}>{c['Customer Code']}</span>
                    <button onClick={() => copyCode(c.ID, 'customer', c['Customer Code'])}
                      style={{ background: 'none', border: 'none', cursor: 'pointer', fontSize: 14, color: '#4f6ef7', padding: '0 4px' }}>
                      {copyTip && copyTip.id === c.ID && copyTip.field === 'customer' ? '✓' : '📋'}
                    </button>
                  </div>
                )}
                {c['Addressed To'] && (
                  <div style={{ fontSize: 12, color: '#6b7280', marginTop: 2 }}>Addressed to: {c['Addressed To']}</div>
                )}
              </div>
            </div>
            {/* Actions */}
            <div style={{ display: 'flex', gap: 8, marginTop: 12, justifyContent: 'flex-end' }}>
              <button onClick={() => handleMarkUsed(c.ID)} disabled={busy}
                style={{ background: '#166534', color: '#86efac', border: 'none', borderRadius: 6, padding: '5px 14px', fontSize: 12, cursor: 'pointer', fontWeight: 600 }}>
                ✓ Mark as Used
              </button>
              <button onClick={() => handleDelete(c.ID)} disabled={busy}
                style={{ background: 'none', border: '1px solid #ef4444', color: '#ef4444', borderRadius: 6, padding: '5px 12px', fontSize: 12, cursor: 'pointer' }}>
                × Delete
              </button>
            </div>
          </div>
        );
      })}

      {/* Confirmation modal */}
      {confirmForm && (
        <div style={{ position: 'fixed', inset: 0, background: 'rgba(0,0,0,0.75)', zIndex: 1000, display: 'flex', alignItems: 'center', justifyContent: 'center', padding: 16 }}>
          <div style={{ background: '#1e2235', border: '1px solid #2a2f45', borderRadius: 14, padding: 24, width: '100%', maxWidth: 500, maxHeight: '90vh', overflowY: 'auto' }}
            onClick={e => e.stopPropagation()}>
            <h3 style={{ margin: '0 0 18px', color: '#dde1f0', fontSize: 16 }}>🎟️ Confirm Coupon Details</h3>
            {[
              { key: 'store',        label: 'Store',         type: 'text'   },
              { key: 'offer',        label: 'Offer',         type: 'text'   },
              { key: 'discount',     label: 'Discount',      type: 'text'   },
              { key: 'minSpend',     label: 'Min Spend ($)', type: 'number' },
              { key: 'offerCode',    label: 'Offer Code',    type: 'text'   },
              { key: 'customerCode', label: 'Customer Code', type: 'text'   },
              { key: 'expires',      label: 'Expiry Date',   type: 'date'   },

}

function PurchaseHistoryTab({ items }) {
  const [filter, setFilter] = React.useState('');
  const filtered = (items || []).filter(item =>
    !filter || item.normalized.toLowerCase().includes(filter.toLowerCase())
  );
  const confColor = { default: '#5f6a8a', learning: '#c9a84c', building: '#e8a020', calibrated: '#43a047' };

  function relDate(ds) {
    if (!ds) return '—';
    const diff = Math.round((new Date() - new Date(ds + 'T00:00:00')) / 86400000);
    if (diff === 0) return 'Today';
    if (diff === 1) return 'Yesterday';
    if (diff < 30) return diff + 'd ago';
    if (diff < 365) return Math.round(diff / 30) + 'mo ago';
    return Math.round(diff / 365) + 'yr ago';
  }

  if (!items || items.length === 0) {
    return (
      <div className="empty-state" style={{ padding: 40 }}>
        <div style={{ fontSize: 32, marginBottom: 12 }}>📊</div>
        <div>No purchase history yet.</div>
        <div style={{ fontSize: 13, color: '#6b7fa8', marginTop: 8 }}>
          Log a shopping run or scan a receipt in Chat to get started.
        </div>
      </div>
    );
  }

  return (
    <div>
      <input
        placeholder="Search items…"
        value={filter} onChange={e => setFilter(e.target.value)}
        style={{
          width: '100%', boxSizing: 'border-box', background: '#0d1b3e',
          border: '1px solid #1e3060', borderRadius: 6, color: '#dde1f0',
          padding: '8px 12px', fontSize: 13, marginBottom: 16,
        }}
      />
      <div style={{ display: 'grid', gridTemplateColumns: 'repeat(auto-fill, minmax(200px, 1fr))', gap: 10 }}>
        {filtered.map((item, i) => (
          <div key={i} style={{
            background: '#0d1b3e', border: '1px solid #1e3060', borderRadius: 8, padding: '12px 14px',
          }}>
            <div style={{ fontSize: 14, fontWeight: 600, color: '#dde1f0', marginBottom: 6, textTransform: 'capitalize' }}>
              {item.normalized}
            </div>
            <div style={{ fontSize: 12, color: '#8a9abf', lineHeight: 1.6 }}>
              <div>Last: {relDate(item.lastDate)}{item.lastStore ? ' (' + item.lastStore + ')' : ''}</div>
              <div>Every ~{item.avgDays}d</div>
              {item.estimatedNext && <div style={{ color: '#c9a84c' }}>Next: {item.estimatedNext}</div>}
            </div>
            <div style={{
              marginTop: 8, display: 'inline-block', fontSize: 10, fontWeight: 700,
              color: confColor[item.confidence] || '#5f6a8a',
              background: (confColor[item.confidence] || '#5f6a8a') + '22',
              borderRadius: 20, padding: '2px 8px', textTransform: 'uppercase', letterSpacing: '0.5px',
            }}>
              {item.confidence}
            </div>
          </div>
        ))}
      </div>
    </div>
  );
}

function HomestewardView({ items, loading, busy, onRecordService }) {
  if (loading) return <div style={{ fontSize: 13, color: '#6b7fa8', padding: 16 }}>Loading home items…</div>;
  if (!items || !items.length) return (
    <div className="empty-state" style={{ marginTop: 8 }}>
      <div style={{ fontSize: 32, marginBottom: 12 }}>🏠</div>
      <div style={{ color: '#dde1f0', marginBottom: 6 }}>No home items yet</div>
      <div style={{ fontSize: 12, color: '#4d6080' }}>Add rows to the Home Items tab in your Life OS sheet.</div>
    </div>
  );

  function warrantyBadge(days) {
    if (days === null || days === undefined) return null;
    if (days < 0)  return { label: '🔴 Expired',       color: '#ef5350', bg: 'rgba(239,83,80,.12)' };
    if (days <= 30) return { label: `🟡 Expires in ${days}d`, color: '#f5a623', bg: 'rgba(245,166,35,.12)' };
    return { label: '🟢 Valid',           color: '#66bb6a', bg: 'rgba(102,187,106,.12)' };
  }
  function serviceBadge(days) {
    if (days === null || days === undefined) return null;
    if (days < 0)  return { label: '🔴 Overdue',      color: '#ef5350', bg: 'rgba(239,83,80,.12)' };
    if (days <= 14) return { label: `🟡 Due in ${days}d`, color: '#f5a623', bg: 'rgba(245,166,35,.12)' };
    return { label: '🟢 Scheduled',       color: '#66bb6a', bg: 'rgba(102,187,106,.12)' };
  }
  function badge(b, label, color, bg) {
    return <span style={{ fontSize: 10, padding: '2px 7px', borderRadius: 10, border: `1px solid ${color}`, color, background: bg, whiteSpace: 'nowrap' }}>{label}</span>;
  }

  const grouped = {}, uncategorised = [];
  items.forEach(item => {
    const cat = (item.category || '').trim();
    if (!cat) { uncategorised.push(item); return; }
    if (!grouped[cat]) grouped[cat] = [];
    grouped[cat].push(item);
  });
  const cats = Object.keys(grouped).sort();
  if (uncategorised.length) cats.push('');

  const overdueCount = items.filter(i => i.serviceDays !== null && i.serviceDays < 0).length;
  const dueSoonCount = items.filter(i => i.serviceDays !== null && i.serviceDays >= 0 && i.serviceDays <= 14).length;

  return (
    <div>
      {overdueCount > 0 && (
        <div style={{ background: 'rgba(239,83,80,.1)', border: '1px solid rgba(239,83,80,.3)', borderRadius: 8, padding: '8px 12px', marginBottom: 14, fontSize: 12, color: '#ef5350' }}>
          🔴 {overdueCount} item{overdueCount > 1 ? 's' : ''} overdue for service
        </div>
      )}
      {!overdueCount && dueSoonCount > 0 && (
        <div style={{ background: 'rgba(245,166,35,.1)', border: '1px solid rgba(245,166,35,.3)', borderRadius: 8, padding: '8px 12px', marginBottom: 14, fontSize: 12, color: '#f5a623' }}>
          🟡 {dueSoonCount} item{dueSoonCount > 1 ? 's' : ''} due for service within 14 days
        </div>
      )}

      {cats.map(cat => {
        const catItems = (cat ? grouped[cat] : uncategorised);
        return (
          <div key={cat || '__none'} style={{ marginBottom: 20 }}>
            {cat && (
              <div style={{ fontSize: 11, fontWeight: 700, textTransform: 'uppercase', letterSpacing: '0.06em', color: '#c9a84c', borderBottom: '1px solid #1e3060', paddingBottom: 4, marginBottom: 8 }}>
                {cat}
              </div>
            )}
            {catItems.map((item, i) => {
              const wb = warrantyBadge(item.warrantyDays);
              const sb = serviceBadge(item.serviceDays);
              return (
                <div key={i} style={{ padding: '10px 0', borderBottom: '1px solid #0d1b3e' }}>
                  <div style={{ display: 'flex', alignItems: 'center', gap: 8, flexWrap: 'wrap' }}>
                    <span style={{ fontSize: 13, fontWeight: 600, color: '#dde1f0', flex: 1, minWidth: 120 }}>{item.item}</span>
                    {item.warrantyExpiry && wb && badge(null, wb.label, wb.color, wb.bg)}
                    {item.nextService && sb && badge(null, sb.label, sb.color, sb.bg)}
                    <button
                      style={{ fontSize: 11, padding: '3px 10px', borderRadius: 12, border: '1px solid #2a4070', background: 'none', color: '#8899cc', cursor: item.intervalMonths ? 'pointer' : 'not-allowed', opacity: item.intervalMonths ? 1 : 0.4, whiteSpace: 'nowrap' }}
                      onClick={() => item.intervalMonths && onRecordService(item.row)}
                      disabled={busy || !item.intervalMonths}
                      title={item.intervalMonths ? 'Record service & schedule next' : 'Set Interval (mo) to enable scheduling'}
                    >✓ Record Service</button>
                  </div>
                  <div style={{ display: 'flex', gap: 16, marginTop: 4, flexWrap: 'wrap' }}>
                    {item.warrantyExpiry && <span style={{ fontSize: 11, color: '#6b7fa8' }}>🛡️ Warranty: {item.warrantyExpiry}</span>}
                    {item.lastService   && <span style={{ fontSize: 11, color: '#6b7fa8' }}>🔧 Last: {item.lastService}</span>}
                    {item.nextService   && <span style={{ fontSize: 11, color: '#6b7fa8' }}>📅 Next: {item.nextService}</span>}
                    {item.intervalMonths && <span style={{ fontSize: 11, color: '#6b7fa8' }}>↻ Every {item.intervalMonths}mo</span>}
                  </div>
                  {item.notes && <div style={{ fontSize: 11, color: '#4d6080', marginTop: 2 }}>{item.notes}</div>}
                </div>
              );
            })}
          </div>
        );
      })}
    </div>
  );
}

function StarRating({ value, onChange, size }) {
  const sz = size || 16;
  return (
    <span style={{ display: 'inline-flex', gap: 2 }}>
      {[1,2,3,4,5].map(n => (
        <span
          key={n}
          onClick={onChange ? () => onChange(n) : undefined}
          style={{
            fontSize: sz, lineHeight: 1,
            color: n <= (value || 0) ? '#c9a84c' : '#2a4070',
            cursor: onChange ? 'pointer' : 'default',
            userSelect: 'none',
          }}
        >★</span>
      ))}
    </span>
  );
}

              {r.tags      && <span style={{ fontSize: 11, color: '#6b7fa8' }}>🏷 {r.tags}</span>}
            </div>
            {r.notes && <div style={{ fontSize: 11, color: '#4d6080', marginTop: 3 }}>{r.notes}</div>}
          </div>
        );
      })}
    </div>
  );
}

const CADENCES = ['Daily', 'Weekly', 'Biweekly', 'Monthly', 'Bimonthly', 'Quarterly', 'Annually', 'Seasonal'];

const CADENCE_META = {
  Daily:      { label: '☀️ Daily',      reset: 'Resets nightly'                    },
  Weekly:     { label: '📅 Weekly',     reset: 'Resets every Friday'               },
  Biweekly:   { label: '🗓️ Biweekly',  reset: 'Resets every other Friday'         },
  Monthly:    { label: '📆 Monthly',    reset: 'Resets last day of month'          },
  Bimonthly:  { label: '🔄 Bimonthly', reset: 'Resets every other month'          },
  Quarterly:  { label: '📊 Quarterly', reset: 'Resets end of each quarter'        },
  Annually:   { label: '🏆 Annually',  reset: 'Resets Dec 31'                     },
  Seasonal:   { label: '🌿 Seasonal',  reset: 'No auto-reset'                     },
};

function ChoresView({ chores, loading, busy, onToggle, onAdd, onDelete, onUpdateCadence }) {
  const [expanded,    setExpanded]    = React.useState({ Daily: true, Weekly: true, Biweekly: true, Monthly: true, Bimonthly: true, Quarterly: true, Annually: true, Seasonal: true });
  const [addCadence,  setAddCadence]  = React.useState(null);
  const [addText,     setAddText]     = React.useState('');
  const [dragId,      setDragId]      = React.useState(null);
  const [dragOverCad, setDragOverCad] = React.useState(null);

  if (loading) return <div style={{ fontSize: 13, color: '#6b7fa8', padding: 16 }}>Loading chores…</div>;

  const byCategory = {};
  CADENCES.forEach(function(c) { byCategory[c] = []; });
  (chores || []).forEach(function(ch) {
    var cat = ch.Cadence || 'Daily';
    if (!byCategory[cat]) byCategory[cat] = [];
    byCategory[cat].push(ch);
  });

  const total   = (chores || []).length;
  const done    = (chores || []).filter(function(c) { return c.Checked === true || c.Checked === 'TRUE'; }).length;
  const pct     = total ? Math.round((done / total) * 100) : 0;

  function handleDrop(cadence) {
    if (dragId) {
      onUpdateCadence(dragId, cadence);
    }
    setDragId(null);
    setDragOverCad(null);
  }

  async function submitAdd(cadence) {
    const text = addText.trim();
    if (!text) return;
    setAddText('');
    setAddCadence(null);
    await onAdd(text, cadence);
  }

  const inputStyle = {
    flex: 1, padding: '5px 9px', borderRadius: 6, background: '#0a1628',
    border: '1px solid #1e3060', color: '#dde1f0', fontSize: 13,
  };

  return (
    <div>
      {total > 0 && (
        <div style={{ marginBottom: 16 }}>
          <div style={{ display: 'flex', justifyContent: 'space-between', fontSize: 12, color: '#6b7fa8', marginBottom: 4 }}>
            <span>{done}/{total} chores done today</span>
            <span>{pct}%</span>
          </div>
          <div style={{ height: 6, background: '#0e1e3a', borderRadius: 3, overflow: 'hidden' }}>
            <div style={{ width: pct + '%', height: '100%', background: pct === 100 ? '#2ecc71' : '#3a7bd5', borderRadius: 3, transition: 'width 0.3s' }} />
          </div>
        </div>
      )}

      {CADENCES.map(function(cadence) {
        const items   = byCategory[cadence] || [];
        const isOpen  = !!expanded[cadence];
        const isOver  = dragOverCad === cadence;
        const cadDone = items.filter(function(c) { return c.Checked === true || c.Checked === 'TRUE'; }).length;
        const meta    = CADENCE_META[cadence];

        return (
          <div key={cadence}
            style={{ marginBottom: 10, border: isOver ? '1px dashed #3a7bd5' : '1px solid #1e3060',
                     borderRadius: 8, background: '#0e1e3a', transition: 'border 0.15s' }}
            onDragOver={function(e) { e.preventDefault(); setDragOverCad(cadence); }}
            onDragLeave={function() { if (dragOverCad === cadence) setDragOverCad(null); }}
            onDrop={function(e) { e.preventDefault(); handleDrop(cadence); }}
          >
            <div style={{ display: 'flex', alignItems: 'center', padding: '9px 14px', cursor: 'pointer', userSelect: 'none' }}
              onClick={function() { setExpanded(function(prev) { return Object.assign({}, prev, { [cadence]: !prev[cadence] }); }); }}>
              <span style={{ fontSize: 13, fontWeight: 600, color: '#dde1f0', flex: 1 }}>
                {isOpen ? '▾' : '▸'} {meta.label}
                <span style={{ fontSize: 11, color: '#4d6080', fontWeight: 400, marginLeft: 8 }}>
                  {cadDone}/{items.length} · {meta.reset}
                </span>
              </span>
              <button className="btn btn-ghost" style={{ fontSize: 11, padding: '2px 8px' }}
                disabled={busy}
                onClick={function(e) { e.stopPropagation(); setAddText(''); setAddCadence(cadence); }}>
                ＋ Add
              </button>
            </div>

            {isOpen && (
              <div style={{ padding: '0 14px 10px' }}>
                {items.length === 0 && addCadence !== cadence && (
                  <div style={{ fontSize: 12, color: '#4d6080', marginBottom: 4 }}>No chores yet. Click ＋ Add to get started.</div>
                )}
                {items.map(function(ch) {
                  const checked = ch.Checked === true || ch.Checked === 'TRUE';
                  return (
                    <div key={ch.ID}
                      draggable
                      onDragStart={function() { setDragId(ch.ID); }}
                      onDragEnd={function() { setDragId(null); setDragOverCad(null); }}
                      style={{ display: 'flex', alignItems: 'center', padding: '5px 0',
                               borderBottom: '1px solid #0a1628', opacity: checked ? 0.55 : 1,
                               cursor: 'grab' }}>
                      <span style={{ marginRight: 8, cursor: 'default', color: '#4d6080', fontSize: 12 }}>⠿</span>
                      <input type="checkbox" checked={checked} style={{ marginRight: 10, cursor: 'pointer' }}
                        onChange={function() { onToggle(ch.ID, !checked); }} />
                      <span style={{ flex: 1, fontSize: 13, color: checked ? '#4d6080' : '#dde1f0',
                                     textDecoration: checked ? 'line-through' : 'none' }}>
                        {ch.Chore}
                      </span>
                      <button className="btn btn-ghost" style={{ fontSize: 11, color: '#c0392b', padding: '1px 6px', marginLeft: 6 }}
                        disabled={busy} onClick={function() { onDelete(ch.ID); }}>✕</button>
                    </div>
                  );
                })}

                {addCadence === cadence && (
                  <div style={{ display: 'flex', gap: 6, marginTop: 8 }}>
                    <input style={inputStyle} autoFocus placeholder={'Add ' + cadence.toLowerCase() + ' chore…'}
                      value={addText}
                      onChange={function(e) { setAddText(e.target.value); }}
                      onKeyDown={function(e) { if (e.key === 'Enter') submitAdd(cadence); if (e.key === 'Escape') setAddCadence(null); }} />
                    <button className="btn btn-primary" style={{ fontSize: 12, padding: '5px 12px' }}
                      disabled={busy || !addText.trim()} onClick={function() { submitAdd(cadence); }}>＋</button>
                    <button className="btn btn-ghost" style={{ fontSize: 12 }}
                      onClick={function() { setAddCadence(null); setAddText(''); }}>✕</button>
                  </div>
                )}
              </div>
            )}
          </div>
        );
      })}
    </div>
  );
}

function ChoreForOthersModal({ chore, onSave, onClose, busy }) {
  const editing = !!chore;
  const [task,     setTask]     = React.useState(chore ? chore.Task : '');
  const [assignee, setAssignee] = React.useState(chore ? chore.Assignee : '');
  const [reward,   setReward]   = React.useState(chore ? chore.Reward : '');
  const [notes,    setNotes]    = React.useState(chore ? chore.Notes : '');

  function handleSave() {
    if (!task.trim()) return;
    onSave({ task: task.trim(), assignee: assignee.trim(), reward: reward.trim(), notes: notes.trim() });
  }

  const inputStyle = {
    width: '100%', background: '#07122b', border: '1px solid #1e3060', borderRadius: 6,
    padding: '8px 12px', color: '#dde1f0', fontSize: 13, boxSizing: 'border-box', marginBottom: 14,
  };

  return (
    <div style={{ position: 'fixed', inset: 0, background: 'rgba(0,0,0,0.6)', display: 'flex', alignItems: 'center', justifyContent: 'center', zIndex: 1000 }}>
      <div style={{ background: '#0d1b3e', border: '1px solid #1e3060', borderRadius: 12, padding: 28, width: 420, maxWidth: '95vw' }}>
        <div style={{ fontSize: 16, fontWeight: 700, color: '#dde1f0', marginBottom: 20 }}>{editing ? 'Edit Chore' : 'Assign Chore'}</div>

        <label style={{ fontSize: 12, color: '#8a9abf', display: 'block', marginBottom: 4 }}>Task *</label>
        <input autoFocus value={task} onChange={e => setTask(e.target.value)} placeholder="e.g. Mow the front lawn" style={inputStyle} />

        <label style={{ fontSize: 12, color: '#8a9abf', display: 'block', marginBottom: 4 }}>Assignee</label>
        <input value={assignee} onChange={e => setAssignee(e.target.value)} placeholder="e.g. Jake next door" style={inputStyle} />

        <label style={{ fontSize: 12, color: '#8a9abf', display: 'block', marginBottom: 4 }}>Reward <span style={{ color: '#6b7fa8' }}>(optional)</span></label>
        <input value={reward} onChange={e => setReward(e.target.value)} placeholder="e.g. $10 or Pizza" style={inputStyle} />

        <label style={{ fontSize: 12, color: '#8a9abf', display: 'block', marginBottom: 4 }}>Notes <span style={{ color: '#6b7fa8' }}>(optional)</span></label>
        <input value={notes} onChange={e => setNotes(e.target.value)} placeholder="Any details…" style={inputStyle} />

        <div style={{ display: 'flex', gap: 10, justifyContent: 'flex-end' }}>
          <button className="btn" onClick={onClose} disabled={busy}>Cancel</button>
          <button className="btn btn-primary" onClick={handleSave} disabled={busy || !task.trim()}>{editing ? 'Save' : 'Assign'}</button>
        </div>
      </div>
    </div>
  );
}

function ChoresForOthersView({ chores, loading, busy, onAdd, onComplete, onEdit, onDelete }) {
  const [modal,    setModal]    = React.useState(null); // null | { mode:'add' } | { mode:'edit', chore }
  const [showDone, setShowDone] = React.useState(false);

  if (loading) return <div style={{ fontSize: 13, color: '#6b7fa8', padding: 16 }}>Loading…</div>;

  const open = (chores || []).filter(function(c) { return c.Status !== 'Done'; });
  const done = (chores || []).filter(function(c) { return c.Status === 'Done'; });

  function avatarColor(name) {
    const colors = ['#1565c0', '#6a1b9a', '#ad1457', '#00695c', '#e65100', '#4527a0'];
    var code = 0;
    for (var i = 0; i < (name || '').length; i++) code += name.charCodeAt(i);
    return colors[code % colors.length];
  }

  function renderCard(c) {
    const initials = (c.Assignee || '?').trim().split(' ').map(function(w) { return w[0]; }).join('').slice(0, 2).toUpperCase();
    const bg = avatarColor(c.Assignee);
    return (
      <div key={c.ID} style={{ display: 'flex', alignItems: 'center', gap: 12, padding: '12px 14px', borderRadius: 8, background: '#0d1b3e', border: '1px solid #1e3060' }}>
        <div style={{ width: 34, height: 34, borderRadius: '50%', background: bg, display: 'flex', alignItems: 'center', justifyContent: 'center', fontSize: 12, fontWeight: 700, color: '#fff', flexShrink: 0 }}>{initials}</div>
        <div style={{ flex: 1, minWidth: 0 }}>
          <div style={{ fontSize: 14, color: '#dde1f0', fontWeight: 500 }}>{c.Task}</div>
          {c.Assignee && <div style={{ fontSize: 11, color: '#6b7fa8', marginTop: 2 }}>{c.Assignee}</div>}
        </div>
        {c.Reward && <span style={{ background: 'rgba(201,168,76,0.15)', color: '#c9a84c', borderRadius: 20, padding: '2px 9px', fontSize: 11, fontWeight: 700, flexShrink: 0 }}>{c.Reward}</span>}
        <button className="btn btn-primary" style={{ fontSize: 11, padding: '4px 10px', flexShrink: 0 }} disabled={busy} onClick={function() { onComplete && onComplete(c.ID); }} title="Mark done">✓ Done</button>
        <button className="btn btn-ghost" style={{ fontSize: 13 }} disabled={busy} onClick={function() { setModal({ mode: 'edit', chore: c }); }} title="Edit">✏️</button>
        <button className="btn btn-ghost" style={{ fontSize: 13, opacity: 0.7 }} disabled={busy} onClick={function() { onDelete && onDelete(c.ID); }} title="Delete">🗑️</button>
      </div>
    );
  }

  return (
    <div>
      <div style={{ display: 'flex', alignItems: 'center', justifyContent: 'space-between', marginBottom: 16 }}>
        <span style={{ fontSize: 12, color: '#6b7fa8' }}>{open.length} open · {done.length} completed</span>
        <button className="btn btn-primary" style={{ fontSize: 12 }} disabled={busy} onClick={function() { setModal({ mode: 'add' }); }}>+ Assign Chore</button>
      </div>

      {open.length === 0 ? (
        <div className="empty-state">
          <div style={{ fontSize: 28, marginBottom: 10 }}>🧹</div>
          <div>No open chores — assign one with the button above.</div>
        </div>
      ) : (
        <div style={{ display: 'flex', flexDirection: 'column', gap: 8 }}>{open.map(renderCard)}</div>
      )}

      {done.length > 0 && (
        <div style={{ marginTop: 28 }}>
          <button onClick={function() { setShowDone(function(v) { return !v; }); }} style={{ background: 'none', border: 'none', cursor: 'pointer', color: '#6b7fa8', fontSize: 12, fontWeight: 600, display: 'flex', alignItems: 'center', gap: 6, padding: 0 }}>
            <span style={{ fontSize: 10 }}>{showDone ? '▼' : '▶'}</span>Completed ({done.length})
          </button>
          {showDone && (
            <div style={{ marginTop: 10, display: 'flex', flexDirection: 'column', gap: 6 }}>
              {done.map(function(c) {
                return (
                  <div key={c.ID} style={{ display: 'flex', alignItems: 'center', gap: 12, padding: '10px 14px', borderRadius: 8, background: 'rgba(67,160,71,0.05)', border: '1px solid rgba(67,160,71,0.15)' }}>
                    <span style={{ fontSize: 13, color: '#4a5a7a', textDecoration: 'line-through', flex: 1 }}>{c.Task}</span>
                    {c.Assignee && <span style={{ fontSize: 11, color: '#4a5a7a' }}>{c.Assignee}</span>}
                    {c.Reward && <span style={{ fontSize: 11, color: '#6b7fa8' }}>{c.Reward}</span>}
                    <span style={{ fontSize: 11, color: '#43a047', fontWeight: 700 }}>✓</span>
                    <button className="btn btn-ghost" style={{ fontSize: 13, opacity: 0.7 }} disabled={busy} onClick={function() { onDelete && onDelete(c.ID); }} title="Delete">🗑️</button>
                  </div>
                );
              })}
            </div>
          )}
        </div>
      )}

      {modal && (
        <ChoreForOthersModal
          chore={modal.mode === 'edit' ? modal.chore : null}
          busy={busy}
          onClose={function() { setModal(null); }}
          onSave={function(fields) {
            if (modal.mode === 'edit') { onEdit && onEdit(modal.chore.ID, fields); }
            else { onAdd && onAdd(fields); }
            setModal(null);
          }}
        />
      )}
    </div>
  );
}

function GuestsView({ apiUrl, apiToken }) {
  const [guests,  setGuests]  = React.useState(null);
  const [error,   setError]   = React.useState(null);

  React.useEffect(() => {
    if (!apiUrl || !apiToken) return;
    apiGet(apiUrl, apiToken, { action: 'get_guests' })
      .then(data => setGuests(data.guests || []))
      .catch(err => { setError(err.message); setGuests([]); });
  }, [apiUrl, apiToken]);

  if (guests === null) {
    return <div style={{ fontSize: 13, color: '#6b7fa8', padding: 16 }}>Loading guests…</div>;
  }

  if (error) {
    return <div style={{ fontSize: 13, color: '#f87171', padding: 16 }}>Error: {error}</div>;
  }

  if (!guests.length) {
    return (
      <div className="empty-state" style={{ padding: 40 }}>
        <div style={{ fontSize: 32, marginBottom: 12 }}>👥</div>
        <div>No upcoming guest windows found.</div>
        <div style={{ fontSize: 13, color: '#6b7fa8', marginTop: 8 }}>
          Add multi-day events to AE&amp;VV - Our Joint Chaos calendar with keywords like Visit, Staying, or Guests.
        </div>
      </div>
    );
  }

  return (
    <div style={{ display: 'flex', flexDirection: 'column', gap: 12 }}>
      {guests.map((g, i) => {
        const isStaying  = g.daysAway < 0;
        const isToday    = g.daysAway === 0;
        const isSoon     = g.daysAway >= 0 && g.daysAway <= 7;

        let badgeColor = '#2a3a5e';
        let badgeText  = 'In ' + g.daysAway + ' days';
        if (isStaying || isToday) {
          badgeColor = '#1a4a2e';
          badgeText  = isToday ? '🟢 Arriving today' : '🟢 Currently staying';
        } else if (isSoon) {
          badgeColor = '#3a3010';
          badgeText  = g.daysAway === 1 ? '🟡 Arriving tomorrow' : '🟡 Arriving in ' + g.daysAway + ' days';
        }

        return (
          <div key={i} style={{
            background: '#13244d', border: '1px solid #1e3060',
            borderRadius: 10, padding: '16px 20px',
          }}>
            <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'flex-start', flexWrap: 'wrap', gap: 8 }}>
              <div style={{ fontWeight: 700, fontSize: 15, color: '#dde1f0' }}>{g.label}</div>
              <span style={{
                fontSize: 11, fontWeight: 700, padding: '3px 10px',
                borderRadius: 20, background: badgeColor, color: '#dde1f0',
                whiteSpace: 'nowrap',
              }}>{badgeText}</span>
            </div>
            <div style={{ fontSize: 13, color: '#8a9abf', marginTop: 8 }}>
              <span>{g.arrivalDate} – {g.departureDate}</span>
              <span style={{ margin: '0 8px', color: '#2a3a5e' }}>·</span>
              <span>{g.durationDays} day{g.durationDays === 1 ? '' : 's'}</span>
            </div>
            <div style={{ fontSize: 11, color: '#4d6080', marginTop: 4 }}>{g.calendarName}</div>
          </div>
        );
      })}
    </div>
  );
}

function vehicleStatusDot(days, yellowDays, redDays) {

  if (days <= yellowDays) return <span style={{color:'#fbbf24',fontWeight:700}}>🟡</span>;
  return <span style={{color:'#4ade80'}}>🟢</span>;

  if (mi <= 500) return <span style={{color:'#fbbf24',fontWeight:700}}>🟡</span>;
  return <span style={{color:'#4ade80'}}>🟢</span>;
}

function tireStatusDot(mi) {

}

function fmtVehicleDate(val) {
  if (!val) return '—';
  const d = new Date(val);
  if (isNaN(d)) return String(val);
  return d.toLocaleDateString('en-US', { month:'short', day:'numeric', year:'numeric' });
}
