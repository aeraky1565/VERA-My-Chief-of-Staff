function TravelLiteTab({ apiUrl, apiToken }) {
  const [pto, setPto]               = useState(null);
  const [ptoLoading, setPtoLoading] = useState(false);
  const [itineraries, setItineraries]   = useState({});
  const [tripMetas, setTripMetas]       = useState({});
  const [packingData, setPackingData]   = useState({});
  const [flightInsights, setFlightInsights] = useState({});
  const [travelLegs, setTravelLegs]     = useState({});
  const [tripTabs, setTripTabs]         = useState({});
  const [travelerFilters, setTravelerFilters] = useState({});
  const [expanded, setExpanded]     = useState(new Set());
  const [modal, setModal]           = useState(null);
  const [busy, setBusy]             = useState(false);
  const [error, setError]           = useState(null);

  const [travSub, setTravSub] = useState('trips');
  const [openIdea, setOpenIdea] = useState(null);
  // A trip's plan card asks to open its idea (tsOpenIdea_); a Bucket List place, to start one (tiPlanBucket_).
  useEffect(() => {
    const f = e => { const d = (e && e.detail) || {}; if (!d.ideaId && !d.seed) return; setOpenIdea({ id: d.ideaId || '', seed: d.seed || null, at: Date.now() }); setTravSub('ideas'); try { window.scrollTo(0, 0); } catch (x) {} };
    window.addEventListener('vera-open-idea', f);
    return () => window.removeEventListener('vera-open-idea', f);
  }, []);
  const [recommendations, setRecommendations] = useState({});
  const [countries, setCountries] = useState([]);
  const [countriesLoaded, setCountriesLoaded] = useState(false);
  const [bucketList, setBucketList] = useState(null);
  const [profiles, setProfiles] = useState([]);
  const [profilesLoading, setProfilesLoading] = useState(false);

  const trips = pto?.ahmedStats?.upcomingTravel || [];

  useEffect(() => {
    if (!apiUrl || !apiToken || pto) return;
    setPtoLoading(true);
    apiGet(apiUrl, apiToken, { action:'pto' })
      .then(d => { setPto(d); setPtoLoading(false); })
      .catch(() => { setPtoLoading(false); });
  }, [apiUrl, apiToken]);

  async function loadItinerary(tripKey, startDate, endDate) {
    setItineraries(prev => ({ ...prev, [tripKey]:'loading' }));
    try {
      const data = await apiGet(apiUrl, apiToken, { action:'itinerary', tripKey, startDate, endDate });
      setItineraries(prev => ({ ...prev, [tripKey]:data }));
      loadFlightInsights(tripKey, data.items || []);
      loadTravelLegs(tripKey, startDate, endDate);
    } catch(e) {
      setItineraries(prev => ({ ...prev, [tripKey]:{ items:[] } }));
      setError('Could not load itinerary: ' + (e.message || 'API error'));
    }
  }

  // Travel times are precomputed and cached server-side, so this is a sheet read.
  // It only reaches the routing API for a pair never seen before, and then at
  // most three. Failure sets [] — the feature has to degrade to invisible.
  async function loadTravelLegs(tripKey, startDate, endDate) {
    try {
      const d = await apiGet(apiUrl, apiToken, { action:'travel_legs', tripKey, startDate, endDate });
      setTravelLegs(prev => ({ ...prev, [tripKey]: d.legs || [] }));
    } catch(e) {
      setTravelLegs(prev => ({ ...prev, [tripKey]: [] }));
    }
  }

  async function loadTripMeta(tripKey) {
    setTripMetas(prev => ({ ...prev, [tripKey]:'loading' }));
    try {
      const data = await apiGet(apiUrl, apiToken, { action:'get_trip_meta', tripKey });
      setTripMetas(prev => ({ ...prev, [tripKey]:data }));
      if (data.traveler) setTravelerFilters(prev => ({ ...prev, [tripKey]:data.traveler }));
    } catch(e) {
      setTripMetas(prev => ({ ...prev, [tripKey]:{} }));
    }
  }

  async function loadPacking(tripKey) {
    setPackingData(prev => ({ ...prev, [tripKey]:'loading' }));
    try {
      const data = await apiGet(apiUrl, apiToken, { action:'get_packing', tripKey });
      setPackingData(prev => ({ ...prev, [tripKey]:data }));
    } catch(e) {
      setPackingData(prev => ({ ...prev, [tripKey]:{ items:[] } }));
    }
  }

  async function loadFlightInsights(tripKey, items) {
    if (!items || !items.length) return;
    const fl = items.filter(i => i.type==='flight' && !i._synthetic)
      .sort((a,b) => a.date.localeCompare(b.date)||(a.startTime||'').localeCompare(b.startTime||''))[0];
    if (!fl) return;
    let meta = {};
    try { meta = JSON.parse(fl.metadata||'{}'); } catch(e) {}
    const titleCodes = (fl.title||'').match(/\b([A-Z]{3})\b/g) || [];
    const locCodes   = (fl.location||'').match(/\b([A-Z]{3})\b/g) || [];
    const origin = meta.origin || locCodes[0] || titleCodes[0] || '';
    const dest   = meta.dest   || (locCodes.length>1 ? locCodes[locCodes.length-1] : '')
                               || (titleCodes.length>1 ? titleCodes[titleCodes.length-1] : '');
    if (!origin && !dest) return;
    try {
      const r = await apiGet(apiUrl, apiToken, {
        action:'get_flight_insights', origin, dest,
        depTime:fl.startTime||'', arrTime:fl.endTime||'', flightDate:fl.date||''
      });
      if (r?.ok && r.insights) setFlightInsights(prev => ({ ...prev, [tripKey]:r.insights }));
    } catch(e) {}
  }

  async function refreshItin(tripKey) {
    const trip = trips.find(t => `${t.startDate}|${t.label}` === tripKey);
    if (!trip) return;
    const data = await apiGet(apiUrl, apiToken, { action:'itinerary', tripKey, startDate:trip.startDate, endDate:trip.endDate });
    setItineraries(prev => ({ ...prev, [tripKey]:data }));
  }

  function toggleTrip(tripKey, trip) {
    const wasOpen = expanded.has(tripKey);
    setExpanded(prev => {
      const next = new Set(prev);
      if (next.has(tripKey)) next.delete(tripKey); else next.add(tripKey);
      return next;
    });
    if (!wasOpen) {
      if (!itineraries[tripKey]) loadItinerary(tripKey, trip.startDate, trip.endDate);
      if (!tripMetas[tripKey])   loadTripMeta(tripKey);
    }
  }

  function setTripTab(tripKey, tab) {
    setTripTabs(prev => ({ ...prev, [tripKey]:tab }));
    if (tab === 'packing' && !packingData[tripKey]) loadPacking(tripKey);
  }

  async function handleSetTraveler(tripKey, traveler) {
    setTravelerFilters(prev => ({ ...prev, [tripKey]:traveler }));
    const meta = (tripMetas[tripKey] && tripMetas[tripKey]!=='loading') ? tripMetas[tripKey] : {};
    try {
      await apiGet(apiUrl, apiToken, { action:'set_trip_meta', tripKey,
        context:meta.context||'', notes:meta.notes||'', traveler });
      setTripMetas(prev => ({ ...prev, [tripKey]:{ ...meta, traveler } }));
    } catch(e) {}
  }

  async function handleSave(params) {
    setBusy(true); setError(null);
    try {
      await apiGet(apiUrl, apiToken, { action: params.id ? 'update_itinerary_item' : 'add_itinerary_item', ...params });
      setModal(null);
      await refreshItin(params.tripKey);
    } catch(e) { setError(e.message || 'Could not save item'); }
    setBusy(false);
  }

  // Confirming records the choice; the losing holds stay on the calendar. VERA
  // does not tidy someone's calendar as a side effect of a decision — which is
  // also what makes this trivially undoable.
  async function handleDecideTripOption(tripKey, option) {
    const g = itinMeta(option).optionGroup;
    if (!g) return;
    setBusy(true);
    try {
      await apiGet(apiUrl, apiToken, { action:'decide_trip_option', tripKey, groupKey: g, itemId: option.id });
      showToast('Confirmed');
      await refreshItin(tripKey);
    } catch (e) { setError(e.message || 'Could not confirm'); }
    setBusy(false);
  }

  async function handleReopenTripDecision(tripKey, rep) {
    const g = itinMeta(rep).optionGroup;
    if (!g) return;
    setBusy(true);
    try {
      await apiGet(apiUrl, apiToken, { action:'reopen_trip_decision', tripKey, groupKey: g });
      showToast('Reopened');
      await refreshItin(tripKey);
    } catch (e) { setError(e.message || 'Could not reopen'); }
    setBusy(false);
  }

  async function handleDelete(id, tripKey) {
    if (!window.confirm('Delete this itinerary item?')) return;
    setBusy(true);
    try { await apiGet(apiUrl, apiToken, { action:'delete_itinerary_item', id }); await refreshItin(tripKey); }
    catch(e) { setError(e.message || 'Could not delete item'); }
    setBusy(false);
  }

  useEffect(() => {
    if (travSub === 'profiles' && profiles.length === 0 && !profilesLoading) loadProfiles();
  }, [travSub]);

  function goToItinerary(tripKey) {
    setTravSub('trips');
    setExpanded(prev => new Set(prev).add(tripKey));
    const trip = trips.find(t => `${t.startDate}|${t.label}` === tripKey);
    if (trip && !itineraries[tripKey]) loadItinerary(tripKey, trip.startDate, trip.endDate);
  }

  function loadRecs(tripKey) {
    if (!tripKey || !apiUrl || !apiToken) return;
    setRecommendations(prev => ({ ...prev, [tripKey]: 'loading' }));
    apiGet(apiUrl, apiToken, { action: 'recommendations', tripKey })
      .then(data => setRecommendations(prev => ({ ...prev, [tripKey]: data.recs || [] })))
      .catch(() => setRecommendations(prev => { const n = { ...prev }; delete n[tripKey]; return n; }));
  }

  function handleGenerateRecs(tripKey, startDate, endDate) {
    if (!apiUrl || !apiToken) return;
    setBusy(true);
    setRecommendations(prev => ({ ...prev, [tripKey]: 'loading' }));
    apiGet(apiUrl, apiToken, { action: 'generate_recommendations', tripKey, startDate, endDate })
      .then(data => setRecommendations(prev => ({ ...prev, [tripKey]: data.recs || [] })))
      .catch(err => { setRecommendations(prev => { const n = { ...prev }; delete n[tripKey]; return n; }); setError('Generate failed: ' + err.message); })
      .finally(() => setBusy(false));
  }

  function handleAcceptRec(recId, tripKey) {
    if (!apiUrl || !apiToken) return;
    setBusy(true);
    apiGet(apiUrl, apiToken, { action: 'accept_recommendation', recId, tripKey })
      .then(data => {
        setRecommendations(prev => ({ ...prev, [tripKey]: data.recs || [] }));
        const trip = trips.find(t => `${t.startDate}|${t.label}` === tripKey);
        if (trip) loadItinerary(tripKey, trip.startDate, trip.endDate);
      })
      .catch(err => setError('Could not add recommendation: ' + err.message))
      .finally(() => setBusy(false));
  }

  function handleDismissRec(recId) {
    if (!apiUrl || !apiToken) return;
    apiGet(apiUrl, apiToken, { action: 'update_recommendation', id: recId, status: 'dismissed' })
      .then(() => {
        setRecommendations(prev => {
          const updated = {};
          Object.keys(prev).forEach(tk => {
            const recs = prev[tk];
            updated[tk] = Array.isArray(recs) ? recs.map(r => r.id === recId ? { ...r, status: 'dismissed' } : r) : recs;
          });
          return updated;
        });
      })
      .catch(() => setError('Could not dismiss recommendation'));
  }

  function loadCountries() {
    if (!apiUrl || !apiToken) return;
    apiGet(apiUrl, apiToken, { action: 'countries' })
      .then(data => { setCountries(data.entries || []); setCountriesLoaded(true); })
      .catch(err => { setError('Could not load countries: ' + err.message); setCountriesLoaded(true); });
  }

  function handleAddCountry(fields) {
    if (!apiUrl || !apiToken) return;
    setBusy(true);
    apiGet(apiUrl, apiToken, {
      action: 'add_country', country: fields.country, city: fields.city || '',
      year: String(fields.year), traveller: fields.traveller || 'Both',
      tripKey: fields.tripKey || '', notes: fields.notes || '',
    })
      .then(data => { if (data.ok) setCountries(prev => [...prev, data.entry]); else setError(data.error || 'Could not add country entry.'); })
      .catch(err => setError('Could not add country: ' + err.message))
      .finally(() => setBusy(false));
  }

  function handleDeleteCountry(id) {
    if (!apiUrl || !apiToken) return;
    setBusy(true);
    setCountries(prev => prev.filter(e => e.ID !== id));
    apiGet(apiUrl, apiToken, { action: 'delete_country', id })
      .then(data => { if (!data.ok) { setError(data.error || 'Could not delete entry.'); loadCountries(); } })
      .catch(err => { setError('Could not delete country: ' + err.message); loadCountries(); })
      .finally(() => setBusy(false));
  }

  function loadBucketList() {
    if (!apiUrl || !apiToken || bucketList !== null) return;
    setBucketList('loading');
    apiGet(apiUrl, apiToken, { action: 'get_bucket_list' })
      .then(data => setBucketList(data.entries || []))
      .catch(err => { setError('Could not load bucket list: ' + err.message); setBucketList([]); });
  }

  function handleAddBucketItem(fields) {
    if (!apiUrl || !apiToken) return;
    setBusy(true);
    apiGet(apiUrl, apiToken, {
      action: 'add_bucket_item', country: fields.country, city: fields.city || '',
      targetYear: fields.targetYear ? String(fields.targetYear) : '', traveller: fields.traveller || 'Both',
      stars: fields.stars ? String(fields.stars) : '', dreamTrip: fields.dreamTrip || '', notes: fields.notes || '',
    })
      .then(data => { if (data.ok) setBucketList(prev => Array.isArray(prev) ? [...prev, { ...data.entry, activities: [] }] : [{ ...data.entry, activities: [] }]); else setError(data.error || 'Could not add bucket list item.'); })
      .catch(err => setError('Could not add bucket list item: ' + err.message))
      .finally(() => setBusy(false));
  }

  function handleMarkBucketVisited(id) {
    if (!apiUrl || !apiToken) return;
    setBusy(true);
    setBucketList(prev => Array.isArray(prev) ? prev.map(e => e.ID === id ? { ...e, Visited: 'yes' } : e) : prev);
    apiGet(apiUrl, apiToken, { action: 'update_bucket_item', id, visited: 'yes' })
      .then(data => { if (!data.ok) { setError(data.error || 'Could not mark as visited.'); setBucketList(null); loadBucketList(); } })
      .catch(err => { setError('Could not mark as visited: ' + err.message); setBucketList(null); loadBucketList(); })
      .finally(() => setBusy(false));
  }

  function handleDeleteBucketItem(id) {
    if (!apiUrl || !apiToken) return;
    setBusy(true);
    setBucketList(prev => Array.isArray(prev) ? prev.filter(e => e.ID !== id) : prev);
    apiGet(apiUrl, apiToken, { action: 'delete_bucket_item', id })
      .then(data => { if (!data.ok) { setError(data.error || 'Could not delete item.'); setBucketList(null); loadBucketList(); } })
      .catch(err => { setError('Could not delete bucket list item: ' + err.message); setBucketList(null); loadBucketList(); })
      .finally(() => setBusy(false));
  }

  function handleAddBucketActivity(bucketId, activity) {
    if (!apiUrl || !apiToken) return;
    const tempId = 'temp_' + Date.now();
    setBucketList(prev => (prev || []).map(e => e.ID === bucketId ? { ...e, activities: [...(e.activities || []), { ID: tempId, 'Bucket ID': bucketId, Activity: activity, Done: '' }] } : e));
    apiGet(apiUrl, apiToken, { action: 'add_bucket_activity', bucketId, activity })
      .then(data => {
        if (data.ok) setBucketList(prev => (prev || []).map(e => e.ID === bucketId ? { ...e, activities: (e.activities || []).map(a => a.ID === tempId ? data.activity : a) } : e));
        else { setError(data.error || 'Could not add activity.'); loadBucketList(); }
      })
      .catch(err => { setError('Could not add activity: ' + err.message); loadBucketList(); });
  }

  function handleToggleBucketActivity(actId, done) {
    if (!apiUrl || !apiToken) return;
    setBucketList(prev => (prev || []).map(e => ({ ...e, activities: (e.activities || []).map(a => a.ID === actId ? { ...a, Done: done } : a) })));
    apiGet(apiUrl, apiToken, { action: 'toggle_bucket_activity', id: actId, done })
      .then(data => { if (!data.ok) { setError(data.error || 'Could not toggle activity.'); loadBucketList(); } })
      .catch(err => { setError('Could not toggle activity: ' + err.message); loadBucketList(); });
  }

  function handleDeleteBucketActivity(actId) {
    if (!apiUrl || !apiToken) return;
    setBucketList(prev => (prev || []).map(e => ({ ...e, activities: (e.activities || []).filter(a => a.ID !== actId) })));
    apiGet(apiUrl, apiToken, { action: 'delete_bucket_activity', id: actId })
      .then(data => { if (!data.ok) { setError(data.error || 'Could not delete activity.'); loadBucketList(); } })
      .catch(err => { setError('Could not delete activity: ' + err.message); loadBucketList(); });
  }

  function loadProfiles() {
    if (!apiUrl || !apiToken) return;
    setProfilesLoading(true);
    apiGet(apiUrl, apiToken, { action: 'get_profiles' })
      .then(data => setProfiles(data.profiles || []))
      .catch(err => setError('Profiles load failed: ' + err.message))
      .finally(() => setProfilesLoading(false));
  }

  function handleSaveProfile(profileData) {
    setBusy(true);
    apiGet(apiUrl, apiToken, Object.assign({ action: 'save_profile' }, profileData))
      .then(() => loadProfiles())
      .catch(err => setError('Could not save profile: ' + err.message))
      .finally(() => setBusy(false));
  }

  function handleDeleteProfile(id) {
    setProfiles(prev => prev.filter(p => p.id !== id));
    apiGet(apiUrl, apiToken, { action: 'delete_profile', id })
      .catch(err => { setError('Could not delete profile: ' + err.message); loadProfiles(); });
  }

  if (!apiUrl || !apiToken)
    return <div style={{textAlign:'center',color:'#4d6080',padding:'40px 20px',fontSize:14}}>Configure your API URL and token in settings.</div>;
  if (ptoLoading)
    return <div style={{textAlign:'center',color:'#6b7fa8',padding:'40px 20px',fontSize:14}}>Loading trips…</div>;

  return (
    <div style={{padding:'0 0 40px'}}>
      {error && (
        <div style={{background:'#2a0d0d',border:'1px solid #7a2020',borderRadius:8,
          padding:'10px 14px',marginBottom:12,color:'#f87171',fontSize:13}}>
          ⚠️ {error}
          <button onClick={()=>setError(null)} style={{float:'right',background:'none',border:'none',
            color:'#f87171',cursor:'pointer',fontSize:14}}>✕</button>
        </div>
      )}

      <div className="subtab-row">
        {[['ideas','💡 Trip Ideas'],['trips','✈️ My Trips'],['aria','🧭 ARIA'],['countries','🌍 Countries'],['bucketlist','🪣 Bucket List'],['gifts','🎁 Gifts'],['profiles','👤 Profiles']].map(([id,label]) => (
          <button key={id}
            className={'subtab-btn' + (travSub === id ? ' active' : '')}
            onClick={() => setTravSub(id)}>
            {label}
          </button>
        ))}
      </div>

      {travSub === 'countries' && (
        <CountriesVisitedPanel
          entries={countries}
          upcomingTravel={trips}
          busy={busy}
          loaded={countriesLoaded}
          onLoad={loadCountries}
          onAdd={handleAddCountry}
          onDelete={handleDeleteCountry}
          onGoToItinerary={goToItinerary}
        />
      )}

      {travSub === 'bucketlist' && (
        <BucketListPanel
          entries={bucketList}
          busy={busy}
          apiUrl={apiUrl}
          apiToken={apiToken}
          onLoad={loadBucketList}
          onAdd={handleAddBucketItem}
          onMarkVisited={handleMarkBucketVisited}
          onDelete={handleDeleteBucketItem}
          onAddActivity={handleAddBucketActivity}
          onToggleActivity={handleToggleBucketActivity}
          onDeleteActivity={handleDeleteBucketActivity}
        />
      )}


      {travSub === 'gifts' && (
        <TripGiftsPanel trips={trips} apiUrl={apiUrl} apiToken={apiToken} />
      )}

      {travSub === 'profiles' && (
        <ProfilesView
          profiles={profiles}
          loading={profilesLoading}
          busy={busy}
          onSave={handleSaveProfile}
          onDelete={handleDeleteProfile}
        />
      )}

      {travSub === 'ideas' && <TripIdeasView apiUrl={apiUrl} apiToken={apiToken} openIdea={openIdea} />}
      {travSub === 'aria' && <AriaView apiUrl={apiUrl} apiToken={apiToken} />}
      {travSub === 'trips' && (trips.length === 0 ? (
        <div style={{textAlign:'center',padding:'60px 20px'}}>
          <div style={{fontSize:40,marginBottom:12}}>✈️</div>
          <div style={{color:'#6b7fa8',fontSize:14}}>No upcoming trips found.</div>
          <div style={{color:'#4d6080',fontSize:12,marginTop:8}}>Add multi-day travel events to your calendar to see them here.</div>
        </div>
      ) : trips.map(t => {
        const tripKey = `${t.startDate}|${t.label}`;
        const isOpen  = expanded.has(tripKey);
        const tripData = itineraries[tripKey];
        const isItinLoading = !tripData || tripData === 'loading';
        const meta = (tripMetas[tripKey] && tripMetas[tripKey]!=='loading') ? tripMetas[tripKey] : null;
        const activeTab = tripTabs[tripKey] || 'summary';
        const traveler  = travelerFilters[tripKey] || 'Both';
        const ctxColor  = (meta?.context && CONTEXT_COLORS[meta.context]) || null;

        const filteredItin = (tripData && tripData.items) ? {
          ...tripData,
          items: tripData.items.filter(item => {
            if (traveler==='Both') return true;
            try { const m=JSON.parse(item.metadata||'{}'); const tv=m.traveler||'Both'; return tv==='Both'||tv===traveler; }
            catch(e) { return true; }
          })
        } : tripData;

        return (
          <div key={tripKey} style={{marginBottom:10,border:'1px solid #2a3a50',borderRadius:10,overflow:'hidden'}}>
            {/* Trip header */}
            <div onClick={()=>toggleTrip(tripKey,t)}
              style={{display:'flex',alignItems:'center',gap:12,padding:'13px 16px',
                background:isOpen?'#131e2e':'#0d1117',cursor:'pointer',userSelect:'none',transition:'background .15s'}}>
              <div style={{flex:1}}>
                <div style={{fontWeight:700,fontSize:15,color:'#dde1f0'}}>{t.label}</div>
                <div style={{fontSize:12,color:'#6b7fa8',marginTop:2}}>{fmtDate(t.startDate)} – {fmtDate(t.endDate)}</div>
              </div>
              <DaysAwayChip daysAway={t.daysAway} />
              <div style={{fontSize:16,color:'#8ab4f8',lineHeight:1,
                transform:isOpen?'rotate(180deg)':'rotate(0deg)',transition:'transform .2s'}}>▾</div>
            </div>

            {/* Expanded body */}
            {isOpen && (
              <div style={{background:'#0d1117',borderTop:'1px solid #2a3a50'}}>

                {/* What this trip is for. Read-only here — it is edited in the
                    full dashboard, like everything else on this page. */}
                {meta?.notes && (
                  <div data-trip-briefing style={{padding:'10px 16px 0',fontSize:12,color:'#8a9abf',
                    lineHeight:1.55}}>
                    <span style={{paddingLeft:10,borderLeft:'2px solid #2a3a50',display:'inline-block'}}>
                      {meta.notes}
                    </span>
                  </div>
                )}

                {/* Context tag + travel mode + traveler selector */}
                <div style={{padding:'10px 16px 0',display:'flex',gap:8,alignItems:'center',flexWrap:'wrap'}}>
                  {meta?.context && (
                    <span style={{fontSize:12,fontWeight:600,borderRadius:12,padding:'3px 10px',
                      color:ctxColor||'#8ab4f8',background:`${ctxColor||'#8ab4f8'}22`,
                      border:`1px solid ${ctxColor||'#8ab4f8'}55`}}>
                      {meta.context}
                    </span>
                  )}
                  {meta?.outboundMode && (
                    <span style={{fontSize:11,color:'#6b7fa8',background:'#0d1628',
                      border:'1px solid #2a3a50',borderRadius:10,padding:'2px 8px'}}>
                      {TRAVEL_MODE_LABELS[meta.outboundMode]||meta.outboundMode}
                    </span>
                  )}
                  {meta?.returnMode && meta.returnMode!==meta.outboundMode && (
                    <span style={{fontSize:11,color:'#6b7fa8',background:'#0d1628',
                      border:'1px solid #2a3a50',borderRadius:10,padding:'2px 8px'}}>
                      ↩ {TRAVEL_MODE_LABELS[meta.returnMode]||meta.returnMode}
                    </span>
                  )}
                  <div style={{display:'flex',gap:4,marginLeft:'auto'}}>
                    {['Ahmed','Victoria','Both'].map(tv => {
                      const c = tv==='Ahmed'?{on:'#5c9eff',bg:'#0d2040'}:tv==='Victoria'?{on:'#b87cff',bg:'#1a0d30'}:{on:'#4a9060',bg:'#0d1a10'};
                      return (
                        <button key={tv}
                          onClick={e=>{e.stopPropagation();handleSetTraveler(tripKey,tv);}}
                          style={{padding:'3px 8px',borderRadius:6,cursor:'pointer',fontSize:11,fontWeight:600,
                            border:traveler===tv?`2px solid ${c.on}`:'2px solid transparent',
                            background:traveler===tv?c.bg:'#1e2a3a',color:traveler===tv?c.on:'#6b7fa8'}}>
                          {tv}
                        </button>
                      );
                    })}
                  </div>
                </div>

                {/* Subtab buttons */}
                <div style={{padding:'8px 16px',display:'flex',gap:6,borderBottom:'1px solid #1a2a40'}}>
                  {[['summary','📋 Summary'],['agenda','📅 Agenda'],['packing','🎒 Packing'],['discover','✨ Discover'],['budget','💰 Budget']].map(([tab,label]) => (
                    <button key={tab}
                      onClick={e=>{e.stopPropagation();setTripTab(tripKey,tab);}}
                      style={{padding:'5px 12px',borderRadius:7,cursor:'pointer',fontSize:12,fontWeight:600,
                        background:activeTab===tab?'#1a3a6c':'#0d1a2e',
                        border:activeTab===tab?'1px solid #3d6fa0':'1px solid #1a2a40',
                        color:activeTab===tab?'#5c9eff':'#4d6080'}}>
                      {label}
                    </button>
                  ))}
                </div>

                {/* Tab content */}
                <div style={{padding:'0 16px 16px'}}>
                  {activeTab === 'discover' ? (
                    <RecommendationsPanel trips={[t]} focusTripKey={tripKey} recommendations={recommendations} busy={busy}
                      onLoadRecs={loadRecs} onGenerateRecs={handleGenerateRecs} onAcceptRec={handleAcceptRec} onDismissRec={handleDismissRec}
                      onGoToItinerary={()=>setTripTab(tripKey,'agenda')} />
                  ) : activeTab === 'budget' ? (
                    <TripBudgetPanel trips={[t]} focusTripKey={tripKey} apiUrl={apiUrl} apiToken={apiToken} />
                  ) : activeTab === 'packing' ? (
                    <PackingLitePanel
                      tripKey={tripKey}
                      endDate={t.endDate}
                      packingData={packingData[tripKey]}
                      apiUrl={apiUrl} apiToken={apiToken}
                      onReload={()=>loadPacking(tripKey)}
                    />
                  ) : isItinLoading ? (
                    <div style={{padding:'24px 0',textAlign:'center',color:'#6b7fa8',fontSize:13}}>
                      Loading itinerary…
                    </div>
                  ) : activeTab === 'summary' ? (
                    <TripSummaryView trip={{...t,tripKey}} items={filteredItin.items} legs={travelLegs[tripKey]} meta={meta||{}} apiUrl={apiUrl} apiToken={apiToken}
                      insights={flightInsights[tripKey]} onGoToPacking={()=>setTripTab(tripKey,'packing')}
                      onOpenDay={d=>{setTripTab(tripKey,'agenda');setTimeout(()=>{const el=document.getElementById(tsDayId_(tripKey,d));if(el)el.scrollIntoView({behavior:'smooth',block:'start'});},80);}} />
                  ) : (
                    <>
                      <UsefulToKnowCard insights={flightInsights[tripKey]} trip={{...t,tripKey}} apiUrl={apiUrl} apiToken={apiToken} />
                      <ItineraryDayView
                        trip={{...t,tripKey}} itinerary={filteredItin} busy={busy} legs={travelLegs[tripKey]} meta={meta||{}} who={traveler} apiUrl={apiUrl} apiToken={apiToken}
                        onAdd={defaults=>setModal({mode:'add',tripKey,tripStartDate:t.startDate,tripEndDate:t.endDate,defaults:defaults||null})}
                        onEdit={item=>setModal({mode:'edit',item,tripKey,tripStartDate:t.startDate,tripEndDate:t.endDate})}
                        onDelete={id=>handleDelete(id,tripKey)}
                        onDecide={opt=>handleDecideTripOption(tripKey,opt)}
                        onReopen={rep=>handleReopenTripDecision(tripKey,rep)}
                      />
                    </>
                  )}
                </div>
              </div>
            )}
          </div>
        );
      }))}

      {modal && (
        <AddItineraryItemLiteModal
          mode={modal.mode} item={modal.item} tripKey={modal.tripKey}
          tripStartDate={modal.tripStartDate} tripEndDate={modal.tripEndDate} defaults={modal.defaults}
          onSave={handleSave} onClose={()=>setModal(null)} busy={busy}
        />
      )}
    </div>
  );
}

// ---- Finance Summary Lite tab -----------------------------------------------

function FinSummaryLiteTab({ apiUrl, apiToken }) {
  const [tb, loading, reload] = useTrackerBudget(apiUrl, apiToken);
  const split = getSplit();
  const blue = '#5c9eff', purple = '#c97ef2', teal = '#2bb5a0', gold = '#c9a84c';

  const cardStyle = { background: '#0d1b3e', border: '1px solid #1e3060', borderRadius: 12, padding: '18px 20px', marginBottom: 14 };
  const labelStyle = { color: '#6b7fa8', fontSize: 12 };
  const valStyle = (color) => ({ color: color || gold, fontWeight: 700, fontSize: 22, fontVariantNumeric: 'tabular-nums' });

  if (loading) return <div style={{ color: '#4d6080', padding: 32, textAlign: 'center' }}>Loading tracker…</div>;
  if (!tb) return (
    <div style={cardStyle}>
      <div style={{ color: '#ef5350', marginBottom: 10 }}>Tracker data not loaded.</div>
      <button onClick={reload} style={{ background: '#0d2040', border: '1px solid #5c9eff', color: '#5c9eff', borderRadius: 6, padding: '5px 14px', cursor: 'pointer', fontSize: 12 }}>Load</button>
    </div>
  );

  const s = tb.summary || {};
  const ahmedPct = split.ahmed / 100, victoriaPct = split.victoria / 100;

  // Day-of-month checkpoints
  const jointFixed = (tb.sharedFixed || []).filter(e => e.paidBy === 'Joint');
  const day1  = jointFixed.filter(e => e.dueDay && e.dueDay <= 7);
  const day15 = jointFixed.filter(e => e.dueDay && e.dueDay >= 8 && e.dueDay <= 20);
  const day25 = jointFixed.filter(e => !e.dueDay || e.dueDay >= 21);
  const sum = arr => arr.reduce((t, e) => t + (e.amount || 0), 0);

  const checkpoints = [
    { label: 'Day 1', sub: 'Beginning of month', bills: day1,  total: sum(day1)  },
    { label: 'Day 15', sub: 'Mid month',          bills: day15, total: sum(day15) },
    { label: 'Day 25', sub: 'End of month',        bills: day25, total: sum(day25) },
  ];

  return (
    <div>
      <div style={{ display: 'flex', alignItems: 'center', gap: 10, marginBottom: 16 }}>
        <span style={{ fontSize: 11, color: '#4d6080' }}>Based on Tracker</span>
        <button onClick={reload} style={{ fontSize: 10, color: blue, background: 'none', border: '1px solid #2a3a4a', borderRadius: 5, cursor: 'pointer', padding: '1px 8px' }}>↻ Refresh</button>
      </div>

      {/* Transfer calculator */}
      <div style={cardStyle}>
        <div style={{ fontWeight: 700, fontSize: 13, color: '#dde1f0', marginBottom: 14 }}>💸 Monthly Transfers</div>
        <div style={{ display: 'grid', gridTemplateColumns: '1fr 1fr', gap: '10px 24px' }}>
          <div>
            <div style={labelStyle}>Ahmed → AMEX Checking</div>
            <div style={valStyle(blue)}>{fmtMny(s.ahmedTransferChecking)}</div>
          </div>
          <div>
            <div style={labelStyle}>Victoria → AMEX Checking</div>
            <div style={valStyle(purple)}>{fmtMny(s.victoriaTransferChecking)}</div>
          </div>
          <div>
            <div style={labelStyle}>Ahmed → AMEX Savings</div>
            <div style={valStyle(blue)}>{fmtMny(s.ahmedTransferSavings)}</div>
          </div>
          <div>
            <div style={labelStyle}>Victoria → AMEX Savings</div>
            <div style={valStyle(purple)}>{fmtMny(s.victoriaTransferSavings)}</div>
          </div>
        </div>
        <div style={{ marginTop: 14, paddingTop: 10, borderTop: '1px solid #1e3060', fontSize: 12, color: '#4d6080' }}>
          Total shared: <span style={{ color: teal, fontWeight: 600 }}>{fmtMny(s.totalShared)}</span>
          &nbsp;·&nbsp;Split {split.ahmed}/{split.victoria}
          &nbsp;→&nbsp;<span style={{ color: blue }}>Ahmed {fmtMny(s.totalShared * ahmedPct)}</span>
          &nbsp;|&nbsp;<span style={{ color: purple }}>Victoria {fmtMny(s.totalShared * victoriaPct)}</span>
        </div>
      </div>

      {/* Balance checkpoints */}
      <div style={{ fontWeight: 600, fontSize: 12, color: '#6b7fa8', textTransform: 'uppercase', letterSpacing: '0.06em', marginBottom: 8 }}>Joint Account Balance Checkpoints</div>
      <div style={{ display: 'grid', gridTemplateColumns: 'repeat(3, 1fr)', gap: 10 }}>
        {checkpoints.map(cp => (
          <div key={cp.label} style={{ ...cardStyle, marginBottom: 0 }}>
            <div style={{ fontWeight: 700, color: teal, fontSize: 13, marginBottom: 2 }}>{cp.label}</div>
            <div style={{ fontSize: 10, color: '#4d6080', marginBottom: 10 }}>{cp.sub}</div>
            {cp.bills.length === 0
              ? <div style={{ fontSize: 11, color: '#4d6080' }}>No bills due</div>
              : cp.bills.map((b, i) => (
                  <div key={i} style={{ fontSize: 11, color: '#8a9abf', display: 'flex', justifyContent: 'space-between', marginBottom: 3 }}>
                    <span style={{ overflow: 'hidden', textOverflow: 'ellipsis', whiteSpace: 'nowrap', maxWidth: '65%' }}>{b.name}</span>
                    <span style={{ color: gold, fontVariantNumeric: 'tabular-nums', flexShrink: 0 }}>{fmtMny(b.amount)}</span>
                  </div>
                ))
            }
            <div style={{ marginTop: 8, paddingTop: 6, borderTop: '1px solid #1e3060', display: 'flex', justifyContent: 'space-between', fontSize: 12 }}>
              <span style={{ color: '#6b7fa8' }}>Needed</span>
              <span style={{ color: teal, fontWeight: 700, fontVariantNumeric: 'tabular-nums' }}>{fmtMny(cp.total)}</span>
            </div>
          </div>
        ))}
      </div>
    </div>
  );
}

// ---- Finance Budget Lite tab -------------------------------------------------

function FinBudgetLiteTab({ apiUrl, apiToken }) {
  const [tb, loading, reload] = useTrackerBudget(apiUrl, apiToken);
  const split = getSplit();
  const blue = '#5c9eff', purple = '#c97ef2', teal = '#2bb5a0', gold = '#c9a84c';
  const ahmedPct = split.ahmed / 100, victoriaPct = split.victoria / 100;

  const cardStyle = { background: '#0d1b3e', border: '1px solid #1e3060', borderRadius: 12, padding: '16px 18px', flex: 1, minWidth: 0 };
  const sectionLabel = { fontSize: 10, color: '#4d6080', textTransform: 'uppercase', letterSpacing: '0.06em', marginBottom: 6 };

  function PersonCard({ label, color, fixed, nice }) {
    const total = [...(fixed||[]), ...(nice||[])].reduce((s, e) => s + (e.amount || 0), 0);
    return (
      <div style={cardStyle}>
        <div style={{ fontWeight: 700, fontSize: 13, color, marginBottom: 12 }}>{label}</div>
        {(fixed||[]).length > 0 && <>
          <div style={sectionLabel}>Fixed</div>
          {fixed.map((e, i) => (
            <div key={i} style={{ display: 'flex', justifyContent: 'space-between', fontSize: 12, color: '#dde1f0', padding: '3px 0', borderBottom: '1px solid #0d1b3e' }}>
              <span style={{ overflow: 'hidden', textOverflow: 'ellipsis', whiteSpace: 'nowrap', maxWidth: '70%' }}>{e.name}</span>
              <span style={{ color: gold, fontVariantNumeric: 'tabular-nums', flexShrink: 0 }}>{fmtMny(e.amount)}</span>
            </div>
          ))}
        </>}
        {(nice||[]).length > 0 && <>
          <div style={{ ...sectionLabel, marginTop: 10 }}>Nice to Have</div>
          {nice.map((e, i) => (
            <div key={i} style={{ display: 'flex', justifyContent: 'space-between', fontSize: 12, color: '#dde1f0', padding: '3px 0', borderBottom: '1px solid #0d1b3e' }}>
              <span style={{ overflow: 'hidden', textOverflow: 'ellipsis', whiteSpace: 'nowrap', maxWidth: '70%' }}>{e.name}</span>
              <span style={{ color: gold, fontVariantNumeric: 'tabular-nums', flexShrink: 0 }}>{fmtMny(e.amount)}</span>
            </div>
          ))}
        </>}
        <div style={{ marginTop: 10, paddingTop: 6, borderTop: '1px solid #1e3060', display: 'flex', justifyContent: 'space-between', fontSize: 12 }}>
          <span style={{ color: '#6b7fa8' }}>Personal total</span>
          <span style={{ fontWeight: 700, color, fontVariantNumeric: 'tabular-nums' }}>{fmtMny(total)}</span>
        </div>
      </div>
    );
  }

  function SharedCard({ fixed, nice }) {
    const fixedTotal = (fixed||[]).reduce((s, e) => s + (e.amount || 0), 0);
    const niceTotal  = (nice||[]).reduce((s, e) => s + (e.amount || 0), 0);
    const grand = fixedTotal + niceTotal;
    return (
      <div style={{ ...cardStyle, flex: '0 0 38%' }}>
        <div style={{ fontWeight: 700, fontSize: 13, color: teal, marginBottom: 12 }}>Shared Expenses</div>
        {(fixed||[]).length > 0 && <>
          <div style={sectionLabel}>Fixed</div>
          {fixed.map((e, i) => (
            <div key={i} style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center', fontSize: 12, color: '#dde1f0', padding: '3px 0', borderBottom: '1px solid #0d1b3e', gap: 6 }}>
              <span style={{ overflow: 'hidden', textOverflow: 'ellipsis', whiteSpace: 'nowrap', flex: 1 }}>{e.name}</span>
              {payerChip(e.paidBy)}
              <span style={{ color: gold, fontVariantNumeric: 'tabular-nums', flexShrink: 0 }}>{fmtMny(e.amount)}</span>
            </div>
          ))}
        </>}
        {(nice||[]).length > 0 && <>
          <div style={{ ...sectionLabel, marginTop: 10 }}>Nice to Have</div>
          {nice.map((e, i) => (
            <div key={i} style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center', fontSize: 12, color: '#dde1f0', padding: '3px 0', borderBottom: '1px solid #0d1b3e', gap: 6 }}>
              <span style={{ overflow: 'hidden', textOverflow: 'ellipsis', whiteSpace: 'nowrap', flex: 1 }}>{e.name}</span>
              {payerChip(e.paidBy)}
              <span style={{ color: gold, fontVariantNumeric: 'tabular-nums', flexShrink: 0 }}>{fmtMny(e.amount)}</span>
            </div>
          ))}
        </>}
        <div style={{ marginTop: 10, paddingTop: 6, borderTop: '1px solid #1e3060', fontSize: 12 }}>
          <div style={{ display: 'flex', justifyContent: 'space-between', marginBottom: 4 }}>
            <span style={{ color: '#6b7fa8' }}>Grand total</span>
            <span style={{ fontWeight: 700, color: teal, fontVariantNumeric: 'tabular-nums' }}>{fmtMny(grand)}</span>
          </div>
          <div style={{ fontSize: 11, color: '#4d6080' }}>
            {split.ahmed}/{split.victoria} split →&nbsp;
            <span style={{ color: blue }}>Ahmed {fmtMny(grand * ahmedPct)}</span>
            &nbsp;|&nbsp;
            <span style={{ color: purple }}>Victoria {fmtMny(grand * victoriaPct)}</span>
          </div>
        </div>
      </div>
    );
  }

  if (loading) return <div style={{ color: '#4d6080', padding: 32, textAlign: 'center' }}>Loading tracker…</div>;
  if (!tb) return (
    <div style={{ background: '#0d1b3e', border: '1px solid #1e3060', borderRadius: 12, padding: 20 }}>
      <div style={{ color: '#ef5350', marginBottom: 10 }}>Tracker data not loaded.</div>
      <button onClick={reload} style={{ background: '#0d2040', border: '1px solid #5c9eff', color: '#5c9eff', borderRadius: 6, padding: '5px 14px', cursor: 'pointer', fontSize: 12 }}>Load</button>
    </div>
  );

  const s = tb.summary || {};

  return (
    <div>
      <div style={{ display: 'flex', alignItems: 'center', gap: 10, marginBottom: 14 }}>
        <span style={{ fontSize: 11, color: '#4d6080' }}>Based on Tracker</span>
        <button onClick={reload} style={{ fontSize: 10, color: blue, background: 'none', border: '1px solid #2a3a4a', borderRadius: 5, cursor: 'pointer', padding: '1px 8px' }}>↻ Refresh</button>
      </div>

      <div style={{ display: 'flex', gap: 12, flexWrap: 'wrap', marginBottom: 14 }}>
        <PersonCard label="Ahmed Personal" color={blue} fixed={tb.ahmedFixed} nice={tb.ahmedNiceToHave} />
        <SharedCard fixed={tb.sharedFixed} nice={tb.sharedNiceToHave} />
        <PersonCard label="Victoria Personal" color={purple} fixed={tb.victoriaFixed} nice={tb.victoriaNiceToHave} />
      </div>

      {/* Summary band */}
      <div style={{ background: '#0d1b3e', border: '1px solid #1e3060', borderRadius: 12, padding: '14px 18px' }}>
        <div style={{ fontWeight: 700, fontSize: 12, color: '#6b7fa8', textTransform: 'uppercase', letterSpacing: '0.06em', marginBottom: 10 }}>Summary</div>

          <div style={{ color: '#6b7fa8' }}>Victoria net income</div>

            <span style={{ color: '#4d6080' }}> | </span>

            <span style={{ color: '#4d6080' }}> | </span>

// ---- ProjectsLiteTab --------------------------------------------------------
//
// Victoria's projects view (issue 199). Scoped to the projects she has a stake
// in — Shared or hers — the same way the trip agenda filters items on
// metadata.traveler: the server stores the owner, the client filters on it.
//
// A blank owner reads as Shared, which is what every project created before the
// Owner column existed looks like, so nothing had to be backfilled.
//
// Deliberately read-focused: the only control is the task checkbox. Adding,
// editing, deleting and creating projects stay in the full dashboard.
//
// This is a VIEW scope, not a security boundary — this page holds the same API
// token as the full dashboard.

const LITE_PRIORITY_COLORS = { High:'#e53935', Medium:'#f9a825', Low:'#43a047' };

// The verdict itself is computed server-side in Projects.js, so this page and
// the full dashboard cannot disagree about which projects are in trouble. This
// map is presentation only — it never decides a state.
const LITE_HEALTH_META = {
  overdue:  { label:'Overdue',  color:'#e53935' },
  at_risk:  { label:'At risk',  color:'#f9a825' },
  stalled:  { label:'Stalled',  color:'#ef6c00' },
  blocked:  { label:'Blocked',  color:'#c97ef2' },
  on_track: { label:'On track', color:'#43a047' },
  done:     { label:'Complete', color:'#43a047' },
};
const LITE_TASK_STATUS_COLORS = { 'Pending':'#8a9abf', 'In Progress':'#5c9eff', 'Blocked':'#c97ef2', 'Done':'#43a047' };

function ProjectsLiteTab({ apiUrl, apiToken }) {
  const [projects,   setProjects]   = React.useState([]);
  const [loading,    setLoading]    = React.useState(false);
  const [busy,       setBusy]       = React.useState(false);
  const [showClosed, setShowClosed] = React.useState(false);
  const [toast,      setToast]      = React.useState(null);

  function load() {
    if (!apiUrl || !apiToken) return;
    setLoading(true);
    apiGet(apiUrl, apiToken, { action: 'projects' })
      .then(d => setProjects(d.projects || []))
      .catch(() => {})
      .finally(() => setLoading(false));
  }
  React.useEffect(() => { load(); }, [apiUrl, apiToken]);

  function showToast(msg) { setToast(msg); setTimeout(() => setToast(null), 3000); }

  async function handleComplete(rowNum) {
    setBusy(true);
    try {
      await apiGet(apiUrl, apiToken, { action: 'complete_project_task', row: rowNum });
      showToast('✓ Task marked done');
      load();
    } catch (err) { showToast('Could not update: ' + err.message); }
    setBusy(false);
  }

  const mine = projects.filter(p => {
    const o = p.owner || 'Shared';
    return o === 'Shared' || o === 'Victoria';
  });
  const active = mine.filter(p => p.tasks.some(t => t.status !== 'Done'));
  const closed = mine.filter(p => p.tasks.length > 0 && p.tasks.every(t => t.status === 'Done'));

  if (loading && !projects.length) {
    return <div style={{color:'#6b7fa8',padding:'40px 0',textAlign:'center'}}>Loading projects…</div>;
  }

  if (!active.length && !closed.length) {
    return (
      <div style={{textAlign:'center',padding:'60px 20px'}}>
        <div style={{fontSize:40,marginBottom:12}}>🏗️</div>
        <div style={{color:'#6b7fa8',fontSize:14}}>No shared projects right now.</div>
        <div style={{color:'#4d6080',fontSize:12,marginTop:8}}>Projects marked Shared or Victoria show up here.</div>
      </div>
    );
  }

  return (
    <div>
      {active.map(p => {
        const done  = p.tasks.filter(t => t.status === 'Done').length;
        const total = p.tasks.length;
        const pct   = total > 0 ? Math.round(done / total * 100) : 0;
        const owner = p.owner || 'Shared';
        const isV   = owner === 'Victoria';
        const hm    = LITE_HEALTH_META[p.health] || LITE_HEALTH_META.on_track;
        return (
          <div key={p.projectId} data-project-id={p.projectId}
            style={{marginBottom:14,border:'1px solid #1e3060',borderRadius:10,background:'#0d1b3e',padding:'14px 16px'}}>
            <div style={{display:'flex',alignItems:'center',gap:8,marginBottom:10,flexWrap:'wrap'}}>
              <div style={{flex:1,fontWeight:700,fontSize:15,color:'#dde1f0',minWidth:120}}>{p.projectName}</div>
              <span data-health-chip={p.health || 'on_track'} style={{fontSize:10,fontWeight:700,borderRadius:20,
                padding:'2px 9px',color:hm.color,background:hm.color+'22',whiteSpace:'nowrap'}}>{hm.label}</span>
              <span data-owner-badge={owner} style={{fontSize:11,fontWeight:700,borderRadius:20,padding:'2px 9px',
                color: isV ? '#c97ef2' : '#2bb5a0',
                background: isV ? 'rgba(201,126,242,0.15)' : 'rgba(43,181,160,0.15)'}}>{owner}</span>
            </div>
            {p.healthReason && (
              <div data-health-reason style={{fontSize:12,color:'#8a9abf',marginBottom:10}}>{p.healthReason}</div>
            )}
            {/* What the project is for. Read-only here — drafting and editing
                stay in the full dashboard, as with everything else on this tab. */}
            {p.context && (
              <div data-project-context style={{fontSize:12,color:'#6b7fa8',lineHeight:1.5,
                marginBottom:10,paddingLeft:10,borderLeft:'2px solid #1e3060'}}>{p.context}</div>
            )}

            {/* Next up — the one thing to pick up, so a long list has an entry point */}
            {p.nextTask && (
              <div data-next-up={p.nextTask.rowNum}
                style={{display:'flex',alignItems:'center',gap:10,padding:'10px 12px',borderRadius:8,marginBottom:10,
                  background:'rgba(201,168,76,0.08)',border:'1px solid rgba(201,168,76,0.35)'}}>
                <input type="checkbox" checked={false} disabled={busy}
                  onChange={() => handleComplete(p.nextTask.rowNum)}
                  style={{accentColor:'#43a047',width:16,height:16,cursor:'pointer',flexShrink:0}} />
                <div style={{flex:1,minWidth:0}}>
                  <div style={{fontSize:10,fontWeight:700,color:'#c9a84c',letterSpacing:'0.08em',marginBottom:3}}>NEXT UP</div>
                  <div style={{fontSize:14,color:'#dde1f0'}}>{p.nextTask.task}</div>
                </div>
              </div>
            )}
            {!p.nextTask && p.pending > 0 && (
              <div data-next-up-blocked style={{padding:'10px 12px',borderRadius:8,marginBottom:10,
                background:'rgba(201,126,242,0.08)',border:'1px solid rgba(201,126,242,0.35)',
                fontSize:12,color:'#dde1f0'}}>
                Everything left on this project is blocked.
              </div>
            )}

            <div style={{display:'flex',flexDirection:'column',gap:6}}>
              {p.tasks.map((t, i) => {
                const isDone = t.status === 'Done';
                return (
                  <div key={i} style={{display:'flex',alignItems:'center',gap:12,padding:'9px 12px',borderRadius:8,
                    background:isDone?'rgba(67,160,71,0.05)':'#07122b',
                    border:'1px solid ' + (isDone?'rgba(67,160,71,0.15)':'#1e3060')}}>
                    <input type="checkbox" checked={isDone} disabled={isDone || busy}
                      onChange={() => !isDone && handleComplete(t.rowNum)}
                      style={{accentColor:'#43a047',width:16,height:16,cursor:isDone?'default':'pointer',flexShrink:0}} />
                    <div style={{flex:1,minWidth:0}}>
                      <div style={{fontSize:14,color:isDone?'#4a5a7a':'#dde1f0',
                        textDecoration:isDone?'line-through':'none'}}>{t.task}</div>
                      {t.notes && !isDone && (
                        <div data-task-notes style={{fontSize:12,color:'#6b7fa8',marginTop:3}}>{t.notes}</div>
                      )}
                    </div>
                    {t.status !== 'Pending' && !isDone && (
                      <span data-task-status-pill={t.status} style={{fontSize:10,fontWeight:700,borderRadius:20,
                        padding:'2px 8px',whiteSpace:'nowrap',color:LITE_TASK_STATUS_COLORS[t.status],
                        background:LITE_TASK_STATUS_COLORS[t.status]+'22'}}>{t.status}</span>
                    )}
                    {t.priority && !isDone && (
                      <span style={{fontSize:11,fontWeight:700,color:LITE_PRIORITY_COLORS[t.priority]||'#8a9abf'}}>{t.priority}</span>
                    )}
                    {t.dueDate && !isDone && (
                      <span style={{fontSize:11,color:t.isOverdue?'#e53935':'#6b7fa8'}}>{t.dueDate}</span>
                    )}
                  </div>
                );
              })}
            </div>
            <div style={{display:'flex',justifyContent:'space-between',fontSize:12,color:'#6b7fa8',margin:'14px 0 6px'}}>
              <span>{done} of {total} tasks complete</span><span>{pct}%</span>
            </div>
            <div style={{height:4,background:'#1e3060',borderRadius:2}}>
              <div style={{height:'100%',width:pct+'%',background:pct===100?'#43a047':'#c9a84c',
                borderRadius:2,transition:'width .3s'}} />
            </div>
          </div>
        );
      })}

      {closed.length > 0 && (
        <div style={{marginTop:24}}>
          <button onClick={() => setShowClosed(v => !v)}
            style={{background:'none',border:'none',cursor:'pointer',color:'#6b7fa8',fontSize:12,
              fontWeight:600,display:'flex',alignItems:'center',gap:6,padding:0}}>
            <span style={{fontSize:10}}>{showClosed ? '▼' : '▶'}</span>
            Closed Projects ({closed.length})
          </button>
          {showClosed && (
            <div style={{marginTop:12,display:'flex',flexDirection:'column',gap:8}}>
              {closed.map(p => (
                <div key={p.projectId} data-project-id={p.projectId}
                  style={{padding:'10px 16px',borderRadius:8,background:'rgba(67,160,71,0.05)',
                    border:'1px solid rgba(67,160,71,0.15)',display:'flex',alignItems:'center',
                    justifyContent:'space-between'}}>
                  <span style={{fontSize:13,color:'#4a5a7a',textDecoration:'line-through'}}>{p.projectName}</span>
                  <span style={{fontSize:11,color:'#43a047',fontWeight:700}}>✓ {p.tasks.length} tasks complete</span>
                </div>
              ))}
            </div>
          )}
        </div>
      )}

      {toast && (
        <div style={{position:'fixed',bottom:24,left:'50%',transform:'translateX(-50%)',background:'#0d1b3e',
          border:'1px solid #c9a84c',borderRadius:10,padding:'12px 20px',color:'#e8eaf6',fontSize:14,zIndex:9999}}>
          {toast}
        </div>
      )}
    </div>
  );
}

// ---- AddressBookView ---------------------------------------------------------
//
// The shared list of people we send things to. A household is the unit a card is
// addressed to; the people inside it are who you email or ring.
//
// Every write is a POST with a JSON body, never a query string: makeUrl above drops
// falsy values, so a cleared Address Line 2 or an emptied note would simply never
// reach the server and would read as "leave it alone".

const AB_RELATIONSHIPS = ['Family', 'Friends', 'Work', 'Neighbour', 'Other'];
const AB_MEMBER_TYPES  = ['Adult', 'Child'];

function abBlankHousehold() {
  return { id:'', household:'', address1:'', address2:'', city:'', state:'',
           postalCode:'', country:'', relationship:'Family', notes:'' };
}
function abThisYear() { return String(new Date().getFullYear()); }

// A BLANK 'Sent' MEANS PLANNED: on the list for that event, not posted yet. One place
// decides it, so "has this gone?" cannot be answered two different ways in two
// different views.
function abIsSent(m) { return String((m && m.sent) || '').trim() !== ''; }
function abBlankContact(householdId) {
  return { id:'', householdId: householdId || '', name:'', email:'', phone:'',
           memberType:'Adult', notes:'' };
}

function abAddressLines(h) {
  const street = [h.address1, h.address2].filter(Boolean).join(', ');
  const town   = [h.city, h.state, h.postalCode].filter(Boolean).join(' ');
  return [street, town, h.country].filter(Boolean);
}

function AddressBookView({ apiUrl, apiToken }) {
  const [data,    setData]    = React.useState(null);
  const [error,   setError]   = React.useState('');
  const [busy,    setBusy]    = React.useState(false);
  const [query,   setQuery]   = React.useState('');
  // '' = the address book. Anything else = the card run for that event.
  const [event,   setEvent]   = React.useState('');
  const [newEvent, setNewEvent] = React.useState('');
  // Which households the card run shows: those not sent this event THIS YEAR (right
  // for anything annual) or those never sent it at all (right for a one-off burst).
  // A toggle rather than an inference from the event's own history, which would be
  // right most of the time and inexplicable the rest.
  const [unsentOnly, setUnsentOnly] = React.useState('year');
  const [addingTo, setAddingTo] = React.useState(false);
  const [importMsg, setImportMsg] = React.useState(null);
  const [showImport, setShowImport] = React.useState(false);
  const [open,    setOpen]    = React.useState({});
  const [hhForm,  setHhForm]  = React.useState(null);
  const [cForm,   setCForm]   = React.useState(null);

  async function load() {
    try {
      const d = await apiGet(apiUrl, apiToken, { action: 'address_book' });
      setData(d);
      setError('');
    } catch (err) { setError(err.message); setData({ households: [], people: [], configured: true }); }
  }
  React.useEffect(() => { load(); }, []);

  // Preview and import share one server function, so what you are shown and what
  // happens cannot disagree.
  async function runImport(dry) {
    setBusy(true);
    setImportMsg(null);
    try {
      const d = await apiPost(apiUrl, apiToken, {
        action: dry ? 'preview_address_import' : 'run_address_import' });
      setImportMsg({ dry: dry, lines: d.messages || [] });
      if (!dry) await load();
      setError('');
    } catch (err) { setError(err.message); }
    finally { setBusy(false); }
  }

  // Repairing duplicate row ids. Same preview-then-do shape as the import, and safe
  // to press at any time: on a healthy book it reports that there is nothing to do.
  async function runRepair(dry) {
    setBusy(true);
    setImportMsg(null);
    try {
      const d = await apiPost(apiUrl, apiToken, {
        action: dry ? 'preview_address_repair' : 'run_address_repair' });
      setImportMsg({ dry: dry, lines: d.messages || [] });
      if (!dry) await load();
      setError('');
    } catch (err) { setError(err.message); }
    finally { setBusy(false); }
  }

  // Entering a card run — including one for an event nobody has ever been sent.
  function startEvent(choice) {
    if (choice !== '__new__') { setEvent(choice); setAddingTo(false); return; }
    const name = (window.prompt('Name the event — for example "Christmas card" or "Wedding thank you"') || '').trim();
    if (!name) return;                       // cancelled; stay where we were
    setEvent(name);
    // Nobody has had it yet, so open the pool straight away rather than showing an
    // empty list and a hint about a button they would then have to find.
    setAddingTo(true);
    setUnsentOnly('year');
  }

  async function write(body) {
    setBusy(true);
    try {
      await apiPost(apiUrl, apiToken, body);
      await load();
      setError('');
      return true;
    } catch (err) { setError(err.message); return false; }
    finally { setBusy(false); }
  }

  if (!data) return <div style={{ fontSize:13, color:'#6b7fa8', padding:16 }}>Loading address book…</div>;

  // Not configured is not an error — it is a feature nobody has pointed at a sheet yet.
  if (data.configured === false) {
    return (
      <div className="empty-state" style={{ padding:40 }}>
        <div style={{ fontSize:32, marginBottom:12 }}>📒</div>
        <div style={{ color:'#dde1f0', marginBottom:6 }}>No address book connected yet.</div>
        <div style={{ fontSize:13, color:'#6b7fa8' }}>
          Add <code style={{ background:'rgba(255,255,255,0.06)', padding:'1px 5px', borderRadius:4 }}>ADDRESS_BOOK_SHEET_ID</code>
          {' '}to Apps Script → Project Settings → Script Properties, set to your sheet’s id.
          VERA will add <strong>Households</strong> and <strong>People</strong> tabs and leave everything else in that sheet alone.
        </div>
      </div>
    );
  }

  const households = data.households || [];
  const people     = data.people || [];
  const mailings   = data.mailings || [];
  const events     = data.events || [];
  const membersOf  = id => people.filter(p => p.householdId === id);
  const thisYear   = abThisYear();
  const mailingsOf = id => mailings.filter(m => m.householdId === id)
    .slice().sort((a, b) => String(b.sent || '').localeCompare(String(a.sent || '')));
  const forEvent   = (id, ev) => mailings.filter(m => m.householdId === id &&
    String(m.event || '').toLowerCase() === String(ev || '').toLowerCase());

  const q = query.trim().toLowerCase();
  const shown = households.filter(h => {
    if (!q) return true;
    const hay = [h.household, h.city, h.state, h.country, h.relationship]
      .concat(membersOf(h.id).map(p => p.name + ' ' + p.email + ' ' + p.phone))
      .join(' ').toLowerCase();
    return hay.indexOf(q) !== -1;
  });

  const groups = {};
  shown.forEach(h => {
    const g = h.relationship || 'Other';
    (groups[g] = groups[g] || []).push(h);
  });
  const groupNames = AB_RELATIONSHIPS.filter(r => groups[r])
    .concat(Object.keys(groups).filter(g => AB_RELATIONSHIPS.indexOf(g) === -1));


  const inp = { background:'#0d1a2e', color:'#dde1f0', border:'1px solid #1e3060',
                borderRadius:6, padding:'6px 9px', fontSize:13 };

  return (
    <div>
      <div style={{ display:'flex', gap:8, flexWrap:'wrap', alignItems:'center', marginBottom:14 }}>
        <input placeholder="Search name, household, city…" value={query}
          onChange={e => setQuery(e.target.value)}
          style={Object.assign({}, inp, { flex:1, minWidth:160 })} />
        <select value={event} onChange={e => startEvent(e.target.value)}
          title="Pick an event to run a card list for it, or start a new one"
          style={Object.assign({}, inp, { maxWidth:190 })}>
          <option value="">📒 Address book</option>
          {/* A just-named event is not in `events` until its first mailing is saved,
              so without an option carrying it the picker would sit blank while the
              run for it is open. */}
          {event && events.indexOf(event) === -1 &&
            <option value={event}>✉️ {event}</option>}
          {events.map(ev => <option key={ev} value={ev}>✉️ {ev}</option>)}
          {/* Without this the UI is a closed loop: the event list is built from
              mailings that already exist, and the only way to log the first one is
              from inside a card run you cannot reach. */}
          <option value="__new__">＋ New event…</option>
        </select>
        <button onClick={() => setHhForm(abBlankHousehold())} disabled={busy}
          style={{ padding:'6px 14px', borderRadius:6, border:'none', background:'#8ab4f8',
                   color:'#0d1117', fontWeight:600, cursor:'pointer', fontSize:13 }}>
          + Household
        </button>
        <button onClick={() => setShowImport(v => !v)} disabled={busy}
          className={'subtab-btn' + (showImport ? ' active' : '')}>
          ⬆️ Bulk import
        </button>
      </div>

      {error && <div style={{ fontSize:12, color:'#f87171', marginBottom:10 }}>⚠️ {error}</div>}

      {showImport && (
        <div style={{ background:'#101c33', border:'1px solid #1e3060', borderRadius:10,
                      padding:14, marginBottom:14 }}>
          <div style={{ fontSize:13, color:'#dde1f0', fontWeight:600, marginBottom:6 }}>
            ⬆️ Bulk import
          </div>
          <div style={{ fontSize:12, color:'#8aa0c0', marginBottom:10, lineHeight:1.5 }}>
            Fill the <strong>Import</strong> tab in the sheet — <strong>one row per person</strong>,
            with the household name repeated for everyone in the same family. The address only
            needs filling on one row of each household. Then preview, read the
            <strong> Status</strong> column, and import.
            <div style={{ color:'#6b7fa8', marginTop:5 }}>
              Or paste whole addresses into <strong>Full Address</strong>, one per line —
              each line lands in its own row. <strong>Preview splits them</strong> into
              the Address, City, State, Postcode and Country columns and empties the
              Full Address cell, so you can correct the split in the sheet before
              importing. The line it came from is kept in <strong>Status</strong> to
              check against. An apartment or suite goes to <strong>Address line 2</strong>,
              and “Texas” is stored as “TX”.
              <div style={{ marginTop:4 }}>
                A pasted line <strong>replaces the whole address</strong>, so re-pasting
                one is how you correct a split that went wrong — including emptying a
                line that should not be there. A row that gives no street line only
                fills in the fields it names, and leaves the rest alone.
              </div>
              <div style={{ marginTop:4 }}>
                A line it <em>cannot</em> read is left alone: the columns stay blank,
                the Full Address cell is kept, and Status says so — so a wrong address
                never looks like a right one.
              </div>
            </div>
            <div style={{ color:'#6b7fa8', marginTop:5 }}>
              Rows group by the <strong>Household</strong> column, not by address — so
              “12 Elm St” and “12 Elm Street” will not split one family into two.
              A row with an address but <em>no</em> household name is imported named after
              the address itself, for you to rename.
              Running it twice is safe: people already in the book are reported, not duplicated.
            </div>
          </div>
          <div style={{ display:'flex', gap:8, flexWrap:'wrap' }}>
            <button onClick={() => runImport(true)} disabled={busy}
              style={{ background:'none', border:'1px solid #3d5fa0', color:'#8ab4f8',
                       borderRadius:6, padding:'5px 14px', fontSize:12, cursor:'pointer' }}>
              Preview
            </button>
            <button onClick={() => { if (window.confirm('Import the rows from the Import tab into the address book?')) runImport(false); }}
              disabled={busy}
              style={{ background:'#8ab4f8', color:'#0d1117', border:'none', borderRadius:6,
                       padding:'5px 14px', fontSize:12, fontWeight:600, cursor:'pointer' }}>
              Import
            </button>
            <span style={{ flex:1 }} />
            {/* Rows written before the id generator was fixed can share an id, and two
                households sharing one show each other's people, match each other in a
                search, and — the part that loses data — delete each other's members. */}
            <button onClick={() => runRepair(true)} disabled={busy}
              title="Check for rows sharing an id, and say what it would do"
              style={{ background:'none', border:'1px solid #6b5a2a', color:'#e8d9b0',
                       borderRadius:6, padding:'5px 12px', fontSize:12, cursor:'pointer' }}>
              🔧 Check ids
            </button>
            <button onClick={() => { if (window.confirm('Give every duplicated row a fresh id and re-link its people? Nothing is deleted.')) runRepair(false); }}
              disabled={busy}
              style={{ background:'none', border:'1px solid #6b5a2a', color:'#e8d9b0',
                       borderRadius:6, padding:'5px 12px', fontSize:12, cursor:'pointer' }}>
              Repair
            </button>
          </div>
          {importMsg && (
            <div style={{ marginTop:10, fontSize:12,
                          color: importMsg.dry ? '#c9a84c' : '#86efac' }}>
              {importMsg.lines.map((l, i) => <div key={i}>{l}</div>)}
            </div>
          )}
        </div>
      )}

      {event && (
        <CardRunView event={event} households={households} mailings={mailings}
          forEvent={forEvent} unsentOnly={unsentOnly} setUnsentOnly={setUnsentOnly}
          addingTo={addingTo} setAddingTo={setAddingTo} query={query}
          busy={busy} thisYear={thisYear} write={write} />
      )}

      {!event && households.length === 0 && (
        <div className="empty-state" style={{ padding:40 }}>
          <div style={{ fontSize:32, marginBottom:12 }}>📒</div>
          <div style={{ color:'#dde1f0' }}>No households yet.</div>
          <div style={{ fontSize:13, color:'#6b7fa8', marginTop:6 }}>

          </div>
        </div>

        <div style={{ color:'#4d6080', fontSize:13, textAlign:'center', padding:'24px 0' }}>
