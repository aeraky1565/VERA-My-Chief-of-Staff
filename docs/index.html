<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>VERA Dashboard</title>
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: #080f1e;
      color: #dde1f0;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif;
      min-height: 100vh;
    }

    /* ---- Scrollbar ---- */
    ::-webkit-scrollbar { width: 6px; }
    ::-webkit-scrollbar-track { background: #0d1b3e; }
    ::-webkit-scrollbar-thumb { background: #2a3a5e; border-radius: 3px; }

    /* ---- Header ---- */
    .header {
      background: linear-gradient(135deg, #0d1b3e 0%, #152547 100%);
      border-bottom: 1px solid #1e3060;
      padding: 0 28px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      height: 60px;
      position: sticky;
      top: 0;
      z-index: 100;
    }
    .logo {
      display: flex;
      align-items: baseline;
      gap: 10px;
    }
    .logo-name {
      font-size: 22px;
      font-weight: 800;
      letter-spacing: 4px;
      color: #fff;
    }
    .logo-sub {
      font-size: 10px;
      letter-spacing: 2px;
      color: #c9a84c;
      text-transform: uppercase;
    }
    .header-actions {
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .last-updated {
      font-size: 11px;
      color: #6b7fa8;
    }

    /* ---- Status bar ---- */
    .status-bar {
      background: #0d1b3e;
      border-bottom: 1px solid #1e3060;
      padding: 12px 28px;
      display: flex;
      gap: 20px;
      align-items: center;
    }
    .stat-pill {
      display: flex;
      align-items: center;
      gap: 7px;
      background: #13244d;
      border-radius: 20px;
      padding: 5px 14px;
      font-size: 13px;
    }
    .stat-dot {
      width: 9px;
      height: 9px;
      border-radius: 50%;
    }
    .stat-count { font-weight: 700; color: #fff; }
    .stat-label { color: #8a9abf; }

    /* ---- Tabs ---- */
    .tabs {
      background: #0d1b3e;
      border-bottom: 1px solid #1e3060;
      padding: 0 28px;
      display: flex;
      gap: 4px;
    }
    .tab-btn {
      background: none;
      border: none;
      border-bottom: 3px solid transparent;
      color: #6b7fa8;
      cursor: pointer;
      font-size: 13px;
      font-weight: 600;
      letter-spacing: 0.5px;
      padding: 12px 16px;
      text-transform: uppercase;
      transition: color .15s, border-color .15s;
    }
    .tab-btn:hover { color: #c9a84c; }
    .tab-btn.active { color: #c9a84c; border-bottom-color: #c9a84c; }

    /* ---- Main content ---- */
    .main { padding: 24px 28px; max-width: 960px; }

    /* ---- Toolbar ---- */
    .toolbar {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 20px;
    }
    .filter-toggle {
      background: #13244d;
      border: 1px solid #1e3060;
      border-radius: 20px;
      color: #8a9abf;
      cursor: pointer;
      font-size: 12px;
      font-weight: 600;
      padding: 5px 14px;
      transition: all .15s;
    }
    .filter-toggle.on { background: #1e3878; border-color: #3d5fa0; color: #c9d9ff; }
    .count-badge {
      background: #13244d;
      border-radius: 10px;
      color: #6b7fa8;
      font-size: 12px;
      margin-left: auto;
      padding: 3px 10px;
    }

    /* ---- Flag card ---- */
    .flag-card {
      border-radius: 10px;
      border-left: 4px solid;
      margin-bottom: 12px;
      padding: 16px 18px;
      transition: opacity .2s;
    }
    .flag-card.high   { background: #1f0e0e; border-color: #e53935; }
    .flag-card.medium { background: #1f1608; border-color: #f9a825; }
    .flag-card.low    { background: #0a1f10; border-color: #43a047; }
    .flag-card.done   { opacity: 0.45; }

    .flag-meta {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 8px;
      flex-wrap: wrap;
    }
    .urgency-badge {
      border-radius: 4px;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.5px;
      padding: 2px 8px;
      text-transform: uppercase;
    }
    .urgency-badge.high   { background: #e53935; color: #fff; }
    .urgency-badge.medium { background: #f9a825; color: #1a1000; }
    .urgency-badge.low    { background: #43a047; color: #fff; }

    .source-badge {
      background: #1e3060;
      border-radius: 4px;
      color: #8ab0d8;
      font-size: 11px;
      font-weight: 600;
      padding: 2px 8px;
    }
    .flag-date { color: #6b7fa8; font-size: 11px; margin-left: auto; }

    .flag-title {
      color: #e8ecf8;
      font-size: 15px;
      font-weight: 600;
      margin-bottom: 5px;
    }
    .flag-reason { color: #8a9abf; font-size: 13px; line-height: 1.5; }

    .flag-actions {
      display: flex;
      gap: 8px;
      margin-top: 12px;
      flex-wrap: wrap;
    }

    /* ---- Buttons ---- */
    .btn {
      border: none;
      border-radius: 6px;
      cursor: pointer;
      font-size: 12px;
      font-weight: 600;
      padding: 6px 14px;
      transition: opacity .15s, transform .1s;
    }
    .btn:hover { opacity: 0.85; transform: translateY(-1px); }
    .btn:active { transform: translateY(0); }
    .btn:disabled { opacity: 0.4; cursor: not-allowed; transform: none; }
    .btn-ack     { background: #1e3878; color: #c9d9ff; }
    .btn-snooze  { background: #3d2e10; color: #ffd54f; }
    .btn-resolve { background: #0f3020; color: #69f0ae; }
    .btn-primary { background: #c9a84c; color: #0d1b3e; }
    .btn-ghost   { background: #13244d; color: #8a9abf; }
    .btn-refresh { background: #13244d; border: 1px solid #1e3060; color: #8a9abf; }
    .btn-settings{ background: none; border: none; color: #6b7fa8; cursor: pointer; font-size: 18px; padding: 4px 8px; }
    .btn-settings:hover { color: #c9a84c; }

    /* ---- Task card ---- */
    .task-card {
      background: #0d1b3e;
      border: 1px solid #1e3060;
      border-radius: 10px;
      display: flex;
      align-items: flex-start;
      gap: 14px;
      margin-bottom: 10px;
      padding: 14px 16px;
      transition: opacity .3s;
    }
    .task-card.completing { opacity: 0.45; }

    .task-check {
      background: none;
      border: 2px solid #2a3a5e;
      border-radius: 50%;
      color: transparent;
      cursor: pointer;
      flex-shrink: 0;
      font-size: 13px;
      font-weight: 700;
      height: 22px;
      width: 22px;
      margin-top: 1px;
      padding: 0;
      transition: all .15s;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .task-check:hover:not(:disabled) { border-color: #43a047; color: #43a047; }
    .task-check.completing { background: #43a047; border-color: #43a047; color: #fff; }
    .task-check:disabled { cursor: not-allowed; }
    .task-age {
      background: #13244d;
      border-radius: 6px;
      color: #6b7fa8;
      font-size: 11px;
      font-weight: 700;
      min-width: 48px;
      padding: 4px 8px;
      text-align: center;
    }
    .task-age.overdue  { background: #3d1515; color: #ff6b6b; }
    .task-age.neglected{ background: #3d2e10; color: #ffd54f; }
    .task-info { flex: 1; }
    .task-title { color: #e8ecf8; font-size: 14px; font-weight: 600; margin-bottom: 4px; }
    .task-meta  { color: #6b7fa8; font-size: 12px; }
    .task-due   { color: #ff6b6b; }

    /* ---- Summaries table ---- */
    .summaries-table {
      background: #0d1b3e;
      border: 1px solid #1e3060;
      border-radius: 10px;
      overflow: hidden;
      width: 100%;
    }
    .summaries-table th {
      background: #13244d;
      color: #6b7fa8;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.5px;
      padding: 10px 16px;
      text-align: left;
      text-transform: uppercase;
    }
    .summaries-table td {
      border-top: 1px solid #1e3060;
      color: #dde1f0;
      font-size: 13px;
      padding: 10px 16px;
    }
    .summaries-table tr:hover td { background: #13244d; }
    .summary-value { color: #c9a84c; font-weight: 600; }

    /* ---- Settings modal ---- */
    .modal-overlay {
      background: rgba(0,0,0,0.75);
      bottom: 0; left: 0; right: 0; top: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      position: fixed;
      z-index: 200;
    }
    .modal {
      background: #0d1b3e;
      border: 1px solid #1e3060;
      border-radius: 14px;
      padding: 32px;
      width: 480px;
      max-width: 95vw;
    }
    .modal h2 { color: #fff; font-size: 18px; margin-bottom: 6px; }
    .modal p  { color: #6b7fa8; font-size: 13px; margin-bottom: 24px; }
    .form-group { margin-bottom: 16px; }
    .form-label { color: #8a9abf; display: block; font-size: 12px; font-weight: 700; letter-spacing: 0.5px; margin-bottom: 6px; text-transform: uppercase; }
    .form-input {
      background: #13244d;
      border: 1px solid #1e3060;
      border-radius: 8px;
      color: #e8ecf8;
      font-family: monospace;
      font-size: 13px;
      outline: none;
      padding: 10px 14px;
      transition: border-color .15s;
      width: 100%;
    }
    .form-input:focus { border-color: #c9a84c; }
    .form-hint { color: #4d6080; font-size: 11px; margin-top: 4px; }
    .modal-actions { display: flex; gap: 10px; justify-content: flex-end; margin-top: 24px; }

    /* ---- States ---- */
    .empty-state {
      background: #0d1b3e;
      border: 1px dashed #1e3060;
      border-radius: 10px;
      color: #4d6080;
      font-size: 14px;
      padding: 48px;
      text-align: center;
    }
    .error-banner {
      background: #3d1515;
      border: 1px solid #e53935;
      border-radius: 8px;
      color: #ff8a80;
      font-size: 13px;
      margin-bottom: 16px;
      padding: 12px 16px;
    }
    .loading-text { color: #6b7fa8; font-size: 13px; padding: 48px; text-align: center; }

    .snoozed-label {
      background: #3d2e10;
      border-radius: 4px;
      color: #ffd54f;
      font-size: 11px;
      font-weight: 600;
      padding: 2px 8px;
    }

    /* ---- Chat panel ---- */
    .chat-wrap {
      display: flex;
      flex-direction: column;
      height: calc(100vh - 215px);
      min-height: 400px;
    }
    .chat-messages {
      flex: 1;
      overflow-y: auto;
      padding: 4px 0 16px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .chat-msg {
      max-width: 78%;
      padding: 11px 16px;
      border-radius: 16px;
      font-size: 14px;
      line-height: 1.55;
      white-space: pre-wrap;
      word-break: break-word;
    }
    .chat-msg.vera {
      background: #0d1b3e;
      border: 1px solid #1e3060;
      border-bottom-left-radius: 4px;
      color: #dde1f0;
      align-self: flex-start;
    }
    .chat-msg.user {
      background: #1e3878;
      border: 1px solid #3d5fa0;
      border-bottom-right-radius: 4px;
      color: #c9d9ff;
      align-self: flex-end;
    }
    .chat-msg.vera-typing {
      color: #6b7fa8;
      font-style: italic;
    }
    .chat-input-area {
      border-top: 1px solid #1e3060;
      padding-top: 12px;
    }
    .chat-input-row {
      display: flex;
      gap: 10px;
    }
    .chat-input {
      flex: 1;
      background: #0d1b3e;
      border: 1px solid #1e3060;
      border-radius: 10px;
      color: #e8ecf8;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif;
      font-size: 14px;
      line-height: 1.4;
      outline: none;
      padding: 10px 14px;
      resize: none;
      transition: border-color .15s;
    }
    .chat-input:focus { border-color: #c9a84c; }
    .chat-input::placeholder { color: #3d5280; }
    .chat-send {
      background: #c9a84c;
      border: none;
      border-radius: 10px;
      color: #0d1b3e;
      cursor: pointer;
      font-size: 20px;
      font-weight: 700;
      padding: 0 18px;
      align-self: flex-end;
      height: 44px;
      transition: opacity .15s;
    }
    .chat-send:hover { opacity: 0.85; }
    .chat-send:disabled { opacity: 0.35; cursor: not-allowed; }

    /* ---- Image attachment (chat) ---- */
    .chat-img-preview {
      position: relative;
      display: inline-flex;
      align-items: flex-start;
      margin-bottom: 8px;
    }
    .chat-img-preview img {
      max-height: 80px;
      max-width: 120px;
      border-radius: 8px;
      border: 1px solid #1e3060;
      object-fit: cover;
    }
    .chat-img-remove {
      position: absolute;
      top: -6px;
      right: -6px;
      background: #e53935;
      color: #fff;
      border: none;
      border-radius: 50%;
      width: 18px;
      height: 18px;
      font-size: 11px;
      cursor: pointer;
      line-height: 18px;
      padding: 0;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .chat-attach {
      background: none;
      border: 1px solid #2a4070;
      border-radius: 10px;
      color: #8899cc;
      font-size: 18px;
      padding: 0 12px;
      cursor: pointer;
      align-self: flex-end;
      height: 44px;
      transition: border-color .15s, color .15s;
    }
    .chat-attach:hover  { border-color: #c9a84c; color: #c9a84c; }
    .chat-attach:disabled { opacity: .4; cursor: not-allowed; }
    .chat-mic {
      background: none;
      border: 1px solid #2a4070;
      border-radius: 10px;
      color: #8899cc;
      font-size: 18px;
      padding: 0 12px;
      cursor: pointer;
      align-self: flex-end;
      height: 44px;
      transition: border-color .15s, color .15s;
    }
    .chat-mic:hover   { border-color: #c9a84c; color: #c9a84c; }
    .chat-mic:disabled { opacity: .4; cursor: not-allowed; }
    .chat-mic.listening {
      border-color: #ef5350;
      color: #ef5350;
      animation: mic-pulse 1s ease-in-out infinite;
    }
    @keyframes mic-pulse {
      0%, 100% { opacity: 1; }
      50%       { opacity: 0.4; }
    }
    .voice-status {
      font-size: 11px;
      color: #ef5350;
      margin-bottom: 4px;
      padding-left: 2px;
      letter-spacing: 0.03em;
    }
    .chat-msg-img {
      display: block;
      max-width: 200px;
      max-height: 140px;
      border-radius: 8px;
      margin-bottom: 6px;
      object-fit: cover;
      border: 1px solid rgba(255,255,255,.1);
    }

    /* ---- Travel sub-tab pills ---- */
    .subtab-row {
      display: flex;
      gap: 8px;
      margin-bottom: 18px;
      flex-wrap: wrap;
    }
    .subtab-btn {
      background: none;
      border: 1px solid #1e3060;
      border-radius: 20px;
      color: #6b7fa8;
      font-size: 12px;
      padding: 5px 14px;
      cursor: pointer;
      transition: border-color .15s, color .15s;
      white-space: nowrap;
    }
    .subtab-btn:hover  { border-color: #3d5fa0; color: #c9d9ff; }
    .subtab-btn.active { border-color: #c9a84c; color: #c9a84c; background: rgba(201,168,76,.08); }

    /* ---- Toast notification ---- */
    .toast {
      position: fixed;
      bottom: 28px;
      right: 28px;
      background: #0f3020;
      border: 1px solid #43a047;
      border-radius: 10px;
      color: #69f0ae;
      font-size: 14px;
      font-weight: 600;
      padding: 14px 22px;
      z-index: 300;
      box-shadow: 0 4px 20px rgba(0,0,0,0.5);
      animation: slideUp 0.2s ease;
    }
    .toast.error {
      background: #3d1515;
      border-color: #e53935;
      color: #ff8a80;
    }
    @keyframes slideUp {
      from { opacity: 0; transform: translateY(12px); }
      to   { opacity: 1; transform: translateY(0); }
    }
    @keyframes vera-pulse {
      0%, 100% { opacity: 1; }
      50%       { opacity: 0.35; }
    }
    .vera-inair { animation: vera-pulse 1.5s ease-in-out infinite; }

    /* ---- Date input dark theme ---- */
    input[type="date"].form-input {
      color-scheme: dark;
    }
    .btn-edit {
      background: none;
      border: none;
      color: #4d6080;
      cursor: pointer;
      font-size: 14px;
      padding: 2px 6px;
      border-radius: 4px;
      flex-shrink: 0;
      line-height: 1;
    }
    .btn-edit:hover { color: #c9a84c; background: #13244d; }

    /* ---- Yearly Goals Kanban ---- */
    .kanban-board {
      display: flex;
      gap: 12px;
      overflow-x: auto;
      padding-bottom: 12px;
      align-items: flex-start;
    }
    .kanban-col {
      flex: 0 0 220px;
      background: #0d1b3e;
      border-radius: 10px;
      padding: 12px;
      border: 2px solid #1e3a6e;
      transition: border-color 0.15s;
    }
    .kanban-col.drag-over { border-color: #c9a84c; }
    .kanban-col-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 10px;
    }
    .kanban-col-title {
      font-size: 13px;
      font-weight: 700;
      color: #c9a84c;
      letter-spacing: 0.5px;
      text-transform: uppercase;
    }
    .kanban-col-count {
      font-size: 11px;
      background: #1e3a6e;
      color: #8ab4f8;
      border-radius: 10px;
      padding: 2px 7px;
    }
    .kanban-add-btn {
      width: 100%;
      background: none;
      border: 1px dashed #2a4580;
      border-radius: 6px;
      color: #4d6080;
      font-size: 12px;
      padding: 6px;
      cursor: pointer;
      margin-top: 8px;
      transition: border-color 0.15s, color 0.15s;
    }
    .kanban-add-btn:hover { border-color: #c9a84c; color: #c9a84c; }
    .goal-card {
      background: #1a2744;
      border: 1px solid #2a4580;
      border-radius: 8px;
      padding: 10px;
      margin-bottom: 8px;
      cursor: grab;
      user-select: none;
      transition: opacity 0.15s, box-shadow 0.15s;
    }
    .goal-card:active { cursor: grabbing; }
    .goal-card.dragging { opacity: 0.4; }
    .goal-card-title { font-size: 13px; color: #e0e8f8; font-weight: 600; margin-bottom: 6px; line-height: 1.3; }
    .goal-card-meta { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 6px; }
    .goal-cat-pill {
      font-size: 10px;
      background: #0d1b3e;
      border: 1px solid #2a4580;
      border-radius: 10px;
      padding: 1px 7px;
      color: #8ab4f8;
    }
    .goal-year-badge { font-size: 10px; color: #4d6080; }
    .goal-progress-bar {
      height: 4px;
      background: #1e3a6e;
      border-radius: 2px;
      margin-bottom: 6px;
      overflow: hidden;
    }
    .goal-progress-fill { height: 100%; background: #c9a84c; border-radius: 2px; transition: width 0.3s; }
    .goal-card-actions { display: flex; gap: 6px; justify-content: flex-end; }

    /* ---- Interests tab ---- */
    .interests-toolbar { display: flex; gap: 8px; align-items: center; margin-bottom: 16px; flex-wrap: wrap; }
    .person-pill {
      font-size: 12px;
      padding: 4px 14px;
      border-radius: 20px;
      border: 1px solid #2a4580;
      background: transparent;
      color: #8ab4f8;
      cursor: pointer;
      transition: background 0.15s, border-color 0.15s;
    }
    .person-pill.active { background: #1e3a6e; border-color: #8ab4f8; color: #fff; }
    .person-pill:hover:not(.active) { border-color: #c9a84c; color: #c9a84c; }
    .interests-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
      gap: 12px;
    }
    .interest-card {
      background: #0d1b3e;
      border: 1px solid #1e3060;
      border-radius: 10px;
      padding: 14px 16px;
      display: flex;
      flex-direction: column;
      gap: 8px;
      transition: border-color 0.15s;
    }
    .interest-card:hover { border-color: #2a4580; }
    .interest-card-top { display: flex; align-items: flex-start; justify-content: space-between; gap: 8px; }
    .interest-text { font-size: 13px; color: #e0e8f8; font-weight: 500; line-height: 1.4; flex: 1; }
    .interest-card-meta { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }
    .interest-person-badge {
      font-size: 10px;
      padding: 2px 8px;
      border-radius: 10px;
      font-weight: 600;
      letter-spacing: 0.5px;
    }

<body>
<div id="root"></div>
<script type="text/babel">
const { useState, useEffect, useCallback, useRef } = React;

const VERA_CHAT_WELCOME = 'Hi Ahmed — ask me about your flags, tasks, or summaries, or tell me to take action on something. (Shift+Enter for a new line, Enter to send.)';

// ---- Helpers ----------------------------------------------------------------

function stored(key, fallback = '') {
  return localStorage.getItem(key) || fallback;
}

function urgencyClass(u) {
  return (u || '').toLowerCase();
}

// Compute days until a date string. MM-DD = annual (rolls to next year if passed).
// YYYY-MM-DD = one-time. Returns negative if date has passed.
function daysUntil(dateStr) {
  var today = new Date(); today.setHours(0,0,0,0);
  var target;
  if (/^\d{2}-\d{2}$/.test(String(dateStr))) {
    var p = String(dateStr).split('-');
    target = new Date(today.getFullYear(), parseInt(p[0],10)-1, parseInt(p[1],10));
    if (target < today) target.setFullYear(today.getFullYear() + 1);
  } else {
    target = new Date(dateStr);
  }
  return Math.round((target - today) / 86400000);
}

function urgencyDot(days) {
  if (days < 0)  return null;
  if (days <= 7)  return { dot: '🔴', color: '#c0392b' };
  if (days <= 30) return { dot: '🟡', color: '#d4a017' };
  if (days <= 90) return { dot: '🟢', color: '#2ecc71' };
  return null;
}

function makeUrl(base, token, params = {}) {
  const url = new URL(base);
  url.searchParams.set('token', token);
  Object.entries(params).forEach(([k, v]) => { if (v) url.searchParams.set(k, v); });
  return url.toString();
}

async function apiGet(apiUrl, token, params) {
  const res = await fetch(makeUrl(apiUrl, token, params));
  const json = await res.json();
  if (!json.ok) throw new Error(json.error || 'API error');
  return json;
}

// All write operations use GET to avoid CORS preflight from file:// origin
async function apiAction(apiUrl, token, action, params) {
  return apiGet(apiUrl, token, Object.assign({ action }, params));
}

// POST without Content-Type header → browser sends text/plain → simple CORS request (no preflight).
// Apps Script doPost parses the body with JSON.parse(e.postData.contents) regardless of content-type.
async function apiPost(apiUrl, token, body) {
  const url = new URL(apiUrl);
  url.searchParams.set('token', token);
  const res = await fetch(url.toString(), { method: 'POST', body: JSON.stringify(body) });
  const json = await res.json();
  if (!json.ok) throw new Error(json.error || 'API error');
  return json;
}

// Resize an image File to maxDim on its longest side and re-encode as JPEG @ 85% quality.
// Keeps the upload comfortably under Claude's vision API size limits.
function resizeImage(file, maxDim = 1600) {
  return new Promise(resolve => {
    const img    = new Image();
    const blobUrl = URL.createObjectURL(file);
    img.onload = () => {
      const scale = Math.min(1, maxDim / Math.max(img.width, img.height));
      const w = Math.round(img.width  * scale);
      const h = Math.round(img.height * scale);
      const canvas = document.createElement('canvas');
      canvas.width = w; canvas.height = h;
      canvas.getContext('2d').drawImage(img, 0, 0, w, h);
      URL.revokeObjectURL(blobUrl);
      const dataUrl = canvas.toDataURL('image/jpeg', 0.85);
      resolve({ base64: dataUrl.split(',')[1], mimeType: 'image/jpeg', preview: dataUrl });
    };
    img.src = blobUrl;
  });
}

function fmtDate(d) {
  if (!d) return '';
  return d;
}

function timeAgo(dt) {
  if (!dt) return '';
  const diff = Math.round((Date.now() - dt.getTime()) / 1000);
  if (diff < 60) return 'just now';
  if (diff < 3600) return Math.floor(diff / 60) + 'm ago';
  return Math.floor(diff / 3600) + 'h ago';
}

// Returns true if any significant word in milestone.label appears in text
function matchesMilestone(milestone, text) {
  const stopwords = new Set(['and','the','for','with','our','your','next','this']);
  const keywords  = milestone.label.toLowerCase().split(/\W+/)
    .filter(w => w.length >= 4 && !stopwords.has(w));
  const lower = (text || '').toLowerCase();
  return keywords.length > 0 && keywords.some(kw => lower.includes(kw));
}

// ---- Settings modal ---------------------------------------------------------

function SettingsModal({ initial, onSave, onClose }) {
  const [url, setUrl]     = useState(initial.url);
  const [token, setToken] = useState(initial.token);

  function save() {
    const u = url.trim();
    const t = token.trim();
    if (!u || !t) return;
    localStorage.setItem('vera_url', u);
    localStorage.setItem('vera_token', t);
    onSave(u, t);
  }

  return (
    <div className="modal-overlay" onClick={e => e.target === e.currentTarget && onClose && onClose()}>
      <div className="modal">
        <h2>⚙️ Connect to VERA API</h2>
        <p>Enter your Apps Script Web App URL and the token from Script Properties.</p>

        <div className="form-group">
          <label className="form-label">Web App URL</label>
          <input
            className="form-input"
            placeholder="https://script.google.com/macros/s/.../exec"
            value={url}
            onChange={e => setUrl(e.target.value)}
          />
        </div>

        <div className="form-group">
          <label className="form-label">VERA_WEB_TOKEN</label>
          <input
            className="form-input"
            placeholder="vera-b479..."
            type="password"
            value={token}
            onChange={e => setToken(e.target.value)}
          />
          <div className="form-hint">Set in Apps Script → Project Settings → Script Properties</div>
        </div>

        <div className="modal-actions">
          {onClose && <button className="btn btn-ghost" onClick={onClose}>Cancel</button>}
          <button className="btn btn-primary" onClick={save} disabled={!url.trim() || !token.trim()}>
            Connect
          </button>
        </div>
      </div>
    </div>
  );
}

// ---- Status bar -------------------------------------------------------------

function StatusBar({ status, loading }) {
  if (!status) return null;
  return (
    <div className="status-bar">
      <div className="stat-pill">
        <div className="stat-dot" style={{ background: '#5c7cff' }} />

      {status.high > 0 && (
        <div className="stat-pill">
          <div className="stat-dot" style={{ background: '#e53935' }} />

          <span className="stat-label">high</span>
        </div>
      )}
      {status.medium > 0 && (
        <div className="stat-pill">
          <div className="stat-dot" style={{ background: '#f9a825' }} />
          <span className="stat-count">{status.medium}</span>
          <span className="stat-label">medium</span>
        </div>
      )}
      {status.low > 0 && (
        <div className="stat-pill">
          <div className="stat-dot" style={{ background: '#43a047' }} />
          <span className="stat-count">{status.low}</span>
          <span className="stat-label">low</span>
        </div>
      )}
      <div className="stat-pill" style={{ marginLeft: 'auto' }}>
        <div className="stat-dot" style={{ background: '#6b7fa8' }} />
        <span className="stat-count">{status.totalFlags}</span>
        <span className="stat-label">total all-time</span>
      </div>
      {status.lastRun && (
        <span className="last-updated" style={{ fontSize: 11 }}>
          Last run: {status.lastRun}
        </span>
      )}
    </div>
  );
}

// ---- Flag card --------------------------------------------------------------

function FlagCard({ flag, onAction, busy }) {
  const uc = urgencyClass(flag.urgency);
  const isDone = flag.acknowledged || flag.resolved;

  return (
    <div className={`flag-card ${uc} ${isDone ? 'done' : ''}`}>
      <div className="flag-meta">
        <span className={`urgency-badge ${uc}`}>{flag.urgency}</span>
        <span className="source-badge">{flag.source}</span>
        {flag.snoozedUntil && (
          <span className="snoozed-label">💤 until {flag.snoozedUntil}</span>
        )}
        {flag.acknowledged && <span className="snoozed-label" style={{ background: '#1e3878', color: '#c9d9ff' }}>✓ ack</span>}
        {flag.resolved     && <span className="snoozed-label" style={{ background: '#0f3020', color: '#69f0ae' }}>✓ resolved</span>}
        <span className="flag-date">{fmtDate(flag.date)}</span>
      </div>

      <div className="flag-title">{flag.flag}</div>
      <div className="flag-reason">{flag.reason}</div>

      {!isDone && (
        <div className="flag-actions">
          <button
            className="btn btn-ack"
            disabled={busy}
            onClick={() => onAction('acknowledge', flag.id)}
          >
            ✓ Acknowledge
          </button>
          <button
            className="btn btn-snooze"
            disabled={busy}
            onClick={() => onAction('snooze', flag.id, 2)}
          >
            💤 Snooze 2d
          </button>
          <button
            className="btn btn-resolve"
            disabled={busy}
            onClick={() => onAction('resolve', flag.id)}
          >
            ✅ Resolve
          </button>
        </div>
      )}
    </div>
  );
}

// ---- Task form modal (add + edit) -------------------------------------------

const RECURRING_PRESETS = ['', 'Daily', 'Weekly', 'Bi-Weekly', 'Monthly', 'Quarterly', 'Semi-Annual', 'Yearly'];

function TaskFormModal({ task, onSave, onClose, busy }) {
  const isEdit    = !!task;
  const [taskText,  setTaskText]  = useState(isEdit ? task.task      : '');
  const [dueDate,   setDueDate]   = useState(isEdit ? task.dueDate   : '');
  const [notes,     setNotes]     = useState(isEdit ? task.notes     : '');
  const [recurring, setRecurring] = useState(isEdit ? (task.recurring || '') : '');
  const [customRec, setCustomRec] = useState(
    isEdit && task.recurring && RECURRING_PRESETS.indexOf(task.recurring) === -1
      ? task.recurring : ''
  );

  // The effective recurring value: custom text overrides preset
  const effectiveRecurring = customRec.trim() || recurring;

  function save() {
    if (!taskText.trim()) return;
    onSave({ id: task?.id, task: taskText.trim(), dueDate, notes, recurring: effectiveRecurring });
  }

  function handleKey(e) {
    if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); save(); }
    if (e.key === 'Escape') onClose();
  }

  return (
    <div className="modal-overlay" onClick={e => e.target === e.currentTarget && onClose()}>
      <div className="modal">
        <h2>{isEdit ? '✏️ Edit Task' : '+ New Task'}</h2>
        <p>{isEdit ? 'Update the task details below.' : 'Add a new task to your list.'}</p>

        <div className="form-group">
          <label className="form-label">Task</label>
          <input
            className="form-input"
            value={taskText}
            onChange={e => setTaskText(e.target.value)}
            onKeyDown={handleKey}
            placeholder="What needs to be done?"
            autoFocus
          />
        </div>

        <div className="form-group">
          <label className="form-label">Due Date</label>
          <input
            className="form-input"
            type="date"
            value={dueDate}
            onChange={e => setDueDate(e.target.value)}
          />
        </div>

        <div className="form-group">
          <label className="form-label">Recurring</label>
          <div style={{ display: 'flex', gap: 8 }}>
            <select
              className="form-input"
              value={customRec ? 'custom' : recurring}
              onChange={e => {
                if (e.target.value === 'custom') { setCustomRec(recurring || ''); setRecurring(''); }
                else { setRecurring(e.target.value); setCustomRec(''); }
              }}
              style={{ flex: '0 0 160px' }}
            >
              <option value="">One-time</option>
              {RECURRING_PRESETS.filter(Boolean).map(p => <option key={p} value={p}>{p}</option>)}
              <option value="custom">Custom…</option>
            </select>
            {customRec !== '' && (
              <input
                className="form-input"
                value={customRec}
                onChange={e => setCustomRec(e.target.value)}
                placeholder="e.g. Every 6 weeks"
                style={{ flex: 1 }}
              />
            )}
          </div>
          {effectiveRecurring && (
            <div style={{ fontSize: 12, color: '#8ab4f8', marginTop: 4 }}>
              🔁 Will auto-regenerate as "{effectiveRecurring}" after completion
            </div>
          )}
        </div>

        <div className="form-group">
          <label className="form-label">Notes</label>
          <input
            className="form-input"
            value={notes}
            onChange={e => setNotes(e.target.value)}
            onKeyDown={handleKey}
            placeholder="Optional notes…"
          />
        </div>

        <div className="modal-actions">
          <button className="btn btn-ghost" onClick={onClose}>Cancel</button>
          <button
            className="btn btn-primary"
            onClick={save}
            disabled={busy || !taskText.trim()}
          >
            {isEdit ? 'Save Changes' : 'Add Task'}
          </button>
        </div>
      </div>
    </div>
  );
}

// ---- Project task form modal (add + edit) -----------------------------------

function ProjectTaskModal({ mode, task, onSave, onClose, busy }) {

  const [priority, setPriority] = useState(isEdit ? (task?.priority || 'Medium') : 'Medium');
  const [dueDate,  setDueDate]  = useState(isEdit ? (task?.dueDate  || '') : '');
  const [notes,    setNotes]    = useState(isEdit ? (task?.notes    || '') : '');

  function save() {
    if (!taskText.trim()) return;
    onSave({ task: taskText.trim(), priority, dueDate, notes });
  }

  function handleKey(e) {
    if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); save(); }
    if (e.key === 'Escape') onClose();
  }

  return (
    <div className="modal-overlay" onClick={e => e.target === e.currentTarget && onClose()}>
      <div className="modal">
        <h2>{isEdit ? '✏️ Edit Task' : '+ New Task'}</h2>

        <div className="form-group">
          <label className="form-label">Priority</label>

            className="form-input"
            value={priority}

            className="btn btn-primary"

            disabled={busy || !taskText.trim()}

            {isEdit ? 'Save Changes' : 'Add Task'}

        </div>
      </div>
    </div>
  );
}

// ---- Task card --------------------------------------------------------------

function TaskCard({ task, onComplete, onEdit, completing }) {
  const ageClass = task.isOverdue ? 'overdue' : task.isNeglected ? 'neglected' : '';
  const ageLabel = task.isOverdue
    ? `${Math.abs(task.daysUntilDue)}d late`
    : task.ageInDays != null
      ? `${task.ageInDays}d old`
      : '';

  return (
    <div className={`task-card${completing ? ' completing' : ''}`}>
      <button
        className={`task-check${completing ? ' completing' : ''}`}
        disabled={completing || !task.id}
        onClick={() => onComplete && onComplete(task.id)}
        title="Mark as done"
      >
        {completing ? '✓' : ''}
      </button>
      <div className={`task-age ${ageClass}`}>{ageLabel}</div>
      <div className="task-info" style={completing ? { textDecoration: 'line-through', color: '#4d6080' } : {}}>
        <div className="task-title">
          {task.source === 'google' && (
            <span title="Google Task" style={{
              marginRight: 7, fontSize: 10, padding: '1px 6px', borderRadius: 8,
              background: '#1a3a2e', color: '#4ade80', border: '1px solid #4ade80',
              fontWeight: 700, verticalAlign: 'middle', whiteSpace: 'nowrap'
            }}>G</span>
          )}
          {task.task}
          {task.recurring && (
            <span title={`Recurring: ${task.recurring}`} style={{
              marginLeft: 8, fontSize: 11, padding: '1px 7px', borderRadius: 10,
              background: '#1a3050', color: '#8ab4f8', border: '1px solid #8ab4f8',
              fontWeight: 600, verticalAlign: 'middle', whiteSpace: 'nowrap'
            }}>
              🔁 {task.recurring}
            </span>
          )}
        </div>
        <div className="task-meta">
          {task.status && <span style={{ marginRight: 12 }}>Status: {task.status}</span>}
          {task.dueDate && (
            <span className={task.isOverdue ? 'task-due' : ''}>
              Due: {task.dueDate}
            </span>
          )}
          {task.notes && <span style={{ marginLeft: 12, color: '#4d6080' }}>{task.notes}</span>}
        </div>
      </div>
      {!completing && task.source !== 'google' && (
        <button
          className="btn-edit"
          onClick={() => onEdit && onEdit(task)}
          title="Edit task"
        >
          ✏️
        </button>
      )}
    </div>
  );
}

// ---- DaysAway helper — renders countdown or green "Active" pill for negative values ----

function DaysAway({ n, format }) {
  if (n < 0) return (
    <span style={{ background: '#0d2a1a', color: '#4ade80', border: '1px solid #2d6a4f',
                   borderRadius: 10, padding: '1px 8px', fontSize: 11, fontWeight: 700,
                   whiteSpace: 'nowrap' }}>
      ● Active
    </span>
  );
  if (n === 0) return format === 'in' ? 'Today' : 'Today!';
  if (n === 1) return 'Tomorrow';
  if (format === 'compact')      return `${n}d`;
  if (format === 'compact-away') return `${n}d away`;
  if (format === 'in')           return `in ${n} days`;
  if (format === 'plain')        return `${n} days`;
  return `${n} days away`;
}

// ---- Chat panel -------------------------------------------------------------

function ChatPanel({ apiUrl, apiToken, messages, setMessages, input, setInput }) {
  const [loading,      setLoading]      = useState(false);
  const [pendingImage, setPendingImage] = useState(null); // {base64, mimeType, preview} | null
  const [listening,    setListening]    = useState(false);
  const bottomRef = useRef(null);
  const fileRef   = useRef(null);
  const recogRef  = useRef(null);

  useEffect(() => {
    if (bottomRef.current) bottomRef.current.scrollIntoView({ behavior: 'smooth' });
  }, [messages]);

  // Core send — accepts explicit text + image so voice can bypass stale state
  async function sendWithText(text, imgSnap) {
    if ((!text && !imgSnap) || loading) return;

    // Clear input immediately for snappy feel
    setInput('');
    setPendingImage(null);

    // Append user bubble — include thumbnail preview if image attached
    setMessages(prev => [...prev, { role: 'user', text, image: imgSnap ? imgSnap.preview : null }]);
    setLoading(true);

    try {
      let data;
      if (imgSnap) {
        // Use POST for image payloads (base64 too large for URL params)
        data = await apiPost(apiUrl, apiToken, {
          action:        'chat',
          message:       text,
          session:       'dashboard',
          imageBase64:   imgSnap.base64,
          imageMimeType: imgSnap.mimeType,
        });
      } else {
        // Text-only: keep the existing GET path (no CORS concerns)
        data = await apiGet(apiUrl, apiToken, { action: 'chat', message: text });
      }
      const veraMsg = { role: 'vera', text: data.reply };
      if (data.sources && data.sources.length > 0) veraMsg.sources = data.sources;
      setMessages(prev => [...prev, veraMsg]);
    } catch (e) {
      setMessages(prev => [...prev, { role: 'vera', text: '⚠ Error: ' + e.message }]);
    }
    setLoading(false);
  }

  function send() { sendWithText(input.trim(), pendingImage); }

  function handleKey(e) {
    if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); send(); }
  }

  function startVoice() {
    const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
    if (!SR) {
      alert('Speech recognition is not supported in this browser. Please use Chrome or Edge.');
      return;
    }
    // Toggle off if already listening
    if (listening) {
      recogRef.current && recogRef.current.stop();
      setListening(false);
      return;
    }
    const recog = new SR();
    recog.continuous      = false;
    recog.interimResults  = false;
    recog.lang            = 'en-US';

    recog.onstart  = () => setListening(true);
    recog.onend    = () => setListening(false);

    recog.onresult = (event) => {
      const transcript = event.results[0][0].transcript.trim();
      setInput(transcript);           // show text in box
      sendWithText(transcript, null); // auto-send immediately
    };

    recog.onerror = (event) => {
      console.error('VERA voice error:', event.error);
      setListening(false);
    };

    recogRef.current = recog;
    recog.start();
  }

  async function handleFileChange(e) {
    const file = e.target.files[0];
    if (!file) return;
    e.target.value = ''; // allow re-selecting the same file
    if (file.size > 10 * 1024 * 1024) {
      alert('Image too large (max 10 MB). Please choose a smaller image.');
      return;
    }
    const result = await resizeImage(file);
    setPendingImage(result);
  }

  return (
    <div className="chat-wrap">
      {/* Hidden file input — triggered programmatically by the 📎 button */}
      <input
        ref={fileRef}
        type="file"
        accept="image/*"
        style={{ display: 'none' }}
        onChange={handleFileChange}
      />

      <div className="chat-messages">
        {messages.map((m, i) => (
          <div key={i} className={`chat-msg ${m.role}`}>
            {m.image && <img src={m.image} className="chat-msg-img" alt="attachment" />}
            {m.text  && <span>{m.text}</span>}
            {m.sources && m.sources.length > 0 && (
              <div style={{ marginTop: 10, paddingTop: 8, borderTop: '1px solid #1e2d42', fontSize: 12 }}>
                <div style={{ color: '#6b7fa8', fontWeight: 600, marginBottom: 5 }}>🌐 Web Sources</div>
                {m.sources.map(function(s, si) {
                  return (
                    <a key={si} href={s.link} target="_blank" rel="noopener noreferrer"
                       style={{ display: 'block', color: '#5c9eff', marginBottom: 4,
                                overflow: 'hidden', textOverflow: 'ellipsis', whiteSpace: 'nowrap',
                                maxWidth: '100%' }}>
                      {s.title || s.link}
                    </a>
                  );
                })}
              </div>
            )}
          </div>
        ))}
        {loading && <div className="chat-msg vera vera-typing">VERA is thinking…</div>}
        <div ref={bottomRef} />
      </div>

      <div className="chat-input-area">
        {/* Image preview strip — shown when a file has been picked */}
        {pendingImage && (
          <div className="chat-img-preview">
            <img src={pendingImage.preview} alt="attachment" />
            <button className="chat-img-remove" onClick={() => setPendingImage(null)} title="Remove image">×</button>
          </div>
        )}

        {listening && <div className="voice-status">🔴 Listening…</div>}
        <div className="chat-input-row">
          <button
            className="chat-attach"
            onClick={() => fileRef.current.click()}
            disabled={loading}
            title="Attach image"
          >📎</button>
          <textarea
            className="chat-input"
            rows={2}
            placeholder="Ask VERA anything…"
            value={input}
            onChange={e => setInput(e.target.value)}
            onKeyDown={handleKey}
            disabled={loading}
          />
          <button
            className={`chat-mic${listening ? ' listening' : ''}`}
            onClick={startVoice}
            disabled={loading}
            title={listening ? 'Stop listening' : 'Speak to VERA'}
          >🎤</button>
          <button
            className="chat-send"
            onClick={send}
            disabled={(!input.trim() && !pendingImage) || loading}
          >
            ↑
          </button>
        </div>
      </div>
    </div>
  );
}

/**
 * Detects structural planning gaps across the full trip date range:
 *   - missing_hotel:    interior trip days (not first/last) with no accommodation
 *   - missing_transport: first day with no arrival transport, last day with no departure transport
 *
 * @param {Array}  items              All itinerary items for the trip
 * @param {Array}  tripDays           Ordered array of YYYY-MM-DD strings for the full trip range
 * @param {Object} hotelCheckoutDates Map of itemId → checkoutDate (YYYY-MM-DD) for multi-night hotels
 * @returns {Array} gap objects: { type, date, subtype? }
 */
function computeItineraryGaps(items, tripDays, hotelCheckoutDates) {
  var gaps = [];
  if (!tripDays || tripDays.length < 2) return gaps; // no meaningful gaps on a 1-day trip

  // Build hotel-covered date set (check-in through checkout, inclusive)
  var hotelCovered  = {};
  var boardDate     = null;   // earliest item whose title contains "board"
  var disembarkDate = null;   // latest item whose title contains "disembark"
  items.forEach(function(item) {
    if (item._synthetic || !item.date) return;
    if (item.type === 'hotel' || item.type === 'arranged_stay') {
      var checkIn  = item.date;
      var checkOut = hotelCheckoutDates[item.id] || item.date;
      var d   = new Date(checkIn  + 'T00:00:00');
      var end = new Date(checkOut + 'T00:00:00');
      while (d <= end) {
        hotelCovered[d.toISOString().slice(0, 10)] = true;
        d.setDate(d.getDate() + 1);
      }
    }
    // Cruise: detect embarkation / disembarkation by title keywords
    var titleLc = (item.title || '').toLowerCase();
    if (titleLc.indexOf('board') !== -1 && (!boardDate || item.date < boardDate)) {
      boardDate = item.date;
    }
    if (titleLc.indexOf('disembark') !== -1 && (!disembarkDate || item.date > disembarkDate)) {
      disembarkDate = item.date;
    }
  });

  // Cruise: cover every day from Board date to Disembark date (inclusive)
  if (boardDate && disembarkDate && boardDate <= disembarkDate) {
    var cd   = new Date(boardDate     + 'T00:00:00');
    var cend = new Date(disembarkDate + 'T00:00:00');
    while (cd <= cend) {
      hotelCovered[cd.toISOString().slice(0, 10)] = true;
      cd.setDate(cd.getDate() + 1);
    }
  }

  // Build per-day transport map (any transport type = covered)
  var TRANSPORT = { flight:1, train:1, bus:1, car:1, ferry:1, cruise:1, walking:1, bicycle:1 };
  var dayTransport = {};
  items.forEach(function(item) {
    if (TRANSPORT[item.type] && item.date) dayTransport[item.date] = true;
  });

  var firstDay = tripDays[0];
  var lastDay  = tripDays[tripDays.length - 1];

  // Missing hotel: flag every interior day without accommodation
  tripDays.forEach(function(d) {
    if (d === firstDay || d === lastDay) return;
    if (!hotelCovered[d]) gaps.push({ type: 'missing_hotel', date: d });
  });

  // Missing transport: arrival day and departure day
  if (!dayTransport[firstDay]) gaps.push({ type: 'missing_transport', date: firstDay, subtype: 'arrival' });
  if (!dayTransport[lastDay])  gaps.push({ type: 'missing_transport', date: lastDay,  subtype: 'departure' });

  return gaps;
}

/**
 * FlightStatusBadge — small pill badge showing live flight status.
 * Props: { status } — the flight_status object stored in item metadata
 */
function FlightStatusBadge({ status }) {
  if (!status) return null;
  var s     = status.status || 'scheduled';
  var delay = status.delay_min || 0;
  var label, color, bg;
  if (s === 'cancelled')       { label = 'Cancelled';               color = '#ff6b6b'; bg = '#2a0a0a'; }
  else if (s === 'diverted')   { label = 'Diverted';                color = '#ff9444'; bg = '#1a0f00'; }
  else if (s === 'landed')     { label = 'Landed ✓';                color = '#4ac89a'; bg = '#0a1a14'; }
  else if (delay > 0)          { label = 'Delayed +' + delay + 'min'; color = '#e8b44a'; bg = '#1a1200'; }
  else if (s === 'active')     { label = 'On Time ✓';               color = '#4ac84a'; bg = '#0a1a0a'; }
  else                         { label = 'Scheduled';               color = '#6b7fa8'; bg = '#1a2030'; }
  return (
    <span style={{ fontSize: 10, fontWeight: 700, padding: '2px 7px', borderRadius: 10,
                   color: color, background: bg, letterSpacing: 0.3, whiteSpace: 'nowrap' }}>
      {label}
    </span>
  );
}

                width: '100%', background: '#0d1117', border: '1px solid #2a3a50',
                borderRadius: 6, padding: '5px 8px', color: '#e8eaed', fontSize: 12,
                boxSizing: 'border-box',
              }}
            />
          </div>
          <button onClick={function() { setEditing(false); setCustom(''); }}
            style={{ marginTop: 8, fontSize: 11, color: '#6b7fa8', background: 'none',
                     border: 'none', cursor: 'pointer' }}>
            Cancel
          </button>
        </div>
        {/* invisible backdrop */}
        <div onClick={function() { setEditing(false); setCustom(''); }}
          style={{ position: 'fixed', inset: 0, zIndex: 199 }} />
      </div>
    );
  }

  if (!context) {
    return (
      <span onClick={function() { if (!busy) setEditing(true); }}
        style={{ fontSize: 12, color: '#4d6080', cursor: busy ? 'default' : 'pointer',
                 textDecoration: 'underline dotted', userSelect: 'none' }}>
        + Add trip context
      </span>
    );
  }

  return (
    <span onClick={function() { if (!busy) setEditing(true); }}
      style={{
        fontSize: 12, fontWeight: 600, color: color,
        background: color + '22', borderRadius: 20,
        padding: '3px 10px', cursor: busy ? 'default' : 'pointer',
        border: '1px solid ' + color + '44', userSelect: 'none',
      }}>
      {context}
    </span>
  );
}

// ── Issue #64 helpers ────────────────────────────────────────────────────────

function getDayRange(startDate, endDate) {
  if (!startDate || !endDate) return [];
  var days = [];
  var end = new Date(endDate + 'T12:00:00');
  for (var d = new Date(startDate + 'T12:00:00'); d <= end; d.setDate(d.getDate() + 1)) {
    days.push(d.toISOString().substring(0, 10));
  }
  return days;
}

function timeToMins(t) {
  if (!t) return null;
  var parts = t.split(':');
  return parseInt(parts[0], 10) * 60 + parseInt(parts[1] || '0', 10);
}

function computeItineraryNotices(items) {
  var notices = [];

  // Build per-day map
  var byDay = {};
  items.forEach(function(item) {
    if (!item.date) return;
    if (!byDay[item.date]) byDay[item.date] = [];
    byDay[item.date].push(item);
  });

  Object.keys(byDay).forEach(function(date) {
    var dayItems = byDay[date];

    // 1. Overlapping events (both must have start + end time)
    var timed = dayItems.filter(function(i) { return i.startTime && i.endTime; });
    for (var i = 0; i < timed.length; i++) {
      for (var j = i + 1; j < timed.length; j++) {
        var a = timed[i], b = timed[j];
        if (a.startTime < b.endTime && b.startTime < a.endTime) {
          notices.push({ type: 'overlap', date: date, a: a, b: b });
        }
      }
    }

    // 2 & 3. Gaps — sort all timed items, walk consecutive pairs
    var sorted = dayItems
      .filter(function(i) { return i.startTime; })
      .sort(function(a, b) { return a.startTime < b.startTime ? -1 : 1; });

    for (var k = 0; k < sorted.length - 1; k++) {
      var curr = sorted[k];
      var next = sorted[k + 1];
      var gapStart = curr.endTime || curr.startTime;
      var gapMins  = timeToMins(next.startTime) - timeToMins(gapStart);
      if (gapMins < 0) continue; // overlap already handled above

      if (curr.type === 'flight' && curr.endTime && gapMins >= 90) {
        notices.push({ type: 'flight_gap', date: date, from: curr, to: next, gapMins: gapMins });
      } else if (gapMins >= 120) {
        notices.push({ type: 'timeline_gap', date: date, from: curr, to: next, gapMins: gapMins });
      }
    }
  });

  return notices;
}

  const [location,  setLocation]  = React.useState(isEdit ? (item.location  || '')       : '');
  const [notes,     setNotes]     = React.useState(isEdit ? (item.notes     || '')       : '');

  const initMeta = isEdit && item.metadata ? (() => { try { return JSON.parse(item.metadata); } catch(e) { return {}; } })() : {};
  const [airline,    setAirline]    = React.useState(initMeta.airline    || '');
  const [flightNum,  setFlightNum]  = React.useState(initMeta.flightNum  || '');
  const [origin,     setOrigin]     = React.useState(initMeta.origin     || '');

  const [confirm,    setConfirm]    = React.useState(initMeta.confirmation || '');
  const [timezone,     setTimezone]     = React.useState(initMeta.timezone     || '');
  const [checkoutDate, setCheckoutDate] = React.useState(initMeta.checkoutDate || '');
  const [traveler,     setTraveler]     = React.useState(initMeta.traveler     || 'Both');

  function buildMetadata() {
    const m = {};
    if (timezone) m.timezone = timezone;
    if (type === 'flight') {
      if (airline)   m.airline      = airline.trim();
      if (flightNum) m.flightNum    = flightNum.trim();
      if (origin)    m.origin       = origin.trim();
      if (dest)      m.dest         = dest.trim();
      if (confirm)   m.confirmation = confirm.trim();
    }
    if (type === 'hotel' || type === 'cruise' || type === 'arranged_stay') {
      if (checkoutDate) m.checkoutDate = checkoutDate;
    }
    if (traveler && traveler !== 'Both') m.traveler = traveler;
    return Object.keys(m).length ? JSON.stringify(m) : '';

  function handleSave() {
    if (!title.trim()) return;
    onSave({

      tripKey,
      type, title: title.trim(), date, startTime, endTime,
      location: location.trim(), notes: notes.trim(),
      metadata: buildMetadata(),

          </label>

            {ITIN_TYPES.map(t => (
              <button key={t} onClick={() => setType(t)}

                style={{ width: 38, height: 38, borderRadius: 8, cursor: 'pointer', fontSize: 19, lineHeight: 1,
                         border: type === t ? '2px solid #5c9eff' : '2px solid transparent',
                         background: type === t ? '#0d2040' : '#1e2a3a',
                         display: 'flex', alignItems: 'center', justifyContent: 'center' }}>

              </button>
            ))}
          </div>
        </div>

        {/* Title */}
        <div className="form-group">
          <label className="form-label">Title *</label>
          <input className="form-input" value={title} autoFocus
            onChange={e => setTitle(e.target.value)} onKeyDown={handleKey}
            placeholder={
              type === 'flight'        ? 'e.g. AA102 – JFK → CDG'               :
              type === 'train'         ? 'e.g. Eurostar – London → Paris'        :

              type === 'arranged_stay' ? "e.g. Staying at John & Sarah's"        :
              type === 'dining'        ? 'e.g. Dinner – Le Jules Verne'          :
              type === 'museum'        ? 'e.g. Louvre Museum'                    :
              type === 'beach'         ? 'e.g. Playa del Carmen'                 :
              type === 'show'          ? 'e.g. Hamilton at the Lyceum'           :
              type === 'skiing'        ? 'e.g. Morning Ski Run – Val Thorens'    :
              type === 'snorkeling'    ? 'e.g. Snorkeling – Great Barrier Reef'  :

        </div>

        {/* Flight-specific fields */}

          <div style={{ background: '#131e2e', borderRadius: 8, padding: '10px 12px',
                        marginBottom: 12, border: '1px solid #1e2a3a' }}>
            <div style={{ color: '#8ab4f8', fontSize: 12, fontWeight: 600, marginBottom: 8 }}>
              ✈ Flight Details (optional — for future import)

              <input className="form-input" value={flightNum} placeholder="Flight # (e.g. 102)"

        {/* Hotel/Cruise/Arranged Stay-specific fields */}
        {(type === 'hotel' || type === 'cruise' || type === 'arranged_stay') && (

          <div className="form-group" style={{ flex: 2, marginBottom: 0 }}>
            <label className="form-label">{type === 'hotel' ? 'Check-in Date' : type === 'cruise' ? 'Embarkation Date' : type === 'arranged_stay' ? 'Arrival Date' : 'Date'}</label>

            <input className="form-input" type="time" value={startTime}
              onChange={e => setStartTime(e.target.value)} />

          <div className="form-group" style={{ flex: 1, marginBottom: 0 }}>
            <label className="form-label">{type === 'hotel' ? 'Check-out' : 'End'}</label>
            <input className="form-input" type="time" value={endTime}
              onChange={e => setEndTime(e.target.value)} />

        </div>

        {/* Timezone (optional — shown next to time in agenda) */}
        <div className="form-group">
          <label className="form-label">Timezone <span style={{ color: '#5f6368', fontWeight: 400 }}>(optional)</span></label>
          <select className="form-input" value={timezone} onChange={e => setTimezone(e.target.value)}
            style={{ color: timezone ? '#e8eaed' : '#6b7fa8' }}>

                         : t === 'Victoria' ? { on: '#b87cff', bg: '#1a0d30' }
