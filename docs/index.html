                onDrop={async (newStatus) => {
                  if (!dragGoalId || !newStatus) { setDragGoalId(null); setDragOverCol(null); return; }
                  const id = dragGoalId;
                  setDragGoalId(null);
                  setDragOverCol(null);
                  setGoals(prev => prev.map(g => g.id === id ? { ...g, status: newStatus } : g));
                  try {
                    await apiGet(apiUrl, apiToken, { action: 'update_goal', id, status: newStatus });
                  } catch (err) {
                    setError('Failed to move goal: ' + err.message);
                    loadGoals(apiUrl, apiToken);
                  }
                }}
                onAddGoal={status => setGoalModal({ mode: 'add', status: status || 'To Do' })}
                onEditGoal={g => setGoalModal({ mode: 'edit', goal: g })}
                onDeleteGoal={async (id) => {
                  if (!window.confirm('Delete this goal?')) return;
                  setGoals(prev => prev.filter(g => g.id !== id));
                  try {
                    await apiGet(apiUrl, apiToken, { action: 'delete_goal', id });
                  } catch (err) {
                    setError('Failed to delete goal: ' + err.message);
                    loadGoals(apiUrl, apiToken);
                  }
                }}
                growthData={growthData}
                growthLoading={!!tabLoading.growth}
                onAddBook={handleAddBook}
                onUpdateBook={handleUpdateBook}
                onDeleteBook={handleDeleteBook}
                onAddCourse={handleAddCourse}
                onUpdateCourse={handleUpdateCourse}
                onDeleteCourse={handleDeleteCourse}
                onAddSkill={handleAddSkill}
                onUpdateSkill={handleUpdateSkill}
                onRecordSkillPractice={handleRecordSkillPractice}
                onDeleteSkill={handleDeleteSkill}
                busy={busy}
              />
            )}

            {/* Career tab */}
            {activeTab === 'career' && (
              <CareerTab
                career={career}
                loading={!!tabLoading.career}
                busy={busy}
                onUpdatePosition={handleUpdateCareerPosition}
                onAddGoal={handleAddCareerGoal}
                onUpdateGoal={handleUpdateCareerGoal}
                onDeleteGoal={handleDeleteCareerGoal}
                onAddProgression={handleAddCareerProgression}
                onDeleteProgression={handleDeleteCareerProgression}
                onAddDevelopment={handleAddCareerDevelopment}
                onUpdateDevelopment={handleUpdateCareerDevelopment}
                onDeleteDevelopment={handleDeleteCareerDevelopment}
                onAddWin={handleAddCareerWin}
                onDeleteWin={handleDeleteCareerWin}
                onAddNetwork={handleAddCareerNetwork}
                onUpdateNetwork={handleUpdateCareerNetwork}
                onDeleteNetwork={handleDeleteCareerNetwork}
              />
            )}
          </div>
        </>
      )}

      {/* Goal modal */}
      {goalModal && (
        <GoalModal
          mode={goalModal.mode}
          goal={goalModal.goal}
          defaultStatus={goalModal.status}
          onSave={handleSaveGoal}
          onClose={() => setGoalModal(null)}
          busy={busy}
        />
      )}

      {/* Add Interest modal */}
      {interestModal && (
        <AddInterestModal
          onSave={handleSaveInterest}
          onClose={() => setInterestModal(false)}
          busy={busy}
        />
      )}

      {/* Add / Edit Itinerary Item modal */}
      {itinItemModal && (
        <AddItineraryItemModal
          mode={itinItemModal.mode}
          item={itinItemModal.item}
          tripKey={itinItemModal.tripKey}
          onSave={itinItemModal.mode === 'edit' ? handleUpdateItineraryItem : handleAddItineraryItem}
          onClose={() => setItinItemModal(null)}
          busy={busy}
        />
      )}

      {/* Toast notification */}
      {toast && (
        <div className={`toast${toast.isError ? ' error' : ''}`}>
          {toast.msg}
        </div>
      )}
    </>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
