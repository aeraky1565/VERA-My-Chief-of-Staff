function SpendingChart({ summaries, budget }) {
  const txRows   = summaries.filter(s => s.source === '[AUTO] Transactions');
  const totalRow = txRows.find(s => s.metric.startsWith('Total Spending'));
  const otherRow = txRows.find(s => s.metric.startsWith('Other ('));
  const catRows  = txRows.filter(s =>
    !s.metric.startsWith('Total Spending') && !s.metric.startsWith('Other (')
  );

  // Parse "$1,234 [full month] vs $2,345 in Jan (±N%)" or "$1,234 (first month)"
  function parseDollars(value = '') {
    const dollars  = [...value.matchAll(/\$([0-9,]+)/g)].map(m => parseInt(m[1].replace(/,/g, '')));
    const hasPrev  = /\bvs\s+\$/.test(value);
    const curr     = dollars[0] || 0;
    const prev     = hasPrev ? (dollars[1] || 0) : 0;
    const prevMon  = (value.match(/\bin\s+([A-Z][a-z]{2})\b/) || [])[1] || null;
    return { curr, prev, prevMon };
  }

  const totalData  = totalRow ? parseDollars(totalRow.value) : null;
  const mthMatch   = (catRows[0] || totalRow)?.metric.match(/—\s+(\w+)$/);
  const currMonth  = mthMatch ? mthMatch[1] : '';
  const prevMonth  = totalData?.prevMon ||
    catRows.map(r => parseDollars(r.value).prevMon).find(Boolean) || '';

  const data = catRows.map(s => ({
    label: s.metric.replace(/\s+—\s+\w+$/, ''),
    ...parseDollars(s.value),
  }));

  const maxVal = Math.max(...data.map(d => Math.max(d.curr, d.prev)), 1);
  const otherMatch = otherRow?.metric.match(/Other \((\d+)/);
  const otherCount = otherMatch ? otherMatch[1] : null;
  const otherAmt   = otherRow ? parseDollars(otherRow.value).curr : 0;

  // Build budget lookup: normalised label → numeric monthly budget amount
  const budgetMap = {};
  if (budget && budget.rows) {
    budget.rows.forEach(function(r) {
      if (r.value === null) return; // skip section headers
      var key = String(r.label).toLowerCase().trim();
      var num = typeof r.value === 'number'
        ? r.value
        : parseFloat(String(r.value).replace(/[$,]/g, '')) || null;
      if (num !== null) budgetMap[key] = num;
    });
  }

  return (
    <div className="bento-card" style={{ gridColumn: '1 / -1', cursor: 'default' }}>
      {/* Header */}
      <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'baseline', marginBottom: 16 }}>
        <div className="bento-card-title" style={{ marginBottom: 0 }}>
          💸 Spending — {currMonth || '…'}
        </div>
        {totalData && totalData.curr > 0 && (
          <div style={{ textAlign: 'right' }}>
            <span style={{ fontSize: 18, fontWeight: 800, color: '#c9a84c' }}>
              ${totalData.curr.toLocaleString()}
            </span>
            {prevMonth && totalData.prev > 0 && (
              <span style={{ fontSize: 11, color: '#6b7fa8', marginLeft: 8 }}>
                vs ${totalData.prev.toLocaleString()} in {prevMonth}
              </span>
            )}
          </div>
        )}
      </div>

      {data.length === 0 ? (
        <div style={{ fontSize: 13, color: '#4d6080' }}>No transaction data yet</div>
      ) : (
        <>
          {/* Category bars */}
          <div style={{ display: 'flex', flexDirection: 'column', gap: 10 }}>
            {data.map((d, i) => {
              const currW    = (d.curr / maxVal * 100).toFixed(1);
              const prevW    = (d.prev / maxVal * 100).toFixed(1);
              const delta    = d.prev > 0 ? Math.round(((d.curr - d.prev) / d.prev) * 100) : null;
              const deltaClr = delta == null ? '#6b7fa8'
                : delta > 20  ? '#ef5350'
                : delta < -10 ? '#66bb6a'
                : '#6b7fa8';
              const budgeted = budgetMap[d.label.toLowerCase().trim()] ?? null;
              const variance = budgeted !== null ? Math.round(d.curr - budgeted) : null;
              return (
                <div key={i}>
                  <div style={{ display: 'flex', justifyContent: 'space-between', marginBottom: 4, alignItems: 'baseline' }}>
                    <span style={{ fontSize: 13, color: '#dde1f0', overflow: 'hidden', textOverflow: 'ellipsis', whiteSpace: 'nowrap', maxWidth: '55%' }}>
                      {d.label}
                    </span>
                    <div style={{ display: 'flex', gap: 8, alignItems: 'baseline', flexShrink: 0 }}>
                      {d.prev > 0 && <span style={{ fontSize: 11, color: '#4d6080' }}>${d.prev.toLocaleString()}</span>}
                      <span style={{ fontSize: 13, fontWeight: 700, color: '#c9a84c' }}>${d.curr.toLocaleString()}</span>
                      {delta != null && (
                        <span style={{ fontSize: 11, color: deltaClr, minWidth: 36, textAlign: 'right' }}>
                          {delta >= 0 ? '+' : ''}{delta}%
                        </span>
                      )}
                    </div>
                  </div>
                  {/* Current month bar — gold */}
                  <div style={{ height: 7, background: '#13244d', borderRadius: 4, overflow: 'hidden', marginBottom: 2 }}>
                    <div style={{ height: '100%', width: currW + '%', background: '#c9a84c', borderRadius: 4, transition: 'width 0.5s ease' }} />
                  </div>
                  {/* Prior month bar — steel blue */}
                  {d.prev > 0 && (
                    <div style={{ height: 4, background: '#0d1b3e', borderRadius: 2, overflow: 'hidden' }}>
                      <div style={{ height: '100%', width: prevW + '%', background: '#3d5fa0', borderRadius: 2, transition: 'width 0.5s ease' }} />
                    </div>
                  )}
                  {/* Budget vs. actual annotation — only when a matching budget row is found */}
                  {budgeted !== null && (
                    <div style={{ display: 'flex', gap: 10, marginTop: 4, fontSize: 11 }}>
                      <span style={{ color: '#4d6080' }}>Budget: ${Math.round(budgeted).toLocaleString()}</span>
                      {variance !== null && (
                        <span style={{ color: variance > 0 ? '#ef5350' : '#66bb6a', fontWeight: 600 }}>
                          {variance > 0 ? '▲' : '▼'} ${Math.abs(variance).toLocaleString()} {variance > 0 ? 'over' : 'under'}
                        </span>
                      )}
                    </div>
                  )}
                </div>
              );
            })}
          </div>

          {/* Legend + Other footnote */}
          <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center', marginTop: 14, paddingTop: 12, borderTop: '1px solid #1e3060', flexWrap: 'wrap', gap: 8 }}>
            <div style={{ display: 'flex', gap: 16 }}>
              <div style={{ display: 'flex', alignItems: 'center', gap: 5 }}>
                <div style={{ width: 12, height: 7, background: '#c9a84c', borderRadius: 2 }} />
                <span style={{ fontSize: 11, color: '#6b7fa8' }}>{currMonth}</span>
              </div>
              {prevMonth && (
                <div style={{ display: 'flex', alignItems: 'center', gap: 5 }}>
                  <div style={{ width: 12, height: 4, background: '#3d5fa0', borderRadius: 2 }} />
                  <span style={{ fontSize: 11, color: '#6b7fa8' }}>{prevMonth}</span>
                </div>
              )}
            </div>
            {otherCount && otherAmt > 0 && (
              <span style={{ fontSize: 11, color: '#4d6080' }}>
                + {otherCount} other categories: ${otherAmt.toLocaleString()}
              </span>
            )}
          </div>
        </>
      )}
    </div>
  );
}

// ---- Active Travel Card (shown on Home tab when a trip is in progress) ------

function ActiveTravelCard({ trip, apiUrl, apiToken, onViewItinerary, travelConfig }) {
  var tripKey = trip.startDate + '|' + trip.label;
  var today   = new Date().toISOString().slice(0, 10);

  const [items,            setItems]            = React.useState(null);
  const [flightStatuses,   setFlightStatuses]   = React.useState({});
  const [loadingItems,     setLoadingItems]     = React.useState(true);
  const [destWeather,      setDestWeather]      = React.useState(null);
  const [refreshingStatus, setRefreshingStatus] = React.useState(false);

  // Load itinerary on mount
  React.useEffect(function() {
    if (!apiUrl || !apiToken) return;
    setLoadingItems(true);
    apiGet(apiUrl, apiToken, { action: 'itinerary', tripKey: tripKey, startDate: trip.startDate, endDate: trip.endDate })
      .then(function(r) { if (r.ok && r.items) setItems(r.items); })
      .catch(function() {})
      .finally(function() { setLoadingItems(false); });
  }, [tripKey]); // eslint-disable-line react-hooks/exhaustive-deps

  // Load flight statuses + auto-refresh every 2 min.
  // On the first poll: if the cache is empty, automatically trigger a force-refresh
  // so the user sees status on page load without needing to click ↺.
  React.useEffect(function() {
    if (!apiUrl || !apiToken) return;
    var autoRefreshed = false; // seed the cache at most once per mount
    function fetchStatuses() {
      apiGet(apiUrl, apiToken, { action: 'flight_statuses', tripKey: tripKey })
        .then(function(r) {
          if (!r.ok) return;
          setFlightStatuses(r.statuses || {});
          // If the cache came back empty on the first poll, auto-seed it
          if (!autoRefreshed && Object.keys(r.statuses || {}).length === 0) {
            autoRefreshed = true;
            setRefreshingStatus(true);
            apiGet(apiUrl, apiToken, { action: 'force_flight_statuses', tripKey: tripKey })
              .then(function(fr) { if (fr.ok) setFlightStatuses(fr.statuses || {}); })
              .catch(function() {})
              .finally(function() { setRefreshingStatus(false); });
          }
        })
        .catch(function() {});
    }
    fetchStatuses();
    var timer = setInterval(fetchStatuses, 120000);
    return function() { clearInterval(timer); };
  }, [tripKey]); // eslint-disable-line react-hooks/exhaustive-deps

  // On-demand force-refresh: bypasses rate limiting, polls AviationStack immediately
  function forceRefreshStatuses() {
    if (refreshingStatus || !apiUrl || !apiToken) return;
    setRefreshingStatus(true);
    apiGet(apiUrl, apiToken, { action: 'force_flight_statuses', tripKey: tripKey })
      .then(function(r) { if (r.ok) setFlightStatuses(r.statuses || {}); })
      .catch(function() {})
      .finally(function() { setRefreshingStatus(false); });
  }

  // Fetch destination weather once items are loaded.
  // Logic: show the city the user is currently in or heading to.
  //   - within24h of next flight → that flight's arrival city (at landing time)
  //   - otherwise, mid-trip     → last departed flight's arrival city (current weather)
  //   - before any flight       → first flight's arrival city (at landing time)
  React.useEffect(function() {
    if (!items || !apiUrl || !apiToken) return;

    var todayStr    = new Date().toISOString().slice(0, 10);
    var nowHour     = new Date().getHours();
    var tomorrowStr = new Date(new Date(todayStr).getTime() + 86400000).toISOString().slice(0, 10);

    // All trip flights sorted chronologically
    var allFlights = items
      .filter(function(i) { return i.type === 'flight' && !i._synthetic; })
      .sort(function(a, b) {
        return (a.date + (a.startTime || '')).localeCompare(b.date + (b.startTime || ''));
      });
    if (!allFlights.length) return;

    // Extracts the ARRIVAL city/airport for a flight.
    // The location field sometimes only has the origin (e.g. "Washington IAD"),
    // so we also check the title for "to CITY" patterns.
    // Priority:
    //   1. location with 2+ IATA codes (e.g. "IAD → TPA") → last code
    //   2. title "to CITY" or "→ CITY" pattern            → city name string
    //   3. 3-letter code(s) in title                      → last code
    //   4. single code in location (origin, last resort)  → that code
    function getFlightDest(fl) {
      var loc  = fl.location || '';
      var ttl  = fl.title    || '';
      var locCodes = loc.match(/\b([A-Z]{3})\b/g) || [];
      if (locCodes.length >= 2) return locCodes[locCodes.length - 1]; // "IAD → TPA" → TPA
      var m = ttl.match(/(?:\bto\b\s*|→\s*)([A-Za-z][^(,\n]*?)(?:\s*\(|\s*$)/i);
      if (m) return m[1].trim();                                       // "Flight to Tampa" → Tampa
      var titleCodes = ttl.match(/\b([A-Z]{3})\b/g) || [];
      if (titleCodes.length > 0) return titleCodes[titleCodes.length - 1];
      if (locCodes.length > 0) return locCodes[locCodes.length - 1];   // fallback: origin code
      return null;
    }
    function endHour(fl) {
      return fl.endTime ? parseInt(fl.endTime.split(':')[0], 10) : -1;
    }

    // Next upcoming flight (not yet departed)
    var nextFlight = null;
    for (var i = 0; i < allFlights.length; i++) {
      var fl = allFlights[i];
      if (fl.date > todayStr) { nextFlight = fl; break; }
      if (fl.date === todayStr) {
        var flHour = fl.startTime ? parseInt(fl.startTime.split(':')[0], 10) : 0;
        if (flHour > nowHour) { nextFlight = fl; break; }
      }
    }

    // Last already-departed flight
    var lastDeparted = null;
    for (var j = allFlights.length - 1; j >= 0; j--) {
      var fl2 = allFlights[j];
      if (fl2.date < todayStr) { lastDeparted = fl2; break; }
      if (fl2.date === todayStr) {
        var flHour2 = fl2.startTime ? parseInt(fl2.startTime.split(':')[0], 10) : 0;
        if (flHour2 <= nowHour) { lastDeparted = fl2; break; }
      }
    }

    var destAirport = null;
    var destHour    = -1;
    var within24h   = nextFlight && (nextFlight.date === todayStr || nextFlight.date === tomorrowStr);

    if (within24h) {
      // Heading somewhere within 24h — show arrival city at landing time
      destAirport = getFlightDest(nextFlight);
      destHour    = endHour(nextFlight);
    } else if (lastDeparted) {
      // Currently at the arrival city of the last flight — show current weather
      destAirport = getFlightDest(lastDeparted);
      destHour    = -1;
    } else {
      // No flights departed yet — show first destination at arrival time
      destAirport = getFlightDest(allFlights[0]);
      destHour    = endHour(allFlights[0]);
    }

    if (!destAirport) return;
    setDestWeather(null);
    apiGet(apiUrl, apiToken, { action: 'dest_weather', location: destAirport, hour: String(destHour) })
      .then(function(r) { if (r && r.ok) setDestWeather(r); })
      .catch(function() {});
  }, [items]); // eslint-disable-line react-hooks/exhaustive-deps

  // ── Derived data ─────────────────────────────────────────────────────────
  var dayNum    = Math.floor((new Date(today) - new Date(trip.startDate)) / 86400000) + 1;
  var totalDays = Math.floor((new Date(trip.endDate) - new Date(trip.startDate)) / 86400000) + 1;

  var todayFlights = (items || [])
    .filter(function(i) { return i.type === 'flight' && !i._synthetic && i.date === today; })
    .sort(function(a, b) { return (a.startTime || '').localeCompare(b.startTime || ''); });

  var tonightHotel = (items || []).find(function(i) {
    if ((i.type !== 'hotel' && i.type !== 'cruise') || i._synthetic) return false;
    var m = {}; try { m = JSON.parse(i.metadata || '{}'); } catch(e) {}
    var checkout = m.checkoutDate || '';
    return i.date <= today && (!checkout || checkout > today);
  });

  var isDepartureDay = today === trip.startDate;
  var isReturnDay    = today === trip.endDate;
  var cfg            = travelConfig || {};

  // Extract first IATA code (3 uppercase letters) from a location string
  // e.g. "IAD → ANC" → ['IAD','ANC']
  function extractIata(location) {
    var matches = (location || '').match(/\b([A-Z]{3})\b/g) || [];
    return matches;
  }

  // Buffer lookup: per-airport → general → hardcoded default
  function transitMin(airportCode) {
    if (airportCode && cfg['transit_buffer_' + airportCode] != null)
      return cfg['transit_buffer_' + airportCode];
    return cfg['transit_buffer'] != null ? cfg['transit_buffer'] : 120;
  }
  function customsMin(airportCode) {
    if (airportCode && cfg['customs_buffer_' + airportCode] != null)
      return cfg['customs_buffer_' + airportCode];
    return cfg['customs_buffer'] != null ? cfg['customs_buffer'] : 60;
  }
  // Time to navigate from airport entrance to gate (TSA, long terminals, etc.)
  // Config keys: travel_terminal_buffer, travel_terminal_buffer_IAD, etc.  Default: 0
  function terminalMin(airportCode) {
    if (airportCode && cfg['terminal_buffer_' + airportCode] != null)
      return cfg['terminal_buffer_' + airportCode];
    return cfg['terminal_buffer'] != null ? cfg['terminal_buffer'] : 0;
  }

  function addMinutes(timeStr, delta) {
    if (!timeStr) return null;
    var parts = timeStr.split(':');
    var total = parseInt(parts[0], 10) * 60 + parseInt(parts[1], 10) + delta;
    total = ((total % 1440) + 1440) % 1440;
    return String(Math.floor(total / 60)).padStart(2, '0') + ':' + String(total % 60).padStart(2, '0');
  }

  // Door-Out: departure airport = first IATA code in first flight's location
  var depCodes    = todayFlights.length > 0 ? extractIata(todayFlights[0].location) : [];
  var depAirport  = depCodes[0] || null;
  var totalDepartBuffer = transitMin(depAirport) + customsMin(depAirport) + terminalMin(depAirport);
  var doorOutTime = (isDepartureDay && todayFlights.length > 0)
    ? addMinutes(todayFlights[0].startTime, -totalDepartBuffer) : null;

  // Door-In: arrival airport = last IATA code in last flight's location
  var lastFl      = todayFlights.length > 0 ? todayFlights[todayFlights.length - 1] : null;
  var arrCodes    = lastFl ? extractIata(lastFl.location) : [];
  var arrAirport  = arrCodes[arrCodes.length - 1] || null;
  var doorInTime  = (isReturnDay && lastFl)
    ? addMinutes(lastFl.endTime, customsMin(arrAirport)) : null;

  // ── Render ────────────────────────────────────────────────────────────────
  var cardStyle = {
    gridColumn: '1 / -1',
    background: '#181200',
    border: '1px solid #3a2e00',
    borderLeft: '4px solid #e8b44a',
    borderRadius: 12,
    padding: '16px 20px',
    marginBottom: 0,
  };

  return (
    <div style={cardStyle}>
      {/* Header */}
      <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center', marginBottom: 12 }}>
        <div style={{ fontWeight: 700, fontSize: 15, color: '#e8b44a' }}>
          ✈️ Active Travel — {trip.label}
        </div>
        <div style={{ display: 'flex', alignItems: 'center', gap: 8 }}>
          {/* Destination weather chip */}
          {destWeather && (
            <div style={{ display: 'flex', alignItems: 'center', gap: 4, fontSize: 12,
                          color: '#e8b44a', background: '#2a1e00', borderRadius: 12,
                          padding: '2px 10px', border: '1px solid #4a3800' }}>
              <span>{destWeather.emoji}</span>
              <span style={{ fontWeight: 700 }}>{destWeather.temp}°F</span>
              <span style={{ color: '#a08040', fontWeight: 400 }}>
                {destWeather.city}
                {destWeather.targetHour >= 0
                  ? ' ~' + (destWeather.targetHour % 12 || 12) + (destWeather.targetHour < 12 ? 'am' : 'pm')
                  : ''}
              </span>
            </div>
          )}
          {/* Day counter badge */}
          <span style={{ fontSize: 11, fontWeight: 600, color: '#e8b44a', background: '#2a1e00',
                         borderRadius: 20, padding: '2px 10px', border: '1px solid #4a3800' }}>
            Day {dayNum} of {totalDays}
          </span>
        </div>
      </div>

      {loadingItems ? (
        <div style={{ fontSize: 12, color: '#6b7fa8', fontStyle: 'italic' }}>Loading travel status…</div>
      ) : (
        <div style={{ display: 'flex', flexDirection: 'column', gap: 8 }}>
          {/* Door-Out (departure day only) */}
          {doorOutTime && (
            <div style={{ display: 'flex', alignItems: 'center', gap: 8,
                          background: '#1a1000', borderRadius: 8, padding: '8px 12px',
                          border: '1px solid #4a3000' }}>
              <span style={{ fontSize: 18 }}>🚪</span>
              <div>
                <div style={{ fontSize: 11, color: '#8ab4f8', fontWeight: 600, textTransform: 'uppercase', letterSpacing: 0.5 }}>
                Leave by{depAirport ? ' (' + totalDepartBuffer + ' min to ' + depAirport + ')' : ''}
              </div>
                <div style={{ fontSize: 16, fontWeight: 700, color: '#ffaa44' }}>{doorOutTime}</div>
              </div>
              <div style={{ fontSize: 11, color: '#6b7fa8', marginLeft: 4 }}>to make your flight on time</div>
            </div>
          )}

          {/* Today's flights */}
          {todayFlights.length > 0 && (
            <div style={{ display: 'flex', flexDirection: 'column', gap: 6 }}>
              <div style={{ display: 'flex', alignItems: 'center', justifyContent: 'space-between', marginBottom: 2 }}>
                <span style={{ fontSize: 10, fontWeight: 700, color: '#4a5f80', letterSpacing: 1, textTransform: 'uppercase' }}>Today's Flights</span>
                <button onClick={forceRefreshStatuses} disabled={refreshingStatus}
                  style={{ background: 'none', border: 'none', cursor: refreshingStatus ? 'default' : 'pointer',
                           color: '#6b7fa8', fontSize: 14, padding: '0 2px', lineHeight: 1,
                           opacity: refreshingStatus ? 0.4 : 0.8 }}
                  title="Refresh live flight status from AviationStack">
                  {refreshingStatus ? '⏳' : '↺'}
                </button>
              </div>
              {todayFlights.map(function(fl) {
                var fs = flightStatuses[fl.id];
                var isInAir = fs && fs.status === 'active';
                var depTime = fs && (fs.dep_estimated || fs.dep_scheduled);
                var showUpdatedTime = depTime && fs.dep_estimated && fs.dep_estimated !== fl.startTime;
                return (
                  <div key={fl.id} style={{ display: 'flex', alignItems: 'center', gap: 10,
                                            background: '#0d1a2a', borderRadius: 8, padding: '8px 12px' }}>
                    <span className={isInAir ? 'vera-inair' : ''} style={{ fontSize: 16 }}>✈️</span>
                    <div style={{ flex: 1, minWidth: 0 }}>
                      <div style={{ fontSize: 13, fontWeight: 600, color: '#dde1f0',
                                    whiteSpace: 'nowrap', overflow: 'hidden', textOverflow: 'ellipsis' }}>
                        {fl.title}
                      </div>
                      <div style={{ fontSize: 11, color: '#6b7fa8' }}>
                        {/* Times — show updated dep time in amber if changed */}
                        {showUpdatedTime
                          ? <span><span style={{ textDecoration: 'line-through' }}>{fl.startTime}</span>
                              <span style={{ color: '#e8b44a', marginLeft: 4 }}>{fs.dep_estimated}</span>
                              {fl.endTime ? ' – ' + fl.endTime : ''}
                            </span>
                          : <span>{fl.startTime}{fl.endTime ? ' – ' + fl.endTime : ''}</span>
                        }
                        {fl.location ? ' · ' + fl.location : ''}
                        {/* Gate */}
                        {fs && fs.gate     && <span> · <span style={{ color: '#8ab4f8', fontWeight: 600 }}>Gate {fs.gate}</span></span>}
                        {/* Terminal */}
                        {fs && fs.terminal && <span> · <span style={{ color: '#8ab4f8' }}>Terminal {fs.terminal}</span></span>}
                        {/* No status yet */}
                        {!fs && <span style={{ color: '#2e3d55', fontSize: 10 }}> · tap ↺ to load status</span>}
                      </div>
                    </div>
                    {fs && <FlightStatusBadge status={fs} />}
                  </div>
                );
              })}
            </div>
          )}

          {/* Tonight's hotel */}
          {tonightHotel && (
            <div style={{ display: 'flex', alignItems: 'center', gap: 10,
                          background: '#0d1a2a', borderRadius: 8, padding: '8px 12px' }}>
              <span style={{ fontSize: 16 }}>🏨</span>
              <div style={{ flex: 1 }}>
                <div style={{ fontSize: 11, color: '#8ab4f8', fontWeight: 600, textTransform: 'uppercase', letterSpacing: 0.5 }}>Staying at</div>
                <div style={{ fontSize: 13, fontWeight: 600, color: '#dde1f0' }}>{tonightHotel.title}</div>
              </div>
            </div>
          )}

          {/* No items fallback */}
          {todayFlights.length === 0 && !tonightHotel && !doorOutTime && !doorInTime && (
            <div style={{ fontSize: 12, color: '#6b7fa8', fontStyle: 'italic' }}>No itinerary items for today.</div>
          )}

          {/* Door-In (return day only) */}
          {doorInTime && (
            <div style={{ display: 'flex', alignItems: 'center', gap: 8,
                          background: '#0a1a10', borderRadius: 8, padding: '8px 12px',
                          border: '1px solid #1a4028' }}>
              <span style={{ fontSize: 18 }}>🏠</span>
              <div>
                <div style={{ fontSize: 11, color: '#4ac89a', fontWeight: 600, textTransform: 'uppercase', letterSpacing: 0.5 }}>
                  Est. home by{arrAirport ? ' (+' + customsMin(arrAirport) + ' min from ' + arrAirport + ')' : ''}
                </div>
                <div style={{ fontSize: 16, fontWeight: 700, color: '#4ac89a' }}>{doorInTime}</div>
              </div>
              <div style={{ fontSize: 11, color: '#6b7fa8', marginLeft: 4 }}>after customs &amp; transit</div>
            </div>
          )}
        </div>
      )}

      {/* Footer */}
      <div style={{ marginTop: 12, display: 'flex', justifyContent: 'flex-end' }}>
        <button onClick={function() { if (onViewItinerary) onViewItinerary(trip); }}
          style={{ background: 'none', border: 'none', color: '#8ab4f8', fontSize: 12,
                   fontWeight: 600, cursor: 'pointer', padding: 0 }}>
          View Full Itinerary →
        </button>
      </div>
    </div>
  );
}

// ---- Home tab ---------------------------------------------------------------

function HomeTab({ flags, tasks, projects, shopping, pto, milestones, summaries, status, pacingStatus, onNavigate, onViewItinerary, apiUrl, apiToken }) {
  const activeFlags    = flags.filter(f => !f.resolved && !f.acknowledged);
  const highFlags      = activeFlags.filter(f => f.urgency === 'High');
  const topFlag        = highFlags[0] || activeFlags[0];
  const pendingTasks   = tasks;
  const overdueTasks   = tasks.filter(t => t.isOverdue);
  const nextTask       = pendingTasks.find(t => t.dueDate) || pendingTasks[0];
  const pendingShopping = shopping.reduce((sum, s) => sum + s.items.filter(i => !i.done).length, 0);
  const ahmedVacRemaining     = pto?.ahmedStats?.remaining?.vacationDays;
  const ahmedPersRemaining    = pto?.ahmedStats?.remaining?.personalHours;
  const victoriaVacRemaining  = pto?.victoriaStats?.remaining?.vacationDays;
  const victoriaPersRemaining = pto?.victoriaStats?.remaining?.personalHours;
  const nextPTO               = pto?.ahmedStats?.nextPTO;

  // Detect active trip (currently in progress)
  var todayStr    = new Date().toISOString().slice(0, 10);
  var activeTrip  = (pto?.upcomingTravel || []).find(function(t) {
    return todayStr >= t.startDate && todayStr <= t.endDate;
  });

  // Pacing banner — shown when vacation mode or pacing mode is active (Issue #139)
  const showVacation = pacingStatus?.vacationMode;
  const showPacing   = !showVacation && pacingStatus?.pacingMode;
  const vacTrip      = pacingStatus?.vacationTripName || 'your trip';
  const vacEnds      = pacingStatus?.vacationModeEnds || '';
  const pacingEnds   = pacingStatus?.pacingModeEnds || '';

  // Feature Flags card data (Issue #134)
  const FF_TAB_KEYS  = ['fitness','morning_routine','pantry','takeouts','experiments','wish_list','wishlists'];
  const FF_FEAT_KEYS = ['email_parser','pretrip_briefing','posttrip_capture','gym_tracker','google_tasks','weekend_planner'];
  const FF_LABELS    = {
    fitness: '💪 Fitness', morning_routine: '☀️ Morning Routine', pantry: '📦 Pantry',
    takeouts: '🥡 Takeouts', experiments: '🧪 Experiments', wish_list: '🛍 Wish List', wishlists: '🎄 Wish Lists',
    email_parser: '📧 Email Parsing', pretrip_briefing: '✈️ Pre-trip Briefing',
    posttrip_capture: '🗺️ Post-trip Capture', gym_tracker: '🏋️ Gym Tracker',
    google_tasks: '✅ Google Tasks', weekend_planner: '📅 Weekend Planner',
  };
  const ffFeat = (status && status.features) || {};

  return (
    <div>
      {(showVacation || showPacing) && (
        <div style={{
          display: 'flex', alignItems: 'center', gap: 10,
          background: showVacation ? 'linear-gradient(90deg, #1a3a5c 0%, #1e4976 100%)' : 'linear-gradient(90deg, #2a2a1c 0%, #3a3010 100%)',
          border: showVacation ? '1px solid #3d6fa0' : '1px solid #6b5a10',
          borderRadius: 10, padding: '10px 16px', marginBottom: 14, fontSize: 13,
        }}>
          <span style={{ fontSize: 18 }}>{showVacation ? '✈️' : '🧘'}</span>
          <div style={{ flex: 1 }}>
            <span style={{ fontWeight: 700, color: showVacation ? '#7eb8f7' : '#f0c040' }}>
              {showVacation ? 'Vacation Mode' : 'Easy Mode'}
            </span>
            <span style={{ color: '#aab5d0', marginLeft: 8 }}>
              {showVacation
                ? `Active — ${vacTrip}${vacEnds ? ' · returns ' + vacEnds : ''}`
                : `Active — non-critical flags deferred${pacingEnds ? ' until ' + pacingEnds : ''}`}
            </span>
          </div>
          <span style={{ fontSize: 11, color: '#6b7fa8' }}>
            {showVacation ? 'Nags paused 🤙' : 'Catching up 🌱'}
          </span>
        </div>
      )}
    <div className="bento-grid">
      {/* Active Travel Card — pinned to top when a trip is in progress */}
      {activeTrip && (
        <ActiveTravelCard
          trip={activeTrip}
          apiUrl={apiUrl}
          apiToken={apiToken}
          travelConfig={status && status.travelConfig}
          onViewItinerary={onViewItinerary}
        />
      )}

      {/* Flags */}
      <div className="bento-card" onClick={() => onNavigate('flags')}>
        <div className="bento-card-title">🚩 Active Flags</div>
        {activeFlags.length === 0 ? (
          <div style={{ fontSize: 15, color: '#43a047', fontWeight: 600 }}>✓ All clear</div>
        ) : (
          <>
            <div className="bento-card-main">{activeFlags.length}</div>
            <div className="bento-card-sub">
              {status?.high   > 0 && <span style={{ color: '#e53935', fontWeight: 700, marginRight: 8 }}>{status.high} high</span>}
              {status?.medium > 0 && <span style={{ color: '#f9a825', fontWeight: 700, marginRight: 8 }}>{status.medium} med</span>}
              {status?.low    > 0 && <span style={{ color: '#43a047', fontWeight: 700 }}>{status.low} low</span>}
            </div>
            {topFlag && <div className="bento-item" style={{ fontSize: 12, color: '#aab5d0' }}>{topFlag.flag}</div>}
          </>
        )}
      </div>

      {/* Tasks */}
      <div className="bento-card" onClick={() => onNavigate('tasks')}>
        <div className="bento-card-title">✅ Tasks</div>
        <div className="bento-card-main">{pendingTasks.length}</div>
        <div className="bento-card-sub">
          {overdueTasks.length > 0
            ? <span style={{ color: '#ff6b6b' }}>{overdueTasks.length} overdue</span>
            : 'open tasks'}
        </div>
        {nextTask && (
          <div className="bento-item" style={{ fontSize: 12, color: '#aab5d0' }}>Next: {nextTask.task}</div>
        )}
      </div>

      {/* Projects */}
      <div className="bento-card" onClick={() => onNavigate('projects')}>
        <div className="bento-card-title">🏗️ Projects</div>
        {projects.length === 0 ? (
          <div style={{ fontSize: 13, color: '#4d6080' }}>No projects yet</div>
        ) : (
          <>
            <div className="bento-card-main">{projects.length}</div>
            <div className="bento-card-sub">active projects</div>
            <div className="bento-card-list">
              {projects.slice(0, 3).map(p => {
                const pending = p.tasks.filter(t => t.status !== 'Done').length;
                return (
                  <div key={p.projectId} className="bento-item">
                    {p.projectName}
                    {pending > 0 && <span style={{ color: '#c9a84c', marginLeft: 6 }}>({pending})</span>}
                  </div>
                );
              })}
            </div>
          </>
        )}
      </div>

      {/* Shopping */}
      <div className="bento-card" onClick={() => onNavigate('shopping')}>
        <div className="bento-card-title">🛒 Shopping</div>
        {shopping.length === 0 ? (
          <div style={{ fontSize: 13, color: '#4d6080' }}>No lists connected</div>
        ) : (
          <>
            <div className="bento-card-main">{pendingShopping}</div>
            <div className="bento-card-sub">items to get</div>
            <div className="bento-card-list">
              {shopping.map(s => {
                const n = s.items.filter(i => !i.done).length;
                return (
                  <div key={s.tabId} className="bento-item">
                    {s.storeName}
                    <span style={{ color: n === 0 ? '#43a047' : '#c9a84c', marginLeft: 6 }}>{n === 0 ? '✓' : n}</span>
                  </div>
                );
              })}
            </div>
          </>
        )}
      </div>

      {/* PTO */}
      <div className="bento-card" onClick={() => onNavigate('pto')}>
        <div className="bento-card-title">🌴 PTO</div>
        {pto == null ? (
          <div style={{ fontSize: 13, color: '#4d6080' }}>Click to load PTO data</div>
        ) : (
          <>
            <div style={{ display: 'flex', gap: 12, marginBottom: 6 }}>
              <div style={{ flex: 1 }}>
                <div style={{ fontSize: 11, color: '#6b7fa8', marginBottom: 2 }}>Ahmed</div>
                <div style={{ fontSize: 22, fontWeight: 700, color: '#e8eaed' }}>
                  {ahmedVacRemaining ?? '—'} <span style={{ fontSize: 12, fontWeight: 400, color: '#6b7fa8' }}>days</span>
                </div>
                {ahmedPersRemaining != null && (
                  <div style={{ fontSize: 11, color: '#6b7fa8' }}>{ahmedPersRemaining} personal hrs</div>
                )}
              </div>
              <div style={{ flex: 1 }}>
                <div style={{ fontSize: 11, color: '#6b7fa8', marginBottom: 2 }}>Victoria</div>
                <div style={{ fontSize: 22, fontWeight: 700, color: '#e8eaed' }}>
                  {victoriaVacRemaining ?? '—'} <span style={{ fontSize: 12, fontWeight: 400, color: '#6b7fa8' }}>days</span>
                </div>
                {victoriaPersRemaining != null && (
                  <div style={{ fontSize: 11, color: '#6b7fa8' }}>{victoriaPersRemaining} personal hrs</div>
                )}
              </div>
            </div>
            {nextPTO && (
              <div className="bento-item" style={{ fontSize: 12, color: '#aab5d0' }}>
                Next: {nextPTO.label} · <DaysAway n={nextPTO.daysUntil} format="compact-away" />
              </div>
            )}
          </>
        )}
      </div>

      {/* Milestones */}
      <div className="bento-card" onClick={() => onNavigate('milestones')}>
        <div className="bento-card-title">🎯 Milestones</div>
        {milestones.length === 0 ? (
          <div style={{ fontSize: 13, color: '#4d6080' }}>No upcoming milestones</div>
        ) : (
          <>
            <div className="bento-card-main">{milestones.length}</div>
            <div className="bento-card-sub">upcoming events</div>
            <div className="bento-card-list">
              {milestones.slice(0, 3).map((m, i) => {
                const relCount = [
                  ...flags.filter(f => !f.resolved && !f.acknowledged),
                  ...tasks,
                ].filter(item =>
                  matchesMilestone(m,
                    (item.flag || item.task || '') + ' ' +
                    (item.reason || item.notes || ''))
                ).length;
                return (
                  <div key={i} className="bento-item">
                    {m.label}
                    <span style={{ color: '#c9a84c', marginLeft: 6 }}><DaysAway n={m.daysUntil} format="compact" /></span>
                    {relCount > 0 && (
                      <span style={{ color: '#6b7fa8', marginLeft: 6 }}>
                        · {relCount} item{relCount !== 1 ? 's' : ''}
                      </span>
                    )}
                  </div>
                );
              })}
            </div>
          </>
        )}
      </div>

      {/* Spending Chart */}
      <SpendingChart summaries={summaries} />

      {/* Feature Flags card — always visible, shows all boolean config keys (Issue #134) */}
      <div className="bento-card" style={{ cursor: 'default' }}>
        <div className="bento-card-title">⚙️ Feature Flags</div>
        <div style={{ fontSize: 10, color: '#3d5070', textTransform: 'uppercase', letterSpacing: '0.5px', marginBottom: 6 }}>Tabs</div>
        <div style={{ display: 'flex', flexWrap: 'wrap', gap: 5, marginBottom: 12 }}>
          {FF_TAB_KEYS.map(function(k) {
            var on = ffFeat[k] !== false;
            return <span key={k} style={{ padding: '3px 9px', borderRadius: 20, fontSize: 11, fontWeight: 600,
              background: on ? 'rgba(102,187,106,.1)' : 'rgba(107,127,168,.08)',
              color: on ? '#4d9f6a' : '#4d6080',
              border: '1px solid ' + (on ? 'rgba(102,187,106,.3)' : 'rgba(107,127,168,.2)') }}>{FF_LABELS[k]}</span>;
          })}
        </div>
        <div style={{ fontSize: 10, color: '#3d5070', textTransform: 'uppercase', letterSpacing: '0.5px', marginBottom: 6 }}>Features</div>
        <div style={{ display: 'flex', flexWrap: 'wrap', gap: 5 }}>
          {FF_FEAT_KEYS.map(function(k) {
            var on = ffFeat[k] !== false;
            return <span key={k} style={{ padding: '3px 9px', borderRadius: 20, fontSize: 11, fontWeight: 600,
              background: on ? 'rgba(102,187,106,.1)' : 'rgba(107,127,168,.08)',
              color: on ? '#4d9f6a' : '#4d6080',
              border: '1px solid ' + (on ? 'rgba(102,187,106,.3)' : 'rgba(107,127,168,.2)') }}>{FF_LABELS[k]}</span>;
          })}
        </div>
      </div>
    </div>
    </div>
  );
}

// ---- Ideas Braindump tab (Issue #18) -----------------------------------------

const IDEA_CATEGORIES_UI = ['General', 'Home', 'Finance', 'Health', 'Career', 'Personal', 'Travel', 'Other'];
const IDEA_STATUS_COLORS  = { New: '#8ab4f8', Promoted: '#43a047', Archived: '#4d6080' };

function IdeasTab({ ideas, onAdd, onPromote, onArchive, onShelve, busy }) {
  const [filterStatus, setFilterStatus] = React.useState('New');
  const [showForm,    setShowForm]    = React.useState(false);
  const [form, setForm] = React.useState({ idea: '', category: 'General', tags: '', notes: '' });

  const thoughts = ideas.filter(i => i.status === 'Thought');
  const filtered = filterStatus === 'All'
    ? ideas.filter(i => i.status !== 'Thought')
    : filterStatus === 'Thoughts'
      ? thoughts
      : ideas.filter(i => i.status === filterStatus);

  function handleSubmit(e) {
    e.preventDefault();
    if (!form.idea.trim()) return;
    onAdd(form);
    setForm({ idea: '', category: 'General', tags: '', notes: '' });
    setShowForm(false);
  }

  return (
    <div>
      {/* Toolbar */}
      <div style={{ display: 'flex', alignItems: 'center', gap: 10, marginBottom: 14, flexWrap: 'wrap' }}>
        <div style={{ display: 'flex', gap: 6 }}>
          {['Thoughts', 'New', 'All', 'Promoted'].map(s => (
            <button key={s}
              onClick={() => setFilterStatus(s)}
              style={{
                padding: '4px 12px', borderRadius: 6, border: 'none', cursor: 'pointer', fontSize: 12,
                background: filterStatus === s ? (s === 'Thoughts' ? '#3a2a10' : '#8ab4f8') : '#1e2a3a',
                color: filterStatus === s ? (s === 'Thoughts' ? '#f0a040' : '#0d1117') : (s === 'Thoughts' ? '#f0a040' : '#8ab4f8'),
                fontWeight: filterStatus === s ? 700 : 400,
              }}>
              {s === 'Thoughts' ? '💬 Thoughts' + (thoughts.length ? ' (' + thoughts.length + ')' : '') : s}
            </button>
          ))}
        </div>
        <button
          disabled={busy}
          onClick={() => setShowForm(v => !v)}
          style={{ marginLeft: 'auto', padding: '6px 16px', borderRadius: 6, border: 'none',
                   background: '#8ab4f8', color: '#0d1117', fontWeight: 600, cursor: 'pointer', fontSize: 13 }}>
          {showForm ? '\u2715 Cancel' : '+ Park an Idea'}
        </button>
      </div>

      {/* Quick add form */}
      {showForm && (
        <form onSubmit={handleSubmit}
          style={{ background: '#1e2a3a', borderRadius: 8, padding: '14px 16px', marginBottom: 16,
                   border: '1px solid #2a3a50', display: 'flex', flexDirection: 'column', gap: 10 }}>
          <textarea
            placeholder="Describe the idea\u2026"
            value={form.idea}
            onChange={e => setForm(p => ({ ...p, idea: e.target.value }))}
            rows={3}
            style={{ background: '#0d1117', border: '1px solid #2a3a50', borderRadius: 6, color: '#e8eaed',
                     padding: '8px 10px', fontSize: 13, resize: 'vertical', width: '100%', boxSizing: 'border-box' }}
          />
          <div style={{ display: 'flex', gap: 10, flexWrap: 'wrap' }}>
            <select value={form.category} onChange={e => setForm(p => ({ ...p, category: e.target.value }))}
              style={{ background: '#0d1117', border: '1px solid #2a3a50', borderRadius: 6, color: '#e8eaed',
                       padding: '6px 8px', fontSize: 13, flex: '0 0 140px' }}>
              {IDEA_CATEGORIES_UI.map(c => <option key={c} value={c}>{c}</option>)}
            </select>
            <input
              placeholder="Tags (comma-separated)"
              value={form.tags}
              onChange={e => setForm(p => ({ ...p, tags: e.target.value }))}
              style={{ background: '#0d1117', border: '1px solid #2a3a50', borderRadius: 6, color: '#e8eaed',
                       padding: '6px 8px', fontSize: 13, flex: 1 }}
            />
          </div>
          <input
            placeholder="Notes (optional)"
            value={form.notes}
            onChange={e => setForm(p => ({ ...p, notes: e.target.value }))}
            style={{ background: '#0d1117', border: '1px solid #2a3a50', borderRadius: 6, color: '#e8eaed',
                     padding: '6px 8px', fontSize: 13 }}
          />
          <div style={{ display: 'flex', gap: 8, justifyContent: 'flex-end' }}>
            <button type="button" onClick={() => setShowForm(false)}
              style={{ padding: '6px 14px', borderRadius: 6, border: '1px solid #2a3a50',
                       background: 'transparent', color: '#8ab4f8', cursor: 'pointer', fontSize: 13 }}>
              Cancel
            </button>
            <button type="submit" disabled={busy || !form.idea.trim()}
              style={{ padding: '6px 16px', borderRadius: 6, border: 'none',
                       background: '#8ab4f8', color: '#0d1117', fontWeight: 600, cursor: 'pointer', fontSize: 13 }}>
              💡 Park It
            </button>
          </div>
        </form>
      )}

      {/* Empty state */}
      {filtered.length === 0 ? (
        <div style={{ textAlign: 'center', padding: '40px 20px', color: '#5f6368', fontSize: 14 }}>
          {filterStatus === 'Thoughts'
            ? 'No unreviewed thoughts. VERA will capture passing thoughts from chat automatically.'
            : filterStatus === 'New'
            ? 'No unreviewed ideas. Add one above or tell VERA in chat.'
            : `No ideas with status "${filterStatus}".`}
        </div>
      ) : (
        <div style={{ display: 'flex', flexDirection: 'column', gap: 8 }}>
          {filtered.map(idea => {
            const isThought = idea.status === 'Thought';
            return (
            <div key={idea.id} style={{
              background: isThought ? '#1e1a10' : '#1e2a3a', borderRadius: 8, padding: '12px 14px',
              border: '1px solid ' + (isThought ? '#3a2a10' : '#2a3a50'),
              display: 'flex', alignItems: 'flex-start', gap: 12
            }}>
              {/* Left: content */}
              <div style={{ flex: 1, minWidth: 0 }}>
                <div style={{ display: 'flex', alignItems: 'center', gap: 8, flexWrap: 'wrap', marginBottom: 4 }}>
                  {isThought && (
                    <span style={{ fontSize: 12 }}>💬</span>
                  )}
                  <span style={{ fontWeight: 600, color: '#e8eaed', fontSize: 14 }}>{idea.idea}</span>
                  {isThought ? (
                    <span style={{ fontSize: 11, padding: '2px 8px', borderRadius: 10,
                                   background: '#2a1a00', color: '#f0a040',
                                   border: '1px solid #3a2a10' }}>
                      from chat
                    </span>
                  ) : (
                    <>
                      <span style={{ fontSize: 11, padding: '2px 8px', borderRadius: 10,
                                     background: '#0d1117', color: IDEA_STATUS_COLORS[idea.status] || '#8ab4f8',
                                     border: '1px solid ' + (IDEA_STATUS_COLORS[idea.status] || '#8ab4f8') }}>
                        {idea.status}
                      </span>
                      {idea.category && (
                        <span style={{ fontSize: 11, padding: '2px 8px', borderRadius: 10,
                                       background: '#1a3050', color: '#8ab4f8' }}>
                          {idea.category}
                        </span>
                      )}
                    </>
                  )}
                </div>
                {idea.tags && (
                  <div style={{ color: '#5f6368', fontSize: 12, marginBottom: 2 }}>🏷 {idea.tags}</div>
                )}
                {idea.notes && (
                  <div style={{ color: '#9aa0a6', fontSize: 12, fontStyle: 'italic' }}>{idea.notes}</div>
                )}
                <div style={{ color: '#5f6368', fontSize: 11, marginTop: 4 }}>{idea.id} \u00b7 {idea.dateAdded}</div>
              </div>
              {/* Right: actions */}
              {isThought ? (
                <div style={{ display: 'flex', flexDirection: 'column', gap: 6, flexShrink: 0 }}>
                  <button
                    disabled={busy}
                    onClick={() => onShelve && onShelve(idea.id, idea.idea)}
                    title="Shelve as Idea"
                    style={{ padding: '5px 12px', borderRadius: 6, border: 'none',
                             background: '#2a1a00', color: '#f0a040', cursor: 'pointer', fontSize: 12,
                             fontWeight: 600, whiteSpace: 'nowrap' }}>
                    💡 Shelve
                  </button>
                  <button
                    disabled={busy}
                    onClick={() => onPromote(idea.id, idea.idea)}
                    title="Promote to Task"
                    style={{ padding: '5px 12px', borderRadius: 6, border: 'none',
                             background: '#1a4a2a', color: '#43a047', cursor: 'pointer', fontSize: 12,
                             fontWeight: 600, whiteSpace: 'nowrap' }}>
                    \u2705 Task
                  </button>
                  <button
                    disabled={busy}
                    onClick={() => onArchive(idea.id)}
                    title="Dismiss"
                    style={{ padding: '5px 12px', borderRadius: 6, border: '1px solid #2a3a50',
                             background: 'transparent', color: '#9aa0a6', cursor: 'pointer', fontSize: 12 }}>
                    Dismiss
                  </button>
                </div>
              ) : (
                idea.status === 'New' && (
                <div style={{ display: 'flex', flexDirection: 'column', gap: 6, flexShrink: 0 }}>
                  <button
                    disabled={busy}
                    onClick={() => onPromote(idea.id, idea.idea)}
                    title="Promote to Task"
                    style={{ padding: '5px 12px', borderRadius: 6, border: 'none',
                             background: '#1a4a2a', color: '#43a047', cursor: 'pointer', fontSize: 12,
                             fontWeight: 600, whiteSpace: 'nowrap' }}>
                    \u2705 Make Task
                  </button>
                  <button
                    disabled={busy}
                    onClick={() => onArchive(idea.id)}
                    title="Archive Idea"
                    style={{ padding: '5px 12px', borderRadius: 6, border: '1px solid #2a3a50',
                             background: 'transparent', color: '#9aa0a6', cursor: 'pointer', fontSize: 12 }}>
                    Archive
                  </button>
                </div>
                )
              )}
            </div>
            );
          })}
        </div>
      )}
    </div>
  );
}

// ---- ResourcesView (Issue #129) ---------------------------------------------

const RESOURCE_CATEGORIES = ['HR & Benefits', 'Work Policy', 'Finance', 'Travel', 'Personal', 'Legal', 'Other'];

function ResourcesView({ resources, loading, busy, onAdd, onUpdate, onDelete }) {
  const [showModal, setShowModal] = React.useState(false);
  const [editing,   setEditing]   = React.useState(null); // resource obj or null
  const [form, setForm] = React.useState({ name: '', category: 'Work Policy', appliesTo: 'Both', description: '', url: '', tags: '' });
  const [confirmId, setConfirmId] = React.useState(null);

  function openAdd() {
    setEditing(null);
    setForm({ name: '', category: 'Work Policy', appliesTo: 'Both', description: '', url: '', driveFileId: '', tags: '' });
    setShowModal(true);
  }

  function openEdit(r) {
    setEditing(r);
    setForm({ name: r.Name, category: r.Category, appliesTo: r['Applies To'] || 'Both',
              description: r.Description, url: r.URL, driveFileId: r['Drive File ID'] || '', tags: r.Tags });
    setShowModal(true);
  }

  async function handleSubmit() {
    if (!form.name.trim() || !form.url.trim()) return;
    if (editing) {
      await onUpdate(editing.ID, form);
    } else {
      await onAdd(form);
    }
    setShowModal(false);
  }

  // Group by category
  const grouped = {};
  const order   = [];
  (resources || []).forEach(function(r) {
    const cat = r.Category || 'Other';
    if (!grouped[cat]) { grouped[cat] = []; order.push(cat); }
    grouped[cat].push(r);
  });

  if (loading) return <div className="loading-text">Loading resources…</div>;

  return (
    <div>
      <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center', marginBottom: 16 }}>
        <div style={{ fontSize: 13, color: '#4d6080' }}>
          Reference documents and policies VERA can consult when answering your questions.
        </div>
        <button className="btn-primary" onClick={openAdd} disabled={busy}>+ Add Resource</button>
      </div>

      {(!resources || resources.length === 0) ? (
        <div className="empty-state" style={{ paddingTop: 40 }}>
          <div style={{ fontSize: 36, marginBottom: 10 }}>📎</div>
          <div style={{ fontWeight: 600, color: '#a0b0c8', marginBottom: 6 }}>No resources yet</div>
          <div style={{ fontSize: 13, color: '#4d6080', marginBottom: 16 }}>
            Add links to Google Docs, PDFs, or policy pages.<br/>
            VERA will reference them when answering relevant questions.
          </div>
          <button className="btn-primary" onClick={openAdd} disabled={busy}>+ Add First Resource</button>
        </div>
      ) : (
        <div>
          {order.map(cat => (
            <div key={cat} style={{ marginBottom: 24 }}>
              <div style={{ fontSize: 11, fontWeight: 700, letterSpacing: '0.08em', color: '#5a7ba0',
                            textTransform: 'uppercase', marginBottom: 8, paddingBottom: 4,
                            borderBottom: '1px solid #1e2d40' }}>
                {cat}
              </div>
              {grouped[cat].map(r => (
                <div key={r.ID} style={{ display: 'flex', alignItems: 'flex-start', gap: 10,
                                         padding: '10px 12px', borderRadius: 8, marginBottom: 6,
                                         background: '#0d1b2a', border: '1px solid #1e2d40' }}>
                  <div style={{ fontSize: 20, lineHeight: 1, marginTop: 2 }}
                       title={r['Drive File ID'] ? 'VERA can read this document' : 'Link only — VERA cannot read content'}>
                    {r['Drive File ID'] ? '📄' : '🔗'}
                  </div>
                  <div style={{ flex: 1, minWidth: 0 }}>
                    <div style={{ display: 'flex', alignItems: 'center', gap: 8, marginBottom: 2 }}>
                      <div style={{ fontWeight: 600, fontSize: 14, color: '#c8d8ea' }}>{r.Name}</div>
                      {r['Applies To'] && r['Applies To'] !== 'Both' && (
                        <span style={{ fontSize: 10, fontWeight: 700, padding: '2px 6px', borderRadius: 4,
                                       background: r['Applies To'] === 'Ahmed' ? '#1a3a5a' : '#3a1a4a',
                                       color: r['Applies To'] === 'Ahmed' ? '#6ab0ff' : '#c080ff' }}>
                          {r['Applies To']}
                        </span>
                      )}
                    </div>
                    {r.Description && (
                      <div style={{ fontSize: 12, color: '#4d6080', marginBottom: 4 }}>{r.Description}</div>
                    )}
                    {r.Tags && (
                      <div style={{ fontSize: 11, color: '#3a5070' }}>{r.Tags.split(',').map(t => t.trim()).filter(Boolean).map(t => (
                        <span key={t} style={{ background: '#1a2d42', borderRadius: 4, padding: '1px 6px', marginRight: 4 }}>{t}</span>
                      ))}</div>
                    )}
                  </div>
                  <div style={{ display: 'flex', gap: 6, flexShrink: 0 }}>
                    <a href={r._openUrl || r.URL} target="_blank" rel="noopener noreferrer"
                       style={{ fontSize: 12, color: '#4a9eff', textDecoration: 'none',
                                padding: '4px 8px', border: '1px solid #1e3a5a', borderRadius: 5 }}>
                      ↗ Open
                    </a>
                    <button style={{ fontSize: 12, padding: '4px 8px', background: 'transparent',
                                     border: '1px solid #1e2d40', borderRadius: 5, color: '#7a99bb', cursor: 'pointer' }}
                            onClick={() => openEdit(r)} disabled={busy}>✏</button>
                    {confirmId === r.ID ? (
                      <span style={{ display: 'flex', gap: 4 }}>
                        <button style={{ fontSize: 11, padding: '4px 7px', background: '#5a1a1a',
                                         border: '1px solid #8a2a2a', borderRadius: 5, color: '#ff7070', cursor: 'pointer' }}
                                onClick={() => { onDelete(r.ID); setConfirmId(null); }} disabled={busy}>Confirm</button>
                        <button style={{ fontSize: 11, padding: '4px 7px', background: 'transparent',
                                         border: '1px solid #1e2d40', borderRadius: 5, color: '#4d6080', cursor: 'pointer' }}
                                onClick={() => setConfirmId(null)}>Cancel</button>
                      </span>
                    ) : (
                      <button style={{ fontSize: 12, padding: '4px 8px', background: 'transparent',
                                       border: '1px solid #1e2d40', borderRadius: 5, color: '#7a4040', cursor: 'pointer' }}
                              onClick={() => setConfirmId(r.ID)} disabled={busy}>🗑</button>
                    )}
                  </div>
                </div>
              ))}
            </div>
          ))}
        </div>
      )}

      {showModal && (
        <div className="modal-overlay" onClick={() => setShowModal(false)}>
          <div className="modal-box" onClick={e => e.stopPropagation()} style={{ maxWidth: 480 }}>
            <div className="modal-title">{editing ? 'Edit Resource' : 'Add Resource'}</div>

            <label className="modal-label">Name *</label>
            <input className="modal-input" placeholder="e.g. Verizon Medical Insurance Coverage"
                   value={form.name} onChange={e => setForm(f => ({ ...f, name: e.target.value }))} />

            <label className="modal-label">Category</label>
            <select className="modal-input" value={form.category}
                    onChange={e => setForm(f => ({ ...f, category: e.target.value }))}>
              {RESOURCE_CATEGORIES.map(c => <option key={c} value={c}>{c}</option>)}
            </select>

            <label className="modal-label">Applies To</label>
            <div style={{ display: 'flex', gap: 8, marginBottom: 14 }}>
              {['Both', 'Ahmed', 'Victoria'].map(opt => (
                <button key={opt} type="button"
                        onClick={() => setForm(f => ({ ...f, appliesTo: opt }))}
                        style={{ flex: 1, padding: '6px 0', borderRadius: 6, fontSize: 13, cursor: 'pointer',
                                 border: form.appliesTo === opt ? '1.5px solid #4a9eff' : '1px solid #1e2d40',
                                 background: form.appliesTo === opt ? '#1a3050' : 'transparent',
                                 color: form.appliesTo === opt ? '#c8d8ea' : '#4d6080' }}>
                  {opt}
                </button>
              ))}
            </div>

            <label className="modal-label">URL * (Google Drive link or any web URL)</label>
            <input className="modal-input" placeholder="https://docs.google.com/..."
                   value={form.url} onChange={e => setForm(f => ({ ...f, url: e.target.value }))} />
            {form.url && !/docs\.google\.com|drive\.google\.com/.test(form.url) && (
              <div style={{ fontSize: 11, color: '#7a6a30', marginTop: -8, marginBottom: 8 }}>
                ⚠ Non-Google Drive links are reference-only — VERA can't read their content.
              </div>
            )}
            {form.url && /docs\.google\.com|drive\.google\.com/.test(form.url) && (
              <div style={{ fontSize: 11, color: '#3a7a50', marginTop: -8, marginBottom: 8 }}>
                ✓ Google Drive link detected — VERA will extract the file ID and read this document's content.
              </div>
            )}

            {editing && (
              <>
                <label className="modal-label">Drive File ID (auto-extracted — read only)</label>
                <div style={{ fontFamily: 'monospace', fontSize: 11, padding: '6px 10px', background: '#070f18',
                              border: '1px solid #1e2d40', borderRadius: 6, color: '#4d6080', marginBottom: 14,
                              wordBreak: 'break-all', minHeight: 28 }}>
                  {editing['Drive File ID']
                    ? <span style={{ color: '#3a9a60' }}>✓ {editing['Drive File ID']}</span>
                    : <span style={{ color: '#8a5a30' }}>✗ Not extracted — VERA cannot read this document. Re-add with the correct Google Drive URL.</span>}
                </div>
              </>
            )}

            <label className="modal-label">Description</label>
            <textarea className="modal-input" rows={2}
                      placeholder="What is this document about? (helps VERA know when to use it)"
                      value={form.description}
                      onChange={e => setForm(f => ({ ...f, description: e.target.value }))}
                      style={{ resize: 'vertical' }} />

            <label className="modal-label">Tags (comma-separated)</label>
            <input className="modal-input" placeholder="e.g. health, insurance, massage, dental"
                   value={form.tags} onChange={e => setForm(f => ({ ...f, tags: e.target.value }))} />

            <div className="modal-actions">
              <button className="btn-secondary" onClick={() => setShowModal(false)}>Cancel</button>
              <button className="btn-primary"
                      onClick={handleSubmit}
                      disabled={busy || !form.name.trim() || !form.url.trim()}>
                {editing ? 'Save Changes' : 'Add Resource'}
              </button>
            </div>
          </div>
        </div>
      )}
    </div>
  );
}

const COURSE_STATUSES = ['Want to Do', 'In Progress', 'Done'];
