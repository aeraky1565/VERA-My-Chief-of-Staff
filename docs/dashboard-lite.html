function HouseholdRowModal({ initial, onSave, onClose, busy }) {
  const [form, setForm] = React.useState({
    section:    initial.section    || '',
    subsection: initial.subsection || '',
    label:      initial.label      || '',
    value:      initial.value      || '',
    notes:      initial.notes      || '',
  });
  const isAdd = !initial.rowNum;
  function field(key, label, required) {
    return (
      <div style={{ marginBottom:12 }}>
        <div style={{ fontSize:11, fontWeight:600, color:'#8a9abf', marginBottom:4 }}>{label}{required ? ' *' : ''}</div>
        <input
          value={form[key]}
          onChange={e => setForm(prev => ({ ...prev, [key]: e.target.value }))}
          style={{ width:'100%', background:'#0a1628', border:'1px solid #1e3060', borderRadius:6,
                   padding:'8px 10px', color:'#dde1f0', fontSize:13, boxSizing:'border-box' }}
        />
      </div>
    );
  }
  return (
    <div style={{ position:'fixed', inset:0, background:'rgba(0,0,0,0.6)', zIndex:1000,
                  display:'flex', alignItems:'center', justifyContent:'center' }}
         onClick={e => { if (e.target === e.currentTarget) onClose(); }}>
      <div style={{ background:'#0d1b3e', border:'1px solid #1e3060', borderRadius:12,
                    padding:24, width:400, maxWidth:'90vw' }}>
        <div style={{ fontSize:15, fontWeight:700, color:'#dde1f0', marginBottom:16 }}>
          {isAdd ? 'Add Row' : 'Edit Row'}
        </div>
        {field('section',    'Section',    true)}
        {field('subsection', 'Subsection', false)}
        {field('label',      'Label',      true)}
        {field('value',      'Value',      true)}
        {field('notes',      'Notes',      false)}
        <div style={{ display:'flex', gap:8, justifyContent:'flex-end', marginTop:8 }}>
          <button onClick={onClose} disabled={busy}
                  style={{ padding:'8px 16px', borderRadius:6, background:'rgba(255,255,255,0.07)',
                           color:'#8a9abf', border:'none', cursor:'pointer', fontSize:13 }}>
            Cancel
          </button>
          <button onClick={() => onSave(form)} disabled={busy || !form.section || !form.label || !form.value}
                  style={{ padding:'8px 16px', borderRadius:6, background:'#1565c0',
                           color:'#fff', border:'none', cursor:'pointer', fontSize:13, fontWeight:600 }}>
            {busy ? 'Saving…' : 'Save'}
          </button>
        </div>
      </div>
    </div>
  );
}

function HouseholdLiteTab({ apiUrl, apiToken }) {
  const [data,         setData]         = React.useState(null);
  const [loading,      setLoading]      = React.useState(false);
  const [busy,         setBusy]         = React.useState(false);
  const [revealed,     setRevealed]     = React.useState({});
  const [openSections, setOpenSections] = React.useState({});
  const [modal,        setModal]        = React.useState(null); // null | row object (with isAdd flag)
  const [inlineEdit,   setInlineEdit]   = React.useState(null); // null | { rowNum, value }
  const inlineRef = React.useRef(null);

  async function load() {
    if (!apiUrl || !apiToken) return;
    setLoading(true);
    try {
      const res = await apiGet(apiUrl, apiToken, { action: 'get_household_info' });
      setData(res);
      if (res.sections) {
        const open = {};
        res.sections.forEach(s => { open[s.section] = true; });
        setOpenSections(prev => {
          // Preserve any manually-closed sections
          const merged = {};
          res.sections.forEach(s => { merged[s.section] = prev[s.section] !== false; });
          return merged;
        });
      }
    } catch (err) { /* silent */ }
    setLoading(false);
  }

  React.useEffect(() => { load(); }, [apiUrl, apiToken]);

  // Auto-focus inline input when it appears
  React.useEffect(() => {
    if (inlineEdit && inlineRef.current) inlineRef.current.focus();
  }, [inlineEdit]);

  const SENSITIVE = ['id', '#', 'number', 'account', 'ssn', 'vin', 'policy', 'member', 'pin'];
  function isSensitive(label) {
    const l = label.toLowerCase();
    return SENSITIVE.some(k => l.includes(k));
  }
  function maskValue(val) {
    const s = String(val);
    return s.length <= 4 ? '••••' : '••••' + s.slice(-4);
  }

  async function handleSaveModal(form) {
    setBusy(true);
    try {
      if (modal.rowNum) {
        await apiGet(apiUrl, apiToken, { action: 'update_household_row', rowNum: modal.rowNum, ...form });
      } else {
        await apiGet(apiUrl, apiToken, { action: 'add_household_row', ...form });
      }
      setModal(null);
      await load();
    } catch (err) { alert('Save failed: ' + err.message); }
    setBusy(false);
  }

  async function handleInlineSave(row, newValue) {
    if (newValue === row.value) { setInlineEdit(null); return; }
    setBusy(true);
    try {
      await apiGet(apiUrl, apiToken, {
        action: 'update_household_row',
        rowNum: row.rowNum,
        section: row.section, subsection: row.subsection,
        label: row.label, value: newValue, notes: row.notes,
      });
      await load();
    } catch (err) { alert('Save failed: ' + err.message); }
    setInlineEdit(null);
    setBusy(false);
  }

  async function handleDelete(row) {
    if (!window.confirm(`Delete "${row.label}"?`)) return;
    setBusy(true);
    try {
      await apiGet(apiUrl, apiToken, { action: 'delete_household_row', rowNum: row.rowNum });
      await load();
    } catch (err) { alert('Delete failed: ' + err.message); }
    setBusy(false);
  }

  const iconBtn = { background:'none', border:'none', cursor:'pointer', padding:'0 3px',
                    fontSize:13, opacity:0.5, lineHeight:1 };

  if (loading && !data) return (
    <div style={{ color:'#6b7fa8', padding:32, textAlign:'center' }}>Loading household info...</div>
  );
  if (!data || !data.sections || data.sections.length === 0) return (
    <div style={{ color:'#6b7fa8', padding:32, textAlign:'center' }}>
      <div style={{ fontSize:32, marginBottom:12 }}>🏡</div>
      <div style={{ fontSize:14, marginBottom:8 }}>No household info yet.</div>
      <div style={{ fontSize:12, color:'#4a5a7a' }}>
        Run <strong>setupHouseholdInfoSheet_()</strong> in the Apps Script editor, then reload.
      </div>
    </div>
  );

  const sheetUrl = data.sheetUrl || '';

  return (
    <div>
      {modal && (
        <HouseholdRowModal initial={modal} onSave={handleSaveModal} onClose={() => setModal(null)} busy={busy} />
      )}

      <div style={{ display:'flex', alignItems:'center', justifyContent:'space-between', marginBottom:20 }}>
        <div>
          <div style={{ fontSize:18, fontWeight:700, color:'#dde1f0' }}>Household Cheat Sheet</div>
          <div style={{ fontSize:12, color:'#6b7fa8', marginTop:2 }}>Shared quick reference — offline survival info</div>
        </div>
        <div style={{ display:'flex', gap:8 }}>
          {sheetUrl && (
            <a href={sheetUrl} target="_blank" rel="noreferrer"
               style={{ fontSize:12, padding:'6px 12px', borderRadius:6,
                        background:'rgba(255,255,255,0.07)', color:'#8a9abf',
                        textDecoration:'none', display:'inline-flex', alignItems:'center', gap:4 }}>
              ↗ Sheets
            </a>
          )}
          <button onClick={() => window.print()}
                  style={{ fontSize:12, padding:'6px 12px', borderRadius:6,
                           background:'rgba(255,255,255,0.07)', color:'#8a9abf',
                           border:'none', cursor:'pointer' }}>
            🖨 Print
          </button>
        </div>
      </div>

      <div style={{ display:'flex', flexDirection:'column', gap:12 }}>
        {data.sections.map((section, si) => {
          const isOpen = openSections[section.section] !== false;
          return (
            <div key={section.section}
                 style={{ borderRadius:10, overflow:'hidden', background:'#0d1b3e', border:'1px solid #1e3060' }}>
              <button onClick={() => setOpenSections(prev => ({ ...prev, [section.section]: !isOpen }))}
                      style={{ width:'100%', display:'flex', alignItems:'center',
                               justifyContent:'space-between', padding:'14px 20px',
                               background:'none', border:'none', cursor:'pointer', textAlign:'left' }}>
                <div style={{ display:'flex', alignItems:'center', gap:10 }}>
                  <span style={{ fontSize:15, fontWeight:700, color:'#dde1f0' }}>{section.section}</span>
                  {section.lastUpdated && (
                    <span style={{ fontSize:11, color:'#4a5a7a' }}>Updated {fmtDate(section.lastUpdated)}</span>
                  )}
                </div>
                <span style={{ color:'#4a5a7a', fontSize:12 }}>{isOpen ? '▲' : '▼'}</span>
              </button>

              {isOpen && (
                <div style={{ padding:'0 20px 16px' }}>
                  {section.subsections.map((subsection, ssi) => (
                    <div key={subsection.subsection || '_'}
                         style={{ marginBottom: ssi < section.subsections.length - 1 ? 20 : 0 }}>
                      {subsection.subsection && (
                        <div style={{ fontSize:11, fontWeight:700, color:'#c9a84c',
                                      letterSpacing:'1.5px', textTransform:'uppercase',
                                      marginBottom:10, paddingTop: ssi === 0 ? 4 : 12 }}>
                          {subsection.subsection}
                        </div>
                      )}
                      <table style={{ width:'100%', borderCollapse:'collapse' }}>
                        <tbody>
                          {subsection.rows.map((row, ri) => {
                            const revKey     = `${si}_${ssi}_${ri}`;
                            const sensitive  = isSensitive(row.label);
                            const isRevealed = revealed[revKey];
                            const isInline   = inlineEdit && inlineEdit.rowNum === row.rowNum;
                            const displayVal = sensitive && !isRevealed ? maskValue(row.value) : row.value;
                            return (
                              <tr key={ri}
                                  style={{ borderBottom:'1px solid rgba(30,48,96,0.5)' }}
                                  className="household-row">
                                <td style={{ padding:'8px 16px 8px 0', fontSize:12, fontWeight:600,
                                             color:'#8a9abf', whiteSpace:'nowrap', verticalAlign:'middle', width:'28%' }}>
                                  {row.label}
                                </td>
                                <td style={{ padding:'6px 0', fontSize:13, color:'#dde1f0', verticalAlign:'middle' }}>
                                  {isInline ? (
                                    <input
                                      ref={inlineRef}
                                      defaultValue={row.value}
                                      onKeyDown={e => {
                                        if (e.key === 'Enter') handleInlineSave(row, e.target.value);
                                        if (e.key === 'Escape') setInlineEdit(null);
                                      }}
                                      onBlur={e => handleInlineSave(row, e.target.value)}
                                      style={{ width:'100%', background:'#0a1628', border:'1px solid #1565c0',
                                               borderRadius:5, padding:'4px 8px', color:'#dde1f0',
                                               fontSize:13, boxSizing:'border-box' }}
                                    />
                                  ) : (
                                    <span
                                      onClick={() => !sensitive && setInlineEdit({ rowNum: row.rowNum, value: row.value })}
                                      style={{ cursor: sensitive ? 'default' : 'text' }}>
                                      {displayVal}
                                    </span>
                                  )}
                                  {sensitive && !isInline && (
                                    <button onClick={() => setRevealed(prev => ({ ...prev, [revKey]: !isRevealed }))}
                                            style={{ marginLeft:8, fontSize:10, color:'#4a5a7a',
                                                     background:'none', border:'none', cursor:'pointer', padding:'0 4px' }}>
                                      {isRevealed ? 'hide' : 'show'}
                                    </button>
                                  )}
                                </td>
                                <td style={{ padding:'6px 0 6px 8px', verticalAlign:'middle', whiteSpace:'nowrap' }}>
                                  <button title="Edit" onClick={() => setModal(row)} style={iconBtn} disabled={busy}>✏️</button>
                                  <button title="Delete" onClick={() => handleDelete(row)} style={iconBtn} disabled={busy}>🗑️</button>
                                </td>
                              </tr>
                            );
                          })}
                        </tbody>
                      </table>
                    </div>
                  ))}
                  <button
                    onClick={() => setModal({ section: section.section, subsection: '', label: '', value: '', notes: '' })}
                    disabled={busy}
                    style={{ marginTop:12, fontSize:12, padding:'5px 12px', borderRadius:6,
                             background:'rgba(21,101,192,0.15)', color:'#5b9bd5',
                             border:'1px dashed rgba(21,101,192,0.4)', cursor:'pointer' }}>
                    + Add row
                  </button>
                </div>
              )}
            </div>
          );
        })}
      </div>
    </div>
  );
}

// ---- Finance helpers --------------------------------------------------------

function fmtMny(v) {
  if (v == null || v === '') return '—';
  return '$' + Math.round(Number(v)).toLocaleString();
}

function payerChip(paidBy) {
  const color = paidBy === 'Ahmed' ? '#5c9eff' : paidBy === 'Victoria' ? '#c97ef2' : '#2bb5a0';
  return (
    <span style={{ fontSize: 10, padding: '1px 6px', borderRadius: 8,
      border: '1px solid ' + color, color, whiteSpace: 'nowrap', flexShrink: 0 }}>
      {paidBy}
    </span>
  );
}

function useTrackerBudget(apiUrl, apiToken) {
  const [tb, setTb] = React.useState(null);
  const [loading, setLoading] = React.useState(false);
  async function load() {
    if (!apiUrl || !apiToken) return;
    setLoading(true);
    try { const d = await apiGet(apiUrl, apiToken, { action: 'budget_tracker' }); setTb(d && d.ok ? d : null); }
    catch(e) { setTb(null); }
    setLoading(false);
  }
  React.useEffect(() => { load(); }, [apiUrl, apiToken]);
  return [tb, loading, load];
}

function getSplit() {
  try { const s = JSON.parse(localStorage.getItem('vera_split') || 'null'); if (s && typeof s.ahmed === 'number') return s; } catch(e) {}
  return { ahmed: 60, victoria: 40 };
}

function FinBillsLiteTab({ apiUrl, apiToken }) {
  const [bills,        setBills]        = React.useState(null);
  const [billsLoading, setBillsLoading] = React.useState(false);
  const [calBills,     setCalBills]     = React.useState([]);
  const [accounts,     setAccounts]     = React.useState([]);
  const [txList,       setTxList]       = React.useState([]);
  const [busy,         setBusy]         = React.useState(false);
  const [showAddBill,  setShowAddBill]  = React.useState(false);
  const [tb, tbLoading, reloadTb] = useTrackerBudget(apiUrl, apiToken);

  function loadBills() {
    if (!apiUrl || !apiToken) return;
    setBillsLoading(true);
    apiGet(apiUrl, apiToken, { action: 'bills' })
      .then(function(d) { setBills(d || null); })
      .catch(function() { setBills(null); })
      .finally(function() { setBillsLoading(false); });
  }

  function loadCalBills() {
    if (!apiUrl || !apiToken) return;
    apiGet(apiUrl, apiToken, { action: 'calendar_bills' })
      .then(function(d) { setCalBills((d && d.bills) || []); })
      .catch(function() { setCalBills([]); });
  }

  React.useEffect(function() {
    if (!apiUrl || !apiToken) return;
    loadBills();
    loadCalBills();
    apiGet(apiUrl, apiToken, { action: 'get_bank_accounts' })
      .then(function(d) { setAccounts((d && d.accounts) || []); })
      .catch(function() {});
    apiGet(apiUrl, apiToken, { action: 'tx_list' })
      .then(function(d) { setTxList((d && d.transactions) || []); })
      .catch(function() {});
  }, [apiUrl, apiToken]);

  function handleBillToggle(row) {
    setBusy(true);
    apiGet(apiUrl, apiToken, { action: 'bills_toggle', row: row })
      .then(function() { loadBills(); loadCalBills(); })
      .catch(function() {})
      .finally(function() { setBusy(false); });
  }

  function handleCalBillToggle(calBill) {
    setBusy(true);
    apiGet(apiUrl, apiToken, {
      action: 'bills_toggle_cal',
      title: calBill.title,
      amount: calBill.amount != null ? calBill.amount : '',
      date: calBill.date || '',
      frequency: calBill.isRecurring ? 'Recurring' : 'One-time',
      category: calBill.category || '',
      notes: calBill.notes || '',
      isRecurring: String(!!calBill.isRecurring),
    })
      .then(function() { loadBills(); loadCalBills(); })
      .catch(function() {})
      .finally(function() { setBusy(false); });
  }

  function handleAddBill(fields) {
    setBusy(true);
    apiGet(apiUrl, apiToken, Object.assign({ action: 'add_bill' }, fields))
      .then(function() { loadBills(); })
      .catch(function() {})
      .finally(function() { setBusy(false); });
  }

  function handleSyncTransactions() {
    setBusy(true);
    apiGet(apiUrl, apiToken, { action: 'bills_sync_transactions' })
      .then(function() { loadBills(); })
      .catch(function() {})
      .finally(function() { setBusy(false); });
  }

  function handleBillReassign(row, account) {
    if (!row) return;
    apiGet(apiUrl, apiToken, { action: 'update_bill', row: row, account: account }).catch(function() {});
  }

  function handleBudgetLink(row, budgetEntry) {
    if (!row) return;
    apiGet(apiUrl, apiToken, { action: 'update_bill', row: row, budgetEntry: budgetEntry })
      .then(function() { reloadTb(); })
      .catch(function() {});
  }

  const syncCount = ((bills && bills.bills) || []).filter(function(b) { return b.txMatch && !b.paid; }).length;

  return (
    <div>
      <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center', marginBottom: 12 }}>
        {syncCount > 0 ? (
          <button onClick={handleSyncTransactions} disabled={busy} style={{ padding: '5px 12px', borderRadius: 12, background: 'rgba(102,187,106,0.10)', border: '1px solid rgba(102,187,106,0.4)', color: '#66bb6a', fontSize: 11, fontWeight: 600, cursor: busy ? 'not-allowed' : 'pointer', opacity: busy ? 0.6 : 1 }}>
            💳 {syncCount} matched — Sync
          </button>
        ) : <div />}
        <button onClick={function() { setShowAddBill(true); }} style={{ padding: '6px 14px', borderRadius: 8, background: '#0d2040', border: '1px solid #5c9eff', color: '#5c9eff', fontSize: 12, fontWeight: 600, cursor: 'pointer' }}>+ Add Bill</button>
      </div>

      <BillTrackerView
        accounts={accounts}
        bills={bills}
        calBills={calBills}
        billsLoading={billsLoading}
        txList={txList}
        onToggle={handleBillToggle}
        onCalToggle={handleCalBillToggle}
        onReassign={handleBillReassign}
        trackerBudget={tb}
        onBudgetLink={handleBudgetLink}
      />

      {showAddBill && (
        <AddBillModal
          busy={busy}
          accounts={accounts}
          onClose={function() { setShowAddBill(false); }}
          onSave={function(fields) { handleAddBill(fields); setShowAddBill(false); }}
        />
      )}
    </div>
  );
}

function FinCashflowLiteTab({ apiUrl, apiToken }) {
  const [bills, setBills] = React.useState(null);

  const [bills, setBills] = React.useState(null);
  React.useEffect(function() {
    if (!apiUrl || !apiToken) return;
    apiGet(apiUrl, apiToken, { action: 'bills' })
      .then(function(d) { setBills(d || null); })
      .catch(function() { setBills(null); });
  }, [apiUrl, apiToken]);
  return <AccountsTab apiUrl={apiUrl} apiToken={apiToken} bills={bills} split={getSplit()} />;
}

function FinContractsLiteTab({ apiUrl, apiToken }) {
  return <ContractsTab apiUrl={apiUrl} apiToken={apiToken} />;
}

function FinGoalsLiteTab({ apiUrl, apiToken }) {
  const [goals,        setGoals]        = React.useState(null);
  const [goalsLoading, setGoalsLoading] = React.useState(false);
  const [busy,         setBusy]         = React.useState(false);

  function loadGoals() {
    if (!apiUrl || !apiToken) return;
    setGoalsLoading(true);
    apiGet(apiUrl, apiToken, { action: 'financial_goals' })
      .then(function(d) { setGoals(d.goals || []); })
      .catch(function() { setGoals([]); })
      .finally(function() { setGoalsLoading(false); });
  }

  function handleAddGoal(form) {
    setBusy(true);
    apiGet(apiUrl, apiToken, Object.assign({ action: 'add_financial_goal' }, form))
      .then(function() { loadGoals(); })
      .finally(function() { setBusy(false); });
  }

  function handleUpdateGoal(id, form) {
    setBusy(true);
    apiGet(apiUrl, apiToken, Object.assign({ action: 'update_financial_goal', id: id }, form))
      .then(function() { loadGoals(); })
      .finally(function() { setBusy(false); });
  }

  function handleDeleteGoal(id) {
    setBusy(true);
    apiGet(apiUrl, apiToken, { action: 'delete_financial_goal', id: id })
      .then(function() { setGoals(function(prev) { return (prev || []).filter(function(g) { return g.id !== id; }); }); })
      .finally(function() { setBusy(false); });
  }

  return (
    <FinancialGoalsTab
      goals={goals}
      goalsLoading={goalsLoading}
      busy={busy}
      onLoad={loadGoals}
      onAdd={handleAddGoal}
      onUpdate={handleUpdateGoal}
      onDelete={handleDeleteGoal}
      apiUrl={apiUrl}
      apiToken={apiToken}
    />
  );
}

function DaysAwayChip({ daysAway }) {
  const n = daysAway;
  if (n == null) return null;
  const label = n < 0 ? `${Math.abs(n)}d ago` : n === 0 ? 'Today' : `${n}d away`;
  return (
    <span style={{fontSize:12,fontWeight:600,color:'#5c9eff',background:'#0d2040',
      borderRadius:12,padding:'3px 10px',whiteSpace:'nowrap'}}>
      {label}
    </span>
  );
}

// ── Tentative holds ─────────────────────────────────────────────────────────
// The server decides which items are holds and which compete for the same slot
// (annotateOptionGroups_ in TripDecisions.js) and marks exactly one per group as
// the representative. Collapsing here is a filter over that flag, not a second
// copy of the grouping logic — two implementations would drift.
function itinMeta(item) {
  if (!item) return {};
  try { return JSON.parse(item.metadata || '{}') || {}; } catch (e) { return {}; }
}
const isTentativeItem = item => itinMeta(item).tentative === true;
const optionGroupOf   = item => itinMeta(item).optionGroup || '';
const optionCountOf   = item => itinMeta(item).optionCount || 0;
const decisionStatusOf = item => itinMeta(item).decisionStatus || '';
const decideByOf       = item => itinMeta(item).decideBy || '';
const isDecidedItem    = item => decisionStatusOf(item) === 'decided';
// Past its decide-by and still open — the chip turns amber rather than nagging.
// <=, not <: the server clamps decide-by to [today, slotDate], so a deadline
// that has already slipped arrives here as today. With < the amber state could
// never be reached.
// The server's recommendation, where it had one. The client reads a flag and
// never works out which option is suggested — same discipline as
// isRepresentative, so there is no second copy of the reasoning to drift.
function recommendedIdOf(item)   { return itinMeta(item).recommendedId   || ''; }
function recommendBecauseOf(item){ return itinMeta(item).recommendBecause || ''; }

function isOverdueDecision(item) {
  const d = decideByOf(item);
  if (!d || decisionStatusOf(item) !== 'open') return false;
  const t = new Date();
  const today = t.getFullYear() + '-' + String(t.getMonth()+1).padStart(2,'0') + '-' + String(t.getDate()).padStart(2,'0');
  return d <= today;
}

// One occupied slot per decision — three competing holds must not read as a
// packed afternoon, or the free time they are holding open disappears.
function collapseOptionGroups(items) {
  if (!items || !items.length) return items || [];
  return items.filter(it => { const m = itinMeta(it); return !m.optionGroup || m.isRepresentative === true; });
}

// One row per group, carrying the others for the disclosure.
function groupItineraryOptions(items) {
  if (!items || !items.length) return items || [];
  const byGroup = {};
  items.forEach(it => { const g = optionGroupOf(it); if (g) (byGroup[g] = byGroup[g] || []).push(it); });
  return collapseOptionGroups(items).map(it => {
    const g = optionGroupOf(it);
    return (g && byGroup[g] && byGroup[g].length > 1) ? Object.assign({}, it, { _options: byGroup[g] }) : it;
  });
}

            cursor:'pointer',fontSize:14,padding:'2px 4px'}} title="Delete">✕</button>
        </div>

    </div>
  );
}

function tripDateRange(startDate, endDate) {
  const dates = [];
  const cur = new Date(startDate + 'T12:00:00');

function PackingLitePanel({ tripKey, endDate, packingData, apiUrl, apiToken, onReload }) {
  const [personFilter, setPersonFilter] = useState('all');
  const [adding, setAdding]     = useState(false);
  const [newPerson, setNewPerson]   = useState('shared');
  const [newCat, setNewCat]     = useState('Clothing');
  const [newItem, setNewItem]   = useState('');
  const [generating, setGenerating] = useState(false);
  const [packBusy, setPackBusy] = useState(false);

  if (!packingData || packingData === 'loading') {
    return <div style={{textAlign:'center',color:'#6b7fa8',padding:'24px',fontSize:13}}>Loading packing list…</div>;
  }
  const allItems = packingData.items || [];
  const filtered = personFilter==='all' ? allItems : allItems.filter(i=>i.person===personFilter);
  const byCategory = {};
  filtered.forEach(item => {
    const cat = item.category || 'Other';
    if (!byCategory[cat]) byCategory[cat] = [];
    byCategory[cat].push(item);
  });
  const checkedCount = allItems.filter(i=>i.checked).length;

  async function toggleItem(id, checked) {
    setPackBusy(true);
    try { await apiGet(apiUrl,apiToken,{action:'update_packing_item',id,checked:String(checked)}); await onReload(); }
    catch(e) {} finally { setPackBusy(false); }
  }
  async function deleteItem(id) {
    setPackBusy(true);
    try { await apiGet(apiUrl,apiToken,{action:'delete_packing_item',id}); await onReload(); }
    catch(e) {} finally { setPackBusy(false); }
  }
  async function addItem() {
    if (!newItem.trim()) return;
    setPackBusy(true);
    try {
      await apiGet(apiUrl,apiToken,{action:'add_packing_item',tripKey,person:newPerson,category:newCat,item:newItem.trim()});
      setNewItem(''); setAdding(false); await onReload();
    } catch(e) {} finally { setPackBusy(false); }
  }
  async function generatePacking() {
    if (!window.confirm('Generate AI packing list? VERA\'s unchecked suggestions will be replaced. Checked items and items you added are kept.')) return;
    setGenerating(true);
    try {
      const startDate = tripKey.split('|')[0];
      await apiGet(apiUrl,apiToken,{action:'generate_packing',tripKey,startDate,endDate});
      await onReload();
    } catch(e) {
      // This used to be an empty catch, so a failed generation looked like nothing happened.
      window.alert('Couldn\u2019t generate the packing list: ' + (e && e.message ? e.message : e));
    } finally { setGenerating(false); }
  }

  const personTabs=[{id:'all',label:'All',color:'#8ab4f8'},{id:'ahmed',label:'Ahmed',color:'#5c9eff'},
    {id:'victoria',label:'Victoria',color:'#b87cff'},{id:'shared',label:'Shared',color:'#56cc9d'}];

  return (
    <div style={{paddingTop:8}}>
      <GenInputsBanner kind="packing" tripKey={tripKey} watch={packingData}
        hasList={allItems.some(i => i.source === 'ai')} apiUrl={apiUrl} apiToken={apiToken} />
      <div style={{display:'flex',gap:6,alignItems:'center',flexWrap:'wrap',marginBottom:10}}>
        <div style={{display:'flex',gap:4,flex:1,flexWrap:'wrap'}}>
          {personTabs.map(p => (
            <button key={p.id} onClick={()=>setPersonFilter(p.id)}
              style={{padding:'4px 9px',borderRadius:6,fontSize:11,fontWeight:600,cursor:'pointer',
                border: personFilter===p.id?`1px solid ${p.color}`:'1px solid #2a3a50',
                background: personFilter===p.id?`${p.color}22`:'#0d1117',
                color: personFilter===p.id?p.color:'#6b7fa8'}}>
              {p.label}
            </button>
          ))}
        </div>
        <span style={{fontSize:11,color:'#4d6080'}}>{checkedCount}/{allItems.length} packed</span>
        <button onClick={generatePacking} disabled={generating}
          style={{padding:'4px 9px',borderRadius:6,fontSize:11,cursor:'pointer',
            background:'#0d1a10',border:'1px solid #2a6040',color:'#56cc9d',
            opacity:generating?0.6:1,whiteSpace:'nowrap'}}>
          {generating?'⏳':'✨ Generate'}
        </button>
        <button onClick={()=>setAdding(a=>!a)}
          style={{padding:'4px 9px',borderRadius:6,fontSize:11,cursor:'pointer',
            background:'#0d2040',border:'1px solid #3d6fa0',color:'#5c9eff'}}>
          + Add
        </button>
      </div>

      {adding && (
        <div style={{background:'#0a1628',border:'1px solid #1e3050',borderRadius:8,padding:'10px',marginBottom:10}}>
          <div style={{display:'flex',gap:6,flexWrap:'wrap',marginBottom:6}}>
            <select value={newPerson} onChange={e=>setNewPerson(e.target.value)}
              style={{fontSize:12,background:'#0d1b3e',color:'#c8d4e8',border:'1px solid #2a3a50',borderRadius:6,padding:'4px 6px'}}>
              <option value="ahmed">Ahmed</option><option value="victoria">Victoria</option><option value="shared">Shared</option>
            </select>
            <select value={newCat} onChange={e=>setNewCat(e.target.value)}
              style={{fontSize:12,background:'#0d1b3e',color:'#c8d4e8',border:'1px solid #2a3a50',borderRadius:6,padding:'4px 6px'}}>
              {Object.keys(PACK_CAT_ICON).map(c=><option key={c} value={c}>{c}</option>)}
            </select>
          </div>
          <div style={{display:'flex',gap:6}}>
            <input value={newItem} onChange={e=>setNewItem(e.target.value)} placeholder="Item name…"
              onKeyDown={e=>{if(e.key==='Enter')addItem();if(e.key==='Escape')setAdding(false);}}
              style={{flex:1,fontSize:12,background:'#0d1b3e',color:'#c8d4e8',border:'1px solid #2a3a50',borderRadius:6,padding:'5px 8px'}} />
            <button onClick={addItem} disabled={packBusy||!newItem.trim()}
              style={{padding:'5px 10px',borderRadius:6,fontSize:12,cursor:'pointer',
                background:'#1a3a6c',border:'1px solid #3d6fa0',color:'#5c9eff',
                opacity:(packBusy||!newItem.trim())?0.5:1}}>Add</button>
            <button onClick={()=>setAdding(false)}
              style={{padding:'5px 8px',borderRadius:6,fontSize:12,cursor:'pointer',
                background:'none',border:'1px solid #2a3a50',color:'#6b7fa8'}}>✕</button>
          </div>
        </div>
      )}

      {Object.keys(byCategory).sort().map(cat => (
        <div key={cat} style={{marginBottom:10}}>
          <div style={{fontSize:11,color:'#6b7fa8',fontWeight:600,padding:'3px 0',
            borderBottom:'1px solid #1a2a40',marginBottom:4}}>
            {PACK_CAT_ICON[cat]||'📦'} {cat}
          </div>
          {byCategory[cat].map(item => (
            <div key={item.id} style={{display:'flex',alignItems:'center',gap:8,
              padding:'4px 2px',borderBottom:'1px solid #0a1628'}}>
              <input type="checkbox" checked={!!item.checked}
                onChange={e=>toggleItem(item.id,e.target.checked)}
                style={{cursor:'pointer',accentColor:'#5c9eff',width:14,height:14,flexShrink:0}} />
              <span style={{flex:1,fontSize:12,
                color:item.checked?'#4d6080':'#c8d4e8',
                textDecoration:item.checked?'line-through':'none'}}>
                {item.item}
              </span>
              {item.source==='ai'&&<span style={{fontSize:9,color:'#4d6080'}}>ai</span>}
              <button onClick={()=>deleteItem(item.id)}
                style={{background:'none',border:'none',color:'#4d6080',cursor:'pointer',fontSize:12,padding:'0 2px'}}>🗑</button>
            </div>
          ))}
        </div>
      ))}

      {filtered.length===0&&(
        <div style={{textAlign:'center',color:'#4d6080',padding:'24px 0',fontSize:12,fontStyle:'italic'}}>
          No items yet — use ✨ Generate for AI suggestions or + Add manually.
        </div>
      )}
    </div>
  );
}

// --- ItineraryDayView --------------------------------------------------------
function ItineraryDayView({ trip, itinerary, legs, meta, who, apiUrl, apiToken, busy, onAdd, onEdit, onDelete, onDecide, onReopen }) {
  const items = itinerary?.items || [];
  // One summary drives the day colours and the end-of-day slots, as in the full dashboard.
  const agendaSum = buildTripSummary_({ trip, items, legs, outboundMode: meta?.outboundMode, returnMode: meta?.returnMode });
  const byDate = {};
  items.forEach(item => {
    const d = item.date || '_undated';
    if (!byDate[d]) byDate[d] = [];
    byDate[d].push(item);
  });

  // Generate all dates in the trip range so days show even with no items
  let dates = [];
  if (trip.startDate && trip.endDate) {
    const cur = new Date(trip.startDate + 'T12:00:00');
    const end = new Date(trip.endDate + 'T12:00:00');
    while (cur <= end) {
      dates.push(cur.toISOString().slice(0, 10));
      cur.setDate(cur.getDate() + 1);
    }
    Object.keys(byDate).forEach(d => {
      if (d !== '_undated' && !dates.includes(d)) dates.push(d);
    });
    dates.sort();
  } else {
    dates = Object.keys(byDate).filter(d => d !== '_undated').sort();
  }
  if (byDate['_undated']) dates.push('_undated');

  return (
    <div style={{paddingTop:8}}>
      <TsAgendaToolbar onAdd={onAdd} busy={busy} trip={trip} who={who} apiUrl={apiUrl} apiToken={apiToken} />
      {dates.length === 0 && (
        <div style={{textAlign:'center',color:'#4d6080',padding:'24px 0',fontSize:13}}>
          No itinerary items yet.
        </div>
      )}
      {dates.map((date, idx) => {
        // All-day first, then ascending by clock — same ordering the Summary
        // tab and the full dashboard use, so a day reads identically in all
        // three. This list was previously rendered in whatever order the
        // backend happened to return.
        const dayItems = (byDate[date] || []).slice()
          .sort((a,b)=>(a.startTime||'').localeCompare(b.startTime||''));
        const dayNum = date === '_undated' ? '' : idx + 1;
        const rows = groupItineraryOptions(dayItems);
        const dayBreaks = tsDayBreaks_(rows, legs);
        return (
          <div key={date} id={tsDayId_(trip.tripKey, date)} style={{marginBottom:12,scrollMarginTop:12}}>
            <div className="ts-dayhead" style={{fontSize:12,fontWeight:700,color:'#8ab4f8',padding:'6px 8px',
              background:'#0a1628',borderRadius:6,marginBottom:4,letterSpacing:'0.03em',...tsDayHeadStyle_(agendaSum, date)}}>
              {fmtDayHeader(date, dayNum)}
            </div>
            {dayItems.length === 0 ? (
              <div style={{textAlign:'center',color:'#4d6080',padding:'10px 0',
                fontSize:12,fontStyle:'italic'}}>No events scheduled</div>
            ) : (
              rows.map(item => tsWithBreaks_(dayBreaks[item.id],
                <ItinItemRow key={item.id} item={item}
                  onEdit={() => onEdit(item)}
                  onDelete={() => onDelete(item.id)}
                  onDecide={onDecide}
                  onReopen={onReopen} />
              ))
            )}
            {date !== '_undated' && <TsDayEnd date={date} summary={agendaSum} onAdd={onAdd} busy={busy} />}
          </div>
        );
      })}
    </div>
  );
}

function AddItineraryItemLiteModal({ mode, item, tripKey, tripStartDate, tripEndDate, defaults, onSave, onClose, busy }) {
  const isEdit = mode === 'edit';
  let initMeta = {};
  try { if (isEdit && item?.metadata) initMeta = JSON.parse(item.metadata); } catch(e) {}

  const [type, setType]         = useState(isEdit ? (item?.type||'manual') : (defaults?.type||'manual'));
  const [title, setTitle]       = useState(isEdit ? (item?.title||'') : '');
  const [date, setDate]         = useState(isEdit ? (item?.date||tripStartDate||'') : (defaults?.date||tripStartDate||''));
  const [startTime, setStart]   = useState(isEdit ? (item?.startTime||'') : '');
  const [endTime, setEnd]       = useState(isEdit ? (item?.endTime||'') : '');
  const [location, setLocation] = useState(isEdit ? (item?.location||'') : '');
  const [notes, setNotes]       = useState(isEdit ? (item?.notes||'') : '');
  const [timezone, setTimezone] = useState(initMeta.timezone||'');
  const [airline, setAirline]   = useState(initMeta.airline||'');
  const [flightNum, setFnum]    = useState(initMeta.flightNum||'');
  const [origin, setOrigin]     = useState(initMeta.origin||'');
  const [dest, setDest]         = useState(initMeta.dest||'');
  const [confirm, setConfirm]   = useState(initMeta.confirmation||'');
  const [checkout, setCheckout] = useState(initMeta.checkoutDate||'');
  const [traveler, setTraveler] = useState(initMeta.traveler||'Both');

  function buildMeta() {
    const m = {};
    if (timezone) m.timezone = timezone;
    if (type==='flight') {
      if (airline) m.airline = airline.trim();
      if (flightNum) m.flightNum = flightNum.trim();
      if (origin) m.origin = origin.trim();
      if (dest) m.dest = dest.trim();
      if (confirm) m.confirmation = confirm.trim();
    }
    if (type==='hotel'||type==='cruise'||type==='arranged_stay') {
      if (checkout) m.checkoutDate = checkout;
    }
    if (traveler && traveler !== 'Both') m.traveler = traveler;
    return Object.keys(m).length ? JSON.stringify(m) : '';
  }

  function handleSave() {
    if (!title.trim()) return;
    onSave({ id: item?.id, tripKey, type, title: title.trim(), date,
      startTime, endTime, location: location.trim(), notes: notes.trim(),
      metadata: buildMeta() });
  }

  const inp = (val, set, ph, typ='text') => (
    <input type={typ} value={val} onChange={e=>set(e.target.value)} placeholder={ph}
      style={{width:'100%',boxSizing:'border-box',background:'#0d1b3e',color:'#dde1f0',
        border:'1px solid #2a3a50',borderRadius:6,padding:'7px 10px',fontSize:13}} />
  );

  const isAccom = type==='hotel'||type==='cruise'||type==='arranged_stay';

  return (
    <div onClick={e => e.target===e.currentTarget && onClose()}
      style={{position:'fixed',inset:0,background:'rgba(0,0,0,.7)',display:'flex',
        alignItems:'center',justifyContent:'center',zIndex:1000,padding:'16px'}}>
      <div style={{background:'#0d1117',border:'1px solid #2a3a50',borderRadius:12,
        padding:20,width:'100%',maxWidth:500,maxHeight:'90vh',overflowY:'auto'}}>
        <h2 style={{margin:'0 0 14px',fontSize:16,color:'#dde1f0'}}>
          {isEdit ? '✏️ Edit Itinerary Item' : '+ Add Itinerary Item'}
        </h2>

        {/* Type grid */}
        <div style={{marginBottom:12}}>
          <div style={{fontSize:11,color:'#6b7fa8',marginBottom:6,textTransform:'uppercase',letterSpacing:'0.05em'}}>Type</div>
          <div style={{display:'flex',flexWrap:'wrap',gap:5}}>
            {ITIN_TYPES.map(t => (
              <button key={t} onClick={() => setType(t)} title={t.replace(/_/g,' ')}
                style={{width:34,height:34,borderRadius:7,cursor:'pointer',fontSize:17,
                  border: type===t ? '2px solid #5c9eff' : '2px solid transparent',
                  background: type===t ? '#0d2040' : '#1e2a3a',
                  display:'flex',alignItems:'center',justifyContent:'center'}}>
                {ITIN_TYPE_ICON[t]}
              </button>
            ))}
          </div>
        </div>

        {/* Title */}
        <div style={{marginBottom:10}}>
          <div style={{fontSize:11,color:'#6b7fa8',marginBottom:4,textTransform:'uppercase',letterSpacing:'0.05em'}}>Title *</div>
          {inp(title, setTitle, 'e.g. Hotel Check-In')}
        </div>

        {/* Flight details */}
        {type==='flight' && (
          <div style={{background:'#131e2e',borderRadius:8,padding:'10px 12px',marginBottom:10,border:'1px solid #1e2a3a'}}>
            <div style={{color:'#8ab4f8',fontSize:12,fontWeight:600,marginBottom:8}}>✈ Flight Details (optional)</div>
            <div style={{display:'flex',gap:8,marginBottom:8}}>
              {inp(airline, setAirline, 'Airline (e.g. AA)')}
              {inp(flightNum, setFnum, 'Flight # (e.g. 102)')}
            </div>
            <div style={{display:'flex',gap:8,marginBottom:8}}>
              {inp(origin, setOrigin, 'From (e.g. JFK)')}
              {inp(dest, setDest, 'To (e.g. CDG)')}
            </div>
            {inp(confirm, setConfirm, 'Confirmation code')}
          </div>
        )}

        {/* Hotel/stay checkout */}
        {isAccom && (
          <div style={{background:'#131e2e',borderRadius:8,padding:'10px 12px',marginBottom:10,border:'1px solid #1e2a3a'}}>
            <div style={{color:'#8ab4f8',fontSize:12,fontWeight:600,marginBottom:8}}>
              {type==='cruise' ? '🚢 Cruise Stay' : type==='arranged_stay' ? '🏠 Informal Stay' : '🏨 Hotel Stay'}
            </div>
            <div style={{fontSize:11,color:'#6b7fa8',marginBottom:4}}>
              {type==='cruise' ? 'Disembarkation Date' : type==='arranged_stay' ? 'Departure Date' : 'Departure Date'}
            </div>
            {inp(checkout, setCheckout, '', 'date')}
          </div>
        )}

        {/* Date + time row */}
        <div style={{display:'flex',gap:8,marginBottom:10}}>
          <div style={{flex:2}}>
            <div style={{fontSize:11,color:'#6b7fa8',marginBottom:4,textTransform:'uppercase',letterSpacing:'0.05em'}}>
              {isAccom ? (type==='cruise' ? 'Embarkation' : 'Check-in') : 'Date'}
            </div>
            {inp(date, setDate, '', 'date')}
          </div>
          <div style={{flex:1}}>
            <div style={{fontSize:11,color:'#6b7fa8',marginBottom:4,textTransform:'uppercase',letterSpacing:'0.05em'}}>Start</div>
            {inp(startTime, setStart, '', 'time')}
          </div>
          <div style={{flex:1}}>
            <div style={{fontSize:11,color:'#6b7fa8',marginBottom:4,textTransform:'uppercase',letterSpacing:'0.05em'}}>End</div>
            {inp(endTime, setEnd, '', 'time')}
          </div>
        </div>

        {/* Timezone */}
        <div style={{marginBottom:10}}>
          <div style={{fontSize:11,color:'#6b7fa8',marginBottom:4,textTransform:'uppercase',letterSpacing:'0.05em'}}>Timezone (optional)</div>
          <select value={timezone} onChange={e=>setTimezone(e.target.value)}
            style={{width:'100%',background:'#0d1b3e',color: timezone ? '#dde1f0' : '#6b7fa8',
              border:'1px solid #2a3a50',borderRadius:6,padding:'7px 10px',fontSize:13}}>
            {ITIN_TZ_OPTIONS.map(o => <option key={o.value} value={o.value}>{o.label}</option>)}
          </select>
        </div>

        {/* Location */}
        <div style={{marginBottom:10}}>
          <div style={{fontSize:11,color:'#6b7fa8',marginBottom:4,textTransform:'uppercase',letterSpacing:'0.05em'}}>Location (optional)</div>
          {inp(location, setLocation, 'e.g. Paris, France')}
        </div>

        {/* Notes */}
        <div style={{marginBottom:10}}>
          <div style={{fontSize:11,color:'#6b7fa8',marginBottom:4,textTransform:'uppercase',letterSpacing:'0.05em'}}>Notes (optional)</div>
          {inp(notes, setNotes, '')}
        </div>

        {/* Traveler */}
        <div style={{marginBottom:16}}>
          <div style={{fontSize:11,color:'#6b7fa8',marginBottom:6,textTransform:'uppercase',letterSpacing:'0.05em'}}>Who</div>
          <div style={{display:'flex',gap:6}}>
            {['Ahmed','Victoria','Both'].map(t => {
              const colors = t==='Ahmed' ? {on:'#5c9eff',bg:'#0d2040'} :
                             t==='Victoria' ? {on:'#b87cff',bg:'#1a0d30'} : {on:'#4a9060',bg:'#0d1a10'};
              return (
                <button key={t} onClick={() => setTraveler(t)}
                  style={{flex:1,padding:'6px 0',borderRadius:7,cursor:'pointer',fontSize:12,fontWeight:600,
                    border: traveler===t ? `2px solid ${colors.on}` : '2px solid transparent',
                    background: traveler===t ? colors.bg : '#1e2a3a',
                    color: traveler===t ? colors.on : '#6b7fa8'}}>
                  {t}
                </button>
              );
            })}
          </div>
        </div>

        {/* Actions */}
        <div style={{display:'flex',gap:10,justifyContent:'flex-end'}}>
          <button onClick={onClose}
            style={{padding:'8px 18px',background:'none',border:'1px solid #2a3a50',
              borderRadius:7,color:'#6b7fa8',fontSize:13,cursor:'pointer'}}>
            Cancel
          </button>
          <button onClick={handleSave} disabled={busy || !title.trim()}
            style={{padding:'8px 18px',background:'#1a3a6c',border:'1px solid #3d6fa0',
              borderRadius:7,color:'#5c9eff',fontSize:13,fontWeight:600,cursor:'pointer',
              opacity: (busy || !title.trim()) ? 0.5 : 1}}>
            {isEdit ? 'Save Changes' : 'Add to Itinerary'}
          </button>
        </div>
      </div>
    </div>
  );
}
