        </div>
      )}

      {!event && groupNames.map(g => (
        <div key={g} style={{ marginBottom:18 }}>
          <div style={{ fontSize:11, color:'#6b7280', marginBottom:6, letterSpacing:'0.06em' }}>
            {g.toUpperCase()} · {groups[g].length}
          </div>
          {groups[g].map(h => {
            const members = membersOf(h.id);
            // Split, because a planned row has no date: "last " + m.sent rendered with
            // nothing after it, and counting the two together said a card had gone
            // when it had only been put on a list.
            const allItems  = mailingsOf(h.id);
            const sentItems = allItems.filter(m => abIsSent(m));
            const planItems = allItems.filter(m => !abIsSent(m));
            const isOpen  = !!open[h.id];
            // A confidently wrong address is the real failure of a card list, so an
            // unconfirmed one is worth a quiet marker — not a flag, not an email.
            const staleConfirm = h.addressConfirmed
              ? (new Date().getFullYear() - parseInt(String(h.addressConfirmed).slice(0,4), 10) >= 2)
              : true;
            return (
              <div key={h.id} style={{ background:'#101c33', border:'1px solid #1e3060',
                                       borderRadius:10, padding:12, marginBottom:8 }}>
                <div style={{ display:'flex', alignItems:'flex-start', gap:8, flexWrap:'wrap' }}>
                  <button onClick={() => setOpen(o => Object.assign({}, o, { [h.id]: !o[h.id] }))}
                    style={{ background:'none', border:'none', color:'#8ab4f8', cursor:'pointer',
                             fontSize:14, padding:0, flexShrink:0 }}>
                    {isOpen ? '▾' : '▸'}
                  </button>
                  <div onClick={() => setOpen(o => Object.assign({}, o, { [h.id]: !o[h.id] }))}
                    style={{ flex:1, minWidth:150, cursor:'pointer' }}
                    title={isOpen ? 'Collapse' : 'Open to add people and see what has been sent'}>
                    <div style={{ fontWeight:700, fontSize:14, color:'#dde1f0' }}>
                      {h.household}
                    </div>
                    {abAddressLines(h).map((line, i) => (
                      <div key={i} style={{ fontSize:12, color:'#a0a8c0' }}>{line}</div>
                    ))}
                    {abAddressLines(h).length === 0 && (
                      <div style={{ fontSize:12, color:'#6b5a2a' }}>No address on file</div>
                    )}
                    {h.notes && (
                      <div style={{ fontSize:12, color:'#9aa8c0', marginTop:3, fontStyle:'italic' }}>
                        {h.notes}
                      </div>
                    )}
                    <div style={{ fontSize:11, color:'#4d6080', marginTop:4 }}>
                      {members.length === 0
                        ? <span style={{ color:'#8ab4f8', fontWeight:600 }}>+ Add the names</span>
                        : members.length + (members.length === 1 ? ' person' : ' people')}
                      {sentItems.length
                        ? ' · ' + sentItems.length + (sentItems.length === 1 ? ' mailing' : ' mailings')
                          + ', last ' + sentItems[0].sent
                        : ' · nothing sent yet'}
                      {planItems.length
                        ? ' · ' + planItems.length + ' planned'
                        : ''}
                      {staleConfirm && (
                        <span title="Worth checking this address is still right"
                          style={{ color:'#c9a84c' }}>
                          {' · address ' + (h.addressConfirmed ? 'confirmed ' + h.addressConfirmed : 'never confirmed')}
                        </span>
                      )}
                    </div>
                  </div>
                  <div style={{ display:'flex', gap:6, flexWrap:'wrap' }}>
                    <button onClick={() => write({ action:'confirm_address', id:h.id })} disabled={busy}
                      title="I checked — this address is still right"
                      style={{ background:'none', border:'1px solid #2a3a50', color:'#8ab4f8',
                               borderRadius:6, padding:'3px 9px', fontSize:11, cursor:'pointer' }}>
                      Confirm
                    </button>
                    <button onClick={() => setHhForm(Object.assign({}, h))} disabled={busy}
                      style={{ background:'none', border:'none', color:'#a0a8c0', cursor:'pointer', fontSize:12 }}>✏️</button>
                    <button disabled={busy}
                      onClick={() => {
                        const bits = [];
                        if (members.length)  bits.push(members.length + ' ' + (members.length === 1 ? 'member' : 'members'));
                        if (allItems.length) bits.push(allItems.length + ' ' + (allItems.length === 1 ? 'mailing' : 'mailings'));
                        const msg = bits.length
                          ? 'Delete ' + h.household + ' and its ' + bits.join(' and ') + '?'
                          : 'Delete ' + h.household + '?';
                        if (window.confirm(msg)) write({ action:'delete_household', id:h.id });
                      }}
                      style={{ background:'none', border:'none', color:'#ef4444', cursor:'pointer', fontSize:14 }}>×</button>
                  </div>
                </div>

                {isOpen && (
                  <div style={{ marginTop:10, paddingTop:10, borderTop:'1px solid #1a2a40' }}>
                    {members.length === 0 && (
                      <div style={{ fontSize:12, color:'#4d6080', marginBottom:8 }}>Nobody listed yet.</div>
                    )}
                    {members.map(p => (
                      <div key={p.id} style={{ display:'flex', alignItems:'center', gap:8,
                                               flexWrap:'wrap', marginBottom:5 }}>
                        <span style={{ fontSize:13, color:'#dde1f0' }}>{p.name}</span>
                        {p.memberType === 'Child' && (
                          <span style={{ fontSize:10, color:'#93c5fd', background:'#14243f',
                                         borderRadius:4, padding:'1px 5px' }}>child</span>
                        )}
                        {p.email && <a href={'mailto:' + p.email} style={{ fontSize:12, color:'#8ab4f8' }}>{p.email}</a>}
                        {p.phone && <a href={'tel:' + p.phone} style={{ fontSize:12, color:'#8ab4f8' }}>{p.phone}</a>}
                        {p.notes && <span style={{ fontSize:11, color:'#6b7fa8' }}>{p.notes}</span>}
                        <button onClick={() => setCForm(Object.assign({}, p))} disabled={busy}
                          style={{ background:'none', border:'none', color:'#a0a8c0',
                                   cursor:'pointer', fontSize:11, marginLeft:'auto' }}>✏️</button>
                        <button onClick={() => { if (window.confirm('Remove ' + p.name + '?')) write({ action:'delete_contact', id:p.id }); }}
                          disabled={busy}
                          style={{ background:'none', border:'none', color:'#ef4444', cursor:'pointer', fontSize:13 }}>×</button>
                      </div>
                    ))}
                    <button onClick={() => setCForm(abBlankContact(h.id))} disabled={busy}
                      style={{ background:'none', border:'1px solid #2a3a50', color:'#8ab4f8',
                               borderRadius:6, padding:'3px 10px', fontSize:11, cursor:'pointer', marginTop:4 }}>
                      + Person
                    </button>

                    {/* The full history, which is the thing a single "last sent" column
                        could never hold: every card, not only the most recent. Planned
                        rows sit in the same list, marked — they are the same kind of
                        thing at an earlier stage, not a separate feature. */}
                    {allItems.length > 0 && (
                      <div style={{ marginTop:10, paddingTop:8, borderTop:'1px solid #1a2a40' }}>
                        <div style={{ fontSize:11, color:'#6b7280', marginBottom:4 }}>SENT</div>
                        {planItems.concat(sentItems).map(m => (
                          <div key={m.id} style={{ display:'flex', alignItems:'center', gap:8, marginBottom:3 }}>
                            <span style={{ fontSize:12, color:'#dde1f0' }}>{m.event}</span>
                            <span style={{ fontSize:11, color: abIsSent(m) ? '#a0a8c0' : '#c9a84c' }}>
                              {abIsSent(m) ? m.sent : 'planned'}
                            </span>
                            {m.notes && <span style={{ fontSize:11, color:'#6b7fa8' }}>{m.notes}</span>}
                            <button onClick={() => { if (window.confirm('Remove this ' + m.event + '?')) write({ action:'delete_mailing', id:m.id }); }}
                              disabled={busy} style={{ background:'none', border:'none', color:'#ef4444',
                                                       cursor:'pointer', fontSize:12, marginLeft:'auto' }}>×</button>
                          </div>
                        ))}
                      </div>
                    )}
                  </div>
                )}
              </div>
            );
          })}
        </div>
      ))}

      {hhForm && (
        <AddressBookHouseholdModal form={hhForm} setForm={setHhForm} busy={busy}
          onSave={async f => { if (await write(Object.assign({ action:'save_household' }, f))) setHhForm(null); }} />
      )}
      {cForm && (
        <AddressBookContactModal form={cForm} setForm={setCForm} busy={busy}
          onSave={async f => { if (await write(Object.assign({ action:'save_contact' }, f))) setCForm(null); }} />
      )}
    </div>
  );
}

// ---- CardRunView -------------------------------------------------------------
//
// One event's run. Who is on the list is CARRIED FORWARD FROM HISTORY: a household is
// on it if it has a row for this event at all. Send someone a Christmas card once and
// they are on the list every year after, with no flag anywhere to keep in step — and
// nothing to go stale when somebody edits the sheet by hand.
//
// A row with a date is sent; A ROW WITH A BLANK DATE IS PLANNED — on the list, not
// posted yet. That is what makes a brand-new event keepable: an event exists only as
// the rows filed against it, so with nothing but sent rows allowed, the only way to
// save a new one was to claim a card had already gone. "＋ Add" files the intention,
// "✓ Sent" files the fact, and marking a planned household sent takes over its row
// rather than adding a second.
function CardRunView({ event, households, forEvent, unsentOnly, setUnsentOnly,
                       addingTo, setAddingTo, query, busy, thisYear, write }) {
  const onList = households.filter(h => forEvent(h.id, event).length > 0);

  const sentThisYear = h =>
    forEvent(h.id, event).some(m => abIsSent(m) && String(m.sent).slice(0, 4) === thisYear);
  // The planned row for this household and event, if there is one. At most one can
  // exist: the server takes over a planned row when you mark it sent, and refuses to
  // add a second blank-dated row for the same pair.
  const plannedRow = h => forEvent(h.id, event).filter(m => !abIsSent(m))[0] || null;

  const q = String(query || '').trim().toLowerCase();
  const matches = h => !q || (h.household + ' ' + h.city + ' ' + h.country).toLowerCase().indexOf(q) !== -1;

  const shown = onList.filter(h => {
    if (!matches(h)) return false;
    if (unsentOnly === 'year')  return !sentThisYear(h);
    if (unsentOnly === 'never') return false;   // everyone on the list has had one
    return true;
  });
  const doneCount    = onList.filter(sentThisYear).length;
  const plannedCount = onList.filter(h => !sentThisYear(h) && plannedRow(h)).length;

  // Households that have never had this event — the pool "+ Add someone" draws from.
  const newcomers = households.filter(h => forEvent(h.id, event).length === 0 && matches(h));

  const pill = (on) => ({
    background:'none', border:'1px solid ' + (on ? '#3d5fa0' : '#2a3a50'),
    color: on ? '#8ab4f8' : '#6b7fa8', borderRadius:20, padding:'3px 11px',
    fontSize:11, cursor:'pointer',
  });

  // Ticking sends, un-ticking puts it BACK TO PLANNED rather than off the event.
  // Un-ticking used to delete the row, which undid far more than a mis-click means:
  // the household dropped out of the event altogether and had to be found again in
  // the pool. Taking somebody off an event is its own control, with a confirm.
  function toggle(h) {
    const sent = forEvent(h.id, event)
      .filter(m => abIsSent(m) && String(m.sent).slice(0, 4) === thisYear);
    if (sent.length) {
      write({ action:'save_mailing', id: sent[0].id, householdId:h.id, event: event, planned:true });
    } else {
      write({ action:'save_mailing', householdId:h.id, event: event });
    }
  }

  async function removeFrom(h) {
    const rows = forEvent(h.id, event);
    const sent = rows.filter(abIsSent).length;
    // Named plainly, because this drops the whole history for this event and not
    // just this year's — the one thing the old un-tick did by accident.
    const msg = sent
      ? 'Take ' + h.household + ' off ' + event + '? That removes all ' + sent +
        ' already recorded as sent, not just this year.'
      : 'Take ' + h.household + ' off ' + event + '?';
    if (!window.confirm(msg)) return;
    // Sequential, not a forEach of un-awaited promises: each write reloads the whole
    // book, so firing them together would race the reloads against each other and
    // leave the view showing whichever one happened to land last.
    for (const m of rows) {
      if (!await write({ action:'delete_mailing', id:m.id })) return;  // stop on the first failure
    }
  }

  return (
    <div>
      <div style={{ display:'flex', gap:8, alignItems:'center', flexWrap:'wrap', marginBottom:12 }}>
        <span style={{ fontSize:13, color:'#dde1f0', fontWeight:600 }}>✉️ {event}</span>
        <span style={{ fontSize:12, color:'#6b7fa8' }}>
          {doneCount} sent in {thisYear}
          {plannedCount ? ' · ' + plannedCount + ' planned' : ''}
          {onList.length ? ' · ' + onList.length + ' on the list' : ''}
        </span>
        <button onClick={() => setUnsentOnly('year')}  style={pill(unsentOnly === 'year')}>Not sent in {thisYear}</button>
        <button onClick={() => setUnsentOnly('all')}   style={pill(unsentOnly === 'all')}>Everyone on the list</button>
        <button onClick={() => setAddingTo(!addingTo)} style={pill(addingTo)}>+ Add someone</button>
      </div>

      {/* An event only exists as the rows filed against it, so a name on its own is
          not saved anywhere and will be gone on the next load. Saying so is the
          honest version — and it is one click away from being untrue. */}
      {onList.length === 0 && (
        <div style={{ background:'#2a2410', border:'1px solid #6b5a2a', borderRadius:8,
                      padding:'10px 12px', marginBottom:12, fontSize:13, color:'#e8d9b0' }}>
          Nothing is saved for <strong>{event}</strong> yet. Add the first household
          below and it will be in the dropdown from then on.
        </div>
      )}

      {shown.map(h => {
        const done = sentThisYear(h);
        const pend = !done && !!plannedRow(h);
        const hist = forEvent(h.id, event).filter(abIsSent)
          .sort((a, b) => String(b.sent).localeCompare(String(a.sent)));
        return (
          <div key={h.id} style={{ display:'flex', alignItems:'center', gap:10, padding:'7px 10px',
                                   background:'#101c33', border:'1px solid #1e3060',
                                   borderRadius:8, marginBottom:5 }}>
            <button onClick={() => toggle(h)} disabled={busy}
              title={done ? 'Sent in ' + thisYear + ' — click to put it back to planned'
                          : 'Mark sent today'}
              style={{ width:18, height:18, borderRadius:4, flexShrink:0, cursor:'pointer',
                       border:'2px solid ' + (done ? '#22c55e' : pend ? '#6b5a2a' : '#374151'),
                       background: done ? '#166534' : 'transparent' }}>
              {done ? <span style={{ color:'#86efac', fontSize:11, lineHeight:'14px' }}>✓</span> : null}
            </button>
            <span style={{ fontSize:13, color: done ? '#86efac' : '#dde1f0' }}>{h.household}</span>
            {pend && <span style={{ fontSize:11, color:'#c9a84c' }}>planned</span>}
            <span style={{ fontSize:11, color:'#6b7fa8' }}>
              {hist.length === 0 ? 'never sent'
                : (hist.length === 1 ? 'once' : hist.length + ' times') + ', last ' + hist[0].sent}
            </span>
            <button onClick={() => removeFrom(h)} disabled={busy}
              title={'Take ' + h.household + ' off ' + event}
              style={{ background:'none', border:'none', color:'#ef4444', cursor:'pointer',
                       fontSize:13, marginLeft:'auto' }}>✕</button>
          </div>
        );
      })}

      {unsentOnly === 'year' && onList.length > 0 && shown.length === 0 && (
        <div style={{ color:'#86efac', fontSize:13, textAlign:'center', padding:'20px 0' }}>
          All {onList.length} sent for {thisYear}. 🎉
        </div>
      )}

      {/* Forced open while nothing is on the list, so the banner above never points
          "below" at an empty space. */}
      {(addingTo || onList.length === 0) && (
        <div style={{ marginTop:14, paddingTop:12, borderTop:'1px solid #1a2a40' }}>
          <div style={{ fontSize:11, color:'#6b7280', marginBottom:6 }}>
            NOT ON {event.toUpperCase()} — {newcomers.length}
            {q ? '' : ' · use the search box above to narrow this'}
          </div>
          {newcomers.slice(0, 40).map(h => (
            <div key={h.id} style={{ display:'flex', alignItems:'center', gap:8, padding:'5px 10px' }}>
              {/* Two buttons, because putting somebody on a list and posting their
                  card are different days. With only "+ Sent" the only way to start
                  an event was to claim you had already sent it. */}
              <button onClick={() => write({ action:'save_mailing', householdId:h.id, event: event, planned:true })}
                disabled={busy} title={'Add to ' + event + ' — not sent yet'}
                style={{ background:'none', border:'1px solid #6b5a2a', color:'#e8d9b0',
                         borderRadius:6, padding:'2px 9px', fontSize:11, cursor:'pointer' }}>
                ＋ Add
              </button>
              <button onClick={() => write({ action:'save_mailing', householdId:h.id, event: event })}
                disabled={busy} title="Add and mark sent today"
                style={{ background:'none', border:'1px solid #2a5a3a', color:'#86efac',
                         borderRadius:6, padding:'2px 9px', fontSize:11, cursor:'pointer' }}>
                ✓ Sent
              </button>
              <span style={{ fontSize:13, color:'#dde1f0' }}>{h.household}</span>
              <span style={{ fontSize:11, color:'#4d6080' }}>{h.city}</span>
            </div>
          ))}
          {newcomers.length > 40 && (
            <div style={{ fontSize:11, color:'#4d6080', padding:'4px 10px' }}>
              …and {newcomers.length - 40} more. Narrow with the search box.
            </div>
          )}
        </div>
      )}
    </div>
  );
}

function AddressBookModalShell({ title, children, onClose, onSave, busy, canSave }) {
  return (
    <div style={{ position:'fixed', inset:0, background:'rgba(0,0,0,0.7)', zIndex:1000,
                  display:'flex', alignItems:'center', justifyContent:'center', padding:16 }}>
      <div style={{ background:'#101c33', border:'1px solid #1e3060', borderRadius:12, padding:20,
                    width:'100%', maxWidth:460, maxHeight:'90vh', overflowY:'auto' }}>
        <div style={{ display:'flex', justifyContent:'space-between', alignItems:'center', marginBottom:14 }}>
          <div style={{ fontWeight:700, fontSize:15, color:'#dde1f0' }}>{title}</div>
          <button onClick={onClose} style={{ background:'none', border:'none', color:'#a0a8c0',
                                             fontSize:20, cursor:'pointer' }}>×</button>
        </div>
        {children}
        <div style={{ display:'flex', gap:8, marginTop:16 }}>
          <button onClick={onSave} disabled={busy || !canSave}
            style={{ background:'#8ab4f8', color:'#0d1117', border:'none', borderRadius:6,
                     padding:'7px 16px', fontWeight:600, cursor:'pointer', fontSize:13 }}>Save</button>
          <button onClick={onClose} disabled={busy}
            style={{ background:'none', border:'1px solid #2a3a50', color:'#a0a8c0',
                     borderRadius:6, padding:'7px 16px', cursor:'pointer', fontSize:13 }}>Cancel</button>
        </div>
      </div>
    </div>
  );
}

function AddressBookField({ label, value, onChange, placeholder }) {
  return (
    <label style={{ display:'block', marginBottom:9 }}>
      <div style={{ fontSize:11, color:'#6b7fa8', marginBottom:3 }}>{label}</div>
      <input value={value || ''} placeholder={placeholder || ''} onChange={e => onChange(e.target.value)}
        style={{ width:'100%', boxSizing:'border-box', background:'#0d1a2e', color:'#dde1f0',
                 border:'1px solid #1e3060', borderRadius:6, padding:'6px 9px', fontSize:13 }} />
    </label>
  );
}

function AddressBookHouseholdModal({ form, setForm, onSave, busy }) {
  const set = (k, v) => setForm(prev => Object.assign({}, prev, { [k]: v }));
  return (
    <AddressBookModalShell title={form.id ? 'Edit household' : 'New household'}
      onClose={() => setForm(null)} onSave={() => onSave(form)} busy={busy}
      canSave={!!String(form.household || '').trim()}>
      <AddressBookField label="Household (as it goes on the envelope)" value={form.household}
        onChange={v => set('household', v)} placeholder="The Smith Family" />
      <AddressBookField label="Address line 1" value={form.address1} onChange={v => set('address1', v)} />
      <AddressBookField label="Address line 2" value={form.address2} onChange={v => set('address2', v)} />
      <div style={{ display:'flex', gap:8 }}>
        <div style={{ flex:2 }}><AddressBookField label="City" value={form.city} onChange={v => set('city', v)} /></div>
        <div style={{ flex:1 }}><AddressBookField label="State" value={form.state} onChange={v => set('state', v)} /></div>
        <div style={{ flex:1 }}><AddressBookField label="Postcode" value={form.postalCode} onChange={v => set('postalCode', v)} /></div>
      </div>
      <AddressBookField label="Country" value={form.country} onChange={v => set('country', v)} />
      <label style={{ display:'block', marginBottom:9 }}>
        <div style={{ fontSize:11, color:'#6b7fa8', marginBottom:3 }}>Relationship</div>
        <select value={form.relationship || 'Family'} onChange={e => set('relationship', e.target.value)}
          style={{ width:'100%', background:'#0d1a2e', color:'#dde1f0', border:'1px solid #1e3060',

          {AB_RELATIONSHIPS.map(r => <option key={r}>{r}</option>)}
        </select>
      </label>
      <AddressBookField label="Notes" value={form.notes} onChange={v => set('notes', v)} />
    </AddressBookModalShell>
  );
}

function AddressBookContactModal({ form, setForm, onSave, busy }) {
  const set = (k, v) => setForm(prev => Object.assign({}, prev, { [k]: v }));
  return (
    <AddressBookModalShell title={form.id ? 'Edit person' : 'Add person'}
      onClose={() => setForm(null)} onSave={() => onSave(form)} busy={busy}
      canSave={!!String(form.name || '').trim()}>
      <AddressBookField label="Name" value={form.name} onChange={v => set('name', v)} />

function OverviewLiteTab({ apiUrl, apiToken, shopping, status, onNavigate }) {
  // Each key resolves independently (no Promise.all) so tiles reveal their
  // stat as soon as their own fetch lands, instead of all waiting on the
  // slowest one. undefined = still loading; {} = loaded (possibly errored/empty).
  const [data, setData] = useState({});

  useEffect(() => {
    if (!apiUrl || !apiToken) return;
    setData({});
    const actions = {
      cards: 'cards', coupons: 'get_coupons', rx: 'prescriptions',
      pto: 'pto', bills: 'bills', chores: 'get_chores',
      todaysEvents: 'get_todays_events',
    };
    Object.keys(actions).forEach(key => {
      apiGet(apiUrl, apiToken, { action: actions[key] })
        .then(res => setData(prev => ({ ...prev, [key]: res || {} })))
        .catch(() => setData(prev => ({ ...prev, [key]: {} })));
    });
  }, [apiUrl, apiToken]);

  const _now = new Date();
  const todayDate = _now.getDate();
  // Local calendar date, not toISOString() — that returns UTC, which rolls to
  // tomorrow during the evening in US timezones and would shift every day
  // comparison below (trip in progress, coupon expiry, bill due day) by one.
  const todayStr = _now.getFullYear() + '-' +
    String(_now.getMonth() + 1).padStart(2, '0') + '-' +
    String(_now.getDate()).padStart(2, '0');

  const shoppingPending = (shopping || []).reduce(
    (sum, s) => sum + (s.items || []).filter(i => !i.done).length, 0
  );

  const activeCards = data.cards
    ? (data.cards.cards || []).filter(c => c.active === 'Yes').length : null;

  const couponsExpiringSoon = data.coupons
    ? (data.coupons.coupons || []).filter(c => {
        if (!c.expires) return false;
        const days = Math.round((new Date(c.expires + 'T00:00:00') - new Date(todayStr + 'T00:00:00')) / 86400000);
        return days >= 0 && days <= 3; // mirrors CouponsLiteTab's expiryInfo() "expiring soon" bucket
      }).length
    : null;

  const activeRx = data.rx
    ? (data.rx.prescriptions || []).filter(r => r.active === 'Yes').length : null;

  const trips = data.pto ? (data.pto.ahmedStats && data.pto.ahmedStats.upcomingTravel) || [] : null;
  const nextTrip = trips && trips.length
    ? trips.slice().sort((a, b) => (a.startDate || '').localeCompare(b.startDate || ''))[0]
    : null;
  const nextTripDays = nextTrip && nextTrip.startDate
    ? Math.round((new Date(nextTrip.startDate + 'T12:00:00') - new Date(todayStr + 'T12:00:00')) / 86400000)
    : null;

  // Sheet-native bills due within 5 days, unpaid — mirrors BillTrackerView's
  // dueDay branch. Calendar-only bills aren't merged in here (that merge is
  // fairly involved — see BillTrackerView) to keep this homepage fetch light.
  const billsDueSoon = data.bills
    ? (data.bills.bills || []).filter(b => {
        if (b.paid) return false;
        return b.dueDay != null && (b.dueDay - todayDate) >= 0 && (b.dueDay - todayDate) <= 5;
      }).length
    : null;

  const pendingChores = data.chores
    ? (data.chores.chores || []).filter(c => c.Status !== 'Done').length : null;

  // Active-travel detection, same rule as the main dashboard's HomeTab: a trip
  // that's in progress today, else one departing within the next 24 hours.
  const upcomingTravel = (data.pto && data.pto.ahmedStats && data.pto.ahmedStats.upcomingTravel) || [];
  const activeTrip = upcomingTravel.find(t => todayStr >= t.startDate && todayStr <= t.endDate);
  const imminentTrip = !activeTrip && upcomingTravel.find(t => {
    const diffMs = new Date(t.startDate + 'T00:00:00').getTime() - Date.now();
    return diffMs > 0 && diffMs <= 86400000;
  });
  const displayTrip = activeTrip || imminentTrip;

  const todaysEventsLoading = data.todaysEvents === undefined;
  const todaysEvents = data.todaysEvents ? (data.todaysEvents.events || []) : [];
  const todaysEventsCalendarFound = data.todaysEvents ? data.todaysEvents.calendarFound !== false : true;

  const hour = new Date().getHours();
  const greeting  = hour < 12 ? 'Good morning' : hour < 18 ? 'Good afternoon' : 'Good evening';
  const dateLabel = new Date().toLocaleDateString('en-US', { weekday: 'long', month: 'long', day: 'numeric' });

  const plural = (n, word) => `${n} ${word}${n === 1 ? '' : 's'}`;

  const TILES = [
    { id: 'chat', icon: '💬', label: 'Chat', hasStat: false, sub: 'Ask VERA anything' },
    { id: 'household', icon: '🏠', label: 'Household', hasStat: false, sub: 'Contacts & reference info' },
    {
      id: 'shopping', icon: '🛒', label: 'Shopping', hasStat: true, loading: false, stat: shoppingPending,
      sub: shoppingPending === 0 ? 'Nothing pending' : plural(shoppingPending, 'item') + ' pending',
    },
    {
      id: 'cards', icon: '💳', label: 'Cards', hasStat: true, loading: activeCards == null, stat: activeCards,
      sub: activeCards == null ? '' : plural(activeCards, 'active card'),
    },
    {
      id: 'coupons', icon: '🎟️', label: 'Coupons', hasStat: true, loading: couponsExpiringSoon == null, stat: couponsExpiringSoon,
      sub: couponsExpiringSoon == null ? '' : couponsExpiringSoon === 0 ? 'None expiring soon' : plural(couponsExpiringSoon, 'coupon') + ' expiring soon',
    },
    {
      id: 'prescriptions', icon: '💊', label: 'Prescriptions', hasStat: true, loading: activeRx == null, stat: activeRx,
      sub: activeRx == null ? '' : plural(activeRx, 'active prescription'),
    },
    {
      id: 'travel', icon: '✈️', label: 'Travel', hasStat: true, loading: trips == null, stat: trips ? trips.length : null,
      sub: trips == null ? '' : !nextTrip ? 'No trips planned' : nextTripDays <= 0 ? 'Trip underway' : `Next trip in ${nextTripDays}d`,
    },
    {
      id: 'finances', icon: '💰', label: 'Finances', hasStat: true, loading: billsDueSoon == null, stat: billsDueSoon,
      sub: billsDueSoon == null ? '' : billsDueSoon === 0 ? 'Nothing due soon' : plural(billsDueSoon, 'bill') + ' due soon',
    },
    {
      id: 'home_front', icon: '🏡', label: 'Home Front', hasStat: true, loading: pendingChores == null, stat: pendingChores,
      sub: pendingChores == null ? '' : plural(pendingChores, 'chore') + ' pending',
    },
  ];

  return (
    <div>
      <div style={{ marginBottom: 20 }}>
        <div style={{ fontSize: 20, fontWeight: 800, color: '#dde1f0' }}>{greeting}</div>
        <div style={{ fontSize: 13, color: '#6b7fa8' }}>{dateLabel}</div>
      </div>

      <AriaBookBanner apiUrl={apiUrl} apiToken={apiToken} onNavigate={onNavigate} />

      {displayTrip && (
        <div style={{ marginBottom: 20 }}>
          <ActiveTravelCard
            trip={displayTrip}
            departing={!!imminentTrip}
            apiUrl={apiUrl}
            apiToken={apiToken}
            travelConfig={status && status.travelConfig}
            onViewItinerary={() => onNavigate('travel')}
          />
        </div>
      )}

      {/* Lighter blue fill than the .bento-card tiles below (#0d1b3e) so the
          day's agenda reads as a header, not a tenth tile. The muted text
          colors are lifted to match — the defaults are tuned for the darker
          tile background and go dim on this one. */}
      <div className="bento-card" style={{
        cursor: 'default', marginBottom: 20,
        background: '#16315f', border: '1px solid #2f5ea8',
      }}>
        <div className="bento-card-title" style={{ color: '#a8c5f5' }}>📅 Today</div>
        {todaysEventsLoading ? (
          <div className="bento-card-sub" style={{ marginBottom: 0, color: '#9db0d0' }}>Loading…</div>
        ) : !todaysEventsCalendarFound ? (
          <div className="bento-card-sub" style={{ marginBottom: 0, color: '#9db0d0' }}>Couldn't find the Joint Chaos calendar</div>
        ) : todaysEvents.length === 0 ? (
          <div className="bento-card-sub" style={{ marginBottom: 0, color: '#9db0d0' }}>Nothing on the calendar today</div>
        ) : (
          <div className="bento-card-list">
            {todaysEvents.map((ev, i) => (
              <div key={i} style={{ display: 'flex', alignItems: 'baseline', gap: 8, fontSize: 13 }}>
                <span style={{ color: '#9fc4ff', fontWeight: 600, minWidth: 72, flexShrink: 0 }}>
                  {ev.allDay ? 'All day' : ev.startTime}
                </span>
                <span style={{ color: '#f0f3fa' }}>
                  {ev.title}
                  {ev.location && <span style={{ color: '#9db0d0' }}> · {ev.location}</span>}
                </span>
              </div>
            ))}
          </div>
        )}
      </div>

      <div style={{
        display: 'grid',
        gridTemplateColumns: 'repeat(auto-fill, minmax(170px, 1fr))',
        gap: 14,
      }}>
        {TILES.map(tile => (
          <div key={tile.id} className="bento-card" onClick={() => onNavigate(tile.id)}>
            <div className="bento-card-title">{tile.icon} {tile.label}</div>
            {tile.hasStat && (
              <div className="bento-card-main">{tile.loading ? '…' : tile.stat}</div>
            )}
            <div className="bento-card-sub">{tile.hasStat && tile.loading ? 'Loading…' : tile.sub}</div>
          </div>
        ))}
      </div>

      {/* The roster: VERA's link here goes to the full dashboard. */}
      <div style={{ marginTop: 20 }}>
        <VeraRoster links={status && status.rosterLinks} veraHref="./" />
      </div>
    </div>
  );
}

function App() {
  const [apiUrl,       setApiUrl]       = useState(() => stored('vera_url'));
  const [apiToken,     setApiToken]     = useState(() => stored('vera_token'));
  const [showSettings, setShowSettings] = useState(() => !stored('vera_url'));
  const [activeTab,       setActiveTab]       = useState('overview');
  const [activeFinanceTab, setActiveFinanceTab] = useState('fin_summary');
  const [shopping,     setShopping]     = useState([]);
  const [busy,         setBusy]         = useState(false);
  const [error,        setError]        = useState(null);
  const [addItemModal, setAddItemModal] = useState(false);
  const [toast,        setToast]        = useState(null);
  const [status,       setStatus]       = useState(null);
  const toastTimer = useRef(null);

  function showToast(msg, isError) {
    setToast({ msg, isError: !!isError });
    if (toastTimer.current) clearTimeout(toastTimer.current);
    toastTimer.current = setTimeout(() => setToast(null), 3000);
  }

  async function loadShopping(url, token) {
    if (!url || !token) return;
    try {
      const data = await apiGet(url, token, { action: 'shopping' });
      setShopping(data.stores || []);
      setError(null);
    } catch (err) {
      setError(err.message);
    }
  }

  async function loadStatus(url, token) {
    if (!url || !token) return;
    try {
      const data = await apiGet(url, token, { action: 'status' });
      setStatus(data);
    } catch (err) {
      // Feature flags default to enabled; a failed status fetch just
      // means everything stays visible, so no error banner needed here.
    }
  }

  useEffect(() => {
    if (apiUrl && apiToken) {
      loadShopping(apiUrl, apiToken);
      loadStatus(apiUrl, apiToken);
    }
  }, [apiUrl, apiToken]);

  async function handleToggle(tabId, itemIndex, currentlyDone) {
    // Optimistic update
    setShopping(prev => prev.map(store =>
      store.tabId !== tabId ? store : {
        ...store,
        items: store.items.map(item =>
          item.index !== itemIndex ? item : { ...item, done: !currentlyDone }
        ),
      }
    ));
    try {
      await apiAction(apiUrl, apiToken, 'shopping_toggle', { tabId, index: itemIndex });
    } catch (err) {
      setError('Could not update item: ' + err.message);
      await loadShopping(apiUrl, apiToken); // revert on error
    }
  }

  async function handleAdd(tabId, text) {
    setBusy(true);
    try {
      await apiAction(apiUrl, apiToken, 'shopping_add', { tabId, text });
      showToast('✓ Item added');
      setAddItemModal(false);
      await loadShopping(apiUrl, apiToken);
    } catch (err) {
      setError('Could not add item: ' + err.message);
    }
    setBusy(false);
  }

  async function handleDeleteShoppingItem(tabId, itemIndex) {
    // Optimistic removal
    setShopping(prev => prev.map(store =>
      store.tabId !== tabId ? store : {
        ...store,
        items: store.items.filter(item => item.index !== itemIndex),
      }
    ));
    try {
      await apiAction(apiUrl, apiToken, 'shopping_delete', { tabId, index: itemIndex });
    } catch (err) {
      setError('Could not delete item: ' + err.message);
      await loadShopping(apiUrl, apiToken); // revert
    }
  }

  async function handleUpdateShoppingItem(tabId, itemIndex, newText) {
    // Optimistic update
    setShopping(prev => prev.map(store =>
      store.tabId !== tabId ? store : {
        ...store,
        items: store.items.map(item =>
          item.index !== itemIndex ? item : { ...item, text: newText }
        ),
      }
    ));
    try {
      await apiAction(apiUrl, apiToken, 'shopping_update', { tabId, index: itemIndex, text: newText });
    } catch (err) {
      setError('Could not update item: ' + err.message);
      await loadShopping(apiUrl, apiToken); // revert
    }
  }

  async function handleLogRun(storeTabId, itemTexts) {
    setBusy(true);
    try {
      await apiAction(apiUrl, apiToken, 'log_purchase_run', {
        storeId: storeTabId,
        items: JSON.stringify(itemTexts),
      });
      showToast('✓ Logged ' + itemTexts.length + ' item(s) to Purchase History');
    } catch (err) {
      showToast('⚠️ Log Run failed: ' + err.message, true);
    }
    setBusy(false);
  }

  return (
    <>
      {/* Header */}
      <div className="header">
        <div className="logo">
          <span className="logo-name">VERA</span>
          <span className="logo-sub">Dashboard</span>
        </div>
        <div className="header-actions">
          <button
            className="btn btn-refresh"
            onClick={() => {
              // Hard refresh, matching the full dashboard's header button.
              //
              // This used to call loadShopping() alone — a leftover from when
              // this page was just the shopping list. It now has ~28 loaders,
              // so the button was refreshing one panel out of 28 while looking
              // like it refreshed everything.
              //
              // A plain reload() can still serve a stale cached bundle on
              // mobile browsers (Safari especially), which is the case that
              // matters most here since this is the phone view. Making the URL
              // "new" with a cache-busting param forces a real network fetch.
              // Credentials live in localStorage, so the reload keeps the
              // connection; searchParams.set replaces rather than appends, so
              // the param never accumulates.
              const u = new URL(window.location.href);
              u.searchParams.set('_r', Date.now());
              window.location.href = u.toString();
            }}
            title="Hard refresh — reload the page and every panel, bypassing the cache"
          >
            ↺
          </button>
          <button
            className="btn-settings"
            onClick={() => setShowSettings(true)}
            title="Settings"
          >
            ⚙
          </button>
        </div>
      </div>

      {/* Tab bar */}
      <div style={{
        background: '#0a1428',
        borderBottom: '1px solid #1e3060',
        display: 'flex',
        gap: 0,
        overflowX: 'auto',
        padding: '0 28px',
      }}>
        {TOP_TABS.map(tab => (
          <button
            key={tab.id}
            disabled={!!tab.disabled}
            onClick={() => !tab.disabled && setActiveTab(tab.id)}
            style={{
              background: 'none',
              border: 'none',
              borderBottom: activeTab === tab.id ? '2px solid #c9a84c' : '2px solid transparent',
              color: tab.disabled ? '#2a3a5e' : activeTab === tab.id ? '#c9a84c' : '#8a9abf',
              cursor: tab.disabled ? 'not-allowed' : 'pointer',
              fontSize: 13,
              fontWeight: 600,
              padding: '12px 16px',
              whiteSpace: 'nowrap',
            }}
          >
            {tab.label}
          </button>
        ))}
      </div>

      {/* Main content */}
      <div style={{ maxWidth: 800, margin: '0 auto', padding: '24px 28px' }}>
        {error && (
          <div className="error-banner">
            <span>{error}</span>
            <button className="error-dismiss" onClick={() => setError(null)}>✕</button>
          </div>
        )}

        {activeTab === 'overview' && (
          <OverviewLiteTab
            apiUrl={apiUrl}
            apiToken={apiToken}
            shopping={shopping}
            status={status}
            onNavigate={setActiveTab}
          />
        )}

        {activeTab === 'people' && (
          <AddressBookView apiUrl={apiUrl} apiToken={apiToken} />
        )}

        {activeTab === 'wishlists' && (
          <WishListsView apiUrl={apiUrl} apiToken={apiToken} />
        )}

        {activeTab === 'chat' && (
          <ChatLiteView apiUrl={apiUrl} apiToken={apiToken} />
        )}

        {activeTab === 'shopping' && (
          <ShoppingTab
            stores={shopping}
            onToggle={handleToggle}
            onAddItem={(storeId) => setAddItemModal(storeId || true)}
            onDelete={handleDeleteShoppingItem}
            onEdit={handleUpdateShoppingItem}
            onLogRun={handleLogRun}
            busy={busy}
          />
        )}

        {activeTab === 'prescriptions' && (
          <PrescriptionsTab apiUrl={apiUrl} apiToken={apiToken} />
        )}

        {activeTab === 'cards' && (
          <CardsTab apiUrl={apiUrl} apiToken={apiToken} />
        )}

        {activeTab === 'coupons' && (
          <CouponsLiteTab apiUrl={apiUrl} apiToken={apiToken} />
        )}

        {activeTab === 'home_front' && (
          <HomeFrontLiteTab apiUrl={apiUrl} apiToken={apiToken} features={status && status.features} />
        )}

        {activeTab === 'household' && (
          <HouseholdLiteTab apiUrl={apiUrl} apiToken={apiToken} />
        )}

        {activeTab === 'projects' && (
          <ProjectsLiteTab apiUrl={apiUrl} apiToken={apiToken} />
        )}

        {activeTab === 'travel' && (
          <TravelLiteTab apiUrl={apiUrl} apiToken={apiToken} />
        )}

        {activeTab === 'finances' && (
          <div>
            <div style={{ display:'flex', gap:8, marginBottom:20, flexWrap:'wrap' }}>
              {FINANCE_TABS.map(t => (
                <button key={t.id}
                  className={'subtab-btn' + (activeFinanceTab === t.id ? ' active' : '')}
                  onClick={() => setActiveFinanceTab(t.id)}>
                  {t.label}
                </button>
              ))}
            </div>
            {activeFinanceTab === 'fin_summary' && <FinSummaryLiteTab apiUrl={apiUrl} apiToken={apiToken} />}
            {activeFinanceTab === 'fin_budget'  && <FinBudgetLiteTab  apiUrl={apiUrl} apiToken={apiToken} />}
            {activeFinanceTab === 'fin_bills'    && <FinBillsLiteTab    apiUrl={apiUrl} apiToken={apiToken} />}
            {activeFinanceTab === 'fin_cashflow' && <FinCashflowLiteTab apiUrl={apiUrl} apiToken={apiToken} />}
            {activeFinanceTab === 'fin_accounts'  && <FinAccountsLiteTab  apiUrl={apiUrl} apiToken={apiToken} />}
            {activeFinanceTab === 'fin_contracts' && <FinContractsLiteTab apiUrl={apiUrl} apiToken={apiToken} />}
            {activeFinanceTab === 'fin_goals'     && <FinGoalsLiteTab     apiUrl={apiUrl} apiToken={apiToken} />}
            {activeFinanceTab === 'tax'         && <TaxTab            apiUrl={apiUrl} apiToken={apiToken} />}
            {activeFinanceTab === 'fin_networth' && <NetWorthTab apiUrl={apiUrl} apiToken={apiToken} />}
          </div>
        )}
      </div>

      {/* Settings modal */}
      {showSettings && (
        <SettingsModal
          initial={{ url: apiUrl, token: apiToken }}
          onSave={(u, t) => {
            setApiUrl(u);
            setApiToken(t);
            setShowSettings(false);
            loadShopping(u, t);
          }}
          onClose={apiUrl ? () => setShowSettings(false) : null}
        />
      )}

      {/* Add item modal */}
      {addItemModal && shopping.length > 0 && (
        <AddItemModal
          stores={shopping}
          onSave={handleAdd}
          onClose={() => setAddItemModal(false)}
          busy={busy}
          initialStore={typeof addItemModal === 'string' ? addItemModal : undefined}
        />
      )}

      {/* Toast */}
      {toast && (
        <div className={`toast${toast.isError ? ' error' : ''}`}>
          {toast.msg}
        </div>
      )}
    </>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
