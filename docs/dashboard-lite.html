  const [timezone, setTimezone] = useState(initMeta.timezone||'');
  const [airline, setAirline]   = useState(initMeta.airline||'');
  const [flightNum, setFnum]    = useState(initMeta.flightNum||'');
  const [origin, setOrigin]     = useState(initMeta.origin||'');
  const [dest, setDest]         = useState(initMeta.dest||'');
  const [confirm, setConfirm]   = useState(initMeta.confirmation||'');
  const [checkout, setCheckout] = useState(initMeta.checkoutDate||'');
  const [traveler, setTraveler] = useState(initMeta.traveler||'Both');

  function buildMeta() {
    const m = {};
    if (timezone) m.timezone = timezone;
    if (type==='flight') {
      if (airline) m.airline = airline.trim();
      if (flightNum) m.flightNum = flightNum.trim();
      if (origin) m.origin = origin.trim();
      if (dest) m.dest = dest.trim();
      if (confirm) m.confirmation = confirm.trim();
    }
    if (type==='hotel'||type==='cruise'||type==='arranged_stay') {
      if (checkout) m.checkoutDate = checkout;
    }
    if (traveler && traveler !== 'Both') m.traveler = traveler;
    return Object.keys(m).length ? JSON.stringify(m) : '';
  }

  function handleSave() {
    if (!title.trim()) return;
    onSave({ id: item?.id, tripKey, type, title: title.trim(), date,
      startTime, endTime, location: location.trim(), notes: notes.trim(),
      metadata: buildMeta() });
  }

  const inp = (val, set, ph, typ='text') => (
    <input type={typ} value={val} onChange={e=>set(e.target.value)} placeholder={ph}
      style={{width:'100%',boxSizing:'border-box',background:'#0d1b3e',color:'#dde1f0',
        border:'1px solid #2a3a50',borderRadius:6,padding:'7px 10px',fontSize:13}} />
  );

  const isAccom = type==='hotel'||type==='cruise'||type==='arranged_stay';

  return (
    <div onClick={e => e.target===e.currentTarget && onClose()}
      style={{position:'fixed',inset:0,background:'rgba(0,0,0,.7)',display:'flex',
        alignItems:'center',justifyContent:'center',zIndex:1000,padding:'16px'}}>
      <div style={{background:'#0d1117',border:'1px solid #2a3a50',borderRadius:12,
        padding:20,width:'100%',maxWidth:500,maxHeight:'90vh',overflowY:'auto'}}>
        <h2 style={{margin:'0 0 14px',fontSize:16,color:'#dde1f0'}}>
          {isEdit ? '✏️ Edit Itinerary Item' : '+ Add Itinerary Item'}
        </h2>

        {/* Type grid */}
        <div style={{marginBottom:12}}>
          <div style={{fontSize:11,color:'#6b7fa8',marginBottom:6,textTransform:'uppercase',letterSpacing:'0.05em'}}>Type</div>
          <div style={{display:'flex',flexWrap:'wrap',gap:5}}>
            {ITIN_TYPES.map(t => (
              <button key={t} onClick={() => setType(t)} title={t.replace(/_/g,' ')}
                style={{width:34,height:34,borderRadius:7,cursor:'pointer',fontSize:17,
                  border: type===t ? '2px solid #5c9eff' : '2px solid transparent',
                  background: type===t ? '#0d2040' : '#1e2a3a',
                  display:'flex',alignItems:'center',justifyContent:'center'}}>
                {ITIN_TYPE_ICON[t]}
              </button>
            ))}
          </div>
        </div>

        {/* Title */}
        <div style={{marginBottom:10}}>
          <div style={{fontSize:11,color:'#6b7fa8',marginBottom:4,textTransform:'uppercase',letterSpacing:'0.05em'}}>Title *</div>
          {inp(title, setTitle, 'e.g. Hotel Check-In')}
        </div>

        {/* Flight details */}
        {type==='flight' && (
          <div style={{background:'#131e2e',borderRadius:8,padding:'10px 12px',marginBottom:10,border:'1px solid #1e2a3a'}}>
            <div style={{color:'#8ab4f8',fontSize:12,fontWeight:600,marginBottom:8}}>✈ Flight Details (optional)</div>
            <div style={{display:'flex',gap:8,marginBottom:8}}>
              {inp(airline, setAirline, 'Airline (e.g. AA)')}
              {inp(flightNum, setFnum, 'Flight # (e.g. 102)')}
            </div>
            <div style={{display:'flex',gap:8,marginBottom:8}}>
              {inp(origin, setOrigin, 'From (e.g. JFK)')}
              {inp(dest, setDest, 'To (e.g. CDG)')}
            </div>
            {inp(confirm, setConfirm, 'Confirmation code')}
          </div>
        )}

        {/* Hotel/stay checkout */}
        {isAccom && (
          <div style={{background:'#131e2e',borderRadius:8,padding:'10px 12px',marginBottom:10,border:'1px solid #1e2a3a'}}>
            <div style={{color:'#8ab4f8',fontSize:12,fontWeight:600,marginBottom:8}}>
              {type==='cruise' ? '🚢 Cruise Stay' : type==='arranged_stay' ? '🏠 Informal Stay' : '🏨 Hotel Stay'}
            </div>
            <div style={{fontSize:11,color:'#6b7fa8',marginBottom:4}}>
              {type==='cruise' ? 'Disembarkation Date' : type==='arranged_stay' ? 'Departure Date' : 'Departure Date'}
            </div>
            {inp(checkout, setCheckout, '', 'date')}
          </div>
        )}

        {/* Date + time row */}
        <div style={{display:'flex',gap:8,marginBottom:10}}>
          <div style={{flex:2}}>
            <div style={{fontSize:11,color:'#6b7fa8',marginBottom:4,textTransform:'uppercase',letterSpacing:'0.05em'}}>
              {isAccom ? (type==='cruise' ? 'Embarkation' : 'Check-in') : 'Date'}
            </div>
            {inp(date, setDate, '', 'date')}
          </div>
          <div style={{flex:1}}>
            <div style={{fontSize:11,color:'#6b7fa8',marginBottom:4,textTransform:'uppercase',letterSpacing:'0.05em'}}>Start</div>
            {inp(startTime, setStart, '', 'time')}
          </div>
          <div style={{flex:1}}>
            <div style={{fontSize:11,color:'#6b7fa8',marginBottom:4,textTransform:'uppercase',letterSpacing:'0.05em'}}>End</div>
            {inp(endTime, setEnd, '', 'time')}
          </div>
        </div>

        {/* Timezone */}
        <div style={{marginBottom:10}}>
          <div style={{fontSize:11,color:'#6b7fa8',marginBottom:4,textTransform:'uppercase',letterSpacing:'0.05em'}}>Timezone (optional)</div>
          <select value={timezone} onChange={e=>setTimezone(e.target.value)}
            style={{width:'100%',background:'#0d1b3e',color: timezone ? '#dde1f0' : '#6b7fa8',
              border:'1px solid #2a3a50',borderRadius:6,padding:'7px 10px',fontSize:13}}>
            {ITIN_TZ_OPTIONS.map(o => <option key={o.value} value={o.value}>{o.label}</option>)}
          </select>
        </div>

        {/* Location */}
        <div style={{marginBottom:10}}>
          <div style={{fontSize:11,color:'#6b7fa8',marginBottom:4,textTransform:'uppercase',letterSpacing:'0.05em'}}>Location (optional)</div>
          {inp(location, setLocation, 'e.g. Paris, France')}
        </div>

        {/* Notes */}
        <div style={{marginBottom:10}}>
          <div style={{fontSize:11,color:'#6b7fa8',marginBottom:4,textTransform:'uppercase',letterSpacing:'0.05em'}}>Notes (optional)</div>
          {inp(notes, setNotes, '')}
        </div>

        {/* Traveler */}
        <div style={{marginBottom:16}}>
          <div style={{fontSize:11,color:'#6b7fa8',marginBottom:6,textTransform:'uppercase',letterSpacing:'0.05em'}}>Who</div>
          <div style={{display:'flex',gap:6}}>
            {['Ahmed','Victoria','Both'].map(t => {
              const colors = t==='Ahmed' ? {on:'#5c9eff',bg:'#0d2040'} :
                             t==='Victoria' ? {on:'#b87cff',bg:'#1a0d30'} : {on:'#4a9060',bg:'#0d1a10'};
              return (
                <button key={t} onClick={() => setTraveler(t)}
                  style={{flex:1,padding:'6px 0',borderRadius:7,cursor:'pointer',fontSize:12,fontWeight:600,
                    border: traveler===t ? `2px solid ${colors.on}` : '2px solid transparent',
                    background: traveler===t ? colors.bg : '#1e2a3a',
                    color: traveler===t ? colors.on : '#6b7fa8'}}>
                  {t}
                </button>
              );
            })}
          </div>
        </div>

        {/* Actions */}
        <div style={{display:'flex',gap:10,justifyContent:'flex-end'}}>
          <button onClick={onClose}
            style={{padding:'8px 18px',background:'none',border:'1px solid #2a3a50',
              borderRadius:7,color:'#6b7fa8',fontSize:13,cursor:'pointer'}}>
            Cancel
          </button>
          <button onClick={handleSave} disabled={busy || !title.trim()}
            style={{padding:'8px 18px',background:'#1a3a6c',border:'1px solid #3d6fa0',
              borderRadius:7,color:'#5c9eff',fontSize:13,fontWeight:600,cursor:'pointer',
              opacity: (busy || !title.trim()) ? 0.5 : 1}}>
            {isEdit ? 'Save Changes' : 'Add to Itinerary'}
          </button>
        </div>
      </div>
    </div>
  );
}

function TravelLiteTab({ apiUrl, apiToken }) {
  const [pto, setPto]               = useState(null);
  const [ptoLoading, setPtoLoading] = useState(false);
  const [itineraries, setItineraries]   = useState({});
  const [tripMetas, setTripMetas]       = useState({});
  const [packingData, setPackingData]   = useState({});
  const [flightInsights, setFlightInsights] = useState({});
  const [tripTabs, setTripTabs]         = useState({});
  const [travelerFilters, setTravelerFilters] = useState({});
  const [expanded, setExpanded]     = useState(new Set());
  const [modal, setModal]           = useState(null);
  const [busy, setBusy]             = useState(false);
  const [error, setError]           = useState(null);

  const trips = pto?.ahmedStats?.upcomingTravel || [];

  useEffect(() => {
    if (!apiUrl || !apiToken || pto) return;
    setPtoLoading(true);
    apiGet(apiUrl, apiToken, { action:'pto' })
      .then(d => { setPto(d); setPtoLoading(false); })
      .catch(() => { setPtoLoading(false); });
  }, [apiUrl, apiToken]);

  async function loadItinerary(tripKey, startDate, endDate) {
    setItineraries(prev => ({ ...prev, [tripKey]:'loading' }));
    try {
      const data = await apiGet(apiUrl, apiToken, { action:'itinerary', tripKey, startDate, endDate });
      setItineraries(prev => ({ ...prev, [tripKey]:data }));
      loadFlightInsights(tripKey, data.items || []);
    } catch(e) {
      setItineraries(prev => ({ ...prev, [tripKey]:{ items:[] } }));
      setError('Could not load itinerary: ' + (e.message || 'API error'));
    }
  }

  async function loadTripMeta(tripKey) {
    setTripMetas(prev => ({ ...prev, [tripKey]:'loading' }));
    try {
      const data = await apiGet(apiUrl, apiToken, { action:'get_trip_meta', tripKey });
      setTripMetas(prev => ({ ...prev, [tripKey]:data }));
      if (data.traveler) setTravelerFilters(prev => ({ ...prev, [tripKey]:data.traveler }));
    } catch(e) {
      setTripMetas(prev => ({ ...prev, [tripKey]:{} }));
    }
  }

  async function loadPacking(tripKey) {
    setPackingData(prev => ({ ...prev, [tripKey]:'loading' }));
    try {
      const data = await apiGet(apiUrl, apiToken, { action:'get_packing', tripKey });
      setPackingData(prev => ({ ...prev, [tripKey]:data }));
    } catch(e) {
      setPackingData(prev => ({ ...prev, [tripKey]:{ items:[] } }));
    }
  }

  async function loadFlightInsights(tripKey, items) {
    if (!items || !items.length) return;
    const fl = items.filter(i => i.type==='flight' && !i._synthetic)
      .sort((a,b) => a.date.localeCompare(b.date)||(a.startTime||'').localeCompare(b.startTime||''))[0];
    if (!fl) return;
    let meta = {};
    try { meta = JSON.parse(fl.metadata||'{}'); } catch(e) {}
    const titleCodes = (fl.title||'').match(/\b([A-Z]{3})\b/g) || [];
    const locCodes   = (fl.location||'').match(/\b([A-Z]{3})\b/g) || [];
    const origin = meta.origin || locCodes[0] || titleCodes[0] || '';
    const dest   = meta.dest   || (locCodes.length>1 ? locCodes[locCodes.length-1] : '')
                               || (titleCodes.length>1 ? titleCodes[titleCodes.length-1] : '');
    if (!origin && !dest) return;
    try {
      const r = await apiGet(apiUrl, apiToken, {
        action:'get_flight_insights', origin, dest,
        depTime:fl.startTime||'', arrTime:fl.endTime||'', flightDate:fl.date||''
      });
      if (r?.ok && r.insights) setFlightInsights(prev => ({ ...prev, [tripKey]:r.insights }));
    } catch(e) {}
  }

  async function refreshItin(tripKey) {
    const trip = trips.find(t => `${t.startDate}|${t.label}` === tripKey);
    if (!trip) return;
    const data = await apiGet(apiUrl, apiToken, { action:'itinerary', tripKey, startDate:trip.startDate, endDate:trip.endDate });
    setItineraries(prev => ({ ...prev, [tripKey]:data }));
  }

  function toggleTrip(tripKey, trip) {
    const wasOpen = expanded.has(tripKey);
    setExpanded(prev => {
      const next = new Set(prev);
      if (next.has(tripKey)) next.delete(tripKey); else next.add(tripKey);
      return next;
    });
    if (!wasOpen) {
      if (!itineraries[tripKey]) loadItinerary(tripKey, trip.startDate, trip.endDate);
      if (!tripMetas[tripKey])   loadTripMeta(tripKey);
    }
  }

  function setTripTab(tripKey, tab) {
    setTripTabs(prev => ({ ...prev, [tripKey]:tab }));
    if (tab === 'packing' && !packingData[tripKey]) loadPacking(tripKey);
  }

  async function handleSetTraveler(tripKey, traveler) {
    setTravelerFilters(prev => ({ ...prev, [tripKey]:traveler }));
    const meta = (tripMetas[tripKey] && tripMetas[tripKey]!=='loading') ? tripMetas[tripKey] : {};
    try {
      await apiGet(apiUrl, apiToken, { action:'set_trip_meta', tripKey,
        context:meta.context||'', notes:meta.notes||'', traveler });
      setTripMetas(prev => ({ ...prev, [tripKey]:{ ...meta, traveler } }));
    } catch(e) {}
  }

  async function handleSave(params) {
    setBusy(true); setError(null);
    try {
      await apiGet(apiUrl, apiToken, { action: params.id ? 'update_itinerary_item' : 'add_itinerary_item', ...params });
      setModal(null);
      await refreshItin(params.tripKey);
    } catch(e) { setError(e.message || 'Could not save item'); }
    setBusy(false);
  }

  async function handleDelete(id, tripKey) {
    if (!window.confirm('Delete this itinerary item?')) return;
    setBusy(true);
    try { await apiGet(apiUrl, apiToken, { action:'delete_itinerary_item', id }); await refreshItin(tripKey); }
    catch(e) { setError(e.message || 'Could not delete item'); }
    setBusy(false);
  }

  if (!apiUrl || !apiToken)
    return <div style={{textAlign:'center',color:'#4d6080',padding:'40px 20px',fontSize:14}}>Configure your API URL and token in settings.</div>;
  if (ptoLoading)
    return <div style={{textAlign:'center',color:'#6b7fa8',padding:'40px 20px',fontSize:14}}>Loading trips…</div>;

  return (
    <div style={{padding:'0 0 40px'}}>
      {error && (
        <div style={{background:'#2a0d0d',border:'1px solid #7a2020',borderRadius:8,
          padding:'10px 14px',marginBottom:12,color:'#f87171',fontSize:13}}>
          ⚠️ {error}
          <button onClick={()=>setError(null)} style={{float:'right',background:'none',border:'none',
            color:'#f87171',cursor:'pointer',fontSize:14}}>✕</button>
        </div>
      )}

      {trips.length === 0 ? (
        <div style={{textAlign:'center',padding:'60px 20px'}}>
          <div style={{fontSize:40,marginBottom:12}}>✈️</div>
          <div style={{color:'#6b7fa8',fontSize:14}}>No upcoming trips found.</div>
          <div style={{color:'#4d6080',fontSize:12,marginTop:8}}>Add multi-day travel events to your calendar to see them here.</div>
        </div>
      ) : trips.map(t => {
        const tripKey = `${t.startDate}|${t.label}`;
        const isOpen  = expanded.has(tripKey);
        const tripData = itineraries[tripKey];
        const isItinLoading = !tripData || tripData === 'loading';
        const meta = (tripMetas[tripKey] && tripMetas[tripKey]!=='loading') ? tripMetas[tripKey] : null;
        const activeTab = tripTabs[tripKey] || 'agenda';
        const traveler  = travelerFilters[tripKey] || 'Both';
        const ctxColor  = (meta?.context && CONTEXT_COLORS[meta.context]) || null;

        const filteredItin = (tripData && tripData.items) ? {
          ...tripData,
          items: tripData.items.filter(item => {
            if (traveler==='Both') return true;
            try { const m=JSON.parse(item.metadata||'{}'); const tv=m.traveler||'Both'; return tv==='Both'||tv===traveler; }
            catch(e) { return true; }
          })
        } : tripData;

        return (
          <div key={tripKey} style={{marginBottom:10,border:'1px solid #2a3a50',borderRadius:10,overflow:'hidden'}}>
            {/* Trip header */}
            <div onClick={()=>toggleTrip(tripKey,t)}
              style={{display:'flex',alignItems:'center',gap:12,padding:'13px 16px',
                background:isOpen?'#131e2e':'#0d1117',cursor:'pointer',userSelect:'none',transition:'background .15s'}}>
              <div style={{flex:1}}>
                <div style={{fontWeight:700,fontSize:15,color:'#dde1f0'}}>{t.label}</div>
                <div style={{fontSize:12,color:'#6b7fa8',marginTop:2}}>{t.startDate} – {t.endDate}</div>
              </div>
              <DaysAwayChip daysAway={t.daysAway} />
              <div style={{fontSize:16,color:'#8ab4f8',lineHeight:1,
                transform:isOpen?'rotate(180deg)':'rotate(0deg)',transition:'transform .2s'}}>▾</div>
            </div>

            {/* Expanded body */}
            {isOpen && (
              <div style={{background:'#0d1117',borderTop:'1px solid #2a3a50'}}>

                {/* Context tag + travel mode + traveler selector */}
                <div style={{padding:'10px 16px 0',display:'flex',gap:8,alignItems:'center',flexWrap:'wrap'}}>
                  {meta?.context && (
                    <span style={{fontSize:12,fontWeight:600,borderRadius:12,padding:'3px 10px',
                      color:ctxColor||'#8ab4f8',background:`${ctxColor||'#8ab4f8'}22`,
                      border:`1px solid ${ctxColor||'#8ab4f8'}55`}}>
                      {meta.context}
                    </span>
                  )}
                  {meta?.outboundMode && (
                    <span style={{fontSize:11,color:'#6b7fa8',background:'#0d1628',
                      border:'1px solid #2a3a50',borderRadius:10,padding:'2px 8px'}}>
                      {TRAVEL_MODE_LABELS[meta.outboundMode]||meta.outboundMode}
                    </span>
                  )}
                  {meta?.returnMode && meta.returnMode!==meta.outboundMode && (
                    <span style={{fontSize:11,color:'#6b7fa8',background:'#0d1628',
                      border:'1px solid #2a3a50',borderRadius:10,padding:'2px 8px'}}>
                      ↩ {TRAVEL_MODE_LABELS[meta.returnMode]||meta.returnMode}
                    </span>
                  )}
                  <div style={{display:'flex',gap:4,marginLeft:'auto'}}>
                    {['Ahmed','Victoria','Both'].map(tv => {
                      const c = tv==='Ahmed'?{on:'#5c9eff',bg:'#0d2040'}:tv==='Victoria'?{on:'#b87cff',bg:'#1a0d30'}:{on:'#4a9060',bg:'#0d1a10'};
                      return (
                        <button key={tv}
                          onClick={e=>{e.stopPropagation();handleSetTraveler(tripKey,tv);}}
                          style={{padding:'3px 8px',borderRadius:6,cursor:'pointer',fontSize:11,fontWeight:600,
                            border:traveler===tv?`2px solid ${c.on}`:'2px solid transparent',
                            background:traveler===tv?c.bg:'#1e2a3a',color:traveler===tv?c.on:'#6b7fa8'}}>
                          {tv}
                        </button>
                      );
                    })}
                  </div>
                </div>

                {/* Subtab buttons */}
                <div style={{padding:'8px 16px',display:'flex',gap:6,borderBottom:'1px solid #1a2a40'}}>
                  {[['agenda','📅 Agenda'],['summary','📋 Summary'],['packing','🎒 Packing']].map(([tab,label]) => (
                    <button key={tab}
                      onClick={e=>{e.stopPropagation();setTripTab(tripKey,tab);}}
                      style={{padding:'5px 12px',borderRadius:7,cursor:'pointer',fontSize:12,fontWeight:600,
                        background:activeTab===tab?'#1a3a6c':'#0d1a2e',
                        border:activeTab===tab?'1px solid #3d6fa0':'1px solid #1a2a40',
                        color:activeTab===tab?'#5c9eff':'#4d6080'}}>
                      {label}
                    </button>
                  ))}
                </div>

                {/* Tab content */}
                <div style={{padding:'0 16px 16px'}}>
                  {activeTab === 'packing' ? (
                    <PackingLitePanel
                      tripKey={tripKey}
                      packingData={packingData[tripKey]}
                      apiUrl={apiUrl} apiToken={apiToken}
                      onReload={()=>loadPacking(tripKey)}
                    />
                  ) : isItinLoading ? (
                    <div style={{padding:'24px 0',textAlign:'center',color:'#6b7fa8',fontSize:13}}>
                      Loading itinerary…
                    </div>
                  ) : activeTab === 'summary' ? (
                    <SummaryLitePanel trip={{...t,tripKey}} itinerary={filteredItin} travelerFilter={traveler} />
                  ) : (
                    <>
                      <VERANoticesCard trip={t} itinerary={tripData} tripMeta={meta} />
                      <UsefulToKnowCard insights={flightInsights[tripKey]} />
                      <ItineraryDayView
                        trip={{...t,tripKey}} itinerary={filteredItin} busy={busy}
                        onAdd={()=>setModal({mode:'add',tripKey,tripStartDate:t.startDate,tripEndDate:t.endDate})}
                        onEdit={item=>setModal({mode:'edit',item,tripKey,tripStartDate:t.startDate,tripEndDate:t.endDate})}
                        onDelete={id=>handleDelete(id,tripKey)}
                      />
                    </>
                  )}
                </div>
              </div>
            )}
          </div>
        );
      })}

      {modal && (
        <AddItineraryItemLiteModal
          mode={modal.mode} item={modal.item} tripKey={modal.tripKey}
          tripStartDate={modal.tripStartDate} tripEndDate={modal.tripEndDate}
          onSave={handleSave} onClose={()=>setModal(null)} busy={busy}
        />
      )}
    </div>
  );
}

// ---- Finance Summary Lite tab -----------------------------------------------

function FinSummaryLiteTab({ apiUrl, apiToken }) {
  const [tb, loading, reload] = useTrackerBudget(apiUrl, apiToken);
  const split = getSplit();
  const blue = '#5c9eff', purple = '#c97ef2', teal = '#2bb5a0', gold = '#c9a84c';

  const cardStyle = { background: '#0d1b3e', border: '1px solid #1e3060', borderRadius: 12, padding: '18px 20px', marginBottom: 14 };
  const labelStyle = { color: '#6b7fa8', fontSize: 12 };
  const valStyle = (color) => ({ color: color || gold, fontWeight: 700, fontSize: 22, fontVariantNumeric: 'tabular-nums' });

  if (loading) return <div style={{ color: '#4d6080', padding: 32, textAlign: 'center' }}>Loading tracker…</div>;
  if (!tb) return (
    <div style={cardStyle}>
      <div style={{ color: '#ef5350', marginBottom: 10 }}>Tracker data not loaded.</div>
      <button onClick={reload} style={{ background: '#0d2040', border: '1px solid #5c9eff', color: '#5c9eff', borderRadius: 6, padding: '5px 14px', cursor: 'pointer', fontSize: 12 }}>Load</button>
    </div>
  );

  const s = tb.summary || {};
  const ahmedPct = split.ahmed / 100, victoriaPct = split.victoria / 100;

  // Day-of-month checkpoints
  const jointFixed = (tb.sharedFixed || []).filter(e => e.paidBy === 'Joint');
  const day1  = jointFixed.filter(e => e.dueDay && e.dueDay <= 7);
  const day15 = jointFixed.filter(e => e.dueDay && e.dueDay >= 8 && e.dueDay <= 20);
  const day25 = jointFixed.filter(e => !e.dueDay || e.dueDay >= 21);
  const sum = arr => arr.reduce((t, e) => t + (e.amount || 0), 0);

  const checkpoints = [
    { label: 'Day 1', sub: 'Beginning of month', bills: day1,  total: sum(day1)  },
    { label: 'Day 15', sub: 'Mid month',          bills: day15, total: sum(day15) },
    { label: 'Day 25', sub: 'End of month',        bills: day25, total: sum(day25) },
  ];

  return (
    <div>
      <div style={{ display: 'flex', alignItems: 'center', gap: 10, marginBottom: 16 }}>
        <span style={{ fontSize: 11, color: '#4d6080' }}>Based on Tracker</span>
        <button onClick={reload} style={{ fontSize: 10, color: blue, background: 'none', border: '1px solid #2a3a4a', borderRadius: 5, cursor: 'pointer', padding: '1px 8px' }}>↻ Refresh</button>
      </div>

      {/* Transfer calculator */}
      <div style={cardStyle}>
        <div style={{ fontWeight: 700, fontSize: 13, color: '#dde1f0', marginBottom: 14 }}>💸 Monthly Transfers</div>
        <div style={{ display: 'grid', gridTemplateColumns: '1fr 1fr', gap: '10px 24px' }}>
          <div>
            <div style={labelStyle}>Ahmed → AMEX Checking</div>
            <div style={valStyle(blue)}>{fmtMny(s.ahmedTransferChecking)}</div>
          </div>
          <div>
            <div style={labelStyle}>Victoria → AMEX Checking</div>
            <div style={valStyle(purple)}>{fmtMny(s.victoriaTransferChecking)}</div>
          </div>
          <div>
            <div style={labelStyle}>Ahmed → AMEX Savings</div>
            <div style={valStyle(blue)}>{fmtMny(s.ahmedTransferSavings)}</div>
          </div>
          <div>
            <div style={labelStyle}>Victoria → AMEX Savings</div>
            <div style={valStyle(purple)}>{fmtMny(s.victoriaTransferSavings)}</div>
          </div>
        </div>
        <div style={{ marginTop: 14, paddingTop: 10, borderTop: '1px solid #1e3060', fontSize: 12, color: '#4d6080' }}>
          Total shared: <span style={{ color: teal, fontWeight: 600 }}>{fmtMny(s.totalShared)}</span>
          &nbsp;·&nbsp;Split {split.ahmed}/{split.victoria}
          &nbsp;→&nbsp;<span style={{ color: blue }}>Ahmed {fmtMny(s.totalShared * ahmedPct)}</span>
          &nbsp;|&nbsp;<span style={{ color: purple }}>Victoria {fmtMny(s.totalShared * victoriaPct)}</span>
        </div>
      </div>

      {/* Balance checkpoints */}
      <div style={{ fontWeight: 600, fontSize: 12, color: '#6b7fa8', textTransform: 'uppercase', letterSpacing: '0.06em', marginBottom: 8 }}>Joint Account Balance Checkpoints</div>
      <div style={{ display: 'grid', gridTemplateColumns: 'repeat(3, 1fr)', gap: 10 }}>
        {checkpoints.map(cp => (
          <div key={cp.label} style={{ ...cardStyle, marginBottom: 0 }}>
            <div style={{ fontWeight: 700, color: teal, fontSize: 13, marginBottom: 2 }}>{cp.label}</div>
            <div style={{ fontSize: 10, color: '#4d6080', marginBottom: 10 }}>{cp.sub}</div>
            {cp.bills.length === 0
              ? <div style={{ fontSize: 11, color: '#4d6080' }}>No bills due</div>
              : cp.bills.map((b, i) => (
                  <div key={i} style={{ fontSize: 11, color: '#8a9abf', display: 'flex', justifyContent: 'space-between', marginBottom: 3 }}>
                    <span style={{ overflow: 'hidden', textOverflow: 'ellipsis', whiteSpace: 'nowrap', maxWidth: '65%' }}>{b.name}</span>
                    <span style={{ color: gold, fontVariantNumeric: 'tabular-nums', flexShrink: 0 }}>{fmtMny(b.amount)}</span>
                  </div>
                ))
            }
            <div style={{ marginTop: 8, paddingTop: 6, borderTop: '1px solid #1e3060', display: 'flex', justifyContent: 'space-between', fontSize: 12 }}>
              <span style={{ color: '#6b7fa8' }}>Needed</span>
              <span style={{ color: teal, fontWeight: 700, fontVariantNumeric: 'tabular-nums' }}>{fmtMny(cp.total)}</span>
            </div>
          </div>
        ))}
      </div>
    </div>
  );
}

// ---- Finance Budget Lite tab -------------------------------------------------

function FinBudgetLiteTab({ apiUrl, apiToken }) {
  const [tb, loading, reload] = useTrackerBudget(apiUrl, apiToken);
  const split = getSplit();
  const blue = '#5c9eff', purple = '#c97ef2', teal = '#2bb5a0', gold = '#c9a84c';
  const ahmedPct = split.ahmed / 100, victoriaPct = split.victoria / 100;

  const cardStyle = { background: '#0d1b3e', border: '1px solid #1e3060', borderRadius: 12, padding: '16px 18px', flex: 1, minWidth: 0 };
  const sectionLabel = { fontSize: 10, color: '#4d6080', textTransform: 'uppercase', letterSpacing: '0.06em', marginBottom: 6 };

  function PersonCard({ label, color, fixed, nice }) {
    const total = [...(fixed||[]), ...(nice||[])].reduce((s, e) => s + (e.amount || 0), 0);
    return (
      <div style={cardStyle}>
        <div style={{ fontWeight: 700, fontSize: 13, color, marginBottom: 12 }}>{label}</div>
        {(fixed||[]).length > 0 && <>
          <div style={sectionLabel}>Fixed</div>
          {fixed.map((e, i) => (
            <div key={i} style={{ display: 'flex', justifyContent: 'space-between', fontSize: 12, color: '#dde1f0', padding: '3px 0', borderBottom: '1px solid #0d1b3e' }}>
              <span style={{ overflow: 'hidden', textOverflow: 'ellipsis', whiteSpace: 'nowrap', maxWidth: '70%' }}>{e.name}</span>
              <span style={{ color: gold, fontVariantNumeric: 'tabular-nums', flexShrink: 0 }}>{fmtMny(e.amount)}</span>
            </div>
          ))}
        </>}
        {(nice||[]).length > 0 && <>
          <div style={{ ...sectionLabel, marginTop: 10 }}>Nice to Have</div>
          {nice.map((e, i) => (
            <div key={i} style={{ display: 'flex', justifyContent: 'space-between', fontSize: 12, color: '#dde1f0', padding: '3px 0', borderBottom: '1px solid #0d1b3e' }}>
              <span style={{ overflow: 'hidden', textOverflow: 'ellipsis', whiteSpace: 'nowrap', maxWidth: '70%' }}>{e.name}</span>
              <span style={{ color: gold, fontVariantNumeric: 'tabular-nums', flexShrink: 0 }}>{fmtMny(e.amount)}</span>
            </div>
          ))}
        </>}
        <div style={{ marginTop: 10, paddingTop: 6, borderTop: '1px solid #1e3060', display: 'flex', justifyContent: 'space-between', fontSize: 12 }}>
          <span style={{ color: '#6b7fa8' }}>Personal total</span>
          <span style={{ fontWeight: 700, color, fontVariantNumeric: 'tabular-nums' }}>{fmtMny(total)}</span>
        </div>
      </div>
    );
  }

  function SharedCard({ fixed, nice }) {
    const fixedTotal = (fixed||[]).reduce((s, e) => s + (e.amount || 0), 0);
    const niceTotal  = (nice||[]).reduce((s, e) => s + (e.amount || 0), 0);
    const grand = fixedTotal + niceTotal;
    return (
      <div style={{ ...cardStyle, flex: '0 0 38%' }}>
        <div style={{ fontWeight: 700, fontSize: 13, color: teal, marginBottom: 12 }}>Shared Expenses</div>
        {(fixed||[]).length > 0 && <>
          <div style={sectionLabel}>Fixed</div>
          {fixed.map((e, i) => (
            <div key={i} style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center', fontSize: 12, color: '#dde1f0', padding: '3px 0', borderBottom: '1px solid #0d1b3e', gap: 6 }}>
              <span style={{ overflow: 'hidden', textOverflow: 'ellipsis', whiteSpace: 'nowrap', flex: 1 }}>{e.name}</span>
              {payerChip(e.paidBy)}
              <span style={{ color: gold, fontVariantNumeric: 'tabular-nums', flexShrink: 0 }}>{fmtMny(e.amount)}</span>
            </div>
          ))}
        </>}
        {(nice||[]).length > 0 && <>
          <div style={{ ...sectionLabel, marginTop: 10 }}>Nice to Have</div>
          {nice.map((e, i) => (
            <div key={i} style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center', fontSize: 12, color: '#dde1f0', padding: '3px 0', borderBottom: '1px solid #0d1b3e', gap: 6 }}>
              <span style={{ overflow: 'hidden', textOverflow: 'ellipsis', whiteSpace: 'nowrap', flex: 1 }}>{e.name}</span>
              {payerChip(e.paidBy)}
              <span style={{ color: gold, fontVariantNumeric: 'tabular-nums', flexShrink: 0 }}>{fmtMny(e.amount)}</span>
            </div>
          ))}
        </>}
        <div style={{ marginTop: 10, paddingTop: 6, borderTop: '1px solid #1e3060', fontSize: 12 }}>
          <div style={{ display: 'flex', justifyContent: 'space-between', marginBottom: 4 }}>
            <span style={{ color: '#6b7fa8' }}>Grand total</span>
            <span style={{ fontWeight: 700, color: teal, fontVariantNumeric: 'tabular-nums' }}>{fmtMny(grand)}</span>
          </div>
          <div style={{ fontSize: 11, color: '#4d6080' }}>
            {split.ahmed}/{split.victoria} split →&nbsp;
            <span style={{ color: blue }}>Ahmed {fmtMny(grand * ahmedPct)}</span>
            &nbsp;|&nbsp;
            <span style={{ color: purple }}>Victoria {fmtMny(grand * victoriaPct)}</span>
          </div>
        </div>
      </div>
    );
  }

  if (loading) return <div style={{ color: '#4d6080', padding: 32, textAlign: 'center' }}>Loading tracker…</div>;
  if (!tb) return (
    <div style={{ background: '#0d1b3e', border: '1px solid #1e3060', borderRadius: 12, padding: 20 }}>
      <div style={{ color: '#ef5350', marginBottom: 10 }}>Tracker data not loaded.</div>
      <button onClick={reload} style={{ background: '#0d2040', border: '1px solid #5c9eff', color: '#5c9eff', borderRadius: 6, padding: '5px 14px', cursor: 'pointer', fontSize: 12 }}>Load</button>
    </div>
  );

  const s = tb.summary || {};

  return (
    <div>
      <div style={{ display: 'flex', alignItems: 'center', gap: 10, marginBottom: 14 }}>
        <span style={{ fontSize: 11, color: '#4d6080' }}>Based on Tracker</span>
        <button onClick={reload} style={{ fontSize: 10, color: blue, background: 'none', border: '1px solid #2a3a4a', borderRadius: 5, cursor: 'pointer', padding: '1px 8px' }}>↻ Refresh</button>
      </div>

      <div style={{ display: 'flex', gap: 12, flexWrap: 'wrap', marginBottom: 14 }}>
        <PersonCard label="Ahmed Personal" color={blue} fixed={tb.ahmedFixed} nice={tb.ahmedNiceToHave} />
        <SharedCard fixed={tb.sharedFixed} nice={tb.sharedNiceToHave} />
        <PersonCard label="Victoria Personal" color={purple} fixed={tb.victoriaFixed} nice={tb.victoriaNiceToHave} />
      </div>

      {/* Summary band */}
      <div style={{ background: '#0d1b3e', border: '1px solid #1e3060', borderRadius: 12, padding: '14px 18px' }}>
        <div style={{ fontWeight: 700, fontSize: 12, color: '#6b7fa8', textTransform: 'uppercase', letterSpacing: '0.06em', marginBottom: 10 }}>Summary</div>
        <div style={{ display: 'grid', gridTemplateColumns: '1fr 1fr', gap: '6px 24px', fontSize: 13 }}>
          <div style={{ color: '#6b7fa8' }}>Ahmed net income</div>
          <div style={{ color: blue, fontVariantNumeric: 'tabular-nums' }}>{fmtMny(tb.ahmedIncome && tb.ahmedIncome.net)}</div>
          <div style={{ color: '#6b7fa8' }}>Victoria net income</div>
          <div style={{ color: purple, fontVariantNumeric: 'tabular-nums' }}>{fmtMny(tb.victoriaIncome && tb.victoriaIncome.net)}</div>
          <div style={{ color: '#6b7fa8' }}>Total shared</div>
          <div style={{ color: teal, fontVariantNumeric: 'tabular-nums' }}>{fmtMny(s.totalShared)}</div>
          <div style={{ color: '#6b7fa8' }}>Transfer → AMEX Checking</div>
          <div>
            <span style={{ color: blue, fontVariantNumeric: 'tabular-nums' }}>{fmtMny(s.ahmedTransferChecking)}</span>
            <span style={{ color: '#4d6080' }}> | </span>
            <span style={{ color: purple, fontVariantNumeric: 'tabular-nums' }}>{fmtMny(s.victoriaTransferChecking)}</span>
          </div>
          <div style={{ color: '#6b7fa8' }}>Transfer → AMEX Savings</div>
          <div>
            <span style={{ color: blue, fontVariantNumeric: 'tabular-nums' }}>{fmtMny(s.ahmedTransferSavings)}</span>
            <span style={{ color: '#4d6080' }}> | </span>
            <span style={{ color: purple, fontVariantNumeric: 'tabular-nums' }}>{fmtMny(s.victoriaTransferSavings)}</span>
          </div>
        </div>
      </div>
    </div>
  );
}

// ---- App --------------------------------------------------------------------

const TOP_TABS = [
  { id: 'chat',          label: '💬 Chat'          },
  { id: 'household',     label: '🏠 Household'      },
  { id: 'shopping',      label: '🛒 Shopping'      },
  { id: 'cards',         label: '💳 Cards'          },
  { id: 'coupons',       label: '🎟️ Coupons'        },
  { id: 'prescriptions', label: '💊 Prescriptions' },
  { id: 'travel',        label: '✈️ Travel'         },
  { id: 'finances',      label: '💰 Finances'       },
  { id: 'home_front',    label: '🏡 Home Front'     },
];

const FINANCE_TABS = [
  { id: 'fin_summary', label: '💰 Summary'  },
  { id: 'fin_budget',  label: '📊 Budget'   },
  { id: 'fin_bills',   label: '🧾 Bills'    },
  { id: 'fin_cashflow', label: '💰 Cashflow' },
  { id: 'tax',         label: '🧾 Tax'      },
];

function App() {
  const [apiUrl,       setApiUrl]       = useState(() => stored('vera_url'));
  const [apiToken,     setApiToken]     = useState(() => stored('vera_token'));
  const [showSettings, setShowSettings] = useState(() => !stored('vera_url'));
  const [activeTab,       setActiveTab]       = useState('chat');
  const [activeFinanceTab, setActiveFinanceTab] = useState('fin_summary');
  const [shopping,     setShopping]     = useState([]);
  const [busy,         setBusy]         = useState(false);
  const [error,        setError]        = useState(null);
  const [addItemModal, setAddItemModal] = useState(false);
  const [toast,        setToast]        = useState(null);
  const [status,       setStatus]       = useState(null);
  const toastTimer = useRef(null);

  function showToast(msg, isError) {
    setToast({ msg, isError: !!isError });
    if (toastTimer.current) clearTimeout(toastTimer.current);
    toastTimer.current = setTimeout(() => setToast(null), 3000);
  }

  async function loadShopping(url, token) {
    if (!url || !token) return;
    try {
      const data = await apiGet(url, token, { action: 'shopping' });
      setShopping(data.stores || []);
      setError(null);
    } catch (err) {
      setError(err.message);
    }
  }

  async function loadStatus(url, token) {
    if (!url || !token) return;
    try {
      const data = await apiGet(url, token, { action: 'status' });
      setStatus(data);
    } catch (err) {
      // Feature flags default to enabled; a failed status fetch just
      // means everything stays visible, so no error banner needed here.
    }
  }

  useEffect(() => {
    if (apiUrl && apiToken) {
      loadShopping(apiUrl, apiToken);
      loadStatus(apiUrl, apiToken);
    }
  }, [apiUrl, apiToken]);

  async function handleToggle(tabId, itemIndex, currentlyDone) {
    // Optimistic update
    setShopping(prev => prev.map(store =>
      store.tabId !== tabId ? store : {
        ...store,
        items: store.items.map(item =>
          item.index !== itemIndex ? item : { ...item, done: !currentlyDone }
        ),
      }
    ));
    try {
      await apiAction(apiUrl, apiToken, 'shopping_toggle', { tabId, index: itemIndex });
    } catch (err) {
      setError('Could not update item: ' + err.message);
      await loadShopping(apiUrl, apiToken); // revert on error
    }
  }

  async function handleAdd(tabId, text) {
    setBusy(true);
    try {
      await apiAction(apiUrl, apiToken, 'shopping_add', { tabId, text });
      showToast('✓ Item added');
      setAddItemModal(false);
      await loadShopping(apiUrl, apiToken);
    } catch (err) {
      setError('Could not add item: ' + err.message);
    }
    setBusy(false);
  }

  async function handleDeleteShoppingItem(tabId, itemIndex) {
    // Optimistic removal
    setShopping(prev => prev.map(store =>
      store.tabId !== tabId ? store : {
        ...store,
        items: store.items.filter(item => item.index !== itemIndex),
      }
    ));
    try {
      await apiAction(apiUrl, apiToken, 'shopping_delete', { tabId, index: itemIndex });
    } catch (err) {
      setError('Could not delete item: ' + err.message);
      await loadShopping(apiUrl, apiToken); // revert
    }
  }

  async function handleUpdateShoppingItem(tabId, itemIndex, newText) {
    // Optimistic update
    setShopping(prev => prev.map(store =>
      store.tabId !== tabId ? store : {
        ...store,
        items: store.items.map(item =>
          item.index !== itemIndex ? item : { ...item, text: newText }
        ),
      }
    ));
    try {
      await apiAction(apiUrl, apiToken, 'shopping_update', { tabId, index: itemIndex, text: newText });
    } catch (err) {
      setError('Could not update item: ' + err.message);
      await loadShopping(apiUrl, apiToken); // revert
    }
  }

  async function handleLogRun(storeTabId, itemTexts) {
    setBusy(true);
    try {
      await apiAction(apiUrl, apiToken, 'log_purchase_run', {
        storeId: storeTabId,
        items: JSON.stringify(itemTexts),
      });
      showToast('✓ Logged ' + itemTexts.length + ' item(s) to Purchase History');
    } catch (err) {
      showToast('⚠️ Log Run failed: ' + err.message, true);
    }
    setBusy(false);
  }

  return (
    <>
      {/* Header */}
      <div className="header">
        <div className="logo">
          <span className="logo-name">VERA</span>
          <span className="logo-sub">Dashboard</span>
        </div>
        <div className="header-actions">
          <button
            className="btn btn-refresh"
            onClick={() => loadShopping(apiUrl, apiToken)}
            disabled={!apiUrl || !apiToken}
            title="Refresh list"
          >
            ↺
          </button>
          <button
            className="btn-settings"
            onClick={() => setShowSettings(true)}
            title="Settings"
          >
            ⚙
          </button>
        </div>
      </div>

      {/* Tab bar */}
      <div style={{
        background: '#0a1428',
        borderBottom: '1px solid #1e3060',
        display: 'flex',
        gap: 0,
        overflowX: 'auto',
        padding: '0 28px',
      }}>
        {TOP_TABS.map(tab => (
          <button
            key={tab.id}
            disabled={!!tab.disabled}
            onClick={() => !tab.disabled && setActiveTab(tab.id)}
            style={{
              background: 'none',
              border: 'none',
              borderBottom: activeTab === tab.id ? '2px solid #c9a84c' : '2px solid transparent',
              color: tab.disabled ? '#2a3a5e' : activeTab === tab.id ? '#c9a84c' : '#8a9abf',
              cursor: tab.disabled ? 'not-allowed' : 'pointer',
              fontSize: 13,
              fontWeight: 600,
              padding: '12px 16px',
              whiteSpace: 'nowrap',
            }}
          >
            {tab.label}
          </button>
        ))}
      </div>

      {/* Main content */}
      <div style={{ maxWidth: 800, margin: '0 auto', padding: '24px 28px' }}>
        {error && (
          <div className="error-banner">
            <span>{error}</span>
            <button className="error-dismiss" onClick={() => setError(null)}>✕</button>
          </div>
        )}

        {activeTab === 'chat' && (
          <ChatLiteView apiUrl={apiUrl} apiToken={apiToken} />
        )}

        {activeTab === 'shopping' && (
          <ShoppingTab
            stores={shopping}
            onToggle={handleToggle}
            onAddItem={(storeId) => setAddItemModal(storeId || true)}
            onDelete={handleDeleteShoppingItem}
            onEdit={handleUpdateShoppingItem}
            onLogRun={handleLogRun}
            busy={busy}
          />
        )}

        {activeTab === 'prescriptions' && (
          <PrescriptionsTab apiUrl={apiUrl} apiToken={apiToken} />
        )}

        {activeTab === 'cards' && (
          <CardsTab apiUrl={apiUrl} apiToken={apiToken} />
        )}

        {activeTab === 'coupons' && (
          <CouponsLiteTab apiUrl={apiUrl} apiToken={apiToken} />
        )}

        {activeTab === 'home_front' && (
          <HomeFrontLiteTab apiUrl={apiUrl} apiToken={apiToken} features={status && status.features} />
        )}

        {activeTab === 'household' && (
          <HouseholdLiteTab apiUrl={apiUrl} apiToken={apiToken} />
        )}

        {activeTab === 'travel' && (
          <TravelLiteTab apiUrl={apiUrl} apiToken={apiToken} />
        )}

        {activeTab === 'finances' && (
          <div>
            <div style={{ display:'flex', gap:8, marginBottom:20, flexWrap:'wrap' }}>
              {FINANCE_TABS.map(t => (
                <button key={t.id}
                  className={'subtab-btn' + (activeFinanceTab === t.id ? ' active' : '')}
                  onClick={() => setActiveFinanceTab(t.id)}>
                  {t.label}
                </button>
              ))}
            </div>
            {activeFinanceTab === 'fin_summary' && <FinSummaryLiteTab apiUrl={apiUrl} apiToken={apiToken} />}
            {activeFinanceTab === 'fin_budget'  && <FinBudgetLiteTab  apiUrl={apiUrl} apiToken={apiToken} />}
            {activeFinanceTab === 'fin_bills'    && <FinBillsLiteTab    apiUrl={apiUrl} apiToken={apiToken} />}
            {activeFinanceTab === 'fin_cashflow' && <FinCashflowLiteTab apiUrl={apiUrl} apiToken={apiToken} />}
            {activeFinanceTab === 'tax'         && <TaxTab            apiUrl={apiUrl} apiToken={apiToken} />}
          </div>
        )}
      </div>

      {/* Settings modal */}
      {showSettings && (
        <SettingsModal
          initial={{ url: apiUrl, token: apiToken }}
          onSave={(u, t) => {
            setApiUrl(u);
            setApiToken(t);
            setShowSettings(false);
            loadShopping(u, t);
          }}
          onClose={apiUrl ? () => setShowSettings(false) : null}
        />
      )}

      {/* Add item modal */}
      {addItemModal && shopping.length > 0 && (
        <AddItemModal
          stores={shopping}
          onSave={handleAdd}
          onClose={() => setAddItemModal(false)}
          busy={busy}
          initialStore={typeof addItemModal === 'string' ? addItemModal : undefined}
        />
      )}

      {/* Toast */}
      {toast && (
        <div className={`toast${toast.isError ? ' error' : ''}`}>
          {toast.msg}
        </div>
      )}
    </>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
