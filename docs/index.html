        {/* Hotel-specific fields */}
        {type === 'hotel' && (
          <div style={{ background: '#131e2e', borderRadius: 8, padding: '10px 12px',
                        marginBottom: 12, border: '1px solid #1e2a3a' }}>
            <div style={{ color: '#8ab4f8', fontSize: 12, fontWeight: 600, marginBottom: 8 }}>
              🏨 Hotel Stay
            </div>
            <div className="form-group" style={{ marginBottom: 0 }}>
              <label className="form-label">Check-out Date</label>
              <input className="form-input" type="date" value={checkoutDate}
                onChange={e => setCheckoutDate(e.target.value)} />
            </div>
          </div>
        )}

        {/* Date + Times */}
        <div style={{ display: 'flex', gap: 8, marginBottom: 12 }}>
          <div className="form-group" style={{ flex: 2, marginBottom: 0 }}>
            <label className="form-label">{type === 'hotel' ? 'Check-in Date' : 'Date'}</label>
            <input className="form-input" type="date" value={date}
              onChange={e => setDate(e.target.value)} />
          </div>
          <div className="form-group" style={{ flex: 1, marginBottom: 0 }}>
            <label className="form-label">{type === 'hotel' ? 'Check-in' : 'Start'}</label>
            <input className="form-input" type="time" value={startTime}
              onChange={e => setStartTime(e.target.value)} />
          </div>
          <div className="form-group" style={{ flex: 1, marginBottom: 0 }}>
            <label className="form-label">{type === 'hotel' ? 'Check-out' : 'End'}</label>
            <input className="form-input" type="time" value={endTime}
              onChange={e => setEndTime(e.target.value)} />
          </div>
        </div>

        {/* Timezone (optional — shown next to time in agenda) */}
        <div className="form-group">
          <label className="form-label">Timezone <span style={{ color: '#5f6368', fontWeight: 400 }}>(optional)</span></label>
          <select className="form-input" value={timezone} onChange={e => setTimezone(e.target.value)}
            style={{ color: timezone ? '#e8eaed' : '#6b7fa8' }}>
            {ITIN_TZ_OPTIONS.map(opt => (
              <option key={opt.value} value={opt.value}>{opt.label}</option>
            ))}
          </select>
        </div>

        {/* Location */}
        <div className="form-group">
          <label className="form-label">Location</label>
          <input className="form-input" value={location}
            onChange={e => setLocation(e.target.value)} onKeyDown={handleKey}
            placeholder="Optional" />
        </div>

        {/* Notes */}
        <div className="form-group">
          <label className="form-label">Notes</label>
          <input className="form-input" value={notes}
            onChange={e => setNotes(e.target.value)} onKeyDown={handleKey}
            placeholder="Optional" />
        </div>

        <div className="modal-actions">
          <button className="btn btn-ghost" onClick={onClose}>Cancel</button>
          <button className="btn btn-primary" onClick={handleSave}
            disabled={busy || !title.trim()}>
            {isEdit ? 'Save Changes' : 'Add to Itinerary'}
          </button>
        </div>
      </div>
    </div>
  );
}

function ItineraryView({ trip, itinerary, loading, busy,
                         tripContext, onSetContext, onLoadContext, onGoToPacking,
                         onAdd, onEdit, onDelete }) {
  if (loading) return <div className="loading-text">Loading itinerary…</div>;

  const items   = (itinerary && itinerary.items) || [];
  const notices = computeItineraryNotices(items);
  const [viewMode, setViewMode] = React.useState('agenda'); // 'agenda' | 'summary'

  // Lazy-load trip context on first render if not already fetched
  React.useEffect(function() {
    if (tripContext === undefined && onLoadContext) onLoadContext();
  }, []); // eslint-disable-line react-hooks/exhaustive-deps

  // ── Build ordered day list ─────────────────────────────────────────────────
  const tripDays = getDayRange(trip.startDate, trip.endDate);

  // Pre-compute hotel checkout date map: itemId → checkoutDate
  var hotelCheckoutDates = {};
  items.forEach(function(item) {
    if (item.type !== 'hotel' || !item.metadata) return;
    try { var m = JSON.parse(item.metadata); if (m.checkoutDate) hotelCheckoutDates[item.id] = m.checkoutDate; } catch(e) {}
  });

  const byDay    = {};
  items.forEach(function(item) {
    const d = item.date || '__other__';
    if (!byDay[d]) byDay[d] = [];
    byDay[d].push(item);
  });
  // Ensure every trip day exists in byDay (even if empty)
  tripDays.forEach(function(d) { if (!byDay[d]) byDay[d] = []; });

  // Inject synthetic hotel checkout entries so checkout day shows "Check out" row
  items.forEach(function(item) {
    var cd = hotelCheckoutDates[item.id];
    if (!cd) return;
    if (!byDay[cd]) byDay[cd] = [];
    byDay[cd].push({
      _synthetic: true,
      id: item.id + '_checkout',
      type: 'hotel',
      title: item.title,
      date: cd,
      startTime: item.endTime || '',
      endTime: '',
      location: item.location || '',
      notes: '',
      source: item.source,
      metadata: item.metadata,
    });
  });

  // ── Resolve default hotel check-in / check-out times ─────────────────────
  // For multiday hotel stays with no explicit times:
  //   Check-in  default = 15:00, pushed later if a flight arrives after 15:00 that day
  //   Check-out default = 10:00, pulled earlier if a flight/train departs before 10:00 that day
  Object.keys(byDay).forEach(function(d) {
    var snapshot = byDay[d].slice(); // read originals before map replaces entries
    byDay[d] = byDay[d].map(function(item) {
      if (item.type !== 'hotel') return item;
      if (item._synthetic) {
        // Checkout row — resolve default time
        if (item.startTime) return item; // explicit time already set
        var co = '10:00';
        snapshot.forEach(function(o) {
          if (o._synthetic) return;
          if ((o.type === 'flight' || o.type === 'train') && o.startTime && o.startTime < co) co = o.startTime;
        });
        return Object.assign({}, item, { startTime: co, _defaultTime: true });
      } else if (hotelCheckoutDates[item.id]) {
        // Check-in row — resolve default time
        if (item.startTime) return item; // explicit time already set
        var ci = '15:00';
        snapshot.forEach(function(o) {
          if (o.type === 'flight' && !o._synthetic && o.endTime && o.endTime > ci) ci = o.endTime;
        });
        return Object.assign({}, item, { startTime: ci, _defaultTime: true });
      }
      return item;
    });
  });
  // ─────────────────────────────────────────────────────────────────────────

  // Full ordered list: pre-trip days → trip days → post-trip days → undated
  const outOfRange = Object.keys(byDay)
    .filter(function(d) { return d !== '__other__' && tripDays.indexOf(d) === -1; })
    .sort();
  const preTripDays  = outOfRange.filter(function(d) { return trip.startDate && d < trip.startDate; });
  const postTripDays = outOfRange.filter(function(d) { return !trip.startDate || d > (trip.endDate || trip.startDate); });
  const orderedDays  = preTripDays.concat(tripDays).concat(postTripDays);
  if (byDay['__other__'] && byDay['__other__'].length) orderedDays.push('__other__');
  // ──────────────────────────────────────────────────────────────────────────

  return (
    <div>
      {/* Trip header */}
      <div style={{ marginBottom: 16, paddingBottom: 12, borderBottom: '1px solid #2a3a50' }}>
        {/* Row 1: title + dates */}
        <div style={{ marginBottom: 8 }}>
          <div style={{ fontWeight: 700, fontSize: 16, color: '#e8eaed' }}>{trip.label}</div>
          <div style={{ color: '#8ab4f8', fontSize: 13 }}>{trip.startDate} → {trip.endDate}</div>
        </div>
        {/* Row 2: context badge + action buttons */}
        <div style={{ display: 'flex', alignItems: 'center', gap: 10, flexWrap: 'wrap' }}>
          <TripContextBadge
            context={tripContext && tripContext !== 'loading' ? tripContext.context : ''}
            onSetContext={function(ctx) { if (onSetContext) onSetContext(ctx); }}
            busy={busy}
          />
          <div style={{ marginLeft: 'auto', display: 'flex', gap: 6, flexShrink: 0 }}>
            {onGoToPacking && (
              <button onClick={onGoToPacking} disabled={busy}
                style={{ padding: '5px 11px', borderRadius: 6, border: '1px solid #2a3a50',
                         background: 'transparent', color: '#8ab4f8', fontWeight: 600,
                         cursor: 'pointer', fontSize: 13 }}>
                🧳 Packing
              </button>
            )}
            <button onClick={function() { setViewMode(viewMode === 'agenda' ? 'summary' : 'agenda'); }}
              style={{ padding: '5px 11px', borderRadius: 6, border: '1px solid #2a3a50',
                       background: 'transparent', color: '#8ab4f8', fontWeight: 600,
                       cursor: 'pointer', fontSize: 13 }}>
              {viewMode === 'agenda' ? '📋 Summary' : '🗒 Agenda'}
            </button>
            <button onClick={onAdd} disabled={busy}
              style={{ padding: '5px 14px', borderRadius: 6, border: 'none',
                       background: '#8ab4f8', color: '#0d1117', fontWeight: 600,
                       cursor: 'pointer', fontSize: 13 }}>
              + Add Item
            </button>
          </div>
        </div>
      </div>

      {/* Empty state */}
      {items.length === 0 && tripDays.length === 0 && (
        <div style={{ textAlign: 'center', padding: '40px 20px', color: '#5f6368', fontSize: 14 }}>
          <div style={{ fontSize: 32, marginBottom: 10 }}>🗺️</div>
          <div>No itinerary items yet.</div>
          <div style={{ marginTop: 6, fontSize: 12 }}>
            Add flights, hotels, or notes above. Calendar events within the trip dates appear automatically.
          </div>
        </div>
      )}

      {/* VERA Notices */}
      {notices.length > 0 && (
        <div style={{ background: '#0a1a2e', border: '1px solid #1e3a5f', borderRadius: 8,
                      padding: '10px 14px', marginBottom: 16 }}>
          <div style={{ fontWeight: 700, color: '#8ab4f8', fontSize: 12, marginBottom: 8 }}>
            💡 VERA Notices
          </div>
          {notices.map(function(n, ni) {
            var hrs    = Math.floor((n.gapMins || 0) / 60);
            var mins   = (n.gapMins || 0) % 60;
            var gapStr = hrs > 0 ? hrs + 'h' + (mins ? ' ' + mins + 'm' : '') : mins + 'm';
            var dateStr = n.date && n.date !== '__other__' ? formatAgendaDate(n.date) + ': ' : '';

            if (n.type === 'overlap') {
              return (
                <div key={ni} style={{ color: '#e8b44a', fontSize: 12, marginBottom: 5 }}>
                  ⚠️ {dateStr}<em>"{n.a.title}"</em> and <em>"{n.b.title}"</em> overlap at {n.a.startTime}
                </div>
              );
            }
            if (n.type === 'flight_gap') {
              return (
                <div key={ni} style={{ color: '#9ab4d8', fontSize: 12, marginBottom: 5 }}>
                  ✈ {dateStr}Lands {n.from.endTime}, next event "{n.to.title}" at {n.to.startTime} — {gapStr} gap. Consider adding a transfer or stop.
                </div>
              );
            }
            if (n.type === 'timeline_gap') {
              return (
                <div key={ni} style={{ color: '#6b7fa8', fontSize: 12, marginBottom: 5 }}>
                  ⏱ {dateStr}{gapStr} free after "{n.from.title}" ({n.from.endTime || n.from.startTime} → {n.to.startTime})
                </div>
              );
            }
            return null;
          })}
        </div>
      )}

      {/* ── Summary mode ────────────────────────────────────────────────── */}
      {viewMode === 'summary' && orderedDays
        .filter(function(d) { return d !== '__other__'; })
        .map(function(day, dayIdx) {
          var dayItems  = byDay[day] || [];
          var isInRange = tripDays.indexOf(day) !== -1;
          var dayNum    = isInRange ? tripDays.indexOf(day) + 1 : null;
          var hasFlight = dayItems.some(function(i) { return i.type === 'flight'; });
          var dayTag = '';
          if (hasFlight) {
            if (day === trip.startDate)    dayTag = '🛬 Arrival Day';
            else if (day === trip.endDate) dayTag = '🛫 Departure Day';
            else                           dayTag = '✈ Travel Day';
          }

          var timedItems = dayItems
            .filter(function(i) { return i.startTime; })
            .sort(function(a, b) { return a.startTime < b.startTime ? -1 : 1; });
          var freeBlocks = [];
          for (var k = 0; k < timedItems.length - 1; k++) {
            var curr     = timedItems[k];
            var nextItem = timedItems[k + 1];
            var gapStart = curr.endTime || curr.startTime;
            var gapMins  = timeToMins(nextItem.startTime) - timeToMins(gapStart);
            if (gapMins >= 60) {
              freeBlocks.push({ start: gapStart, end: nextItem.startTime, mins: gapMins });
            }
          }

          return (
            <div key={day} style={{ background: '#0a1220', border: '1px solid #2a3a50',
                                    borderRadius: 10, padding: '14px 16px', marginBottom: 12 }}>
              <div style={{ display: 'flex', alignItems: 'center', gap: 8, marginBottom: 10 }}>
                <div style={{ fontWeight: 700, color: '#8ab4f8', fontSize: 14 }}>
                  {dayNum ? 'Day ' + dayNum + ' — ' : ''}{formatAgendaDate(day)}
                </div>
                {dayTag && (
                  <span style={{ fontSize: 11, fontWeight: 600, color: '#5c9eff',
                                 background: '#0d2040', borderRadius: 10, padding: '2px 8px' }}>
                    {dayTag}
                  </span>
                )}
              </div>

              {dayItems.length === 0 ? (
                <div style={{ color: '#3a4a60', fontSize: 12, fontStyle: 'italic' }}>No events scheduled</div>
              ) : (
                <div>
                  <div style={{ color: '#6b7fa8', fontSize: 12, marginBottom: 8 }}>
                    {dayItems.length} event{dayItems.length !== 1 ? 's' : ''} scheduled
                  </div>
                  {timedItems.concat(dayItems.filter(function(i) { return !i.startTime; })).map(function(item) {
                    var hotelLabel = item.type === 'hotel'
                      ? (item._synthetic ? 'Check out — ' : hotelCheckoutDates[item.id] ? 'Check in — ' : null)
                      : null;
                    return (
                      <div key={item.id} style={{ fontSize: 13, color: '#dde1f0', marginBottom: 5,
                                                  display: 'flex', gap: 8, alignItems: 'baseline' }}>
                        <span style={{ fontSize: 15 }}>{ITIN_TYPE_ICON[item.type] || '📝'}</span>
                        <span style={{ flex: 1 }}>
                          {hotelLabel && (
                            <span style={{ color: '#8ab4f8', fontSize: 11, fontWeight: 600 }}>{hotelLabel}</span>
                          )}
                          {item.title}
                        </span>
                        {item.startTime && (
                          <span style={{ color: item._defaultTime ? '#4a5870' : '#6b7fa8',
                                         fontSize: 12, flexShrink: 0,
                                         fontStyle: item._defaultTime ? 'italic' : 'normal' }}>
                            {item.startTime}{item.endTime && !item._synthetic && !hotelCheckoutDates[item.id] ? ' → ' + item.endTime : ''}
                          </span>
                        )}
                      </div>
                    );
                  })}
                  {freeBlocks.length > 0 && (
                    <div style={{ marginTop: 10, paddingTop: 8, borderTop: '1px solid #1a2435' }}>
                      <div style={{ fontSize: 11, color: '#4a6040', fontWeight: 600, marginBottom: 4 }}>🟢 Free time</div>
                      {freeBlocks.map(function(fb, fi) {
                        var h = Math.floor(fb.mins / 60), m = fb.mins % 60;
                        var dur = (h > 0 ? h + 'h ' : '') + (m > 0 ? m + 'm' : '');
                        return (
                          <div key={fi} style={{ fontSize: 12, color: '#5a8050', marginBottom: 2 }}>
                            {fb.start} – {fb.end} ({dur.trim()})
                          </div>
                        );
                      })}
                    </div>
                  )}
                </div>
              )}
            </div>
          );
        })
      }

      {/* ── Agenda mode ─────────────────────────────────────────────────── */}
      {viewMode === 'agenda' && orderedDays.map(function(day, dayIdx) {
        const dayItems  = byDay[day] || [];
        const isInRange = tripDays.indexOf(day) !== -1;
        const dayNum    = isInRange ? tripDays.indexOf(day) + 1 : null;
        const isEmpty   = dayItems.length === 0;

        const hasFlight = dayItems.some(function(i) { return i.type === 'flight'; });
        let dayTag = '';
        if (hasFlight) {
          if (day === trip.startDate)    dayTag = '🛬 Arrival Day';
          else if (day === trip.endDate) dayTag = '🛫 Departure Day';
          else                           dayTag = '✈ Travel Day';
        }

        let headerLabel;
        if (day === '__other__')    headerLabel = 'Other';
        else if (dayNum !== null)   headerLabel = 'Day ' + dayNum + ' — ' + formatAgendaDate(day);
        else                        headerLabel = formatAgendaDate(day);

        return (
          <div key={day} style={{ marginBottom: 20 }}>
            {/* Day header */}
            <div style={{ display: 'flex', alignItems: 'center', gap: 8,
                          borderBottom: '1px solid #2a3a50', paddingBottom: 6, marginBottom: 10 }}>
              <div style={{ fontWeight: 700, color: '#8ab4f8', fontSize: 13, letterSpacing: 0.3 }}>
                {headerLabel}
              </div>
              {dayTag && (
                <span style={{ fontSize: 11, fontWeight: 600, color: '#5c9eff',
                               background: '#0d2040', borderRadius: 10,
                               padding: '2px 8px', whiteSpace: 'nowrap' }}>
                  {dayTag}
                </span>
              )}
            </div>

            {/* Empty day placeholder */}
            {isEmpty && (
              <div style={{ color: '#3a4a60', fontSize: 12, fontStyle: 'italic',
                            padding: '6px 0 6px 64px' }}>
                No events scheduled
              </div>
            )}

            {/* Items */}
            {dayItems.map(function(item) {
              return (
                <div key={item.id} style={{
                  display: 'flex', alignItems: 'flex-start', gap: 10,
                  padding: '9px 6px', borderBottom: '1px solid #1a2435',
                }}>
                  {/* Time + optional TZ badge */}
                  {(function() {
                    var tz = '';
                    if (item.metadata) { try { tz = (JSON.parse(item.metadata).timezone) || ''; } catch(e){} }
                    var tzLabel = tz ? (ITIN_TZ_ABBR[tz] || tz.split('/').pop()) : '';
                    return (
                      <div style={{ width: 54, flexShrink: 0, textAlign: 'right',
                                    paddingTop: 3, fontVariantNumeric: 'tabular-nums' }}>
                        <div style={{ color: item._defaultTime ? '#4a5870' : '#6b7fa8',
                                      fontSize: 12, fontStyle: item._defaultTime ? 'italic' : 'normal' }}>
                          {item.startTime || React.createElement('span', { style: { color: '#3a4a60' } }, '·')}
                        </div>
                        {tzLabel && (
                          <div style={{ fontSize: 10, color: '#4d6080', marginTop: 1 }}>{tzLabel}</div>
                        )}
                      </div>
                    );
                  })()}
                  {/* Icon */}
                  <div style={{ fontSize: 17, flexShrink: 0, paddingTop: 1 }}>
                    {ITIN_TYPE_ICON[item.type] || '📝'}
                  </div>
                  {/* Content */}
                  <div style={{ flex: 1, minWidth: 0 }}>
                    <div style={{ color: '#e8eaed', fontSize: 14, fontWeight: 500,
                                  whiteSpace: 'nowrap', overflow: 'hidden', textOverflow: 'ellipsis' }}>
                      {item.type === 'hotel' && (item._synthetic || hotelCheckoutDates[item.id]) && (
                        <span style={{ color: '#8ab4f8', fontSize: 10, fontWeight: 600,
                                       display: 'block', textTransform: 'uppercase', letterSpacing: 0.5,
                                       marginBottom: 1, overflow: 'visible', whiteSpace: 'nowrap' }}>
                          {item._synthetic ? '← Check out' : 'Check in →'}
                        </span>
                      )}
                      {item.title}
                      {item.endTime && item.startTime && !item._synthetic && !hotelCheckoutDates[item.id] && (
                        <span style={{ color: '#6b7fa8', fontWeight: 400, fontSize: 12, marginLeft: 8 }}>
                          → {item.endTime}
                        </span>
                      )}
                    </div>
                    {item.location && (
                      <div style={{ color: '#9aa0a6', fontSize: 12, marginTop: 2 }}>📍 {item.location}</div>
                    )}
                    {item.notes && (
                      <div style={{ color: '#5f6368', fontSize: 12, fontStyle: 'italic', marginTop: 2 }}>
                        {item.notes}
                      </div>
                    )}
                    {item.type === 'calendar' && item.metadata && (function() {
                      try {
                        var m = JSON.parse(item.metadata);
                        return m.calendarName
                          ? React.createElement('div', { style: { color: '#4d6080', fontSize: 11, marginTop: 2 } },
                              '📅 ' + m.calendarName)
                          : null;
                      } catch(e) { return null; }
                    })()}
                  </div>
                  {/* Edit/delete (manual items only, not synthetic checkout rows) */}
                  {item.source !== 'calendar' && !item._synthetic && (
                    <div style={{ display: 'flex', gap: 4, flexShrink: 0 }}>
                      <button onClick={function() { onEdit(item); }} disabled={busy} title="Edit"
                        style={{ background: 'transparent', border: 'none', color: '#8ab4f8',
                                 cursor: 'pointer', fontSize: 14, padding: '2px 6px' }}>✏️</button>
                      <button onClick={function() { onDelete(item.id); }} disabled={busy} title="Delete"
                        style={{ background: 'transparent', border: 'none', color: '#9aa0a6',
                                 cursor: 'pointer', fontSize: 14, padding: '2px 6px' }}>🗑</button>
                    </div>
                  )}
                </div>
              );
            })}
          </div>
        );
      })}
    </div>
  );
}

// Accordion panel: all trips as expandable sections within "My Itinerary" sub-tab
function TravelItineraryPanel({
  trips, itineraries, tripMeta, busy, autoExpandKey,
  onExpandTrip, onAddItinItem, onEditItinItem, onDeleteItinItem,
  onSetTripMeta, onLoadTripMeta, onGoToPacking,
}) {
  const [expanded, setExpanded] = React.useState(function() {
    return autoExpandKey ? new Set([autoExpandKey]) : new Set();
  });

  // Auto-expand when user clicks a trip card in My Trips
  React.useEffect(function() {
    if (!autoExpandKey) return;
    setExpanded(function(prev) {
      if (prev.has(autoExpandKey)) return prev;
      const next = new Set(prev);
      next.add(autoExpandKey);
      return next;
    });
  }, [autoExpandKey]);

  function toggleTrip(tripKey, t) {
    setExpanded(function(prev) {
      const next = new Set(prev);
      if (next.has(tripKey)) {
        next.delete(tripKey);
      } else {
        next.add(tripKey);
        // Lazy-load itinerary on first open
        if (!itineraries[tripKey]) onExpandTrip(t);
        // Lazy-load trip meta on first open
        if (onLoadTripMeta && tripMeta && tripMeta[tripKey] === undefined) onLoadTripMeta(tripKey);
      }
      return next;
    });
  }

  if (!trips || trips.length === 0) {
    return (
      <div className="empty-state">
        <div style={{ fontSize: 36, marginBottom: 12 }}>✈️</div>
        <div>No upcoming trips found.</div>
        <div style={{ fontSize: 12, color: '#4d6080', marginTop: 8 }}>
          Add multi-day travel events to your calendar to see them here.
        </div>
      </div>
    );
  }

  return (
    <div>
      {trips.map(function(t) {
        const tripKey   = `${t.startDate}|${t.label}`;
        const isOpen    = expanded.has(tripKey);
        const tripData  = itineraries[tripKey];
        const isLoading = tripData === 'loading';

        return (
          <div key={tripKey} style={{ marginBottom: 12, border: '1px solid #2a3a50',
                                      borderRadius: 10, overflow: 'hidden' }}>

            {/* Accordion header */}
            <div onClick={() => toggleTrip(tripKey, t)}
              style={{ display: 'flex', alignItems: 'center', gap: 12, padding: '12px 16px',
                       background: isOpen ? '#131e2e' : '#0d1117', cursor: 'pointer',
                       userSelect: 'none', transition: 'background .15s' }}>
              <div style={{ flex: 1 }}>
                <div style={{ fontWeight: 700, fontSize: 15, color: '#dde1f0' }}>{t.label}</div>
                <div style={{ fontSize: 12, color: '#6b7fa8', marginTop: 2 }}>{t.startDate} – {t.endDate}</div>
              </div>
              <div style={{ fontSize: 12, fontWeight: 600, color: '#5c9eff', background: '#0d2040',
                            borderRadius: 12, padding: '3px 10px', whiteSpace: 'nowrap' }}>
                {t.daysAway === 0 ? 'Today!' : t.daysAway === 1 ? 'Tomorrow' : `${t.daysAway} days`}
              </div>
              <div style={{ fontSize: 16, color: '#8ab4f8',
                            transform: isOpen ? 'rotate(180deg)' : 'rotate(0deg)',
                            transition: 'transform .2s', lineHeight: 1 }}>
                ▾
              </div>
            </div>

            {/* Accordion body */}
            {isOpen && (
              <div style={{ padding: '0 16px 16px', background: '#0d1117',
                            borderTop: '1px solid #2a3a50' }}>
                {isLoading ? (
                  <div style={{ padding: '24px 0', textAlign: 'center',
                                color: '#6b7fa8', fontSize: 13 }}>
                    Loading itinerary…
                  </div>
                ) : (
                  <ItineraryView
                    trip={{ ...t, tripKey }}
                    itinerary={tripData}
                    loading={false}
                    busy={busy}
                    tripContext={tripMeta ? tripMeta[tripKey] : undefined}
                    onSetContext={function(ctx) { if (onSetTripMeta) onSetTripMeta(tripKey, ctx, ''); }}
                    onLoadContext={function() { if (onLoadTripMeta) onLoadTripMeta(tripKey); }}
                    onGoToPacking={function() { if (onGoToPacking) onGoToPacking(tripKey); }}
                    onAdd={function() { onAddItinItem(tripKey, t.startDate, t.endDate); }}
                    onEdit={function(item) { onEditItinItem(item, tripKey, t.startDate, t.endDate); }}
                    onDelete={function(id) { onDeleteItinItem(id, tripKey); }}
                  />
                )}
              </div>
            )}
          </div>
        );
      })}
    </div>
  );
}

// ---- Packing Panel ----------------------------------------------------------

function PackingPanel({
  trips, packingItems, tripMeta, busy, focusTripKey,
  onLoadPacking, onSetTripMeta, onGeneratePacking,
  onToggleItem, onAddItem, onDeleteItem,
}) {
  const [expanded,   setExpanded]   = React.useState(function() {
    return focusTripKey ? new Set([focusTripKey]) : new Set();
  });
  const [personTab,  setPersonTab]  = React.useState({}); // { [tripKey]: 'all'|'ahmed'|'victoria'|'shared' }
  const [addForm,    setAddForm]    = React.useState(null); // null | { tripKey, person, category, item }

  // Auto-expand when focusTripKey changes
  React.useEffect(function() {
    if (!focusTripKey) return;
    setExpanded(function(prev) {
      const next = new Set(prev);
      next.add(focusTripKey);
      return next;
    });
    if (!packingItems[focusTripKey]) onLoadPacking(focusTripKey);
  }, [focusTripKey]);

  function toggleEntry(tripKey) {
    setExpanded(function(prev) {
      const next = new Set(prev);
      if (next.has(tripKey)) {
        next.delete(tripKey);
      } else {
        next.add(tripKey);
        if (!packingItems[tripKey]) onLoadPacking(tripKey);
      }
      return next;
    });
  }

  if (!trips || trips.length === 0) {
    return (
      <div className="empty-state">
        <div style={{ fontSize: 36, marginBottom: 12 }}>🎒</div>
        <div>No upcoming trips found.</div>
        <div style={{ fontSize: 12, color: '#4d6080', marginTop: 8 }}>
          Trips pulled from your shared calendar will appear here.
        </div>
      </div>
    );
  }

  return (
    <div>
      {trips.map(function(t) {
        const tripKey   = t.startDate + '|' + t.label;
        const isOpen    = expanded.has(tripKey);
        const packData  = packingItems[tripKey];
        const isLoading = packData === 'loading';
        const items     = (packData && packData !== 'loading') ? packData.items : [];
        const meta      = (tripMeta && tripMeta[tripKey] && tripMeta[tripKey] !== 'loading')
                          ? tripMeta[tripKey] : { context: '', notes: '' };

        const total   = items.length;
        const checked = items.filter(function(it) { return it.checked; }).length;
        const pct     = total > 0 ? Math.round((checked / total) * 100) : 0;

        const curPerson = (personTab[tripKey] || 'all');
        const filteredItems = curPerson === 'all'
          ? items
          : items.filter(function(it) { return it.person === curPerson; });

        // Group by person + category
        function buildSections(itemList) {
          const personOrder = ['ahmed', 'victoria', 'shared'];
          const sections    = {};
          itemList.forEach(function(it) {
            const p = it.person || 'shared';
            if (!sections[p]) sections[p] = {};
            if (!sections[p][it.category]) sections[p][it.category] = [];
            sections[p][it.category].push(it);
          });
          return curPerson === 'all'
            ? personOrder.filter(function(p) { return sections[p]; }).map(function(p) { return { person: p, cats: sections[p] }; })
            : (sections[curPerson] ? [{ person: curPerson, cats: sections[curPerson] }] : []);
        }
        const sections = buildSections(filteredItems);

        const PERSON_LABEL = { ahmed: '👤 Ahmed', victoria: '👤 Victoria', shared: '🤝 Shared' };

        const hasAiItems = items.some(function(it) { return it.source === 'ai'; });

        return (
          <div key={tripKey} style={{ marginBottom: 12, border: '1px solid #2a3a50',
                                      borderRadius: 10, overflow: 'hidden' }}>
            {/* Accordion header */}
            <div onClick={function() { toggleEntry(tripKey); }}
              style={{ display: 'flex', alignItems: 'center', gap: 12, padding: '12px 16px',
                       background: isOpen ? '#131e2e' : '#0d1117', cursor: 'pointer',
                       userSelect: 'none', transition: 'background .15s' }}>
              <div style={{ flex: 1 }}>
                <div style={{ fontWeight: 700, fontSize: 15, color: '#dde1f0' }}>{t.label}</div>
                <div style={{ fontSize: 12, color: '#6b7fa8', marginTop: 2 }}>{t.startDate} – {t.endDate}</div>
              </div>
              {meta.context && (
                <span style={{
                  fontSize: 11, fontWeight: 600,
                  color: CONTEXT_COLORS[meta.context] || '#5c9eff',
                  background: (CONTEXT_COLORS[meta.context] || '#5c9eff') + '22',
                  borderRadius: 10, padding: '2px 8px', whiteSpace: 'nowrap',
                }}>
                  {meta.context}
                </span>
              )}
              {total > 0 && (
                <span style={{ fontSize: 12, color: pct === 100 ? '#56cc9d' : '#6b7fa8', whiteSpace: 'nowrap' }}>
                  {checked}/{total} packed
                </span>
              )}
              <div style={{ fontSize: 16, color: '#8ab4f8',
                            transform: isOpen ? 'rotate(180deg)' : 'rotate(0deg)',
                            transition: 'transform .2s', lineHeight: 1 }}>▾</div>
            </div>

            {/* Accordion body */}
            {isOpen && (
              <div style={{ padding: '14px 16px', background: '#0d1117',
                            borderTop: '1px solid #2a3a50' }}>

                {/* Context editor */}
                <div style={{ display: 'flex', alignItems: 'center', gap: 8, marginBottom: 14 }}>
                  <span style={{ fontSize: 12, color: '#6b7fa8', flexShrink: 0 }}>Trip context:</span>
                  <TripContextBadge
                    context={meta.context}
                    onSetContext={function(ctx) { onSetTripMeta(tripKey, ctx, meta.notes || ''); }}
                    busy={busy}
                  />
                </div>

                {/* Progress bar */}
                {total > 0 && (
                  <div style={{ marginBottom: 14 }}>
                    <div style={{ height: 6, background: '#1a2435', borderRadius: 3, overflow: 'hidden', marginBottom: 5 }}>
                      <div style={{
                        height: '100%', width: pct + '%',
                        background: pct === 100 ? '#56cc9d' : '#5c9eff',
                        transition: 'width .3s ease', borderRadius: 3,
                      }} />
                    </div>
                    <div style={{ fontSize: 11, color: '#6b7fa8' }}>
                      {checked} of {total} items packed ({pct}%)
                    </div>
                  </div>
                )}

                {/* Person filter pills */}
                <div style={{ display: 'flex', gap: 6, marginBottom: 14, flexWrap: 'wrap' }}>
                  {['all', 'ahmed', 'victoria', 'shared'].map(function(p) {
                    const label = p === 'all' ? 'All' : p === 'ahmed' ? 'Ahmed' : p === 'victoria' ? 'Victoria' : 'Shared';
                    const active = curPerson === p;
                    return (
                      <button key={p}
                        onClick={function() { setPersonTab(function(prev) { return Object.assign({}, prev, { [tripKey]: p }); }); }}
                        style={{
                          padding: '4px 12px', borderRadius: 12, border: 'none', fontSize: 12,
                          fontWeight: active ? 700 : 400, cursor: 'pointer',
                          background: active ? '#1e3a5f' : '#131e2e',
                          color: active ? '#8ab4f8' : '#6b7fa8',
                        }}>
                        {label}
                      </button>
                    );
                  })}
                </div>

                {/* Generate button */}
                <button
                  disabled={busy || isLoading}
                  onClick={function() {
                    if (hasAiItems && !window.confirm('Regenerating will replace VERA\'s suggestions. Manually added items are kept. Continue?')) return;
                    onGeneratePacking(tripKey, t.startDate, t.endDate);
                  }}
                  style={{
                    padding: '7px 14px', borderRadius: 6, border: '1px solid #2a3a50',
                    background: '#0d1a2e', color: '#8ab4f8', fontWeight: 600,
                    cursor: busy || isLoading ? 'default' : 'pointer', fontSize: 13,
                    marginBottom: 16, opacity: busy || isLoading ? .5 : 1,
                  }}>
                  {isLoading ? '⏳ Generating…' : (hasAiItems ? '✨ Regenerate' : '✨ Generate with VERA')}
                </button>

                {/* Loading state */}
                {isLoading && (
                  <div style={{ color: '#6b7fa8', fontSize: 13, textAlign: 'center', padding: '12px 0' }}>
                    VERA is building your packing list…
                  </div>
                )}

                {/* Empty state */}
                {!isLoading && total === 0 && (
                  <div style={{ color: '#3a4a60', fontSize: 13, fontStyle: 'italic',
                                textAlign: 'center', padding: '12px 0' }}>
                    No items yet. Click Generate to build your packing list.
                  </div>
                )}

                {/* Item list — grouped by person section → category */}
                {!isLoading && sections.map(function(sec) {
                  const catNames = Object.keys(sec.cats).sort();
                  return (
                    <div key={sec.person} style={{ marginBottom: 16 }}>
                      {curPerson === 'all' && (
                        <div style={{ fontSize: 11, fontWeight: 700, color: '#4d6080',
                                      letterSpacing: .5, marginBottom: 8, paddingTop: 4,
                                      borderTop: '1px solid #1a2435' }}>
                          {PERSON_LABEL[sec.person] || sec.person.toUpperCase()}
                        </div>
                      )}
                      {catNames.map(function(cat) {
                        return (
                          <div key={cat} style={{ marginBottom: 10 }}>
                            <div style={{ fontSize: 11, color: '#5c7090', fontWeight: 600,
                                          marginBottom: 4, letterSpacing: .3 }}>
                              {PACK_CAT_ICON[cat] || '📦'} {cat}
                            </div>
                            {sec.cats[cat].map(function(it) {
                              return (
                                <div key={it.id} style={{
                                  display: 'flex', alignItems: 'center', gap: 8,
                                  padding: '4px 0', borderBottom: '1px solid #111a28',
                                }}>
                                  <input type="checkbox" checked={it.checked}
                                    onChange={function() { onToggleItem(it.id, tripKey, it.checked); }}
                                    style={{ cursor: 'pointer', accentColor: '#5c9eff', flexShrink: 0 }}
                                  />
                                  <span style={{
                                    flex: 1, fontSize: 13,
                                    color: it.checked ? '#4d6080' : '#dde1f0',
                                    textDecoration: it.checked ? 'line-through' : 'none',
                                  }}>
                                    {it.item}
                                    {it.source === 'manual' && (
                                      <span style={{ fontSize: 10, color: '#3a5070',
                                                     marginLeft: 6, fontStyle: 'italic' }}>manual</span>
                                    )}
                                  </span>
                                  <button onClick={function() { onDeleteItem(it.id, tripKey); }}
                                    style={{ background: 'none', border: 'none', color: '#3a4a60',
                                             cursor: 'pointer', fontSize: 14, padding: '0 4px',
                                             lineHeight: 1 }}>
                                    🗑
                                  </button>
                                </div>
                              );
                            })}
                          </div>
                        );
                      })}
                    </div>
                  );
                })}

                {/* Add item form */}
                {addForm && addForm.tripKey === tripKey ? (
                  <div style={{ display: 'flex', gap: 6, flexWrap: 'wrap', marginTop: 10,
                                padding: '10px 12px', background: '#0a1220',
                                borderRadius: 8, border: '1px solid #2a3a50' }}>
                    <select value={addForm.person}
                      onChange={function(ev) { setAddForm(function(prev) { return Object.assign({}, prev, { person: ev.target.value }); }); }}
                      style={{ padding: '5px 8px', borderRadius: 6, border: '1px solid #2a3a50',
                               background: '#131e2e', color: '#dde1f0', fontSize: 12 }}>
                      <option value="ahmed">Ahmed</option>
                      <option value="victoria">Victoria</option>
                      <option value="shared">Shared</option>
                    </select>
                    <input type="text" placeholder="Category" value={addForm.category}
                      list={'pack-cats-' + tripKey}
                      onChange={function(ev) { setAddForm(function(prev) { return Object.assign({}, prev, { category: ev.target.value }); }); }}
                      style={{ width: 120, padding: '5px 8px', borderRadius: 6, border: '1px solid #2a3a50',
                               background: '#131e2e', color: '#dde1f0', fontSize: 12 }}
                    />
                    <datalist id={'pack-cats-' + tripKey}>
                      {Object.keys(PACK_CAT_ICON).map(function(c) { return <option key={c} value={c} />; })}
                    </datalist>
                    <input type="text" placeholder="Item name" value={addForm.item}
                      onChange={function(ev) { setAddForm(function(prev) { return Object.assign({}, prev, { item: ev.target.value }); }); }}
                      onKeyDown={function(ev) {
                        if (ev.key === 'Enter' && addForm.item.trim() && addForm.category.trim()) {
                          onAddItem(tripKey, addForm.person, addForm.category.trim(), addForm.item.trim());
                          setAddForm(null);
                        }
                        if (ev.key === 'Escape') setAddForm(null);
                      }}
                      style={{ flex: 1, minWidth: 120, padding: '5px 8px', borderRadius: 6,
                               border: '1px solid #2a3a50', background: '#131e2e',
                               color: '#dde1f0', fontSize: 12 }}
                    />
                    <button
                      disabled={busy || !addForm.item.trim() || !addForm.category.trim()}
                      onClick={function() {
                        if (!addForm.item.trim() || !addForm.category.trim()) return;
                        onAddItem(tripKey, addForm.person, addForm.category.trim(), addForm.item.trim());
                        setAddForm(null);
                      }}
                      style={{ padding: '5px 12px', borderRadius: 6, border: 'none',
                               background: '#5c9eff', color: '#0d1117', fontWeight: 700,
                               cursor: 'pointer', fontSize: 13 }}>
                      + Add
                    </button>
                    <button onClick={function() { setAddForm(null); }}
                      style={{ padding: '5px 10px', borderRadius: 6, border: '1px solid #2a3a50',
                               background: 'none', color: '#6b7fa8', cursor: 'pointer', fontSize: 12 }}>
                      Cancel
                    </button>
                  </div>
                ) : (
                  <button
                    onClick={function() {
                      setAddForm({ tripKey, person: curPerson === 'all' ? 'ahmed' : curPerson, category: '', item: '' });
                    }}
                    style={{ marginTop: 8, padding: '5px 12px', borderRadius: 6,
                             border: '1px dashed #2a3a50', background: 'transparent',
                             color: '#6b7fa8', cursor: 'pointer', fontSize: 12 }}>
                    ➕ Add item
                  </button>
                )}
              </div>
            )}
          </div>
        );
      })}
    </div>
  );
}

// ---- Travel Tab -------------------------------------------------------------

function TravelTab({ pto, itineraries, packingItems, tripMeta, packingFocusTripKey, busy,
                     onSelectTrip, onExpandTrip,
                     onAddItinItem, onEditItinItem, onDeleteItinItem,
                     onSetTripMeta, onLoadTripMeta,
                     onLoadPacking, onGeneratePacking,
                     onTogglePackingItem, onAddPackingItem, onDeletePackingItem,
                     onGoToPacking }) {
  const [sub,           setSub]           = React.useState('trips');
  const [autoExpandKey, setAutoExpandKey] = React.useState(null);

  const upcomingTravel = (pto && pto.upcomingTravel) || [];

  // Auto-switch to packing sub-tab when packingFocusTripKey changes
  React.useEffect(function() {
    if (!packingFocusTripKey) return;
    setSub('packing');
    setAutoExpandKey(packingFocusTripKey);
  }, [packingFocusTripKey]);

  function handleTripClick(t) {
    const tripKey = `${t.startDate}|${t.label}`;
    onSelectTrip({ ...t, tripKey }); // triggers loadItinerary if not cached
    setAutoExpandKey(tripKey);       // tells accordion to open this trip
    setSub('itinerary');
  }

  const subTabs = [
    { id: 'trips',      label: '✈️ My Trips' },
    { id: 'itinerary',  label: '🗺️ My Itinerary' },   // fixed label
    { id: 'packing',    label: '🎒 Packing' },
    { id: 'budget',     label: '💰 Budget' },
    { id: 'bucketlist', label: '🪣 Bucket List' },
  ];

  return (
    <div>
      {/* Sub-tab pills */}
      <div className="subtab-row">
        {subTabs.map(s => (
          <button
            key={s.id}
            className={`subtab-btn${sub === s.id ? ' active' : ''}`}
            onClick={() => setSub(s.id)}
          >{s.label}</button>
        ))}
      </div>

      {/* My Trips — live from PTO upcomingTravel */}
      {sub === 'trips' && (
        upcomingTravel.length === 0
          ? (
            <div className="empty-state">
              <div style={{ fontSize: 36, marginBottom: 12 }}>✈️</div>
              <div>No upcoming travel found.</div>
              <div style={{ fontSize: 12, color: '#4d6080', marginTop: 8 }}>
                Travel events are pulled from your shared "AE&amp;VV - Our Joint Chaos" calendar.
              </div>
            </div>
          )
          : (
            <div>
              {upcomingTravel.map((t, i) => (
                <div key={i} className="bento-card"
                  style={{ cursor: 'pointer', transition: 'border-color .15s' }}
                  onClick={() => handleTripClick(t)}>
                  <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center' }}>
                    <div>
                      <div style={{ fontWeight: 700, fontSize: 15, color: '#dde1f0', marginBottom: 4 }}>
                        {t.label}
                      </div>
                      <div style={{ fontSize: 12, color: '#6b7fa8' }}>{t.startDate} – {t.endDate}</div>
                    </div>
                    <div style={{ display: 'flex', alignItems: 'center', gap: 12 }}>
                      <div style={{ fontSize: 13, color: '#5c9eff', fontWeight: 600, whiteSpace: 'nowrap' }}>
                        {t.daysAway === 0 ? 'Today!' : t.daysAway === 1 ? 'Tomorrow' : `${t.daysAway} days away`}
                      </div>
                      <div style={{ fontSize: 12, color: '#8ab4f8' }}>View Itinerary →</div>
                    </div>
                  </div>
                </div>
              ))}
            </div>
          )
      )}

      {/* My Itinerary — accordion across all trips */}
      {sub === 'itinerary' && (
        <TravelItineraryPanel
          trips={upcomingTravel}
          itineraries={itineraries}
          tripMeta={tripMeta}
          busy={busy}
          autoExpandKey={autoExpandKey}
          onExpandTrip={onExpandTrip}
          onAddItinItem={onAddItinItem}
          onEditItinItem={onEditItinItem}
          onDeleteItinItem={onDeleteItinItem}
          onSetTripMeta={onSetTripMeta}
          onLoadTripMeta={onLoadTripMeta}
          onGoToPacking={onGoToPacking}
        />
      )}

      {/* Packing sub-tab */}
      {sub === 'packing' && (
        <PackingPanel
          trips={upcomingTravel}
          packingItems={packingItems}
          tripMeta={tripMeta}
          busy={busy}
          focusTripKey={autoExpandKey}
          onLoadPacking={onLoadPacking}
          onSetTripMeta={onSetTripMeta}
          onGeneratePacking={onGeneratePacking}
          onToggleItem={onTogglePackingItem}
          onAddItem={onAddPackingItem}
          onDeleteItem={onDeletePackingItem}
        />
      )}

      {/* Placeholder sub-tabs (Budget, Bucket List) */}
      {sub !== 'trips' && sub !== 'itinerary' && sub !== 'packing' && (
        <div className="empty-state">
          <div style={{ fontSize: 36, marginBottom: 12 }}>
            {sub === 'budget' ? '💰' : '🪣'}
          </div>
          <div style={{ color: '#dde1f0', marginBottom: 6 }}>
            {sub === 'budget' ? 'Trip Budget' : 'Bucket List'}
          </div>
          <div style={{ fontSize: 12, color: '#4d6080' }}>Coming soon</div>
        </div>
      )}
    </div>
  );
}

// ---- Shopping tab -----------------------------------------------------------

function ShoppingTab({ stores, onToggle, onAddItem, busy }) {
  const [activeStore, setActiveStore] = React.useState(null);

  React.useEffect(() => {
    if (stores.length > 0) {
      setActiveStore(prev =>
        stores.find(s => s.tabId === prev) ? prev : stores[0].tabId
      );
    } else {
      setActiveStore(null);
    }
  }, [stores]);

  if (!stores.length) {
    return (
      <div className="empty-state">
        <div style={{ fontSize: 32, marginBottom: 12 }}>🛒</div>
        <div>No shopping list connected.</div>
        <div style={{ fontSize: 13, color: '#6b7fa8', marginTop: 8 }}>
          Set <code style={{ background: '#13244d', padding: '1px 6px', borderRadius: 4 }}>SHOPPING_LIST_DOC_ID</code> in Script Properties to connect your Google Doc.
        </div>
      </div>
    );
  }

  const current = stores.find(s => s.tabId === activeStore);

  return (
    <div>
      {/* Store sub-tabs */}
      <div style={{
        display: 'flex', gap: 2, flexWrap: 'wrap', alignItems: 'center',
        borderBottom: '1px solid #1e3060', marginBottom: 20,
      }}>
        {stores.map(s => {
          const pending  = s.items.filter(i => !i.done).length;
          const isActive = s.tabId === activeStore;
          return (
            <button
              key={s.tabId}
              onClick={() => setActiveStore(s.tabId)}
              style={{
                background: isActive ? '#0d1b3e' : 'none',
                border: 'none', cursor: 'pointer',
                padding: '9px 16px', fontSize: 13, fontWeight: 600,
                color: isActive ? '#c9a84c' : '#8a9abf',
                borderBottom: isActive ? '2px solid #c9a84c' : '2px solid transparent',
                marginBottom: -1, display: 'flex', alignItems: 'center', gap: 7,
                borderRadius: '4px 4px 0 0',
              }}
            >
              {s.storeName}
              <span style={{
                background: pending === 0 ? 'rgba(67,160,71,0.2)' : 'rgba(201,168,76,0.15)',
                color: pending === 0 ? '#43a047' : '#c9a84c',
                borderRadius: 20, padding: '1px 7px', fontSize: 11, fontWeight: 700,
              }}>
                {pending === 0 ? '✓' : pending}
              </span>
            </button>
          );
        })}
        <button
          className="btn btn-primary"
          style={{ fontSize: 12, marginLeft: 'auto', marginBottom: 4, flexShrink: 0 }}
          disabled={busy}
          onClick={() => onAddItem && onAddItem()}
        >
          + Add Item
        </button>
      </div>

      {/* Item list */}
      {current && (
        current.items.length === 0
          ? <div className="empty-state" style={{ padding: 32 }}>This store has no items listed.</div>
          : <div style={{ display: 'flex', flexDirection: 'column', gap: 6 }}>
              {current.items.map((item, i) => (
                <div
                  key={i}
                  onClick={() => !busy && onToggle(current.tabId, item.index, item.done)}
                  style={{
                    display: 'flex', alignItems: 'center', gap: 12,
                    padding: '11px 16px', borderRadius: 8,
                    background: item.done ? 'rgba(67,160,71,0.05)' : '#0d1b3e',
                    border: '1px solid ' + (item.done ? 'rgba(67,160,71,0.15)' : '#1e3060'),
                    cursor: busy ? 'wait' : 'pointer',
                    transition: 'background 0.15s',
                  }}
                >
                  <input
                    type="checkbox"
                    checked={item.done}
                    readOnly
                    style={{ accentColor: '#43a047', width: 16, height: 16, pointerEvents: 'none', flexShrink: 0 }}
                  />
                  <span style={{
                    flex: 1, fontSize: 14,
                    color: item.done ? '#4a5a7a' : '#dde1f0',
                    textDecoration: item.done ? 'line-through' : 'none',
                  }}>
                    {item.text}
                  </span>
                </div>
              ))}
            </div>
      )}
    </div>
  );
}

// ---- Add shopping item modal ------------------------------------------------

function AddItemModal({ stores, onSave, onClose, busy }) {
  const [selectedStore, setSelectedStore] = React.useState(stores[0]?.tabId || '');
  const [text, setText] = React.useState('');

  function handleKey(e) {
    if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); if (text.trim() && selectedStore) onSave(selectedStore, text.trim()); }
    if (e.key === 'Escape') onClose();
  }

  return (
    <div className="modal-overlay" onClick={e => e.target === e.currentTarget && onClose()}>
      <div className="modal">
        <h2>+ Add Shopping Item</h2>
        <p>Choose a store and type the item to add.</p>

        <div className="form-group">
          <label className="form-label">Store</label>
          <div style={{ display: 'flex', gap: 8, flexWrap: 'wrap' }}>
            {stores.map(s => (
              <button
                key={s.tabId}
                onClick={() => setSelectedStore(s.tabId)}
                style={{
                  padding: '6px 14px', borderRadius: 6, fontSize: 13, fontWeight: 600,
                  cursor: 'pointer', border: 'none',
                  background: selectedStore === s.tabId ? '#c9a84c' : '#13244d',
                  color: selectedStore === s.tabId ? '#0d1b3e' : '#8a9abf',
                }}
              >
                {s.storeName}
              </button>
            ))}
          </div>
        </div>

        <div className="form-group">
          <label className="form-label">Item</label>
          <input
            className="form-input"
            value={text}
            onChange={e => setText(e.target.value)}
            onKeyDown={handleKey}
            placeholder="Item name…"
            autoFocus
          />
        </div>

        <div className="modal-actions">
          <button className="btn btn-ghost" onClick={onClose}>Cancel</button>
          <button
            className="btn btn-primary"
            onClick={() => text.trim() && selectedStore && onSave(selectedStore, text.trim())}
            disabled={busy || !text.trim() || !selectedStore}
          >
            Add Item
          </button>
        </div>
      </div>
    </div>
  );
}

  'Resolutions': '#7c5cbf',
  'To Do':       '#1565c0',
  'Doing':       '#c9a84c',
  'Parked':      '#4d6080',
  'Done':        '#43a047',
};

function GoalsTab({ goals, dragGoalId, dragOverCol, onDragStart, onDragOver, onDrop, onAddGoal, onEditGoal, onDeleteGoal, busy }) {

      <div style={{ marginBottom: 14, color: '#8ab4f8', fontSize: 13 }}>
        Drag goal cards between columns to update their status.
      </div>
      <div className="kanban-board">
        {GOAL_STATUSES.map(col => {
          const colGoals = goals.filter(g => g.status === col);
          const isOver   = dragOverCol === col;

            <div
              key={col}
              className={`kanban-col${isOver ? ' drag-over' : ''}`}

                <div
                  key={goal.id}
                  className={`goal-card${dragGoalId === goal.id ? ' dragging' : ''}`}
                  draggable
                  onDragStart={() => onDragStart(goal.id)}

                  <div className="goal-card-title">{goal.title}</div>

                    <button className="btn-edit" title="Edit" disabled={busy} onClick={() => onEditGoal(goal)}>✏️</button>
                    <button className="btn-edit" title="Delete" disabled={busy} onClick={() => onDeleteGoal(goal.id)} style={{ color: '#e53935' }}>🗑</button>
                  </div>
                </div>
              ))}

    if (projects.length > 0) {
      setActiveProject(prev =>
        projects.find(p => p.projectId === prev) ? prev : projects[0].projectId
      );

      setActiveProject(null);
    }

  if (!projects.length) {
    return (
      <div className="empty-state">
        <div style={{ fontSize: 32, marginBottom: 12 }}>📂</div>

          Try: "Create a project for planning our Europe trip"
        </div>
      </div>

    <div>

        display: 'flex', gap: 2, flexWrap: 'wrap',

          return (

              key={p.projectId}
              onClick={() => setActiveProject(p.projectId)}

                background: isActive ? '#0d1b3e' : 'none',
                border: 'none', cursor: 'pointer',
                padding: '9px 16px', fontSize: 13, fontWeight: 600,
                color: isActive ? '#c9a84c' : '#8a9abf',
                borderBottom: isActive ? '2px solid #c9a84c' : '2px solid transparent',
                marginBottom: -1, display: 'flex', alignItems: 'center', gap: 7,
                borderRadius: '4px 4px 0 0',
              }}
            >
              {p.projectName}
              <span style={{
                background: pending === 0 ? 'rgba(67,160,71,0.2)' : 'rgba(201,168,76,0.15)',
                color: pending === 0 ? '#43a047' : '#c9a84c',
                borderRadius: 20, padding: '1px 7px', fontSize: 11, fontWeight: 700,
              }}>
                {pending === 0 ? '✓' : pending}
              </span>
            </button>

      {/* Selected project task list */}
      {current && (
        <div>
          {/* Toolbar: task count + Add Task button */}
          <div style={{ display: 'flex', alignItems: 'center', justifyContent: 'space-between', marginBottom: 12 }}>
            <span style={{ fontSize: 12, color: '#6b7fa8' }}>
              {current.tasks.filter(t => t.status !== 'Done').length} pending · {current.tasks.length} total
            </span>
            <button
              className="btn btn-primary"
              style={{ fontSize: 12 }}
              disabled={busy}
              onClick={() => onAddTask && onAddTask(current)}
            >
              + Add Task
            </button>
          </div>

          <div style={{ display: 'flex', flexDirection: 'column', gap: 6 }}>
            {current.tasks.map((t, i) => {
              const done = t.status === 'Done';
              return (
                <div key={i} style={{
                  display: 'flex', alignItems: 'center', gap: 12,
                  padding: '10px 14px', borderRadius: 8,
                  background: done ? 'rgba(67,160,71,0.05)' : '#0d1b3e',
                  border: '1px solid ' + (done ? 'rgba(67,160,71,0.15)' : '#1e3060'),
                }}>
                  <input
                    type="checkbox"
                    checked={done}
                    disabled={done || busy}
                    onChange={() => !done && onCompleteTask(t.rowNum)}
                    style={{ accentColor: '#43a047', width: 16, height: 16, cursor: done ? 'default' : 'pointer', flexShrink: 0 }}
                  />
                  <span style={{
                    flex: 1, fontSize: 14,
                    color: done ? '#4a5a7a' : '#dde1f0',
                    textDecoration: done ? 'line-through' : 'none',
                  }}>
                    {t.task}
                  </span>
                  {t.priority && !done && (
                    <span style={{
                      fontSize: 11, fontWeight: 700,
                      color: PRIORITY_COLORS[t.priority] || '#8a9abf',
                    }}>
                      {t.priority}
                    </span>

                  {t.dueDate && !done && (
                    <span style={{ fontSize: 11, color: '#6b7fa8' }}>{t.dueDate}</span>
                  )}
                  {!done && (
                    <>
                      <button
                        className="btn-edit"
                        disabled={busy}
                        onClick={() => onEditTask && onEditTask(t)}

                        style={{ fontSize: 13 }}

                        ✏️
                      </button>
                      <button
                        className="btn-edit"
                        disabled={busy}
                        onClick={() => onDeleteTask && onDeleteTask(t.rowNum)}
                        title="Delete task"

                        🗑️
                      </button>
                    </>
                  )}

              );
            })}
          </div>

          {/* Progress bar */}
          {(() => {
            const total = current.tasks.length;
            const done  = current.tasks.filter(t => t.status === 'Done').length;
            const pct   = total > 0 ? Math.round((done / total) * 100) : 0;
            return (
              <div style={{ marginTop: 20 }}>
                <div style={{ display: 'flex', justifyContent: 'space-between', fontSize: 12, color: '#6b7fa8', marginBottom: 6 }}>
                  <span>{done} of {total} tasks complete</span>
                  <span>{pct}%</span>
                </div>
                <div style={{ height: 4, background: '#1e3060', borderRadius: 2 }}>
                  <div style={{ height: '100%', width: pct + '%', background: pct === 100 ? '#43a047' : '#c9a84c', borderRadius: 2, transition: 'width 0.3s' }} />
                </div>
              </div>
            );
          })()}
        </div>
      )}
    </div>
  );
}

// ---- PTO tab ----------------------------------------------------------------

function PTOTab({ stats, onTriggerBuffer, busy }) {
  if (!stats) {
    return (
      <div className="empty-state">
        <div style={{ fontSize: 36, marginBottom: 12 }}>🌴</div>
        <div>No PTO data loaded yet.</div>
        <div style={{ fontSize: 13, color: '#6b7fa8', marginTop: 8 }}>
          Make sure <code style={{ background: '#13244d', padding: '1px 6px', borderRadius: 4 }}>pto_*</code> rows are seeded in the Config tab, then refresh.
        </div>
      </div>
    );
  }

  const { used, planned, remaining, config: cfg, burnDown: bd, threeToOneStatus: tto,
          bufferStatus, nextPTO, events, holidays, clearWindows, milestones, upcomingTravel, year } = stats;

  const vacTotal     = (cfg.vacationDays  || 20) + (cfg.rolloverDays || 0);
  const persTotal    = cfg.personalHours  || 48;
  const persUsed     = used.personalHours    || 0;
  const persPlanned  = planned.personalHours || 0;
  const persRemain   = remaining.personalHours ?? (persTotal - persUsed - persPlanned);

  function hrsLabel(hrs) {
    if (!hrs) return '0 hrs';
    const d = hrs / 8;
    const days = Number.isInteger(d) ? d + ' day' + (d !== 1 ? 's' : '') : d.toFixed(1) + ' days';
    return hrs + ' hrs (' + days + ')';
  }

  const paceColor = (bd?.paceStatus === 'ahead') ? '#43a047'
                  : (bd?.paceStatus === 'behind') ? '#e53935' : '#f9a825';

  function pctBar(val, max, color) {
    const pct = max > 0 ? Math.min(100, (val / max) * 100) : 0;
    return (
      <div className="pto-bar-track">
        <div className="pto-bar-fill" style={{ width: pct + '%', background: color }} />
      </div>
    );
  }

  function DotRow({ label, target, usedN, plannedN, hint }) {
    const dots = Array.from({ length: target }).map((_, i) => {
      let bg = 'transparent', border;
      if (i < usedN)               { bg = '#c9a84c'; border = '#c9a84c'; }
      else if (i < usedN + plannedN) { bg = '#3d5fa0'; border = '#3d5fa0'; }
      else                          { border = '#2a3a5e'; }
      return (
        <span key={i} className="pto-dot"
          style={{ background: bg, border: '2px solid ' + border }}
          title={
            i < usedN
              ? '🟡 Used — this block has already been taken'
              : i < usedN + plannedN
              ? '🔵 Planned — on the calendar but not yet taken'
              : '⬜ To schedule — book this to hit your target'
          }
        />
      );
    });
    const done  = usedN + plannedN;
    const left  = target - done;
    return (
      <div className="pto-row">
        <span style={{ flex: 1, fontSize: 13, color: '#dde1f0', cursor: hint ? 'help' : 'default' }}
              title={hint || undefined}>
          {label}{hint ? ' ℹ️' : ''}
        </span>
        <span>{dots}</span>
        <span style={{ fontSize: 11, color: '#6b7fa8', minWidth: 110, textAlign: 'right' }}>
          {done}/{target}
          {usedN > 0 ? ' (' + usedN + ' used' : ''}
          {plannedN > 0 ? (usedN > 0 ? ', ' : ' (') + plannedN + ' planned' : ''}
          {(usedN > 0 || plannedN > 0) ? ')' : ''}
          {left > 0 ? ' · ' + left + ' to go' : ''}
        </span>
      </div>
    );
  }

  const plannedEvents  = (events || []).filter(ev => ev.status === 'Planned');
  const usedEvents     = (events || []).filter(ev => ev.status === 'Used');
  const allPTOEvents   = [...plannedEvents, ...usedEvents];
  const upcomingHols   = (holidays || []).filter(h => {
    const d = h.date ? new Date(h.date + 'T00:00:00') : null;
    return d && d >= new Date();
  });

  return (
    <div>
      {/* Section 1: Balance Cards */}
      <div className="pto-grid-2">
        {/* Vacation */}
        <div className="pto-card">
          <div className="pto-section-title">🏖️ Vacation</div>
          <div className="pto-balance-num" style={{ color: '#c9a84c' }}>
            {remaining.vacationDays}
            <span style={{ fontSize: 14, fontWeight: 400, color: '#6b7fa8', marginLeft: 6 }}>days left</span>
          </div>
          <div className="pto-balance-sub">
            {used.vacationDays} used · {planned.vacationDays} planned
            {cfg.rolloverDays > 0
              ? <> · <span style={{color:'#c9a84c'}}>{cfg.vacationDays}d annual + {cfg.rolloverDays}d rollover = {vacTotal}d total</span></>
              : <> · {vacTotal} total allotted</>
            }
          </div>
          {pctBar(used.vacationDays + planned.vacationDays, vacTotal, '#c9a84c')}
        </div>

        {/* Personal Time */}
        <div className="pto-card">
          <div className="pto-section-title">☀️ Personal Time</div>
          <div className="pto-balance-num" style={{ color: '#5c9eff' }}>
            {persRemain}
            <span style={{ fontSize: 14, fontWeight: 400, color: '#6b7fa8', marginLeft: 6 }}>hrs left</span>
          </div>
          <div className="pto-balance-sub">
            {hrsLabel(persUsed)} used · {persTotal} hrs total ({Math.floor(persTotal / 8)} days)
          </div>
          {pctBar(persUsed + persPlanned, persTotal, '#5c9eff')}
        </div>
      </div>

      {/* Section 2: Burn-Down Pace */}
      <div className="pto-section">
        <div className="pto-section-title">📉 Burn-Down Pace ({year})</div>
        {[
          { label: 'Ideal used by today', val: (bd?.idealUsedToDate || 0).toFixed(1) + 'd', pct: cfg.vacationDays ? Math.min(100, ((bd?.idealUsedToDate || 0) / cfg.vacationDays) * 100) : 0, color: '#6b7fa8', badge: null },
          { label: 'Actually used',       val: (bd?.actualUsedToDate || 0).toFixed(1) + 'd', pct: cfg.vacationDays ? Math.min(100, ((bd?.actualUsedToDate || 0) / cfg.vacationDays) * 100) : 0, color: paceColor,
            badge: bd?.paceGap > 0 ? '✅ +' + Math.abs(bd.paceGap).toFixed(1) + 'd ahead'
                 : bd?.paceGap < 0 ? '⚠ ' + Math.abs(bd.paceGap).toFixed(1) + 'd behind'
                 : '✓ on track' },
          { label: 'Projected year-end', val: (bd?.projectedYearEnd || 0).toFixed(1) + 'd', pct: cfg.vacationDays ? Math.min(100, ((bd?.projectedYearEnd || 0) / cfg.vacationDays) * 100) : 0,
            color: (bd?.projectedUnused || 0) > 1 ? '#f9a825' : '#43a047',
            badge: (bd?.projectedUnused || 0) > 0 ? '(' + (bd.projectedUnused).toFixed(1) + ' unused — risk)' : null },
        ].map((row, i) => (
          <div key={i} style={{ marginBottom: i < 2 ? 14 : 0 }}>
            <div style={{ display: 'flex', justifyContent: 'space-between', fontSize: 12, marginBottom: 5 }}>
              <span style={{ color: '#8a9abf' }}>{row.label}</span>
              <span style={{ color: row.color, fontWeight: 700 }}>
                {row.val}
                {row.badge && <span style={{ color: '#8a9abf', fontWeight: 400, marginLeft: 6 }}>{row.badge}</span>}
              </span>
            </div>
            <div className="pto-bar-track">
              <div className="pto-bar-fill" style={{ width: row.pct + '%', background: row.color }} />
            </div>
          </div>
        ))}
        {nextPTO && (
          <div style={{ marginTop: 14, fontSize: 12, color: '#6b7fa8' }}>
            Next PTO: <span style={{ color: '#c9a84c', fontWeight: 600 }}>{nextPTO.label}</span>
            {' · '}{nextPTO.startDate}{' · '}{nextPTO.daysUntil} days away
          </div>
        )}
      </div>

      {/* Section 3: 3-2-1 Strategy */}
      <div className="pto-section">
        <div className="pto-section-title"
             style={{ cursor: 'help' }}
             title="A balanced PTO strategy: 3 short breaks + 2 full weeks + 1 long trip per year. Gold dots = used, blue = planned, empty = still to schedule.">
          🎯 3-2-1 PTO Strategy
        </div>
        <DotRow
          label="3 Long Weekends"
          hint="1–3 workdays off. Take a Friday or Monday to turn a weekend into a 3–4 day break without burning many days."
          target={tto?.longWeekends?.target || 3} usedN={tto?.longWeekends?.used || 0} plannedN={tto?.longWeekends?.planned || 0} />
        <DotRow
          label="2 Mid-Size Weeks"
          hint="4–7 workdays off. A full week away — enough time to truly decompress and recharge."
          target={tto?.midSizeWeeks?.target  || 2} usedN={tto?.midSizeWeeks?.used  || 0} plannedN={tto?.midSizeWeeks?.planned  || 0} />
        <DotRow
          label="1 Big Pivot"
          hint="8+ workdays off. One extended trip or reset each year. Book early — these windows are hard to find later in the year."
          target={tto?.bigPivot?.target      || 1} usedN={tto?.bigPivot?.used      || 0} plannedN={tto?.bigPivot?.planned      || 0} />
      </div>

      {/* Section 4: Buffer Status */}
      <div className="pto-section">
        <div className="pto-section-title"
             style={{ cursor: 'help' }}
             title="Buffer days are flexible personal days held in reserve for last-minute needs — an unexpected sick day, a mental health break, or a spontaneous long weekend. Click 'Trigger a Buffer Day' to log one.">
          🛡️ Buffer Days
        </div>
        <div style={{ display: 'flex', alignItems: 'center', gap: 16, flexWrap: 'wrap' }}>

                style={{ background: i < (bufferStatus?.remaining || 0) ? '#c9a84c' : '#1e3060',

                         marginRight: 8 }}
                title={
                  i < (bufferStatus?.remaining || 0)
                    ? '🟡 Buffer day available — use for an unexpected personal need or a spontaneous day off'
                    : '⬫ Buffer day used'
                }
              />
            ))}
            <span style={{ fontSize: 13, color: '#8a9abf', verticalAlign: 'middle' }}>
              {bufferStatus?.remaining ?? '?'}/{bufferStatus?.total ?? 3} available
            </span>
          </div>

// ---- Bill Tracker sub-view --------------------------------------------------

function BillTrackerView({ bills, billsLoading, onToggle }) {
  const today    = new Date().getDate();
  const billList = (bills && bills.bills) || [];

  function ordinal(n) {
    const s = ['th','st','nd','rd'], v = n % 100;
    return s[(v - 20) % 10] || s[v] || s[0];
  }

  function statusBadge(b) {
    if (b.paid) return { label: '✅ Paid',    color: '#66bb6a', bg: 'rgba(102,187,106,.12)' };
    const d = b.dueDay != null ? b.dueDay - today : null;
    if (d != null && d < 0)           return { label: '🔴 Overdue', color: '#ef5350', bg: 'rgba(239,83,80,.12)' };
    if (d != null && d >= 0 && d <= 5) return { label: d === 0 ? '⚠️ Due today' : `⚠️ Due in ${d}d`, color: '#f5a623', bg: 'rgba(245,166,35,.12)' };
    return { label: b.dueDay ? `📅 ${b.dueDay}${ordinal(b.dueDay)}` : '📅 —', color: '#5c9eff', bg: 'rgba(92,158,255,.10)' };
  }

  if (billsLoading) return <div style={{ fontSize: 13, color: '#6b7fa8', padding: 16 }}>Loading bills…</div>;
  if (!bills)       return <div style={{ fontSize: 13, color: '#4d6080', padding: 16 }}>Click the Finances tab to load bills.</div>;
  if (billList.length === 0) return (
    <div className="empty-state" style={{ marginTop: 8 }}>
      <div style={{ fontSize: 32, marginBottom: 12 }}>🧾</div>
      <div style={{ color: '#dde1f0', marginBottom: 6 }}>No bills yet</div>
      <div style={{ fontSize: 12, color: '#4d6080' }}>Add rows to the Bills tab in your Life OS sheet.</div>
    </div>
  );

  // Group by category; uncategorised bills go last
  const grouped = {};
  const uncategorised = [];
  billList.forEach(b => {
    const cat = (b.category || '').trim();
    if (!cat) { uncategorised.push(b); return; }
    if (!grouped[cat]) grouped[cat] = [];
    grouped[cat].push(b);
  });
  const cats = Object.keys(grouped).sort();
  if (uncategorised.length) cats.push('');

  const unpaidSoon = billList.filter(b => !b.paid && b.dueDay != null && (b.dueDay - today) >= 0 && (b.dueDay - today) <= 5).length;

  return (
    <div>
      {unpaidSoon > 0 && (
        <div style={{ background: 'rgba(245,166,35,.1)', border: '1px solid rgba(245,166,35,.3)', borderRadius: 8, padding: '8px 12px', marginBottom: 14, fontSize: 12, color: '#f5a623' }}>
          ⚠️ {unpaidSoon} bill{unpaidSoon > 1 ? 's' : ''} due within 5 days
        </div>
      )}

      {cats.map(cat => {
        const items = (cat ? grouped[cat] : uncategorised).slice().sort((a, b) => (a.dueDay || 99) - (b.dueDay || 99));
        return (
          <div key={cat || '__none'} style={{ marginBottom: 18 }}>
            {cat && (
              <div style={{ fontSize: 11, fontWeight: 700, textTransform: 'uppercase', letterSpacing: '0.06em', color: '#c9a84c', borderBottom: '1px solid #1e3060', paddingBottom: 4, marginBottom: 8 }}>
                {cat}
              </div>
            )}
            {items.map((b, i) => {
              const badge   = statusBadge(b);
              const acctClr = b.account === 'Ahmed' ? '#5c9eff' : b.account === 'Victoria' ? '#c97ef2' : '#2bb5a0';
              return (
                <div key={i} style={{ display: 'flex', alignItems: 'center', gap: 8, padding: '8px 0', borderBottom: '1px solid #0d1b3e' }}>
                  {/* Name + account chip + notes */}
                  <div style={{ flex: 1, minWidth: 0 }}>
                    <div style={{ display: 'flex', alignItems: 'center', gap: 6, flexWrap: 'nowrap' }}>
                      <span style={{ fontSize: 13, color: b.paid ? '#4d6080' : '#dde1f0', fontWeight: 500, overflow: 'hidden', textOverflow: 'ellipsis', whiteSpace: 'nowrap' }}>{b.bill}</span>
                      {b.account && (
                        <span style={{ fontSize: 10, padding: '1px 6px', borderRadius: 8, border: `1px solid ${acctClr}`, color: acctClr, whiteSpace: 'nowrap', flexShrink: 0 }}>{b.account}</span>
                      )}
                    </div>
                    {b.notes && <div style={{ fontSize: 11, color: '#4d6080', marginTop: 1 }}>{b.notes}</div>}
                  </div>
                  {/* Amount */}
                  <div style={{ fontSize: 13, fontWeight: 700, color: b.paid ? '#4d6080' : '#c9a84c', whiteSpace: 'nowrap' }}>
                    {b.amount != null ? '$' + b.amount.toLocaleString(undefined, { minimumFractionDigits: 0, maximumFractionDigits: 2 }) : '—'}
                  </div>
                  {/* Frequency (non-monthly) or due day */}
                  <div style={{ fontSize: 11, color: '#6b7fa8', whiteSpace: 'nowrap', width: 60, textAlign: 'center' }}>
                    {b.frequency && b.frequency !== 'Monthly' ? b.frequency : (b.dueDay ? `${b.dueDay}${ordinal(b.dueDay)}` : '')}
                  </div>
                  {/* Paid/status badge — click to toggle */}
                  <button
                    style={{ fontSize: 11, padding: '3px 10px', borderRadius: 12, border: `1px solid ${badge.color}`, background: badge.bg, color: badge.color, cursor: 'pointer', whiteSpace: 'nowrap', minWidth: 92 }}
                    onClick={() => onToggle(b.row)}
                  >{badge.label}</button>
                </div>
              );
            })}
          </div>
        );
      })}
    </div>
  );
}
