function BookCourseCard({ item, type, onUpdate, onDelete, busy }) {
  const inputStyle = { background: '#0d1117', color: '#e8eaed', border: '1px solid #2a3a50', borderRadius: 6, padding: '6px 8px', fontSize: 13 };
  const [editing, setEditing] = React.useState(false);
  const isBook = type === 'book';
  const statuses = isBook ? BOOK_STATUSES : COURSE_STATUSES;
  const [editForm, setEditForm] = React.useState({
    title:        item.title || '',
    author:       item.author || '',
    source:       item.source || '',
    category:     item.category || '',
    status:       item.status || statuses[0],
    rating:       item.rating != null ? String(item.rating) : '',
    notes:        item.notes || '',
    dateStarted:  item.dateStarted || '',
    dateFinished: item.dateFinished || '',
  });

  const statusColor = {
    'Want to Read': '#4d6080', 'Reading': '#8ab4f8', 'Read': '#81c995',
    'Want to Do':   '#4d6080', 'In Progress': '#f9ab00', 'Done': '#81c995',
  };
  const sc = statusColor[item.status] || '#6b7c99';

  function handleSave() {
    const orig = { title: item.title, author: item.author, source: item.source,
                   category: item.category, status: item.status,
                   rating: item.rating != null ? String(item.rating) : '',
                   notes: item.notes, dateStarted: item.dateStarted, dateFinished: item.dateFinished };
    Object.entries(editForm).forEach(([f, v]) => {
      const origVal = orig[f] != null ? String(orig[f]) : '';
      if ((v || '') !== origVal) onUpdate(item.id, f.toLowerCase(), v);
    });
    setEditing(false);
  }

  const stars = item.rating ? '★'.repeat(Math.round(item.rating)) + '☆'.repeat(5 - Math.round(item.rating)) : null;

  return (
    <div style={{ background: '#131e2d', border: '1px solid #2a3a50', borderRadius: 10,
                  padding: '12px 14px', marginBottom: 8, display: 'flex', gap: 12, alignItems: 'flex-start' }}>
      <div style={{ flex: 1 }}>
        <div style={{ display: 'flex', alignItems: 'center', gap: 8, flexWrap: 'wrap', marginBottom: 3 }}>
          <span style={{ fontWeight: 600, color: '#e8eaed', fontSize: 14 }}>{item.title}</span>
          {isBook && item.author && <span style={{ color: '#6b7c99', fontSize: 12 }}>by {item.author}</span>}
          {!isBook && item.source && <span style={{ background: '#1e2a3a', color: '#8ab4f8', borderRadius: 4, fontSize: 11, padding: '2px 7px' }}>{item.source}</span>}
        </div>
        <div style={{ display: 'flex', gap: 8, alignItems: 'center', flexWrap: 'wrap' }}>
          <span style={{ color: sc, fontSize: 12, fontWeight: 600 }}>{item.status}</span>
          {item.category && <span style={{ color: '#4d6080', fontSize: 11 }}>{item.category}</span>}
          {stars && <span style={{ color: '#f9ab00', fontSize: 12, letterSpacing: 1 }}>{stars}</span>}
          {item.dateFinished && <span style={{ color: '#4d6080', fontSize: 11 }}>Finished {item.dateFinished}</span>}
        </div>
        {item.notes && !editing && <div style={{ color: '#6b7c99', fontSize: 12, marginTop: 4 }}>{item.notes}</div>}

        {editing && (
          <div style={{ marginTop: 8, display: 'flex', flexDirection: 'column', gap: 8 }}>
            <input value={editForm.title} onChange={e => setEditForm(p => ({ ...p, title: e.target.value }))}
              placeholder="Title" style={{ ...inputStyle, width: '100%', boxSizing: 'border-box' }} />
            {isBook && (
              <input value={editForm.author} onChange={e => setEditForm(p => ({ ...p, author: e.target.value }))}
                placeholder="Author" style={{ ...inputStyle, width: '100%', boxSizing: 'border-box' }} />
            )}
            {!isBook && (
              <input value={editForm.source} onChange={e => setEditForm(p => ({ ...p, source: e.target.value }))}
                placeholder="Platform / Source" style={{ ...inputStyle, width: '100%', boxSizing: 'border-box' }} />
            )}
            <div style={{ display: 'grid', gridTemplateColumns: '1fr 1fr 1fr', gap: 8 }}>
              <select value={editForm.status} onChange={e => setEditForm(p => ({ ...p, status: e.target.value }))} style={inputStyle}>
                {statuses.map(s => <option key={s}>{s}</option>)}
              </select>
              <select value={editForm.category} onChange={e => setEditForm(p => ({ ...p, category: e.target.value }))} style={inputStyle}>
                <option value="">No category</option>
                {GROWTH_CATEGORIES.map(c => <option key={c}>{c}</option>)}
              </select>
              <select value={editForm.rating} onChange={e => setEditForm(p => ({ ...p, rating: e.target.value }))} style={inputStyle}>
                <option value="">No rating</option>
                {[1,2,3,4,5].map(n => <option key={n} value={String(n)}>{n} ★</option>)}
              </select>
            </div>
            <input value={editForm.notes} onChange={e => setEditForm(p => ({ ...p, notes: e.target.value }))}
              placeholder="Notes" style={{ ...inputStyle, width: '100%', boxSizing: 'border-box' }} />
            <div style={{ display: 'flex', gap: 8, justifyContent: 'flex-end' }}>
              <button type="button" onClick={() => setEditing(false)}
                style={{ padding: '5px 12px', borderRadius: 6, border: '1px solid #2a3a50', background: 'transparent', color: '#8ab4f8', cursor: 'pointer', fontSize: 12 }}>
                Cancel
              </button>
              <button type="button" onClick={handleSave} disabled={busy}
                style={{ padding: '5px 12px', borderRadius: 6, border: 'none', background: '#8ab4f8', color: '#0d1117', fontWeight: 600, cursor: 'pointer', fontSize: 12 }}>
                Save
              </button>
            </div>
          </div>
        )}
      </div>
      {!editing && (
        <div style={{ display: 'flex', gap: 6, flexShrink: 0 }}>
          <button onClick={() => setEditing(true)} disabled={busy}
            style={{ background: 'none', border: '1px solid #2a3a50', borderRadius: 5, color: '#8ab4f8', cursor: 'pointer', fontSize: 11, padding: '3px 10px' }}>
            Edit
          </button>
          <button onClick={() => { if (window.confirm('Delete "' + item.title + '"?')) onDelete(item.id); }} disabled={busy}
            style={{ background: 'none', border: '1px solid #3a2020', borderRadius: 5, color: '#f28b82', cursor: 'pointer', fontSize: 11, padding: '3px 10px' }}>
            Del
          </button>
        </div>
      )}
    </div>
  );
}

function PersonalDevTab({ books, courses, filterPerson, onAddBook, onUpdateBook, onDeleteBook, onAddCourse, onUpdateCourse, onDeleteCourse, busy }) {
  const inputStyle = { background: '#0d1117', color: '#e8eaed', border: '1px solid #2a3a50', borderRadius: 6, padding: '6px 8px', fontSize: 13 };
  const [activeSection, setActiveSection] = React.useState('books');
  const [showForm, setShowForm] = React.useState(false);
  const [bookForm, setBookForm] = React.useState({ title: '', author: '', category: '', status: 'Want to Read', rating: '', notes: '' });
  const [courseForm, setCourseForm] = React.useState({ title: '', source: '', category: '', status: 'Want to Do', rating: '', notes: '' });

  const filteredBooks   = books.filter(b => b.person === filterPerson);
  const filteredCourses = courses.filter(c => c.person === filterPerson);

  const booksByStatus   = BOOK_STATUSES.slice().reverse().reduce((acc, s) => {
    acc[s] = filteredBooks.filter(b => b.status === s); return acc;
  }, {});
  const coursesByStatus = COURSE_STATUSES.slice().reverse().reduce((acc, s) => {
    acc[s] = filteredCourses.filter(c => c.status === s); return acc;
  }, {});

  function handleBookSubmit(e) {
    e.preventDefault();
    if (!bookForm.title.trim()) return;
    onAddBook({ ...bookForm, person: filterPerson });
    setBookForm({ title: '', author: '', category: '', status: 'Want to Read', rating: '', notes: '' });
    setShowForm(false);
  }
  function handleCourseSubmit(e) {
    e.preventDefault();
    if (!courseForm.title.trim()) return;
    onAddCourse({ ...courseForm, person: filterPerson });
    setCourseForm({ title: '', source: '', category: '', status: 'Want to Do', rating: '', notes: '' });
    setShowForm(false);
  }

  const bookStatusColor  = { 'Read': '#81c995', 'Reading': '#8ab4f8', 'Want to Read': '#4d6080' };
  const crsStatusColor   = { 'Done': '#81c995', 'In Progress': '#f9ab00', 'Want to Do': '#4d6080' };

  return (
    <div>
      {/* Stats bar */}
      {(filteredBooks.length > 0 || filteredCourses.length > 0) && (
        <div style={{ display: 'flex', gap: 10, marginBottom: 16, flexWrap: 'wrap' }}>
          {[
            filteredBooks.filter(b => b.status === 'Reading').length > 0 && { label: 'Reading', value: filteredBooks.filter(b => b.status === 'Reading').length },
            filteredBooks.filter(b => b.status === 'Read').length > 0 && { label: 'Books Read', value: filteredBooks.filter(b => b.status === 'Read').length },
            filteredBooks.filter(b => b.status === 'Want to Read').length > 0 && { label: 'Want to Read', value: filteredBooks.filter(b => b.status === 'Want to Read').length },
            filteredCourses.filter(c => c.status === 'In Progress').length > 0 && { label: 'In Progress', value: filteredCourses.filter(c => c.status === 'In Progress').length },
            filteredCourses.filter(c => c.status === 'Done').length > 0 && { label: 'Courses Done', value: filteredCourses.filter(c => c.status === 'Done').length },
          ].filter(Boolean).map(s => (
            <div key={s.label} style={{ background: '#1e2a3a', border: '1px solid #2a3a50', borderRadius: 8, padding: '8px 14px', fontSize: 13, color: '#e8eaed' }}>
              <span style={{ fontWeight: 700 }}>{s.value}</span>
              <span style={{ color: '#6b7c99', marginLeft: 6 }}>{s.label}</span>
            </div>
          ))}
        </div>
      )}

      {/* Section toggle + Add button */}
      <div style={{ display: 'flex', gap: 8, marginBottom: 14, alignItems: 'center', flexWrap: 'wrap' }}>
        {[{ id: 'books', label: '📖 Books' }, { id: 'courses', label: '🎓 Courses & Content' }].map(s => (
          <button key={s.id} onClick={() => { setActiveSection(s.id); setShowForm(false); }}
            style={{ padding: '5px 14px', borderRadius: 6, border: 'none', cursor: 'pointer', fontSize: 13,
                     background: activeSection === s.id ? '#8ab4f8' : '#1e2a3a',
                     color: activeSection === s.id ? '#0d1117' : '#8ab4f8', fontWeight: activeSection === s.id ? 600 : 400 }}>
            {s.label}
          </button>
        ))}
        <button onClick={() => setShowForm(v => !v)} disabled={busy}
          style={{ marginLeft: 'auto', padding: '6px 16px', borderRadius: 6, border: 'none',
                   background: '#8ab4f8', color: '#0d1117', fontWeight: 600, cursor: 'pointer', fontSize: 13 }}>
          {showForm ? '✕ Cancel' : (activeSection === 'books' ? '+ Add Book' : '+ Add Course')}
        </button>
      </div>

      {/* Add book form */}
      {showForm && activeSection === 'books' && (
        <form onSubmit={handleBookSubmit} style={{ background: '#1e2a3a', borderRadius: 8, padding: '14px 16px',
               marginBottom: 16, border: '1px solid #2a3a50', display: 'flex', flexDirection: 'column', gap: 10 }}>
          <input required value={bookForm.title} onChange={e => setBookForm(p => ({ ...p, title: e.target.value }))}
            placeholder="Title *" style={{ ...inputStyle, width: '100%', boxSizing: 'border-box' }} />
          <input value={bookForm.author} onChange={e => setBookForm(p => ({ ...p, author: e.target.value }))}
            placeholder="Author (optional)" style={{ ...inputStyle, width: '100%', boxSizing: 'border-box' }} />
          <div style={{ display: 'grid', gridTemplateColumns: '1fr 1fr 1fr', gap: 8 }}>
            <select value={bookForm.status} onChange={e => setBookForm(p => ({ ...p, status: e.target.value }))} style={inputStyle}>
              {BOOK_STATUSES.map(s => <option key={s}>{s}</option>)}
            </select>
            <select value={bookForm.category} onChange={e => setBookForm(p => ({ ...p, category: e.target.value }))} style={inputStyle}>
              <option value="">No category</option>
              {GROWTH_CATEGORIES.map(c => <option key={c}>{c}</option>)}
            </select>
            <select value={bookForm.rating} onChange={e => setBookForm(p => ({ ...p, rating: e.target.value }))} style={inputStyle}>
              <option value="">No rating</option>
              {[1,2,3,4,5].map(n => <option key={n} value={String(n)}>{n} ★</option>)}
            </select>
          </div>
          <input value={bookForm.notes} onChange={e => setBookForm(p => ({ ...p, notes: e.target.value }))}
            placeholder="Notes (optional)" style={{ ...inputStyle, width: '100%', boxSizing: 'border-box' }} />
          <div style={{ display: 'flex', gap: 8, justifyContent: 'flex-end' }}>
            <button type="button" onClick={() => setShowForm(false)}
              style={{ padding: '6px 14px', borderRadius: 6, border: '1px solid #2a3a50', background: 'transparent', color: '#8ab4f8', cursor: 'pointer', fontSize: 13 }}>Cancel</button>
            <button type="submit" disabled={busy || !bookForm.title.trim()}
              style={{ padding: '6px 16px', borderRadius: 6, border: 'none', background: '#8ab4f8', color: '#0d1117', fontWeight: 600, cursor: 'pointer', fontSize: 13 }}>📖 Add</button>
          </div>
        </form>
      )}

      {/* Add course form */}
      {showForm && activeSection === 'courses' && (
        <form onSubmit={handleCourseSubmit} style={{ background: '#1e2a3a', borderRadius: 8, padding: '14px 16px',
               marginBottom: 16, border: '1px solid #2a3a50', display: 'flex', flexDirection: 'column', gap: 10 }}>
          <input required value={courseForm.title} onChange={e => setCourseForm(p => ({ ...p, title: e.target.value }))}
            placeholder="Title *" style={{ ...inputStyle, width: '100%', boxSizing: 'border-box' }} />
          <input value={courseForm.source} onChange={e => setCourseForm(p => ({ ...p, source: e.target.value }))}
            placeholder="Platform / Source (e.g. Coursera, YouTube, Podcast)" style={{ ...inputStyle, width: '100%', boxSizing: 'border-box' }} />
          <div style={{ display: 'grid', gridTemplateColumns: '1fr 1fr 1fr', gap: 8 }}>
            <select value={courseForm.status} onChange={e => setCourseForm(p => ({ ...p, status: e.target.value }))} style={inputStyle}>
              {COURSE_STATUSES.map(s => <option key={s}>{s}</option>)}
            </select>
            <select value={courseForm.category} onChange={e => setCourseForm(p => ({ ...p, category: e.target.value }))} style={inputStyle}>
              <option value="">No category</option>
              {GROWTH_CATEGORIES.map(c => <option key={c}>{c}</option>)}
            </select>
            <select value={courseForm.rating} onChange={e => setCourseForm(p => ({ ...p, rating: e.target.value }))} style={inputStyle}>
              <option value="">No rating</option>
              {[1,2,3,4,5].map(n => <option key={n} value={String(n)}>{n} ★</option>)}
            </select>
          </div>
          <input value={courseForm.notes} onChange={e => setCourseForm(p => ({ ...p, notes: e.target.value }))}
            placeholder="Notes (optional)" style={{ ...inputStyle, width: '100%', boxSizing: 'border-box' }} />
          <div style={{ display: 'flex', gap: 8, justifyContent: 'flex-end' }}>
            <button type="button" onClick={() => setShowForm(false)}
              style={{ padding: '6px 14px', borderRadius: 6, border: '1px solid #2a3a50', background: 'transparent', color: '#8ab4f8', cursor: 'pointer', fontSize: 13 }}>Cancel</button>
            <button type="submit" disabled={busy || !courseForm.title.trim()}
              style={{ padding: '6px 16px', borderRadius: 6, border: 'none', background: '#8ab4f8', color: '#0d1117', fontWeight: 600, cursor: 'pointer', fontSize: 13 }}>🎓 Add</button>
          </div>
        </form>
      )}

      {/* Books list */}
      {activeSection === 'books' && (
        filteredBooks.length === 0 && !showForm
          ? <div style={{ textAlign: 'center', padding: '40px 20px', color: '#5f6368', fontSize: 14 }}>No books logged yet. Add one above or tell VERA in chat.</div>
          : ['Reading', 'Want to Read', 'Read'].map(status => {
              const items = booksByStatus[status] || [];
              if (items.length === 0) return null;
              return (
                <div key={status} style={{ marginBottom: 18 }}>
                  <div style={{ fontSize: 12, fontWeight: 700, color: bookStatusColor[status] || '#6b7c99',
                                textTransform: 'uppercase', letterSpacing: '0.08em', marginBottom: 8 }}>
                    {status} <span style={{ fontWeight: 400, color: '#4d6080' }}>({items.length})</span>
                  </div>
                  {items.map(b => (
                    <BookCourseCard key={b.id} item={b} type="book" onUpdate={onUpdateBook} onDelete={onDeleteBook} busy={busy} />
                  ))}
                </div>
              );
            })
      )}

      {/* Courses list */}
      {activeSection === 'courses' && (
        filteredCourses.length === 0 && !showForm
          ? <div style={{ textAlign: 'center', padding: '40px 20px', color: '#5f6368', fontSize: 14 }}>No courses logged yet. Add one above or tell VERA in chat.</div>
          : ['In Progress', 'Want to Do', 'Done'].map(status => {
              const items = coursesByStatus[status] || [];
              if (items.length === 0) return null;
              return (
                <div key={status} style={{ marginBottom: 18 }}>
                  <div style={{ fontSize: 12, fontWeight: 700, color: crsStatusColor[status] || '#6b7c99',
                                textTransform: 'uppercase', letterSpacing: '0.08em', marginBottom: 8 }}>
                    {status} <span style={{ fontWeight: 400, color: '#4d6080' }}>({items.length})</span>
                  </div>
                  {items.map(c => (
                    <BookCourseCard key={c.id} item={c} type="course" onUpdate={onUpdateCourse} onDelete={onDeleteCourse} busy={busy} />
                  ))}
                </div>
              );
            })
      )}
    </div>
  );
}

function SkillCard({ skill, onUpdate, onRecordPractice, onDelete, busy }) {
  const inputStyle = { background: '#0d1117', color: '#e8eaed', border: '1px solid #2a3a50', borderRadius: 6, padding: '6px 8px', fontSize: 13 };
  const [editing, setEditing] = React.useState(false);
  const [editForm, setEditForm] = React.useState({
    skill: skill.skill || '', category: skill.category || '', level: skill.level || 'Beginner',
    goalLink: skill.goalLink || '', notes: skill.notes || '',
  });

  const levelColors = { Beginner: '#6b7c99', Intermediate: '#8ab4f8', Advanced: '#f9ab00', Expert: '#81c995' };
  const lc = levelColors[skill.level] || '#6b7c99';

  const today = new Date().toISOString().slice(0, 10);
  const daysSince = skill.lastPracticed
    ? Math.round((new Date(today) - new Date(skill.lastPracticed)) / 86400000)
    : null;
  const atrophy = daysSince !== null && daysSince > 30;

  function handleSave() {
    const orig = { skill: skill.skill, category: skill.category, level: skill.level, goalLink: skill.goalLink, notes: skill.notes };
    Object.entries(editForm).forEach(([f, v]) => {
      if ((v || '') !== (orig[f] || '')) onUpdate(skill.id, f.toLowerCase(), v);
    });
    setEditing(false);
  }

  return (
    <div style={{ background: '#131e2d', border: '1px solid ' + (atrophy ? '#3a2a10' : '#2a3a50'),
                  borderRadius: 10, padding: '12px 14px', marginBottom: 8 }}>
      <div style={{ display: 'flex', alignItems: 'flex-start', gap: 10 }}>
        <div style={{ flex: 1 }}>
          <div style={{ display: 'flex', alignItems: 'center', gap: 8, flexWrap: 'wrap', marginBottom: 4 }}>
            <span style={{ fontWeight: 600, color: '#e8eaed', fontSize: 14 }}>{skill.skill}</span>
            <span style={{ background: '#1e2a3a', color: lc, border: '1px solid ' + lc,
                           borderRadius: 4, fontSize: 11, padding: '2px 7px', fontWeight: 600 }}>{skill.level}</span>
            {skill.category && <span style={{ color: '#4d6080', fontSize: 11 }}>{skill.category}</span>}
          </div>
          <div style={{ display: 'flex', gap: 10, flexWrap: 'wrap', alignItems: 'center' }}>
            {skill.lastPracticed

              </div>

          )}
        </div>

        {!editing && (
          <div style={{ display: 'flex', gap: 6, flexShrink: 0 }}>
            <button onClick={() => { onRecordPractice(skill.id); }} disabled={busy}
              title="Log practice session today"
              style={{ background: 'none', border: '1px solid #1a4a2e', borderRadius: 5, color: '#81c995',
                       cursor: 'pointer', fontSize: 11, padding: '3px 10px' }}>

                       cursor: 'pointer', fontSize: 11, padding: '3px 10px' }}>

            </button>
            <button onClick={() => { if (window.confirm('Delete "' + skill.skill + '"?')) onDelete(skill.id); }} disabled={busy}
              style={{ background: 'none', border: '1px solid #3a2020', borderRadius: 5, color: '#f28b82',
                       cursor: 'pointer', fontSize: 11, padding: '3px 10px' }}>

          </div>

      </div>
    </div>
  );
}

function ExperimentCard({ experiment: ex, onUpdate, onDelete, onAddCheckin, busy }) {
  const inputStyle = { background: '#0d1117', color: '#e8eaed', border: '1px solid #2a3a50', borderRadius: 6, padding: '6px 8px', fontSize: 13 };
  const [editing, setEditing] = React.useState(false);
  const [checkinNote, setCheckinNote] = React.useState('');
  const [editForm, setEditForm] = React.useState({
    title: ex.title || '', category: ex.category || 'Other', hypothesis: ex.hypothesis || '',
    startDate: ex.startDate || '', endDate: ex.endDate || '', notes: ex.notes || '',
    person: ex.person || 'Ahmed', status: ex.status || 'Active',
  });

  const statusColors = {
    Active:    { bg: '#0d2f1f', color: '#34a853', border: '#1a4a2e' },
    Ongoing:   { bg: '#0d1f35', color: '#8ab4f8', border: '#1a3a5e' },
    Paused:    { bg: '#2d2200', color: '#f9ab00', border: '#4d3a00' },
    Stopped:   { bg: '#2d1010', color: '#f28b82', border: '#4d2020' },
    Completed: { bg: '#0d2820', color: '#81c995', border: '#1a4a34' },
  };
  const sc = statusColors[ex.status] || statusColors.Active;

  function handleCheckinSubmit(e) {
    e.preventDefault();
    if (!checkinNote.trim()) return;
    onAddCheckin(ex.id, checkinNote.trim());
    setCheckinNote('');
  }

  function handleEditSave() {
    const original = { title: ex.title, category: ex.category, hypothesis: ex.hypothesis,
                       startDate: ex.startDate, endDate: ex.endDate, notes: ex.notes,
                       person: ex.person, status: ex.status };
    Object.entries(editForm).forEach(([f, v]) => {
      if ((v || '') !== (original[f] || '')) onUpdate(ex.id, f.toLowerCase(), v);
    });
    setEditing(false);
  }

  return (
    <div style={{ background: '#131e2d', border: '1px solid #2a3a50', borderRadius: 10, padding: '14px 16px', marginBottom: 10 }}>
      {/* Header */}
      <div style={{ display: 'flex', alignItems: 'flex-start', gap: 10, marginBottom: 8 }}>
        <div style={{ flex: 1 }}>
          <div style={{ display: 'flex', alignItems: 'center', gap: 8, flexWrap: 'wrap' }}>
            <span style={{ fontWeight: 600, color: '#e8eaed', fontSize: 14 }}>{ex.title}</span>
            {ex.category && (
              <span style={{ background: '#1e2a3a', color: '#8ab4f8', borderRadius: 4, fontSize: 11, padding: '2px 7px' }}>{ex.category}</span>
            )}
          </div>
          <div style={{ display: 'flex', gap: 8, marginTop: 5, flexWrap: 'wrap', alignItems: 'center' }}>
            <span style={{ background: sc.bg, color: sc.color, border: '1px solid ' + sc.border,
                           borderRadius: 4, fontSize: 11, padding: '2px 7px', fontWeight: 600 }}>{ex.status}</span>
            {ex.person && <span style={{ color: '#6b7c99', fontSize: 12 }}>{ex.person}</span>}
            {(ex.startDate || ex.endDate) && (
              <span style={{ color: '#4d6080', fontSize: 11 }}>
                {ex.startDate || '…'} → {ex.endDate || 'ongoing'}
              </span>
            )}
          </div>
        </div>
        <div style={{ display: 'flex', gap: 6, flexShrink: 0 }}>
          <button onClick={() => setEditing(v => !v)} disabled={busy}
            style={{ background: 'none', border: '1px solid #2a3a50', borderRadius: 5, color: '#8ab4f8',
                     cursor: 'pointer', fontSize: 11, padding: '3px 10px' }}>
            {editing ? 'Cancel' : 'Edit'}
          </button>
          <button onClick={() => { if (window.confirm('Delete "' + ex.title + '"?')) onDelete(ex.id); }} disabled={busy}
            style={{ background: 'none', border: '1px solid #3a2020', borderRadius: 5, color: '#f28b82',
                     cursor: 'pointer', fontSize: 11, padding: '3px 10px' }}>
            Del
          </button>
        </div>
      </div>

      {/* Hypothesis */}
      {ex.hypothesis && !editing && (
        <div style={{ color: '#9aa5b8', fontSize: 12, fontStyle: 'italic', marginBottom: 8 }}>"{ex.hypothesis}"</div>
      )}

      {/* Recent check-ins */}
      {!editing && ex.checkins && ex.checkins.length > 0 && (
        <div style={{ marginBottom: 8 }}>
          {ex.checkins.map((c, i) => (
            <div key={i} style={{ display: 'flex', gap: 8, fontSize: 12, marginBottom: 3 }}>
              <span style={{ color: '#4d6080', flexShrink: 0 }}>{c.date}</span>
              <span style={{ color: '#8a9bb0' }}>{c.note || '(check-in)'}</span>
            </div>
          ))}
        </div>
      )}

      {/* Outcome */}
      {ex.outcome && !editing && (
        <div style={{ background: '#0d2820', border: '1px solid #1a4a34', borderRadius: 6,
                      padding: '6px 10px', marginBottom: 8, fontSize: 12, color: '#81c995' }}>
          Outcome: {ex.outcome}
        </div>
      )}

      {/* Edit form */}
      {editing && (
        <div style={{ marginTop: 4, display: 'flex', flexDirection: 'column', gap: 8 }}>
          <input value={editForm.title} onChange={e => setEditForm(p => ({ ...p, title: e.target.value }))}
            placeholder="Title" style={{ ...inputStyle, width: '100%', boxSizing: 'border-box' }} />
          <div style={{ display: 'grid', gridTemplateColumns: '1fr 1fr 1fr', gap: 8 }}>
            <select value={editForm.person} onChange={e => setEditForm(p => ({ ...p, person: e.target.value }))} style={inputStyle}>
              {['Ahmed', 'Victoria', 'Both'].map(p => <option key={p}>{p}</option>)}
            </select>
            <select value={editForm.category} onChange={e => setEditForm(p => ({ ...p, category: e.target.value }))} style={inputStyle}>
              {EXP_CATEGORIES.map(c => <option key={c}>{c}</option>)}
            </select>
            <select value={editForm.status} onChange={e => setEditForm(p => ({ ...p, status: e.target.value }))} style={inputStyle}>
              {EXP_STATUSES.map(s => <option key={s}>{s}</option>)}
            </select>
          </div>
          <input value={editForm.hypothesis} onChange={e => setEditForm(p => ({ ...p, hypothesis: e.target.value }))}
            placeholder="Hypothesis" style={{ ...inputStyle, width: '100%', boxSizing: 'border-box' }} />
          <div style={{ display: 'grid', gridTemplateColumns: '1fr 1fr', gap: 8 }}>
            <input type="date" value={editForm.startDate} onChange={e => setEditForm(p => ({ ...p, startDate: e.target.value }))} style={inputStyle} />
            <input type="date" value={editForm.endDate} onChange={e => setEditForm(p => ({ ...p, endDate: e.target.value }))} style={inputStyle} />
          </div>
          <input value={editForm.notes} onChange={e => setEditForm(p => ({ ...p, notes: e.target.value }))}
            placeholder="Notes" style={{ ...inputStyle, width: '100%', boxSizing: 'border-box' }} />
          <div style={{ display: 'flex', gap: 8, justifyContent: 'flex-end' }}>
            <button type="button" onClick={() => setEditing(false)}
              style={{ padding: '5px 12px', borderRadius: 6, border: '1px solid #2a3a50',
                       background: 'transparent', color: '#8ab4f8', cursor: 'pointer', fontSize: 12 }}>
              Cancel
            </button>
            <button type="button" onClick={handleEditSave} disabled={busy}
              style={{ padding: '5px 12px', borderRadius: 6, border: 'none', background: '#8ab4f8',
                       color: '#0d1117', fontWeight: 600, cursor: 'pointer', fontSize: 12 }}>
              Save
            </button>
          </div>
        </div>
      )}

      {/* Inline check-in input */}
      {!editing && (
        <form onSubmit={handleCheckinSubmit} style={{ display: 'flex', gap: 6, marginTop: 8 }}>
          <input value={checkinNote} onChange={e => setCheckinNote(e.target.value)}
            placeholder="Quick check-in note…"
            style={{ ...inputStyle, flex: 1, fontSize: 12 }} />
          <button type="submit" disabled={busy || !checkinNote.trim()}
            style={{ padding: '5px 12px', borderRadius: 6, border: 'none',
                     background: checkinNote.trim() ? '#8ab4f8' : '#1e2a3a',
                     color: checkinNote.trim() ? '#0d1117' : '#4d6080',
                     cursor: checkinNote.trim() ? 'pointer' : 'default', fontSize: 12, fontWeight: 600 }}>
            Log
          </button>
        </form>
      )}
    </div>
  );
}

function ExperimentsTab({ experiments, onAdd, onUpdate, onDelete, onAddCheckin, busy }) {
  const inputStyle = { background: '#0d1117', color: '#e8eaed', border: '1px solid #2a3a50', borderRadius: 6, padding: '6px 8px', fontSize: 13 };
  const today = new Date().toISOString().slice(0, 10);
  const [showForm, setShowForm] = React.useState(false);
  const [filterStatus, setFilterStatus] = React.useState('Active');
  const [showArchived, setShowArchived] = React.useState(false);
  const [form, setForm] = React.useState({
    person: 'Ahmed', title: '', category: 'Other', hypothesis: '',
    startDate: today, endDate: '', notes: '',
  });

  const statusCounts = EXP_STATUSES.reduce((acc, s) => {
    acc[s] = experiments.filter(e => e.status === s).length;
    return acc;
  }, {});
  const runningCount = (statusCounts.Active || 0) + (statusCounts.Ongoing || 0) + (statusCounts.Paused || 0);
  const archivedExps = experiments.filter(e => e.status === 'Stopped' || e.status === 'Completed');

  function handleSubmit(e) {
    e.preventDefault();
    if (!form.title.trim()) return;
    onAdd(form);
    setForm({ person: 'Ahmed', title: '', category: 'Other', hypothesis: '', startDate: today, endDate: '', notes: '' });
    setShowForm(false);
  }

  const visibleStatuses = filterStatus === 'All'
    ? ['Active', 'Ongoing', 'Paused']
    : [filterStatus].filter(s => !['Stopped', 'Completed'].includes(s));

  const displayedExps = experiments.filter(e => visibleStatuses.includes(e.status));

  return (
    <div>
      {/* Stats bar */}
      {experiments.length > 0 && (
        <div style={{ display: 'flex', gap: 10, marginBottom: 16, flexWrap: 'wrap' }}>
          {[
            runningCount > 0 && { label: 'Running', value: runningCount },
            statusCounts.Active    > 0 && { label: 'Active',    value: statusCounts.Active },
            statusCounts.Ongoing   > 0 && { label: 'Ongoing',   value: statusCounts.Ongoing },
            statusCounts.Paused    > 0 && { label: 'Paused',    value: statusCounts.Paused },
            statusCounts.Completed > 0 && { label: 'Completed', value: statusCounts.Completed },
          ].filter(Boolean).map(s => (
            <div key={s.label} style={{ background: '#1e2a3a', border: '1px solid #2a3a50', borderRadius: 8,
                                        padding: '8px 14px', fontSize: 13, color: '#e8eaed' }}>
              <span style={{ fontWeight: 700 }}>{s.value}</span>
              <span style={{ color: '#6b7c99', marginLeft: 6 }}>{s.label}</span>
            </div>
          ))}
        </div>
      )}

      {/* Filter bar + Add button */}
      <div style={{ display: 'flex', gap: 8, marginBottom: 14, alignItems: 'center', flexWrap: 'wrap' }}>
        {['Active', 'Ongoing', 'Paused', 'All'].map(s => (
          <button key={s} onClick={() => setFilterStatus(s)}
            style={{ padding: '4px 12px', borderRadius: 6, border: 'none', cursor: 'pointer', fontSize: 12,
                     background: filterStatus === s ? '#8ab4f8' : '#1e2a3a',
                     color: filterStatus === s ? '#0d1117' : '#8ab4f8' }}>
            {s}
          </button>
        ))}
        <button onClick={() => setShowForm(v => !v)} disabled={busy}
          style={{ marginLeft: 'auto', padding: '6px 16px', borderRadius: 6, border: 'none',
                   background: '#8ab4f8', color: '#0d1117', fontWeight: 600, cursor: 'pointer', fontSize: 13 }}>
          {showForm ? '✕ Cancel' : '+ New Experiment'}
        </button>
      </div>

      {/* Add form */}
      {showForm && (
        <form onSubmit={handleSubmit}
          style={{ background: '#1e2a3a', borderRadius: 8, padding: '14px 16px', marginBottom: 16,
                   border: '1px solid #2a3a50', display: 'flex', flexDirection: 'column', gap: 10 }}>
          <input required value={form.title} onChange={e => setForm(p => ({ ...p, title: e.target.value }))}
            placeholder="Experiment title *" style={{ ...inputStyle, width: '100%', boxSizing: 'border-box' }} />
          <div style={{ display: 'grid', gridTemplateColumns: '1fr 1fr', gap: 8 }}>
            <select value={form.person} onChange={e => setForm(p => ({ ...p, person: e.target.value }))} style={inputStyle}>
              {['Ahmed', 'Victoria', 'Both'].map(p => <option key={p}>{p}</option>)}
            </select>
            <select value={form.category} onChange={e => setForm(p => ({ ...p, category: e.target.value }))} style={inputStyle}>
              {EXP_CATEGORIES.map(c => <option key={c}>{c}</option>)}
            </select>
          </div>
          <input value={form.hypothesis} onChange={e => setForm(p => ({ ...p, hypothesis: e.target.value }))}
            placeholder="Hypothesis (optional)" style={{ ...inputStyle, width: '100%', boxSizing: 'border-box' }} />
          <div style={{ display: 'grid', gridTemplateColumns: '1fr 1fr', gap: 8 }}>
            <div>
              <label style={{ display: 'block', fontSize: 11, color: '#6b7c99', marginBottom: 3 }}>Start Date</label>
              <input type="date" value={form.startDate} onChange={e => setForm(p => ({ ...p, startDate: e.target.value }))}
                style={{ ...inputStyle, width: '100%', boxSizing: 'border-box' }} />
            </div>
            <div>
              <label style={{ display: 'block', fontSize: 11, color: '#6b7c99', marginBottom: 3 }}>End Date (optional)</label>
              <input type="date" value={form.endDate} onChange={e => setForm(p => ({ ...p, endDate: e.target.value }))}
                style={{ ...inputStyle, width: '100%', boxSizing: 'border-box' }} />
            </div>
          </div>
          <input value={form.notes} onChange={e => setForm(p => ({ ...p, notes: e.target.value }))}
            placeholder="Notes (optional)" style={{ ...inputStyle, width: '100%', boxSizing: 'border-box' }} />
          <div style={{ display: 'flex', gap: 8, justifyContent: 'flex-end' }}>
            <button type="button" onClick={() => setShowForm(false)}
              style={{ padding: '6px 14px', borderRadius: 6, border: '1px solid #2a3a50',
                       background: 'transparent', color: '#8ab4f8', cursor: 'pointer', fontSize: 13 }}>
              Cancel
            </button>
            <button type="submit" disabled={busy || !form.title.trim()}
              style={{ padding: '6px 16px', borderRadius: 6, border: 'none', background: '#8ab4f8',
                       color: '#0d1117', fontWeight: 600, cursor: 'pointer', fontSize: 13 }}>
              🧪 Start
            </button>
          </div>
        </form>
      )}

      {/* Experiment cards */}
      {displayedExps.length === 0 && !showForm ? (
        <div style={{ textAlign: 'center', padding: '40px 20px', color: '#5f6368', fontSize: 14 }}>
          No experiments here. Start one above or tell VERA in chat.
        </div>
      ) : (
        filterStatus === 'All'
          ? visibleStatuses.map(status => {
              const items = experiments.filter(e => e.status === status);
              if (items.length === 0) return null;
              return (
                <div key={status} style={{ marginBottom: 20 }}>
                  <div style={{ fontSize: 12, fontWeight: 700, color: '#6b7c99', textTransform: 'uppercase',
                                letterSpacing: '0.08em', marginBottom: 8 }}>
                    {status} <span style={{ fontWeight: 400, color: '#4d6080' }}>({items.length})</span>
                  </div>
                  {items.map(ex => (
                    <ExperimentCard key={ex.id} experiment={ex} onUpdate={onUpdate} onDelete={onDelete} onAddCheckin={onAddCheckin} busy={busy} />
                  ))}
                </div>
              );
            })
          : displayedExps.map(ex => (
              <ExperimentCard key={ex.id} experiment={ex} onUpdate={onUpdate} onDelete={onDelete} onAddCheckin={onAddCheckin} busy={busy} />
            ))
      )}

      {/* Stopped / Completed collapsed section */}
      {archivedExps.length > 0 && (
        <div style={{ marginTop: 8 }}>
          <button onClick={() => setShowArchived(v => !v)}
            style={{ background: 'none', border: 'none', color: '#6b7c99', cursor: 'pointer', fontSize: 12, padding: '4px 0', marginBottom: 8 }}>
            {showArchived ? '▾' : '▸'} Stopped / Completed ({archivedExps.length})
          </button>
          {showArchived && archivedExps.map(ex => (
            <ExperimentCard key={ex.id} experiment={ex} onUpdate={onUpdate} onDelete={onDelete} onAddCheckin={onAddCheckin} busy={busy} />
          ))}
        </div>
      )}
    </div>
  );
}

function WishItemCard({ item, onUpdate, onMarkPurchased, onDelete, busy }) {
  const inputStyle = { background: '#0d1117', color: '#e8eaed', border: '1px solid #2a3a50', borderRadius: 6, padding: '6px 8px', fontSize: 13, width: '100%', boxSizing: 'border-box' };
  const [editing, setEditing] = React.useState(false);
  const [form, setForm] = React.useState({
    item: item.item, category: item.category, description: item.description || '',
    urls: item.urls || '', price: item.price != null ? String(item.price) : '',
    priority: item.priority, status: item.status, notes: item.notes || '',
  });

  const priorityColor = { High: '#f28b82', Medium: '#fdd663', Low: '#81c995' }[item.priority] || '#8ab4f8';
  const statusColor   = { 'Ready to Buy': '#81c995', 'Saving': '#fdd663', 'Dreaming': '#8ab4f8' }[item.status] || '#8ab4f8';

  function handleSave() {
    Object.keys(form).forEach(field => {
      const cur = item[field] != null ? String(item[field]) : '';
      if (form[field] !== cur) onUpdate(item.id, field, form[field]);
    });
    setEditing(false);
  }

  const urlList = (item.urls || '').split(/[\s,]+/).filter(Boolean);

  if (editing) {
    return (
      <div style={{ background: '#1e2a3a', border: '1px solid #2a3a50', borderRadius: 8, padding: '14px 16px', marginBottom: 10 }}>
        <div style={{ display: 'grid', gridTemplateColumns: '1fr 1fr', gap: 8, marginBottom: 8 }}>
          <input value={form.item} onChange={e => setForm(p => ({ ...p, item: e.target.value }))}
            placeholder="Item name" style={inputStyle} />
          <select value={form.category} onChange={e => setForm(p => ({ ...p, category: e.target.value }))} style={inputStyle}>
            {WISH_CATEGORIES.map(c => <option key={c}>{c}</option>)}
          </select>
          <select value={form.priority} onChange={e => setForm(p => ({ ...p, priority: e.target.value }))} style={inputStyle}>
            {WISH_PRIORITIES.map(p => <option key={p}>{p}</option>)}
          </select>
          <select value={form.status} onChange={e => setForm(p => ({ ...p, status: e.target.value }))} style={inputStyle}>
            {WISH_STATUSES.map(s => <option key={s}>{s}</option>)}
          </select>
          <input value={form.price} onChange={e => setForm(p => ({ ...p, price: e.target.value }))}
            placeholder="Price (optional)" type="number" min="0" style={inputStyle} />
          <input value={form.urls} onChange={e => setForm(p => ({ ...p, urls: e.target.value }))}
            placeholder="URLs (space or comma separated)" style={inputStyle} />
        </div>
        <input value={form.description} onChange={e => setForm(p => ({ ...p, description: e.target.value }))}
          placeholder="Description (optional)" style={{ ...inputStyle, width: '100%', boxSizing: 'border-box', marginBottom: 8 }} />
        <input value={form.notes} onChange={e => setForm(p => ({ ...p, notes: e.target.value }))}
          placeholder="Notes (optional)" style={{ ...inputStyle, width: '100%', boxSizing: 'border-box', marginBottom: 10 }} />
        <div style={{ display: 'flex', gap: 8, justifyContent: 'flex-end' }}>
          <button onClick={() => setEditing(false)}
            style={{ padding: '5px 14px', borderRadius: 6, border: '1px solid #2a3a50', background: 'transparent', color: '#8ab4f8', cursor: 'pointer', fontSize: 12 }}>
            Cancel
          </button>
          <button onClick={handleSave} disabled={busy}
            style={{ padding: '5px 14px', borderRadius: 6, border: 'none', background: '#8ab4f8', color: '#0d1117', fontWeight: 600, cursor: 'pointer', fontSize: 12 }}>
            Save
          </button>
        </div>
      </div>
    );
  }

  return (
    <div style={{ background: '#1e2a3a', border: '1px solid #2a3a50', borderRadius: 8, padding: '12px 14px', marginBottom: 8,
                  display: 'flex', alignItems: 'flex-start', gap: 12 }}>
      {/* Priority dot */}
      <div style={{ width: 8, height: 8, borderRadius: '50%', background: priorityColor, marginTop: 5, flexShrink: 0 }} />
      <div style={{ flex: 1, minWidth: 0 }}>
        <div style={{ display: 'flex', alignItems: 'center', gap: 8, flexWrap: 'wrap', marginBottom: 3 }}>
          <span style={{ fontWeight: 600, fontSize: 14, color: '#e8eaed' }}>{item.item}</span>
          {item.price != null && (
            <span style={{ fontSize: 13, color: '#81c995', fontWeight: 600 }}>${Number(item.price).toLocaleString()}</span>
          )}
          <span style={{ fontSize: 11, padding: '2px 7px', borderRadius: 10, background: statusColor + '22', color: statusColor, border: '1px solid ' + statusColor + '44' }}>
            {item.status}
          </span>
          <span style={{ fontSize: 11, color: '#6b7c99' }}>{item.category}</span>
          {item.person && item.person !== 'Ahmed' && (
            <span style={{ fontSize: 11, padding: '1px 6px', borderRadius: 8, background: '#2a3a50', color: '#a0b0c8' }}>{item.person}</span>
          )}
        </div>
        {item.description && (
          <div style={{ fontSize: 12, color: '#8a9bb0', marginBottom: 4 }}>{item.description}</div>
        )}
        {urlList.length > 0 && (
          <div style={{ display: 'flex', gap: 6, flexWrap: 'wrap' }}>
            {urlList.map((url, i) => (
              <a key={i} href={url} target="_blank" rel="noopener noreferrer"
                style={{ fontSize: 11, color: '#8ab4f8', textDecoration: 'none' }}>
                🔗 Link {urlList.length > 1 ? i + 1 : ''}
              </a>
            ))}
          </div>
        )}
      </div>
      <div style={{ display: 'flex', gap: 6, flexShrink: 0 }}>
        {item.status !== 'Purchased' && (
          <button onClick={() => onMarkPurchased(item.id, item.item)} disabled={busy}
            title="Mark as purchased"
            style={{ padding: '4px 8px', borderRadius: 5, border: 'none', background: '#1a3a2a', color: '#81c995', cursor: 'pointer', fontSize: 12 }}>
            ✓ Got it
          </button>
        )}
        <button onClick={() => setEditing(true)} disabled={busy}
          style={{ padding: '4px 8px', borderRadius: 5, border: '1px solid #2a3a50', background: 'transparent', color: '#8ab4f8', cursor: 'pointer', fontSize: 12 }}>
          Edit
        </button>
        <button onClick={() => onDelete(item.id, item.item)} disabled={busy}
          style={{ padding: '4px 8px', borderRadius: 5, border: 'none', background: 'transparent', color: '#6b7c99', cursor: 'pointer', fontSize: 12 }}>
          ✕
        </button>
      </div>
    </div>
  );
}

function WishListTab({ wishList, onAdd, onUpdate, onMarkPurchased, onDelete, busy }) {
  const inputStyle = { background: '#0d1117', color: '#e8eaed', border: '1px solid #2a3a50', borderRadius: 6, padding: '6px 8px', fontSize: 13 };
  const [filterPerson, setFilterPerson] = React.useState('All');
  const [showPurchased, setShowPurchased] = React.useState(false);
  const [showForm, setShowForm] = React.useState(false);
  const [form, setForm] = React.useState({
    person: 'Ahmed', item: '', category: 'Tech', description: '',
    urls: '', price: '', priority: 'Medium', notes: '',
  });

  const active    = wishList.filter(w => w.status !== 'Purchased');
  const purchased = wishList.filter(w => w.status === 'Purchased');
  const totalValue = active.reduce((s, w) => s + (w.price || 0), 0);
  const readyCount = active.filter(w => w.status === 'Ready to Buy').length;

  function applyPersonFilter(items) {
    if (filterPerson === 'All') return items;
    return items.filter(w => w.person === filterPerson || w.person === 'Both');
  }

  function handleSubmit(e) {
    e.preventDefault();
    if (!form.item.trim()) return;
    onAdd(form);
    setForm({ person: 'Ahmed', item: '', category: 'Tech', description: '', urls: '', price: '', priority: 'Medium', notes: '' });
    setShowForm(false);
  }

  return (
    <div>
      {/* Stats bar */}
      {active.length > 0 && (
        <div style={{ display: 'flex', gap: 10, marginBottom: 16, flexWrap: 'wrap' }}>
          {[
            { label: 'Active Items', value: active.length },
            totalValue > 0 && { label: 'Total Value', value: '$' + totalValue.toLocaleString() },
            readyCount > 0 && { label: 'Ready to Buy', value: readyCount },
            purchased.length > 0 && { label: 'Purchased', value: purchased.length },
          ].filter(Boolean).map(s => (
            <div key={s.label} style={{ background: '#1e2a3a', border: '1px solid #2a3a50', borderRadius: 8,
                                        padding: '8px 14px', fontSize: 13, color: '#e8eaed' }}>
              <span style={{ fontWeight: 700 }}>{s.value}</span>
              <span style={{ color: '#6b7c99', marginLeft: 6 }}>{s.label}</span>
            </div>
          ))}
        </div>
      )}

      {/* Filter + Add button */}
      <div style={{ display: 'flex', gap: 8, marginBottom: 14, alignItems: 'center', flexWrap: 'wrap' }}>
        {['All', 'Ahmed', 'Victoria', 'Both'].map(p => (
          <button key={p} onClick={() => setFilterPerson(p)}
            style={{ padding: '4px 12px', borderRadius: 6, border: 'none', cursor: 'pointer', fontSize: 12,
                     background: filterPerson === p ? '#8ab4f8' : '#1e2a3a',
                     color: filterPerson === p ? '#0d1117' : '#8ab4f8' }}>
            {p}
          </button>
        ))}
        <button onClick={() => setShowForm(v => !v)} disabled={busy}
          style={{ marginLeft: 'auto', padding: '6px 16px', borderRadius: 6, border: 'none',
                   background: '#8ab4f8', color: '#0d1117', fontWeight: 600, cursor: 'pointer', fontSize: 13 }}>
          {showForm ? '✕ Cancel' : '+ Add Item'}
        </button>
      </div>

      {/* Add form */}
      {showForm && (
        <form onSubmit={handleSubmit}
          style={{ background: '#1e2a3a', borderRadius: 8, padding: '14px 16px', marginBottom: 16,
                   border: '1px solid #2a3a50', display: 'flex', flexDirection: 'column', gap: 10 }}>
          <div style={{ display: 'grid', gridTemplateColumns: '1fr 1fr', gap: 8 }}>
            <input required value={form.item} onChange={e => setForm(p => ({ ...p, item: e.target.value }))}
              placeholder="Item name *" style={inputStyle} />
            <select value={form.category} onChange={e => setForm(p => ({ ...p, category: e.target.value }))} style={inputStyle}>
              {WISH_CATEGORIES.map(c => <option key={c}>{c}</option>)}
            </select>
            <select value={form.person} onChange={e => setForm(p => ({ ...p, person: e.target.value }))} style={inputStyle}>
              {['Ahmed', 'Victoria', 'Both'].map(p => <option key={p}>{p}</option>)}
            </select>
            <select value={form.priority} onChange={e => setForm(p => ({ ...p, priority: e.target.value }))} style={inputStyle}>
              {WISH_PRIORITIES.map(p => <option key={p}>{p}</option>)}
            </select>
            <input value={form.price} onChange={e => setForm(p => ({ ...p, price: e.target.value }))}
              placeholder="Price (optional)" type="number" min="0" style={inputStyle} />
            <input value={form.urls} onChange={e => setForm(p => ({ ...p, urls: e.target.value }))}
              placeholder="URLs (optional, space/comma separated)" style={inputStyle} />
          </div>
          <input value={form.description} onChange={e => setForm(p => ({ ...p, description: e.target.value }))}
            placeholder="Description (optional)"
            style={{ ...inputStyle, width: '100%', boxSizing: 'border-box' }} />
          <input value={form.notes} onChange={e => setForm(p => ({ ...p, notes: e.target.value }))}
            placeholder="Notes (optional)"
            style={{ ...inputStyle, width: '100%', boxSizing: 'border-box' }} />
          <div style={{ display: 'flex', gap: 8, justifyContent: 'flex-end' }}>
            <button type="button" onClick={() => setShowForm(false)}
              style={{ padding: '6px 14px', borderRadius: 6, border: '1px solid #2a3a50', background: 'transparent', color: '#8ab4f8', cursor: 'pointer', fontSize: 13 }}>
              Cancel
            </button>
            <button type="submit" disabled={busy || !form.item.trim()}
              style={{ padding: '6px 16px', borderRadius: 6, border: 'none', background: '#8ab4f8', color: '#0d1117', fontWeight: 600, cursor: 'pointer', fontSize: 13 }}>
              🛍 Add
            </button>
          </div>
        </form>
      )}

      {/* Grouped active items */}
      {active.length === 0 && !showForm ? (
        <div style={{ textAlign: 'center', padding: '40px 20px', color: '#5f6368', fontSize: 14 }}>
          Nothing on your wish list yet. Add one above or tell VERA in chat.
        </div>
      ) : (
        WISH_STATUS_ORDER.map(status => {
          const items = applyPersonFilter(active.filter(w => w.status === status));
          if (items.length === 0) return null;
          const sorted = [...items].sort((a, b) => {
            const order = { High: 0, Medium: 1, Low: 2 };
            return (order[a.priority] || 1) - (order[b.priority] || 1);
          });
          return (
            <div key={status} style={{ marginBottom: 20 }}>
              <div style={{ fontSize: 12, fontWeight: 700, color: '#6b7c99', textTransform: 'uppercase',
                            letterSpacing: '0.08em', marginBottom: 8 }}>
                {status} <span style={{ fontWeight: 400, color: '#4d6080' }}>({items.length})</span>
              </div>
              {sorted.map(w => (
                <WishItemCard key={w.id} item={w} onUpdate={onUpdate} onMarkPurchased={onMarkPurchased} onDelete={onDelete} busy={busy} />
              ))}
            </div>
          );
        })
      )}

      {/* Purchased section (collapsed by default) */}
      {purchased.length > 0 && (
        <div style={{ marginTop: 8 }}>
          <button onClick={() => setShowPurchased(v => !v)}
            style={{ background: 'none', border: 'none', color: '#6b7c99', cursor: 'pointer', fontSize: 12, padding: '4px 0', marginBottom: 8 }}>
            {showPurchased ? '▾' : '▸'} Purchased ({purchased.length})
          </button>
          {showPurchased && applyPersonFilter(purchased).map(w => (
            <WishItemCard key={w.id} item={w} onUpdate={onUpdate} onMarkPurchased={onMarkPurchased} onDelete={onDelete} busy={busy} />
          ))}
        </div>
      )}
    </div>
  );
}

function ExploreTab({ interests, interestsLoading, onDeleteInterest, onAddInterest,
                      ideas, ideasLoading, onAddIdea, onPromoteIdea, onArchiveIdea, onShelveIdea,
                      resources, resourcesLoading, onAddResource, onUpdateResource, onDeleteResource,
                      experiments, experimentsLoading, onAddExperiment, onUpdateExperiment, onDeleteExperiment, onAddExperimentCheckin,
                      wishList, wishListLoading, onAddWishItem, onUpdateWishItem, onMarkWishPurchased, onDeleteWishItem,
                      busy, features }) {
  const feat = features || {};
  const allSubTabs = [
    { id: 'interests',   label: '💛 Interests' },
    { id: 'ideas',       label: '💡 Ideas' },
    { id: 'resources',   label: '📚 Resources' },
    { id: 'experiments', label: '🧪 Experiments', featureKey: 'experiments' },
    { id: 'wish_list',   label: '🛍 Wish List',   featureKey: 'wish_list'   },
  ];
  const subTabs = allSubTabs.filter(function(t) { return !t.featureKey || feat[t.featureKey] !== false; });
  const [sub, setSub] = React.useState('interests');
  React.useEffect(function() {
    if (subTabs.length > 0 && !subTabs.find(function(t) { return t.id === sub; })) {
      setSub(subTabs[0].id);
    }
  }, [subTabs.map(function(t) { return t.id; }).join(',')]);
  return (
    <div>
      <div className="subtab-row">
        {subTabs.map(s => (
          <button key={s.id} className={`subtab-btn${sub === s.id ? ' active' : ''}`}
            onClick={() => setSub(s.id)}>{s.label}</button>
        ))}
      </div>
      {sub === 'interests' && (
        interestsLoading
          ? <div className="loading-text">Loading interests…</div>
          : <SharedInterestTab
              interests={interests}
              onDelete={onDeleteInterest}
              onAdd={onAddInterest}
              busy={busy}
            />
      )}
      {sub === 'ideas' && (
        ideasLoading
          ? <div className="loading-text">Loading ideas…</div>
          : <IdeasTab
              ideas={ideas}
              onAdd={onAddIdea}
              onPromote={onPromoteIdea}
              onArchive={onArchiveIdea}
              onShelve={onShelveIdea}
              busy={busy}
            />
      )}
      {sub === 'resources' && (
        <ResourcesView
          resources={resources}
          loading={!!resourcesLoading}
          busy={busy}
          onAdd={onAddResource}
          onUpdate={onUpdateResource}
          onDelete={onDeleteResource}
        />
      )}
      {sub === 'experiments' && (
        experimentsLoading
          ? <div className="loading-text">Loading experiments…</div>
          : <ExperimentsTab
              experiments={experiments}
              onAdd={onAddExperiment}
              onUpdate={onUpdateExperiment}
              onDelete={onDeleteExperiment}
              onAddCheckin={onAddExperimentCheckin}
              busy={busy}
            />
      )}
      {sub === 'wish_list' && (
        wishListLoading
          ? <div className="loading-text">Loading wish list…</div>
          : <WishListTab
              wishList={wishList}
              onAdd={onAddWishItem}
              onUpdate={onUpdateWishItem}
              onMarkPurchased={onMarkWishPurchased}
              onDelete={onDeleteWishItem}
              busy={busy}
            />
      )}
    </div>
  );
}

function AddInterestModal({ onSave, onClose, busy }) {
  const [person,   setPerson]   = React.useState('Ahmed');
  const [interest, setInterest] = React.useState('');
  const [category, setCategory] = React.useState('Other');
  const [notes,    setNotes]    = React.useState('');

  function handleKeyDown(e) {
    if (e.key === 'Enter' && interest.trim()) onSave({ person, interest, category, notes });
    if (e.key === 'Escape') onClose();
  }

  return (
    <div className="modal-overlay" onClick={e => e.target === e.currentTarget && onClose()}>
      <div className="modal" style={{ maxWidth: 400 }}>
        <h2>Log Interest</h2>

        <label className="form-label">Person *</label>
        <select className="form-input" value={person} onChange={e => setPerson(e.target.value)}>
          <option value="Ahmed">Ahmed</option>
          <option value="Victoria">Victoria</option>
        </select>

        <label className="form-label">Interest *</label>
        <input
          className="form-input"
          value={interest}
          onChange={e => setInterest(e.target.value)}
          onKeyDown={handleKeyDown}
          placeholder="e.g. specialty coffee, visit Round Rock TX"
          autoFocus
        />

        <label className="form-label">Category</label>
        <select className="form-input" value={category} onChange={e => setCategory(e.target.value)}>
          {INTEREST_CATEGORIES_UI.map(c => <option key={c} value={c}>{c}</option>)}
        </select>

        <label className="form-label">Notes (optional)</label>
        <input
          className="form-input"
          value={notes}
          onChange={e => setNotes(e.target.value)}
          onKeyDown={handleKeyDown}
          placeholder="e.g. mentioned during grocery trip"
        />

        <div className="modal-actions">
          <button className="btn" onClick={onClose}>Cancel</button>
          <button
            className="btn btn-primary"
            disabled={!interest.trim() || busy}
            onClick={() => onSave({ person, interest, category, notes })}
          >
            Log Interest
          </button>
        </div>
      </div>
    </div>
  );
}

    } catch(e) {}
    return [{ role: 'vera', text: VERA_CHAT_WELCOME }];
  });
  useEffect(function() {

      const toSave = chatMessages.slice(-100).map(function(m) { return { role: m.role, text: m.text }; });
      localStorage.setItem(CHAT_STORAGE_KEY, JSON.stringify(toSave));

  // even when SpreadsheetApp.flush() hasn't been deployed and the sheet read is stale.
  // Keys: 'row:N' (sheet bills) or 'title:lowercasedTitle' (calendar-only bills).
  const paidLocksRef = useRef({});

  const milestones = pto?.milestones || [];

  const loadAll = useCallback(async (url, token, activeOnly) => {
    if (!url || !token) return;
    setLoading(true);
    setError(null);
    try {
      const [s, f, t, sm] = await Promise.all([
        apiGet(url, token, { action: 'status' }),
        apiGet(url, token, { action: 'flags', filter: activeOnly ? 'active' : '' }),
        apiGet(url, token, { action: 'tasks' }),
        apiGet(url, token, { action: 'summaries' }),
      ]);
      setStatus(s);
      // Sort flags: High first, then Medium, then Low
      const order = { High: 0, Medium: 1, Low: 2 };
      const sorted = (f.flags || []).sort((a, b) =>
        (order[a.urgency] ?? 3) - (order[b.urgency] ?? 3)
      );
      setFlags(sorted);
      setTasks(t.tasks || []);
      setSummaries(sm.summaries || []);
      setLastUpdated(new Date());
    } catch (err) {
      setError(err.message);
    }
    setLoading(false);
  }, []);

  // Load on mount and when filter changes
  useEffect(() => {
    if (apiUrl && apiToken) loadAll(apiUrl, apiToken, filterActive);
  }, [apiUrl, apiToken, filterActive, loadAll]);

  // Pre-load lazy tab data so the Home tab has something to show
  useEffect(() => {
    if (apiUrl && apiToken) {
      loadGoogleTasks(apiUrl, apiToken);
      loadProjects(apiUrl, apiToken);
      loadGoals(apiUrl, apiToken);
      loadShopping(apiUrl, apiToken);
      loadPTO(apiUrl, apiToken);
      loadPacingStatus(apiUrl, apiToken);
    }

  function showToast(msg, isError) {
    setToast({ msg, isError: !!isError });
    if (toastTimer.current) clearTimeout(toastTimer.current);
    toastTimer.current = setTimeout(() => setToast(null), 3000);
  }

  async function handleAction(action, id, days) {
    setBusy(true);
    setError(null);

    // Optimistic UI update — show result immediately so the user
    // sees the badge change before loadAll re-filters the list
    setFlags(prev => prev.map(f => {
      if (f.id !== id) return f;
      if (action === 'acknowledge') return { ...f, acknowledged: true };
      if (action === 'resolve')     return { ...f, resolved: true };
      if (action === 'snooze')      return { ...f, snoozedUntil: 'soon' };
      return f;
    }));

    try {
      const params = { id };
      if (days != null) params.days = days;
      await apiAction(apiUrl, apiToken, action, params);

      const labels = {
        acknowledge: '✓ Flag acknowledged',
        resolve:     '✓ Flag resolved',
        snooze:      '💤 Flag snoozed for ' + (days || 2) + 'd',
      };
      showToast(labels[action] || '✓ Done');

      // Short delay lets the user see the state change badge before
      // loadAll re-fetches and filters the flag out of the active view
      setTimeout(() => loadAll(apiUrl, apiToken, filterActive), 1500);
    } catch (err) {
      setError('Action failed: ' + err.message);
      // Revert optimistic update by re-fetching real state
      await loadAll(apiUrl, apiToken, filterActive);
    }
    setBusy(false);
  }

  async function handleComplete(id) {
    if (!id) return;
    setCompletingIds(prev => ({ ...prev, [id]: true }));
    try {
      const res = await apiAction(apiUrl, apiToken, 'complete_task', { id });
      if (res.recurring && res.nextDueDate) {
        showToast(`✓ Done! 🔁 Next occurrence scheduled for ${res.nextDueDate}`);
      } else {
        showToast('✓ Task marked done');
      }
      setTimeout(() => loadAll(apiUrl, apiToken, filterActive), 1500);
    } catch (err) {
      setError('Could not complete task: ' + err.message);
      setCompletingIds(prev => { const n = { ...prev }; delete n[id]; return n; });
    }
  }

      e.ID === bucketId
        ? { ...e, activities: [...(e.activities || []), { ID: tempId, 'Bucket ID': bucketId, Activity: activity, Done: '' }] }
        : e

    try {
      const data = await apiGet(apiUrl, apiToken, { action: 'add_bucket_activity', bucketId, activity });

        setBucketList(prev => (prev || []).map(e =>
          e.ID === bucketId

  async function loadBills(url, token) {
    if (!url || !token) return;
    setTabLoading(prev => ({ ...prev, bills: true }));
    try {
      const data = await apiGet(url, token, { action: 'bills' });
      // Apply paidLocksRef so previously-toggled bills are never reverted by a stale sheet read
      if (data && data.bills) {
        const locks = paidLocksRef.current;
        data.bills = data.bills.map(function(b) {
          if (b.row != null && locks['row:'+b.row] !== undefined)
            return Object.assign({}, b, { paid: locks['row:'+b.row] });
          const tl = (b.bill || '').trim().toLowerCase();
          if (locks['title:'+tl] !== undefined)
            return Object.assign({}, b, { paid: locks['title:'+tl] });
          return b;
        });
      }
      setBills(data || null);
    } catch (err) {
      setError('Bills load failed: ' + err.message);
    }
    setTabLoading(prev => ({ ...prev, bills: false }));
  }

  async function loadCalendarBills(url, token) {
    if (!url || !token) return;
    try {
      const data = await apiGet(url, token, { action: 'calendar_bills' });
      let arr = data?.bills || [];
      // Apply paidLocksRef to guard against stale calendar bill reads
      const locks = paidLocksRef.current;
      if (arr.length > 0 && Object.keys(locks).length > 0) {
        arr = arr.map(function(b) {
          const tl = (b.title || '').trim().toLowerCase();
          if (locks['title:'+tl] !== undefined)
            return Object.assign({}, b, { paid: locks['title:'+tl] });
          return b;
        });
      }
      setCalBills(arr);
    } catch (err) {
      setError('Calendar bills load failed: ' + err.message);
    }
  }

  async function handleCalendarBillToggle(calBill) {
    // Optimistic update: flip paid on matching sheet bill (by title) if it has a row
    setBills(prev => {
      if (!prev || !prev.bills) return prev;
      const titleLow = (calBill.title || '').toLowerCase();
      return { ...prev, bills: prev.bills.map(b =>
        b.bill.toLowerCase() === titleLow ? { ...b, paid: !b.paid } : b
      )};
    });
    // Also flip in calBills so calendar-only bills (no sheet row yet) update instantly
    setCalBills(prev => (prev || []).map(b =>
      b.title === calBill.title ? { ...b, paid: !b.paid } : b
    ));
    setBusy(true);
    try {
      const toggleResult = await apiGet(apiUrl, apiToken, {
        action:      'bills_toggle_cal',
        title:       calBill.title,
        amount:      calBill.amount != null ? calBill.amount : '',
        date:        calBill.date || '',
        frequency:   calBill.isRecurring ? 'Recurring' : 'One-time',
        category:    calBill.category || '',
        notes:       calBill.notes   || '',
        isRecurring: String(!!calBill.isRecurring),
      });
      // Lock the authoritative paid value BEFORE loadBills so the stale sheet read
      // can never revert this bill (or any other previously-toggled bill in the locks map)
      if (toggleResult && toggleResult.ok) {
        const titleLow = (calBill.title || '').trim().toLowerCase();
        paidLocksRef.current['title:'+titleLow] = !!toggleResult.paid;
      }
      await loadBills(apiUrl, apiToken);
      // Belt-and-suspenders: force the correct paid state one more time after reload
      if (toggleResult && toggleResult.ok) {
        const titleLow = (calBill.title || '').trim().toLowerCase();
        const paid     = !!toggleResult.paid;
        setBills(prev => {
          if (!prev || !prev.bills) return prev;
          return { ...prev, bills: prev.bills.map(b =>
            b.bill.trim().toLowerCase() === titleLow ? { ...b, paid } : b
          )};
        });
        setCalBills(prev => (prev || []).map(b =>
          b.title.trim().toLowerCase() === titleLow ? { ...b, paid } : b
        ));
      }
      await loadCalendarBills(apiUrl, apiToken);
    } catch (err) {
      // Remove the lock so the next reload shows the real sheet state
      const titleLow = (calBill.title || '').trim().toLowerCase();
      delete paidLocksRef.current['title:'+titleLow];
      setError('Could not update bill: ' + err.message);
      await loadBills(apiUrl, apiToken);
      await loadCalendarBills(apiUrl, apiToken);
    }
    setBusy(false);
  }

  async function handleBillToggle(row) {
    // Optimistic update: flip paid immediately so the badge switches to ✅ Paid
    setBills(prev => {
      if (!prev || !prev.bills) return prev;
      return { ...prev, bills: prev.bills.map(b => b.row === row ? { ...b, paid: !b.paid } : b) };
    });
    setBusy(true);
    try {
      const toggleResult = await apiGet(apiUrl, apiToken, { action: 'bills_toggle', row: row });
      // Lock authoritative paid value BEFORE loadBills to protect all previously-toggled bills
      if (toggleResult && toggleResult.ok) {
        paidLocksRef.current['row:'+row] = !!toggleResult.paid;
      }
      await loadBills(apiUrl, apiToken);
      // Belt-and-suspenders: force correct paid state one more time after reload
      if (toggleResult && toggleResult.ok) {
        const paid = !!toggleResult.paid;
        setBills(prev => {
          if (!prev || !prev.bills) return prev;
          return { ...prev, bills: prev.bills.map(b => b.row === row ? { ...b, paid } : b) };
        });
      }
      await loadCalendarBills(apiUrl, apiToken);
    } catch (err) {
      delete paidLocksRef.current['row:'+row];
      setError('Could not update bill: ' + err.message);
      await loadBills(apiUrl, apiToken);
      await loadCalendarBills(apiUrl, apiToken);
    }
    setBusy(false);
  }

  // ---- Packing handlers -------------------------------------------------------

  async function loadTripMeta(tripKey) {
    if (!tripKey || !apiUrl || !apiToken) return;
    setTripMeta(function(prev) { return Object.assign({}, prev, { [tripKey]: 'loading' }); });
    try {
      const data = await apiGet(apiUrl, apiToken, { action: 'get_trip_meta', tripKey });
      setTripMeta(function(prev) {
        return Object.assign({}, prev, { [tripKey]: { context: data.context || '', notes: data.notes || '', traveler: data.traveler || '' } });
      });
    } catch(err) {
      setTripMeta(function(prev) { const n = Object.assign({}, prev); delete n[tripKey]; return n; });
    }
  }

  async function handleSetTripMeta(tripKey, context, notes, traveler) {
    if (!apiUrl || !apiToken) return;
    try {
      await apiGet(apiUrl, apiToken, { action: 'set_trip_meta', tripKey, context: context || '', notes: notes || '', traveler: traveler || '' });
      setTripMeta(function(prev) {
        return Object.assign({}, prev, { [tripKey]: { context: context || '', notes: notes || '', traveler: traveler || '' } });
      });
    } catch(err) { setError('Could not save trip context: ' + err.message); }
  }

  async function loadPacking(tripKey) {
    if (!tripKey || !apiUrl || !apiToken) return;
    setPackingItems(function(prev) { return Object.assign({}, prev, { [tripKey]: 'loading' }); });
    try {
      const data = await apiGet(apiUrl, apiToken, { action: 'get_packing', tripKey });
      setPackingItems(function(prev) { return Object.assign({}, prev, { [tripKey]: { items: data.items || [] } }); });
      if (data.meta && data.meta.context !== undefined) {
        setTripMeta(function(prev) {
          return Object.assign({}, prev, { [tripKey]: { context: data.meta.context || '', notes: data.meta.notes || '' } });
        });
      }
    } catch(err) {
      setPackingItems(function(prev) { const n = Object.assign({}, prev); delete n[tripKey]; return n; });
      setError('Could not load packing list: ' + err.message);
    }
  }

  async function handleGeneratePacking(tripKey, startDate, endDate) {
    if (!apiUrl || !apiToken) return;
    setBusy(true);
    setPackingItems(function(prev) { return Object.assign({}, prev, { [tripKey]: 'loading' }); });
    try {
      const data = await apiGet(apiUrl, apiToken, { action: 'generate_packing', tripKey, startDate, endDate });
      setPackingItems(function(prev) { return Object.assign({}, prev, { [tripKey]: { items: data.items || [] } }); });
      if (data.meta) {
        setTripMeta(function(prev) {
          return Object.assign({}, prev, { [tripKey]: { context: (data.meta.context || ''), notes: '' } });
        });
      }
      showToast('✨ Packing list generated by VERA');
    } catch(err) {
      setPackingItems(function(prev) { const n = Object.assign({}, prev); delete n[tripKey]; return n; });
      setError('Generate failed: ' + err.message);
    }
    setBusy(false);
  }

  async function handleTogglePackingItem(id, tripKey, currentChecked) {
    // Optimistic update
    setPackingItems(function(prev) {
      const entry = prev[tripKey];
      if (!entry || entry === 'loading') return prev;
      return Object.assign({}, prev, {
        [tripKey]: Object.assign({}, entry, {
          items: entry.items.map(function(it) {
            return it.id === id ? Object.assign({}, it, { checked: !currentChecked }) : it;
          }),
        }),
      });
    });
    try {
      await apiGet(apiUrl, apiToken, { action: 'update_packing_item', id, checked: String(!currentChecked) });
    } catch(err) {
      setError('Could not update item');
      loadPacking(tripKey); // revert
    }
  }

  async function handleAddPackingItem(tripKey, person, category, item) {
    if (!apiUrl || !apiToken) return;
    setBusy(true);
    try {
      await apiGet(apiUrl, apiToken, { action: 'add_packing_item', tripKey, person, category, item });
      await loadPacking(tripKey);
    } catch(err) { setError('Could not add packing item: ' + err.message); }
    setBusy(false);
  }

  async function handleDeletePackingItem(id, tripKey) {
    // Optimistic remove
    setPackingItems(function(prev) {
      const entry = prev[tripKey];
      if (!entry || entry === 'loading') return prev;
      return Object.assign({}, prev, {
        [tripKey]: Object.assign({}, entry, { items: entry.items.filter(function(it) { return it.id !== id; }) }),
      });
    });
    try {
      await apiGet(apiUrl, apiToken, { action: 'delete_packing_item', id });
    } catch(err) {
      setError('Could not delete packing item');
      loadPacking(tripKey);
    }
  }

  function handleGoToPacking(tripKey) {
    // Force re-trigger even if same key by clearing first
    setPackingFocusTripKey(null);
    setTimeout(function() { setPackingFocusTripKey(tripKey); }, 0);
  }

  // ---- Recommendations handlers (Issue #73) -----------------------------------

  async function loadRecs(tripKey) {
    if (!tripKey || !apiUrl || !apiToken) return;
    setRecommendations(function(prev) { return Object.assign({}, prev, { [tripKey]: 'loading' }); });
    try {
      const data = await apiGet(apiUrl, apiToken, { action: 'recommendations', tripKey });
      setRecommendations(function(prev) { return Object.assign({}, prev, { [tripKey]: data.recs || [] }); });
    } catch(err) {
      setRecommendations(function(prev) { const n = Object.assign({}, prev); delete n[tripKey]; return n; });
    }
  }

  async function handleGenerateRecs(tripKey, startDate, endDate) {
    if (!apiUrl || !apiToken) return;
    setBusy(true);
    setRecommendations(function(prev) { return Object.assign({}, prev, { [tripKey]: 'loading' }); });
    try {
      const data = await apiGet(apiUrl, apiToken, { action: 'generate_recommendations', tripKey, startDate, endDate });
      setRecommendations(function(prev) { return Object.assign({}, prev, { [tripKey]: data.recs || [] }); });
      showToast('✨ Recommendations generated by VERA');
    } catch(err) {
      setRecommendations(function(prev) { const n = Object.assign({}, prev); delete n[tripKey]; return n; });
      setError('Generate failed: ' + err.message);
    }
    setBusy(false);
  }

  async function handleAcceptRec(recId, tripKey) {
    if (!apiUrl || !apiToken) return;
    setBusy(true);
    try {
      const data = await apiGet(apiUrl, apiToken, { action: 'accept_recommendation', recId, tripKey });
      setRecommendations(function(prev) { return Object.assign({}, prev, { [tripKey]: data.recs || [] }); });
      // Reload itinerary so the new item appears
      const trip = (pto && pto.ahmedStats && pto.ahmedStats.upcomingTravel || []).find(function(t) {
        return (t.startDate + '|' + t.label) === tripKey;
      });
      if (trip) loadItinerary(tripKey, trip.startDate, trip.endDate);
      showToast('✅ Added to your itinerary');
    } catch(err) { setError('Could not add recommendation: ' + err.message); }
    setBusy(false);
  }

  async function handleDismissRec(recId) {
    if (!apiUrl || !apiToken) return;
    try {
      await apiGet(apiUrl, apiToken, { action: 'update_recommendation', id: recId, status: 'dismissed' });
      // Optimistic update — mark dismissed in local state
      setRecommendations(function(prev) {
        const updated = {};
        Object.keys(prev).forEach(function(tk) {
          const recs = prev[tk];
          if (!Array.isArray(recs)) { updated[tk] = recs; return; }
          updated[tk] = recs.map(function(r) {
            return r.id === recId ? Object.assign({}, r, { status: 'dismissed' }) : r;
          });
        });
        return updated;
      });
    } catch(err) { setError('Could not dismiss recommendation'); }
  }
