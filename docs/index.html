<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>VERA Dashboard</title>
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: #080f1e;
      color: #dde1f0;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif;
      min-height: 100vh;
    }

    /* ---- Scrollbar ---- */
    ::-webkit-scrollbar { width: 6px; }
    ::-webkit-scrollbar-track { background: #0d1b3e; }
    ::-webkit-scrollbar-thumb { background: #2a3a5e; border-radius: 3px; }

    /* ---- Header ---- */
    .header {
      background: linear-gradient(135deg, #0d1b3e 0%, #152547 100%);
      border-bottom: 1px solid #1e3060;
      padding: 0 28px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      height: 60px;
      position: sticky;
      top: 0;
      z-index: 100;
    }
    .logo {
      display: flex;
      align-items: baseline;
      gap: 10px;
    }
    .logo-name {
      font-size: 22px;
      font-weight: 800;
      letter-spacing: 4px;
      color: #fff;
    }
    .logo-sub {
      font-size: 10px;
      letter-spacing: 2px;
      color: #c9a84c;
      text-transform: uppercase;
    }
    .header-actions {
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .last-updated {
      font-size: 11px;
      color: #6b7fa8;
    }

    /* ---- Status bar ---- */
    .status-bar {
      background: #0d1b3e;
      border-bottom: 1px solid #1e3060;
      padding: 12px 28px;
      display: flex;
      gap: 20px;
      align-items: center;
    }
    .stat-pill {
      display: flex;
      align-items: center;
      gap: 7px;
      background: #13244d;
      border-radius: 20px;
      padding: 5px 14px;
      font-size: 13px;
    }
    .stat-dot {
      width: 9px;
      height: 9px;
      border-radius: 50%;
    }
    .stat-count { font-weight: 700; color: #fff; }
    .stat-label { color: #8a9abf; }

    /* ---- Tabs ---- */
    .tabs {
      background: #0d1b3e;
      border-bottom: 1px solid #1e3060;
      padding: 0 28px;
      display: flex;
      gap: 4px;
    }
    .tab-btn {
      background: none;
      border: none;
      border-bottom: 3px solid transparent;
      color: #6b7fa8;
      cursor: pointer;
      font-size: 13px;
      font-weight: 600;
      letter-spacing: 0.5px;
      padding: 12px 16px;
      text-transform: uppercase;
      transition: color .15s, border-color .15s;
    }
    .tab-btn:hover { color: #c9a84c; }
    .tab-btn.active { color: #c9a84c; border-bottom-color: #c9a84c; }

    /* ---- Main content ---- */
    .main { padding: 24px 28px; max-width: 960px; }

    /* ---- Toolbar ---- */
    .toolbar {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 20px;
    }
    .filter-toggle {
      background: #13244d;
      border: 1px solid #1e3060;
      border-radius: 20px;
      color: #8a9abf;
      cursor: pointer;
      font-size: 12px;
      font-weight: 600;
      padding: 5px 14px;
      transition: all .15s;
    }
    .filter-toggle.on { background: #1e3878; border-color: #3d5fa0; color: #c9d9ff; }
    .count-badge {
      background: #13244d;
      border-radius: 10px;
      color: #6b7fa8;
      font-size: 12px;
      margin-left: auto;
      padding: 3px 10px;
    }

    /* ---- Flag card ---- */
    .flag-card {
      border-radius: 10px;
      border-left: 4px solid;
      margin-bottom: 12px;
      padding: 16px 18px;
      transition: opacity .2s;
    }
    .flag-card.high   { background: #1f0e0e; border-color: #e53935; }
    .flag-card.medium { background: #1f1608; border-color: #f9a825; }
    .flag-card.low    { background: #0a1f10; border-color: #43a047; }
    .flag-card.done   { opacity: 0.45; }

    .flag-meta {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 8px;
      flex-wrap: wrap;
    }
    .urgency-badge {
      border-radius: 4px;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.5px;
      padding: 2px 8px;
      text-transform: uppercase;
    }
    .urgency-badge.high   { background: #e53935; color: #fff; }
    .urgency-badge.medium { background: #f9a825; color: #1a1000; }
    .urgency-badge.low    { background: #43a047; color: #fff; }

    .source-badge {
      background: #1e3060;
      border-radius: 4px;
      color: #8ab0d8;
      font-size: 11px;
      font-weight: 600;
      padding: 2px 8px;
    }
    .flag-date { color: #6b7fa8; font-size: 11px; margin-left: auto; }

    .flag-title {
      color: #e8ecf8;
      font-size: 15px;
      font-weight: 600;
      margin-bottom: 5px;
    }
    .flag-reason { color: #8a9abf; font-size: 13px; line-height: 1.5; }

    .flag-actions {
      display: flex;
      gap: 8px;
      margin-top: 12px;
      flex-wrap: wrap;
    }

    /* ---- Buttons ---- */
    .btn {
      border: none;
      border-radius: 6px;
      cursor: pointer;
      font-size: 12px;
      font-weight: 600;
      padding: 6px 14px;
      transition: opacity .15s, transform .1s;
    }
    .btn:hover { opacity: 0.85; transform: translateY(-1px); }
    .btn:active { transform: translateY(0); }
    .btn:disabled { opacity: 0.4; cursor: not-allowed; transform: none; }
    .btn-ack     { background: #1e3878; color: #c9d9ff; }
    .btn-snooze  { background: #3d2e10; color: #ffd54f; }
    .btn-resolve { background: #0f3020; color: #69f0ae; }
    .btn-primary { background: #c9a84c; color: #0d1b3e; }
    .btn-ghost   { background: #13244d; color: #8a9abf; }
    .btn-refresh { background: #13244d; border: 1px solid #1e3060; color: #8a9abf; }
    .btn-settings{ background: none; border: none; color: #6b7fa8; cursor: pointer; font-size: 18px; padding: 4px 8px; }
    .btn-settings:hover { color: #c9a84c; }

    /* ---- Task card ---- */
    .task-card {
      background: #0d1b3e;
      border: 1px solid #1e3060;
      border-radius: 10px;
      display: flex;
      align-items: flex-start;
      gap: 14px;
      margin-bottom: 10px;
      padding: 14px 16px;
      transition: opacity .3s;
    }
    .task-card.completing { opacity: 0.45; }

    .task-check {
      background: none;
      border: 2px solid #2a3a5e;
      border-radius: 50%;
      color: transparent;
      cursor: pointer;
      flex-shrink: 0;
      font-size: 13px;
      font-weight: 700;
      height: 22px;
      width: 22px;
      margin-top: 1px;
      padding: 0;
      transition: all .15s;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .task-check:hover:not(:disabled) { border-color: #43a047; color: #43a047; }
    .task-check.completing { background: #43a047; border-color: #43a047; color: #fff; }
    .task-check:disabled { cursor: not-allowed; }
    .task-age {
      background: #13244d;
      border-radius: 6px;
      color: #6b7fa8;
      font-size: 11px;
      font-weight: 700;
      min-width: 48px;
      padding: 4px 8px;
      text-align: center;
    }
    .task-age.overdue  { background: #3d1515; color: #ff6b6b; }
    .task-age.neglected{ background: #3d2e10; color: #ffd54f; }
    .task-info { flex: 1; }
    .task-title { color: #e8ecf8; font-size: 14px; font-weight: 600; margin-bottom: 4px; }
    .task-meta  { color: #6b7fa8; font-size: 12px; }
    .task-due   { color: #ff6b6b; }

    /* ---- Summaries table ---- */
    .summaries-table {
      background: #0d1b3e;
      border: 1px solid #1e3060;
      border-radius: 10px;
      overflow: hidden;
      width: 100%;
    }
    .summaries-table th {
      background: #13244d;
      color: #6b7fa8;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.5px;
      padding: 10px 16px;
      text-align: left;
      text-transform: uppercase;
    }
    .summaries-table td {
      border-top: 1px solid #1e3060;
      color: #dde1f0;
      font-size: 13px;
      padding: 10px 16px;
    }
    .summaries-table tr:hover td { background: #13244d; }
    .summary-value { color: #c9a84c; font-weight: 600; }

    /* ---- Settings modal ---- */
    .modal-overlay {
      background: rgba(0,0,0,0.75);
      bottom: 0; left: 0; right: 0; top: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      position: fixed;
      z-index: 200;
    }
    .modal {
      background: #0d1b3e;
      border: 1px solid #1e3060;
      border-radius: 14px;
      padding: 32px;
      width: 480px;
      max-width: 95vw;
    }
    .modal h2 { color: #fff; font-size: 18px; margin-bottom: 6px; }
    .modal p  { color: #6b7fa8; font-size: 13px; margin-bottom: 24px; }
    .form-group { margin-bottom: 16px; }
    .form-label { color: #8a9abf; display: block; font-size: 12px; font-weight: 700; letter-spacing: 0.5px; margin-bottom: 6px; text-transform: uppercase; }
    .form-input {
      background: #13244d;
      border: 1px solid #1e3060;
      border-radius: 8px;
      color: #e8ecf8;
      font-family: monospace;
      font-size: 13px;
      outline: none;
      padding: 10px 14px;
      transition: border-color .15s;
      width: 100%;
    }
    .form-input:focus { border-color: #c9a84c; }
    .form-hint { color: #4d6080; font-size: 11px; margin-top: 4px; }
    .modal-actions { display: flex; gap: 10px; justify-content: flex-end; margin-top: 24px; }

    /* ---- States ---- */
    .empty-state {
      background: #0d1b3e;
      border: 1px dashed #1e3060;
      border-radius: 10px;
      color: #4d6080;
      font-size: 14px;
      padding: 48px;
      text-align: center;
    }
    .error-banner {
      background: #3d1515;
      border: 1px solid #e53935;
      border-radius: 8px;
      color: #ff8a80;
      font-size: 13px;
      margin-bottom: 16px;
      padding: 12px 16px;
    }
    .loading-text { color: #6b7fa8; font-size: 13px; padding: 48px; text-align: center; }

    .snoozed-label {
      background: #3d2e10;
      border-radius: 4px;
      color: #ffd54f;
      font-size: 11px;
      font-weight: 600;
      padding: 2px 8px;
    }

    /* ---- Chat panel ---- */
    .chat-wrap {
      display: flex;
      flex-direction: column;
      height: calc(100vh - 215px);
      min-height: 400px;
    }
    .chat-messages {
      flex: 1;
      overflow-y: auto;
      padding: 4px 0 16px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .chat-msg {
      max-width: 78%;
      padding: 11px 16px;
      border-radius: 16px;
      font-size: 14px;
      line-height: 1.55;
      white-space: pre-wrap;
      word-break: break-word;
    }
    .chat-msg.vera {
      background: #0d1b3e;
      border: 1px solid #1e3060;
      border-bottom-left-radius: 4px;
      color: #dde1f0;
      align-self: flex-start;
    }
    .chat-msg.user {
      background: #1e3878;
      border: 1px solid #3d5fa0;
      border-bottom-right-radius: 4px;
      color: #c9d9ff;
      align-self: flex-end;
    }
    .chat-msg.vera-typing {
      color: #6b7fa8;
      font-style: italic;
    }
    .chat-input-area {
      border-top: 1px solid #1e3060;
      padding-top: 12px;
    }
    .chat-input-row {
      display: flex;
      gap: 10px;
    }
    .chat-input {
      flex: 1;
      background: #0d1b3e;
      border: 1px solid #1e3060;
      border-radius: 10px;
      color: #e8ecf8;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif;
      font-size: 14px;
      line-height: 1.4;
      outline: none;
      padding: 10px 14px;
      resize: none;
      transition: border-color .15s;
    }
    .chat-input:focus { border-color: #c9a84c; }
    .chat-input::placeholder { color: #3d5280; }
    .chat-send {
      background: #c9a84c;
      border: none;
      border-radius: 10px;
      color: #0d1b3e;
      cursor: pointer;
      font-size: 20px;
      font-weight: 700;
      padding: 0 18px;
      align-self: flex-end;
      height: 44px;
      transition: opacity .15s;
    }
    .chat-send:hover { opacity: 0.85; }
    .chat-send:disabled { opacity: 0.35; cursor: not-allowed; }

    /* ---- Image attachment (chat) ---- */
    .chat-img-preview {
      position: relative;
      display: inline-flex;
      align-items: flex-start;
      margin-bottom: 8px;
    }
    .chat-img-preview img {
      max-height: 80px;
      max-width: 120px;
      border-radius: 8px;
      border: 1px solid #1e3060;
      object-fit: cover;
    }
    .chat-img-remove {
      position: absolute;
      top: -6px;
      right: -6px;
      background: #e53935;
      color: #fff;
      border: none;
      border-radius: 50%;
      width: 18px;
      height: 18px;
      font-size: 11px;
      cursor: pointer;
      line-height: 18px;
      padding: 0;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .chat-attach {
      background: none;
      border: 1px solid #2a4070;
      border-radius: 10px;
      color: #8899cc;
      font-size: 18px;
      padding: 0 12px;
      cursor: pointer;
      align-self: flex-end;
      height: 44px;
      transition: border-color .15s, color .15s;
    }
    .chat-attach:hover  { border-color: #c9a84c; color: #c9a84c; }
    .chat-attach:disabled { opacity: .4; cursor: not-allowed; }
    .chat-msg-img {
      display: block;
      max-width: 200px;
      max-height: 140px;
      border-radius: 8px;
      margin-bottom: 6px;
      object-fit: cover;
      border: 1px solid rgba(255,255,255,.1);
    }

    /* ---- Travel sub-tab pills ---- */
    .subtab-row {
      display: flex;
      gap: 8px;
      margin-bottom: 18px;
      flex-wrap: wrap;
    }
    .subtab-btn {
      background: none;
      border: 1px solid #1e3060;
      border-radius: 20px;
      color: #6b7fa8;
      font-size: 12px;
      padding: 5px 14px;
      cursor: pointer;
      transition: border-color .15s, color .15s;
      white-space: nowrap;
    }
    .subtab-btn:hover  { border-color: #3d5fa0; color: #c9d9ff; }
    .subtab-btn.active { border-color: #c9a84c; color: #c9a84c; background: rgba(201,168,76,.08); }

    /* ---- Toast notification ---- */
    .toast {
      position: fixed;
      bottom: 28px;
      right: 28px;
      background: #0f3020;
      border: 1px solid #43a047;
      border-radius: 10px;
      color: #69f0ae;
      font-size: 14px;
      font-weight: 600;
      padding: 14px 22px;
      z-index: 300;
      box-shadow: 0 4px 20px rgba(0,0,0,0.5);
      animation: slideUp 0.2s ease;
    }
    .toast.error {
      background: #3d1515;
      border-color: #e53935;
      color: #ff8a80;
    }
    @keyframes slideUp {
      from { opacity: 0; transform: translateY(12px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    /* ---- Date input dark theme ---- */
    input[type="date"].form-input {
      color-scheme: dark;
    }
    .btn-edit {
      background: none;
      border: none;
      color: #4d6080;
      cursor: pointer;
      font-size: 14px;
      padding: 2px 6px;
      border-radius: 4px;
      flex-shrink: 0;
      line-height: 1;
    }
    .btn-edit:hover { color: #c9a84c; background: #13244d; }

    /* ---- Yearly Goals Kanban ---- */
    .kanban-board {
      display: flex;
      gap: 12px;
      overflow-x: auto;
      padding-bottom: 12px;
      align-items: flex-start;
    }
    .kanban-col {
      flex: 0 0 220px;
      background: #0d1b3e;
      border-radius: 10px;
      padding: 12px;
      border: 2px solid #1e3a6e;
      transition: border-color 0.15s;
    }
    .kanban-col.drag-over { border-color: #c9a84c; }
    .kanban-col-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 10px;
    }
    .kanban-col-title {
      font-size: 13px;
      font-weight: 700;
      color: #c9a84c;
      letter-spacing: 0.5px;
      text-transform: uppercase;
    }
    .kanban-col-count {
      font-size: 11px;
      background: #1e3a6e;
      color: #8ab4f8;
      border-radius: 10px;
      padding: 2px 7px;
    }
    .kanban-add-btn {
      width: 100%;
      background: none;
      border: 1px dashed #2a4580;
      border-radius: 6px;
      color: #4d6080;
      font-size: 12px;
      padding: 6px;
      cursor: pointer;
      margin-top: 8px;
      transition: border-color 0.15s, color 0.15s;
    }
    .kanban-add-btn:hover { border-color: #c9a84c; color: #c9a84c; }
    .goal-card {
      background: #1a2744;
      border: 1px solid #2a4580;
      border-radius: 8px;
      padding: 10px;
      margin-bottom: 8px;
      cursor: grab;
      user-select: none;
      transition: opacity 0.15s, box-shadow 0.15s;
    }
    .goal-card:active { cursor: grabbing; }
    .goal-card.dragging { opacity: 0.4; }
    .goal-card-title { font-size: 13px; color: #e0e8f8; font-weight: 600; margin-bottom: 6px; line-height: 1.3; }
    .goal-card-meta { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 6px; }
    .goal-cat-pill {
      font-size: 10px;
      background: #0d1b3e;
      border: 1px solid #2a4580;
      border-radius: 10px;
      padding: 1px 7px;
      color: #8ab4f8;
    }
    .goal-year-badge { font-size: 10px; color: #4d6080; }
    .goal-progress-bar {
      height: 4px;
      background: #1e3a6e;
      border-radius: 2px;
      margin-bottom: 6px;
      overflow: hidden;
    }
    .goal-progress-fill { height: 100%; background: #c9a84c; border-radius: 2px; transition: width 0.3s; }
    .goal-card-actions { display: flex; gap: 6px; justify-content: flex-end; }

    /* ---- Interests tab ---- */
    .interests-toolbar { display: flex; gap: 8px; align-items: center; margin-bottom: 16px; flex-wrap: wrap; }
    .person-pill {
      font-size: 12px;
      padding: 4px 14px;
      border-radius: 20px;
      border: 1px solid #2a4580;
      background: transparent;
      color: #8ab4f8;
      cursor: pointer;
      transition: background 0.15s, border-color 0.15s;
    }
    .person-pill.active { background: #1e3a6e; border-color: #8ab4f8; color: #fff; }
    .person-pill:hover:not(.active) { border-color: #c9a84c; color: #c9a84c; }
    .interests-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
      gap: 12px;
    }
    .interest-card {
      background: #0d1b3e;
      border: 1px solid #1e3060;
      border-radius: 10px;
      padding: 14px 16px;
      display: flex;
      flex-direction: column;
      gap: 8px;
      transition: border-color 0.15s;
    }
    .interest-card:hover { border-color: #2a4580; }
    .interest-card-top { display: flex; align-items: flex-start; justify-content: space-between; gap: 8px; }
    .interest-text { font-size: 13px; color: #e0e8f8; font-weight: 500; line-height: 1.4; flex: 1; }
    .interest-card-meta { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }
    .interest-person-badge {
      font-size: 10px;
      padding: 2px 8px;
      border-radius: 10px;
      font-weight: 600;
      letter-spacing: 0.5px;
    }
    .interest-person-badge.ahmed   { background: #1e3a6e; color: #8ab4f8; }
    .interest-person-badge.victoria { background: #3a1e5e; color: #c9a8f8; }
    .interest-cat-pill {
      font-size: 10px;
      background: #152547;
      border: 1px solid #2a4580;
      border-radius: 10px;
      padding: 1px 7px;
      color: #c9a84c;
    }
    .interest-date { font-size: 10px; color: #4d6080; margin-left: auto; }
    .interest-notes { font-size: 11px; color: #6b7fa8; font-style: italic; }
    .btn-archive { background: none; border: none; cursor: pointer; font-size: 14px; opacity: 0.5; padding: 2px 4px; transition: opacity 0.15s; flex-shrink: 0; }
    .btn-archive:hover { opacity: 1; }

    /* ---- PTO tab ---- */
    .pto-grid-2 {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 16px;
      margin-bottom: 20px;
    }
    @media (max-width: 620px) { .pto-grid-2 { grid-template-columns: 1fr; } }
    .pto-card {
      background: #0d1b3e;
      border: 1px solid #1e3060;

<body>
<div id="root"></div>
<script type="text/babel">
const { useState, useEffect, useCallback, useRef } = React;

const VERA_CHAT_WELCOME = 'Hi Ahmed — ask me about your flags, tasks, or summaries, or tell me to take action on something. (Shift+Enter for a new line, Enter to send.)';

// ---- Helpers ----------------------------------------------------------------

function stored(key, fallback = '') {
  return localStorage.getItem(key) || fallback;
}

function urgencyClass(u) {
  return (u || '').toLowerCase();
}

function makeUrl(base, token, params = {}) {
  const url = new URL(base);
  url.searchParams.set('token', token);
  Object.entries(params).forEach(([k, v]) => { if (v) url.searchParams.set(k, v); });
  return url.toString();
}

async function apiGet(apiUrl, token, params) {
  const res = await fetch(makeUrl(apiUrl, token, params));
  const json = await res.json();
  if (!json.ok) throw new Error(json.error || 'API error');
  return json;
}

// All write operations use GET to avoid CORS preflight from file:// origin
async function apiAction(apiUrl, token, action, params) {
  return apiGet(apiUrl, token, Object.assign({ action }, params));
}

// POST without Content-Type header → browser sends text/plain → simple CORS request (no preflight).
// Apps Script doPost parses the body with JSON.parse(e.postData.contents) regardless of content-type.
async function apiPost(apiUrl, token, body) {
  const url = new URL(apiUrl);
  url.searchParams.set('token', token);
  const res = await fetch(url.toString(), { method: 'POST', body: JSON.stringify(body) });
  const json = await res.json();
  if (!json.ok) throw new Error(json.error || 'API error');
  return json;
}

// Resize an image File to maxDim on its longest side and re-encode as JPEG @ 85% quality.
// Keeps the upload comfortably under Claude's vision API size limits.
function resizeImage(file, maxDim = 1600) {
  return new Promise(resolve => {
    const img    = new Image();
    const blobUrl = URL.createObjectURL(file);
    img.onload = () => {
      const scale = Math.min(1, maxDim / Math.max(img.width, img.height));
      const w = Math.round(img.width  * scale);
      const h = Math.round(img.height * scale);
      const canvas = document.createElement('canvas');
      canvas.width = w; canvas.height = h;
      canvas.getContext('2d').drawImage(img, 0, 0, w, h);
      URL.revokeObjectURL(blobUrl);
      const dataUrl = canvas.toDataURL('image/jpeg', 0.85);
      resolve({ base64: dataUrl.split(',')[1], mimeType: 'image/jpeg', preview: dataUrl });
    };
    img.src = blobUrl;
  });
}

function fmtDate(d) {
  if (!d) return '';
  return d;
}

function timeAgo(dt) {
  if (!dt) return '';
  const diff = Math.round((Date.now() - dt.getTime()) / 1000);
  if (diff < 60) return 'just now';
  if (diff < 3600) return Math.floor(diff / 60) + 'm ago';
  return Math.floor(diff / 3600) + 'h ago';
}

// Returns true if any significant word in milestone.label appears in text
function matchesMilestone(milestone, text) {
  const stopwords = new Set(['and','the','for','with','our','your','next','this']);
  const keywords  = milestone.label.toLowerCase().split(/\W+/)
    .filter(w => w.length >= 4 && !stopwords.has(w));
  const lower = (text || '').toLowerCase();
  return keywords.length > 0 && keywords.some(kw => lower.includes(kw));
}

// ---- Settings modal ---------------------------------------------------------

function SettingsModal({ initial, onSave, onClose }) {
  const [url, setUrl]     = useState(initial.url);
  const [token, setToken] = useState(initial.token);

  function save() {
    const u = url.trim();
    const t = token.trim();
    if (!u || !t) return;
    localStorage.setItem('vera_url', u);
    localStorage.setItem('vera_token', t);
    onSave(u, t);
  }

  return (
    <div className="modal-overlay" onClick={e => e.target === e.currentTarget && onClose && onClose()}>
      <div className="modal">
        <h2>⚙️ Connect to VERA API</h2>
        <p>Enter your Apps Script Web App URL and the token from Script Properties.</p>

        <div className="form-group">
          <label className="form-label">Web App URL</label>
          <input
            className="form-input"
            placeholder="https://script.google.com/macros/s/.../exec"
            value={url}
            onChange={e => setUrl(e.target.value)}
          />
        </div>

        <div className="form-group">
          <label className="form-label">VERA_WEB_TOKEN</label>
          <input
            className="form-input"
            placeholder="vera-b479..."
            type="password"
            value={token}
            onChange={e => setToken(e.target.value)}
          />
          <div className="form-hint">Set in Apps Script → Project Settings → Script Properties</div>
        </div>

        <div className="modal-actions">
          {onClose && <button className="btn btn-ghost" onClick={onClose}>Cancel</button>}
          <button className="btn btn-primary" onClick={save} disabled={!url.trim() || !token.trim()}>
            Connect
          </button>
        </div>
      </div>
    </div>
  );
}

function StatusBar({ status, loading }) {

// ---- Flag card --------------------------------------------------------------

function FlagCard({ flag, onAction, busy }) {
  const uc = urgencyClass(flag.urgency);
  const isDone = flag.acknowledged || flag.resolved;

  return (
    <div className={`flag-card ${uc} ${isDone ? 'done' : ''}`}>
      <div className="flag-meta">
        <span className={`urgency-badge ${uc}`}>{flag.urgency}</span>
        <span className="source-badge">{flag.source}</span>
        {flag.snoozedUntil && (
          <span className="snoozed-label">💤 until {flag.snoozedUntil}</span>
        )}
        {flag.acknowledged && <span className="snoozed-label" style={{ background: '#1e3878', color: '#c9d9ff' }}>✓ ack</span>}
        {flag.resolved     && <span className="snoozed-label" style={{ background: '#0f3020', color: '#69f0ae' }}>✓ resolved</span>}
        <span className="flag-date">{fmtDate(flag.date)}</span>
      </div>

      <div className="flag-title">{flag.flag}</div>
      <div className="flag-reason">{flag.reason}</div>

      {!isDone && (
        <div className="flag-actions">
          <button
            className="btn btn-ack"
            disabled={busy}
            onClick={() => onAction('acknowledge', flag.id)}
          >
            ✓ Acknowledge
          </button>
          <button
            className="btn btn-snooze"
            disabled={busy}
            onClick={() => onAction('snooze', flag.id, 2)}
          >
            💤 Snooze 2d
          </button>
          <button
            className="btn btn-resolve"
            disabled={busy}
            onClick={() => onAction('resolve', flag.id)}
          >
            ✅ Resolve
          </button>
        </div>
      )}
    </div>
  );
}

// ---- Task form modal (add + edit) -------------------------------------------

function TaskFormModal({ task, onSave, onClose, busy }) {
  const isEdit = !!task;
  const [taskText, setTaskText] = useState(isEdit ? task.task    : '');
  const [dueDate,  setDueDate]  = useState(isEdit ? task.dueDate : '');
  const [notes,    setNotes]    = useState(isEdit ? task.notes   : '');

  function save() {
    if (!taskText.trim()) return;
    onSave({ id: task?.id, task: taskText.trim(), dueDate, notes });
  }

  function handleKey(e) {
    if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); save(); }
    if (e.key === 'Escape') onClose();
  }

  return (
    <div className="modal-overlay" onClick={e => e.target === e.currentTarget && onClose()}>
      <div className="modal">
        <h2>{isEdit ? '✏️ Edit Task' : '+ New Task'}</h2>
        <p>{isEdit ? 'Update the task details below.' : 'Add a new task to your list.'}</p>

        <div className="form-group">
          <label className="form-label">Task</label>
          <input
            className="form-input"
            value={taskText}
            onChange={e => setTaskText(e.target.value)}
            onKeyDown={handleKey}
            placeholder="What needs to be done?"
            autoFocus
          />
        </div>

        <div className="form-group">
          <label className="form-label">Due Date</label>
          <input
            className="form-input"
            type="date"
            value={dueDate}
            onChange={e => setDueDate(e.target.value)}
          />
        </div>

        <div className="form-group">
          <label className="form-label">Notes</label>
          <input
            className="form-input"
            value={notes}
            onChange={e => setNotes(e.target.value)}
            onKeyDown={handleKey}
            placeholder="Optional notes…"

        <div className="modal-actions">
          <button className="btn btn-ghost" onClick={onClose}>Cancel</button>
          <button
            className="btn btn-primary"
            onClick={save}

          >

        </div>
      </div>
    </div>
  );
}

// ---- Task card --------------------------------------------------------------

function TaskCard({ task, onComplete, onEdit, completing }) {

      {!completing && (

// ---- Chat panel -------------------------------------------------------------

function ChatPanel({ apiUrl, apiToken, messages, setMessages, input, setInput }) {
  const [loading,      setLoading]      = useState(false);
  const [pendingImage, setPendingImage] = useState(null); // {base64, mimeType, preview} | null
  const bottomRef = useRef(null);
  const fileRef   = useRef(null);

  useEffect(() => {
    if (bottomRef.current) bottomRef.current.scrollIntoView({ behavior: 'smooth' });
  }, [messages]);

  async function send() {
    const text     = input.trim();
    const imgSnap  = pendingImage;
    if ((!text && !imgSnap) || loading) return;

    // Clear input immediately for snappy feel
    setInput('');
    setPendingImage(null);

    // Append user bubble — include thumbnail preview if image attached
    setMessages(prev => [...prev, { role: 'user', text, image: imgSnap ? imgSnap.preview : null }]);
    setLoading(true);

    try {
      let data;
      if (imgSnap) {
        // Use POST for image payloads (base64 too large for URL params)
        data = await apiPost(apiUrl, apiToken, {
          action:       'chat',
          message:      text,
          session:      'dashboard',
          imageBase64:  imgSnap.base64,
          imageMimeType: imgSnap.mimeType,
        });
      } else {
        // Text-only: keep the existing GET path (no CORS concerns)
        data = await apiGet(apiUrl, apiToken, { action: 'chat', message: text });
      }
      setMessages(prev => [...prev, { role: 'vera', text: data.reply }]);
    } catch (e) {
      setMessages(prev => [...prev, { role: 'vera', text: '⚠ Error: ' + e.message }]);
    }
    setLoading(false);
  }

  function handleKey(e) {
    if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); send(); }
  }

  async function handleFileChange(e) {
    const file = e.target.files[0];
    if (!file) return;
    e.target.value = ''; // allow re-selecting the same file
    if (file.size > 10 * 1024 * 1024) {
      alert('Image too large (max 10 MB). Please choose a smaller image.');
      return;
    }
    const result = await resizeImage(file);
    setPendingImage(result);
  }

  return (
    <div className="chat-wrap">
      {/* Hidden file input — triggered programmatically by the 📎 button */}
      <input
        ref={fileRef}
        type="file"
        accept="image/*"
        style={{ display: 'none' }}
        onChange={handleFileChange}
      />

      <div className="chat-messages">
        {messages.map((m, i) => (
          <div key={i} className={`chat-msg ${m.role}`}>
            {m.image && <img src={m.image} className="chat-msg-img" alt="attachment" />}
            {m.text  && <span>{m.text}</span>}
          </div>
        ))}
        {loading && <div className="chat-msg vera vera-typing">VERA is thinking…</div>}
        <div ref={bottomRef} />
      </div>

      <div className="chat-input-area">
        {/* Image preview strip — shown when a file has been picked */}
        {pendingImage && (
          <div className="chat-img-preview">
            <img src={pendingImage.preview} alt="attachment" />
            <button className="chat-img-remove" onClick={() => setPendingImage(null)} title="Remove image">×</button>
          </div>
        )}

        <div className="chat-input-row">
          <button
            className="chat-attach"
            onClick={() => fileRef.current.click()}
            disabled={loading}
            title="Attach image"
          >📎</button>
          <textarea
            className="chat-input"
            rows={2}
            placeholder="Ask VERA anything…"
            value={input}
            onChange={e => setInput(e.target.value)}
            onKeyDown={handleKey}
            disabled={loading}
          />
          <button
            className="chat-send"
            onClick={send}
            disabled={(!input.trim() && !pendingImage) || loading}
          >
            ↑
          </button>
        </div>
      </div>
    </div>
  );
}

function PTOTab({ stats, onTriggerBuffer, busy }) {
  if (!stats) {
    return (
      <div className="empty-state">
        <div style={{ fontSize: 36, marginBottom: 12 }}>🌴</div>
        <div>No PTO data loaded yet.</div>
        <div style={{ fontSize: 13, color: '#6b7fa8', marginTop: 8 }}>
          Make sure <code style={{ background: '#13244d', padding: '1px 6px', borderRadius: 4 }}>pto_*</code> rows are seeded in the Config tab, then refresh.
        </div>
      </div>
    );
  }

  const { used, planned, remaining, config: cfg, burnDown: bd, threeToOneStatus: tto,
          bufferStatus, nextPTO, events, holidays, clearWindows, milestones, upcomingTravel, year } = stats;

  const vacTotal     = (cfg.vacationDays  || 20) + (cfg.rolloverDays || 0);
  const persTotal    = cfg.personalHours  || 48;
  const persUsed     = used.personalHours    || 0;
  const persPlanned  = planned.personalHours || 0;
  const persRemain   = remaining.personalHours ?? (persTotal - persUsed - persPlanned);

  function hrsLabel(hrs) {
    if (!hrs) return '0 hrs';
    const d = hrs / 8;
    const days = Number.isInteger(d) ? d + ' day' + (d !== 1 ? 's' : '') : d.toFixed(1) + ' days';
    return hrs + ' hrs (' + days + ')';
  }

  const paceColor = (bd?.paceStatus === 'ahead') ? '#43a047'
                  : (bd?.paceStatus === 'behind') ? '#e53935' : '#f9a825';

  function pctBar(val, max, color) {
    const pct = max > 0 ? Math.min(100, (val / max) * 100) : 0;
    return (
      <div className="pto-bar-track">
        <div className="pto-bar-fill" style={{ width: pct + '%', background: color }} />
      </div>
    );
  }

  function DotRow({ label, target, usedN, plannedN, hint }) {
    const dots = Array.from({ length: target }).map((_, i) => {
      let bg = 'transparent', border;
      if (i < usedN)               { bg = '#c9a84c'; border = '#c9a84c'; }
      else if (i < usedN + plannedN) { bg = '#3d5fa0'; border = '#3d5fa0'; }
      else                          { border = '#2a3a5e'; }
      return (
        <span key={i} className="pto-dot"
          style={{ background: bg, border: '2px solid ' + border }}
          title={
            i < usedN
              ? '🟡 Used — this block has already been taken'
              : i < usedN + plannedN
              ? '🔵 Planned — on the calendar but not yet taken'
              : '⬜ To schedule — book this to hit your target'
          }
        />
      );
    });
    const done  = usedN + plannedN;
    const left  = target - done;
    return (
      <div className="pto-row">
        <span style={{ flex: 1, fontSize: 13, color: '#dde1f0', cursor: hint ? 'help' : 'default' }}
              title={hint || undefined}>
          {label}{hint ? ' ℹ️' : ''}
        </span>
        <span>{dots}</span>
        <span style={{ fontSize: 11, color: '#6b7fa8', minWidth: 110, textAlign: 'right' }}>
          {done}/{target}
          {usedN > 0 ? ' (' + usedN + ' used' : ''}
          {plannedN > 0 ? (usedN > 0 ? ', ' : ' (') + plannedN + ' planned' : ''}
          {(usedN > 0 || plannedN > 0) ? ')' : ''}
          {left > 0 ? ' · ' + left + ' to go' : ''}
        </span>
      </div>
    );
  }

  const plannedEvents  = (events || []).filter(ev => ev.status === 'Planned');
  const usedEvents     = (events || []).filter(ev => ev.status === 'Used');
  const allPTOEvents   = [...plannedEvents, ...usedEvents];
  const upcomingHols   = (holidays || []).filter(h => {
    const d = h.date ? new Date(h.date + 'T00:00:00') : null;
    return d && d >= new Date();
  });

  return (
    <div>
      {/* Section 1: Balance Cards */}
      <div className="pto-grid-2">
        {/* Vacation */}
        <div className="pto-card">
          <div className="pto-section-title">🏖️ Vacation</div>
          <div className="pto-balance-num" style={{ color: '#c9a84c' }}>
            {remaining.vacationDays}
            <span style={{ fontSize: 14, fontWeight: 400, color: '#6b7fa8', marginLeft: 6 }}>days left</span>
          </div>
          <div className="pto-balance-sub">
            {used.vacationDays} used · {planned.vacationDays} planned
            {cfg.rolloverDays > 0
              ? <> · <span style={{color:'#c9a84c'}}>{cfg.vacationDays}d annual + {cfg.rolloverDays}d rollover = {vacTotal}d total</span></>
              : <> · {vacTotal} total allotted</>
            }
          </div>
          {pctBar(used.vacationDays + planned.vacationDays, vacTotal, '#c9a84c')}
        </div>

        {/* Personal Time */}
        <div className="pto-card">
          <div className="pto-section-title">☀️ Personal Time</div>
          <div className="pto-balance-num" style={{ color: '#5c9eff' }}>
            {persRemain}
            <span style={{ fontSize: 14, fontWeight: 400, color: '#6b7fa8', marginLeft: 6 }}>hrs left</span>
          </div>
          <div className="pto-balance-sub">
            {hrsLabel(persUsed)} used · {persTotal} hrs total ({Math.floor(persTotal / 8)} days)
          </div>
          {pctBar(persUsed + persPlanned, persTotal, '#5c9eff')}
        </div>
      </div>

      {/* Section 2: Burn-Down Pace */}
      <div className="pto-section">
        <div className="pto-section-title">📉 Burn-Down Pace ({year})</div>
        {[
          { label: 'Ideal used by today', val: (bd?.idealUsedToDate || 0).toFixed(1) + 'd', pct: cfg.vacationDays ? Math.min(100, ((bd?.idealUsedToDate || 0) / cfg.vacationDays) * 100) : 0, color: '#6b7fa8', badge: null },
          { label: 'Actually used',       val: (bd?.actualUsedToDate || 0).toFixed(1) + 'd', pct: cfg.vacationDays ? Math.min(100, ((bd?.actualUsedToDate || 0) / cfg.vacationDays) * 100) : 0, color: paceColor,
            badge: bd?.paceGap > 0 ? '✅ +' + Math.abs(bd.paceGap).toFixed(1) + 'd ahead'
                 : bd?.paceGap < 0 ? '⚠ ' + Math.abs(bd.paceGap).toFixed(1) + 'd behind'
                 : '✓ on track' },
          { label: 'Projected year-end', val: (bd?.projectedYearEnd || 0).toFixed(1) + 'd', pct: cfg.vacationDays ? Math.min(100, ((bd?.projectedYearEnd || 0) / cfg.vacationDays) * 100) : 0,
            color: (bd?.projectedUnused || 0) > 1 ? '#f9a825' : '#43a047',
            badge: (bd?.projectedUnused || 0) > 0 ? '(' + (bd.projectedUnused).toFixed(1) + ' unused — risk)' : null },
        ].map((row, i) => (
          <div key={i} style={{ marginBottom: i < 2 ? 14 : 0 }}>
            <div style={{ display: 'flex', justifyContent: 'space-between', fontSize: 12, marginBottom: 5 }}>
              <span style={{ color: '#8a9abf' }}>{row.label}</span>
              <span style={{ color: row.color, fontWeight: 700 }}>
                {row.val}
                {row.badge && <span style={{ color: '#8a9abf', fontWeight: 400, marginLeft: 6 }}>{row.badge}</span>}
              </span>
            </div>
            <div className="pto-bar-track">
              <div className="pto-bar-fill" style={{ width: row.pct + '%', background: row.color }} />
            </div>
          </div>
        ))}
        {nextPTO && (
          <div style={{ marginTop: 14, fontSize: 12, color: '#6b7fa8' }}>
            Next PTO: <span style={{ color: '#c9a84c', fontWeight: 600 }}>{nextPTO.label}</span>
            {' · '}{nextPTO.startDate}{' · '}{nextPTO.daysUntil} days away
          </div>
        )}
      </div>

      {/* Section 3: 3-2-1 Strategy */}
      <div className="pto-section">
        <div className="pto-section-title"
             style={{ cursor: 'help' }}
             title="A balanced PTO strategy: 3 short breaks + 2 full weeks + 1 long trip per year. Gold dots = used, blue = planned, empty = still to schedule.">
          🎯 3-2-1 PTO Strategy
        </div>
        <DotRow
          label="3 Long Weekends"
          hint="1–3 workdays off. Take a Friday or Monday to turn a weekend into a 3–4 day break without burning many days."
          target={tto?.longWeekends?.target || 3} usedN={tto?.longWeekends?.used || 0} plannedN={tto?.longWeekends?.planned || 0} />
        <DotRow
          label="2 Mid-Size Weeks"
          hint="4–7 workdays off. A full week away — enough time to truly decompress and recharge."
          target={tto?.midSizeWeeks?.target  || 2} usedN={tto?.midSizeWeeks?.used  || 0} plannedN={tto?.midSizeWeeks?.planned  || 0} />
        <DotRow
          label="1 Big Pivot"
          hint="8+ workdays off. One extended trip or reset each year. Book early — these windows are hard to find later in the year."
          target={tto?.bigPivot?.target      || 1} usedN={tto?.bigPivot?.used      || 0} plannedN={tto?.bigPivot?.planned      || 0} />
      </div>

      {/* Section 4: Buffer Status */}
      <div className="pto-section">
        <div className="pto-section-title"
             style={{ cursor: 'help' }}
             title="Buffer days are flexible personal days held in reserve for last-minute needs — an unexpected sick day, a mental health break, or a spontaneous long weekend. Click 'Trigger a Buffer Day' to log one.">
          🛡️ Buffer Days
        </div>
        <div style={{ display: 'flex', alignItems: 'center', gap: 16, flexWrap: 'wrap' }}>
          <div>
            {Array.from({ length: bufferStatus?.total || 3 }).map((_, i) => (
              <span key={i} className="pto-dot"
                style={{ background: i < (bufferStatus?.remaining || 0) ? '#c9a84c' : '#1e3060',
                         border: '2px solid ' + (i < (bufferStatus?.remaining || 0) ? '#c9a84c' : '#2a3a5e'),
                         marginRight: 8 }}
                title={
                  i < (bufferStatus?.remaining || 0)
                    ? '🟡 Buffer day available — use for an unexpected personal need or a spontaneous day off'
                    : '⬫ Buffer day used'
                }
              />
            ))}
            <span style={{ fontSize: 13, color: '#8a9abf', verticalAlign: 'middle' }}>
              {bufferStatus?.remaining ?? '?'}/{bufferStatus?.total ?? 3} available
            </span>
          </div>
          {(bufferStatus?.remaining || 0) > 0 && (
            <button
              className="btn btn-ghost"
              style={{ fontSize: 12, marginLeft: 'auto' }}

      {/* Section 5: VERA Suggestions */}
      {(clearWindows || []).length > 0 && (
        <div className="pto-section">

          {(clearWindows || []).map((w, i) => (
            <div key={i} className="pto-row">
              <span style={{ fontWeight: 700, color: '#c9a84c', fontSize: 14, minWidth: 150 }}>
                {w.startDate} – {w.endDate}

              <span className="pto-pill" style={{ background: '#13244d', color: '#8a9abf' }}>
                {w.workdays} workdays
              </span>
              <span style={{ fontSize: 12, color: '#43a047', marginLeft: 'auto' }}>← added to Vera calendar</span>
            </div>
          ))}
        </div>
      )}

      {/* Section 6: Upcoming PTO Events */}
      {allPTOEvents.length > 0 && (
        <div className="pto-section">
          <div className="pto-section-title">📅 PTO Events ({year})</div>
          {allPTOEvents.map((ev, i) => (
            <div key={i} className="pto-row">
              <span className="pto-pill"
                style={{ background: ev.status === 'Used' ? '#0f3020' : '#1e3060',
                         color: ev.status === 'Used' ? '#69f0ae' : '#c9d9ff', minWidth: 60, textAlign: 'center' }}>
                {ev.status === 'Used' ? '✓ Done' : 'Planned'}
              </span>
              <span style={{ flex: 1, fontWeight: 600, color: '#dde1f0', fontSize: 13 }}>{ev.label}</span>
              <span style={{ fontSize: 11, color: '#6b7fa8' }}>{ev.startDate}{ev.endDate && ev.endDate !== ev.startDate ? ' – ' + ev.endDate : ''}</span>
              <span style={{ fontSize: 12, color: '#c9a84c', fontWeight: 700 }}>
                {ev.type === 'Vacation' ? (ev.weekdays || '?') + 'd' : (ev.hours || '?') + 'h'}
              </span>
              <span className="pto-pill"
                style={{ background: ev.type === 'Vacation' ? '#1e3060' : '#3d2e10',
                         color: ev.type === 'Vacation' ? '#8ab0d8' : '#ffd54f' }}>
                {ev.type === 'Vacation' ? 'Vacation' : 'Personal'}
              </span>
            </div>
          ))}
        </div>
      )}

      {/* Section 7: Shared Chaos Travel */}
      {(upcomingTravel || []).length > 0 && (
        <div className="pto-section">
          <div className="pto-section-title">✈️ Upcoming Travel (Shared Chaos)</div>
          {(upcomingTravel || []).map((t, i) => (
            <div key={i} className="pto-row">
              <span style={{ flex: 1, fontWeight: 600, color: '#dde1f0', fontSize: 13 }}>{t.label}</span>
              <span style={{ fontSize: 11, color: '#6b7fa8' }}>{t.startDate} – {t.endDate}</span>
              <span style={{ fontSize: 12, color: '#5c9eff' }}>{t.daysAway} days away</span>
            </div>
          ))}
        </div>
      )}

      {/* Section 8: Milestone Countdowns */}
      {(milestones || []).length > 0 && (
        <div className="pto-section">
          <div className="pto-section-title">📍 Upcoming Milestones</div>
          {(milestones || []).map((m, i) => (
            <div key={i} className="pto-row">
              <span style={{ flex: 1, fontWeight: 600, color: '#dde1f0', fontSize: 13 }}>{m.label}</span>
              <span style={{ fontSize: 11, color: '#6b7fa8' }}>{m.calendarName}</span>
              <span style={{ fontSize: 13, color: '#c9a84c', fontWeight: 700 }}>{m.daysUntil} days</span>
            </div>
          ))}
        </div>
      )}

      {/* Section 9: Company Holidays */}
      {upcomingHols.length > 0 && (
        <div className="pto-section">
          <div className="pto-section-title">🏢 Remaining Company Holidays ({year})</div>
          <div style={{ display: 'flex', flexWrap: 'wrap', gap: 8 }}>
            {upcomingHols.map((h, i) => (
              <span key={i} style={{ background: '#13244d', border: '1px solid #1e3060', borderRadius: 6, padding: '4px 10px', fontSize: 12 }}>
                <span style={{ color: '#6b7fa8', marginRight: 6 }}>{h.date}</span>
                <span style={{ color: '#dde1f0' }}>{h.label}</span>
              </span>
            ))}
          </div>
        </div>
      )}
    </div>
  );
}

function FinancesTab({ summaries, budget, budgetLoading }) {
  const hasTxData = summaries.some(s => s.source === '[AUTO] Transactions');

  // Format a cell value as currency (numbers → $X,XXX) or dash (null/empty)
  function fmtMoney(v) {
    if (v === null || v === undefined || v === '') return '—';
    if (typeof v === 'number') return '$' + Math.round(v).toLocaleString();
    return String(v);
  }

  const budgetRows    = (budget && budget.rows)    || [];
  const budgetReady   = budget !== null;
  const budgetMissing = budget && !budget.configured;

  return (
    <div>
      {/* ── Spending Chart ─────────────────────────────── */}
      {hasTxData
        ? <SpendingChart summaries={summaries} budget={budget} />
        : (
          <div className="bento-card" style={{ cursor: 'default', textAlign: 'center' }}>
            <div style={{ fontSize: 13, color: '#4d6080', padding: '12px 0' }}>
              💸 No transaction data yet — connect your Transactions sheet in Config.
            </div>
          </div>
        )
      }

      {/* ── Monthly Budget (Simple Ass Tracker) ─────────── */}
      <div className="bento-card" style={{ marginTop: 16, cursor: 'default' }}>
        <div className="bento-card-title" style={{ marginBottom: 14 }}>📊 Monthly Budget</div>

        {budgetLoading && (
          <div style={{ fontSize: 13, color: '#6b7fa8', padding: '8px 0' }}>Loading budget…</div>
        )}

        {!budgetLoading && budgetMissing && (
          <div style={{ fontSize: 13, color: '#4d6080' }}>
            SAT_SHEET_ID not configured — set it in Apps Script → Script Properties.
          </div>
        )}

        {!budgetLoading && budgetReady && !budgetMissing && budgetRows.length === 0 && (
          <div style={{ fontSize: 13, color: '#4d6080' }}>No rows found in the Budget tab.</div>
        )}

        {!budgetLoading && budgetRows.length > 0 && (
          <table style={{ width: '100%', borderCollapse: 'collapse', fontSize: 13 }}>
            <tbody>
              {budgetRows.map((r, i) => {
                const isHeader = r.value === null;
                const hasSplit = r.ahmed !== null || r.victoria !== null;
                return isHeader
                  ? (
                    <tr key={i}>
                      <td colSpan={hasSplit ? 4 : 2} style={{
                        paddingTop: i === 0 ? 0 : 14,
                        paddingBottom: 4,
                        fontWeight: 700,
                        fontSize: 11,
                        textTransform: 'uppercase',
                        letterSpacing: '0.06em',
                        color: '#c9a84c',
                        borderBottom: '1px solid #1e3060',
                      }}>{r.label}</td>
                    </tr>
                  )
                  : (
                    <tr key={i} style={{ borderBottom: '1px solid #0d1b3e' }}>
                      <td style={{ padding: '7px 0', color: '#dde1f0', width: '55%' }}>{r.label}</td>
                      <td style={{ padding: '7px 0', textAlign: 'right', fontWeight: 600, color: '#c9a84c' }}>
                        {fmtMoney(r.value)}
                      </td>
                      {hasSplit && (
                        <React.Fragment>
                          <td style={{ padding: '7px 0 7px 16px', textAlign: 'right', color: '#5c9eff', fontSize: 12 }}>
                            {fmtMoney(r.ahmed)}
                          </td>
                          <td style={{ padding: '7px 0 7px 8px', textAlign: 'right', color: '#c97ef2', fontSize: 12 }}>
                            {fmtMoney(r.victoria)}
                          </td>
                        </React.Fragment>
                      )}
                    </tr>
                  );
              })}
            </tbody>
          </table>
        )}

        {!budgetReady && !budgetLoading && (
          <div style={{ fontSize: 12, color: '#4d6080' }}>
            Click the Finances tab to load budget data.
          </div>
        )}
      </div>
    </div>
  );
}

function MilestonesTab({ milestones, flags, tasks, onAction, busy }) {
  if (!milestones || milestones.length === 0) {
    return (
      <div className="empty-state">
        <div style={{ fontSize: 32, marginBottom: 12 }}>🎯</div>
        <div style={{ color: '#dde1f0', marginBottom: 8 }}>No upcoming milestones</div>
        <div style={{ fontSize: 12, color: '#4d6080', maxWidth: 380, margin: '0 auto', lineHeight: 1.6 }}>
          Add all-day events to calendars listed in Config → <code style={{ background: '#13244d', padding: '1px 5px', borderRadius: 3 }}>gap_calendars</code> whose
          titles contain keywords from <code style={{ background: '#13244d', padding: '1px 5px', borderRadius: 3 }}>milestone_keywords</code> (e.g. Trip, Vacation, Wedding).
        </div>
      </div>
    );
  }

  const activeFlags = flags.filter(f => !f.resolved && !f.acknowledged);

  return (
    <div>
      {milestones.map((m, i) => {
        const relFlags = activeFlags.filter(f =>
          matchesMilestone(m, f.flag + ' ' + f.reason)
        );
        const relTasks = tasks.filter(t =>
          matchesMilestone(m, t.task + ' ' + t.notes)
        );
        const isSoon  = m.daysUntil <= 30;
        const hasHigh = relFlags.some(f => f.urgency === 'High');

        return (
          <div key={i} className={`milestone-card${hasHigh ? ' urgent' : ''}`}>
            <div className="milestone-header">
              <span className="milestone-name">{m.label}</span>
              <span className={`milestone-countdown${isSoon ? ' soon' : ''}`}>
                {m.daysUntil === 0 ? 'Today'
                  : m.daysUntil === 1 ? 'Tomorrow'
                  : `in ${m.daysUntil} days`}
              </span>
            </div>

            <div className="milestone-section-label">🚩 Related Flags ({relFlags.length})</div>
            {relFlags.length === 0
              ? <div className="milestone-empty">No active flags tied to this milestone</div>
              : relFlags.map(flag => (
                  <FlagCard key={flag.id} flag={flag} onAction={onAction} busy={busy} />
                ))
            }

            <div className="milestone-section-label">✅ Related Tasks ({relTasks.length})</div>
            {relTasks.length === 0
              ? <div className="milestone-empty">No open tasks tied to this milestone</div>
              : relTasks.map((task, ti) => (
                  <TaskCard key={task.id || ti} task={task}
                    onComplete={() => {}} onEdit={() => {}} completing={false} />
                ))
            }

            <div style={{ fontSize: 11, color: '#3d5280', marginTop: 14, paddingTop: 12, borderTop: '1px solid #13244d' }}>
              📅 {m.date} · {m.calendarName}
            </div>
          </div>
        );
      })}
    </div>
  );
}

// ---- Spending chart (Home tab) ----------------------------------------------

function SpendingChart({ summaries, budget }) {
  const txRows   = summaries.filter(s => s.source === '[AUTO] Transactions');
  const totalRow = txRows.find(s => s.metric.startsWith('Total Spending'));
  const otherRow = txRows.find(s => s.metric.startsWith('Other ('));
  const catRows  = txRows.filter(s =>
    !s.metric.startsWith('Total Spending') && !s.metric.startsWith('Other (')
  );

  // Parse "$1,234 [full month] vs $2,345 in Jan (±N%)" or "$1,234 (first month)"
  function parseDollars(value = '') {
    const dollars  = [...value.matchAll(/\$([0-9,]+)/g)].map(m => parseInt(m[1].replace(/,/g, '')));
    const hasPrev  = /\bvs\s+\$/.test(value);
    const curr     = dollars[0] || 0;
    const prev     = hasPrev ? (dollars[1] || 0) : 0;
    const prevMon  = (value.match(/\bin\s+([A-Z][a-z]{2})\b/) || [])[1] || null;
    return { curr, prev, prevMon };
  }

  const totalData  = totalRow ? parseDollars(totalRow.value) : null;
  const mthMatch   = (catRows[0] || totalRow)?.metric.match(/—\s+(\w+)$/);
  const currMonth  = mthMatch ? mthMatch[1] : '';
  const prevMonth  = totalData?.prevMon ||
    catRows.map(r => parseDollars(r.value).prevMon).find(Boolean) || '';

  const data = catRows.map(s => ({
    label: s.metric.replace(/\s+—\s+\w+$/, ''),
    ...parseDollars(s.value),
  }));

  const maxVal = Math.max(...data.map(d => Math.max(d.curr, d.prev)), 1);
  const otherMatch = otherRow?.metric.match(/Other \((\d+)/);
  const otherCount = otherMatch ? otherMatch[1] : null;
  const otherAmt   = otherRow ? parseDollars(otherRow.value).curr : 0;

  // Build budget lookup: normalised label → numeric monthly budget amount
  const budgetMap = {};
  if (budget && budget.rows) {
    budget.rows.forEach(function(r) {
      if (r.value === null) return; // skip section headers
      var key = String(r.label).toLowerCase().trim();
      var num = typeof r.value === 'number'
        ? r.value
        : parseFloat(String(r.value).replace(/[$,]/g, '')) || null;
      if (num !== null) budgetMap[key] = num;
    });
  }

  return (
    <div className="bento-card" style={{ gridColumn: '1 / -1', cursor: 'default' }}>
      {/* Header */}
      <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'baseline', marginBottom: 16 }}>
        <div className="bento-card-title" style={{ marginBottom: 0 }}>
          💸 Spending — {currMonth || '…'}
        </div>
        {totalData && totalData.curr > 0 && (
          <div style={{ textAlign: 'right' }}>
            <span style={{ fontSize: 18, fontWeight: 800, color: '#c9a84c' }}>
              ${totalData.curr.toLocaleString()}
            </span>
            {prevMonth && totalData.prev > 0 && (
              <span style={{ fontSize: 11, color: '#6b7fa8', marginLeft: 8 }}>
                vs ${totalData.prev.toLocaleString()} in {prevMonth}
              </span>
            )}
          </div>
        )}
      </div>

      {data.length === 0 ? (
        <div style={{ fontSize: 13, color: '#4d6080' }}>No transaction data yet</div>
      ) : (
        <>
          {/* Category bars */}
          <div style={{ display: 'flex', flexDirection: 'column', gap: 10 }}>
            {data.map((d, i) => {
              const currW    = (d.curr / maxVal * 100).toFixed(1);
              const prevW    = (d.prev / maxVal * 100).toFixed(1);
              const delta    = d.prev > 0 ? Math.round(((d.curr - d.prev) / d.prev) * 100) : null;
              const deltaClr = delta == null ? '#6b7fa8'
                : delta > 20  ? '#ef5350'
                : delta < -10 ? '#66bb6a'
                : '#6b7fa8';
              const budgeted = budgetMap[d.label.toLowerCase().trim()] ?? null;
              const variance = budgeted !== null ? Math.round(d.curr - budgeted) : null;
              return (
                <div key={i}>
                  <div style={{ display: 'flex', justifyContent: 'space-between', marginBottom: 4, alignItems: 'baseline' }}>
                    <span style={{ fontSize: 13, color: '#dde1f0', overflow: 'hidden', textOverflow: 'ellipsis', whiteSpace: 'nowrap', maxWidth: '55%' }}>
                      {d.label}
                    </span>
                    <div style={{ display: 'flex', gap: 8, alignItems: 'baseline', flexShrink: 0 }}>
                      {d.prev > 0 && <span style={{ fontSize: 11, color: '#4d6080' }}>${d.prev.toLocaleString()}</span>}
                      <span style={{ fontSize: 13, fontWeight: 700, color: '#c9a84c' }}>${d.curr.toLocaleString()}</span>
                      {delta != null && (
                        <span style={{ fontSize: 11, color: deltaClr, minWidth: 36, textAlign: 'right' }}>
                          {delta >= 0 ? '+' : ''}{delta}%
                        </span>
                      )}
                    </div>
                  </div>
                  {/* Current month bar — gold */}
                  <div style={{ height: 7, background: '#13244d', borderRadius: 4, overflow: 'hidden', marginBottom: 2 }}>
                    <div style={{ height: '100%', width: currW + '%', background: '#c9a84c', borderRadius: 4, transition: 'width 0.5s ease' }} />
                  </div>
                  {/* Prior month bar — steel blue */}
                  {d.prev > 0 && (
                    <div style={{ height: 4, background: '#0d1b3e', borderRadius: 2, overflow: 'hidden' }}>
                      <div style={{ height: '100%', width: prevW + '%', background: '#3d5fa0', borderRadius: 2, transition: 'width 0.5s ease' }} />
                    </div>
                  )}
                  {/* Budget vs. actual annotation — only when a matching budget row is found */}
                  {budgeted !== null && (
                    <div style={{ display: 'flex', gap: 10, marginTop: 4, fontSize: 11 }}>
                      <span style={{ color: '#4d6080' }}>Budget: ${Math.round(budgeted).toLocaleString()}</span>
                      {variance !== null && (
                        <span style={{ color: variance > 0 ? '#ef5350' : '#66bb6a', fontWeight: 600 }}>
                          {variance > 0 ? '▲' : '▼'} ${Math.abs(variance).toLocaleString()} {variance > 0 ? 'over' : 'under'}
                        </span>
                      )}
                    </div>
                  )}
                </div>
              );
            })}
          </div>

          {/* Legend + Other footnote */}
          <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center', marginTop: 14, paddingTop: 12, borderTop: '1px solid #1e3060', flexWrap: 'wrap', gap: 8 }}>
            <div style={{ display: 'flex', gap: 16 }}>
              <div style={{ display: 'flex', alignItems: 'center', gap: 5 }}>
                <div style={{ width: 12, height: 7, background: '#c9a84c', borderRadius: 2 }} />
                <span style={{ fontSize: 11, color: '#6b7fa8' }}>{currMonth}</span>
              </div>
              {prevMonth && (
                <div style={{ display: 'flex', alignItems: 'center', gap: 5 }}>
                  <div style={{ width: 12, height: 4, background: '#3d5fa0', borderRadius: 2 }} />
                  <span style={{ fontSize: 11, color: '#6b7fa8' }}>{prevMonth}</span>
                </div>
              )}
            </div>
            {otherCount && otherAmt > 0 && (
              <span style={{ fontSize: 11, color: '#4d6080' }}>
                + {otherCount} other categories: ${otherAmt.toLocaleString()}
              </span>
            )}
          </div>
        </>
      )}
    </div>
  );
}
