function NeighborhoodWatchView({ apiUrl, apiToken }) {
  const [panel,        setPanel]        = React.useState('flyers');
  const [flyers,       setFlyers]       = React.useState(null);
  const [flyerLoading, setFlyerLoading] = React.useState(false);
  const [extracting,   setExtracting]   = React.useState(false);
  const [editDraft,    setEditDraft]    = React.useState(null);
  const [previewUrl,   setPreviewUrl]   = React.useState(null);
  const [hoaUrl,       setHoaUrl]       = React.useState('');
  const [hoaUrlInput,  setHoaUrlInput]  = React.useState('');
  const [hoaScans,     setHoaScans]     = React.useState(null);
  const [scanning,     setScanning]     = React.useState(false);
  const [busy,         setBusy]         = React.useState(false);
  const [toast,        setToast]        = React.useState(null);
  const fileRef = React.useRef(null);

  function showToast(msg) { setToast(msg); setTimeout(function() { setToast(null); }, 3000); }

  function loadFlyers() {
    setFlyerLoading(true);
    apiGet(apiUrl, apiToken, { action: 'get_flyers' })
      .then(function(d) { setFlyers(d.flyers || []); })
      .catch(function() { setFlyers([]); })
      .finally(function() { setFlyerLoading(false); });
  }
  function loadHoaConfig() {
    apiGet(apiUrl, apiToken, { action: 'get_hoa_config' })
      .then(function(d) { setHoaUrl(d.url || ''); setHoaUrlInput(d.url || ''); })
      .catch(function() {});
  }
  function loadHoaScans() {
    apiGet(apiUrl, apiToken, { action: 'get_hoa_scans' })
      .then(function(d) { setHoaScans(d.scans || []); })
      .catch(function() { setHoaScans([]); });
  }

  React.useEffect(function() {
    if (!apiUrl || !apiToken) return;
    loadFlyers();
    loadHoaConfig();
    loadHoaScans();
  }, [apiUrl, apiToken]);

  function handleFileChange(e) {
    var file = e.target.files && e.target.files[0];
    if (!file) return;
    e.target.value = '';
    setExtracting(true);
    resizeImage(file, 1600).then(function(res) {
      setPreviewUrl(res.preview);
      var body = { action: 'extract_flyer', imageBase64: res.base64, imageMimeType: res.mimeType };
      return apiPost(apiUrl, apiToken, body);
    }).then(function(result) {
      var f = result.flyer || {};
      setEditDraft({
        title:       f.title       || '',
        type:        f.type        || 'Event',
        date:        f.date        || '',
        time:        f.time        || '',
        location:    f.location    || '',
        description: f.description || '',
        recurring:   f.recurring === true || f.recurring === 'true',
        tags:        Array.isArray(f.tags) ? f.tags.join(', ') : (f.tags || ''),
        notes:       '',
      });
      setExtracting(false);
    }).catch(function(err) {
      showToast('Could not extract flyer: ' + err.message);
      setExtracting(false);
    });
  }

  function handleSaveFlyer() {
    if (!editDraft) return;
    setBusy(true);
    var body = Object.assign({ action: 'save_flyer' }, editDraft);
    apiPost(apiUrl, apiToken, body).then(function() {
      setEditDraft(null);
      setPreviewUrl(null);
      loadFlyers();
      showToast('Flyer saved ✓');
    }).catch(function(err) {
      showToast('Save failed: ' + err.message);
    }).finally(function() { setBusy(false); });
  }

  function handleDeleteFlyer(row) {
    if (!window.confirm('Delete this flyer?')) return;
    apiGet(apiUrl, apiToken, { action: 'delete_flyer', row: String(row) });
    setFlyers(function(prev) { return prev.filter(function(f) { return f._row !== row; }); });
  }

  function handleRsvp(row, status) {
    apiGet(apiUrl, apiToken, { action: 'update_flyer_status', row: String(row), status: status });
    setFlyers(function(prev) { return prev.map(function(f) { return f._row === row ? Object.assign({}, f, { Status: status }) : f; }); });
  }

  function handleAddToCalendar(flyer) {
    setBusy(true);
    apiGet(apiUrl, apiToken, {
      action: 'flyer_to_calendar',
      title: flyer.Title, date: flyer.Date, time: flyer.Time,
      location: flyer.Location, description: flyer.Description,
    }).then(function() {
      showToast('Added to Calendar ✓');
    }).catch(function(err) {
      showToast('Calendar error: ' + err.message);
    }).finally(function() { setBusy(false); });
  }

  function handleSaveHoaUrl() {
    apiGet(apiUrl, apiToken, { action: 'set_hoa_config', url: hoaUrlInput })
      .then(function() { setHoaUrl(hoaUrlInput); showToast('HOA URL saved ✓'); })
      .catch(function() {});
  }

  function handleScanNow() {
    setScanning(true);
    apiGet(apiUrl, apiToken, { action: 'run_hoa_scan' }).then(function(d) {
      showToast('Scan complete · ' + (d.itemsFound || 0) + ' items · ' + (d.flagsWritten || 0) + ' flags');
      loadHoaScans();
    }).catch(function(err) {
      showToast('Scan error: ' + err.message);
    }).finally(function() { setScanning(false); });
  }

  var today = new Date(); today.setHours(0, 0, 0, 0);
  var upcoming = (flyers || []).filter(function(f) {
    if (String(f.Recurring) === 'true') return true;
    if (!f.Date) return false;
    return new Date(f.Date + 'T00:00:00') >= today;
  });
  var past = (flyers || []).filter(function(f) {
    if (String(f.Recurring) === 'true') return false;
    if (!f.Date) return true;
    return new Date(f.Date + 'T00:00:00') < today;
  });

  var rsvpColors = { Going: '#43a047', Interested: '#c9a84c', 'Not Going': '#6b7fa8', Done: '#555' };

  function FlyerCard(props) {
    var f = props.f;
    var dateStr = f.Date ? new Date(f.Date + 'T00:00:00').toLocaleDateString('en-US', { month:'short', day:'numeric', year:'numeric' }) : null;
    return (
      React.createElement('div', { style: { background:'#0d1b3e', border:'1px solid #1e3060', borderRadius:10, padding:'14px 16px', marginBottom:10 } },
        React.createElement('div', { style: { display:'flex', justifyContent:'space-between', alignItems:'flex-start' } },
          React.createElement('div', null,
            React.createElement('span', { style: { fontWeight:700, fontSize:15, color:'#e8eaf6' } }, f.Title || '(no title)'),
            f.Status && React.createElement('span', { style: { marginLeft:8, fontSize:11, background: rsvpColors[f.Status] || '#1e3060', color:'#fff', borderRadius:12, padding:'2px 8px' } }, f.Status)
          ),
          React.createElement('button', { onClick: function() { handleDeleteFlyer(f._row); },
            style: { background:'none', border:'none', color:'#6b7fa8', cursor:'pointer', fontSize:16, padding:'0 4px' } }, '🗑')
        ),
        React.createElement('div', { style: { fontSize:12, color:'#8a9abf', marginTop:4, display:'flex', gap:12, flexWrap:'wrap' } },
          String(f.Recurring) === 'true' && React.createElement('span', null, '🔁 Recurring'),
          dateStr && React.createElement('span', null, '📅 ' + dateStr + (f.Time ? ' · ' + f.Time : '')),
          f.Location && React.createElement('span', null, '📍 ' + f.Location)
        ),
        f.Description && React.createElement('div', { style: { fontSize:13, color:'#c9d9ff', marginTop:6 } }, f.Description),
        f.Tags && React.createElement('div', { style: { fontSize:11, color:'#6b7fa8', marginTop:4 } }, f.Tags),
        React.createElement('div', { style: { display:'flex', gap:6, marginTop:10, flexWrap:'wrap', alignItems:'center' } },
          ['Going','Interested','Not Going'].map(function(s) {
            return React.createElement('button', { key: s, onClick: function() { handleRsvp(f._row, f.Status === s ? '' : s); },
              style: { fontSize:11, padding:'4px 10px', borderRadius:20, cursor:'pointer',
                background: f.Status === s ? rsvpColors[s] : 'none',
                border: '1px solid ' + (rsvpColors[s] || '#1e3060'),
                color: f.Status === s ? '#fff' : (rsvpColors[s] || '#6b7fa8') } }, s);
          }),
          f.Status !== 'Done' && React.createElement('button', { onClick: function() { handleRsvp(f._row, 'Done'); },
            style: { fontSize:11, padding:'4px 10px', borderRadius:20, cursor:'pointer',
              background:'none', border:'1px solid #555', color:'#888' } }, '✓ Done'),
          f.Date && React.createElement('button', { onClick: function() { handleAddToCalendar(f); }, disabled: busy,
            style: { fontSize:11, padding:'4px 10px', borderRadius:20, cursor:'pointer',
              background:'none', border:'1px solid #1e3060', color:'#8a9abf', marginLeft:'auto' } }, '📅 Calendar')
        )
      )
    );
  }

  function inp(key, lbl) {
    return (
      React.createElement('div', { key: key, style: { marginBottom:10 } },
        React.createElement('label', { style: { display:'block', fontSize:11, color:'#8a9abf', marginBottom:3, textTransform:'uppercase', letterSpacing:1 } }, lbl),
        React.createElement('input', { type:'text', value: (editDraft && editDraft[key]) || '',
          onChange: function(e) { var v = e.target.value; setEditDraft(function(p) { var n = Object.assign({}, p); n[key] = v; return n; }); },
          style: { width:'100%', padding:'7px 10px', borderRadius:8, background:'#0d1b3e', border:'1px solid #1e3060', color:'#dde1f0', fontSize:13 } })
      )
    );
  }

  return (
    <div>
      {/* Panel toggle */}
      <div style={{ display:'flex', gap:8, marginBottom:18 }}>
        {[{ id:'flyers', label:'🪧 Flyer Board' }, { id:'hoa', label:'🏘 HOA Watch' }].map(function(p) {
          return (
            <button key={p.id} onClick={function() { setPanel(p.id); }}
              style={{ background: panel === p.id ? 'rgba(201,168,76,.08)' : 'none',
                       border:'1px solid ' + (panel === p.id ? '#c9a84c' : '#1e3060'),
                       borderRadius:20, color: panel === p.id ? '#c9a84c' : '#6b7fa8',
                       fontSize:12, padding:'5px 14px', cursor:'pointer' }}>
              {p.label}
            </button>
          );
        })}
      </div>

      {/* ── FLYER BOARD ── */}
      {panel === 'flyers' && (
        <div>
          <div className="toolbar">
            <button className="btn btn-primary" style={{ fontSize:12 }}
              disabled={extracting} onClick={function() { fileRef.current && fileRef.current.click(); }}>
              {extracting ? '⏳ Extracting…' : '📷 Upload Flyer'}
            </button>
            {flyers && <span className="count-badge">{flyers.length} flyer{flyers.length !== 1 ? 's' : ''}</span>}
            <input ref={fileRef} type="file" accept="image/*" style={{ display:'none' }} onChange={handleFileChange} />
          </div>

          {editDraft && (
            <div style={{ background:'#111e42', border:'1px solid #c9a84c', borderRadius:12, padding:20, marginBottom:18 }}>
              {previewUrl && <img src={previewUrl} style={{ maxHeight:120, borderRadius:8, marginBottom:14, display:'block' }} />}
              <div style={{ fontWeight:700, fontSize:15, marginBottom:14, color:'#e8eaf6' }}>🪧 Confirm Flyer Details</div>
              {inp('title','Title')}
              {inp('type','Type (Event / Notice / Other)')}
              {inp('date','Date (YYYY-MM-DD)')}
              {inp('time','Time (HH:MM)')}
              {inp('location','Location')}
              {inp('tags','Tags (comma-separated)')}
              <div style={{ marginBottom:10 }}>
                <label style={{ display:'block', fontSize:11, color:'#8a9abf', marginBottom:3, textTransform:'uppercase', letterSpacing:1 }}>Description</label>
                <textarea value={(editDraft && editDraft.description) || ''} rows={3}
                  onChange={function(e) { var v = e.target.value; setEditDraft(function(p) { return Object.assign({}, p, { description: v }); }); }}
                  style={{ width:'100%', padding:'7px 10px', borderRadius:8, background:'#0d1b3e', border:'1px solid #1e3060', color:'#dde1f0', fontSize:13, resize:'vertical' }} />
              </div>
              <label style={{ fontSize:13, color:'#8a9abf', cursor:'pointer', display:'block', marginBottom:14 }}>
                <input type="checkbox" checked={!!(editDraft && editDraft.recurring)}
                  onChange={function(e) { var v = e.target.checked; setEditDraft(function(p) { return Object.assign({}, p, { recurring: v }); }); }}
                  style={{ marginRight:6 }} />
                Recurring event
              </label>
              <div style={{ display:'flex', gap:8 }}>
                <button className="btn btn-primary" onClick={handleSaveFlyer} disabled={busy}>{busy ? 'Saving…' : 'Save Flyer'}</button>
                <button className="btn" onClick={function() { setEditDraft(null); setPreviewUrl(null); }}>Cancel</button>
              </div>
            </div>
          )}

          {flyerLoading && <div style={{ fontSize:13, color:'#6b7fa8', padding:16 }}>Loading…</div>}
          {!flyerLoading && flyers && flyers.length === 0 && !editDraft && (
            <div style={{ textAlign:'center', padding:40 }}>
              <div style={{ fontSize:32, marginBottom:12 }}>🪧</div>
              <div style={{ color:'#c9d9ff' }}>No flyers yet.</div>
              <div style={{ fontSize:13, color:'#6b7fa8', marginTop:8 }}>Upload a photo of a neighborhood flyer to get started.</div>
            </div>
          )}
          {!flyerLoading && upcoming.length > 0 && (
            <div>
              <div style={{ fontSize:11, color:'#c9a84c', textTransform:'uppercase', letterSpacing:1, marginBottom:8 }}>Upcoming</div>
              {upcoming.map(function(f) { return <FlyerCard key={f._row} f={f} />; })}
            </div>
          )}
          {!flyerLoading && past.length > 0 && (
            <div style={{ marginTop:16 }}>
              <div style={{ fontSize:11, color:'#6b7fa8', textTransform:'uppercase', letterSpacing:1, marginBottom:8 }}>Past</div>
              {past.map(function(f) { return <FlyerCard key={f._row} f={f} />; })}
            </div>
          )}
        </div>
      )}

      {/* ── HOA WATCH ── */}
      {panel === 'hoa' && (
        <div>
          <div style={{ marginBottom:20 }}>
            <label style={{ display:'block', fontSize:11, color:'#8a9abf', marginBottom:6, textTransform:'uppercase', letterSpacing:1 }}>HOA Website URL</label>
            <div style={{ display:'flex', gap:8 }}>
              <input type="url" value={hoaUrlInput} onChange={function(e) { setHoaUrlInput(e.target.value); }}
                placeholder="https://myhoa.com/events"
                style={{ flex:1, padding:'8px 12px', borderRadius:8, background:'#0d1b3e', border:'1px solid #1e3060', color:'#dde1f0', fontSize:13 }} />
              <button className="btn btn-primary" style={{ fontSize:12, whiteSpace:'nowrap' }}
                onClick={handleSaveHoaUrl} disabled={!hoaUrlInput.trim()}>💾 Save</button>
            </div>
          </div>
          <div style={{ display:'flex', alignItems:'center', gap:14, marginBottom:20, flexWrap:'wrap' }}>
            <button className="btn btn-primary" style={{ fontSize:12 }} disabled={scanning || !hoaUrl}
              onClick={handleScanNow}>
              {scanning ? '⏳ Scanning…' : '▶ Scan Now'}
            </button>
            {!hoaUrl && <span style={{ fontSize:12, color:'#6b7fa8' }}>Save a URL above to enable scanning</span>}
          </div>
          <div style={{ fontSize:11, color:'#c9a84c', textTransform:'uppercase', letterSpacing:1, marginBottom:10 }}>Scan History</div>
          {hoaScans === null && <div style={{ fontSize:13, color:'#6b7fa8' }}>Loading…</div>}
          {hoaScans && hoaScans.length === 0 && (
            <div style={{ fontSize:13, color:'#6b7fa8', padding:'12px 0' }}>No scans yet. Click ▶ Scan Now to run your first check.</div>
          )}
          {hoaScans && hoaScans.map(function(s, i) {
            var dt    = s['Scanned At'] ? new Date(s['Scanned At']) : null;
            var dtStr = dt ? dt.toLocaleDateString('en-US', { month:'short', day:'numeric' }) + ' · ' + dt.toLocaleTimeString('en-US', { hour:'numeric', minute:'2-digit' }) : '—';
            return (
              <div key={i} style={{ display:'flex', justifyContent:'space-between', fontSize:13,
                                    padding:'8px 0', borderBottom:'1px solid #1a2a4a', color:'#c9d9ff' }}>
                <span>{dtStr}</span>
                <span style={{ color:'#6b7fa8', fontSize:12 }}>
                  {s['Items Found'] || 0} items · {s['New Flags'] || 0} flags
                </span>
              </div>
            );
          })}
          <div style={{ fontSize:12, color:'#6b7fa8', marginTop:16, lineHeight:1.6 }}>
            ℹ Flags appear in the VERA Flags tab. Items repeatedly ignored are suppressed automatically via Signal Learning.
          </div>
        </div>
      )}

      {toast && (
        <div style={{ position:'fixed', bottom:28, right:28, background:'#1e3060',
          border:'1px solid #c9a84c', borderRadius:10, padding:'12px 20px',
          color:'#e8eaf6', fontSize:14, zIndex:9999 }}>
          {toast}
        </div>
      )}
    </div>
  );
}

// ---- HomeFrontLiteTab -------------------------------------------------------

function HomeFrontLiteTab({ apiUrl, apiToken, features }) {
  const feat = features || {};
  const ALL_SUBTABS = [
    { id:'steward',   label:'🏠 Steward'   },
    { id:'vehicles',  label:'🚗 Vehicles'  },
    { id:'chores',    label:'✅ Chores'    },
    { id:'chores_for_others', label:'🧒 For Others' },
    { id:'recipes',   label:'🍽️ Recipes'   },
    { id:'meal_plan', label:'📅 Meal Plan', featureKey:'meal_planner' },
    { id:'takeouts',  label:'🥡 Takeouts',  featureKey:'takeouts'     },
    { id:'pantry',    label:'🛒 Pantry',    featureKey:'pantry'       },
    { id:'guests',    label:'👥 Guests'    },
    { id:'resell',             label:'💰 Resell'             },
    { id:'coupons',            label:'🎟️ Coupons'            },
    { id:'neighborhood_watch', label:'🏘 Watch'              },
  ];
  const SUBTABS = ALL_SUBTABS.filter(function(t) {
    return !t.featureKey || feat[t.featureKey] !== false;
  });

  const [sub,             setSub]             = React.useState('steward');
  const [homeFront,       setHomeFront]       = React.useState(null);
  const [chores,          setChores]          = React.useState(null);
  const [choresLoading,   setChoresLoading]   = React.useState(false);
  const [vehicles,        setVehicles]        = React.useState(null);
  const [vehiclesLoading, setVehiclesLoading] = React.useState(false);
  const [choresForOthers,        setChoresForOthers]        = React.useState(null);
  const [choresForOthersLoading, setChoresForOthersLoading] = React.useState(false);
  const [purchaseHistory, setPurchaseHistory] = React.useState(null);
  const [phLoading,       setPhLoading]       = React.useState(false);
  const [busy,            setBusy]            = React.useState(false);
  const [toast,           setToast]           = React.useState(null);

  React.useEffect(function() {
    if (SUBTABS.length > 0 && !SUBTABS.find(function(t) { return t.id === sub; })) {
      setSub(SUBTABS[0].id);
    }
  }, [SUBTABS.map(function(t) { return t.id; }).join(',')]);

  function showToast(msg) {
    setToast(msg);
    setTimeout(function() { setToast(null); }, 3000);
  }

  function loadHomeFront() {
    Promise.all([
      apiGet(apiUrl, apiToken, { action: 'recipes' }),
      apiGet(apiUrl, apiToken, { action: 'homesteward' }),
      apiGet(apiUrl, apiToken, { action: 'takeouts' }),
    ]).then(function(results) {
      var rData = results[0], hData = results[1], tData = results[2];
      setHomeFront({
        recipes:  rData.recipes      || [],
        items:    hData.items        || [],
        takeouts: tData.restaurants  || [],
      });
    }).catch(function() { setHomeFront({ recipes:[], items:[], takeouts:[] }); });
  }

  function loadChores() {
    setChoresLoading(true);
    apiGet(apiUrl, apiToken, { action: 'get_chores' })
      .then(function(d) { setChores(d.chores || []); })
      .catch(function() { setChores([]); })
      .finally(function() { setChoresLoading(false); });
  }

  function loadVehicles() {
    setVehiclesLoading(true);
    apiGet(apiUrl, apiToken, { action: 'get_vehicles' })
      .then(function(d) { setVehicles(d.vehicles || []); })
      .catch(function() { setVehicles([]); })
      .finally(function() { setVehiclesLoading(false); });
  }

  function loadPurchaseHistory() {
    setPhLoading(true);
    apiGet(apiUrl, apiToken, { action: 'purchase_history' })
      .then(function(d) { setPurchaseHistory(d.history || []); })
      .catch(function() { setPurchaseHistory([]); })
      .finally(function() { setPhLoading(false); });
  }

  function loadChoresForOthers() {
    setChoresForOthersLoading(true);
    apiGet(apiUrl, apiToken, { action: 'get_chores_for_others' })
      .then(function(d) { setChoresForOthers(d.chores || []); })
      .catch(function() { setChoresForOthers([]); })
      .finally(function() { setChoresForOthersLoading(false); });
  }

  React.useEffect(function() {
    if (!apiUrl || !apiToken) return;
    loadHomeFront();
    loadChores();
    loadVehicles();
    loadChoresForOthers();
  }, [apiUrl, apiToken]);

  React.useEffect(function() {
    if (sub === 'pantry' && purchaseHistory === null && !phLoading) {
      loadPurchaseHistory();
    }
  }, [sub]);

  function handleRecordService(row) {
    setBusy(true);
    apiGet(apiUrl, apiToken, { action: 'homesteward_service', row: row })
      .then(function() { loadHomeFront(); showToast('Service recorded'); })
      .catch(function(e) { showToast('Error: ' + e.message); })
      .finally(function() { setBusy(false); });
  }

  function handleRecipeToShopping(row, recipeName) {
    setBusy(true);
    apiGet(apiUrl, apiToken, { action: 'recipe_to_shopping', row: row })
      .then(function() { showToast((recipeName || 'Recipe') + ' added to shopping list'); })
      .catch(function(e) { showToast('Error: ' + e.message); })
      .finally(function() { setBusy(false); });
  }

  function handleToggleChore(id, checked) {
    apiGet(apiUrl, apiToken, { action: 'toggle_chore', id: id, checked: String(checked) })
      .then(function() { loadChores(); })
      .catch(function() {});
  }

  function handleAddChore(text, cadence) {
    apiGet(apiUrl, apiToken, { action: 'add_chore', text: text, cadence: cadence })
      .then(function() { loadChores(); })
      .catch(function() {});
  }

  function handleDeleteChore(id) {
    apiGet(apiUrl, apiToken, { action: 'delete_chore', id: id })
      .then(function() { loadChores(); })
      .catch(function() {});
  }

  function handleUpdateChoreCadence(id, cadence) {
    apiGet(apiUrl, apiToken, { action: 'update_chore', id: id, cadence: cadence })
      .then(function() { loadChores(); })
      .catch(function() {});
  }

  function handleAddChoreForOthers(fields) {
    setBusy(true);
    apiGet(apiUrl, apiToken, Object.assign({ action: 'add_chore_for_others' }, fields))
      .then(function() { loadChoresForOthers(); showToast('Chore assigned'); })
      .catch(function(e) { showToast('Error: ' + e.message); })
      .finally(function() { setBusy(false); });
  }

  function handleCompleteChoreForOthers(id) {
    setChoresForOthers(function(prev) { return (prev || []).map(function(c) { return c.ID === id ? Object.assign({}, c, { Status: 'Done' }) : c; }); });
    apiGet(apiUrl, apiToken, { action: 'complete_chore_for_others', id: id })
      .then(function() { showToast('Marked done'); })
      .catch(function(e) { showToast('Error: ' + e.message); loadChoresForOthers(); });
  }

  function handleEditChoreForOthers(id, fields) {
    setBusy(true);
    apiGet(apiUrl, apiToken, { action: 'update_chore_for_others', id: id, Task: fields.task, Assignee: fields.assignee, Reward: fields.reward, Notes: fields.notes })
      .then(function() { loadChoresForOthers(); showToast('Chore updated'); })
      .catch(function(e) { showToast('Error: ' + e.message); })
      .finally(function() { setBusy(false); });
  }

  function handleDeleteChoreForOthers(id) {
    if (!window.confirm('Delete this chore? This cannot be undone.')) return;
    setChoresForOthers(function(prev) { return (prev || []).filter(function(c) { return c.ID !== id; }); });
    apiGet(apiUrl, apiToken, { action: 'delete_chore_for_others', id: id })
      .catch(function(e) { showToast('Error: ' + e.message); loadChoresForOthers(); });
  }

  function handleOilChange(id, mi) {
    apiGet(apiUrl, apiToken, { action: 'vehicle_oil_change', id: id, mileage: mi })
      .then(function() { loadVehicles(); }).catch(function() {});
  }

  function handleVehicleService(id) {
    apiGet(apiUrl, apiToken, { action: 'vehicle_service', id: id })
      .then(function() { loadVehicles(); }).catch(function() {});
  }

  function handleMileage(id, mi) {
    apiGet(apiUrl, apiToken, { action: 'vehicle_mileage', id: id, mileage: mi })
      .then(function() { loadVehicles(); }).catch(function() {});
  }

  function handleAddVehicle(form) {
    apiGet(apiUrl, apiToken, Object.assign({ action: 'vehicle_add' }, form))
      .then(function() { loadVehicles(); }).catch(function() {});
  }

  function handleDeleteVehicle(id) {
    apiGet(apiUrl, apiToken, { action: 'vehicle_delete', id: id })
      .then(function() { loadVehicles(); }).catch(function() {});
  }

  function handleTireChange(id, mi) {
    apiGet(apiUrl, apiToken, { action: 'vehicle_tire_change', id: id, mileage: mi })
      .then(function() { loadVehicles(); }).catch(function() {});
  }

  function handleEmissionInspect(id, date) {
    apiGet(apiUrl, apiToken, { action: 'vehicle_emission_inspect', id: id, date: date })
      .then(function() { loadVehicles(); }).catch(function() {});
  }

  function handleSafetyInspect(id, date) {
    apiGet(apiUrl, apiToken, { action: 'vehicle_safety_inspect', id: id, date: date })
      .then(function() { loadVehicles(); }).catch(function() {});
  }

  function handleAddTakeoutRestaurant(data) {
    apiPost(apiUrl, apiToken, Object.assign({ action: 'add_takeout_restaurant' }, data))
      .then(function() { loadHomeFront(); }).catch(function() {});
  }

  function handleDeleteTakeoutRestaurant(name) {
    apiPost(apiUrl, apiToken, { action: 'delete_takeout_restaurant', name: name })
      .then(function() { loadHomeFront(); }).catch(function() {});
  }

  function handleAddTakeoutItem(restaurant, data) {
    apiPost(apiUrl, apiToken, Object.assign({ action: 'add_takeout_item', restaurant: restaurant }, data))
      .then(function() { loadHomeFront(); }).catch(function() {});
  }

  function handleDeleteTakeoutItem(row) {
    apiPost(apiUrl, apiToken, { action: 'delete_takeout_item', row: row })
      .then(function() { loadHomeFront(); }).catch(function() {});
  }

  return (
    <div>
      <div className="subtab-row">
        {SUBTABS.map(function(t) {
          return (
            <button key={t.id}
              className={'subtab-btn' + (sub === t.id ? ' active' : '')}
              onClick={function() { setSub(t.id); }}>
              {t.label}
            </button>
          );
        })}
      </div>

      {sub === 'steward' && (
        <HomestewardView
          items={homeFront ? homeFront.items : []}
          loading={homeFront === null}
          busy={busy}
          onRecordService={handleRecordService}
        />
      )}

      {sub === 'vehicles' && (
        <VehiclesView
          vehicles={vehicles}
          loading={vehiclesLoading}
          busy={busy}
          onOilChange={handleOilChange}
          onService={handleVehicleService}
          onMileage={handleMileage}
          onAdd={handleAddVehicle}
          onDelete={handleDeleteVehicle}
          onTireChange={handleTireChange}
          onEmissionInspect={handleEmissionInspect}
          onSafetyInspect={handleSafetyInspect}
        />
      )}

      {sub === 'chores' && (
        <ChoresView
          chores={chores || []}
          loading={choresLoading}
          busy={busy}
          onToggle={handleToggleChore}
          onAdd={handleAddChore}
          onDelete={handleDeleteChore}
          onUpdateCadence={handleUpdateChoreCadence}
        />
      )}

      {sub === 'chores_for_others' && (
        <ChoresForOthersView
          chores={choresForOthers || []}
          loading={choresForOthersLoading}
          busy={busy}
          onAdd={handleAddChoreForOthers}
          onComplete={handleCompleteChoreForOthers}
          onEdit={handleEditChoreForOthers}
          onDelete={handleDeleteChoreForOthers}
        />
      )}

      {sub === 'recipes' && (
        <RecipeView
          recipes={homeFront ? homeFront.recipes : []}
          loading={homeFront === null}
          busy={busy}
          onAddToShopping={handleRecipeToShopping}
        />
      )}

      {sub === 'meal_plan' && (
        <MealPlanSubTab apiUrl={apiUrl} apiToken={apiToken} />
      )}

      {sub === 'takeouts' && (
        <TakeoutsView
          takeouts={homeFront ? homeFront.takeouts : []}
          loading={homeFront === null}
          busy={busy}
          onAddRestaurant={handleAddTakeoutRestaurant}
          onDeleteRestaurant={handleDeleteTakeoutRestaurant}
          onAddItem={handleAddTakeoutItem}
          onDeleteItem={handleDeleteTakeoutItem}
        />
      )}

      {sub === 'pantry' && (
        phLoading
          ? <div style={{ fontSize:13, color:'#6b7fa8', padding:16 }}>Loading…</div>
          : <PurchaseHistoryTab items={purchaseHistory || []} />
      )}

      {sub === 'guests' && (
        <GuestsView apiUrl={apiUrl} apiToken={apiToken} />
      )}

      {sub === 'resell' && (
        <ResellListView apiUrl={apiUrl} apiToken={apiToken} />
      )}

      {sub === 'coupons' && (
        <CouponsLiteTab apiUrl={apiUrl} apiToken={apiToken} />
      )}

      {sub === 'neighborhood_watch' && (
        <NeighborhoodWatchView apiUrl={apiUrl} apiToken={apiToken} />
      )}

      {toast && (
        <div style={{ position:'fixed', bottom:28, right:28, background:'#1e3060',
          border:'1px solid #c9a84c', borderRadius:10, padding:'12px 20px',
          color:'#e8eaf6', fontSize:14, zIndex:9999 }}>
          {toast}
        </div>
      )}
    </div>
  );
}

// ---- HouseholdLiteTab -------------------------------------------------------

function HouseholdRowModal({ initial, onSave, onClose, busy }) {
  const [form, setForm] = React.useState({
    section:    initial.section    || '',
    subsection: initial.subsection || '',
    label:      initial.label      || '',
    value:      initial.value      || '',
    notes:      initial.notes      || '',
  });
  const isAdd = !initial.rowNum;
  function field(key, label, required) {
    return (
      <div style={{ marginBottom:12 }}>
        <div style={{ fontSize:11, fontWeight:600, color:'#8a9abf', marginBottom:4 }}>{label}{required ? ' *' : ''}</div>
        <input
          value={form[key]}
          onChange={e => setForm(prev => ({ ...prev, [key]: e.target.value }))}
          style={{ width:'100%', background:'#0a1628', border:'1px solid #1e3060', borderRadius:6,
                   padding:'8px 10px', color:'#dde1f0', fontSize:13, boxSizing:'border-box' }}
        />
      </div>
    );
  }
  return (
    <div style={{ position:'fixed', inset:0, background:'rgba(0,0,0,0.6)', zIndex:1000,
                  display:'flex', alignItems:'center', justifyContent:'center' }}
         onClick={e => { if (e.target === e.currentTarget) onClose(); }}>
      <div style={{ background:'#0d1b3e', border:'1px solid #1e3060', borderRadius:12,
                    padding:24, width:400, maxWidth:'90vw' }}>
        <div style={{ fontSize:15, fontWeight:700, color:'#dde1f0', marginBottom:16 }}>
          {isAdd ? 'Add Row' : 'Edit Row'}
        </div>
        {field('section',    'Section',    true)}
        {field('subsection', 'Subsection', false)}
        {field('label',      'Label',      true)}
        {field('value',      'Value',      true)}
        {field('notes',      'Notes',      false)}
        <div style={{ display:'flex', gap:8, justifyContent:'flex-end', marginTop:8 }}>
          <button onClick={onClose} disabled={busy}
                  style={{ padding:'8px 16px', borderRadius:6, background:'rgba(255,255,255,0.07)',
                           color:'#8a9abf', border:'none', cursor:'pointer', fontSize:13 }}>
            Cancel
          </button>
          <button onClick={() => onSave(form)} disabled={busy || !form.section || !form.label || !form.value}
                  style={{ padding:'8px 16px', borderRadius:6, background:'#1565c0',
                           color:'#fff', border:'none', cursor:'pointer', fontSize:13, fontWeight:600 }}>
            {busy ? 'Saving…' : 'Save'}
          </button>
        </div>
      </div>
    </div>
  );
}

function HouseholdLiteTab({ apiUrl, apiToken }) {
  const [data,         setData]         = React.useState(null);
  const [loading,      setLoading]      = React.useState(false);
  const [busy,         setBusy]         = React.useState(false);
  const [revealed,     setRevealed]     = React.useState({});
  const [openSections, setOpenSections] = React.useState({});
  const [modal,        setModal]        = React.useState(null); // null | row object (with isAdd flag)
  const [inlineEdit,   setInlineEdit]   = React.useState(null); // null | { rowNum, value }
  const inlineRef = React.useRef(null);

  async function load() {
    if (!apiUrl || !apiToken) return;
    setLoading(true);
    try {
      const res = await apiGet(apiUrl, apiToken, { action: 'get_household_info' });
      setData(res);
      if (res.sections) {
        const open = {};
        res.sections.forEach(s => { open[s.section] = true; });
        setOpenSections(prev => {
          // Preserve any manually-closed sections
          const merged = {};
          res.sections.forEach(s => { merged[s.section] = prev[s.section] !== false; });
          return merged;
        });
      }
    } catch (err) { /* silent */ }
    setLoading(false);
  }

  React.useEffect(() => { load(); }, [apiUrl, apiToken]);

  // Auto-focus inline input when it appears
  React.useEffect(() => {
    if (inlineEdit && inlineRef.current) inlineRef.current.focus();
  }, [inlineEdit]);

  const SENSITIVE = ['id', '#', 'number', 'account', 'ssn', 'vin', 'policy', 'member', 'pin'];
  function isSensitive(label) {
    const l = label.toLowerCase();
    return SENSITIVE.some(k => l.includes(k));
  }
  function maskValue(val) {
    const s = String(val);
    return s.length <= 4 ? '••••' : '••••' + s.slice(-4);
  }

  async function handleSaveModal(form) {
    setBusy(true);
    try {
      if (modal.rowNum) {
        await apiGet(apiUrl, apiToken, { action: 'update_household_row', rowNum: modal.rowNum, ...form });
      } else {
        await apiGet(apiUrl, apiToken, { action: 'add_household_row', ...form });
      }
      setModal(null);
      await load();
    } catch (err) { alert('Save failed: ' + err.message); }
    setBusy(false);
  }

  async function handleInlineSave(row, newValue) {
    if (newValue === row.value) { setInlineEdit(null); return; }
    setBusy(true);
    try {
      await apiGet(apiUrl, apiToken, {
        action: 'update_household_row',
        rowNum: row.rowNum,
        section: row.section, subsection: row.subsection,
        label: row.label, value: newValue, notes: row.notes,
      });
      await load();
    } catch (err) { alert('Save failed: ' + err.message); }
    setInlineEdit(null);
    setBusy(false);
  }

  async function handleDelete(row) {
    if (!window.confirm(`Delete "${row.label}"?`)) return;
    setBusy(true);
    try {
      await apiGet(apiUrl, apiToken, { action: 'delete_household_row', rowNum: row.rowNum });
      await load();
    } catch (err) { alert('Delete failed: ' + err.message); }
    setBusy(false);
  }

  const iconBtn = { background:'none', border:'none', cursor:'pointer', padding:'0 3px',
                    fontSize:13, opacity:0.5, lineHeight:1 };

  if (loading && !data) return (
    <div style={{ color:'#6b7fa8', padding:32, textAlign:'center' }}>Loading household info...</div>
  );
  if (!data || !data.sections || data.sections.length === 0) return (
    <div style={{ color:'#6b7fa8', padding:32, textAlign:'center' }}>
      <div style={{ fontSize:32, marginBottom:12 }}>🏡</div>
      <div style={{ fontSize:14, marginBottom:8 }}>No household info yet.</div>
      <div style={{ fontSize:12, color:'#4a5a7a' }}>
        Run <strong>setupHouseholdInfoSheet_()</strong> in the Apps Script editor, then reload.
      </div>
    </div>
  );

  const sheetUrl = data.sheetUrl || '';

  return (
    <div>
      {modal && (
        <HouseholdRowModal initial={modal} onSave={handleSaveModal} onClose={() => setModal(null)} busy={busy} />
      )}

      <div style={{ display:'flex', alignItems:'center', justifyContent:'space-between', marginBottom:20 }}>
        <div>
          <div style={{ fontSize:18, fontWeight:700, color:'#dde1f0' }}>Household Cheat Sheet</div>
          <div style={{ fontSize:12, color:'#6b7fa8', marginTop:2 }}>Shared quick reference — offline survival info</div>
        </div>
        <div style={{ display:'flex', gap:8 }}>
          {sheetUrl && (
            <a href={sheetUrl} target="_blank" rel="noreferrer"
               style={{ fontSize:12, padding:'6px 12px', borderRadius:6,
                        background:'rgba(255,255,255,0.07)', color:'#8a9abf',
                        textDecoration:'none', display:'inline-flex', alignItems:'center', gap:4 }}>
              ↗ Sheets
            </a>
          )}
          <button onClick={() => window.print()}
                  style={{ fontSize:12, padding:'6px 12px', borderRadius:6,
                           background:'rgba(255,255,255,0.07)', color:'#8a9abf',
                           border:'none', cursor:'pointer' }}>
            🖨 Print
          </button>
        </div>
      </div>

      <div style={{ display:'flex', flexDirection:'column', gap:12 }}>
        {data.sections.map((section, si) => {
          const isOpen = openSections[section.section] !== false;
          return (
            <div key={section.section}
                 style={{ borderRadius:10, overflow:'hidden', background:'#0d1b3e', border:'1px solid #1e3060' }}>
              <button onClick={() => setOpenSections(prev => ({ ...prev, [section.section]: !isOpen }))}
                      style={{ width:'100%', display:'flex', alignItems:'center',
                               justifyContent:'space-between', padding:'14px 20px',
                               background:'none', border:'none', cursor:'pointer', textAlign:'left' }}>
                <div style={{ display:'flex', alignItems:'center', gap:10 }}>
                  <span style={{ fontSize:15, fontWeight:700, color:'#dde1f0' }}>{section.section}</span>
                  {section.lastUpdated && (
                    <span style={{ fontSize:11, color:'#4a5a7a' }}>Updated {section.lastUpdated}</span>
                  )}
                </div>
                <span style={{ color:'#4a5a7a', fontSize:12 }}>{isOpen ? '▲' : '▼'}</span>
              </button>

              {isOpen && (
                <div style={{ padding:'0 20px 16px' }}>
                  {section.subsections.map((subsection, ssi) => (
                    <div key={subsection.subsection || '_'}
                         style={{ marginBottom: ssi < section.subsections.length - 1 ? 20 : 0 }}>
                      {subsection.subsection && (
                        <div style={{ fontSize:11, fontWeight:700, color:'#c9a84c',
                                      letterSpacing:'1.5px', textTransform:'uppercase',
                                      marginBottom:10, paddingTop: ssi === 0 ? 4 : 12 }}>
                          {subsection.subsection}
                        </div>
                      )}
                      <table style={{ width:'100%', borderCollapse:'collapse' }}>
                        <tbody>
                          {subsection.rows.map((row, ri) => {
                            const revKey     = `${si}_${ssi}_${ri}`;
                            const sensitive  = isSensitive(row.label);
                            const isRevealed = revealed[revKey];
                            const isInline   = inlineEdit && inlineEdit.rowNum === row.rowNum;
                            const displayVal = sensitive && !isRevealed ? maskValue(row.value) : row.value;
                            return (
                              <tr key={ri}
                                  style={{ borderBottom:'1px solid rgba(30,48,96,0.5)' }}
                                  className="household-row">
                                <td style={{ padding:'8px 16px 8px 0', fontSize:12, fontWeight:600,
                                             color:'#8a9abf', whiteSpace:'nowrap', verticalAlign:'middle', width:'28%' }}>
                                  {row.label}
                                </td>
                                <td style={{ padding:'6px 0', fontSize:13, color:'#dde1f0', verticalAlign:'middle' }}>
                                  {isInline ? (
                                    <input
                                      ref={inlineRef}
                                      defaultValue={row.value}
                                      onKeyDown={e => {
                                        if (e.key === 'Enter') handleInlineSave(row, e.target.value);
                                        if (e.key === 'Escape') setInlineEdit(null);
                                      }}
                                      onBlur={e => handleInlineSave(row, e.target.value)}
                                      style={{ width:'100%', background:'#0a1628', border:'1px solid #1565c0',
                                               borderRadius:5, padding:'4px 8px', color:'#dde1f0',
                                               fontSize:13, boxSizing:'border-box' }}
                                    />
                                  ) : (
                                    <span
                                      onClick={() => !sensitive && setInlineEdit({ rowNum: row.rowNum, value: row.value })}
                                      style={{ cursor: sensitive ? 'default' : 'text' }}>
                                      {displayVal}
                                    </span>
                                  )}
                                  {sensitive && !isInline && (
                                    <button onClick={() => setRevealed(prev => ({ ...prev, [revKey]: !isRevealed }))}
                                            style={{ marginLeft:8, fontSize:10, color:'#4a5a7a',
                                                     background:'none', border:'none', cursor:'pointer', padding:'0 4px' }}>
                                      {isRevealed ? 'hide' : 'show'}
                                    </button>
                                  )}
                                </td>
                                <td style={{ padding:'6px 0 6px 8px', verticalAlign:'middle', whiteSpace:'nowrap' }}>
                                  <button title="Edit" onClick={() => setModal(row)} style={iconBtn} disabled={busy}>✏️</button>
                                  <button title="Delete" onClick={() => handleDelete(row)} style={iconBtn} disabled={busy}>🗑️</button>
                                </td>
                              </tr>
                            );
                          })}
                        </tbody>
                      </table>
                    </div>
                  ))}
                  <button
                    onClick={() => setModal({ section: section.section, subsection: '', label: '', value: '', notes: '' })}
                    disabled={busy}
                    style={{ marginTop:12, fontSize:12, padding:'5px 12px', borderRadius:6,
                             background:'rgba(21,101,192,0.15)', color:'#5b9bd5',
                             border:'1px dashed rgba(21,101,192,0.4)', cursor:'pointer' }}>
                    + Add row
                  </button>
                </div>
              )}
            </div>
          );
        })}
      </div>
    </div>
  );
}

// ---- Finance helpers --------------------------------------------------------

function fmtMny(v) {
  if (v == null || v === '') return '—';
  return '$' + Math.round(Number(v)).toLocaleString();
}

function payerChip(paidBy) {
  const color = paidBy === 'Ahmed' ? '#5c9eff' : paidBy === 'Victoria' ? '#c97ef2' : '#2bb5a0';
  return (
    <span style={{ fontSize: 10, padding: '1px 6px', borderRadius: 8,
      border: '1px solid ' + color, color, whiteSpace: 'nowrap', flexShrink: 0 }}>
      {paidBy}
    </span>
  );
}

function useTrackerBudget(apiUrl, apiToken) {
  const [tb, setTb] = React.useState(null);
  const [loading, setLoading] = React.useState(false);
  async function load() {
    if (!apiUrl || !apiToken) return;
    setLoading(true);
    try { const d = await apiGet(apiUrl, apiToken, { action: 'budget_tracker' }); setTb(d && d.ok ? d : null); }
    catch(e) { setTb(null); }
    setLoading(false);
  }
  React.useEffect(() => { load(); }, [apiUrl, apiToken]);
  return [tb, loading, load];
}

function getSplit() {
  try { const s = JSON.parse(localStorage.getItem('vera_split') || 'null'); if (s && typeof s.ahmed === 'number') return s; } catch(e) {}
  return { ahmed: 60, victoria: 40 };
}

function FinBillsLiteTab({ apiUrl, apiToken }) {
  const [bills,        setBills]        = React.useState(null);
  const [billsLoading, setBillsLoading] = React.useState(false);
  const [calBills,     setCalBills]     = React.useState([]);
  const [accounts,     setAccounts]     = React.useState([]);
  const [txList,       setTxList]       = React.useState([]);
  const [busy,         setBusy]         = React.useState(false);
  const [showAddBill,  setShowAddBill]  = React.useState(false);
  const [tb, tbLoading, reloadTb] = useTrackerBudget(apiUrl, apiToken);

  function loadBills() {
    if (!apiUrl || !apiToken) return;
    setBillsLoading(true);
    apiGet(apiUrl, apiToken, { action: 'bills' })
      .then(function(d) { setBills(d || null); })
      .catch(function() { setBills(null); })
      .finally(function() { setBillsLoading(false); });
  }

  function loadCalBills() {
    if (!apiUrl || !apiToken) return;
    apiGet(apiUrl, apiToken, { action: 'calendar_bills' })
      .then(function(d) { setCalBills((d && d.bills) || []); })
      .catch(function() { setCalBills([]); });
  }

  React.useEffect(function() {
    if (!apiUrl || !apiToken) return;
    loadBills();
    loadCalBills();
    apiGet(apiUrl, apiToken, { action: 'get_bank_accounts' })
      .then(function(d) { setAccounts((d && d.accounts) || []); })
      .catch(function() {});
    apiGet(apiUrl, apiToken, { action: 'tx_list' })
      .then(function(d) { setTxList((d && d.transactions) || []); })
      .catch(function() {});
  }, [apiUrl, apiToken]);

  function handleBillToggle(row) {
    setBusy(true);
    apiGet(apiUrl, apiToken, { action: 'bills_toggle', row: row })
      .then(function() { loadBills(); loadCalBills(); })
      .catch(function() {})
      .finally(function() { setBusy(false); });
  }

  function handleCalBillToggle(calBill) {
    setBusy(true);
    apiGet(apiUrl, apiToken, {
      action: 'bills_toggle_cal',
      title: calBill.title,
      amount: calBill.amount != null ? calBill.amount : '',
      date: calBill.date || '',
      frequency: calBill.isRecurring ? 'Recurring' : 'One-time',
      category: calBill.category || '',
      notes: calBill.notes || '',
      isRecurring: String(!!calBill.isRecurring),
    })
      .then(function() { loadBills(); loadCalBills(); })
      .catch(function() {})
      .finally(function() { setBusy(false); });
  }

  function handleAddBill(fields) {
    setBusy(true);
    apiGet(apiUrl, apiToken, Object.assign({ action: 'add_bill' }, fields))
      .then(function() { loadBills(); })
      .catch(function() {})
      .finally(function() { setBusy(false); });
  }

  function handleSyncTransactions() {
    setBusy(true);
    apiGet(apiUrl, apiToken, { action: 'bills_sync_transactions' })
      .then(function() { loadBills(); })
      .catch(function() {})
      .finally(function() { setBusy(false); });
  }

  function handleBillReassign(row, account) {
    if (!row) return;
    apiGet(apiUrl, apiToken, { action: 'update_bill', row: row, account: account }).catch(function() {});
  }

  function handleBudgetLink(row, budgetEntry) {
    if (!row) return;
    apiGet(apiUrl, apiToken, { action: 'update_bill', row: row, budgetEntry: budgetEntry })
      .then(function() { reloadTb(); })
      .catch(function() {});
  }

  const syncCount = ((bills && bills.bills) || []).filter(function(b) { return b.txMatch && !b.paid; }).length;

  return (
    <div>
      <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center', marginBottom: 12 }}>
        {syncCount > 0 ? (
          <button onClick={handleSyncTransactions} disabled={busy} style={{ padding: '5px 12px', borderRadius: 12, background: 'rgba(102,187,106,0.10)', border: '1px solid rgba(102,187,106,0.4)', color: '#66bb6a', fontSize: 11, fontWeight: 600, cursor: busy ? 'not-allowed' : 'pointer', opacity: busy ? 0.6 : 1 }}>
            💳 {syncCount} matched — Sync
          </button>
        ) : <div />}
        <button onClick={function() { setShowAddBill(true); }} style={{ padding: '6px 14px', borderRadius: 8, background: '#0d2040', border: '1px solid #5c9eff', color: '#5c9eff', fontSize: 12, fontWeight: 600, cursor: 'pointer' }}>+ Add Bill</button>
      </div>

      <BillTrackerView
        accounts={accounts}
        bills={bills}
        calBills={calBills}
        billsLoading={billsLoading}
        txList={txList}
        onToggle={handleBillToggle}
        onCalToggle={handleCalBillToggle}
        onReassign={handleBillReassign}
        trackerBudget={tb}
        onBudgetLink={handleBudgetLink}
      />

      {showAddBill && (
        <AddBillModal
          busy={busy}
          accounts={accounts}
          onClose={function() { setShowAddBill(false); }}
          onSave={function(fields) { handleAddBill(fields); setShowAddBill(false); }}
        />
      )}
    </div>
  );
}

function FinCashflowLiteTab({ apiUrl, apiToken }) {
  const [bills, setBills] = React.useState(null);
  React.useEffect(function() {
    if (!apiUrl || !apiToken) return;
    apiGet(apiUrl, apiToken, { action: 'bills' })
      .then(function(d) { setBills(d || null); })
      .catch(function() { setBills(null); });
  }, [apiUrl, apiToken]);
  return <CashflowView apiUrl={apiUrl} apiToken={apiToken} bills={bills} />;
}

    return d.toLocaleDateString('en-US', { weekday:'short', month:'short', day:'numeric' });
  } catch(e) { return dateStr; }
}

function fmtDayHeader(dateStr, dayNum) {
  if (dateStr === '_undated') return 'Undated';
  try {
    const d = new Date(dateStr + 'T12:00:00');
    const full = d.toLocaleDateString('en-US', { weekday:'long', month:'long', day:'numeric' });
    return `Day ${dayNum} — ${full}`;
  } catch(e) { return dateStr; }
}

const CONTEXT_COLORS = {
  'Anniversary Trip':'#ff6b9d','Romantic Couples Getaway':'#ff6b9d','Honeymoon':'#ff6b9d',
  'Work Trip':'#4d8af0','Family Trip':'#56cc9d','Visiting Family':'#56cc9d',
  'Visiting Friends':'#f7c948',"Girls Trip":'#c084fc','Group Trip':'#94a3b8',
  'Solo Adventure':'#fb923c',
};
const SELF_TRANSPORT = new Set(['road_trip','rental_car']);
const TRANSPORT_TYPES_SET = new Set(['flight','train','bus','ferry','cruise','rental_car','driving']);
const HOTEL_TYPES_SET = new Set(['hotel','arranged_stay','cruise']);
const TRAVEL_MODE_LABELS = {
  flight:'✈️ Flight', road_trip:'🚗 Road Trip', train:'🚆 Train',
  rental_car:'🚙 Rental Car', bus:'🚌 Bus', cruise:'🛳️ Cruise', ferry:'⛴️ Ferry',
};
const PACK_CAT_ICON = {
  'Documents':'📄','Clothing':'👕','Shoes':'👟','Toiletries':'🧴','Electronics':'🔌',
  'Medications':'💊','Entertainment':'🎮','Beach/Pool':'🏖️','Outdoor/Hiking':'🥾',
  'Formal/Dress':'👔','Snacks':'🍿','Baby/Kids':'👶','Romantic':'💝',
};

function tripDateRange(startDate, endDate) {
  const dates = [];
  const cur = new Date(startDate + 'T12:00:00');
  const end = new Date(endDate + 'T12:00:00');
  while (cur <= end) { dates.push(cur.toISOString().slice(0,10)); cur.setDate(cur.getDate()+1); }
  return dates;
}

// --- VERANoticesCard ---------------------------------------------------------
function VERANoticesCard({ trip, itinerary, tripMeta }) {
  if (!itinerary || !itinerary.items || !trip.startDate || !trip.endDate) return null;
  const items = itinerary.items;
  const dates = tripDateRange(trip.startDate, trip.endDate);
  if (dates.length < 2) return null;
  const notices = [];
  const out = tripMeta?.outboundMode || '';
  const ret = tripMeta?.returnMode || '';

  if (!SELF_TRANSPORT.has(out)) {
    const arrDay = dates[0];
    if (!items.some(i => i.date === arrDay && TRANSPORT_TYPES_SET.has(i.type)))
      notices.push({ icon:'✈', date: arrDay, msg:'No arrival transport planned' });
  }
  if (!SELF_TRANSPORT.has(ret)) {
    const depDay = dates[dates.length-1];
    if (!items.some(i => i.date === depDay && TRANSPORT_TYPES_SET.has(i.type)))
      notices.push({ icon:'✈', date: depDay, msg:'No departure transport planned' });
  }
  for (const date of dates.slice(1, -1)) {
    const has = items.some(i => {
      if (!HOTEL_TYPES_SET.has(i.type)) return false;
      if (i.date === date) return true;
      try {
        const m = JSON.parse(i.metadata||'{}');
        return m.checkoutDate && i.date <= date && m.checkoutDate > date;
      } catch(e) { return false; }
    });
    if (!has) notices.push({ icon:'🏨', date, msg:'No accommodation planned' });
  }
  if (!notices.length) return null;
  return (
    <div style={{background:'#0a1628',border:'1px solid #1e3a5a',borderRadius:8,
      padding:'11px 14px',marginBottom:12}}>
      <div style={{fontWeight:600,color:'#8ab4f8',fontSize:12,marginBottom:6}}>💡 VERA Notices</div>
      {notices.map((n,i) => {
        const label = new Date(n.date+'T12:00:00').toLocaleDateString('en-US',{weekday:'long',month:'long',day:'numeric'});
        return (
          <div key={i} style={{fontSize:12,color:'#e05a5a',display:'flex',gap:6,marginBottom:3}}>
            <span>{n.icon}</span><span>{label}: {n.msg}</span>
          </div>
        );
      })}
    </div>
  );
}

function SummaryLitePanel({ trip, itinerary, travelerFilter }) {
  const allItems = itinerary?.items || [];

    if (travelerFilter === 'Both') return true;
    try { const m=JSON.parse(item.metadata||'{}'); const tv=m.traveler||'Both'; return tv==='Both'||tv===travelerFilter; }
    catch(e) { return true; }
  });
  const dates = (trip.startDate && trip.endDate) ? tripDateRange(trip.startDate, trip.endDate) : [];
  const byDate = {};
  items.forEach(item => {
    const d = item.date || '_undated';
    if (!byDate[d]) byDate[d] = [];
    byDate[d].push(item);
  });

    <div style={{paddingTop:8}}>
      {dates.map((date, idx) => {
        const dayItems = (byDate[date]||[]).sort((a,b)=>(a.startTime||'').localeCompare(b.startTime||''));

function PackingLitePanel({ tripKey, packingData, apiUrl, apiToken, onReload }) {
  const [personFilter, setPersonFilter] = useState('all');
  const [adding, setAdding]     = useState(false);
  const [newPerson, setNewPerson]   = useState('shared');
  const [newCat, setNewCat]     = useState('Clothing');
  const [newItem, setNewItem]   = useState('');
  const [generating, setGenerating] = useState(false);
  const [packBusy, setPackBusy] = useState(false);

  if (!packingData || packingData === 'loading') {
    return <div style={{textAlign:'center',color:'#6b7fa8',padding:'24px',fontSize:13}}>Loading packing list…</div>;
  }
  const allItems = packingData.items || [];
  const filtered = personFilter==='all' ? allItems : allItems.filter(i=>i.person===personFilter);
  const byCategory = {};
  filtered.forEach(item => {
    const cat = item.category || 'Other';
    if (!byCategory[cat]) byCategory[cat] = [];
    byCategory[cat].push(item);
  });
  const checkedCount = allItems.filter(i=>i.checked).length;

  async function toggleItem(id, checked) {
    setPackBusy(true);
    try { await apiGet(apiUrl,apiToken,{action:'update_packing_item',id,checked:String(checked)}); await onReload(); }
    catch(e) {} finally { setPackBusy(false); }
  }
  async function deleteItem(id) {
    setPackBusy(true);
    try { await apiGet(apiUrl,apiToken,{action:'delete_packing_item',id}); await onReload(); }
    catch(e) {} finally { setPackBusy(false); }
  }
  async function addItem() {
    if (!newItem.trim()) return;
    setPackBusy(true);
    try {
      await apiGet(apiUrl,apiToken,{action:'add_packing_item',tripKey,person:newPerson,category:newCat,item:newItem.trim()});
      setNewItem(''); setAdding(false); await onReload();
    } catch(e) {} finally { setPackBusy(false); }
  }
  async function generatePacking() {
    if (!window.confirm('Generate AI packing list? Existing AI suggestions will be replaced.')) return;
    setGenerating(true);
    try {
      const startDate = tripKey.split('|')[0];
      await apiGet(apiUrl,apiToken,{action:'generate_packing',tripKey,startDate});
      await onReload();
    } catch(e) {} finally { setGenerating(false); }
  }

  const personTabs=[{id:'all',label:'All',color:'#8ab4f8'},{id:'ahmed',label:'Ahmed',color:'#5c9eff'},
    {id:'victoria',label:'Victoria',color:'#b87cff'},{id:'shared',label:'Shared',color:'#56cc9d'}];

  return (
    <div style={{paddingTop:8}}>
      <div style={{display:'flex',gap:6,alignItems:'center',flexWrap:'wrap',marginBottom:10}}>
        <div style={{display:'flex',gap:4,flex:1,flexWrap:'wrap'}}>
          {personTabs.map(p => (
            <button key={p.id} onClick={()=>setPersonFilter(p.id)}
              style={{padding:'4px 9px',borderRadius:6,fontSize:11,fontWeight:600,cursor:'pointer',
                border: personFilter===p.id?`1px solid ${p.color}`:'1px solid #2a3a50',
                background: personFilter===p.id?`${p.color}22`:'#0d1117',
                color: personFilter===p.id?p.color:'#6b7fa8'}}>
              {p.label}
            </button>
          ))}
        </div>
        <span style={{fontSize:11,color:'#4d6080'}}>{checkedCount}/{allItems.length} packed</span>
        <button onClick={generatePacking} disabled={generating}
          style={{padding:'4px 9px',borderRadius:6,fontSize:11,cursor:'pointer',
            background:'#0d1a10',border:'1px solid #2a6040',color:'#56cc9d',
            opacity:generating?0.6:1,whiteSpace:'nowrap'}}>
          {generating?'⏳':'✨ Generate'}
        </button>
        <button onClick={()=>setAdding(a=>!a)}
          style={{padding:'4px 9px',borderRadius:6,fontSize:11,cursor:'pointer',
            background:'#0d2040',border:'1px solid #3d6fa0',color:'#5c9eff'}}>
          + Add
        </button>
      </div>

      {adding && (
        <div style={{background:'#0a1628',border:'1px solid #1e3050',borderRadius:8,padding:'10px',marginBottom:10}}>
          <div style={{display:'flex',gap:6,flexWrap:'wrap',marginBottom:6}}>
            <select value={newPerson} onChange={e=>setNewPerson(e.target.value)}
              style={{fontSize:12,background:'#0d1b3e',color:'#c8d4e8',border:'1px solid #2a3a50',borderRadius:6,padding:'4px 6px'}}>
              <option value="ahmed">Ahmed</option><option value="victoria">Victoria</option><option value="shared">Shared</option>
            </select>
            <select value={newCat} onChange={e=>setNewCat(e.target.value)}
              style={{fontSize:12,background:'#0d1b3e',color:'#c8d4e8',border:'1px solid #2a3a50',borderRadius:6,padding:'4px 6px'}}>
              {Object.keys(PACK_CAT_ICON).map(c=><option key={c} value={c}>{c}</option>)}
            </select>
          </div>
          <div style={{display:'flex',gap:6}}>
            <input value={newItem} onChange={e=>setNewItem(e.target.value)} placeholder="Item name…"
              onKeyDown={e=>{if(e.key==='Enter')addItem();if(e.key==='Escape')setAdding(false);}}
              style={{flex:1,fontSize:12,background:'#0d1b3e',color:'#c8d4e8',border:'1px solid #2a3a50',borderRadius:6,padding:'5px 8px'}} />
            <button onClick={addItem} disabled={packBusy||!newItem.trim()}

            <button onClick={()=>setAdding(false)}

              padding:'4px 2px',borderBottom:'1px solid #0a1628'}}>

              <span style={{flex:1,fontSize:12,
                color:item.checked?'#4d6080':'#c8d4e8',
                textDecoration:item.checked?'line-through':'none'}}>
                {item.item}
              </span>
              {item.source==='ai'&&<span style={{fontSize:9,color:'#4d6080'}}>ai</span>}
              <button onClick={()=>deleteItem(item.id)}
                style={{background:'none',border:'none',color:'#4d6080',cursor:'pointer',fontSize:12,padding:'0 2px'}}>🗑</button>
            </div>
          ))}
        </div>
      ))}

      {filtered.length===0&&(
        <div style={{textAlign:'center',color:'#4d6080',padding:'24px 0',fontSize:12,fontStyle:'italic'}}>
          No items yet — use ✨ Generate for AI suggestions or + Add manually.
        </div>
      )}
    </div>
  );
}

// --- ItineraryDayView --------------------------------------------------------
function ItineraryDayView({ trip, itinerary, busy, onAdd, onEdit, onDelete }) {
  const items = itinerary?.items || [];
  const byDate = {};
  items.forEach(item => {
    const d = item.date || '_undated';
    if (!byDate[d]) byDate[d] = [];
    byDate[d].push(item);
  });

  // Generate all dates in the trip range so days show even with no items
  let dates = [];
  if (trip.startDate && trip.endDate) {
    const cur = new Date(trip.startDate + 'T12:00:00');
    const end = new Date(trip.endDate + 'T12:00:00');
    while (cur <= end) {
      dates.push(cur.toISOString().slice(0, 10));
      cur.setDate(cur.getDate() + 1);
    }
    Object.keys(byDate).forEach(d => {
      if (d !== '_undated' && !dates.includes(d)) dates.push(d);
    });
    dates.sort();
  } else {
    dates = Object.keys(byDate).filter(d => d !== '_undated').sort();
  }
  if (byDate['_undated']) dates.push('_undated');

  return (
    <div style={{paddingTop:8}}>
      <button onClick={onAdd}
        style={{margin:'0 0 12px 0',padding:'6px 14px',background:'#0d2040',border:'1px solid #3d6fa0',
          borderRadius:7,color:'#5c9eff',fontSize:13,fontWeight:600,cursor:'pointer',width:'100%'}}>
        + Add Itinerary Item
      </button>
      {dates.length === 0 && (
        <div style={{textAlign:'center',color:'#4d6080',padding:'24px 0',fontSize:13}}>
          No itinerary items yet.
        </div>
      )}
      {dates.map((date, idx) => {
        const dayItems = byDate[date] || [];
        const dayNum = date === '_undated' ? '' : idx + 1;
        return (
          <div key={date} style={{marginBottom:12}}>
            <div style={{fontSize:12,fontWeight:700,color:'#8ab4f8',padding:'6px 8px',
              background:'#0a1628',borderRadius:6,marginBottom:4,letterSpacing:'0.03em'}}>
              {fmtDayHeader(date, dayNum)}
            </div>
            {dayItems.length === 0 ? (
              <div style={{textAlign:'center',color:'#4d6080',padding:'10px 0',
                fontSize:12,fontStyle:'italic'}}>No events scheduled</div>
            ) : (
              dayItems.map(item => (
                <ItinItemRow key={item.id} item={item}
                  onEdit={() => onEdit(item)}
                  onDelete={() => onDelete(item.id)} />
              ))
            )}
          </div>
        );
      })}
    </div>
  );
}
