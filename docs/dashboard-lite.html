// Routine chores only: quarterly, seasonal and yearly ones are upkeep, listed by date under them (HfUpkeep).
const CADENCES = ['Daily', 'Weekly', 'Biweekly', 'Monthly', 'Bimonthly'];

const CADENCE_META = {
  Daily:      { label: '☀️ Daily',      reset: 'Resets nightly'                    },
  Weekly:     { label: '📅 Weekly',     reset: 'Resets every Friday'               },
  Biweekly:   { label: '🗓️ Biweekly',  reset: 'Resets every other Friday'         },
  Monthly:    { label: '📆 Monthly',    reset: 'Resets last day of month'          },
  Bimonthly:  { label: '🔄 Bimonthly', reset: 'Resets every other month'          },
  Quarterly:  { label: '📊 Quarterly', reset: 'Resets end of each quarter'        },
  Annually:   { label: '🏆 Annually',  reset: 'Resets Dec 31'                     },
  Seasonal:   { label: '🌿 Seasonal',  reset: 'No auto-reset'                     },
};

function ChoresView({ chores, loading, busy, onToggle, onAdd, onDelete, onUpdateCadence }) {
  const [expanded,    setExpanded]    = React.useState({ Daily: true, Weekly: true, Biweekly: true, Monthly: true, Bimonthly: true, Quarterly: true, Annually: true, Seasonal: true });
  const [addCadence,  setAddCadence]  = React.useState(null);
  const [addText,     setAddText]     = React.useState('');
  const [dragId,      setDragId]      = React.useState(null);
  const [dragOverCad, setDragOverCad] = React.useState(null);

  if (loading) return <div style={{ fontSize: 13, color: '#6b7fa8', padding: 16 }}>Loading chores…</div>;

  const byCategory = {};
  CADENCES.forEach(function(c) { byCategory[c] = []; });
  (chores || []).forEach(function(ch) {
    var cat = ch.Cadence || 'Daily';
    if (!byCategory[cat]) byCategory[cat] = [];
    byCategory[cat].push(ch);
  });

  const total   = (chores || []).length;
  const done    = (chores || []).filter(function(c) { return c.Checked === true || c.Checked === 'TRUE'; }).length;
  const pct     = total ? Math.round((done / total) * 100) : 0;

  function handleDrop(cadence) {
    if (dragId) {
      onUpdateCadence(dragId, cadence);
    }
    setDragId(null);
    setDragOverCad(null);
  }

  async function submitAdd(cadence) {
    const text = addText.trim();
    if (!text) return;
    setAddText('');
    setAddCadence(null);
    await onAdd(text, cadence);
  }

  const inputStyle = {
    flex: 1, padding: '5px 9px', borderRadius: 6, background: '#0a1628',
    border: '1px solid #1e3060', color: '#dde1f0', fontSize: 13,
  };

  return (
    <div>
      {total > 0 && (
        <div style={{ marginBottom: 16 }}>
          <div style={{ display: 'flex', justifyContent: 'space-between', fontSize: 12, color: '#6b7fa8', marginBottom: 4 }}>
            <span>{done}/{total} chores done today</span>
            <span>{pct}%</span>
          </div>
          <div style={{ height: 6, background: '#0e1e3a', borderRadius: 3, overflow: 'hidden' }}>
            <div style={{ width: pct + '%', height: '100%', background: pct === 100 ? '#2ecc71' : '#3a7bd5', borderRadius: 3, transition: 'width 0.3s' }} />
          </div>
        </div>
      )}

      {CADENCES.map(function(cadence) {
        const items   = byCategory[cadence] || [];
        const isOpen  = !!expanded[cadence];
        const isOver  = dragOverCad === cadence;
        const cadDone = items.filter(function(c) { return c.Checked === true || c.Checked === 'TRUE'; }).length;
        const meta    = CADENCE_META[cadence];

        return (
          <div key={cadence}
            style={{ marginBottom: 10, border: isOver ? '1px dashed #3a7bd5' : '1px solid #1e3060',
                     borderRadius: 8, background: '#0e1e3a', transition: 'border 0.15s' }}
            onDragOver={function(e) { e.preventDefault(); setDragOverCad(cadence); }}
            onDragLeave={function() { if (dragOverCad === cadence) setDragOverCad(null); }}
            onDrop={function(e) { e.preventDefault(); handleDrop(cadence); }}
          >
            <div style={{ display: 'flex', alignItems: 'center', padding: '9px 14px', cursor: 'pointer', userSelect: 'none' }}
              onClick={function() { setExpanded(function(prev) { return Object.assign({}, prev, { [cadence]: !prev[cadence] }); }); }}>
              <span style={{ fontSize: 13, fontWeight: 600, color: '#dde1f0', flex: 1 }}>
                {isOpen ? '▾' : '▸'} {meta.label}
                <span style={{ fontSize: 11, color: '#4d6080', fontWeight: 400, marginLeft: 8 }}>
                  {cadDone}/{items.length} · {meta.reset}
                </span>
              </span>
              <button className="btn btn-ghost" style={{ fontSize: 11, padding: '2px 8px' }}
                disabled={busy}
                onClick={function(e) { e.stopPropagation(); setAddText(''); setAddCadence(cadence); }}>
                ＋ Add
              </button>
            </div>

            {isOpen && (
              <div style={{ padding: '0 14px 10px' }}>
                {items.length === 0 && addCadence !== cadence && (
                  <div style={{ fontSize: 12, color: '#4d6080', marginBottom: 4 }}>No chores yet. Click ＋ Add to get started.</div>
                )}
                {items.map(function(ch) {
                  const checked = ch.Checked === true || ch.Checked === 'TRUE';
                  return (
                    <div key={ch.ID}
                      draggable
                      onDragStart={function() { setDragId(ch.ID); }}
                      onDragEnd={function() { setDragId(null); setDragOverCad(null); }}
                      style={{ display: 'flex', alignItems: 'center', padding: '5px 0',
                               borderBottom: '1px solid #0a1628', opacity: checked ? 0.55 : 1,
                               cursor: 'grab' }}>
                      <span style={{ marginRight: 8, cursor: 'default', color: '#4d6080', fontSize: 12 }}>⠿</span>
                      <input type="checkbox" checked={checked} style={{ marginRight: 10, cursor: 'pointer' }}
                        onChange={function() { onToggle(ch.ID, !checked); }} />
                      <span style={{ flex: 1, fontSize: 13, color: checked ? '#4d6080' : '#dde1f0',
                                     textDecoration: checked ? 'line-through' : 'none' }}>
                        {ch.Chore}
                      </span>
                      <button className="btn btn-ghost" style={{ fontSize: 11, color: '#c0392b', padding: '1px 6px', marginLeft: 6 }}
                        disabled={busy} onClick={function() { onDelete(ch.ID); }}>✕</button>
                    </div>
                  );
                })}

                {addCadence === cadence && (
                  <div style={{ display: 'flex', gap: 6, marginTop: 8 }}>
                    <input style={inputStyle} autoFocus placeholder={'Add ' + cadence.toLowerCase() + ' chore…'}
                      value={addText}
                      onChange={function(e) { setAddText(e.target.value); }}
                      onKeyDown={function(e) { if (e.key === 'Enter') submitAdd(cadence); if (e.key === 'Escape') setAddCadence(null); }} />
                    <button className="btn btn-primary" style={{ fontSize: 12, padding: '5px 12px' }}
                      disabled={busy || !addText.trim()} onClick={function() { submitAdd(cadence); }}>＋</button>
                    <button className="btn btn-ghost" style={{ fontSize: 12 }}
                      onClick={function() { setAddCadence(null); setAddText(''); }}>✕</button>
                  </div>
                )}
              </div>
            )}
          </div>
        );
      })}
    </div>
  );
}

function ChoreForOthersModal({ chore, onSave, onClose, busy }) {
  const editing = !!chore;
  const [task,     setTask]     = React.useState(chore ? chore.Task : '');
  const [assignee, setAssignee] = React.useState(chore ? chore.Assignee : '');
  const [reward,   setReward]   = React.useState(chore ? chore.Reward : '');
  const [notes,    setNotes]    = React.useState(chore ? chore.Notes : '');

  function handleSave() {
    if (!task.trim()) return;
    onSave({ task: task.trim(), assignee: assignee.trim(), reward: reward.trim(), notes: notes.trim() });
  }

  const inputStyle = {
    width: '100%', background: '#07122b', border: '1px solid #1e3060', borderRadius: 6,
    padding: '8px 12px', color: '#dde1f0', fontSize: 13, boxSizing: 'border-box', marginBottom: 14,
  };

  return (
    <div style={{ position: 'fixed', inset: 0, background: 'rgba(0,0,0,0.6)', display: 'flex', alignItems: 'center', justifyContent: 'center', zIndex: 1000 }}>
      <div style={{ background: '#0d1b3e', border: '1px solid #1e3060', borderRadius: 12, padding: 28, width: 420, maxWidth: '95vw' }}>
        <div style={{ fontSize: 16, fontWeight: 700, color: '#dde1f0', marginBottom: 20 }}>{editing ? 'Edit Chore' : 'Assign Chore'}</div>

        <label style={{ fontSize: 12, color: '#8a9abf', display: 'block', marginBottom: 4 }}>Task *</label>
        <input autoFocus value={task} onChange={e => setTask(e.target.value)} placeholder="e.g. Mow the front lawn" style={inputStyle} />

        <label style={{ fontSize: 12, color: '#8a9abf', display: 'block', marginBottom: 4 }}>Assignee</label>
        <input value={assignee} onChange={e => setAssignee(e.target.value)} placeholder="e.g. Jake next door" style={inputStyle} />

        <label style={{ fontSize: 12, color: '#8a9abf', display: 'block', marginBottom: 4 }}>Reward <span style={{ color: '#6b7fa8' }}>(optional)</span></label>
        <input value={reward} onChange={e => setReward(e.target.value)} placeholder="e.g. $10 or Pizza" style={inputStyle} />

        <label style={{ fontSize: 12, color: '#8a9abf', display: 'block', marginBottom: 4 }}>Notes <span style={{ color: '#6b7fa8' }}>(optional)</span></label>
        <input value={notes} onChange={e => setNotes(e.target.value)} placeholder="Any details…" style={inputStyle} />

        <div style={{ display: 'flex', gap: 10, justifyContent: 'flex-end' }}>
          <button className="btn" onClick={onClose} disabled={busy}>Cancel</button>
          <button className="btn btn-primary" onClick={handleSave} disabled={busy || !task.trim()}>{editing ? 'Save' : 'Assign'}</button>
        </div>
      </div>
    </div>
  );
}

function ChoresForOthersView({ chores, loading, busy, onAdd, onComplete, onEdit, onDelete }) {
  const [modal,    setModal]    = React.useState(null); // null | { mode:'add' } | { mode:'edit', chore }
  const [showDone, setShowDone] = React.useState(false);

  if (loading) return <div style={{ fontSize: 13, color: '#6b7fa8', padding: 16 }}>Loading…</div>;

  const open = (chores || []).filter(function(c) { return c.Status !== 'Done'; });
  const done = (chores || []).filter(function(c) { return c.Status === 'Done'; });

  function avatarColor(name) {
    const colors = ['#1565c0', '#6a1b9a', '#ad1457', '#00695c', '#e65100', '#4527a0'];
    var code = 0;
    for (var i = 0; i < (name || '').length; i++) code += name.charCodeAt(i);
    return colors[code % colors.length];
  }

  function renderCard(c) {
    const initials = (c.Assignee || '?').trim().split(' ').map(function(w) { return w[0]; }).join('').slice(0, 2).toUpperCase();
    const bg = avatarColor(c.Assignee);
    return (
      <div key={c.ID} style={{ display: 'flex', alignItems: 'center', gap: 12, padding: '12px 14px', borderRadius: 8, background: '#0d1b3e', border: '1px solid #1e3060' }}>
        <div style={{ width: 34, height: 34, borderRadius: '50%', background: bg, display: 'flex', alignItems: 'center', justifyContent: 'center', fontSize: 12, fontWeight: 700, color: '#fff', flexShrink: 0 }}>{initials}</div>
        <div style={{ flex: 1, minWidth: 0 }}>
          <div style={{ fontSize: 14, color: '#dde1f0', fontWeight: 500 }}>{c.Task}</div>
          {c.Assignee && <div style={{ fontSize: 11, color: '#6b7fa8', marginTop: 2 }}>{c.Assignee}</div>}
        </div>
        {c.Reward && <span style={{ background: 'rgba(201,168,76,0.15)', color: '#c9a84c', borderRadius: 20, padding: '2px 9px', fontSize: 11, fontWeight: 700, flexShrink: 0 }}>{c.Reward}</span>}
        <button className="btn btn-primary" style={{ fontSize: 11, padding: '4px 10px', flexShrink: 0 }} disabled={busy} onClick={function() { onComplete && onComplete(c.ID); }} title="Mark done">✓ Done</button>
        <button className="btn btn-ghost" style={{ fontSize: 13 }} disabled={busy} onClick={function() { setModal({ mode: 'edit', chore: c }); }} title="Edit">✏️</button>
        <button className="btn btn-ghost" style={{ fontSize: 13, opacity: 0.7 }} disabled={busy} onClick={function() { onDelete && onDelete(c.ID); }} title="Delete">🗑️</button>
      </div>
    );
  }

  return (
    <div>
      <div style={{ display: 'flex', alignItems: 'center', justifyContent: 'space-between', marginBottom: 16 }}>
        <span style={{ fontSize: 12, color: '#6b7fa8' }}>{open.length} open · {done.length} completed</span>
        <button className="btn btn-primary" style={{ fontSize: 12 }} disabled={busy} onClick={function() { setModal({ mode: 'add' }); }}>+ Assign Chore</button>
      </div>

      {open.length === 0 ? (
        <div className="empty-state">
          <div style={{ fontSize: 28, marginBottom: 10 }}>🧹</div>
          <div>No open chores — assign one with the button above.</div>
        </div>
      ) : (
        <div style={{ display: 'flex', flexDirection: 'column', gap: 8 }}>{open.map(renderCard)}</div>
      )}

      {done.length > 0 && (
        <div style={{ marginTop: 28 }}>
          <button onClick={function() { setShowDone(function(v) { return !v; }); }} style={{ background: 'none', border: 'none', cursor: 'pointer', color: '#6b7fa8', fontSize: 12, fontWeight: 600, display: 'flex', alignItems: 'center', gap: 6, padding: 0 }}>
            <span style={{ fontSize: 10 }}>{showDone ? '▼' : '▶'}</span>Completed ({done.length})
          </button>
          {showDone && (
            <div style={{ marginTop: 10, display: 'flex', flexDirection: 'column', gap: 6 }}>
              {done.map(function(c) {
                return (
                  <div key={c.ID} style={{ display: 'flex', alignItems: 'center', gap: 12, padding: '10px 14px', borderRadius: 8, background: 'rgba(67,160,71,0.05)', border: '1px solid rgba(67,160,71,0.15)' }}>
                    <span style={{ fontSize: 13, color: '#4a5a7a', textDecoration: 'line-through', flex: 1 }}>{c.Task}</span>
                    {c.Assignee && <span style={{ fontSize: 11, color: '#4a5a7a' }}>{c.Assignee}</span>}
                    {c.Reward && <span style={{ fontSize: 11, color: '#6b7fa8' }}>{c.Reward}</span>}
                    <span style={{ fontSize: 11, color: '#43a047', fontWeight: 700 }}>✓</span>
                    <button className="btn btn-ghost" style={{ fontSize: 13, opacity: 0.7 }} disabled={busy} onClick={function() { onDelete && onDelete(c.ID); }} title="Delete">🗑️</button>
                  </div>
                );
              })}
            </div>
          )}
        </div>
      )}

      {modal && (
        <ChoreForOthersModal
          chore={modal.mode === 'edit' ? modal.chore : null}
          busy={busy}
          onClose={function() { setModal(null); }}
          onSave={function(fields) {
            if (modal.mode === 'edit') { onEdit && onEdit(modal.chore.ID, fields); }
            else { onAdd && onAdd(fields); }
            setModal(null);
          }}
        />
      )}
    </div>
  );
}

function GuestsView({ apiUrl, apiToken }) {
  const [guests,  setGuests]  = React.useState(null);
  const [error,   setError]   = React.useState(null);

  React.useEffect(() => {
    if (!apiUrl || !apiToken) return;
    apiGet(apiUrl, apiToken, { action: 'get_guests' })
      .then(data => setGuests(data.guests || []))
      .catch(err => { setError(err.message); setGuests([]); });
  }, [apiUrl, apiToken]);

  if (guests === null) {
    return <div style={{ fontSize: 13, color: '#6b7fa8', padding: 16 }}>Loading guests…</div>;
  }

  if (error) {
    return <div style={{ fontSize: 13, color: '#f87171', padding: 16 }}>Error: {error}</div>;
  }

  if (!guests.length) {
    return (
      <div className="empty-state" style={{ padding: 40 }}>
        <div style={{ fontSize: 32, marginBottom: 12 }}>👥</div>
        <div>No upcoming guest windows found.</div>
        <div style={{ fontSize: 13, color: '#6b7fa8', marginTop: 8 }}>
          Add multi-day events to AE&amp;VV - Our Joint Chaos calendar with keywords like Visit, Staying, or Guests.
        </div>
      </div>
    );
  }

  return (
    <div style={{ display: 'flex', flexDirection: 'column', gap: 12 }}>
      {guests.map((g, i) => {
        const isStaying  = g.daysAway < 0;
        const isToday    = g.daysAway === 0;
        const isSoon     = g.daysAway >= 0 && g.daysAway <= 7;

        let badgeColor = '#2a3a5e';
        let badgeText  = 'In ' + g.daysAway + ' days';
        if (isStaying || isToday) {
          badgeColor = '#1a4a2e';
          badgeText  = isToday ? '🟢 Arriving today' : '🟢 Currently staying';
        } else if (isSoon) {
          badgeColor = '#3a3010';
          badgeText  = g.daysAway === 1 ? '🟡 Arriving tomorrow' : '🟡 Arriving in ' + g.daysAway + ' days';
        }

        return (
          <div key={i} style={{
            background: '#13244d', border: '1px solid #1e3060',
            borderRadius: 10, padding: '16px 20px',
          }}>
            <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'flex-start', flexWrap: 'wrap', gap: 8 }}>
              <div style={{ fontWeight: 700, fontSize: 15, color: '#dde1f0' }}>{g.label}</div>
              <span style={{
                fontSize: 11, fontWeight: 700, padding: '3px 10px',
                borderRadius: 20, background: badgeColor, color: '#dde1f0',
                whiteSpace: 'nowrap',
              }}>{badgeText}</span>
            </div>
            <div style={{ fontSize: 13, color: '#8a9abf', marginTop: 8 }}>
              <span>{g.arrivalDate} – {g.departureDate}</span>
              <span style={{ margin: '0 8px', color: '#2a3a5e' }}>·</span>
              <span>{g.durationDays} day{g.durationDays === 1 ? '' : 's'}</span>
            </div>
            <div style={{ fontSize: 11, color: '#4d6080', marginTop: 4 }}>{g.calendarName}</div>
          </div>
        );
      })}
    </div>
  );
}

function vehicleStatusDot(days, yellowDays, redDays) {
  if (days === null || days === undefined) return null;
  if (days < 0)          return <span style={{color:'#f87171',fontWeight:700}}>🔴</span>;
  if (days <= yellowDays) return <span style={{color:'#fbbf24',fontWeight:700}}>🟡</span>;
  return <span style={{color:'#4ade80'}}>🟢</span>;
}

function oilStatusDot(mi) {
  if (mi === null || mi === undefined) return null;
  if (mi < 0)    return <span style={{color:'#f87171',fontWeight:700}}>🔴</span>;
  if (mi <= 500) return <span style={{color:'#fbbf24',fontWeight:700}}>🟡</span>;
  return <span style={{color:'#4ade80'}}>🟢</span>;
}

function tireStatusDot(mi) {
  if (mi === null || mi === undefined) return null;
  if (mi < 0)     return <span style={{color:'#f87171',fontWeight:700}}>🔴</span>;
  if (mi <= 3000) return <span style={{color:'#fbbf24',fontWeight:700}}>🟡</span>;
  return <span style={{color:'#4ade80'}}>🟢</span>;
}

function fmtVehicleDate(val) {
  if (!val) return '—';
  const d = new Date(val);
  if (isNaN(d)) return String(val);
  return d.toLocaleDateString('en-US', { month:'short', day:'numeric', year:'numeric' });
}

}

function MealPlanSubTab({ apiUrl, apiToken }) {
  const DAYS      = ['Mon','Tue','Wed','Thu','Fri','Sat','Sun'];
  const TYPE_COLORS = {
    'Home Cooked': { bg:'rgba(102,187,106,.12)', color:'#66bb6a', border:'rgba(102,187,106,.3)' },
    'Leftovers':   { bg:'rgba(107,127,168,.12)', color:'#7e9ab8', border:'rgba(107,127,168,.3)' },
    'Takeout':     { bg:'rgba(66,165,245,.12)',  color:'#42a5f5', border:'rgba(66,165,245,.3)'  },
    'Eating Out':  { bg:'rgba(126,87,194,.12)',  color:'#9575cd', border:'rgba(126,87,194,.3)'  },
  };
  const STATUS_COLORS = {
    'Planned': { color:'#6b7fa8' },
    'Cooked':  { color:'#66bb6a' },
    'Skipped': { color:'#ef5350' },
  };

  const [weeks,      setWeeks]      = React.useState([]);
  const [loading,    setLoading]    = React.useState(false);
  const [suggesting, setSuggesting] = React.useState(null);   // weekStart being suggested
  const [editKey,    setEditKey]    = React.useState(null);   // 'weekStart|Day'
  const [editVal,    setEditVal]    = React.useState({ mealName:'', type:'Home Cooked' });
  const [moving,     setMoving]     = React.useState(null);   // { weekStart, day, mealName }
  const [showPast,   setShowPast]   = React.useState(false);
  const [busy,       setBusy]       = React.useState(false);
  const [error,      setError]      = React.useState(null);

  // Local midnight as yyyy-MM-dd. Compared as strings against the row dates, which is
  // sound for ISO dates and avoids building Date objects per row per render.
  const todayIso = React.useMemo(function() {
    var d = new Date(), p = function(n) { return String(n).padStart(2,'0'); };
    return d.getFullYear() + '-' + p(d.getMonth()+1) + '-' + p(d.getDate());
  }, []);

  const slotKey = function(weekStart, day) { return weekStart + '|' + day; };

  // The date of a day WITHOUT needing a row for it. Empty days have no row to carry a
  // date now that the tab holds only real dinners, and a day with no date reads as a
  // placeholder rather than as Thursday the 15th.
  function dateFor(weekStart, day) {
    try {
      var d = new Date(weekStart + 'T00:00:00');
      d.setDate(d.getDate() + DAYS.indexOf(day));
      var p = function(n) { return String(n).padStart(2,'0'); };
      return d.getFullYear() + '-' + p(d.getMonth()+1) + '-' + p(d.getDate());
    } catch(e) { return ''; }
  }
  function shortDate(iso) {
    try { return new Date(iso + 'T00:00:00').toLocaleDateString('en-US',{ month:'short', day:'numeric' }); }
    catch(e) { return iso; }
  }

  function load() {
    if (!apiUrl || !apiToken) return;
    setLoading(true);
    apiGet(apiUrl, apiToken, { action:'meal_plan', weeks:2 })
      .then(function(r) {
        if (r.ok) { setWeeks(r.weeks || []); setError(null); }
        else setError(r.error || 'Load failed');
      })
      .catch(function(e) { setError(e.message); })
      .finally(function() { setLoading(false); });
  }

  React.useEffect(load, [apiUrl, apiToken]);

  // Every write goes through here, so no failure can be silent again. The planner
  // looked broken for weeks partly because `if (r.ok) load()` had no else: a rejected
  // write and a successful one were indistinguishable on screen.
  function send(params, done) {
    setBusy(true);
    apiGet(apiUrl, apiToken, params)
      .then(function(r) {
        if (r.ok) { setError(null); load(); }
        else setError(r.error || (params.action + ' failed'));
      })
      .catch(function(e) { setError(e.message); })
      .finally(function() { setBusy(false); if (done) done(); });
  }

  function suggestWeek(weekStart) {
    setSuggesting(weekStart);
    // weekStart is passed explicitly: without it the backend defaults to the CURRENT
    // week, so "Suggest Week" on next week silently filled this one.
    apiGet(apiUrl, apiToken, { action:'suggest_meals', weekStart:weekStart })
      .then(function(r) { if (r.ok) { setError(null); load(); } else setError(r.error || 'Suggest failed'); })
      .catch(function(e) { setError(e.message); })
      .finally(function() { setSuggesting(null); });
  }

  function openEdit(weekStart, day, entry) {
    setMoving(null);
    setEditVal({ mealName: (entry && entry.mealName) || '', type: (entry && entry.type) || 'Home Cooked' });
    setEditKey(slotKey(weekStart, day));
  }
  function saveEdit(weekStart, day) {
    if (!editVal.mealName.trim()) { setEditKey(null); return; }
    send({ action:'set_meal', day:day, weekStart:weekStart,
           mealName:editVal.mealName.trim(), type:editVal.type }, function() { setEditKey(null); });
  }
  function updateStatus(weekStart, day, status) {
    send({ action:'update_meal_status', day:day, weekStart:weekStart, status:status });
  }

  // ---- Move: tap to pick up, tap to drop ----------------------------------
  // Not HTML5 drag-and-drop. `draggable` fires no events on touch, so the Chores
  // pattern would do nothing at all on a phone, which is where this planner is read.
  function pickUp(weekStart, day, entry) {
    setEditKey(null);
    setMoving({ weekStart:weekStart, day:day, mealName:entry.mealName });
  }
  function dropOn(weekStart, day) {
    if (!moving) return;
    if (moving.weekStart === weekStart && moving.day === day) { setMoving(null); return; }
    send({ action:'move_meal', fromWeekStart:moving.weekStart, fromDay:moving.day,
           toWeekStart:weekStart, toDay:day }, function() { setMoving(null); });
  }

  if (loading && !weeks.length) {
    return <div style={{ fontSize:13, color:'#6b7fa8', padding:16 }}>Loading meal plan…</div>;
  }

  function weekLabel(weekStart, idx) {
    var end = dateFor(weekStart, 'Sun');
    return (idx === 0 ? 'This week' : idx === 1 ? 'Next week' : 'Week of ' + shortDate(weekStart)) +
           ' · ' + shortDate(weekStart) + ' – ' + shortDate(end);
  }

  return (
    <div className="mp-root">
      {error && <div className="mp-error" style={{ color:'#ef5350', fontSize:13, marginBottom:10 }}>{error}</div>}

      {moving && (
        <div className="mp-moving-bar" style={{
          position:'sticky', top:0, zIndex:5, marginBottom:10, padding:'9px 12px', borderRadius:8,
          background:'rgba(201,168,76,.14)', border:'1px solid rgba(201,168,76,.45)',
          display:'flex', alignItems:'center', gap:10, flexWrap:'wrap' }}>
          <span style={{ fontSize:13, color:'#c9a84c', fontWeight:600, flex:1 }}>
            Moving “{moving.mealName}” — tap any day to drop it
          </span>
          <button className="mp-cancel-move" onClick={function(){ setMoving(null); }}
            style={{ background:'none', border:'1px solid rgba(107,127,168,.3)', color:'#6b7fa8',
                     borderRadius:6, padding:'4px 12px', fontSize:12, cursor:'pointer' }}>Cancel</button>
        </div>
      )}

      {weeks.map(function(wk, wi) {
        var days = wk.days || [];
        var pastDays = wi === 0
          ? DAYS.filter(function(d) { return dateFor(wk.weekStart, d) < todayIso; })
          : [];
        var visibleDays = DAYS.filter(function(d) {
          return !(wi === 0 && !showPast && pastDays.indexOf(d) !== -1);
        });

        return (
          <div key={wk.weekStart} className="mp-week" style={{ marginBottom: wi === 0 ? 22 : 0 }}>
            <div style={{ display:'flex', alignItems:'center', justifyContent:'space-between',
                          marginBottom:10, gap:10, flexWrap:'wrap' }}>
              <div>
                <div style={{ fontSize:15, fontWeight:700, color:'#e8eaf6' }}>{weekLabel(wk.weekStart, wi)}</div>
                <div style={{ fontSize:12, color:'#4d6080', marginTop:2 }}>Dinner plan — Mon through Sun</div>
              </div>
              <button className="mp-suggest" onClick={function(){ suggestWeek(wk.weekStart); }}
                disabled={!!suggesting || busy}
                style={{ background:'rgba(201,168,76,.12)', border:'1px solid rgba(201,168,76,.3)',
                         color:'#c9a84c', borderRadius:8, padding:'7px 16px', fontSize:12,
                         fontWeight:600, cursor: suggesting ? 'wait' : 'pointer' }}>
                {suggesting === wk.weekStart ? '✨ Suggesting…' : '✨ Suggest Week'}
              </button>
            </div>

            {wi === 0 && pastDays.length > 0 && (
              <button className="mp-past-toggle" onClick={function(){ setShowPast(!showPast); }}
                style={{ background:'none', border:'none', color:'#4d6080', fontSize:12,
                         cursor:'pointer', padding:'4px 0', marginBottom:6 }}>
                {showPast ? '▾ Hide ' : '▸ '}{pastDays.length} earlier day{pastDays.length === 1 ? '' : 's'}
              </button>
            )}

            <div style={{ display:'flex', flexDirection:'column', gap:8 }}>
              {visibleDays.map(function(day) {
                var entry     = days.find(function(d) { return d.day === day; }) ||
                                { day:day, mealName:'', type:'', status:'Planned' };
                var iso       = dateFor(wk.weekStart, day);
                var isToday   = iso === todayIso;
                var isPast    = iso < todayIso;
                var tc        = TYPE_COLORS[entry.type] || {};
                var sc        = STATUS_COLORS[entry.status] || STATUS_COLORS['Planned'];
                var isEmpty   = !entry.mealName;
                var isEditing = editKey === slotKey(wk.weekStart, day);
                var isSource  = !!moving && moving.weekStart === wk.weekStart && moving.day === day;
                var isTarget  = !!moving && !isSource;

                return (
                  <div key={day}
                    className={'mp-day' + (isTarget ? ' mp-target' : '') + (isSource ? ' mp-moving' : '')}
                    onClick={isTarget ? function(){ dropOn(wk.weekStart, day); } : undefined}
                    style={{
                      background: isSource ? 'rgba(201,168,76,.14)'
                                : isToday  ? 'rgba(201,168,76,.06)' : '#0d1b3e',
                      border: '1px solid ' + (isSource ? 'rgba(201,168,76,.6)'
                                            : isTarget ? 'rgba(201,168,76,.35)'
                                            : isToday  ? 'rgba(201,168,76,.3)' : '#1e2e4a'),
                      borderStyle: isTarget ? 'dashed' : 'solid',
                      borderRadius:10, padding:'12px 16px',
                      display:'flex', alignItems:'center', gap:12,
                      opacity: isPast && !isSource ? 0.6 : 1,
                      cursor: isTarget ? 'pointer' : 'default',
                    }}>
                    <div style={{ width:44, flexShrink:0 }}>
                      <div style={{ fontSize:12, fontWeight:700, color: isToday ? '#c9a84c' : '#6b7fa8' }}>{day}</div>
                      <div style={{ fontSize:10, color:'#3d5070' }}>{shortDate(iso)}</div>
                    </div>

                    <div style={{ flex:1 }}>
                      {isEditing ? (
                        <div style={{ display:'flex', gap:8, alignItems:'center', flexWrap:'wrap' }}>
                          <input
                            className="mp-input"
                            autoFocus
                            value={editVal.mealName}
                            onChange={function(e){ setEditVal(function(v){ return Object.assign({},v,{mealName:e.target.value}); }); }}
                            onKeyDown={function(e){ if(e.key==='Enter') saveEdit(wk.weekStart, day); if(e.key==='Escape') setEditKey(null); }}
                            placeholder="Dinner name…"
                            style={{ background:'#0a1628', border:'1px solid #2e4060', borderRadius:6,
                                     color:'#e8eaf6', fontSize:13, padding:'4px 10px', flex:1, minWidth:140 }}
                          />
                          <select className="mp-type" value={editVal.type}
                            onChange={function(e){ setEditVal(function(v){ return Object.assign({},v,{type:e.target.value}); }); }}
                            style={{ background:'#0a1628', border:'1px solid #2e4060', borderRadius:6,
                                     color:'#c9d9ff', fontSize:12, padding:'4px 8px' }}>
                            {['Home Cooked','Leftovers','Takeout','Eating Out'].map(function(t){
                              return <option key={t} value={t}>{t}</option>;
                            })}
                          </select>
                          <button className="mp-save" onClick={function(){ saveEdit(wk.weekStart, day); }}
                            style={{ background:'rgba(102,187,106,.15)', border:'1px solid rgba(102,187,106,.3)',
                                     color:'#66bb6a', borderRadius:6, padding:'4px 10px', fontSize:12, cursor:'pointer' }}>Save</button>
                          <button onClick={function(){ setEditKey(null); }}
                            style={{ background:'none', border:'none', color:'#4d6080', fontSize:12, cursor:'pointer' }}>✕</button>
                        </div>
                      ) : (
                        <div style={{ display:'flex', alignItems:'center', gap:8, flexWrap:'wrap' }}>
                          <span style={{ fontSize:14, color: isEmpty ? '#2e3d55' : '#e8eaf6', fontStyle: isEmpty ? 'italic' : 'normal' }}>
                            {isEmpty ? (isTarget ? 'Drop here' : '—') : entry.mealName}
                          </span>
                          {!isEmpty && entry.type && (
                            <span style={{ fontSize:11, padding:'2px 8px', borderRadius:12, fontWeight:600,
                              background: tc.bg, color: tc.color, border:'1px solid '+(tc.border||'transparent') }}>
                              {entry.type}
                            </span>
                          )}
                          {!isEmpty && (
                            <span style={{ fontSize:11, color: sc.color, fontWeight:600 }}>{entry.status}</span>
                          )}
                          {isTarget && !isEmpty && (
                            <span style={{ fontSize:11, color:'#c9a84c', fontWeight:600 }}>· tap to swap</span>
                          )}
                        </div>
                      )}
                    </div>

                    {!isEditing && !moving && (
                      <div style={{ display:'flex', gap:6, flexShrink:0 }}>
                        {!isEmpty && (
                          <button className="mp-handle" title="Move this dinner"
                            onClick={function(){ pickUp(wk.weekStart, day, entry); }}
                            style={{ background:'rgba(107,127,168,.1)', border:'1px solid rgba(107,127,168,.2)',
                                     color:'#6b7fa8', borderRadius:6, padding:'4px 8px', fontSize:11, cursor:'grab' }}>
                            ⠿
                          </button>
                        )}
                        <button className="mp-edit" onClick={function(){ openEdit(wk.weekStart, day, entry); }}
                          style={{ background:'rgba(107,127,168,.1)', border:'1px solid rgba(107,127,168,.2)',
                                   color:'#6b7fa8', borderRadius:6, padding:'4px 8px', fontSize:11, cursor:'pointer' }}>
                          ✏️
                        </button>
                        {!isEmpty && entry.status !== 'Cooked' && (
                          <button className="mp-cooked" onClick={function(){ updateStatus(wk.weekStart, day,'Cooked'); }}
                            style={{ background:'rgba(102,187,106,.1)', border:'1px solid rgba(102,187,106,.2)',
                                     color:'#66bb6a', borderRadius:6, padding:'4px 8px', fontSize:11, cursor:'pointer' }}>
                            ✓
                          </button>
                        )}
                        {!isEmpty && entry.status !== 'Skipped' && (
                          <button className="mp-skipped" onClick={function(){ updateStatus(wk.weekStart, day,'Skipped'); }}
                            style={{ background:'rgba(239,83,80,.08)', border:'1px solid rgba(239,83,80,.2)',
                                     color:'#ef5350', borderRadius:6, padding:'4px 8px', fontSize:11, cursor:'pointer' }}>
                            ✗
                          </button>
                        )}
                      </div>
                    )}
                  </div>
                );
              })}
            </div>
          </div>
        );
      })}
    </div>
  );
}

function ResellListView({ apiUrl, apiToken }) {
  const [items,    setItems]    = React.useState(null);
  const [busy,     setBusy]     = React.useState(false);
  const [showAdd,  setShowAdd]  = React.useState(false);
  const [form,     setForm]     = React.useState({
    item:'', category:'Other', askingPrice:'', originalPrice:'',
    platform:'', priority:'Medium', notes:''
  });
  const [editItem, setEditItem] = React.useState(null);
  const [editForm, setEditForm] = React.useState({});

  React.useEffect(function() {
    if (!apiUrl || !apiToken) return;
    apiGet(apiUrl, apiToken, { action: 'get_resell_list' })
      .then(function(d) { setItems(d.items || []); })
      .catch(function()  { setItems([]); });
  }, [apiUrl, apiToken]);

  var allItems  = items || [];
  var listed    = allItems.filter(function(i) { return i.Status === 'Listed'; });
  var sold      = allItems.filter(function(i) { return i.Status === 'Sold'; });
  var active    = allItems.filter(function(i) { return i.Status !== 'Sold' && i.Status !== 'Donated'; });
  var listedVal = listed.reduce(function(s, i) { return s + (parseFloat(i['Asking Price']) || 0); }, 0);
  var soldVal   = sold.reduce(function(s, i)   { return s + (parseFloat(i['Asking Price']) || 0); }, 0);

  var PRIORITY_COLOR = { High: '#f87171', Medium: '#fbbf24', Low: '#4ade80' };

  function fmtPrice(v) { return v ? '$' + parseFloat(v).toLocaleString() : null; }

  function setF(key, val)  { setForm(function(p)     { return Object.assign({}, p, { [key]: val }); }); }
  function setEF(key, val) { setEditForm(function(p)  { return Object.assign({}, p, { [key]: val }); }); }

  function openEdit(it) {
    setEditItem(it);
    setEditForm({
      item:          it.Item               || '',
      category:      it.Category           || 'Other',
      askingPrice:   it['Asking Price']    || '',
      originalPrice: it['Original Price']  || '',
      platform:      it.Platform           || '',
      priority:      it.Priority           || 'Medium',
      status:        it.Status             || 'Unlisted',
      notes:         it.Notes              || ''
    });
  }

  async function handleSave() {
    if (!editItem || !editForm.item.trim()) return;
    setBusy(true);
    try {
      await apiGet(apiUrl, apiToken, { action: 'update_resell_item',
        id: editItem.ID,
        item: editForm.item, category: editForm.category,
        askingPrice: editForm.askingPrice, originalPrice: editForm.originalPrice,
        platform: editForm.platform, priority: editForm.priority,
        status: editForm.status, notes: editForm.notes });
      setItems(function(prev) {
        return prev.map(function(i) {
          if (i.ID !== editItem.ID) return i;
          return Object.assign({}, i, {
            Item: editForm.item, Category: editForm.category,
            'Asking Price': editForm.askingPrice, 'Original Price': editForm.originalPrice,
            Platform: editForm.platform, Priority: editForm.priority,
            Status: editForm.status, Notes: editForm.notes
          });
        });
      });
      setEditItem(null);
    } finally { setBusy(false); }
  }

  async function handleAdd() {
    if (!form.item.trim()) return;
    setBusy(true);
    try {
      var d = await apiGet(apiUrl, apiToken, { action: 'add_resell_item',
        item: form.item, category: form.category, askingPrice: form.askingPrice,
        originalPrice: form.originalPrice, platform: form.platform,
        priority: form.priority, notes: form.notes });
      setItems(function(prev) { return [...(prev || []), d.item]; });
      setShowAdd(false);
      setForm({ item:'', category:'Other', askingPrice:'', originalPrice:'', platform:'', priority:'Medium', notes:'' });
    } finally { setBusy(false); }
  }

  async function handleStatus(id, status) {
    setItems(function(prev) { return prev.map(function(i) { return i.ID === id ? Object.assign({}, i, { Status: status }) : i; }); });
    try { await apiGet(apiUrl, apiToken, { action: 'update_resell_item', id: id, status: status }); }
    catch(e) { /* silent */ }
  }

  async function handleDelete(id) {
    setItems(function(prev) { return prev.filter(function(i) { return i.ID !== id; }); });
    await apiGet(apiUrl, apiToken, { action: 'delete_resell_item', id: id });
  }

  if (items === null) return <div style={{ fontSize:13, color:'#6b7fa8', padding:16 }}>Loading…</div>;

  var sections = [
    { label: '🔴 Unlisted', status: 'Unlisted', items: active.filter(function(i){ return i.Status === 'Unlisted'; }) },
    { label: '🔵 Listed',   status: 'Listed',   items: listed },
    { label: '✅ Sold',     status: 'Sold',     items: sold   },
  ];

  var inputSt = { width:'100%', padding:'7px 10px', borderRadius:7, background:'#0d1b3e',
                  border:'1px solid #1e3060', color:'#dde1f0', fontSize:13, boxSizing:'border-box' };

  return (
    <div>
      <div style={{ display:'flex', gap:10, marginBottom:16, flexWrap:'wrap', alignItems:'center' }}>
        {[
          { label:'Active',  value: active.length,                                      color:'#dde1f0' },
          { label:'Listed',  value: listed.length + (listedVal ? ' · $' + listedVal.toLocaleString() : ''), color:'#5c9eff' },
          { label:'Sold',    value: sold.length   + (soldVal   ? ' · $' + soldVal.toLocaleString()   : ''), color:'#4ade80' },
        ].map(function(s) {
          return (
            <div key={s.label} style={{ background:'#0e1e3a', border:'1px solid #1e3060',
              borderRadius:8, padding:'8px 14px', minWidth:80 }}>
              <div style={{ fontSize:10, color:'#6b7fa8', textTransform:'uppercase', letterSpacing:1 }}>{s.label}</div>
              <div style={{ fontSize:15, fontWeight:700, color:s.color, marginTop:2 }}>{s.value}</div>
            </div>
          );
        })}
        <button className="btn btn-primary" style={{ marginLeft:'auto' }}
          onClick={function(){ setShowAdd(true); }}>＋ Add Item</button>
      </div>

      {showAdd && (
        <div className="modal-overlay" onClick={function(){ setShowAdd(false); }}>
          <div className="modal-box" style={{ maxWidth:440 }} onClick={function(e){ e.stopPropagation(); }}>
            <div style={{ fontWeight:700, fontSize:15, color:'#dde1f0', marginBottom:16 }}>Add Resell Item</div>
            {[
              ['item',          'Item Name *',      'text',   'e.g. Sony WH-1000XM4'],
              ['askingPrice',   'Asking Price ($)',  'number', '0.00'],
              ['originalPrice', 'Paid ($)',          'number', '0.00'],
              ['notes',         'Notes',             'text',   'Condition, serial #, etc.'],
            ].map(function(row) {
              var key=row[0], label=row[1], type=row[2], ph=row[3];
              return (
                <div key={key} style={{ marginBottom:10 }}>
                  <label style={{ display:'block', fontSize:11, color:'#8a9abf', marginBottom:4,
                                  textTransform:'uppercase', letterSpacing:1 }}>{label}</label>
                  <input type={type} value={form[key]||''} placeholder={ph}
                    onChange={function(e){ setF(key, e.target.value); }}
                    style={inputSt} />
                </div>
              );
            })}
            {[
              ['category', 'Category', ['Electronics','Clothing','Furniture','Appliances','Sports','Books','Tools','Collectibles','Other']],
              ['platform', 'Platform', ['','Facebook Marketplace','eBay','OfferUp','Craigslist','Poshmark','Other']],
              ['priority', 'Priority', ['High','Medium','Low']],
            ].map(function(row) {
              var key=row[0], label=row[1], opts=row[2];
              return (
                <div key={key} style={{ marginBottom:10 }}>
                  <label style={{ display:'block', fontSize:11, color:'#8a9abf', marginBottom:4,
                                  textTransform:'uppercase', letterSpacing:1 }}>{label}</label>
                  <select value={form[key]||''} onChange={function(e){ setF(key, e.target.value); }}
                    style={inputSt}>
                    {opts.map(function(o){ return <option key={o} value={o}>{o||'— None —'}</option>; })}
                  </select>
                </div>
              );
            })}
            <div style={{ display:'flex', gap:8, marginTop:16, justifyContent:'flex-end' }}>
              <button className="btn btn-ghost" onClick={function(){ setShowAdd(false); }}>Cancel</button>
              <button className="btn btn-primary" disabled={busy || !form.item.trim()} onClick={handleAdd}>Add</button>
            </div>
          </div>
        </div>
      )}

      {editItem && (
        <div className="modal-overlay" onClick={function(){ setEditItem(null); }}>
          <div className="modal-box" style={{ maxWidth:440 }} onClick={function(e){ e.stopPropagation(); }}>
            <div style={{ fontWeight:700, fontSize:15, color:'#dde1f0', marginBottom:16 }}>Edit Item</div>
            {[
              ['item',          'Item Name *',      'text',   ''],
              ['askingPrice',   'Asking Price ($)',  'number', '0.00'],
              ['originalPrice', 'Paid ($)',          'number', '0.00'],
              ['notes',         'Notes',             'text',   'Condition, serial #, etc.'],
            ].map(function(row) {
              var key=row[0], label=row[1], type=row[2], ph=row[3];
              return (
                <div key={key} style={{ marginBottom:10 }}>
                  <label style={{ display:'block', fontSize:11, color:'#8a9abf', marginBottom:4,
                                  textTransform:'uppercase', letterSpacing:1 }}>{label}</label>
                  <input type={type} value={editForm[key]||''} placeholder={ph}
                    onChange={function(e){ setEF(key, e.target.value); }}
                    style={inputSt} />
                </div>
              );
            })}
            {[
              ['category', 'Category', ['Electronics','Clothing','Furniture','Appliances','Sports','Books','Tools','Collectibles','Other']],
              ['platform', 'Platform', ['','Facebook Marketplace','eBay','OfferUp','Craigslist','Poshmark','Other']],
              ['priority', 'Priority', ['High','Medium','Low']],
              ['status',   'Status',   ['Unlisted','Listed','Sold','Donated']],
            ].map(function(row) {
              var key=row[0], label=row[1], opts=row[2];
              return (
                <div key={key} style={{ marginBottom:10 }}>
                  <label style={{ display:'block', fontSize:11, color:'#8a9abf', marginBottom:4,
                                  textTransform:'uppercase', letterSpacing:1 }}>{label}</label>
                  <select value={editForm[key]||''} onChange={function(e){ setEF(key, e.target.value); }}
                    style={inputSt}>
                    {opts.map(function(o){ return <option key={o} value={o}>{o||'— None —'}</option>; })}
                  </select>
                </div>
              );
            })}
            <div style={{ display:'flex', gap:8, marginTop:16, justifyContent:'flex-end' }}>
              <button className="btn btn-ghost" onClick={function(){ setEditItem(null); }}>Cancel</button>
              <button className="btn btn-primary" disabled={busy || !editForm.item.trim()} onClick={handleSave}>Save</button>
            </div>
          </div>
        </div>
      )}

      {allItems.length === 0 ? (
        <div className="empty-state" style={{ padding:40 }}>
          <div style={{ fontSize:32, marginBottom:12 }}>💰</div>
          <div>No resell items yet.</div>
          <div style={{ fontSize:13, color:'#6b7fa8', marginTop:8 }}>
            Add items you want to sell and track their listing status.
          </div>
        </div>
      ) : (
        sections.map(function(sec) {
          if (sec.status === 'Sold' && sec.items.length === 0) return null;
          return (
            <div key={sec.status} style={{ marginBottom:14 }}>
              <div style={{ fontSize:11, fontWeight:700, color:'#6b7fa8', textTransform:'uppercase',
                            letterSpacing:1, marginBottom:8 }}>
                {sec.label} <span style={{ fontWeight:400 }}>({sec.items.length})</span>
              </div>
              {sec.items.length === 0 ? (
                <div style={{ fontSize:12, color:'#4d6080', padding:'4px 0' }}>None.</div>
              ) : (
                sec.items.map(function(it) {
                  var askP = fmtPrice(it['Asking Price']);
                  var origP = fmtPrice(it['Original Price']);
                  return (
                    <div key={it.ID} style={{ background:'#13244d', border:'1px solid #1e3060',
                      borderRadius:10, padding:'12px 16px', marginBottom:8,
                      display:'flex', alignItems:'flex-start', gap:12 }}>
                      <div style={{ flex:1, minWidth:0 }}>
                        <div style={{ display:'flex', alignItems:'center', gap:6, flexWrap:'wrap' }}>
                          <span style={{ color: PRIORITY_COLOR[it.Priority] || '#4d6080', fontWeight:700, fontSize:13 }}>●</span>
                          <span style={{ fontWeight:700, fontSize:14, color:'#dde1f0' }}>{it.Item}</span>
                          <span style={{ fontSize:10, padding:'2px 8px', borderRadius:20, background:'#0e1e3a',
                                         color:'#8a9abf', border:'1px solid #1e3060' }}>{it.Category}</span>
                          {it.Platform && (
                            <span style={{ fontSize:10, padding:'2px 8px', borderRadius:20, background:'#0e1e3a',
                                           color:'#5c9eff', border:'1px solid #1e3060' }}>{it.Platform}</span>
                          )}
                        </div>
                        <div style={{ marginTop:5, display:'flex', alignItems:'baseline', gap:8 }}>
                          {askP  && <span style={{ fontSize:16, fontWeight:700, color:'#4ade80' }}>{askP}</span>}
                          {origP && <span style={{ fontSize:11, color:'#4d6080' }}>paid {origP}</span>}
                          {!askP && <span style={{ fontSize:13, color:'#4d6080' }}>No price set</span>}
                        </div>
                        {it.Notes && <div style={{ fontSize:11, color:'#6b7fa8', marginTop:4 }}>{it.Notes}</div>}
                      </div>
                      <div style={{ display:'flex', flexDirection:'column', gap:4, flexShrink:0 }}>
                        {it.Status === 'Unlisted' && (
                          <button className="btn btn-ghost" style={{ fontSize:11, padding:'3px 9px', color:'#5c9eff' }}
                            disabled={busy} onClick={function(){ handleStatus(it.ID, 'Listed'); }}>List It</button>
                        )}
                        {it.Status === 'Listed' && (
                          <button className="btn btn-ghost" style={{ fontSize:11, padding:'3px 9px', color:'#4ade80' }}
                            disabled={busy} onClick={function(){ handleStatus(it.ID, 'Sold'); }}>Mark Sold</button>
                        )}
                        {(it.Status === 'Unlisted' || it.Status === 'Listed') && (
                          <button className="btn btn-ghost" style={{ fontSize:11, padding:'3px 9px', color:'#a78bfa' }}
                            disabled={busy} onClick={function(){ handleStatus(it.ID, 'Donated'); }}>Donated</button>
                        )}
                        <button className="btn btn-ghost" style={{ fontSize:11, padding:'3px 9px', color:'#8a9abf' }}
                          disabled={busy} onClick={function(){ openEdit(it); }}>✎</button>
                        <button className="btn btn-ghost" style={{ fontSize:11, padding:'3px 9px', color:'#c0392b' }}
                          disabled={busy} onClick={function(){ handleDelete(it.ID); }}>✕</button>
                      </div>
                    </div>
                  );
                })
              )}
            </div>
          );
        })
      )}
    </div>
  );
}

// ---- NeighborhoodWatchView (Issue #179) ---------------------------------------

function NeighborhoodWatchView({ apiUrl, apiToken }) {
  const [panel,        setPanel]        = React.useState('flyers');
  const [flyers,       setFlyers]       = React.useState(null);
  const [flyerLoading, setFlyerLoading] = React.useState(false);
  const [extracting,   setExtracting]   = React.useState(false);
  const [editDraft,    setEditDraft]    = React.useState(null);
  const [previewUrl,   setPreviewUrl]   = React.useState(null);
  const [hoaUrl,       setHoaUrl]       = React.useState('');
  const [hoaUrlInput,  setHoaUrlInput]  = React.useState('');
  const [hoaScans,     setHoaScans]     = React.useState(null);
  const [scanning,     setScanning]     = React.useState(false);
  const [busy,         setBusy]         = React.useState(false);
  const [toast,        setToast]        = React.useState(null);
  const fileRef = React.useRef(null);

  function showToast(msg) { setToast(msg); setTimeout(function() { setToast(null); }, 3000); }

  function loadFlyers() {
    setFlyerLoading(true);
    apiGet(apiUrl, apiToken, { action: 'get_flyers' })
      .then(function(d) { setFlyers(d.flyers || []); })
      .catch(function() { setFlyers([]); })
      .finally(function() { setFlyerLoading(false); });
  }
  function loadHoaConfig() {
    apiGet(apiUrl, apiToken, { action: 'get_hoa_config' })
      .then(function(d) { setHoaUrl(d.url || ''); setHoaUrlInput(d.url || ''); })
      .catch(function() {});
  }
  function loadHoaScans() {
    apiGet(apiUrl, apiToken, { action: 'get_hoa_scans' })
      .then(function(d) { setHoaScans(d.scans || []); })
      .catch(function() { setHoaScans([]); });
  }

  React.useEffect(function() {
    if (!apiUrl || !apiToken) return;
    loadFlyers();
    loadHoaConfig();
    loadHoaScans();
  }, [apiUrl, apiToken]);

  function handleFileChange(e) {
    var file = e.target.files && e.target.files[0];
    if (!file) return;
    e.target.value = '';
    setExtracting(true);
    resizeImage(file, 1600).then(function(res) {
      setPreviewUrl(res.preview);
      var body = { action: 'extract_flyer', imageBase64: res.base64, imageMimeType: res.mimeType };
      return apiPost(apiUrl, apiToken, body);
    }).then(function(result) {
      var f = result.flyer || {};
      setEditDraft({
        title:       f.title       || '',
        type:        f.type        || 'Event',
        date:        f.date        || '',
        time:        f.time        || '',
        location:    f.location    || '',
        description: f.description || '',
        recurring:   f.recurring === true || f.recurring === 'true',
        tags:        Array.isArray(f.tags) ? f.tags.join(', ') : (f.tags || ''),
        notes:       '',
      });
      setExtracting(false);
    }).catch(function(err) {
      showToast('Could not extract flyer: ' + err.message);
      setExtracting(false);
    });
  }

  function handleSaveFlyer() {
    if (!editDraft) return;
    setBusy(true);
    var body = Object.assign({ action: 'save_flyer' }, editDraft);
    apiPost(apiUrl, apiToken, body).then(function() {
      setEditDraft(null);
      setPreviewUrl(null);
      loadFlyers();
      showToast('Flyer saved ✓');
    }).catch(function(err) {
      showToast('Save failed: ' + err.message);
    }).finally(function() { setBusy(false); });
  }

  function handleDeleteFlyer(row) {
    if (!window.confirm('Delete this flyer?')) return;
    apiGet(apiUrl, apiToken, { action: 'delete_flyer', row: String(row) });
    setFlyers(function(prev) { return prev.filter(function(f) { return f._row !== row; }); });
  }

  function handleRsvp(row, status) {
    apiGet(apiUrl, apiToken, { action: 'update_flyer_status', row: String(row), status: status });
    setFlyers(function(prev) { return prev.map(function(f) { return f._row === row ? Object.assign({}, f, { Status: status }) : f; }); });
  }

  function handleAddToCalendar(flyer) {
    setBusy(true);
    apiGet(apiUrl, apiToken, {
      action: 'flyer_to_calendar',
      title: flyer.Title, date: flyer.Date, time: flyer.Time,
      location: flyer.Location, description: flyer.Description,
    }).then(function() {
      showToast('Added to Calendar ✓');
    }).catch(function(err) {
      showToast('Calendar error: ' + err.message);
    }).finally(function() { setBusy(false); });
  }

  function handleSaveHoaUrl() {
    apiGet(apiUrl, apiToken, { action: 'set_hoa_config', url: hoaUrlInput })
      .then(function() { setHoaUrl(hoaUrlInput); showToast('HOA URL saved ✓'); })
      .catch(function() {});
  }

  function handleScanNow() {
    setScanning(true);
    apiGet(apiUrl, apiToken, { action: 'run_hoa_scan' }).then(function(d) {
      showToast('Scan complete · ' + (d.itemsFound || 0) + ' items · ' + (d.flagsWritten || 0) + ' flags');
      loadHoaScans();
    }).catch(function(err) {
      showToast('Scan error: ' + err.message);
    }).finally(function() { setScanning(false); });
  }

  var today = new Date(); today.setHours(0, 0, 0, 0);
  var upcoming = (flyers || []).filter(function(f) {
    if (String(f.Recurring) === 'true') return true;
    if (!f.Date) return false;
    return new Date(f.Date + 'T00:00:00') >= today;
  });
  var past = (flyers || []).filter(function(f) {
    if (String(f.Recurring) === 'true') return false;
    if (!f.Date) return true;
    return new Date(f.Date + 'T00:00:00') < today;
  });

  var rsvpColors = { Going: '#43a047', Interested: '#c9a84c', 'Not Going': '#6b7fa8', Done: '#555' };

  function FlyerCard(props) {
    var f = props.f;
    var dateStr = f.Date ? new Date(f.Date + 'T00:00:00').toLocaleDateString('en-US', { month:'short', day:'numeric', year:'numeric' }) : null;
    return (
      React.createElement('div', { style: { background:'#0d1b3e', border:'1px solid #1e3060', borderRadius:10, padding:'14px 16px', marginBottom:10 } },
        React.createElement('div', { style: { display:'flex', justifyContent:'space-between', alignItems:'flex-start' } },
          React.createElement('div', null,
            React.createElement('span', { style: { fontWeight:700, fontSize:15, color:'#e8eaf6' } }, f.Title || '(no title)'),
            f.Status && React.createElement('span', { style: { marginLeft:8, fontSize:11, background: rsvpColors[f.Status] || '#1e3060', color:'#fff', borderRadius:12, padding:'2px 8px' } }, f.Status)
          ),
          React.createElement('button', { onClick: function() { handleDeleteFlyer(f._row); },
            style: { background:'none', border:'none', color:'#6b7fa8', cursor:'pointer', fontSize:16, padding:'0 4px' } }, '🗑')
        ),
        React.createElement('div', { style: { fontSize:12, color:'#8a9abf', marginTop:4, display:'flex', gap:12, flexWrap:'wrap' } },
          String(f.Recurring) === 'true' && React.createElement('span', null, '🔁 Recurring'),
          dateStr && React.createElement('span', null, '📅 ' + dateStr + (f.Time ? ' · ' + f.Time : '')),
          f.Location && React.createElement('span', null, '📍 ' + f.Location)
        ),
        f.Description && React.createElement('div', { style: { fontSize:13, color:'#c9d9ff', marginTop:6 } }, f.Description),
        f.Tags && React.createElement('div', { style: { fontSize:11, color:'#6b7fa8', marginTop:4 } }, f.Tags),
        React.createElement('div', { style: { display:'flex', gap:6, marginTop:10, flexWrap:'wrap', alignItems:'center' } },
          ['Going','Interested','Not Going'].map(function(s) {
            return React.createElement('button', { key: s, onClick: function() { handleRsvp(f._row, f.Status === s ? '' : s); },
              style: { fontSize:11, padding:'4px 10px', borderRadius:20, cursor:'pointer',
                background: f.Status === s ? rsvpColors[s] : 'none',
                border: '1px solid ' + (rsvpColors[s] || '#1e3060'),
                color: f.Status === s ? '#fff' : (rsvpColors[s] || '#6b7fa8') } }, s);
          }),
          f.Status !== 'Done' && React.createElement('button', { onClick: function() { handleRsvp(f._row, 'Done'); },
            style: { fontSize:11, padding:'4px 10px', borderRadius:20, cursor:'pointer',
              background:'none', border:'1px solid #555', color:'#888' } }, '✓ Done'),
          f.Date && React.createElement('button', { onClick: function() { handleAddToCalendar(f); }, disabled: busy,
            style: { fontSize:11, padding:'4px 10px', borderRadius:20, cursor:'pointer',
              background:'none', border:'1px solid #1e3060', color:'#8a9abf', marginLeft:'auto' } }, '📅 Calendar')
        )
      )
    );
  }

  function inp(key, lbl) {
    return (
      React.createElement('div', { key: key, style: { marginBottom:10 } },
        React.createElement('label', { style: { display:'block', fontSize:11, color:'#8a9abf', marginBottom:3, textTransform:'uppercase', letterSpacing:1 } }, lbl),
        React.createElement('input', { type:'text', value: (editDraft && editDraft[key]) || '',
          onChange: function(e) { var v = e.target.value; setEditDraft(function(p) { var n = Object.assign({}, p); n[key] = v; return n; }); },
          style: { width:'100%', padding:'7px 10px', borderRadius:8, background:'#0d1b3e', border:'1px solid #1e3060', color:'#dde1f0', fontSize:13 } })
      )
    );
  }

  return (
    <div>
      {/* Panel toggle */}
      <div style={{ display:'flex', gap:8, marginBottom:18 }}>
        {[{ id:'flyers', label:'🪧 Flyer Board' }, { id:'hoa', label:'🏘 HOA Watch' }].map(function(p) {
          return (
            <button key={p.id} onClick={function() { setPanel(p.id); }}
              style={{ background: panel === p.id ? 'rgba(201,168,76,.08)' : 'none',
                       border:'1px solid ' + (panel === p.id ? '#c9a84c' : '#1e3060'),
                       borderRadius:20, color: panel === p.id ? '#c9a84c' : '#6b7fa8',
                       fontSize:12, padding:'5px 14px', cursor:'pointer' }}>
              {p.label}
            </button>
          );
        })}
      </div>

      {/* ── FLYER BOARD ── */}
      {panel === 'flyers' && (
        <div>
          <div className="toolbar">
            <button className="btn btn-primary" style={{ fontSize:12 }}
              disabled={extracting} onClick={function() { fileRef.current && fileRef.current.click(); }}>
              {extracting ? '⏳ Extracting…' : '📷 Upload Flyer'}
            </button>
            {flyers && <span className="count-badge">{flyers.length} flyer{flyers.length !== 1 ? 's' : ''}</span>}
            <input ref={fileRef} type="file" accept="image/*" style={{ display:'none' }} onChange={handleFileChange} />
          </div>

          {editDraft && (
            <div style={{ background:'#111e42', border:'1px solid #c9a84c', borderRadius:12, padding:20, marginBottom:18 }}>
              {previewUrl && <img src={previewUrl} style={{ maxHeight:120, borderRadius:8, marginBottom:14, display:'block' }} />}
              <div style={{ fontWeight:700, fontSize:15, marginBottom:14, color:'#e8eaf6' }}>🪧 Confirm Flyer Details</div>
              {inp('title','Title')}
              {inp('type','Type (Event / Notice / Other)')}
              {inp('date','Date (YYYY-MM-DD)')}
              {inp('time','Time (HH:MM)')}
              {inp('location','Location')}
              {inp('tags','Tags (comma-separated)')}
              <div style={{ marginBottom:10 }}>
                <label style={{ display:'block', fontSize:11, color:'#8a9abf', marginBottom:3, textTransform:'uppercase', letterSpacing:1 }}>Description</label>
                <textarea value={(editDraft && editDraft.description) || ''} rows={3}
                  onChange={function(e) { var v = e.target.value; setEditDraft(function(p) { return Object.assign({}, p, { description: v }); }); }}
                  style={{ width:'100%', padding:'7px 10px', borderRadius:8, background:'#0d1b3e', border:'1px solid #1e3060', color:'#dde1f0', fontSize:13, resize:'vertical' }} />
              </div>
              <label style={{ fontSize:13, color:'#8a9abf', cursor:'pointer', display:'block', marginBottom:14 }}>
                <input type="checkbox" checked={!!(editDraft && editDraft.recurring)}
                  onChange={function(e) { var v = e.target.checked; setEditDraft(function(p) { return Object.assign({}, p, { recurring: v }); }); }}
                  style={{ marginRight:6 }} />
                Recurring event
              </label>
              <div style={{ display:'flex', gap:8 }}>
                <button className="btn btn-primary" onClick={handleSaveFlyer} disabled={busy}>{busy ? 'Saving…' : 'Save Flyer'}</button>
                <button className="btn" onClick={function() { setEditDraft(null); setPreviewUrl(null); }}>Cancel</button>
              </div>
            </div>
          )}

          {flyerLoading && <div style={{ fontSize:13, color:'#6b7fa8', padding:16 }}>Loading…</div>}
          {!flyerLoading && flyers && flyers.length === 0 && !editDraft && (
            <div style={{ textAlign:'center', padding:40 }}>
              <div style={{ fontSize:32, marginBottom:12 }}>🪧</div>
              <div style={{ color:'#c9d9ff' }}>No flyers yet.</div>
              <div style={{ fontSize:13, color:'#6b7fa8', marginTop:8 }}>Upload a photo of a neighborhood flyer to get started.</div>
            </div>
          )}
          {!flyerLoading && upcoming.length > 0 && (
            <div>
              <div style={{ fontSize:11, color:'#c9a84c', textTransform:'uppercase', letterSpacing:1, marginBottom:8 }}>Upcoming</div>
              {upcoming.map(function(f) { return <FlyerCard key={f._row} f={f} />; })}
            </div>
          )}
          {!flyerLoading && past.length > 0 && (
            <div style={{ marginTop:16 }}>
              <div style={{ fontSize:11, color:'#6b7fa8', textTransform:'uppercase', letterSpacing:1, marginBottom:8 }}>Past</div>
              {past.map(function(f) { return <FlyerCard key={f._row} f={f} />; })}
            </div>
          )}
        </div>
      )}

      {/* ── HOA WATCH ── */}
      {panel === 'hoa' && (
        <div>
          <div style={{ marginBottom:20 }}>
            <label style={{ display:'block', fontSize:11, color:'#8a9abf', marginBottom:6, textTransform:'uppercase', letterSpacing:1 }}>HOA Website URL</label>
            <div style={{ display:'flex', gap:8 }}>
              <input type="url" value={hoaUrlInput} onChange={function(e) { setHoaUrlInput(e.target.value); }}
                placeholder="https://myhoa.com/events"
                style={{ flex:1, padding:'8px 12px', borderRadius:8, background:'#0d1b3e', border:'1px solid #1e3060', color:'#dde1f0', fontSize:13 }} />
              <button className="btn btn-primary" style={{ fontSize:12, whiteSpace:'nowrap' }}
                onClick={handleSaveHoaUrl} disabled={!hoaUrlInput.trim()}>💾 Save</button>
            </div>
          </div>
          <div style={{ display:'flex', alignItems:'center', gap:14, marginBottom:20, flexWrap:'wrap' }}>
            <button className="btn btn-primary" style={{ fontSize:12 }} disabled={scanning || !hoaUrl}
              onClick={handleScanNow}>
              {scanning ? '⏳ Scanning…' : '▶ Scan Now'}
            </button>
            {!hoaUrl && <span style={{ fontSize:12, color:'#6b7fa8' }}>Save a URL above to enable scanning</span>}
          </div>
          <div style={{ fontSize:11, color:'#c9a84c', textTransform:'uppercase', letterSpacing:1, marginBottom:10 }}>Scan History</div>
          {hoaScans === null && <div style={{ fontSize:13, color:'#6b7fa8' }}>Loading…</div>}
          {hoaScans && hoaScans.length === 0 && (
            <div style={{ fontSize:13, color:'#6b7fa8', padding:'12px 0' }}>No scans yet. Click ▶ Scan Now to run your first check.</div>
          )}
          {hoaScans && hoaScans.map(function(s, i) {
            var dt    = s['Scanned At'] ? new Date(s['Scanned At']) : null;
            var dtStr = dt ? dt.toLocaleDateString('en-US', { month:'short', day:'numeric' }) + ' · ' + dt.toLocaleTimeString('en-US', { hour:'numeric', minute:'2-digit' }) : '—';
            return (
              <div key={i} style={{ display:'flex', justifyContent:'space-between', fontSize:13,
                                    padding:'8px 0', borderBottom:'1px solid #1a2a4a', color:'#c9d9ff' }}>
                <span>{dtStr}</span>
                <span style={{ color:'#6b7fa8', fontSize:12 }}>
                  {s['Items Found'] || 0} items · {s['New Flags'] || 0} flags
                </span>
              </div>
            );
          })}
          <div style={{ fontSize:12, color:'#6b7fa8', marginTop:16, lineHeight:1.6 }}>
            ℹ Flags appear in the VERA Flags tab. Items repeatedly ignored are suppressed automatically via Signal Learning.
          </div>
        </div>
      )}

      {toast && (
        <div style={{ position:'fixed', bottom:28, right:28, background:'#1e3060',
          border:'1px solid #c9a84c', borderRadius:10, padding:'12px 20px',
          color:'#e8eaf6', fontSize:14, zIndex:9999 }}>
          {toast}
        </div>
      )}
    </div>
  );
}

// ---- HfNav (Home Front groups) — SHARED VERBATIM by docs/app.js and docs/dashboard-lite.html ----
// Home Front's sections, in five groups (decided Oct 26, option A): a row of group buttons, then that
// group's sections as chips. Household comes first and is where Home Front opens. Each group remembers
// the section last opened in it. A section the dashboard doesn't offer (a feature switched off) is left
// out, and a group with none left is hidden.
// Also here, shared by both dashboards: upkeep in Chores (HfUpkeep).
var HF_GROUPS=[
  {id:'house',label:'House',icon:'🏠',items:['household','steward','vehicles','neighborhood_watch']},
  {id:'chores',label:'Chores',icon:'🧹',items:['chores','chores_for_others']},
