function AddInterestModal({ onSave, onClose, busy }) {
  const [person,   setPerson]   = React.useState('Ahmed');
  const [interest, setInterest] = React.useState('');
  const [category, setCategory] = React.useState('Other');
  const [notes,    setNotes]    = React.useState('');

  function handleKeyDown(e) {
    if (e.key === 'Enter' && interest.trim()) onSave({ person, interest, category, notes });
    if (e.key === 'Escape') onClose();
  }

  return (
    <div className="modal-overlay" onClick={e => e.target === e.currentTarget && onClose()}>
      <div className="modal" style={{ maxWidth: 400 }}>
        <h2>Log Interest</h2>

        <label className="form-label">Person *</label>
        <select className="form-input" value={person} onChange={e => setPerson(e.target.value)}>
          <option value="Ahmed">Ahmed</option>
          <option value="Victoria">Victoria</option>
        </select>

        <label className="form-label">Interest *</label>
        <input
          className="form-input"
          value={interest}
          onChange={e => setInterest(e.target.value)}
          onKeyDown={handleKeyDown}
          placeholder="e.g. specialty coffee, visit Round Rock TX"
          autoFocus
        />

        <label className="form-label">Category</label>
        <select className="form-input" value={category} onChange={e => setCategory(e.target.value)}>
          {INTEREST_CATEGORIES_UI.map(c => <option key={c} value={c}>{c}</option>)}
        </select>

        <label className="form-label">Notes (optional)</label>
        <input
          className="form-input"
          value={notes}
          onChange={e => setNotes(e.target.value)}
          onKeyDown={handleKeyDown}
          placeholder="e.g. mentioned during grocery trip"
        />

        <div className="modal-actions">
          <button className="btn" onClick={onClose}>Cancel</button>
          <button
            className="btn btn-primary"
            disabled={!interest.trim() || busy}
            onClick={() => onSave({ person, interest, category, notes })}
          >
            Log Interest
          </button>
        </div>
      </div>
    </div>
  );
}

// ---- App --------------------------------------------------------------------

function App() {
  const [apiUrl,   setApiUrl]   = useState(() => stored('vera_url'));
  const [apiToken, setApiToken] = useState(() => stored('vera_token'));
  const [showSettings, setShowSettings] = useState(() => !stored('vera_url'));
  const [activeTab,    setActiveTab]    = useState('home');
  const [filterActive, setFilterActive] = useState(true);
  const [loading,  setLoading]  = useState(false);
  const [tabLoading, setTabLoading] = useState({});
  const [busy,     setBusy]     = useState(false);
  const [error,    setError]    = useState(null);
  const [lastUpdated, setLastUpdated] = useState(null);
  const [status,     setStatus]     = useState(null);
  const [flags,      setFlags]      = useState([]);
  const [tasks,      setTasks]      = useState([]);
  const [summaries,  setSummaries]  = useState([]);
  const [projects,   setProjects]   = useState([]);
  const [goals,      setGoals]      = useState([]);
  const [interests,  setInterests]  = useState([]);
  const [shopping,   setShopping]   = useState([]);
  const [pto,        setPTO]        = useState(null);
  const [budget,     setBudget]     = useState(null); // { ok, rows, configured } | null
  const [chatMessages, setChatMessages] = useState([{ role: 'vera', text: VERA_CHAT_WELCOME }]);
  const [chatInput,    setChatInput]    = useState('');
  const [addItemModal, setAddItemModal] = useState(false);
  const [toast,         setToast]         = useState(null);
  const [completingIds, setCompletingIds] = useState({});
  const [taskModal,        setTaskModal]        = useState(null); // null | { mode:'add' } | { mode:'edit', task }
  const [projectTaskModal, setProjectTaskModal] = useState(null); // null | { mode:'add', project } | { mode:'edit', task }
  const [goalModal,        setGoalModal]        = useState(null); // null | { mode:'add', status? } | { mode:'edit', goal }
  const [interestModal,    setInterestModal]    = useState(false); // true = show AddInterestModal
  const [dragGoalId,       setDragGoalId]       = useState(null);
  const [dragOverCol,      setDragOverCol]      = useState(null);
  const toastTimer = useRef(null);

  const milestones = pto?.milestones || [];

  const loadAll = useCallback(async (url, token, activeOnly) => {
    if (!url || !token) return;
    setLoading(true);
    setError(null);
    try {
      const [s, f, t, sm] = await Promise.all([
        apiGet(url, token, { action: 'status' }),
        apiGet(url, token, { action: 'flags', filter: activeOnly ? 'active' : '' }),
        apiGet(url, token, { action: 'tasks' }),
        apiGet(url, token, { action: 'summaries' }),
      ]);
      setStatus(s);
      // Sort flags: High first, then Medium, then Low
      const order = { High: 0, Medium: 1, Low: 2 };
      const sorted = (f.flags || []).sort((a, b) =>
        (order[a.urgency] ?? 3) - (order[b.urgency] ?? 3)
      );
      setFlags(sorted);
      setTasks(t.tasks || []);
      setSummaries(sm.summaries || []);
      setLastUpdated(new Date());
    } catch (err) {
      setError(err.message);
    }
    setLoading(false);
  }, []);

  // Load on mount and when filter changes
  useEffect(() => {
    if (apiUrl && apiToken) loadAll(apiUrl, apiToken, filterActive);
  }, [apiUrl, apiToken, filterActive, loadAll]);

  // Pre-load lazy tab data so the Home tab has something to show
  useEffect(() => {
    if (apiUrl && apiToken) {
      loadProjects(apiUrl, apiToken);
      loadGoals(apiUrl, apiToken);
      loadShopping(apiUrl, apiToken);
      loadPTO(apiUrl, apiToken);
    }
  }, [apiUrl, apiToken]); // eslint-disable-line react-hooks/exhaustive-deps

  function showToast(msg, isError) {
    setToast({ msg, isError: !!isError });
    if (toastTimer.current) clearTimeout(toastTimer.current);
    toastTimer.current = setTimeout(() => setToast(null), 3000);
  }

  async function handleAction(action, id, days) {
    setBusy(true);
    setError(null);

    // Optimistic UI update — show result immediately so the user
    // sees the badge change before loadAll re-filters the list
    setFlags(prev => prev.map(f => {
      if (f.id !== id) return f;
      if (action === 'acknowledge') return { ...f, acknowledged: true };
      if (action === 'resolve')     return { ...f, resolved: true };
      if (action === 'snooze')      return { ...f, snoozedUntil: 'soon' };
      return f;
    }));

    try {
      const params = { id };
      if (days != null) params.days = days;
      await apiAction(apiUrl, apiToken, action, params);

      const labels = {
        acknowledge: '✓ Flag acknowledged',
        resolve:     '✓ Flag resolved',
        snooze:      '💤 Flag snoozed for ' + (days || 2) + 'd',
      };
      showToast(labels[action] || '✓ Done');

      // Short delay lets the user see the state change badge before
      // loadAll re-fetches and filters the flag out of the active view
      setTimeout(() => loadAll(apiUrl, apiToken, filterActive), 1500);
    } catch (err) {
      setError('Action failed: ' + err.message);
      // Revert optimistic update by re-fetching real state
      await loadAll(apiUrl, apiToken, filterActive);
    }
    setBusy(false);
  }

  async function handleComplete(id) {
    if (!id) return;
    setCompletingIds(prev => ({ ...prev, [id]: true }));
    try {
      await apiAction(apiUrl, apiToken, 'complete_task', { id });
      showToast('✓ Task marked done');
      setTimeout(() => loadAll(apiUrl, apiToken, filterActive), 1500);
    } catch (err) {
      setError('Could not complete task: ' + err.message);
      setCompletingIds(prev => { const n = { ...prev }; delete n[id]; return n; });
    }
  }

  async function loadProjects(url, token) {
    if (!url || !token) return;
    setTabLoading(prev => ({ ...prev, projects: true }));
    try {
      const data = await apiGet(url, token, { action: 'projects' });
      setProjects(data.projects || []);
    } catch (err) {
      setError(err.message);
    }
    setTabLoading(prev => ({ ...prev, projects: false }));
  }

  async function loadGoals(url, token) {
    if (!url || !token) return;
    setTabLoading(prev => ({ ...prev, goals: true }));
    try {
      const data = await apiGet(url, token, { action: 'goals' });
      setGoals(data.goals || []);
    } catch (err) {
      setError(err.message);
    }
    setTabLoading(prev => ({ ...prev, goals: false }));
  }

  async function loadInterests(url, token) {
    if (!url || !token) return;
    setTabLoading(prev => ({ ...prev, interests: true }));
    try {
      const data = await apiGet(url, token, { action: 'interests' });
      setInterests(data.interests || []);
    } catch (err) {
      setError(err.message);
    }
    setTabLoading(prev => ({ ...prev, interests: false }));
  }

  async function loadShopping(url, token) {
    if (!url || !token) return;
    setTabLoading(prev => ({ ...prev, shopping: true }));
    try {
      const data = await apiGet(url, token, { action: 'shopping' });
      setShopping(data.stores || []);
    } catch (err) {
      setError(err.message);
    }
    setTabLoading(prev => ({ ...prev, shopping: false }));
  }

  async function loadPTO(url, token) {
    if (!url || !token) return;
    setTabLoading(prev => ({ ...prev, pto: true }));
    try {
      const data = await apiGet(url, token, { action: 'pto' });
      setPTO(data.stats || null);
    } catch (err) {
      setError('PTO load failed: ' + err.message);
    }
    setTabLoading(prev => ({ ...prev, pto: false }));
  }

  async function loadBudget(url, token) {
    if (!url || !token) return;
    setTabLoading(prev => ({ ...prev, finances: true }));
    try {
      const data = await apiGet(url, token, { action: 'budget' });
      setBudget(data || null);
    } catch (err) {
      setError('Budget load failed: ' + err.message);
    }
    setTabLoading(prev => ({ ...prev, finances: false }));
  }

  async function handleTriggerBuffer() {
    if (!window.confirm('Use one buffer day? This will decrement your buffer count.')) return;
    setBusy(true);
    try {
      const data = await apiGet(apiUrl, apiToken, { action: 'pto_trigger_buffer' });
      showToast('🛡️ Buffer day triggered — ' + data.remaining + ' remaining');
      // Refresh PTO stats so the dot count updates
      await loadPTO(apiUrl, apiToken);
    } catch (err) {
      setError('Could not trigger buffer day: ' + err.message);
    }
    setBusy(false);
  }

  async function handleToggleShopping(tabId, itemIndex, currentlyDone) {
    // Optimistic update
    setShopping(prev => prev.map(store =>
      store.tabId !== tabId ? store : {
        ...store,
        items: store.items.map(item =>
          item.index !== itemIndex ? item : { ...item, done: !currentlyDone }
        ),
      }
    ));
    try {
      await apiAction(apiUrl, apiToken, 'shopping_toggle', { tabId, index: itemIndex });
    } catch (err) {
      setError('Could not update item: ' + err.message);
      await loadShopping(apiUrl, apiToken); // revert to real state
    }
  }

  async function handleAddShoppingItem(tabId, text) {
    setBusy(true);
    try {
      await apiAction(apiUrl, apiToken, 'shopping_add', { tabId, text });
      showToast('✓ Item added');
      setAddItemModal(false);
      await loadShopping(apiUrl, apiToken);
    } catch (err) {
      setError('Could not add item: ' + err.message);
    }
    setBusy(false);
  }

  async function handleSaveTask({ id, task, dueDate, notes }) {
    setBusy(true);
    try {
      if (id) {
        await apiAction(apiUrl, apiToken, 'update_task', { id, task, dueDate: dueDate || '', notes: notes || '' });
        showToast('✓ Task updated');
      } else {
        await apiAction(apiUrl, apiToken, 'add_task', { task, dueDate: dueDate || '', notes: notes || '' });
        showToast('✓ Task added');
      }
      setTaskModal(null);
      await loadAll(apiUrl, apiToken, filterActive);
    } catch (err) {
      setError('Could not save task: ' + err.message);
    }
    setBusy(false);
  }

  async function handleCompleteProjectTask(rowNum) {
    setBusy(true);
    try {
      await apiGet(apiUrl, apiToken, { action: 'complete_project_task', row: rowNum });
      showToast('✓ Task marked done');
      loadProjects(apiUrl, apiToken);
    } catch (err) {
      setError('Could not complete task: ' + err.message);
    }
    setBusy(false);
  }

  async function handleSaveProjectTask({ task, priority, dueDate, notes }) {
    setBusy(true);
    try {
      if (projectTaskModal.mode === 'edit') {
        await apiGet(apiUrl, apiToken, {
          action: 'update_project_task',
          row: projectTaskModal.task.rowNum,
          task, priority, dueDate: dueDate || '', notes: notes || '',
        });
        showToast('✓ Task updated');
      } else {
        await apiGet(apiUrl, apiToken, {
          action: 'add_project_task',
          projectId: projectTaskModal.project.projectId,
          task, priority, dueDate: dueDate || '', notes: notes || '',
        });
        showToast('✓ Task added');
      }
      setProjectTaskModal(null);
      loadProjects(apiUrl, apiToken);
    } catch (err) {
      setError('Could not save task: ' + err.message);
    }
    setBusy(false);
  }

  async function handleDeleteProjectTask(rowNum) {
    if (!window.confirm('Delete this task? This cannot be undone.')) return;
    setBusy(true);
    try {
      await apiGet(apiUrl, apiToken, { action: 'delete_project_task', row: rowNum });
      showToast('✓ Task deleted');
      loadProjects(apiUrl, apiToken);
    } catch (err) {
      setError('Could not delete task: ' + err.message);
    }
    setBusy(false);
  }

  async function handleSaveGoal({ title, description, status, category, year, progress, notes }) {
    if (!title.trim()) return;
    setBusy(true);
    try {
      if (goalModal.mode === 'edit') {
        await apiGet(apiUrl, apiToken, {
          action: 'update_goal', id: goalModal.goal.id,
          title, description, status, category, year, progress, notes,
        });
        showToast('✓ Goal updated');
      } else {
        await apiGet(apiUrl, apiToken, {
          action: 'add_goal', title, description, status, category, year, notes,
        });
        showToast('✓ Goal added');
      }
      setGoalModal(null);
      loadGoals(apiUrl, apiToken);
    } catch (err) {
      setError('Could not save goal: ' + err.message);
    }
    setBusy(false);
  }

  async function handleSaveInterest({ person, interest, category, notes }) {
    if (!interest.trim()) return;
    setBusy(true);
    try {
      await apiGet(apiUrl, apiToken, { action: 'interests_add', person, interest, category, notes });
      showToast('💛 Interest logged');
      setInterestModal(false);
      loadInterests(apiUrl, apiToken);
    } catch (err) {
      setError('Could not log interest: ' + err.message);
    }
    setBusy(false);
  }

  async function handleDeleteInterest(id) {
    if (!window.confirm('Archive this interest?')) return;
    // Optimistic remove
    setInterests(prev => prev.filter(i => i.id !== id));
    try {
      await apiGet(apiUrl, apiToken, { action: 'interests_delete', id });
      showToast('✓ Interest archived');
    } catch (err) {
      setError('Could not archive interest: ' + err.message);
      loadInterests(apiUrl, apiToken); // revert
    }
  }

  function handleConnect(url, token) {
    setApiUrl(url);
    setApiToken(token);
    setShowSettings(false);
    loadAll(url, token, filterActive);
    loadProjects(url, token);
    loadGoals(url, token);
    loadInterests(url, token);
    loadShopping(url, token);
    loadPTO(url, token);
  }

  // ---- Render ----

  const isConfigured = apiUrl && apiToken;

  return (
    <>
      {/* Header */}
      <div className="header">
        <div className="logo">
          <span className="logo-name">VERA</span>
          <span className="logo-sub">Chief of Staff</span>
        </div>
        <div className="header-actions">
          {lastUpdated && (
            <span className="last-updated">Updated {timeAgo(lastUpdated)}</span>
          )}
          {isConfigured && (
            <button
              className="btn btn-refresh"
              style={{ fontSize: 12, padding: '5px 14px' }}
              disabled={loading}
              onClick={() => loadAll(apiUrl, apiToken, filterActive)}
            >
              {loading ? '⟳ Loading…' : '⟳ Refresh'}
            </button>
          )}
          <button className="btn-settings" onClick={() => setShowSettings(true)} title="Settings">⚙</button>
        </div>
      </div>

      {/* Task add/edit modal */}
      {taskModal && (
        <TaskFormModal
          task={taskModal.task || null}
          onSave={handleSaveTask}
          onClose={() => setTaskModal(null)}
          busy={busy}
        />
      )}

      {/* Project task add/edit modal */}
      {projectTaskModal && (
        <ProjectTaskModal
          mode={projectTaskModal.mode}
          task={projectTaskModal.task || null}
          onSave={handleSaveProjectTask}
          onClose={() => setProjectTaskModal(null)}
          busy={busy}
        />
      )}

      {/* Add shopping item modal */}
      {addItemModal && shopping.length > 0 && (
        <AddItemModal
          stores={shopping}
          onSave={handleAddShoppingItem}
          onClose={() => setAddItemModal(false)}
          busy={busy}
        />
      )}

      {/* Settings modal */}
      {showSettings && (
        <SettingsModal
          initial={{ url: apiUrl, token: apiToken }}
          onSave={handleConnect}
          onClose={isConfigured ? () => setShowSettings(false) : null}
        />
      )}

      {/* Not connected yet */}
      {!isConfigured && !showSettings && (
        <div className="main">
          <div className="empty-state">
            <div style={{ fontSize: 40, marginBottom: 16 }}>🔌</div>
            <div style={{ fontSize: 16, color: '#dde1f0', marginBottom: 8 }}>Not connected</div>
            <div style={{ marginBottom: 20 }}>Click the ⚙ icon to add your API URL and token</div>
          </div>
        </div>
      )}

      {/* Connected UI */}
      {isConfigured && (
        <>
          <StatusBar status={status} loading={loading} />

          <div className="tabs">
            {['home', 'chat', 'flags', 'tasks', 'projects', 'shopping', 'pto', 'travel', 'finances', 'milestones', 'goals', 'interests', 'summaries'].map(tab => (
              <button
                key={tab}
                className={`tab-btn ${activeTab === tab ? 'active' : ''}`}
                onClick={() => {
                  setActiveTab(tab);
                  if (tab === 'projects')  loadProjects(apiUrl, apiToken);
                  if (tab === 'goals')     loadGoals(apiUrl, apiToken);
                  if (tab === 'interests') loadInterests(apiUrl, apiToken);
                  if (tab === 'shopping')  loadShopping(apiUrl, apiToken);
                  if (tab === 'pto')       loadPTO(apiUrl, apiToken);
                  if (tab === 'travel')    loadPTO(apiUrl, apiToken); // upcomingTravel lives in PTO stats
                  if (tab === 'finances')  loadBudget(apiUrl, apiToken);
                }}
              >
                {tab === 'home'      ? `🏠 Home` : ''}
                {tab === 'chat'      ? `💬 Chat` : ''}
                {tab === 'flags'     ? `🚩 Flags${status ? ` (${status.activeFlags})` : ''}` : ''}
                {tab === 'tasks'     ? `✅ Tasks${tasks.length ? ` (${tasks.length})` : ''}` : ''}
                {tab === 'projects'  ? `📂 Projects${projects.length ? ` (${projects.length})` : ''}` : ''}
                {tab === 'goals'     ? `🎯 Yearly Goals${goals.length ? ` (${goals.length})` : ''}` : ''}
                {tab === 'interests' ? `💛 Interests${interests.length ? ` (${interests.length})` : ''}` : ''}
                {tab === 'shopping'  ? `🛒 Shopping` : ''}
                {tab === 'pto'       ? `🌴 PTO Planner` : ''}
                {tab === 'travel'    ? `✈️ Travel` : ''}
                {tab === 'finances'  ? `💰 Finances` : ''}
                {tab === 'milestones' ? `🎯 Milestones${milestones.length ? ` (${milestones.length})` : ''}` : ''}
                {tab === 'summaries'  ? `📊 Summaries` : ''}
              </button>
            ))}
          </div>

          <div className="main">
            {error && <div className="error-banner">⚠️ {error}</div>}

            {/* Flags tab */}
            {activeTab === 'flags' && (
              <>
                <div className="toolbar">
                  <button
                    className={`filter-toggle ${filterActive ? 'on' : ''}`}
                    onClick={() => setFilterActive(v => !v)}
                  >
                    {filterActive ? '● Active only' : '○ All flags'}
                  </button>
                  <span className="count-badge">{flags.length} shown</span>
                </div>

                {loading && flags.length === 0
                  ? <div className="loading-text">Loading flags…</div>
                  : flags.length === 0
                    ? <div className="empty-state">
                        <div style={{ fontSize: 32, marginBottom: 12 }}>🎉</div>
                        <div>No {filterActive ? 'active ' : ''}flags — you're all clear!</div>
                      </div>
                    : flags.map(flag => (
                        <FlagCard
                          key={flag.id}
                          flag={flag}
                          onAction={handleAction}
                          busy={busy}
                        />
                      ))
                }
              </>
            )}

            {/* Tasks tab */}
            {activeTab === 'tasks' && (
              <>
                <div className="toolbar">
                  <button
                    className="btn btn-primary"
                    style={{ fontSize: 12 }}
                    onClick={() => setTaskModal({ mode: 'add' })}
                  >
                    + Add Task
                  </button>
                  <span className="count-badge">{tasks.length} open</span>
                </div>
                {loading && tasks.length === 0
                  ? <div className="loading-text">Loading tasks…</div>
                  : tasks.length === 0
                    ? <div className="empty-state">No open tasks found in the Tasks tab.</div>
                    : tasks.map((task, i) => (
                        <TaskCard
                          key={task.id || i}
                          task={task}
                          onComplete={handleComplete}
                          onEdit={t => setTaskModal({ mode: 'edit', task: t })}
                          completing={!!completingIds[task.id]}
                        />
                      ))
                }
              </>
            )}

            {/* Summaries tab */}
            {activeTab === 'summaries' && (
              loading && summaries.length === 0
                ? <div className="loading-text">Loading summaries…</div>
                : <SummariesTab summaries={summaries} />
            )}

            {/* Home tab */}
            {activeTab === 'home' && (
              <HomeTab
                flags={flags}
                tasks={tasks}
                projects={projects}
                shopping={shopping}
                pto={pto}
                milestones={milestones}
                summaries={summaries}
                status={status}
                onNavigate={tab => {
                  setActiveTab(tab);
                  if (tab === 'projects')  loadProjects(apiUrl, apiToken);
                  if (tab === 'shopping')  loadShopping(apiUrl, apiToken);
                  if (tab === 'pto')       loadPTO(apiUrl, apiToken);
                }}
              />
            )}

            {/* Chat tab */}
            {activeTab === 'chat' && (
              <ChatPanel
                apiUrl={apiUrl}
                apiToken={apiToken}
                messages={chatMessages}
                setMessages={setChatMessages}
                input={chatInput}
                setInput={setChatInput}
              />
            )}

            {/* Projects tab */}
            {activeTab === 'projects' && (
              tabLoading.projects
                ? <div className="loading-text">Loading projects…</div>
                : <ProjectsTab
                    projects={projects}
                    onCompleteTask={handleCompleteProjectTask}
                    onAddTask={p => setProjectTaskModal({ mode: 'add', project: p })}
                    onEditTask={t => setProjectTaskModal({ mode: 'edit', task: t })}
                    onDeleteTask={handleDeleteProjectTask}
                    busy={busy}
                  />
            )}

            {/* Yearly Goals tab */}
            {activeTab === 'goals' && (
              tabLoading.goals
                ? <div className="loading-text">Loading goals…</div>
                : <GoalsTab
                    goals={goals}
                    dragGoalId={dragGoalId}
                    dragOverCol={dragOverCol}
                    onDragStart={id => setDragGoalId(id)}
                    onDragOver={col => setDragOverCol(col)}
                    onDrop={async (newStatus) => {
                      if (!dragGoalId || !newStatus) { setDragGoalId(null); setDragOverCol(null); return; }
                      const id = dragGoalId;
                      setDragGoalId(null);
                      setDragOverCol(null);
                      // Optimistic update
                      setGoals(prev => prev.map(g => g.id === id ? { ...g, status: newStatus } : g));
                      try {
                        await apiGet(apiUrl, apiToken, { action: 'update_goal', id, status: newStatus });
                      } catch (err) {
                        setError('Failed to move goal: ' + err.message);
                        loadGoals(apiUrl, apiToken);
                      }
                    }}
                    onAddGoal={status => setGoalModal({ mode: 'add', status: status || 'To Do' })}
                    onEditGoal={g => setGoalModal({ mode: 'edit', goal: g })}
                    onDeleteGoal={async (id) => {
                      if (!window.confirm('Delete this goal?')) return;
                      setGoals(prev => prev.filter(g => g.id !== id));
                      try {
                        await apiGet(apiUrl, apiToken, { action: 'delete_goal', id });
                      } catch (err) {
                        setError('Failed to delete goal: ' + err.message);
                        loadGoals(apiUrl, apiToken);
                      }
                    }}
                    busy={busy}
                  />
            )}

            {/* Shared Interests tab */}
            {activeTab === 'interests' && (
              tabLoading.interests
                ? <div className="loading-text">Loading interests…</div>
                : <SharedInterestTab
                    interests={interests}
                    onDelete={handleDeleteInterest}
                    onAdd={() => setInterestModal(true)}
                    busy={busy}
                  />
            )}

            {/* Shopping tab */}
            {activeTab === 'shopping' && (
              tabLoading.shopping
                ? <div className="loading-text">Loading shopping lists…</div>
                : <ShoppingTab
                    stores={shopping}
                    onToggle={handleToggleShopping}
                    onAddItem={() => setAddItemModal(true)}
                    busy={busy}
                  />
            )}

            {/* PTO tab */}
            {activeTab === 'pto' && (
              tabLoading.pto
                ? <div className="loading-text">Loading PTO data…</div>
                : <PTOTab
                    stats={pto}
                    onTriggerBuffer={handleTriggerBuffer}
                    busy={busy}
                  />
            )}

            {/* Travel tab */}
            {activeTab === 'travel' && (
              tabLoading.pto
                ? <div className="loading-text">Loading travel data…</div>
                : <TravelTab pto={pto} />
            )}

            {/* Finances tab */}
            {activeTab === 'finances' && (
              <FinancesTab
                summaries={summaries}
                budget={budget}
                budgetLoading={!!tabLoading.finances}
              />
            )}

            {/* Milestones tab */}
            {activeTab === 'milestones' && (
              <MilestonesTab
                milestones={milestones}
                flags={flags}
                tasks={tasks}
                onAction={handleAction}
                busy={busy}
              />
            )}
          </div>
        </>
      )}

      {/* Goal modal */}
      {goalModal && (
        <GoalModal
          mode={goalModal.mode}
          goal={goalModal.goal}
          defaultStatus={goalModal.status}
          onSave={handleSaveGoal}
          onClose={() => setGoalModal(null)}
          busy={busy}
        />
      )}

      {/* Add Interest modal */}
      {interestModal && (
        <AddInterestModal
          onSave={handleSaveInterest}
          onClose={() => setInterestModal(false)}
          busy={busy}
        />
      )}

      {/* Toast notification */}
      {toast && (
        <div className={`toast${toast.isError ? ' error' : ''}`}>
          {toast.msg}
        </div>
      )}
    </>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
