name: Deploy to Apps Script

on:
  push:
    branches: [main]
    paths:
      - '*.js'
      - 'appsscript.json'
      - '!playwright.config.js'
      # A change to the cadence should exercise the cadence. Without these two, the
      # commit that rewrites the decision logic is the one commit that never runs it,
      # and the first real test is an unrelated push days later. Such a run pushes
      # (free, idempotent) and reports; it mints nothing unless it is marked.
      - '.github/workflows/deploy.yml'
      - 'scripts/*.js'
  # The weekly reconcile. It lives in THIS file so it inherits the concurrency group
  # below and can never race regression.yml for the live /exec. Sunday 13:37 ET —
  # regression.yml has no schedule, so nothing else in the group wakes then, and
  # minute 37 keeps it out of the on-the-hour queue every other cron in the world
  # joins.
  schedule:
    - cron: '37 17 * * 0'
  workflow_dispatch:

# Read by the deploy and by the drift check. It was inline in one place until the
# drift check needed it too, and two copies of a deployment id is one too many.
env:
  DEPLOYMENT_ID: AKfycbx1PHRWmKbmHcVoVx0l-sVaCwWvaXceq-h55Xi-MA06zfUNDdfipM7B0HL4Gzm0IMta

# Shares a group with regression.yml so the two never hold the live /exec at once —
# see the comment there for what it cost. Queue, never cancel: a deploy interrupted
# part way through re-pointing a deployment is the one outcome worse than a slow one.
# But a group holds one running and ONE pending run: a third arrival replaces the
# pending one, even with cancel-in-progress false. Two pushes to main a few seconds
# apart (Oct 26: a test fix, then its [deploy]) lost the deploy that way — it showed
# "cancelled" after a second. Push to main once the group is idle, not back to back.
concurrency:
  group: vera-live-exec
  cancel-in-progress: false

jobs:
  # Nothing but `node --check` used to stand between a push and the live Apps Script
  # project, so a commit that broke the period keys or the perk cleanup deployed to
  # the running assistant and was found out afterwards. This is the node tests and the
  # control runners — about fifteen seconds — and the deploy waits for it.
  #
  # The browser tests are deliberately NOT a gate: a dashboard layout test cannot tell
  # you anything about the .js files being pushed here, and making an Apps Script fix
  # wait three minutes on Chromium would be a tax with no return. They run in their own
  # workflow, where they still block that workflow.
  #
  # If a test is wrong and something urgent is broken, workflow_dispatch above still
  # deploys by hand.
  fast:
    name: tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
        run: npm ci --no-audit --no-fund

      - name: Run tests
        run: node tests/run.js --node --controls

  # A PUSH IS FREE; A DEPLOY SPENDS ONE OF 200 NON-DELETABLE VERSIONS.
  #
  # `clasp push` updates the project, and that is what time-driven triggers and the
  # Apps Script editor run — nightlyRun, the morning email, every tb* testbench
  # function is live the moment the push lands. `clasp deploy` mints a VERSION, and
  # only the /exec web app that both dashboards call serves it. Google caps a project
  # at 200 versions and offers no API to delete one; they are cleared by hand in the
  # editor, and the ceiling blocked a deploy once already.
  #
  # So this job ALWAYS pushes and only sometimes deploys:
  #
  #   commit marked [deploy]   a change /exec serves       → version
  #   workflow_dispatch        the manual escape hatch     → version
  #   Sunday reconcile         only if /exec fell behind   → version, or nothing
  #   anything else            trigger/editor-only change  → push only
  #
  # The reconcile is what makes opt-in safe. A forgotten marker costs at most a week
  # of /exec lag, and costs no version at all when nothing drifted.
  deploy:
    needs: [fast]
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      # Full history on purpose. The weekly reconcile asks whether anything Apps
      # Script SERVES has changed since the deployed commit, which means diffing
      # against that commit — and a depth-1 checkout does not contain it.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install clasp
        run: npm install -g @google/clasp

      - name: Restore clasp credentials
        env:
          CLASPRC_JSON: ${{ secrets.CLASPRC_JSON }}
        run: |
          if [ -z "$CLASPRC_JSON" ]; then
            echo "ERROR: CLASPRC_JSON secret is not set. Add it under Settings > Secrets and variables > Actions." >&2
            exit 1
          fi
          echo "$CLASPRC_JSON" > "$HOME/.clasprc.json"

      - name: Syntax-check every Apps Script file before pushing
        run: |
          for f in *.js; do
            [ "$f" = "playwright.config.js" ] && continue
            echo "checking $f"
            node --check "$f"
          done

      - name: Push to Apps Script
        run: clasp push --force

      - name: Decide whether to deploy
        id: decide
        env:
          # Every commit in the push, so a push of several deploys if ANY of them
          # warrants it. The marker is read by a script and not by
          # `contains(toJSON(...), '[deploy]')`, because that expression matched the
          # BODY of the commit that introduced this cadence — prose explaining what
          # the marker means — and spent a version on a commit written to demonstrate
          # a skipped deploy. Only a subject line can opt in now; see
          # scripts/deploy-marker.js.
          COMMIT_MESSAGES: ${{ toJSON(github.event.commits.*.message) }}
          EVENT: ${{ github.event_name }}
        run: |
          HEAD_SHA=$(git rev-parse --short=7 HEAD)
          MARKER=$(printf '%s' "$COMMIT_MESSAGES" | node "$GITHUB_WORKSPACE/scripts/deploy-marker.js")

          SHOULD=false
          REASON=skip
          if [ "$EVENT" = "workflow_dispatch" ]; then
            SHOULD=true; REASON=manual
          elif [ "$MARKER" = "true" ]; then
            SHOULD=true; REASON=marker
          fi

          # Read what /exec is actually serving. Needed for the drift decision on a
          # scheduled run, and for the skip report on every other run — "deploy
          # skipped" without the two shas beside it is how divergence turns into a
          # mystery. A clasp that cannot answer must not fail the job, hence `|| true`.
          OUT=$(clasp deployments 2>&1) || true
          DEPLOYED=$(printf '%s' "$OUT" | node "$GITHUB_WORKSPACE/scripts/clasp-parse.js" deployed-sha "$DEPLOYMENT_ID" | cut -c1-7)

          # DRIFT IS NOT "main MOVED". A commit touching only tests, docs or this
          # workflow moves main without changing a single file clasp pushes, and
          # comparing shas would then find drift every week for ever — one version
          # every Sunday to re-deploy identical code, which is worse than the waste
          # this cadence exists to stop. So the question is whether anything /exec SERVES
          # has changed since the deployed commit, which is the same set of files as
          # the push filter at the top of this workflow.
          if [ "$EVENT" = "schedule" ] && [ "$SHOULD" != "true" ]; then
            if [ -z "$DEPLOYED" ]; then
              # FAIL OPEN. An unreadable description costs at most one version a week;
              # failing closed would mean /exec lags forever and the log says nothing.
              SHOULD=true; REASON=drift-unknown
            elif [ "$DEPLOYED" = "$HEAD_SHA" ]; then
              echo "/exec is serving HEAD."
            elif ! git cat-file -e "$DEPLOYED^{commit}" 2>/dev/null; then
              # The sha is readable but not in this history — a force-push, or a
              # deploy made from somewhere else. Unknowable, so deploy.
              SHOULD=true; REASON=drift-unknown
            else
              CHANGED=$(git diff --name-only "$DEPLOYED" HEAD -- '*.js' 'appsscript.json' \
                | grep -v '/' | grep -v '^playwright\.config\.js$' || true)
              if [ -n "$CHANGED" ]; then
                SHOULD=true; REASON=drift
                echo "changed since $DEPLOYED: $(echo "$CHANGED" | tr '\n' ' ')"
              else
                echo "main has moved since $DEPLOYED, but nothing Apps Script serves changed."
              fi
            fi
          fi

          echo "head=$HEAD_SHA"       >> "$GITHUB_OUTPUT"
          echo "deployed=$DEPLOYED"   >> "$GITHUB_OUTPUT"
          echo "should=$SHOULD"       >> "$GITHUB_OUTPUT"
          echo "reason=$REASON"       >> "$GITHUB_OUTPUT"
          echo "event=$EVENT, marker=$MARKER, head=$HEAD_SHA, deployed=${DEPLOYED:-unreadable} -> deploy=$SHOULD ($REASON)"

      # THIS STEP MUST NEVER FAIL THE JOB. It reports headroom; a clasp whose output
      # shifts shape would otherwise be able to block a deploy on the strength of a
      # warning nobody asked for.
      - name: Warn near the version ceiling
        continue-on-error: true
        run: |
          OUT=$(clasp versions 2>&1) || true
          N=$(printf '%s' "$OUT" | node "$GITHUB_WORKSPACE/scripts/clasp-parse.js" version-count)
          if [ -z "$N" ]; then
            echo "::notice::Could not read the version count from clasp. Headroom below 200 is unknown."
          elif [ "$N" -ge 180 ]; then
            echo "::warning::$N of 200 Apps Script versions used. There is no API to delete one — open the Apps Script editor (Deploy > Manage deployments / project history) and clear old versions before the ceiling blocks a deploy."
          else
            echo "$N of 200 versions used."
          fi

      - name: Deploy new version
        if: steps.decide.outputs.should == 'true'
        env:
          REASON: ${{ steps.decide.outputs.reason }}
        run: |
          # Push has already succeeded by this point. If the deploy fails, head
          # and /exec have silently diverged — the new code is in the project but
          # the web app both dashboards call is still serving the old version.
          # That is the fact worth surfacing, and a bare non-zero exit hides it.
          #
          # The DESCRIPTION IS LOAD-BEARING: the weekly reconcile reads the sha back
          # out of it to decide whether /exec has fallen behind. "Auto-deploy <sha>"
          # is the contract, parsed by scripts/clasp-parse.js and asserted by
          # tests/source/test_deploycadence.js. Prettify it and the reconcile
          # silently stops reconciling.
          set +e
          OUT=$(clasp deploy --deploymentId "$DEPLOYMENT_ID" \
            --description "Auto-deploy $(git rev-parse --short HEAD)" 2>&1)
          CODE=$?
          echo "$OUT"
          if [ $CODE -ne 0 ]; then
            echo "::error::Code was PUSHED to Apps Script but NOT deployed. /exec is still serving the previous version."
            if echo "$OUT" | grep -q "limit of 200 versions"; then
              echo "::error::Cause: the script is at the 200-version ceiling. Free up versions in the Apps Script editor, then re-run this workflow."
              echo "::error::Meanwhile, functions run from the Apps Script EDITOR use the pushed head code, so manual runs already have this change."
            fi
            exit $CODE
          fi
          echo "Deployed $(git rev-parse --short HEAD) to /exec (reason: $REASON)."

      - name: Report skipped deploy
        if: steps.decide.outputs.should != 'true'
        env:
          HEAD_SHA: ${{ steps.decide.outputs.head }}
          DEPLOYED: ${{ steps.decide.outputs.deployed }}
          # WebApp.js is the only doGet/doPost file and its switch is every dashboard
          # action, so a change to it is the likeliest forgotten marker. This is a
          # warning, not reachability analysis — a dashboard-served change in any
          # other file still needs the marker.
          WEBAPP_TOUCHED: ${{ contains(toJSON(github.event.commits.*.modified), 'WebApp.js') || contains(toJSON(github.event.commits.*.added), 'WebApp.js') }}
        run: |
          MSG="Pushed $HEAD_SHA to Apps Script; no version minted. /exec is serving ${DEPLOYED:-an unreadable version}."
          echo "::notice::$MSG"
          {
            echo "### Deploy skipped"
            echo ""
            echo "$MSG"
            echo ""
            echo "Triggers and the Apps Script editor already run this code. To put it on /exec:"
            echo "mark a commit \`[deploy]\`, or run this workflow by hand. The Sunday reconcile"
            echo "will deploy it anyway if it is still behind."
          } >> "$GITHUB_STEP_SUMMARY"
          if [ "$WEBAPP_TOUCHED" = "true" ]; then
            echo "::warning::This push changed WebApp.js — the /exec entry point — but was not marked [deploy], so the dashboards are still calling the old version."
          fi

      - name: Notify Slack on failure
        if: failure()
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        run: |
          if [ -z "$SLACK_WEBHOOK_URL" ]; then
            echo "SLACK_WEBHOOK_URL not set — skipping Slack notification"
            exit 0
          fi
          COMMIT_MSG=$(git log -1 --pretty=format:%s)
          COMMIT_SHA=$(git rev-parse --short HEAD)
          curl -sX POST "$SLACK_WEBHOOK_URL" \
            -H "Content-Type: application/json" \
            -d "{\"text\":\"❌ VERA Apps Script deploy *failed* after push to \`main\`\n\`${COMMIT_SHA}\` ${COMMIT_MSG}\"}"
