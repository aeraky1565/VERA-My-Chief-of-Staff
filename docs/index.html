function StarRating({ value, onChange, size }) {
  const sz = size || 16;
  return (
    <span style={{ display: 'inline-flex', gap: 2 }}>
      {[1,2,3,4,5].map(n => (
        <span
          key={n}
          onClick={onChange ? () => onChange(n) : undefined}
          style={{
            fontSize: sz, lineHeight: 1,
            color: n <= (value || 0) ? '#c9a84c' : '#2a4070',
            cursor: onChange ? 'pointer' : 'default',
            userSelect: 'none',
          }}
        >★</span>
      ))}
    </span>
  );
}

function TakeoutsView({ takeouts, loading, busy, onAddRestaurant, onDeleteRestaurant, onAddItem, onDeleteItem }) {
  const [expanded,    setExpanded]    = React.useState({});
  const [addRestModal, setAddRestModal] = React.useState(false);
  const [addItemFor,   setAddItemFor]   = React.useState(null); // restaurant name

  // Add Restaurant form state
  const [restForm, setRestForm] = React.useState({ name: '', cuisine: '', phone: '', website: '', rating: 0, notes: '' });
  // Add Item form state
  const [itemForm, setItemForm] = React.useState({ item: '', description: '', rating: 0, notes: '' });

  function toggleExpand(name) {
    setExpanded(prev => ({ ...prev, [name]: !prev[name] }));
  }

  function openAddItem(restName) {
    setItemForm({ item: '', description: '', rating: 0, notes: '' });
    setAddItemFor(restName);
  }

  function openAddRest() {
    setRestForm({ name: '', cuisine: '', phone: '', website: '', rating: 0, notes: '' });
    setAddRestModal(true);
  }

  if (loading) return <div style={{ fontSize: 13, color: '#6b7fa8', padding: 16 }}>Loading takeouts…</div>;

  const inputStyle = {
    width: '100%', padding: '7px 10px', borderRadius: 6,
    background: '#0a1628', border: '1px solid #1e3060',
    color: '#dde1f0', fontSize: 13, boxSizing: 'border-box',
  };
  const labelStyle = { fontSize: 11, color: '#6b7fa8', marginBottom: 4, display: 'block' };

  return (
    <div>
      {/* Add Restaurant button */}
      <div style={{ display: 'flex', justifyContent: 'flex-end', marginBottom: 16 }}>
        <button className="btn btn-primary" style={{ fontSize: 12 }} disabled={busy} onClick={openAddRest}>
          ＋ Add Restaurant
        </button>
      </div>

      {/* Empty state */}
      {!takeouts.length && (
        <div className="empty-state" style={{ marginTop: 8 }}>
          <div style={{ fontSize: 32, marginBottom: 12 }}>🥡</div>
          <div style={{ color: '#dde1f0', marginBottom: 6 }}>No favorite takeouts yet</div>
          <div style={{ fontSize: 12, color: '#4d6080' }}>Click "＋ Add Restaurant" to get started.</div>
        </div>
      )}

      {/* Restaurant list */}
      {takeouts.map((r, i) => (
        <div key={i} style={{
          marginBottom: 10, borderRadius: 10,
          background: '#0d1b3e', border: '1px solid #1e3060', overflow: 'hidden',
        }}>
          {/* Restaurant header row */}
          <div style={{ display: 'flex', alignItems: 'center', gap: 10, padding: '12px 16px', flexWrap: 'wrap' }}>
            {/* Expand toggle */}
            <button
              onClick={() => toggleExpand(r.name)}
              style={{ background: 'none', border: 'none', cursor: 'pointer', color: '#8a9abf', fontSize: 14, padding: 0, flexShrink: 0 }}
            >{expanded[r.name] ? '▾' : '▸'}</button>

            {/* Name */}
            <span style={{ fontSize: 14, fontWeight: 700, color: '#dde1f0', flex: 1, minWidth: 100 }}>{r.name}</span>

            {/* Cuisine badge */}
            {r.cuisine && (
              <span style={{ fontSize: 10, padding: '2px 8px', borderRadius: 10, border: '1px solid #2a4070', color: '#8899cc' }}>{r.cuisine}</span>
            )}

            {/* Star rating */}
            <StarRating value={r.rating} size={14} />

            {/* Item count */}
            <span style={{ fontSize: 11, color: '#6b7fa8' }}>
              {r.items.length} item{r.items.length !== 1 ? 's' : ''}
            </span>

            {/* Phone */}
            {r.phone && (
              <a href={'tel:' + r.phone} style={{ fontSize: 11, color: '#5c9eff', textDecoration: 'none' }} title={r.phone}>📞</a>
            )}

            {/* Website */}
            {r.website && (
              <a href={r.website} target="_blank" rel="noopener noreferrer" style={{ fontSize: 11, color: '#5c9eff', textDecoration: 'none' }}>🔗</a>
            )}

            {/* Delete restaurant */}
            <button
              onClick={() => onDeleteRestaurant(r.name)}
              disabled={busy}
              style={{ background: 'none', border: 'none', cursor: busy ? 'wait' : 'pointer', color: '#5f3a3a', fontSize: 13, padding: '0 2px', flexShrink: 0 }}
              title="Delete restaurant and all its items"
            >🗑</button>
          </div>

          {/* Expanded items */}
          {expanded[r.name] && (
            <div style={{ borderTop: '1px solid #1a2d5a', padding: '8px 16px 12px' }}>
              {r.notes && (
                <div style={{ fontSize: 11, color: '#4d6080', marginBottom: 8, fontStyle: 'italic' }}>{r.notes}</div>
              )}

              {r.items.length === 0 && (
                <div style={{ fontSize: 12, color: '#4d6080', marginBottom: 8 }}>No items yet — add your favorites below.</div>
              )}

              {r.items.map((it, j) => (
                <div key={j} style={{
                  display: 'flex', alignItems: 'flex-start', gap: 10,
                  padding: '8px 0', borderBottom: j < r.items.length - 1 ? '1px solid #131f3a' : 'none',
                }}>
                  <div style={{ flex: 1 }}>
                    <div style={{ display: 'flex', alignItems: 'center', gap: 8, flexWrap: 'wrap' }}>
                      <span style={{ fontSize: 13, fontWeight: 600, color: '#dde1f0' }}>{it.item}</span>
                      <StarRating value={it.rating} size={12} />
                    </div>
                    {it.description && (
                      <div style={{ fontSize: 11, color: '#6b7fa8', marginTop: 2 }}>{it.description}</div>
                    )}
                    {it.notes && (
                      <div style={{ fontSize: 11, color: '#4d6080', marginTop: 1, fontStyle: 'italic' }}>{it.notes}</div>
                    )}
                  </div>
                  <button
                    onClick={() => onDeleteItem(it.row)}
                    disabled={busy}
                    style={{ background: 'none', border: 'none', cursor: busy ? 'wait' : 'pointer', color: '#5f3a3a', fontSize: 12, padding: 0, flexShrink: 0 }}
                    title="Remove item"
                  >✕</button>
                </div>
              ))}

              <button
                onClick={() => openAddItem(r.name)}
                disabled={busy}
                style={{
                  marginTop: 10, background: 'none', border: '1px dashed #2a4070',
                  borderRadius: 6, color: '#8a9abf', fontSize: 12,
                  padding: '5px 14px', cursor: busy ? 'wait' : 'pointer', width: '100%',
                }}
              >＋ Add Item</button>
            </div>
          )}
        </div>
      ))}

      {/* Add Restaurant Modal */}
      {addRestModal && (
        <div className="modal-overlay" onClick={() => setAddRestModal(false)}>
          <div className="modal-box" style={{ maxWidth: 420 }} onClick={e => e.stopPropagation()}>
            <div style={{ fontWeight: 700, fontSize: 15, color: '#dde1f0', marginBottom: 14 }}>🥡 Add Restaurant</div>

            <label style={labelStyle}>Restaurant Name *</label>
            <input style={{ ...inputStyle, marginBottom: 10 }} placeholder="e.g. Tony's Pizza"
              value={restForm.name} onChange={e => setRestForm(f => ({ ...f, name: e.target.value }))} />

            <div style={{ display: 'flex', gap: 10, marginBottom: 10 }}>
              <div style={{ flex: 1 }}>
                <label style={labelStyle}>Cuisine</label>
                <input style={inputStyle} placeholder="e.g. Italian"
                  value={restForm.cuisine} onChange={e => setRestForm(f => ({ ...f, cuisine: e.target.value }))} />
              </div>
              <div style={{ flex: 1 }}>
                <label style={labelStyle}>Phone</label>
                <input style={inputStyle} placeholder="Optional"
                  value={restForm.phone} onChange={e => setRestForm(f => ({ ...f, phone: e.target.value }))} />
              </div>
            </div>

            <label style={labelStyle}>Website</label>
            <input style={{ ...inputStyle, marginBottom: 10 }} placeholder="https://..."
              value={restForm.website} onChange={e => setRestForm(f => ({ ...f, website: e.target.value }))} />

            <label style={labelStyle}>Rating</label>
            <div style={{ marginBottom: 10 }}>
              <StarRating value={restForm.rating} size={22} onChange={n => setRestForm(f => ({ ...f, rating: n }))} />
            </div>

            <label style={labelStyle}>Notes</label>
            <input style={{ ...inputStyle, marginBottom: 16 }} placeholder="Optional"
              value={restForm.notes} onChange={e => setRestForm(f => ({ ...f, notes: e.target.value }))} />

            <div style={{ display: 'flex', gap: 10, justifyContent: 'flex-end' }}>
              <button className="btn" style={{ fontSize: 13 }} onClick={() => setAddRestModal(false)}>Cancel</button>
              <button className="btn btn-primary" style={{ fontSize: 13 }} disabled={busy || !restForm.name.trim()}
                onClick={() => { onAddRestaurant(restForm); setAddRestModal(false); }}>
                Save Restaurant
              </button>
            </div>
          </div>
        </div>
      )}

      {/* Add Item Modal */}
      {addItemFor && (
        <div className="modal-overlay" onClick={() => setAddItemFor(null)}>
          <div className="modal-box" style={{ maxWidth: 380 }} onClick={e => e.stopPropagation()}>
            <div style={{ fontWeight: 700, fontSize: 15, color: '#dde1f0', marginBottom: 4 }}>＋ Add Item</div>
            <div style={{ fontSize: 12, color: '#6b7fa8', marginBottom: 14 }}>for <strong style={{ color: '#c9a84c' }}>{addItemFor}</strong></div>

            <label style={labelStyle}>Item Name *</label>
            <input style={{ ...inputStyle, marginBottom: 10 }} placeholder="e.g. Pepperoni Pizza"
              value={itemForm.item} onChange={e => setItemForm(f => ({ ...f, item: e.target.value }))} />

            <label style={labelStyle}>Description</label>
            <input style={{ ...inputStyle, marginBottom: 10 }} placeholder="Optional"
              value={itemForm.description} onChange={e => setItemForm(f => ({ ...f, description: e.target.value }))} />

            <label style={labelStyle}>Rating</label>
            <div style={{ marginBottom: 10 }}>
              <StarRating value={itemForm.rating} size={22} onChange={n => setItemForm(f => ({ ...f, rating: n }))} />
            </div>

            <label style={labelStyle}>Notes</label>
            <input style={{ ...inputStyle, marginBottom: 16 }} placeholder="Optional"
              value={itemForm.notes} onChange={e => setItemForm(f => ({ ...f, notes: e.target.value }))} />

            <div style={{ display: 'flex', gap: 10, justifyContent: 'flex-end' }}>
              <button className="btn" style={{ fontSize: 13 }} onClick={() => setAddItemFor(null)}>Cancel</button>
              <button className="btn btn-primary" style={{ fontSize: 13 }} disabled={busy || !itemForm.item.trim()}
                onClick={() => { onAddItem(addItemFor, itemForm); setAddItemFor(null); }}>
                Save Item
              </button>
            </div>
          </div>
        </div>
      )}
    </div>
  );
}

function RecipeView({ recipes, loading, busy, onAddToShopping }) {
  if (loading) return <div style={{ fontSize: 13, color: '#6b7fa8', padding: 16 }}>Loading recipes…</div>;
  if (!recipes.length) return (
    <div className="empty-state" style={{ marginTop: 8 }}>
      <div style={{ fontSize: 32, marginBottom: 12 }}>🍽️</div>
      <div style={{ color: '#dde1f0', marginBottom: 6 }}>No recipes yet</div>
      <div style={{ fontSize: 12, color: '#4d6080' }}>Add rows to the Recipes tab in your Life OS sheet.</div>
    </div>
  );

  return (
    <div>
      {recipes.map((r, i) => {
        const ingCount = r.ingredients ? r.ingredients.split(';').filter(s => s.trim()).length : 0;
        return (
          <div key={i} style={{ padding: '12px 0', borderBottom: '1px solid #0d1b3e' }}>
            <div style={{ display: 'flex', alignItems: 'center', gap: 8, flexWrap: 'wrap' }}>
              <span style={{ fontSize: 14, fontWeight: 600, color: '#dde1f0', flex: 1, minWidth: 120 }}>{r.name}</span>
              {r.cuisine && <span style={{ fontSize: 10, padding: '1px 7px', borderRadius: 10, border: '1px solid #2a4070', color: '#8899cc' }}>{r.cuisine}</span>}
              {r.link && (
                <a href={r.link} target="_blank" rel="noopener noreferrer"
                  style={{ fontSize: 11, color: '#5c9eff', textDecoration: 'none' }}>🔗 Open</a>
              )}
              <button
                style={{ fontSize: 11, padding: '3px 10px', borderRadius: 12, border: '1px solid #2a4070', background: 'none', color: '#8899cc', cursor: ingCount ? 'pointer' : 'not-allowed', opacity: ingCount ? 1 : 0.4, whiteSpace: 'nowrap' }}
                onClick={() => ingCount && onAddToShopping(r.row, r.name)}
                disabled={busy || !ingCount}
                title={ingCount ? `Add ${ingCount} ingredients to Shopping List` : 'No ingredients listed'}
              >📋 Add to Shopping</button>
            </div>
            <div style={{ display: 'flex', gap: 14, marginTop: 5, flexWrap: 'wrap' }}>
              {r.servings  && <span style={{ fontSize: 11, color: '#6b7fa8' }}>👥 {r.servings} servings</span>}
              {r.prepTime  && <span style={{ fontSize: 11, color: '#6b7fa8' }}>⏱ {r.prepTime}</span>}
              {ingCount > 0 && <span style={{ fontSize: 11, color: '#6b7fa8' }}>🥕 {ingCount} ingredient{ingCount !== 1 ? 's' : ''}</span>}
              {r.tags      && <span style={{ fontSize: 11, color: '#6b7fa8' }}>🏷 {r.tags}</span>}
            </div>
            {r.notes && <div style={{ fontSize: 11, color: '#4d6080', marginTop: 3 }}>{r.notes}</div>}
          </div>
        );
      })}
    </div>
  );
}

// ── Important Dates ──────────────────────────────────────────────────────────

function ImportantDatesView({ dates, loading, busy, onAdd, onDelete, onUpdate,
                              onPreviewCalendar, onImportCalendar,
                              calPreviews, calPreviewLoading }) {
  var [expanded,        setExpanded]        = React.useState({});
  var [showAddModal,    setShowAddModal]    = React.useState(false);
  var [editEntry,       setEditEntry]       = React.useState(null);   // entry being edited
  var [prefillPerson,   setPrefillPerson]   = React.useState('');
  var [addingPerson,    setAddingPerson]    = React.useState(false);
  var [newPersonName,   setNewPersonName]   = React.useState('');
  var [showImportModal, setShowImportModal] = React.useState(false);
  var [selectedImport,  setSelectedImport]  = React.useState({});     // { person: true/false }
  // Add/edit form state
  var [form, setForm] = React.useState({ label:'', person:'', date:'', recurring:'Yes', leadTime:'30', notes:'' });
  var [dateMode, setDateMode] = React.useState('annual'); // 'annual' | 'onetime'

  if (loading) return <div className="loading-text">Loading important dates…</div>;

  // Enrich each date with computed daysUntil
  var enriched = dates.map(function(d) {
    return Object.assign({}, d, { _days: daysUntil(String(d.Date || '')) });
  }).sort(function(a,b) { return a._days - b._days; });

  // Coming Up: ≤90 days and not passed
  var comingUp = enriched.filter(function(d) { return d._days >= 0 && d._days <= 90; });

  // Group by Person
  var byPerson = {};
  enriched.forEach(function(d) {
    var p = String(d.Person || 'Unknown');
    if (!byPerson[p]) byPerson[p] = [];
    byPerson[p].push(d);
  });
  // Unique sorted people list
  var people = Object.keys(byPerson).sort();

  function togglePerson(name) {
    setExpanded(function(prev) { var n = Object.assign({}, prev); n[name] = !n[name]; return n; });
  }

  function openAddFor(person) {
    setPrefillPerson(person || '');
    setForm({ label: '', person: person || '', date: '', recurring: 'Yes', leadTime: '30', notes: '' });
    setDateMode('annual');
    setEditEntry(null);
    setShowAddModal(true);
  }

  function openEdit(entry) {
    var isAnnual = /^\d{2}-\d{2}$/.test(String(entry.Date || ''));
    setForm({
      label:     String(entry.Label     || ''),
      person:    String(entry.Person    || ''),
      date:      String(entry.Date      || ''),
      recurring: String(entry.Recurring || 'Yes'),
      leadTime:  String(entry['Lead Time Days'] || '30'),
      notes:     String(entry.Notes     || ''),
    });
    setDateMode(isAnnual ? 'annual' : 'onetime');
    setEditEntry(entry);
    setShowAddModal(true);
  }

  function submitForm() {
    if (!form.label.trim() || !form.date.trim()) return;
    var fields = Object.assign({}, form, { leadTime: form.leadTime || '30' });
    if (editEntry) {
      onUpdate(editEntry.ID, fields);
    } else {
      onAdd(fields);
    }
    setShowAddModal(false);
    setEditEntry(null);
  }

  function submitNewPerson() {
    var name = newPersonName.trim();
    if (!name) return;
    // Adding a standalone person (no dates yet) is a UI-only concept;
    // the person section will appear when their first date is added.
    // For now, auto-open "Add date" for them.
    setNewPersonName('');
    setAddingPerson(false);
    openAddFor(name);
  }

  function startImport() {
    onPreviewCalendar();
    setShowImportModal(true);
  }

  function confirmImport() {
    var entries = (calPreviews || []).filter(function(p) { return selectedImport[p.person] !== false; });
    if (entries.length) onImportCalendar(entries);
    setShowImportModal(false);
    setSelectedImport({});
  }

  var dotStyle = function(u) {
    if (!u) return {};
    return { fontSize: 11, marginRight: 6 };
  };

  var formatDate = function(dateStr, recurring) {
    var s = String(dateStr || '');
    if (/^\d{2}-\d{2}$/.test(s)) {
      var months = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
      var p = s.split('-');
      return months[parseInt(p[0],10)-1] + ' ' + parseInt(p[1],10);
    }
    return s;
  };

  return (
    <div style={{ maxWidth: 600 }}>
      {/* Header actions */}
      <div style={{ display: 'flex', gap: 8, marginBottom: 16, flexWrap: 'wrap' }}>
        <button onClick={() => openAddFor('')}
          style={{ fontSize: 12, background: '#1a3a6e', color: '#a0c0ff', border: 'none',
                   borderRadius: 6, padding: '6px 14px', cursor: 'pointer' }}>
          ＋ Add Date
        </button>
        <button onClick={startImport} disabled={calPreviewLoading}
          style={{ fontSize: 12, background: 'transparent', color: '#6b9adb',
                   border: '1px solid #2a3a5e', borderRadius: 6, padding: '6px 14px', cursor: 'pointer' }}>
          {calPreviewLoading ? 'Loading…' : '📅 Import from Calendar'}
        </button>
      </div>

      {/* Coming Up section */}
      {comingUp.length > 0 && (
        <div style={{ marginBottom: 20 }}>
          <div style={{ fontSize: 11, fontWeight: 700, color: '#4d6080', letterSpacing: 1,
                        textTransform: 'uppercase', marginBottom: 8 }}>Coming Up</div>
          {comingUp.map(function(d) {
            var u = urgencyDot(d._days);
            return (
              <div key={d.ID} style={{ display: 'flex', alignItems: 'center', gap: 8,
                                       padding: '7px 0', borderBottom: '1px solid #0a1628' }}>
                <span style={{ fontSize: 13, minWidth: 18 }}>{u ? u.dot : ''}</span>
                <span style={{ fontSize: 12, color: '#6b7fa8', minWidth: 60 }}>
                  {d._days === 0 ? 'Today' : d._days + ' day' + (d._days !== 1 ? 's' : '')}
                </span>
                <span style={{ flex: 1, fontSize: 13, color: '#dde1f0' }}>{d.Label}</span>
                <span style={{ fontSize: 11, color: '#4d6080' }}>
                  {formatDate(d.Date)} {String(d.Recurring||'').toLowerCase() === 'yes' ? '· Annual' : ''}
                </span>
              </div>
            );
          })}
        </div>
      )}

      {/* By Person section */}
      <div style={{ marginBottom: 8 }}>
        <div style={{ fontSize: 11, fontWeight: 700, color: '#4d6080', letterSpacing: 1,
                      textTransform: 'uppercase', marginBottom: 8 }}>By Person</div>
        {people.map(function(person) {
          var personDates = byPerson[person] || [];
          var isOpen = !!expanded[person];
          var upcoming = personDates.filter(function(d){ return d._days >= 0 && d._days <= 90; }).length;
          return (
            <div key={person} style={{ marginBottom: 6, background: '#0d1b3e', borderRadius: 8,
                                       border: '1px solid #1e3a6e', overflow: 'hidden' }}>
              <div style={{ display: 'flex', alignItems: 'center', padding: '9px 14px',
                            cursor: 'pointer', justifyContent: 'space-between' }}
                   onClick={() => togglePerson(person)}>
                <div style={{ display: 'flex', alignItems: 'center', gap: 8 }}>
                  <span style={{ fontSize: 13, color: '#8899bb' }}>{isOpen ? '▾' : '▸'}</span>
                  <span style={{ fontSize: 14, fontWeight: 600, color: '#dde1f0' }}>{person}</span>
                  {upcoming > 0 && (
                    <span style={{ fontSize: 10, background: '#1a3a6e', color: '#a0c0ff',
                                   borderRadius: 10, padding: '1px 7px' }}>
                      {upcoming} upcoming
                    </span>
                  )}
                </div>
                <button onClick={function(ev){ ev.stopPropagation(); openAddFor(person); }}
                  style={{ fontSize: 11, color: '#6b9adb', background: 'transparent',
                           border: '1px solid #2a3a5e', borderRadius: 5, padding: '2px 8px', cursor: 'pointer' }}
                  disabled={busy}>＋</button>
              </div>
              {isOpen && (
                <div style={{ borderTop: '1px solid #152040', padding: '8px 14px' }}>
                  {personDates.length === 0 && (
                    <div style={{ fontSize: 12, color: '#3a4d66', marginBottom: 4 }}>No dates yet.</div>
                  )}
                  {personDates.map(function(d) {
                    var u = urgencyDot(d._days);
                    return (
                      <div key={d.ID} style={{ display: 'flex', alignItems: 'center', gap: 8,
                                               padding: '5px 0', borderBottom: '1px solid #0a1628' }}>
                        {u && <span style={{ fontSize: 11 }}>{u.dot}</span>}
                        <span style={{ flex: 1, fontSize: 13, color: '#c8d0e8' }}>{d.Label}</span>
                        <span style={{ fontSize: 11, color: '#4d6080' }}>
                          {formatDate(d.Date)}{String(d.Recurring||'').toLowerCase()==='yes' ? ' · Annual' : ''}
                        </span>
                        <button onClick={function(){ openEdit(d); }}
                          style={{ fontSize: 11, color: '#6b9adb', background: 'transparent',
                                   border: 'none', cursor: 'pointer', padding: '2px 4px' }}
                          disabled={busy}>✎</button>
                        <button onClick={function(){ if(window.confirm('Delete "'+d.Label+'"?')) onDelete(d.ID); }}
                          style={{ fontSize: 10, color: '#6b3a3a', background: 'transparent',
                                   border: 'none', cursor: 'pointer', padding: '2px 4px', opacity: 0.6 }}
                          disabled={busy}>✕</button>
                      </div>
                    );
                  })}
                </div>
              )}
            </div>
          );
        })}

        {/* Add Person shortcut */}
        <div style={{ marginTop: 10 }}>
          {addingPerson ? (
            <div style={{ display: 'flex', gap: 6 }}>
              <input type="text" placeholder="Person's name…"
                value={newPersonName} onChange={function(ev){ setNewPersonName(ev.target.value); }}
                onKeyDown={function(ev){ if(ev.key==='Enter') submitNewPerson(); if(ev.key==='Escape'){ setAddingPerson(false); setNewPersonName(''); } }}
                autoFocus
                style={{ flex:1, fontSize:12, background:'#060e24', border:'1px solid #1e3a6e',
                         borderRadius:6, padding:'5px 10px', color:'#dde1f0' }}/>
              <button onClick={submitNewPerson}
                style={{ fontSize:12, background:'#1a3a6e', color:'#a0c0ff', border:'none',
                         borderRadius:6, padding:'5px 12px', cursor:'pointer' }}
                disabled={!newPersonName.trim()}>Add</button>
              <button onClick={()=>{ setAddingPerson(false); setNewPersonName(''); }}
                style={{ fontSize:12, background:'transparent', color:'#6b7fa8',
                         border:'1px solid #2a3a5e', borderRadius:6, padding:'5px 10px', cursor:'pointer' }}>
                Cancel</button>
            </div>
          ) : (
            <button onClick={()=>setAddingPerson(true)}
              style={{ fontSize:12, color:'#6b9adb', background:'transparent',
                       border:'1px dashed #2a3a5e', borderRadius:6, padding:'6px 14px', cursor:'pointer' }}>
              ＋ Add Person
            </button>
          )}
        </div>
      </div>

      {/* Empty state */}
      {dates.length === 0 && (
        <div style={{ textAlign: 'center', padding: '32px 0', color: '#3a4d66', fontSize: 13 }}>
          No important dates yet. Add one above or import from your calendar.
        </div>
      )}

      {/* Add / Edit Date modal */}
      {showAddModal && (
        <div style={{ position:'fixed', inset:0, background:'rgba(0,0,0,0.6)', zIndex:999,
                      display:'flex', alignItems:'center', justifyContent:'center' }}

function GiftIdeasView({ people, ideas, loading, busy,
                         onAddPerson, onDeletePerson, onAddIdea, onDeleteIdea }) {
  var [expanded,     setExpanded]     = React.useState({ Ahmed: true, Victoria: true });
  var [inputs,       setInputs]       = React.useState({});
  var [newPerson,    setNewPerson]    = React.useState('');
  var [addingPerson, setAddingPerson] = React.useState(false);

  if (loading) return <div className="loading-text">Loading gift ideas…</div>;

  // Group ideas by person
  var byPerson = {};
  ideas.forEach(function(idea) {
    var p = idea.Person || '';
    if (!byPerson[p]) byPerson[p] = [];
    byPerson[p].push(idea);
  });

  function toggle(name) {
    setExpanded(function(prev) { var n = Object.assign({}, prev); n[name] = !n[name]; return n; });
  }

  function submitIdea(person) {
    var text = (inputs[person] || '').trim();
    if (!text || busy) return;
    onAddIdea(person, text);
    setInputs(function(prev) { var n = Object.assign({}, prev); n[person] = ''; return n; });
  }

  function submitNewPerson() {
    var name = newPerson.trim();
    if (!name || busy) return;
    onAddPerson(name);
    setNewPerson('');
    setAddingPerson(false);
    setExpanded(function(prev) { var n = Object.assign({}, prev); n[name] = true; return n; });
  }

  return (
    <div style={{ maxWidth: 560 }}>
      {people.map(function(person) {
        var personIdeas = byPerson[person] || [];
        var isOpen = !!expanded[person];
        return (
          <div key={person} style={{ marginBottom: 8, background: '#0d1b3e', borderRadius: 8,
                                     border: '1px solid #1e3a6e', overflow: 'hidden' }}>
            <div style={{ display: 'flex', alignItems: 'center', padding: '10px 14px',
                          cursor: 'pointer', justifyContent: 'space-between' }}
                 onClick={() => toggle(person)}>
              <div style={{ display: 'flex', alignItems: 'center', gap: 8 }}>
                <span style={{ fontSize: 13, color: '#8899bb' }}>{isOpen ? '▾' : '▸'}</span>
                <span style={{ fontSize: 14, fontWeight: 600, color: '#dde1f0' }}>{person}</span>
                <span style={{ fontSize: 11, color: '#4d6080', marginLeft: 2 }}>
                  {personIdeas.length} idea{personIdeas.length !== 1 ? 's' : ''}
                </span>
              </div>
              <button
                onClick={function(ev) {
                  ev.stopPropagation();
                  if (window.confirm('Remove ' + person + ' and all their gift ideas?')) onDeletePerson(person);
                }}
                style={{ fontSize: 11, color: '#6b3a3a', background: 'transparent', border: 'none',
                         cursor: 'pointer', padding: '2px 6px', opacity: 0.6 }}
                disabled={busy}>✕</button>
            </div>

            {isOpen && (
              <div style={{ borderTop: '1px solid #152040', padding: '10px 14px' }}>
                {personIdeas.length === 0 && (
                  <div style={{ fontSize: 12, color: '#3a4d66', marginBottom: 10 }}>No ideas yet — add one below.</div>
                )}
                {personIdeas.map(function(idea) {
                  return (
                    <div key={idea.ID} style={{ display: 'flex', alignItems: 'center',
                                                justifyContent: 'space-between',
                                                padding: '5px 0', borderBottom: '1px solid #0a1628' }}>
                      <span style={{ fontSize: 13, color: '#c8d0e8' }}>🎁 {idea.Idea}</span>
                      <button
                        onClick={function() { onDeleteIdea(idea.ID); }}
                        style={{ fontSize: 10, color: '#6b3a3a', background: 'transparent', border: 'none',
                                 cursor: 'pointer', padding: '2px 4px', opacity: 0.6 }}
                        disabled={busy}>✕</button>
                    </div>
                  );
                })}
                <div style={{ display: 'flex', gap: 6, marginTop: 10 }}>
                  <input
                    type="text"
                    placeholder="Add gift idea…"
                    value={inputs[person] || ''}
                    onChange={function(ev) {
                      var v = ev.target.value;
                      setInputs(function(prev) { var n = Object.assign({}, prev); n[person] = v; return n; });
                    }}
                    onKeyDown={function(ev) { if (ev.key === 'Enter') submitIdea(person); }}
                    style={{ flex: 1, fontSize: 12, background: '#060e24', border: '1px solid #1e3a6e',
                             borderRadius: 6, padding: '5px 10px', color: '#dde1f0' }}
                    disabled={busy}
                  />
                  <button
                    onClick={function() { submitIdea(person); }}
                    style={{ fontSize: 13, background: '#1a3a6e', color: '#a0c0ff', border: 'none',
                             borderRadius: 6, padding: '5px 12px', cursor: 'pointer' }}
                    disabled={busy || !(inputs[person] || '').trim()}>＋</button>
                </div>
              </div>
            )}
          </div>
        );
      })}

      <div style={{ marginTop: 12 }}>
        {addingPerson ? (
          <div style={{ display: 'flex', gap: 6 }}>
            <input
              type="text"
              placeholder="Person's name…"
              value={newPerson}
              onChange={function(ev) { setNewPerson(ev.target.value); }}
              onKeyDown={function(ev) {
                if (ev.key === 'Enter') submitNewPerson();
                if (ev.key === 'Escape') { setAddingPerson(false); setNewPerson(''); }
              }}
              autoFocus
              style={{ flex: 1, fontSize: 12, background: '#060e24', border: '1px solid #1e3a6e',
                       borderRadius: 6, padding: '5px 10px', color: '#dde1f0' }}
            />
            <button onClick={submitNewPerson}
              style={{ fontSize: 12, background: '#1a3a6e', color: '#a0c0ff', border: 'none',
                       borderRadius: 6, padding: '5px 12px', cursor: 'pointer' }}
              disabled={!newPerson.trim()}>Add</button>
            <button onClick={() => { setAddingPerson(false); setNewPerson(''); }}
              style={{ fontSize: 12, background: 'transparent', color: '#6b7fa8',
                       border: '1px solid #2a3a5e', borderRadius: 6, padding: '5px 10px', cursor: 'pointer' }}>
              Cancel</button>
          </div>
        ) : (
          <button onClick={() => setAddingPerson(true)}
            style={{ fontSize: 12, color: '#6b9adb', background: 'transparent',
                     border: '1px dashed #2a3a5e', borderRadius: 6,
                     padding: '6px 14px', cursor: 'pointer' }}>
            ＋ Add Person
          </button>
        )}
      </div>
    </div>
  );
}

    <div>

const CADENCES = ['Daily', 'Weekly', 'Biweekly', 'Monthly', 'Seasonal'];

const CADENCE_META = {
  Daily:    { label: '☀️ Daily',    reset: 'Resets nightly'              },
  Weekly:   { label: '📅 Weekly',   reset: 'Resets every Friday'         },
  Biweekly: { label: '🗓️ Biweekly', reset: 'Resets every other Friday'   },
  Monthly:  { label: '📆 Monthly',  reset: 'Resets last day of month'    },
  Seasonal: { label: '🌿 Seasonal', reset: 'No auto-reset'               },
};

function ChoresView({ chores, loading, busy, onToggle, onAdd, onDelete, onUpdateCadence }) {
  const [expanded,    setExpanded]    = React.useState({ Daily: true, Weekly: true, Biweekly: true, Monthly: true, Seasonal: true });
  const [addCadence,  setAddCadence]  = React.useState(null); // which section's add input is open
  const [addText,     setAddText]     = React.useState('');
  const [dragId,      setDragId]      = React.useState(null);
  const [dragOverCad, setDragOverCad] = React.useState(null);

  if (loading) return <div style={{ fontSize: 13, color: '#6b7fa8', padding: 16 }}>Loading chores…</div>;

  const byCategory = {};
  CADENCES.forEach(function(c) { byCategory[c] = []; });
  (chores || []).forEach(function(ch) {
    var cat = ch.Cadence || 'Daily';
    if (!byCategory[cat]) byCategory[cat] = [];
    byCategory[cat].push(ch);
  });

  const total   = (chores || []).length;
  const done    = (chores || []).filter(function(c) { return c.Checked === true || c.Checked === 'TRUE'; }).length;
  const pct     = total ? Math.round((done / total) * 100) : 0;

  function handleDrop(cadence) {
    if (dragId && dragId !== cadence && cadence !== dragOverCad) {
      // dragId is the chore ID, dragOverCad is the target cadence
    }
    if (dragId) {
      onUpdateCadence(dragId, cadence);
    }
    setDragId(null);
    setDragOverCad(null);
  }

  async function submitAdd(cadence) {
    const text = addText.trim();
    if (!text) return;
    setAddText('');
    setAddCadence(null);
    await onAdd(text, cadence);
  }

  const inputStyle = {
    flex: 1, padding: '5px 9px', borderRadius: 6, background: '#0a1628',
    border: '1px solid #1e3060', color: '#dde1f0', fontSize: 13,
  };

  return (
    <div>
      {/* Overall progress */}
      {total > 0 && (
        <div style={{ marginBottom: 16 }}>
          <div style={{ display: 'flex', justifyContent: 'space-between', fontSize: 12, color: '#6b7fa8', marginBottom: 4 }}>
            <span>{done}/{total} chores done today</span>
            <span>{pct}%</span>
          </div>
          <div style={{ height: 6, background: '#0e1e3a', borderRadius: 3, overflow: 'hidden' }}>
            <div style={{ width: pct + '%', height: '100%', background: pct === 100 ? '#2ecc71' : '#3a7bd5', borderRadius: 3, transition: 'width 0.3s' }} />
          </div>
        </div>
      )}

      {/* Cadence sections */}
      {CADENCES.map(function(cadence) {
        const items   = byCategory[cadence] || [];
        const isOpen  = !!expanded[cadence];
        const isOver  = dragOverCad === cadence;
        const cadDone = items.filter(function(c) { return c.Checked === true || c.Checked === 'TRUE'; }).length;
        const meta    = CADENCE_META[cadence];

        return (
          <div key={cadence}
            style={{ marginBottom: 10, border: isOver ? '1px dashed #3a7bd5' : '1px solid #1e3060',
                     borderRadius: 8, background: '#0e1e3a', transition: 'border 0.15s' }}
            onDragOver={function(e) { e.preventDefault(); setDragOverCad(cadence); }}
            onDragLeave={function() { if (dragOverCad === cadence) setDragOverCad(null); }}
            onDrop={function(e) { e.preventDefault(); handleDrop(cadence); }}
          >
            {/* Section header */}
            <div style={{ display: 'flex', alignItems: 'center', padding: '9px 14px', cursor: 'pointer', userSelect: 'none' }}
              onClick={function() { setExpanded(function(prev) { return Object.assign({}, prev, { [cadence]: !prev[cadence] }); }); }}>
              <span style={{ fontSize: 13, fontWeight: 600, color: '#dde1f0', flex: 1 }}>
                {isOpen ? '▾' : '▸'} {meta.label}
                <span style={{ fontSize: 11, color: '#4d6080', fontWeight: 400, marginLeft: 8 }}>
                  {cadDone}/{items.length} · {meta.reset}
                </span>
              </span>
              <button className="btn btn-ghost" style={{ fontSize: 11, padding: '2px 8px' }}
                disabled={busy}
                onClick={function(e) { e.stopPropagation(); setAddText(''); setAddCadence(cadence); }}>
                ＋ Add
              </button>
            </div>

            {isOpen && (
              <div style={{ padding: '0 14px 10px' }}>
                {items.length === 0 && addCadence !== cadence && (
                  <div style={{ fontSize: 12, color: '#4d6080', marginBottom: 4 }}>No chores yet. Click ＋ Add to get started.</div>
                )}
                {items.map(function(ch) {
                  const checked = ch.Checked === true || ch.Checked === 'TRUE';
                  return (
                    <div key={ch.ID}
                      draggable
                      onDragStart={function() { setDragId(ch.ID); }}
                      onDragEnd={function() { setDragId(null); setDragOverCad(null); }}
                      style={{ display: 'flex', alignItems: 'center', padding: '5px 0',
                               borderBottom: '1px solid #0a1628', opacity: checked ? 0.55 : 1,
                               cursor: 'grab' }}>
                      <span style={{ marginRight: 8, cursor: 'default', color: '#4d6080', fontSize: 12 }}>⠿</span>
                      <input type="checkbox" checked={checked} style={{ marginRight: 10, cursor: 'pointer' }}
                        onChange={function() { onToggle(ch.ID, checked); }} />
                      <span style={{ flex: 1, fontSize: 13, color: checked ? '#4d6080' : '#dde1f0',
                                     textDecoration: checked ? 'line-through' : 'none' }}>
                        {ch.Chore}
                      </span>
                      <button className="btn btn-ghost" style={{ fontSize: 11, color: '#c0392b', padding: '1px 6px', marginLeft: 6 }}
                        disabled={busy} onClick={function() { onDelete(ch.ID); }}>✕</button>
                    </div>
                  );
                })}

                {/* Inline add input */}
                {addCadence === cadence && (
                  <div style={{ display: 'flex', gap: 6, marginTop: 8 }}>
                    <input style={inputStyle} autoFocus placeholder={'Add ' + cadence.toLowerCase() + ' chore…'}
                      value={addText}
                      onChange={function(e) { setAddText(e.target.value); }}
                      onKeyDown={function(e) { if (e.key === 'Enter') submitAdd(cadence); if (e.key === 'Escape') setAddCadence(null); }} />
                    <button className="btn btn-primary" style={{ fontSize: 12, padding: '5px 12px' }}
                      disabled={busy || !addText.trim()} onClick={function() { submitAdd(cadence); }}>＋</button>
                    <button className="btn btn-ghost" style={{ fontSize: 12 }}
                      onClick={function() { setAddCadence(null); setAddText(''); }}>✕</button>
                  </div>
                )}
              </div>
            )}
          </div>
        );
      })}
    </div>
  );
}

// ---- GuestsView (Issue #150) -------------------------------------------------

function GuestsView({ apiUrl, apiToken }) {
  const [guests,  setGuests]  = React.useState(null);  // null = loading
  const [error,   setError]   = React.useState(null);

  React.useEffect(() => {
    if (!apiUrl || !apiToken) return;
    apiGet(apiUrl, apiToken, { action: 'get_guests' })
      .then(data => setGuests(data.guests || []))
      .catch(err => { setError(err.message); setGuests([]); });
  }, [apiUrl, apiToken]);

  if (guests === null) {
    return <div style={{ fontSize: 13, color: '#6b7fa8', padding: 16 }}>Loading guests…</div>;
  }

  if (error) {
    return <div style={{ fontSize: 13, color: '#f87171', padding: 16 }}>Error: {error}</div>;
  }

  if (!guests.length) {
    return (
      <div className="empty-state" style={{ padding: 40 }}>
        <div style={{ fontSize: 32, marginBottom: 12 }}>👥</div>
        <div>No upcoming guest windows found.</div>
        <div style={{ fontSize: 13, color: '#6b7fa8', marginTop: 8 }}>
          Add multi-day events to AE&amp;VV - Our Joint Chaos calendar with keywords like Visit, Staying, or Guests.
        </div>
      </div>
    );
  }

  const today = new Date();
  today.setHours(0, 0, 0, 0);

  return (
    <div style={{ display: 'flex', flexDirection: 'column', gap: 12 }}>
      {guests.map((g, i) => {
        const isStaying  = g.daysAway < 0;
        const isToday    = g.daysAway === 0;
        const isSoon     = g.daysAway >= 0 && g.daysAway <= 7;

        let badgeColor = '#2a3a5e';
        let badgeText  = 'In ' + g.daysAway + ' days';
        if (isStaying || isToday) {
          badgeColor = '#1a4a2e';
          badgeText  = isToday ? '🟢 Arriving today' : '🟢 Currently staying';
        } else if (isSoon) {
          badgeColor = '#3a3010';
          badgeText  = g.daysAway === 1 ? '🟡 Arriving tomorrow' : '🟡 Arriving in ' + g.daysAway + ' days';
        }

        return (
          <div key={i} style={{
            background: '#13244d', border: '1px solid #1e3060',
            borderRadius: 10, padding: '16px 20px',
          }}>
            <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'flex-start', flexWrap: 'wrap', gap: 8 }}>
              <div style={{ fontWeight: 700, fontSize: 15, color: '#dde1f0' }}>{g.label}</div>
              <span style={{
                fontSize: 11, fontWeight: 700, padding: '3px 10px',
                borderRadius: 20, background: badgeColor, color: '#dde1f0',
                whiteSpace: 'nowrap',
              }}>{badgeText}</span>
            </div>
            <div style={{ fontSize: 13, color: '#8a9abf', marginTop: 8 }}>
              <span>{g.arrivalDate} – {g.departureDate}</span>
              <span style={{ margin: '0 8px', color: '#2a3a5e' }}>·</span>
              <span>{g.durationDays} day{g.durationDays === 1 ? '' : 's'}</span>
            </div>
            <div style={{ fontSize: 11, color: '#4d6080', marginTop: 4 }}>{g.calendarName}</div>
          </div>
        );
      })}
    </div>
  );
}

// ---- VehiclesView ------------------------------------------------------------

function vehicleStatusDot(days, yellowDays, redDays) {
  if (days === null || days === undefined) return null;
  if (days < 0)          return <span style={{color:'#f87171',fontWeight:700}}>🔴</span>;
  if (days <= yellowDays) return <span style={{color:'#fbbf24',fontWeight:700}}>🟡</span>;
  return <span style={{color:'#4ade80'}}>🟢</span>;
}

function oilStatusDot(mi) {
  if (mi === null || mi === undefined) return null;
  if (mi < 0)    return <span style={{color:'#f87171',fontWeight:700}}>🔴</span>;
  if (mi <= 500) return <span style={{color:'#fbbf24',fontWeight:700}}>🟡</span>;
  return <span style={{color:'#4ade80'}}>🟢</span>;
}

function tireStatusDot(mi) {
  if (mi === null || mi === undefined) return null;
  if (mi < 0)     return <span style={{color:'#f87171',fontWeight:700}}>🔴</span>;
  if (mi <= 3000) return <span style={{color:'#fbbf24',fontWeight:700}}>🟡</span>;
  return <span style={{color:'#4ade80'}}>🟢</span>;
}

function fmtVehicleDate(val) {
  if (!val) return '—';
  const d = new Date(val);
  if (isNaN(d)) return String(val);
  return d.toLocaleDateString('en-US', { month:'short', day:'numeric', year:'numeric' });
}

            ) : (
              <div>
                <h3 style={{marginTop:0,color:'#e2e8f0'}}>
                  {inspectModal.type === 'emission' ? '🔬 Log Emission Inspection' : '🔒 Log Safety Inspection'} — {inspectModal.vehicle['Nickname'] || inspectModal.vehicle['Make']}
                </h3>
                <label style={{color:'#94a3b8',fontSize:13}}>New Expiry Date</label>
                <input type="date" value={inspectDate} onChange={e=>setInspectDate(e.target.value)}
                  style={{width:'100%',marginTop:4,marginBottom:16,padding:8,borderRadius:6,border:'1px solid #475569',background:'#0f172a',color:'#e2e8f0',fontSize:15}} />
                <div style={{display:'flex',gap:8}}>
                  <button style={{...btnStyle,background:'#2563eb',color:'#fff',padding:'8px 16px'}} disabled={busy}
                    onClick={() => {
                      if (inspectModal.type === 'emission') onEmissionInspect(inspectModal.vehicle['ID'], inspectDate);
                      else onSafetyInspect(inspectModal.vehicle['ID'], inspectDate);
                      setInspectModal(null);
                    }}>Save</button>
                  <button style={btnStyle} onClick={() => setInspectModal(null)}>Cancel</button>
                </div>
              </div>
            )}
          </div>
        </div>
      )}

      {/* Add Vehicle Modal */}
      {addModal && (
        <div style={{position:'fixed',inset:0,background:'rgba(0,0,0,0.7)',zIndex:1000,display:'flex',alignItems:'center',justifyContent:'center',overflowY:'auto'}}>
          <div style={{background:'#1e293b',borderRadius:12,padding:24,width:'90%',maxWidth:520,border:'1px solid #334155',maxHeight:'90vh',overflowY:'auto'}}>
            <h3 style={{marginTop:0,color:'#e2e8f0'}}>🚗 Add Vehicle</h3>
            {FIELDS.map(function(f) {
              return (
                <div key={f} style={{marginBottom:10}}>
                  <label style={{color:'#94a3b8',fontSize:12,display:'block'}}>{f}</label>
                  <input value={addForm[f]||''} onChange={e=>setAddForm(prev=>({...prev,[f]:e.target.value}))}
                    style={{width:'100%',padding:6,borderRadius:6,border:'1px solid #475569',background:'#0f172a',color:'#e2e8f0',fontSize:13,boxSizing:'border-box'}} />
                </div>
              );
            })}
            <div style={{display:'flex',gap:8,marginTop:8}}>
              <button style={{...btnStyle,background:'#2563eb',color:'#fff',padding:'8px 16px'}} disabled={busy}
                onClick={() => { onAdd(addForm); setAddModal(false); }}>Add</button>
              <button style={btnStyle} onClick={() => setAddModal(false)}>Cancel</button>
            </div>
          </div>
        </div>
      )}

      {/* Confirm Delete */}
      {confirmDel && (
        <div style={{position:'fixed',inset:0,background:'rgba(0,0,0,0.7)',zIndex:1000,display:'flex',alignItems:'center',justifyContent:'center'}}>
          <div style={{background:'#1e293b',borderRadius:12,padding:24,minWidth:300,border:'1px solid #334155'}}>
            <h3 style={{marginTop:0,color:'#e2e8f0'}}>Remove vehicle?</h3>
            <p style={{color:'#94a3b8'}}>{confirmDel['Year']} {confirmDel['Make']} {confirmDel['Model']} ({confirmDel['Nickname']})</p>
            <div style={{display:'flex',gap:8}}>
              <button style={{...btnStyle,background:'#dc2626',color:'#fff',padding:'8px 16px'}} disabled={busy}
                onClick={() => { onDelete(confirmDel['ID']); setConfirmDel(null); }}>Remove</button>
              <button style={btnStyle} onClick={() => setConfirmDel(null)}>Cancel</button>
            </div>
          </div>
        </div>
      )}
    </div>
  );
}

function HomeFrontTab({ homeFront, loading, busy, onRecordService, onRecipeToShopping, purchaseHistory,
                        onAddTakeoutRestaurant, onDeleteTakeoutRestaurant, onAddTakeoutItem, onDeleteTakeoutItem,
                        chores, choresLoading, onToggleChore, onAddChore, onDeleteChore, onUpdateChoreCadence,
                        vehicles, vehiclesLoading, onVehicleOilChange, onVehicleService, onVehicleMileage, onAddVehicle, onDeleteVehicle,
                        onVehicleTireChange, onVehicleEmissionInspect, onVehicleSafetyInspect,
                        apiUrl, apiToken, features }) {
  const feat = features || {};
  const allSubTabs = [
    { id: 'steward',  label: '🏠 Steward'  },
    { id: 'vehicles', label: '🚗 Vehicles'  },
    { id: 'chores',   label: '🧹 Chores'   },
    { id: 'recipes',  label: '🍽️ Recipes'  },
    { id: 'takeouts', label: '🥡 Takeouts',  featureKey: 'takeouts' },
    { id: 'pantry',   label: '📦 Pantry',    featureKey: 'pantry'   },
    { id: 'guests',   label: '👥 Guests'   },
  ];
  const subTabs = allSubTabs.filter(function(t) { return !t.featureKey || feat[t.featureKey] !== false; });
  const [sub, setSub] = React.useState('steward');
  React.useEffect(function() {
    if (subTabs.length > 0 && !subTabs.find(function(t) { return t.id === sub; })) {
      setSub(subTabs[0].id);
    }
  }, [subTabs.map(function(t) { return t.id; }).join(',')]);
  return (
    <div>
      <div className="subtab-row">
        {subTabs.map(s => (
          <button key={s.id} className={`subtab-btn${sub === s.id ? ' active' : ''}`}
            onClick={() => setSub(s.id)}>{s.label}</button>
        ))}
      </div>
      {sub === 'steward' && (
        <HomestewardView
          items={(homeFront && homeFront.items) || []}
          loading={loading}
          busy={busy}
          onRecordService={onRecordService}
        />
      )}
      {sub === 'vehicles' && (
        <VehiclesView
          vehicles={vehicles}
          loading={vehiclesLoading}
          busy={busy}
          onOilChange={onVehicleOilChange}
          onService={onVehicleService}
          onMileage={onVehicleMileage}
          onAdd={onAddVehicle}
          onDelete={onDeleteVehicle}
          onTireChange={onVehicleTireChange}
          onEmissionInspect={onVehicleEmissionInspect}
          onSafetyInspect={onVehicleSafetyInspect}
        />
      )}
      {sub === 'chores' && (
        <ChoresView
          chores={chores}
          loading={choresLoading}
          busy={busy}
          onToggle={onToggleChore}
          onAdd={onAddChore}
          onDelete={onDeleteChore}
          onUpdateCadence={onUpdateChoreCadence}
        />
      )}
      {sub === 'recipes' && (
        <RecipeView
          recipes={(homeFront && homeFront.recipes) || []}
          loading={loading}
          busy={busy}
          onAddToShopping={onRecipeToShopping}
        />
      )}
      {sub === 'takeouts' && (
        <TakeoutsView
          takeouts={(homeFront && homeFront.takeouts) || []}
          loading={loading}
          busy={busy}
          onAddRestaurant={onAddTakeoutRestaurant}
          onDeleteRestaurant={onDeleteTakeoutRestaurant}
          onAddItem={onAddTakeoutItem}
          onDeleteItem={onDeleteTakeoutItem}
        />
      )}
      {sub === 'pantry' && (
        <PurchaseHistoryTab items={purchaseHistory} />
      )}
      {sub === 'guests' && (
        <GuestsView apiUrl={apiUrl} apiToken={apiToken} />
      )}
    </div>
  );
}

            style={{ padding: '7px 16px', borderRadius: 8, background: '#5c9eff', border: 'none',
                     color: '#fff', cursor: (busy || !form.title) ? 'not-allowed' : 'pointer',
                     fontSize: 13, fontWeight: 600, opacity: (busy || !form.title) ? 0.5 : 1 }}>

function CareerGoalsView({ goals, busy, onAddGoal, onUpdateGoal, onDeleteGoal }) {

  var STATUS_CYCLE   = { Active: 'Achieved', Achieved: 'Paused', Paused: 'Active' };

  function handleAdd() {
    if (!form.title) return;
    onAddGoal(form);
    setForm({ horizon: '1yr', status: 'Active' });
    setShowAdd(false);
  }

  return (
    <div>
      <div className="toolbar" style={{ marginBottom: 16 }}>

        <div className="empty-state">
          <div style={{ fontSize: 32, marginBottom: 12 }}>🎯</div>
          <div>No career goals yet</div>
        </div>
      )}
      {goals.map(function(g) {
        var hColor = HORIZON_COLORS[g.horizon] || '#5c9eff';
        var sColor = STATUS_COLORS[g.status]   || '#5c6a8a';
        return (
          <div key={g.id} className="card" style={{ padding: 16, marginBottom: 10, display: 'flex', justifyContent: 'space-between', alignItems: 'flex-start' }}>

              var phs    = { role: 'e.g. VP of Engineering', company: 'e.g. Acme Corp' };
              return (
                <div key={key} style={{ marginBottom: 12 }}>
                  <label style={{ display: 'block', fontSize: 11, color: '#8a9abf', marginBottom: 4, textTransform: 'uppercase', letterSpacing: 1 }}>{labels[key]}</label>
                  <input value={form[key] || ''} placeholder={phs[key]}
                    onChange={function(e) { var v = e.target.value; setForm(function(prev) { var n = Object.assign({}, prev); n[key] = v; return n; }); }}
                    style={{ width: '100%', padding: '8px 10px', borderRadius: 8, background: '#0d1b3e', border: '1px solid #1e3060', color: '#dde1f0', fontSize: 13 }} />
                </div>
              );
            })}
            <div style={{ display: 'flex', gap: 10, marginBottom: 12 }}>
              <div style={{ flex: 1 }}>
                <label style={{ display: 'block', fontSize: 11, color: '#8a9abf', marginBottom: 4, textTransform: 'uppercase', letterSpacing: 1 }}>Relationship</label>
                <select value={form.relationship || 'Peer'} onChange={function(e) { var v = e.target.value; setForm(function(p) { return Object.assign({}, p, { relationship: v }); }); }}
                  style={{ width: '100%', padding: '8px 10px', borderRadius: 8, background: '#0d1b3e', border: '1px solid #1e3060', color: '#dde1f0', fontSize: 13 }}>
                  <option>Mentor</option><option>Sponsor</option><option>Peer</option><option>Coach</option><option>Colleague</option>
                </select>
              </div>
              <div style={{ flex: 1 }}>
                <label style={{ display: 'block', fontSize: 11, color: '#8a9abf', marginBottom: 4, textTransform: 'uppercase', letterSpacing: 1 }}>Last Contact</label>
                <input type="date" value={form.lastContact || ''}
                  onChange={function(e) { var v = e.target.value; setForm(function(p) { return Object.assign({}, p, { lastContact: v }); }); }}
                  style={{ width: '100%', padding: '8px 10px', borderRadius: 8, background: '#0d1b3e', border: '1px solid #1e3060', color: '#dde1f0', fontSize: 13 }} />
              </div>
            </div>
            <div style={{ marginBottom: 16 }}>
              <label style={{ display: 'block', fontSize: 11, color: '#8a9abf', marginBottom: 4, textTransform: 'uppercase', letterSpacing: 1 }}>Notes</label>
              <textarea value={form.notes || ''}
                onChange={function(e) { var v = e.target.value; setForm(function(p) { return Object.assign({}, p, { notes: v }); }); }}
                rows={2} style={{ width: '100%', padding: '8px 10px', borderRadius: 8, background: '#0d1b3e', border: '1px solid #1e3060', color: '#dde1f0', fontSize: 13, resize: 'vertical' }} />
            </div>
            <div style={{ display: 'flex', gap: 8, justifyContent: 'flex-end' }}>
              <button type="button" onClick={function() { setShowAdd(false); }}
                style={{ padding: '7px 16px', borderRadius: 8, background: '#1e2a3a', border: '1px solid #2a3a4a', color: '#6b7fa8', cursor: 'pointer', fontSize: 13 }}>Cancel</button>
              <button type="button" disabled={busy || !form.name} onClick={handleAdd}
                style={{ padding: '7px 16px', borderRadius: 8, background: '#5c9eff', border: 'none',
                         color: '#fff', cursor: (busy || !form.name) ? 'not-allowed' : 'pointer',
                         fontSize: 13, fontWeight: 600, opacity: (busy || !form.name) ? 0.5 : 1 }}>
                {busy ? 'Saving…' : 'Add Contact'}
              </button>
            </div>
          </div>
        </div>
      )}
    </div>
  );
}

function CareerTab({ career, loading, busy,
                     onUpdatePosition,
                     onAddGoal, onUpdateGoal, onDeleteGoal,
                     onAddProgression, onDeleteProgression,
                     onAddDevelopment, onUpdateDevelopment, onDeleteDevelopment,
                     onAddWin, onDeleteWin,
                     onAddNetwork, onUpdateNetwork, onDeleteNetwork }) {
  var [sub, setSub] = React.useState('position');
  var subTabs = [
    { id: 'position',    label: '📌 Position'   },
    { id: 'goals',       label: '🎯 Goals'       },
    { id: 'progression', label: '📈 Progression' },
    { id: 'development', label: '🧠 Development' },
    { id: 'wins',        label: '🏆 Wins'        },
    { id: 'network',     label: '🤝 Network'     },
  ];
  var data = career || {};
  return (
    <div>
      <div className="subtab-row">
        {subTabs.map(function(s) {
          return (
            <button key={s.id} className={'subtab-btn' + (sub === s.id ? ' active' : '')}
              onClick={function() { setSub(s.id); }}>{s.label}</button>
          );
        })}
      </div>
      {loading && <div className="loading-text">Loading career data…</div>}
      {!loading && sub === 'position' && (
        <CareerPositionView position={data.position} busy={busy} onUpdatePosition={onUpdatePosition} />
      )}
      {!loading && sub === 'goals' && (
        <CareerGoalsView goals={data.goals || []} busy={busy}
          onAddGoal={onAddGoal} onUpdateGoal={onUpdateGoal} onDeleteGoal={onDeleteGoal} />
      )}
      {!loading && sub === 'progression' && (
        <CareerProgressionView progression={data.progression || []} busy={busy}
          onAddProgression={onAddProgression} onDeleteProgression={onDeleteProgression} />
      )}
      {!loading && sub === 'development' && (
        <CareerDevelopmentView development={data.development || []} busy={busy}
          onAddDevelopment={onAddDevelopment} onUpdateDevelopment={onUpdateDevelopment}
          onDeleteDevelopment={onDeleteDevelopment} />
      )}
      {!loading && sub === 'wins' && (
        <CareerWinsView wins={data.wins || []} busy={busy}
          onAddWin={onAddWin} onDeleteWin={onDeleteWin} />
      )}
      {!loading && sub === 'network' && (
        <CareerNetworkView network={data.network || []} busy={busy}
          onAddNetwork={onAddNetwork} onUpdateNetwork={onUpdateNetwork}
          onDeleteNetwork={onDeleteNetwork} />
      )}
    </div>
  );
}

function TxAliasPicker({ txName, bills, onSave, onClose, busy }) {
  var [selected, setSelected] = React.useState('');
  var billNames = ((bills && bills.bills) || []).map(function(b) { return b.bill; });
  // deduplicate
  billNames = billNames.filter(function(n, i) { return billNames.indexOf(n) === i; }).sort();

  return (
    <div className="modal-overlay" onClick={onClose}>
      <div className="modal-box" style={{ maxWidth: 380 }} onClick={function(e) { e.stopPropagation(); }}>
        <div style={{ fontWeight: 700, fontSize: 15, color: '#dde1f0', marginBottom: 8 }}>Map Transaction</div>
        <div style={{ fontSize: 12, color: '#6b7fa8', marginBottom: 14 }}>
          Map "<span style={{ color: '#dde1f0' }}>{txName}</span>" to which bill or income entry?
        </div>
        <select value={selected} onChange={function(e) { setSelected(e.target.value); }}
          style={{ width: '100%', padding: '8px 10px', borderRadius: 8, background: '#0d1b3e',
                   border: '1px solid #1e3060', color: '#dde1f0', fontSize: 13, marginBottom: 14 }}>
          <option value="">— select a bill / income —</option>
          {billNames.map(function(n) {
            return <option key={n} value={n}>{n}</option>;
          })}
        </select>
        <div style={{ display: 'flex', gap: 8, justifyContent: 'flex-end' }}>
          <button type="button" onClick={onClose}
            style={{ padding: '7px 16px', borderRadius: 8, background: '#1e2a3a', border: '1px solid #2a3a4a',
                     color: '#6b7fa8', cursor: 'pointer', fontSize: 13 }}>Cancel</button>
          <button type="button" disabled={!selected || busy} onClick={function() { if (selected) onSave(txName, selected); }}
            style={{ padding: '7px 16px', borderRadius: 8, background: '#5c9eff', border: 'none',
                     color: '#fff', cursor: selected ? 'pointer' : 'not-allowed', fontSize: 13, fontWeight: 600,
                     opacity: (!selected || busy) ? 0.5 : 1 }}>
            {busy ? 'Saving…' : 'Save Mapping'}
          </button>
        </div>
      </div>
    </div>
  );
}

function CashflowView({ apiUrl, apiToken, bills }) {
  var [cashflow,    setCashflow]    = React.useState(null);
  var [aliases,     setAliases]     = React.useState([]);
  var [loading,     setLoading]     = React.useState(false);
  var [aliasTarget, setAliasTarget] = React.useState(null); // { txName } for picker modal
  var [busy,        setBusy]        = React.useState(false);
  var [showAliases, setShowAliases] = React.useState(false);

  var todayMonth = new Date().toISOString().slice(0, 7);
  var [month, setMonth] = React.useState(todayMonth);

  var MONTH_NAMES = ['January','February','March','April','May','June',
                     'July','August','September','October','November','December'];
  var monthLabel = MONTH_NAMES[parseInt(month.slice(5,7),10)-1] + ' ' + month.slice(0,4);

  function loadData() {
    if (!apiUrl || !apiToken) return;
    setLoading(true);
    Promise.all([
      apiGet(apiUrl, apiToken, { action: 'cashflow', month: month }),
      apiGet(apiUrl, apiToken, { action: 'tx_aliases' }),
    ]).then(function(results) {
      setCashflow(results[0]);
      setAliases((results[1] && results[1].aliases) || []);
    }).catch(function() {}).finally(function() { setLoading(false); });
  }

  React.useEffect(function() { loadData(); }, [month, apiUrl, apiToken]);

  function prevMonth() {
    var d = new Date(month + '-15'); d.setMonth(d.getMonth()-1);
    setMonth(d.toISOString().slice(0,7));
  }
  function nextMonth() {
    var d = new Date(month + '-15'); d.setMonth(d.getMonth()+1);
    setMonth(d.toISOString().slice(0,7));
  }

  function fmtMoney(n) {
    if (n == null) return '—';
    return '$' + Math.round(Math.abs(n)).toLocaleString();
  }

  async function handleSaveAlias(txName, billName) {
    setBusy(true);
    try {
      await apiGet(apiUrl, apiToken, { action: 'set_tx_alias', keyword: txName, bill: billName });
      setAliasTarget(null);
      loadData();
    } catch(e) {}
    setBusy(false);
  }

  async function handleDeleteAlias(keyword) {
    setBusy(true);
    try {
      await apiGet(apiUrl, apiToken, { action: 'set_tx_alias', keyword: keyword, bill: '' });
      loadData();
    } catch(e) {}
    setBusy(false);
  }

  var t = cashflow && cashflow.totals;
  var income   = (cashflow && cashflow.income)   || [];
  var expenses = (cashflow && cashflow.expenses) || [];
  var year        = parseInt(month.slice(0,4),10);
  var mon         = parseInt(month.slice(5,7),10);
  var daysInMonth = new Date(year, mon, 0).getDate();

  // Group events by day for timeline
  var incByDay = {}, expByDay = {};
  income.forEach(function(ev)   { if (!incByDay[ev.day])  incByDay[ev.day]  = []; incByDay[ev.day].push(ev); });
  expenses.forEach(function(ev) { if (!expByDay[ev.day])  expByDay[ev.day]  = []; expByDay[ev.day].push(ev); });
  var allDays = [];
  Object.keys(incByDay).concat(Object.keys(expByDay)).forEach(function(d) {
    if (allDays.indexOf(parseInt(d,10)) === -1) allDays.push(parseInt(d,10));
  });
  allDays.sort(function(a,b) { return a-b; });

  // Unrecognized transactions (from actual tx, no Bills income entry matched)
  var unrecognized = income.filter(function(ev) { return ev.unrecognized; });

  // Running balance
  var allEvents = income.map(function(ev)   { return { day: ev.day, delta: +(ev.amount||0) }; })
    .concat(expenses.map(function(ev) { return { day: ev.day, delta: -(ev.amount||0) }; }));
  allEvents.sort(function(a,b) { return a.day-b.day; });
  var segments = [];
  var bal = 0, prevDay = 0;
  allEvents.forEach(function(ev) {
    if (ev.day > prevDay) segments.push({ fromDay: prevDay, toDay: ev.day, balance: bal });
    bal += ev.delta; prevDay = ev.day;
  });
  segments.push({ fromDay: prevDay, toDay: daysInMonth, balance: bal });
  var maxBal = Math.max(1, Math.max.apply(null, segments.map(function(s) { return Math.abs(s.balance); })));

  // Bar chart per-day totals
  var dayIncTotals = {}, dayExpTotals = {}, dayIncConfirmed = {};
  income.forEach(function(ev) {
    if (!ev.amount) return;
    dayIncTotals[ev.day] = (dayIncTotals[ev.day] || 0) + ev.amount;
    if (ev.confirmed) dayIncConfirmed[ev.day] = true;
  });
  expenses.forEach(function(ev) {
    if (!ev.amount) return;
    dayExpTotals[ev.day] = (dayExpTotals[ev.day] || 0) + ev.amount;
  });
  var maxIncDay = 1, maxExpDay = 1;
  Object.keys(dayIncTotals).forEach(function(k) { if (dayIncTotals[k] > maxIncDay) maxIncDay = dayIncTotals[k]; });
  Object.keys(dayExpTotals).forEach(function(k) { if (dayExpTotals[k] > maxExpDay) maxExpDay = dayExpTotals[k]; });
  var BAR_H = 75;
  var labelDaysSet = [1, 5, 10, 15, 20, 25, daysInMonth];

  return (
    <div>
      {/* Month nav */}
      <div style={{ display: 'flex', alignItems: 'center', gap: 10, marginBottom: 16 }}>
        <button onClick={prevMonth}
          style={{ padding: '5px 12px', borderRadius: 8, background: '#0d1b3e', border: '1px solid #1e3060', color: '#6b7fa8', cursor: 'pointer', fontSize: 14 }}>←</button>
        <span style={{ fontSize: 15, fontWeight: 700, color: '#dde1f0', minWidth: 150, textAlign: 'center' }}>{monthLabel}</span>
        <button onClick={nextMonth}
          style={{ padding: '5px 12px', borderRadius: 8, background: '#0d1b3e', border: '1px solid #1e3060', color: '#6b7fa8', cursor: 'pointer', fontSize: 14 }}>→</button>
        {loading && <span style={{ fontSize: 11, color: '#4d6080' }}>Loading…</span>}
      </div>

      {/* Summary cards */}
      {t && (
        <div style={{ display: 'flex', gap: 12, marginBottom: 20, flexWrap: 'wrap' }}>
          <div style={{ flex: 1, minWidth: 110, background: 'rgba(102,187,106,.08)', border: '1px solid rgba(102,187,106,.3)', borderRadius: 10, padding: '12px 16px' }}>
            <div style={{ fontSize: 11, color: '#66bb6a', fontWeight: 700, textTransform: 'uppercase', letterSpacing: '0.05em', marginBottom: 4 }}>💰 Income</div>
            <div style={{ fontSize: 22, fontWeight: 800, color: '#66bb6a' }}>{fmtMoney(t.income)}</div>
          </div>
          <div style={{ flex: 1, minWidth: 110, background: 'rgba(239,83,80,.08)', border: '1px solid rgba(239,83,80,.3)', borderRadius: 10, padding: '12px 16px' }}>
            <div style={{ fontSize: 11, color: '#ef5350', fontWeight: 700, textTransform: 'uppercase', letterSpacing: '0.05em', marginBottom: 4 }}>📤 Bills</div>
            <div style={{ fontSize: 22, fontWeight: 800, color: '#ef5350' }}>{fmtMoney(t.expenses)}</div>
          </div>
          <div style={{ flex: 1, minWidth: 110,
            background: t.net >= 0 ? 'rgba(102,187,106,.08)' : 'rgba(239,83,80,.08)',
            border: '1px solid ' + (t.net >= 0 ? 'rgba(102,187,106,.3)' : 'rgba(239,83,80,.3)'),
            borderRadius: 10, padding: '12px 16px' }}>
            <div style={{ fontSize: 11, color: t.net >= 0 ? '#66bb6a' : '#ef5350', fontWeight: 700, textTransform: 'uppercase', letterSpacing: '0.05em', marginBottom: 4 }}>📊 Net</div>
            <div style={{ fontSize: 22, fontWeight: 800, color: t.net >= 0 ? '#66bb6a' : '#ef5350' }}>
              {t.net >= 0 ? '+' : '-'}{fmtMoney(t.net)}
            </div>
          </div>
        </div>
      )}

      {/* Timeline — vertical bar chart */}
      {cashflow && (income.length > 0 || expenses.length > 0) && (
        <div className="bento-card" style={{ cursor: 'default', marginBottom: 16, overflowX: 'auto' }}>
          <div className="bento-card-title" style={{ marginBottom: 12 }}>📅 Monthly Timeline</div>
          <div style={{ minWidth: 500, padding: '0 2px' }}>
            <div style={{ display: 'flex', alignItems: 'stretch', height: BAR_H * 2 + 20, gap: 1 }}>
              {Array.from({ length: daysInMonth }, function(_, i) {
                var day     = i + 1;
                var incAmt  = dayIncTotals[day] || 0;
                var expAmt  = dayExpTotals[day] || 0;
                var incH    = incAmt > 0 ? Math.max(3, Math.round(incAmt / maxIncDay * BAR_H)) : 0;
                var expH    = expAmt > 0 ? Math.max(3, Math.round(expAmt / maxExpDay * BAR_H)) : 0;
                var confirmed = !!dayIncConfirmed[day];
                var showLbl   = labelDaysSet.indexOf(day) !== -1;
                var ttLines   = (incByDay[day] || []).map(function(e) {
                  return '+ ' + e.name + (e.amount ? ' $'+Math.round(e.amount).toLocaleString() : '');
                }).concat((expByDay[day] || []).map(function(e) {
                  return '- ' + e.name + (e.amount ? ' $'+Math.round(e.amount).toLocaleString() : '');
                }));
                return (
                  <div key={day} title={ttLines.length ? ttLines.join('\n') : undefined}
                    style={{ flex: 1, display: 'flex', flexDirection: 'column', alignItems: 'center', minWidth: 0, cursor: ttLines.length ? 'default' : undefined }}>
                    {/* Income bar — grows upward from center axis */}
                    <div style={{ height: BAR_H, width: '100%', display: 'flex', flexDirection: 'column', justifyContent: 'flex-end', alignItems: 'center' }}>
                      {incH > 0 && (
                        <div style={{
                          width: '72%', height: incH,
                          background: confirmed ? '#66bb6a' : 'rgba(102,187,106,0.35)',
                          borderRadius: '3px 3px 0 0',
                          border: confirmed ? 'none' : '1px dashed rgba(102,187,106,0.6)',
                          boxSizing: 'border-box'
                        }} />
                      )}
                    </div>
                    {/* Center axis */}
                    <div style={{ height: 2, width: '100%', background: '#1e3060', flexShrink: 0 }} />
                    {/* Expense bar — grows downward from center axis */}
                    <div style={{ height: BAR_H, width: '100%', display: 'flex', flexDirection: 'column', justifyContent: 'flex-start', alignItems: 'center' }}>
                      {expH > 0 && (
                        <div style={{
                          width: '72%', height: expH,
                          background: 'rgba(245,166,35,0.8)',
                          borderRadius: '0 0 3px 3px'
                        }} />
                      )}
                    </div>
                    {/* Day label */}
                    <div style={{ height: 16, display: 'flex', alignItems: 'flex-start', justifyContent: 'center' }}>
                      {showLbl && <span style={{ fontSize: 9, color: '#4d6080', userSelect: 'none' }}>{day}</span>}
                    </div>
                  </div>
                );
              })}
            </div>
          </div>
          {/* Legend */}
          <div style={{ display: 'flex', gap: 16, marginTop: 8, paddingTop: 8, borderTop: '1px solid #1e3060', fontSize: 11, color: '#6b7fa8', flexWrap: 'wrap' }}>
            <span><span style={{ display: 'inline-block', width: 10, height: 10, background: '#66bb6a', borderRadius: 2, marginRight: 4, verticalAlign: 'middle' }} />Income (confirmed)</span>
            <span><span style={{ display: 'inline-block', width: 10, height: 10, background: 'rgba(102,187,106,0.35)', border: '1px dashed rgba(102,187,106,0.6)', borderRadius: 2, marginRight: 4, verticalAlign: 'middle', boxSizing: 'border-box' }} />Income (projected)</span>
            <span><span style={{ display: 'inline-block', width: 10, height: 10, background: 'rgba(245,166,35,0.8)', borderRadius: 2, marginRight: 4, verticalAlign: 'middle' }} />Bills</span>
          </div>
        </div>
      )}

      {/* Running balance */}
      {cashflow && segments.length > 1 && (
        <div className="bento-card" style={{ cursor: 'default', marginBottom: 16 }}>
          <div className="bento-card-title" style={{ marginBottom: 10 }}>💹 Running Balance</div>
          <div style={{ display: 'flex', alignItems: 'flex-end', gap: 2, height: 56, padding: '0 4px' }}>
            {segments.map(function(seg, i) {
              var w   = seg.toDay - seg.fromDay;
              var h   = Math.max(3, Math.round(Math.abs(seg.balance) / maxBal * 52));
              var clr = seg.balance >= 0 ? '#66bb6a' : '#ef5350';
              return (
                <div key={i} style={{ flex: Math.max(w,1), display: 'flex', alignItems: 'flex-end' }}
                     title={'Day '+(seg.fromDay||1)+'–'+seg.toDay+': '+(seg.balance>=0?'+':'')+Math.round(seg.balance).toLocaleString()}>
                  <div style={{ width: '100%', height: h+'px', background: clr, borderRadius: 2, opacity: 0.85 }} />
                </div>
              );
            })}
          </div>
          <div style={{ display: 'flex', justifyContent: 'space-between', marginTop: 6, fontSize: 11, color: '#4d6080' }}>
            <span>Day 1</span>
            <span style={{ fontWeight: 700, color: bal >= 0 ? '#66bb6a' : '#ef5350' }}>
              End of month: {bal >= 0 ? '+' : '-'}{fmtMoney(bal)}
            </span>
            <span>Day {daysInMonth}</span>
          </div>
        </div>
      )}

      {/* Event list */}
      {cashflow && (income.length > 0 || expenses.length > 0) && (
        <div className="bento-card" style={{ cursor: 'default', marginBottom: 16 }}>
          <div className="bento-card-title" style={{ marginBottom: 10 }}>📋 Events</div>
          {income.map(function(ev)   { return Object.assign({}, ev, { isIncome: true  }); })
           .concat(expenses.map(function(ev) { return Object.assign({}, ev, { isIncome: false }); }))
           .sort(function(a,b) { return a.day - b.day; })
           .map(function(ev, i) {
            var color = ev.isIncome ? '#66bb6a' : '#f5a623';
            return (
              <div key={i} style={{ display: 'flex', alignItems: 'center', gap: 8, padding: '6px 0', borderBottom: '1px solid #0d1b3e', fontSize: 13 }}>
                <div style={{ width: 26, fontSize: 11, color: '#4d6080', flexShrink: 0 }}>{ev.day}</div>
                <div style={{ flex: 1, color: '#dde1f0', overflow: 'hidden', textOverflow: 'ellipsis', whiteSpace: 'nowrap' }}>{ev.name}</div>
                {ev.isIncome && ev.confirmed && (
                  <span style={{ fontSize: 9, padding: '1px 5px', borderRadius: 6, background: 'rgba(102,187,106,.1)', border: '1px solid rgba(102,187,106,.3)', color: '#66bb6a', flexShrink: 0 }}>✓</span>
                )}
                <div style={{ fontSize: 13, fontWeight: 700, color: color, flexShrink: 0 }}>
                  {ev.isIncome ? '+' : '-'}{ev.amount != null ? '$'+Math.round(ev.amount).toLocaleString() : '—'}
                </div>
              </div>
            );
          })}
        </div>
      )}

      {/* Unrecognized transactions */}
      {unrecognized.length > 0 && (
        <div className="bento-card" style={{ cursor: 'default', marginBottom: 16 }}>
          <div style={{ display: 'flex', alignItems: 'center', gap: 8, marginBottom: 10 }}>
            <div className="bento-card-title" style={{ margin: 0 }}>❓ Unrecognized Income</div>
            <span style={{ fontSize: 11, color: '#4d6080' }}>Map these to a bill/income entry to track them</span>
          </div>
          {unrecognized.map(function(ev, i) {
            return (
              <div key={i} style={{ display: 'flex', alignItems: 'center', gap: 8, padding: '6px 0', borderBottom: '1px solid #0d1b3e', fontSize: 13 }}>
                <div style={{ flex: 1, color: '#dde1f0', overflow: 'hidden', textOverflow: 'ellipsis', whiteSpace: 'nowrap' }}>{ev.name}</div>
                <div style={{ fontWeight: 700, color: '#66bb6a', flexShrink: 0 }}>+${Math.round(ev.amount).toLocaleString()}</div>
                <button onClick={function() { setAliasTarget({ txName: ev.name }); }}
                  style={{ padding: '3px 10px', borderRadius: 8, background: '#0d1b3e', border: '1px solid #1e3060',
                           color: '#5c9eff', fontSize: 11, cursor: 'pointer', flexShrink: 0 }}>
