<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#0d1b3e" />
  <title>VERA · No connection</title>
  <style>
    body { margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center; background: #080f1e; color: #dde1f0;
           font: 15px/1.5 -apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif; padding: 16px; box-sizing: border-box; }
    .card { background: #0a1628; border: 1px solid #1e2a3a; border-radius: 14px; padding: 24px 20px; text-align: center; max-width: 380px; width: 100%; }
    .icon { font-size: 30px; }
    h1 { margin: 8px 0 6px; font-size: 18px; }
    p { margin: 0; font-size: 14px; color: #8a9abf; }
    button { margin-top: 16px; min-height: 40px; padding: 8px 18px; border-radius: 8px; border: 1px solid #2a4080; background: #0a1220; color: #8ab4f8; font-size: 14px; cursor: pointer; }
    button:focus-visible { outline: 2px solid #8ab4f8; outline-offset: 2px; }
  </style>
</head>
<body>
  <div class="card" role="status">
    <div class="icon" aria-hidden="true">📡</div>
    <h1>No connection</h1>
    <p>VERA needs a connection to load. It'll refresh by itself when you're back online.</p>
    <button type="button" onclick="location.reload()">Try again</button>
  </div>
  <script>window.addEventListener('online', function () { location.reload(); });</script>
</body>
</html>
