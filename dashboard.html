<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>VERA Dashboard</title>
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: #080f1e;
      color: #dde1f0;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif;
      min-height: 100vh;
    }

    /* ---- Scrollbar ---- */
    ::-webkit-scrollbar { width: 6px; }
    ::-webkit-scrollbar-track { background: #0d1b3e; }
    ::-webkit-scrollbar-thumb { background: #2a3a5e; border-radius: 3px; }

    /* ---- Header ---- */
    .header {
      background: linear-gradient(135deg, #0d1b3e 0%, #152547 100%);
      border-bottom: 1px solid #1e3060;
      padding: 0 28px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      height: 60px;
      position: sticky;
      top: 0;
      z-index: 100;
    }
    .logo {
      display: flex;
      align-items: baseline;
      gap: 10px;
    }
    .logo-name {
      font-size: 22px;
      font-weight: 800;
      letter-spacing: 4px;
      color: #fff;
    }
    .logo-sub {
      font-size: 10px;
      letter-spacing: 2px;
      color: #c9a84c;
      text-transform: uppercase;
    }
    .header-actions {
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .last-updated {
      font-size: 11px;
      color: #6b7fa8;
    }

    /* ---- Status bar ---- */
    .status-bar {
      background: #0d1b3e;
      border-bottom: 1px solid #1e3060;
      padding: 12px 28px;
      display: flex;
      gap: 20px;
      align-items: center;
    }
    .stat-pill {
      display: flex;
      align-items: center;
      gap: 7px;
      background: #13244d;
      border-radius: 20px;
      padding: 5px 14px;
      font-size: 13px;
    }
    .stat-dot {
      width: 9px;
      height: 9px;
      border-radius: 50%;
    }
    .stat-count { font-weight: 700; color: #fff; }
    .stat-label { color: #8a9abf; }

    /* ---- Tabs ---- */
    .tabs {
      background: #0d1b3e;
      border-bottom: 1px solid #1e3060;
      padding: 0 28px;
      display: flex;
      gap: 4px;
    }
    .tab-btn {
      background: none;
      border: none;
      border-bottom: 3px solid transparent;
      color: #6b7fa8;
      cursor: pointer;
      font-size: 13px;
      font-weight: 600;
      letter-spacing: 0.5px;
      padding: 12px 16px;
      text-transform: uppercase;
      transition: color .15s, border-color .15s;
    }
    .tab-btn:hover { color: #c9a84c; }
    .tab-btn.active { color: #c9a84c; border-bottom-color: #c9a84c; }

    /* ---- Main content ---- */
    .main { padding: 24px 28px; max-width: 960px; }

    /* ---- Toolbar ---- */
    .toolbar {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 20px;
    }
    .filter-toggle {
      background: #13244d;
      border: 1px solid #1e3060;
      border-radius: 20px;
      color: #8a9abf;
      cursor: pointer;
      font-size: 12px;
      font-weight: 600;
      padding: 5px 14px;
      transition: all .15s;
    }
    .filter-toggle.on { background: #1e3878; border-color: #3d5fa0; color: #c9d9ff; }
    .count-badge {
      background: #13244d;
      border-radius: 10px;
      color: #6b7fa8;
      font-size: 12px;
      margin-left: auto;
      padding: 3px 10px;
    }

    /* ---- Flag card ---- */
    .flag-card {
      border-radius: 10px;
      border-left: 4px solid;
      margin-bottom: 12px;
      padding: 16px 18px;
      transition: opacity .2s;
    }
    .flag-card.high   { background: #1f0e0e; border-color: #e53935; }
    .flag-card.medium { background: #1f1608; border-color: #f9a825; }
    .flag-card.low    { background: #0a1f10; border-color: #43a047; }
    .flag-card.done   { opacity: 0.45; }

    .flag-meta {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 8px;
      flex-wrap: wrap;
    }
    .urgency-badge {
      border-radius: 4px;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.5px;
      padding: 2px 8px;
      text-transform: uppercase;
    }
    .urgency-badge.high   { background: #e53935; color: #fff; }
    .urgency-badge.medium { background: #f9a825; color: #1a1000; }
    .urgency-badge.low    { background: #43a047; color: #fff; }

    .source-badge {
      background: #1e3060;
      border-radius: 4px;
      color: #8ab0d8;
      font-size: 11px;
      font-weight: 600;
      padding: 2px 8px;
    }
    .flag-date { color: #6b7fa8; font-size: 11px; margin-left: auto; }

    .flag-title {
      color: #e8ecf8;
      font-size: 15px;
      font-weight: 600;
      margin-bottom: 5px;
    }
    .flag-reason { color: #8a9abf; font-size: 13px; line-height: 1.5; }

    .flag-actions {
      display: flex;
      gap: 8px;
      margin-top: 12px;
      flex-wrap: wrap;
    }

    /* ---- Buttons ---- */
    .btn {
      border: none;
      border-radius: 6px;
      cursor: pointer;
      font-size: 12px;
      font-weight: 600;
      padding: 6px 14px;
      transition: opacity .15s, transform .1s;
    }
    .btn:hover { opacity: 0.85; transform: translateY(-1px); }
    .btn:active { transform: translateY(0); }
    .btn:disabled { opacity: 0.4; cursor: not-allowed; transform: none; }
    .btn-ack     { background: #1e3878; color: #c9d9ff; }
    .btn-snooze  { background: #3d2e10; color: #ffd54f; }
    .btn-resolve { background: #0f3020; color: #69f0ae; }
    .btn-primary { background: #c9a84c; color: #0d1b3e; }
    .btn-ghost   { background: #13244d; color: #8a9abf; }
    .btn-refresh { background: #13244d; border: 1px solid #1e3060; color: #8a9abf; }
    .btn-settings{ background: none; border: none; color: #6b7fa8; cursor: pointer; font-size: 18px; padding: 4px 8px; }
    .btn-settings:hover { color: #c9a84c; }

    /* ---- Task card ---- */
    .task-card {
      background: #0d1b3e;
      border: 1px solid #1e3060;
      border-radius: 10px;
      display: flex;
      align-items: flex-start;
      gap: 14px;
      margin-bottom: 10px;
      padding: 14px 16px;
    }
    .task-age {
      background: #13244d;
      border-radius: 6px;
      color: #6b7fa8;
      font-size: 11px;
      font-weight: 700;
      min-width: 48px;
      padding: 4px 8px;
      text-align: center;
    }
    .task-age.overdue  { background: #3d1515; color: #ff6b6b; }
    .task-age.neglected{ background: #3d2e10; color: #ffd54f; }
    .task-info { flex: 1; }
    .task-title { color: #e8ecf8; font-size: 14px; font-weight: 600; margin-bottom: 4px; }
    .task-meta  { color: #6b7fa8; font-size: 12px; }
    .task-due   { color: #ff6b6b; }

    /* ---- Summaries table ---- */
    .summaries-table {
      background: #0d1b3e;
      border: 1px solid #1e3060;
      border-radius: 10px;
      overflow: hidden;
      width: 100%;
    }
    .summaries-table th {
      background: #13244d;
      color: #6b7fa8;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.5px;
      padding: 10px 16px;
      text-align: left;
      text-transform: uppercase;
    }
    .summaries-table td {
      border-top: 1px solid #1e3060;
      color: #dde1f0;
      font-size: 13px;
      padding: 10px 16px;
    }
    .summaries-table tr:hover td { background: #13244d; }
    .summary-value { color: #c9a84c; font-weight: 600; }

    /* ---- Settings modal ---- */
    .modal-overlay {
      background: rgba(0,0,0,0.75);
      bottom: 0; left: 0; right: 0; top: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      position: fixed;
      z-index: 200;
    }
    .modal {
      background: #0d1b3e;
      border: 1px solid #1e3060;
      border-radius: 14px;
      padding: 32px;
      width: 480px;
      max-width: 95vw;
    }
    .modal h2 { color: #fff; font-size: 18px; margin-bottom: 6px; }
    .modal p  { color: #6b7fa8; font-size: 13px; margin-bottom: 24px; }
    .form-group { margin-bottom: 16px; }
    .form-label { color: #8a9abf; display: block; font-size: 12px; font-weight: 700; letter-spacing: 0.5px; margin-bottom: 6px; text-transform: uppercase; }
    .form-input {
      background: #13244d;
      border: 1px solid #1e3060;
      border-radius: 8px;
      color: #e8ecf8;
      font-family: monospace;
      font-size: 13px;
      outline: none;
      padding: 10px 14px;
      transition: border-color .15s;
      width: 100%;
    }
    .form-input:focus { border-color: #c9a84c; }
    .form-hint { color: #4d6080; font-size: 11px; margin-top: 4px; }
    .modal-actions { display: flex; gap: 10px; justify-content: flex-end; margin-top: 24px; }

    /* ---- States ---- */
    .empty-state {
      background: #0d1b3e;
      border: 1px dashed #1e3060;
      border-radius: 10px;
      color: #4d6080;
      font-size: 14px;
      padding: 48px;
      text-align: center;
    }
    .error-banner {
      background: #3d1515;
      border: 1px solid #e53935;
      border-radius: 8px;
      color: #ff8a80;
      font-size: 13px;
      margin-bottom: 16px;
      padding: 12px 16px;
    }
    .loading-text { color: #6b7fa8; font-size: 13px; padding: 48px; text-align: center; }

    .snoozed-label {
      background: #3d2e10;
      border-radius: 4px;
      color: #ffd54f;
      font-size: 11px;
      font-weight: 600;
      padding: 2px 8px;
    }
  </style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
const { useState, useEffect, useCallback, useRef } = React;

// ---- Helpers ----------------------------------------------------------------

function stored(key, fallback = '') {
  return localStorage.getItem(key) || fallback;
}

function urgencyClass(u) {
  return (u || '').toLowerCase();
}

function makeUrl(base, token, params = {}) {
  const url = new URL(base);
  url.searchParams.set('token', token);
  Object.entries(params).forEach(([k, v]) => { if (v) url.searchParams.set(k, v); });
  return url.toString();
}

async function apiGet(apiUrl, token, params) {
  const res = await fetch(makeUrl(apiUrl, token, params));
  const json = await res.json();
  if (!json.ok) throw new Error(json.error || 'API error');
  return json;
}

// All write operations use GET to avoid CORS preflight from file:// origin
async function apiAction(apiUrl, token, action, params) {
  return apiGet(apiUrl, token, Object.assign({ action }, params));
}

function fmtDate(d) {
  if (!d) return '';
  return d;
}

function timeAgo(dt) {
  if (!dt) return '';
  const diff = Math.round((Date.now() - dt.getTime()) / 1000);
  if (diff < 60) return 'just now';
  if (diff < 3600) return Math.floor(diff / 60) + 'm ago';
  return Math.floor(diff / 3600) + 'h ago';
}

// ---- Settings modal ---------------------------------------------------------

function SettingsModal({ initial, onSave, onClose }) {
  const [url, setUrl]     = useState(initial.url);
  const [token, setToken] = useState(initial.token);

  function save() {
    const u = url.trim();
    const t = token.trim();
    if (!u || !t) return;
    localStorage.setItem('vera_url', u);
    localStorage.setItem('vera_token', t);
    onSave(u, t);
  }

  return (
    <div className="modal-overlay" onClick={e => e.target === e.currentTarget && onClose && onClose()}>
      <div className="modal">
        <h2>⚙️ Connect to VERA API</h2>
        <p>Enter your Apps Script Web App URL and the token from Script Properties.</p>

        <div className="form-group">
          <label className="form-label">Web App URL</label>
          <input
            className="form-input"
            placeholder="https://script.google.com/macros/s/.../exec"
            value={url}
            onChange={e => setUrl(e.target.value)}
          />
        </div>

        <div className="form-group">
          <label className="form-label">VERA_WEB_TOKEN</label>
          <input
            className="form-input"
            placeholder="vera-b479..."
            type="password"
            value={token}
            onChange={e => setToken(e.target.value)}
          />
          <div className="form-hint">Set in Apps Script → Project Settings → Script Properties</div>
        </div>

        <div className="modal-actions">
          {onClose && <button className="btn btn-ghost" onClick={onClose}>Cancel</button>}
          <button className="btn btn-primary" onClick={save} disabled={!url.trim() || !token.trim()}>
            Connect
          </button>
        </div>
      </div>
    </div>
  );
}

// ---- Status bar -------------------------------------------------------------

function StatusBar({ status, loading }) {
  if (!status) return null;
  return (
    <div className="status-bar">
      <div className="stat-pill">
        <div className="stat-dot" style={{ background: '#5c7cff' }} />
        <span className="stat-count">{status.activeFlags}</span>
        <span className="stat-label">active</span>
      </div>
      {status.high > 0 && (
        <div className="stat-pill">
          <div className="stat-dot" style={{ background: '#e53935' }} />
          <span className="stat-count">{status.high}</span>
          <span className="stat-label">high</span>
        </div>
      )}
      {status.medium > 0 && (
        <div className="stat-pill">
          <div className="stat-dot" style={{ background: '#f9a825' }} />
          <span className="stat-count">{status.medium}</span>
          <span className="stat-label">medium</span>
        </div>
      )}
      {status.low > 0 && (
        <div className="stat-pill">
          <div className="stat-dot" style={{ background: '#43a047' }} />
          <span className="stat-count">{status.low}</span>
          <span className="stat-label">low</span>
        </div>
      )}
      <div className="stat-pill" style={{ marginLeft: 'auto' }}>
        <div className="stat-dot" style={{ background: '#6b7fa8' }} />
        <span className="stat-count">{status.totalFlags}</span>
        <span className="stat-label">total all-time</span>
      </div>
      {status.lastRun && (
        <span className="last-updated" style={{ fontSize: 11 }}>
          Last run: {status.lastRun}
        </span>
      )}
    </div>
  );
}

// ---- Flag card --------------------------------------------------------------

function FlagCard({ flag, onAction, busy }) {
  const uc = urgencyClass(flag.urgency);
  const isDone = flag.acknowledged || flag.resolved;

  return (
    <div className={`flag-card ${uc} ${isDone ? 'done' : ''}`}>
      <div className="flag-meta">
        <span className={`urgency-badge ${uc}`}>{flag.urgency}</span>
        <span className="source-badge">{flag.source}</span>
        {flag.snoozedUntil && (
          <span className="snoozed-label">💤 until {flag.snoozedUntil}</span>
        )}
        {flag.acknowledged && <span className="snoozed-label" style={{ background: '#1e3878', color: '#c9d9ff' }}>✓ ack</span>}
        {flag.resolved     && <span className="snoozed-label" style={{ background: '#0f3020', color: '#69f0ae' }}>✓ resolved</span>}
        <span className="flag-date">{fmtDate(flag.date)}</span>
      </div>

      <div className="flag-title">{flag.flag}</div>
      <div className="flag-reason">{flag.reason}</div>

      {!isDone && (
        <div className="flag-actions">
          <button
            className="btn btn-ack"
            disabled={busy}
            onClick={() => onAction('acknowledge', flag.id)}
          >
            ✓ Acknowledge
          </button>
          <button
            className="btn btn-snooze"
            disabled={busy}
            onClick={() => onAction('snooze', flag.id, 2)}
          >
            💤 Snooze 2d
          </button>
          <button
            className="btn btn-resolve"
            disabled={busy}
            onClick={() => onAction('resolve', flag.id)}
          >
            ✅ Resolve
          </button>
        </div>
      )}
    </div>
  );
}

// ---- Task card --------------------------------------------------------------

function TaskCard({ task }) {
  const ageClass = task.isOverdue ? 'overdue' : task.isNeglected ? 'neglected' : '';
  const ageLabel = task.isOverdue
    ? `${Math.abs(task.daysUntilDue)}d late`
    : task.ageInDays != null
      ? `${task.ageInDays}d old`
      : '';

  return (
    <div className="task-card">
      <div className={`task-age ${ageClass}`}>{ageLabel}</div>
      <div className="task-info">
        <div className="task-title">{task.task}</div>
        <div className="task-meta">
          {task.status && <span style={{ marginRight: 12 }}>Status: {task.status}</span>}
          {task.dueDate && (
            <span className={task.isOverdue ? 'task-due' : ''}>
              Due: {task.dueDate}
            </span>
          )}
          {task.notes && <span style={{ marginLeft: 12, color: '#4d6080' }}>{task.notes}</span>}
        </div>
      </div>
    </div>
  );
}

// ---- Summaries table --------------------------------------------------------

function SummariesTab({ summaries }) {
  if (!summaries.length) {
    return <div className="empty-state">No summaries in the Summaries tab yet.</div>;
  }
  return (
    <table className="summaries-table" cellSpacing="0">
      <thead>
        <tr>
          <th>Source</th>
          <th>Metric</th>
          <th>Value</th>
          <th>As Of</th>
        </tr>
      </thead>
      <tbody>
        {summaries.map((s, i) => (
          <tr key={i}>
            <td><span className="source-badge">{s.source}</span></td>
            <td>{s.metric}</td>
            <td className="summary-value">{s.value}</td>
            <td style={{ color: '#6b7fa8' }}>{s.asOf}</td>
          </tr>
        ))}
      </tbody>
    </table>
  );
}

// ---- App --------------------------------------------------------------------

function App() {
  const [apiUrl,   setApiUrl]   = useState(() => stored('vera_url'));
  const [apiToken, setApiToken] = useState(() => stored('vera_token'));
  const [showSettings, setShowSettings] = useState(() => !stored('vera_url'));
  const [activeTab,    setActiveTab]    = useState('flags');
  const [filterActive, setFilterActive] = useState(true);
  const [loading,  setLoading]  = useState(false);
  const [busy,     setBusy]     = useState(false);
  const [error,    setError]    = useState(null);
  const [lastUpdated, setLastUpdated] = useState(null);
  const [status,     setStatus]     = useState(null);
  const [flags,      setFlags]      = useState([]);
  const [tasks,      setTasks]      = useState([]);
  const [summaries,  setSummaries]  = useState([]);

  const loadAll = useCallback(async (url, token, activeOnly) => {
    if (!url || !token) return;
    setLoading(true);
    setError(null);
    try {
      const [s, f, t, sm] = await Promise.all([
        apiGet(url, token, { action: 'status' }),
        apiGet(url, token, { action: 'flags', filter: activeOnly ? 'active' : '' }),
        apiGet(url, token, { action: 'tasks' }),
        apiGet(url, token, { action: 'summaries' }),
      ]);
      setStatus(s);
      // Sort flags: High first, then Medium, then Low
      const order = { High: 0, Medium: 1, Low: 2 };
      const sorted = (f.flags || []).sort((a, b) =>
        (order[a.urgency] ?? 3) - (order[b.urgency] ?? 3)
      );
      setFlags(sorted);
      setTasks(t.tasks || []);
      setSummaries(sm.summaries || []);
      setLastUpdated(new Date());
    } catch (err) {
      setError(err.message);
    }
    setLoading(false);
  }, []);

  // Load on mount and when filter changes
  useEffect(() => {
    if (apiUrl && apiToken) loadAll(apiUrl, apiToken, filterActive);
  }, [apiUrl, apiToken, filterActive, loadAll]);

  async function handleAction(action, id, days) {
    setBusy(true);
    setError(null);
    try {
      const params = { id };
      if (days != null) params.days = days;
      await apiAction(apiUrl, apiToken, action, params);
      await loadAll(apiUrl, apiToken, filterActive);
    } catch (err) {
      setError('Action failed: ' + err.message);
    }
    setBusy(false);
  }

  function handleConnect(url, token) {
    setApiUrl(url);
    setApiToken(token);
    setShowSettings(false);
    loadAll(url, token, filterActive);
  }

  // ---- Render ----

  const isConfigured = apiUrl && apiToken;

  return (
    <>
      {/* Header */}
      <div className="header">
        <div className="logo">
          <span className="logo-name">VERA</span>
          <span className="logo-sub">Chief of Staff</span>
        </div>
        <div className="header-actions">
          {lastUpdated && (
            <span className="last-updated">Updated {timeAgo(lastUpdated)}</span>
          )}
          {isConfigured && (
            <button
              className="btn btn-refresh"
              style={{ fontSize: 12, padding: '5px 14px' }}
              disabled={loading}
              onClick={() => loadAll(apiUrl, apiToken, filterActive)}
            >
              {loading ? '⟳ Loading…' : '⟳ Refresh'}
            </button>
          )}
          <button className="btn-settings" onClick={() => setShowSettings(true)} title="Settings">⚙</button>
        </div>
      </div>

      {/* Settings modal */}
      {showSettings && (
        <SettingsModal
          initial={{ url: apiUrl, token: apiToken }}
          onSave={handleConnect}
          onClose={isConfigured ? () => setShowSettings(false) : null}
        />
      )}

      {/* Not connected yet */}
      {!isConfigured && !showSettings && (
        <div className="main">
          <div className="empty-state">
            <div style={{ fontSize: 40, marginBottom: 16 }}>🔌</div>
            <div style={{ fontSize: 16, color: '#dde1f0', marginBottom: 8 }}>Not connected</div>
            <div style={{ marginBottom: 20 }}>Click the ⚙ icon to add your API URL and token</div>
          </div>
        </div>
      )}

      {/* Connected UI */}
      {isConfigured && (
        <>
          <StatusBar status={status} loading={loading} />

          <div className="tabs">
            {['flags', 'tasks', 'summaries'].map(tab => (
              <button
                key={tab}
                className={`tab-btn ${activeTab === tab ? 'active' : ''}`}
                onClick={() => setActiveTab(tab)}
              >
                {tab === 'flags'     ? `🚩 Flags${status ? ` (${status.activeFlags})` : ''}` : ''}
                {tab === 'tasks'     ? `✅ Tasks${tasks.length ? ` (${tasks.length})` : ''}` : ''}
                {tab === 'summaries' ? `📊 Summaries` : ''}
              </button>
            ))}
          </div>

          <div className="main">
            {error && <div className="error-banner">⚠️ {error}</div>}

            {/* Flags tab */}
            {activeTab === 'flags' && (
              <>
                <div className="toolbar">
                  <button
                    className={`filter-toggle ${filterActive ? 'on' : ''}`}
                    onClick={() => setFilterActive(v => !v)}
                  >
                    {filterActive ? '● Active only' : '○ All flags'}
                  </button>
                  <span className="count-badge">{flags.length} shown</span>
                </div>

                {loading && flags.length === 0
                  ? <div className="loading-text">Loading flags…</div>
                  : flags.length === 0
                    ? <div className="empty-state">
                        <div style={{ fontSize: 32, marginBottom: 12 }}>🎉</div>
                        <div>No {filterActive ? 'active ' : ''}flags — you're all clear!</div>
                      </div>
                    : flags.map(flag => (
                        <FlagCard
                          key={flag.id}
                          flag={flag}
                          onAction={handleAction}
                          busy={busy}
                        />
                      ))
                }
              </>
            )}

            {/* Tasks tab */}
            {activeTab === 'tasks' && (
              <>
                {loading && tasks.length === 0
                  ? <div className="loading-text">Loading tasks…</div>
                  : tasks.length === 0
                    ? <div className="empty-state">No open tasks found in the Tasks tab.</div>
                    : tasks.map((task, i) => <TaskCard key={i} task={task} />)
                }
              </>
            )}

            {/* Summaries tab */}
            {activeTab === 'summaries' && (
              loading && summaries.length === 0
                ? <div className="loading-text">Loading summaries…</div>
                : <SummariesTab summaries={summaries} />
            )}
          </div>
        </>
      )}
    </>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
