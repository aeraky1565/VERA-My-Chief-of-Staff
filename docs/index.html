<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>VERA Dashboard</title>
  <script crossorigin src="https://cdn.jsdelivr.net/npm/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://cdn.jsdelivr.net/npm/react-dom@18/umd/react-dom.production.min.js"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: #080f1e;
      color: #dde1f0;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif;
      min-height: 100vh;
    }

    /* ---- Scrollbar ---- */
    ::-webkit-scrollbar { width: 6px; }
    ::-webkit-scrollbar-track { background: #0d1b3e; }
    ::-webkit-scrollbar-thumb { background: #2a3a5e; border-radius: 3px; }

    /* ---- Header ---- */
    .header {
      background: linear-gradient(135deg, #0d1b3e 0%, #152547 100%);
      border-bottom: 1px solid #1e3060;
      padding: 0 28px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      height: 60px;
      position: sticky;
      top: 0;
      z-index: 100;
    }
    .logo {
      display: flex;
      align-items: baseline;
      gap: 10px;
    }
    .logo-name {
      font-size: 22px;
      font-weight: 800;
      letter-spacing: 4px;
      color: #fff;
    }
    .logo-sub {
      font-size: 10px;
      letter-spacing: 2px;
      color: #c9a84c;
      text-transform: uppercase;
    }
    .header-actions {
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .last-updated {
      font-size: 11px;
      color: #6b7fa8;
    }

    /* ---- Status bar ---- */
    .status-bar {
      background: #0d1b3e;
      border-bottom: 1px solid #1e3060;
      padding: 12px 28px;
      display: flex;
      gap: 20px;
      align-items: center;
    }
    .stat-pill {
      display: flex;
      align-items: center;
      gap: 7px;
      background: #13244d;
      border-radius: 20px;
      padding: 5px 14px;
      font-size: 13px;
    }
    .stat-dot {
      width: 9px;
      height: 9px;
      border-radius: 50%;
    }
    .stat-count { font-weight: 700; color: #fff; }
    .stat-label { color: #8a9abf; }

    /* ---- Tabs ---- */
    .tabs {
      background: #0d1b3e;
      border-bottom: 1px solid #1e3060;
      padding: 0 28px;
      display: flex;
      gap: 4px;
    }
    .tab-btn {
      background: none;
      border: none;
      border-bottom: 3px solid transparent;
      color: #6b7fa8;
      cursor: pointer;
      font-size: 13px;
      font-weight: 600;
      letter-spacing: 0.5px;
      padding: 12px 16px;
      text-transform: uppercase;
      transition: color .15s, border-color .15s;
    }
    .tab-btn:hover { color: #c9a84c; }
    .tab-btn.active { color: #c9a84c; border-bottom-color: #c9a84c; }

    /* ---- Main content ---- */
    .main { padding: 24px 28px; max-width: 960px; }

    /* ---- Toolbar ---- */
    .toolbar {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 20px;
    }
    .filter-toggle {
      background: #13244d;
      border: 1px solid #1e3060;
      border-radius: 20px;
      color: #8a9abf;
      cursor: pointer;
      font-size: 12px;
      font-weight: 600;
      padding: 5px 14px;
      transition: all .15s;
    }
    .filter-toggle.on { background: #1e3878; border-color: #3d5fa0; color: #c9d9ff; }
    .count-badge {
      background: #13244d;
      border-radius: 10px;
      color: #6b7fa8;
      font-size: 12px;
      margin-left: auto;
      padding: 3px 10px;
    }

    /* ---- Flag card ---- */
    .flag-card {
      border-radius: 10px;
      border-left: 4px solid;
      margin-bottom: 12px;
      padding: 16px 18px;
      transition: opacity .2s;
    }
    .flag-card.high   { background: #1f0e0e; border-color: #e53935; }
    .flag-card.medium { background: #1f1608; border-color: #f9a825; }
    .flag-card.low    { background: #0a1f10; border-color: #43a047; }
    .flag-card.done   { opacity: 0.45; }

    .flag-meta {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 8px;
      flex-wrap: wrap;
    }
    .urgency-badge {
      border-radius: 4px;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.5px;
      padding: 2px 8px;
      text-transform: uppercase;
    }
    .urgency-badge.high   { background: #e53935; color: #fff; }
    .urgency-badge.medium { background: #f9a825; color: #1a1000; }
    .urgency-badge.low    { background: #43a047; color: #fff; }

    .source-badge {
      background: #1e3060;
      border-radius: 4px;
      color: #8ab0d8;
      font-size: 11px;
      font-weight: 600;
      padding: 2px 8px;
    }
    .flag-date { color: #6b7fa8; font-size: 11px; margin-left: auto; }

    .flag-title {
      color: #e8ecf8;
      font-size: 15px;
      font-weight: 600;
      margin-bottom: 5px;
    }
    .flag-reason { color: #8a9abf; font-size: 13px; line-height: 1.5; }

    .flag-actions {
      display: flex;
      gap: 8px;
      margin-top: 12px;
      flex-wrap: wrap;
    }

    /* ---- Buttons ---- */
    .btn {
      border: none;
      border-radius: 6px;
      cursor: pointer;
      font-size: 12px;
      font-weight: 600;
      padding: 6px 14px;
      transition: opacity .15s, transform .1s;
    }
    .btn:hover { opacity: 0.85; transform: translateY(-1px); }
    .btn:active { transform: translateY(0); }
    .btn:disabled { opacity: 0.4; cursor: not-allowed; transform: none; }
    .btn-ack     { background: #1e3878; color: #c9d9ff; }
    .btn-snooze  { background: #3d2e10; color: #ffd54f; }
    .btn-resolve { background: #0f3020; color: #69f0ae; }
    .btn-primary { background: #c9a84c; color: #0d1b3e; }
    .btn-ghost   { background: #13244d; color: #8a9abf; }
    .btn-refresh { background: #13244d; border: 1px solid #1e3060; color: #8a9abf; }
    .btn-settings{ background: none; border: none; color: #6b7fa8; cursor: pointer; font-size: 18px; padding: 4px 8px; }
    .btn-settings:hover { color: #c9a84c; }

    /* ---- Task card ---- */
    .task-card {
      background: #0d1b3e;
      border: 1px solid #1e3060;
      border-radius: 10px;
      display: flex;
      align-items: flex-start;
      gap: 14px;
      margin-bottom: 10px;
      padding: 14px 16px;
      transition: opacity .3s;
    }
    .task-card.completing { opacity: 0.45; }

    .task-check {
      background: none;
      border: 2px solid #2a3a5e;
      border-radius: 50%;
      color: transparent;
      cursor: pointer;
      flex-shrink: 0;
      font-size: 13px;
      font-weight: 700;
      height: 22px;
      width: 22px;
      margin-top: 1px;
      padding: 0;
      transition: all .15s;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .task-check:hover:not(:disabled) { border-color: #43a047; color: #43a047; }
    .task-check.completing { background: #43a047; border-color: #43a047; color: #fff; }
    .task-check:disabled { cursor: not-allowed; }
    .task-age {
      background: #13244d;
      border-radius: 6px;
      color: #6b7fa8;
      font-size: 11px;
      font-weight: 700;
      min-width: 48px;
      padding: 4px 8px;
      text-align: center;
    }
    .task-age.overdue  { background: #3d1515; color: #ff6b6b; }
    .task-age.neglected{ background: #3d2e10; color: #ffd54f; }
    .task-info { flex: 1; }
    .task-title { color: #e8ecf8; font-size: 14px; font-weight: 600; margin-bottom: 4px; }
    .task-meta  { color: #6b7fa8; font-size: 12px; }
    .task-due   { color: #ff6b6b; }

    /* ---- Summaries table ---- */
    .summaries-table {
      background: #0d1b3e;
      border: 1px solid #1e3060;
      border-radius: 10px;
      overflow: hidden;
      width: 100%;
    }
    .summaries-table th {
      background: #13244d;
      color: #6b7fa8;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.5px;
      padding: 10px 16px;
      text-align: left;
      text-transform: uppercase;
    }
    .summaries-table td {
      border-top: 1px solid #1e3060;
      color: #dde1f0;
      font-size: 13px;
      padding: 10px 16px;
    }
    .summaries-table tr:hover td { background: #13244d; }
    .summary-value { color: #c9a84c; font-weight: 600; }

    /* ---- Settings modal ---- */
    .modal-overlay {
      background: rgba(0,0,0,0.75);
      bottom: 0; left: 0; right: 0; top: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      position: fixed;
      z-index: 200;
    }
    .modal {
      background: #0d1b3e;
      border: 1px solid #1e3060;
      border-radius: 14px;
      padding: 32px;
      width: 480px;
      max-width: 95vw;
    }
    .modal h2 { color: #fff; font-size: 18px; margin-bottom: 6px; }
    .modal p  { color: #6b7fa8; font-size: 13px; margin-bottom: 24px; }
    .form-group { margin-bottom: 16px; }
    .form-label { color: #8a9abf; display: block; font-size: 12px; font-weight: 700; letter-spacing: 0.5px; margin-bottom: 6px; text-transform: uppercase; }
    .form-input {
      background: #13244d;
      border: 1px solid #1e3060;
      border-radius: 8px;
      color: #e8ecf8;
      font-family: monospace;
      font-size: 13px;
      outline: none;
      padding: 10px 14px;
      transition: border-color .15s;
      width: 100%;
    }
    .form-input:focus { border-color: #c9a84c; }
    .form-hint { color: #4d6080; font-size: 11px; margin-top: 4px; }
    .modal-actions { display: flex; gap: 10px; justify-content: flex-end; margin-top: 24px; }

    /* ---- States ---- */
    .empty-state {
      background: #0d1b3e;
      border: 1px dashed #1e3060;
      border-radius: 10px;
      color: #4d6080;
      font-size: 14px;
      padding: 48px;
      text-align: center;
    }
    .error-banner {
      background: #3d1515;
      border: 1px solid #e53935;
      border-radius: 8px;
      color: #ff8a80;
      font-size: 13px;
      margin-bottom: 16px;
      padding: 12px 16px;
    }
    .loading-text { color: #6b7fa8; font-size: 13px; padding: 48px; text-align: center; }

    .snoozed-label {
      background: #3d2e10;
      border-radius: 4px;
      color: #ffd54f;
      font-size: 11px;
      font-weight: 600;
      padding: 2px 8px;
    }

    /* ---- Chat panel ---- */
    .chat-wrap {
      display: flex;
      flex-direction: column;
      height: calc(100vh - 215px);
      min-height: 400px;
    }
    .chat-messages {
      flex: 1;
      overflow-y: auto;
      padding: 4px 0 16px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .chat-msg {
      max-width: 78%;
      padding: 11px 16px;
      border-radius: 16px;
      font-size: 14px;
      line-height: 1.55;
      white-space: pre-wrap;
      word-break: break-word;
    }
    .chat-msg.vera {
      background: #0d1b3e;
      border: 1px solid #1e3060;
      border-bottom-left-radius: 4px;
      color: #dde1f0;
      align-self: flex-start;
    }
    .chat-msg.user {
      background: #1e3878;
      border: 1px solid #3d5fa0;
      border-bottom-right-radius: 4px;
      color: #c9d9ff;
      align-self: flex-end;
    }
    .chat-msg.vera-typing {
      color: #6b7fa8;
      font-style: italic;
    }
    .chat-input-area {
      border-top: 1px solid #1e3060;
      padding-top: 12px;
    }
    .chat-input-row {
      display: flex;
      gap: 10px;
    }
    .chat-input {
      flex: 1;
      background: #0d1b3e;
      border: 1px solid #1e3060;
      border-radius: 10px;
      color: #e8ecf8;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif;
      font-size: 14px;
      line-height: 1.4;
      outline: none;
      padding: 10px 14px;
      resize: none;
      transition: border-color .15s;
    }
    .chat-input:focus { border-color: #c9a84c; }
    .chat-input::placeholder { color: #3d5280; }
    .chat-send {
      background: #c9a84c;
      border: none;
      border-radius: 10px;
      color: #0d1b3e;
      cursor: pointer;
      font-size: 20px;
      font-weight: 700;
      padding: 0 18px;
      align-self: flex-end;
      height: 44px;
      transition: opacity .15s;
    }
    .chat-send:hover { opacity: 0.85; }
    .chat-send:disabled { opacity: 0.35; cursor: not-allowed; }

    /* ---- Image attachment (chat) ---- */
    .chat-img-preview {
      position: relative;
      display: inline-flex;
      align-items: flex-start;
      margin-bottom: 8px;
    }
    .chat-img-preview img {
      max-height: 80px;
      max-width: 120px;
      border-radius: 8px;
      border: 1px solid #1e3060;
      object-fit: cover;
    }
    .chat-img-remove {
      position: absolute;
      top: -6px;
      right: -6px;
      background: #e53935;
      color: #fff;
      border: none;
      border-radius: 50%;
      width: 18px;
      height: 18px;
      font-size: 11px;
      cursor: pointer;
      line-height: 18px;
      padding: 0;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .chat-attach {
      background: none;
      border: 1px solid #2a4070;
      border-radius: 10px;
      color: #8899cc;
      font-size: 18px;
      padding: 0 12px;
      cursor: pointer;
      align-self: flex-end;
      height: 44px;
      transition: border-color .15s, color .15s;
    }
    .chat-attach:hover  { border-color: #c9a84c; color: #c9a84c; }
    .chat-attach:disabled { opacity: .4; cursor: not-allowed; }
    .chat-mic {
      background: none;
      border: 1px solid #2a4070;
      border-radius: 10px;
      color: #8899cc;
      font-size: 18px;
      padding: 0 12px;
      cursor: pointer;
      align-self: flex-end;
      height: 44px;
      transition: border-color .15s, color .15s;
    }
    .chat-mic:hover   { border-color: #c9a84c; color: #c9a84c; }
    .chat-mic:disabled { opacity: .4; cursor: not-allowed; }
    .chat-mic.listening {
      border-color: #ef5350;
      color: #ef5350;
      animation: mic-pulse 1s ease-in-out infinite;
    }
    @keyframes mic-pulse {
      0%, 100% { opacity: 1; }
      50%       { opacity: 0.4; }
    }
    .voice-status {
      font-size: 11px;
      color: #ef5350;
      margin-bottom: 4px;
      padding-left: 2px;
      letter-spacing: 0.03em;
    }
    .chat-msg-img {
      display: block;
      max-width: 200px;
      max-height: 140px;
      border-radius: 8px;
      margin-bottom: 6px;
      object-fit: cover;
      border: 1px solid rgba(255,255,255,.1);
    }

    /* ---- Travel sub-tab pills ---- */
    .subtab-row {
      display: flex;
      gap: 8px;
      margin-bottom: 18px;
      flex-wrap: wrap;
    }
    .subtab-btn {
      background: none;
      border: 1px solid #1e3060;
      border-radius: 20px;
      color: #6b7fa8;
      font-size: 12px;
      padding: 5px 14px;
      cursor: pointer;
      transition: border-color .15s, color .15s;
      white-space: nowrap;
    }
    .subtab-btn:hover  { border-color: #3d5fa0; color: #c9d9ff; }
    .subtab-btn.active { border-color: #c9a84c; color: #c9a84c; background: rgba(201,168,76,.08); }

    /* ---- Toast notification ---- */
    .toast {
      position: fixed;
      bottom: 28px;
      right: 28px;
      background: #0f3020;
      border: 1px solid #43a047;
      border-radius: 10px;
      color: #69f0ae;
      font-size: 14px;
      font-weight: 600;
      padding: 14px 22px;
      z-index: 300;
      box-shadow: 0 4px 20px rgba(0,0,0,0.5);
      animation: slideUp 0.2s ease;
    }
    .toast.error {
      background: #3d1515;
      border-color: #e53935;
      color: #ff8a80;
    }
    @keyframes slideUp {
      from { opacity: 0; transform: translateY(12px); }
      to   { opacity: 1; transform: translateY(0); }
    }
    @keyframes vera-pulse {
      0%, 100% { opacity: 1; }
      50%       { opacity: 0.35; }
    }
    .vera-inair { animation: vera-pulse 1.5s ease-in-out infinite; }

    /* ---- Date input dark theme ---- */
    input[type="date"].form-input {
      color-scheme: dark;
    }
    .btn-edit {
      background: none;
      border: none;
      color: #4d6080;
      cursor: pointer;
      font-size: 14px;
      padding: 2px 6px;
      border-radius: 4px;
      flex-shrink: 0;
      line-height: 1;
    }
    .btn-edit:hover { color: #c9a84c; background: #13244d; }

    /* ---- Yearly Goals Kanban ---- */
    .kanban-board {
      display: flex;
      gap: 12px;
      overflow-x: auto;
      padding-bottom: 12px;
      align-items: flex-start;
    }
    .kanban-col {
      flex: 0 0 220px;
      background: #0d1b3e;
      border-radius: 10px;
      padding: 12px;
      border: 2px solid #1e3a6e;
      transition: border-color 0.15s;
    }
    .kanban-col.drag-over { border-color: #c9a84c; }
    .kanban-col-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 10px;
    }
    .kanban-col-title {
      font-size: 13px;
      font-weight: 700;
      color: #c9a84c;
      letter-spacing: 0.5px;
      text-transform: uppercase;
    }
    .kanban-col-count {
      font-size: 11px;
      background: #1e3a6e;
      color: #8ab4f8;
      border-radius: 10px;
      padding: 2px 7px;
    }
    .kanban-add-btn {
      width: 100%;
      background: none;
      border: 1px dashed #2a4580;
      border-radius: 6px;
      color: #4d6080;
      font-size: 12px;
      padding: 6px;
      cursor: pointer;
      margin-top: 8px;
      transition: border-color 0.15s, color 0.15s;
    }
    .kanban-add-btn:hover { border-color: #c9a84c; color: #c9a84c; }
    .goal-card {
      background: #1a2744;
      border: 1px solid #2a4580;
      border-radius: 8px;
      padding: 10px;
      margin-bottom: 8px;
      cursor: grab;
      user-select: none;
      transition: opacity 0.15s, box-shadow 0.15s;
    }
    .goal-card:active { cursor: grabbing; }
    .goal-card.dragging { opacity: 0.4; }
    .goal-card-title { font-size: 13px; color: #e0e8f8; font-weight: 600; margin-bottom: 6px; line-height: 1.3; }
    .goal-card-meta { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 6px; }
    .goal-cat-pill {
      font-size: 10px;
      background: #0d1b3e;
      border: 1px solid #2a4580;
      border-radius: 10px;
      padding: 1px 7px;
      color: #8ab4f8;
    }
    .goal-year-badge { font-size: 10px; color: #4d6080; }
    .goal-progress-bar {
      height: 4px;
      background: #1e3a6e;
      border-radius: 2px;
      margin-bottom: 6px;
      overflow: hidden;
    }
    .goal-progress-fill { height: 100%; background: #c9a84c; border-radius: 2px; transition: width 0.3s; }
    .goal-card-actions { display: flex; gap: 6px; justify-content: flex-end; }

    /* ---- Interests tab ---- */
    .interests-toolbar { display: flex; gap: 8px; align-items: center; margin-bottom: 16px; flex-wrap: wrap; }
    .person-pill {
      font-size: 12px;
      padding: 4px 14px;
      border-radius: 20px;
      border: 1px solid #2a4580;
      background: transparent;
      color: #8ab4f8;
      cursor: pointer;
      transition: background 0.15s, border-color 0.15s;
    }
    .person-pill.active { background: #1e3a6e; border-color: #8ab4f8; color: #fff; }
    .person-pill:hover:not(.active) { border-color: #c9a84c; color: #c9a84c; }
    .interests-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
      gap: 12px;
    }
    .interest-card {
      background: #0d1b3e;
      border: 1px solid #1e3060;
      border-radius: 10px;
      padding: 14px 16px;
      display: flex;
      flex-direction: column;
      gap: 8px;
      transition: border-color 0.15s;
    }
    .interest-card:hover { border-color: #2a4580; }
    .interest-card-top { display: flex; align-items: flex-start; justify-content: space-between; gap: 8px; }
    .interest-text { font-size: 13px; color: #e0e8f8; font-weight: 500; line-height: 1.4; flex: 1; }
    .interest-card-meta { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }
    .interest-person-badge {
      font-size: 10px;
      padding: 2px 8px;
      border-radius: 10px;
      font-weight: 600;
      letter-spacing: 0.5px;
    }
    .interest-person-badge.ahmed   { background: #1e3a6e; color: #8ab4f8; }
    .interest-person-badge.victoria { background: #3a1e5e; color: #c9a8f8; }
    .interest-cat-pill {
      font-size: 10px;
      background: #152547;
      border: 1px solid #2a4580;
      border-radius: 10px;
      padding: 1px 7px;
      color: #c9a84c;
    }
    .interest-date { font-size: 10px; color: #4d6080; margin-left: auto; }
    .interest-notes { font-size: 11px; color: #6b7fa8; font-style: italic; }
    .btn-archive { background: none; border: none; cursor: pointer; font-size: 14px; opacity: 0.5; padding: 2px 4px; transition: opacity 0.15s; flex-shrink: 0; }
    .btn-archive:hover { opacity: 1; }

    /* ---- PTO tab ---- */
    .pto-grid-2 {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 16px;
      margin-bottom: 20px;
    }
    @media (max-width: 620px) { .pto-grid-2 { grid-template-columns: 1fr; } }
    .pto-card {
      background: #0d1b3e;
      border: 1px solid #1e3060;
      border-radius: 10px;
      padding: 20px;
    }
    .pto-section {
      background: #0d1b3e;
      border: 1px solid #1e3060;
      border-radius: 10px;
      padding: 20px;
      margin-bottom: 16px;
    }
    .pto-section-title {
      font-size: 12px;
      font-weight: 700;
      color: #8a9abf;
      letter-spacing: 0.5px;
      text-transform: uppercase;
      margin-bottom: 14px;
    }
    .pto-balance-num {
      font-size: 28px;
      font-weight: 800;
      margin-bottom: 4px;
    }
    .pto-balance-sub { font-size: 12px; color: #6b7fa8; margin-bottom: 12px; }
    .pto-bar-track {
      height: 5px;
      background: #1e3060;
      border-radius: 3px;
      overflow: hidden;
    }
    .pto-bar-fill {
      height: 100%;
      border-radius: 3px;
      transition: width 0.4s;
    }
    .pto-row {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 9px 0;
    }
    .pto-row + .pto-row { border-top: 1px solid #13244d; }
    .pto-pill {
      font-size: 11px;
      font-weight: 700;
      border-radius: 4px;
      padding: 2px 8px;
    }
    .pto-dot {
      display: inline-block;
      width: 14px;
      height: 14px;
      border-radius: 50%;
      margin-right: 5px;
      vertical-align: middle;
    }

    /* ---- Milestone card ---- */
    .milestone-card {
      background: #0d1b3e;
      border: 1px solid #1e3060;
      border-left: 4px solid #c9a84c;
      border-radius: 10px;
      margin-bottom: 20px;
      padding: 20px;
    }
    .milestone-card.urgent { border-left-color: #e53935; }
    .milestone-header {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      margin-bottom: 16px;
      flex-wrap: wrap;
      gap: 8px;
    }
    .milestone-name {
      font-size: 17px;
      font-weight: 700;
      color: #e8ecf8;
    }
    .milestone-countdown {
      font-size: 13px;
      font-weight: 700;
      background: #1e3060;
      border-radius: 20px;
      padding: 4px 14px;
      color: #c9a84c;
    }
    .milestone-countdown.soon { background: #3d1515; color: #ff6b6b; }
    .milestone-section-label {
      font-size: 11px;
      font-weight: 700;
      color: #6b7fa8;
      letter-spacing: 0.5px;
      text-transform: uppercase;
      margin: 14px 0 8px;
    }
    .milestone-empty { font-size: 12px; color: #4d6080; padding: 6px 0; }

    /* ---- Home tab bento grid ---- */
    .bento-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
      gap: 16px;
    }
    @media (max-width: 620px) { .bento-grid { grid-template-columns: 1fr; } }
    .bento-card {
      background: #0d1b3e;
      border: 1px solid #1e3060;
      border-radius: 10px;
      padding: 20px;
      cursor: pointer;
      transition: border-color .15s, transform .1s;
    }
    .bento-card:hover { border-color: #3d5fa0; transform: translateY(-2px); }
    .bento-card-title {
      font-size: 12px;
      font-weight: 700;
      color: #8a9abf;
      letter-spacing: 0.5px;
      text-transform: uppercase;
      margin-bottom: 12px;
    }
    .bento-card-main {
      font-size: 28px;
      font-weight: 800;
      color: #c9a84c;
      margin-bottom: 4px;
    }
    .bento-card-sub { font-size: 12px; color: #6b7fa8; margin-bottom: 10px; }
    .bento-card-list { display: flex; flex-direction: column; gap: 4px; }
    .bento-item {
      font-size: 13px;
      color: #dde1f0;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    /* ============================================================
       RESPONSIVE — tablet  (≤ 768px)
       ============================================================ */
    @media (max-width: 768px) {
      .header     { padding: 0 16px; }
      .status-bar { padding: 10px 16px; }
      .tabs       { padding: 0 8px; }
      .main       { padding: 18px 16px; }
    }

    /* ============================================================
       RESPONSIVE — phone  (≤ 480px)
       ============================================================ */
    @media (max-width: 480px) {
      /* Header — tighten + hide low-priority chrome */
      .header       { padding: 0 12px; height: 54px; }
      .logo-sub     { display: none; }
      .last-updated { display: none; }

      /* Status bar — allow pills to wrap to a second row */
      .status-bar { padding: 8px 12px; flex-wrap: wrap; gap: 8px; }
      .stat-pill  { padding: 4px 10px; font-size: 12px; }

      /* Nav tabs — swipeable horizontal scroll, no visible scrollbar */
      .tabs { padding: 0; overflow-x: auto; -webkit-overflow-scrolling: touch; scrollbar-width: none; }
      .tabs::-webkit-scrollbar { display: none; }
      .tab-btn { padding: 10px 14px; font-size: 12px; white-space: nowrap; flex-shrink: 0; }

      /* Main content area */
      .main { padding: 14px 12px; }

      /* Toolbar — filter pills wrap on narrow screens */
      .toolbar { flex-wrap: wrap; gap: 8px; }

      /* Modals — reduce inner padding */
      .modal { padding: 20px; border-radius: 10px; }

      /* Chat bubbles — use more of the available width */
      .chat-msg { max-width: 90%; }

      /* Interests grid — single column */
      .interests-grid { grid-template-columns: 1fr; }
    }
  </style>
</head>
