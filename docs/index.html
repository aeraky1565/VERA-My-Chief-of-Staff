function HomestewardView({ items, loading, busy, onRecordService }) {
  if (loading) return <div style={{ fontSize: 13, color: '#6b7fa8', padding: 16 }}>Loading home items…</div>;
  if (!items.length) return (
    <div className="empty-state" style={{ marginTop: 8 }}>
      <div style={{ fontSize: 32, marginBottom: 12 }}>🏠</div>
      <div style={{ color: '#dde1f0', marginBottom: 6 }}>No home items yet</div>
      <div style={{ fontSize: 12, color: '#4d6080' }}>Add rows to the Home Items tab in your Life OS sheet.</div>
    </div>
  );

  function warrantyBadge(days) {
    if (days === null || days === undefined) return null;
    if (days < 0)  return { label: '🔴 Expired',       color: '#ef5350', bg: 'rgba(239,83,80,.12)' };
    if (days <= 30) return { label: `🟡 Expires in ${days}d`, color: '#f5a623', bg: 'rgba(245,166,35,.12)' };
    return { label: '🟢 Valid',           color: '#66bb6a', bg: 'rgba(102,187,106,.12)' };
  }
  function serviceBadge(days) {
    if (days === null || days === undefined) return null;
    if (days < 0)  return { label: '🔴 Overdue',      color: '#ef5350', bg: 'rgba(239,83,80,.12)' };
    if (days <= 14) return { label: `🟡 Due in ${days}d`, color: '#f5a623', bg: 'rgba(245,166,35,.12)' };
    return { label: '🟢 Scheduled',       color: '#66bb6a', bg: 'rgba(102,187,106,.12)' };
  }
  function badge(b, label, color, bg) {
    return <span style={{ fontSize: 10, padding: '2px 7px', borderRadius: 10, border: `1px solid ${color}`, color, background: bg, whiteSpace: 'nowrap' }}>{label}</span>;
  }

  // Group by category
  const grouped = {}, uncategorised = [];
  items.forEach(item => {
    const cat = (item.category || '').trim();
    if (!cat) { uncategorised.push(item); return; }
    if (!grouped[cat]) grouped[cat] = [];
    grouped[cat].push(item);
  });
  const cats = Object.keys(grouped).sort();
  if (uncategorised.length) cats.push('');

  // Alert: items with overdue service
  const overdueCount = items.filter(i => i.serviceDays !== null && i.serviceDays < 0).length;
  const dueSoonCount = items.filter(i => i.serviceDays !== null && i.serviceDays >= 0 && i.serviceDays <= 14).length;

  return (
    <div>
      {overdueCount > 0 && (
        <div style={{ background: 'rgba(239,83,80,.1)', border: '1px solid rgba(239,83,80,.3)', borderRadius: 8, padding: '8px 12px', marginBottom: 14, fontSize: 12, color: '#ef5350' }}>
          🔴 {overdueCount} item{overdueCount > 1 ? 's' : ''} overdue for service
        </div>
      )}
      {!overdueCount && dueSoonCount > 0 && (
        <div style={{ background: 'rgba(245,166,35,.1)', border: '1px solid rgba(245,166,35,.3)', borderRadius: 8, padding: '8px 12px', marginBottom: 14, fontSize: 12, color: '#f5a623' }}>
          🟡 {dueSoonCount} item{dueSoonCount > 1 ? 's' : ''} due for service within 14 days
        </div>
      )}

      {cats.map(cat => {
        const catItems = (cat ? grouped[cat] : uncategorised);
        return (
          <div key={cat || '__none'} style={{ marginBottom: 20 }}>
            {cat && (
              <div style={{ fontSize: 11, fontWeight: 700, textTransform: 'uppercase', letterSpacing: '0.06em', color: '#c9a84c', borderBottom: '1px solid #1e3060', paddingBottom: 4, marginBottom: 8 }}>
                {cat}
              </div>
            )}
            {catItems.map((item, i) => {
              const wb = warrantyBadge(item.warrantyDays);
              const sb = serviceBadge(item.serviceDays);
              return (
                <div key={i} style={{ padding: '10px 0', borderBottom: '1px solid #0d1b3e' }}>
                  <div style={{ display: 'flex', alignItems: 'center', gap: 8, flexWrap: 'wrap' }}>
                    <span style={{ fontSize: 13, fontWeight: 600, color: '#dde1f0', flex: 1, minWidth: 120 }}>{item.item}</span>
                    {item.warrantyExpiry && wb && badge(null, wb.label, wb.color, wb.bg)}
                    {item.nextService && sb && badge(null, sb.label, sb.color, sb.bg)}
                    <button
                      style={{ fontSize: 11, padding: '3px 10px', borderRadius: 12, border: '1px solid #2a4070', background: 'none', color: '#8899cc', cursor: item.intervalMonths ? 'pointer' : 'not-allowed', opacity: item.intervalMonths ? 1 : 0.4, whiteSpace: 'nowrap' }}
                      onClick={() => item.intervalMonths && onRecordService(item.row)}
                      disabled={busy || !item.intervalMonths}
                      title={item.intervalMonths ? 'Record service & schedule next' : 'Set Interval (mo) to enable scheduling'}
                    >✓ Record Service</button>
                  </div>
                  <div style={{ display: 'flex', gap: 16, marginTop: 4, flexWrap: 'wrap' }}>
                    {item.warrantyExpiry && <span style={{ fontSize: 11, color: '#6b7fa8' }}>🛡️ Warranty: {item.warrantyExpiry}</span>}
                    {item.lastService   && <span style={{ fontSize: 11, color: '#6b7fa8' }}>🔧 Last: {item.lastService}</span>}
                    {item.nextService   && <span style={{ fontSize: 11, color: '#6b7fa8' }}>📅 Next: {item.nextService}</span>}
                    {item.intervalMonths && <span style={{ fontSize: 11, color: '#6b7fa8' }}>↻ Every {item.intervalMonths}mo</span>}
                  </div>
                  {item.notes && <div style={{ fontSize: 11, color: '#4d6080', marginTop: 2 }}>{item.notes}</div>}
                </div>
              );
            })}
          </div>
        );
      })}
    </div>
  );
}

function FinancesTab({ summaries, budget, budgetLoading, bills, billsLoading, onBillToggle }) {
  const [sub, setSub] = React.useState('overview');
  const hasTxData = summaries.some(s => s.source === '[AUTO] Transactions');

  // Format a cell value as currency (numbers → $X,XXX) or dash (null/empty)
  function fmtMoney(v) {
    if (v === null || v === undefined || v === '') return '—';
    if (typeof v === 'number') return '$' + Math.round(v).toLocaleString();
    return String(v);
  }

  const budgetRows    = (budget && budget.rows)    || [];
  const budgetReady   = budget !== null;
  const budgetMissing = budget && !budget.configured;

  const subTabs = [
    { id: 'overview', label: '💸 Overview' },
    { id: 'bills',    label: '🧾 Bills' },
  ];

  return (
    <div>
      {/* Sub-tab pills */}
      <div className="subtab-row">
        {subTabs.map(s => (
          <button key={s.id} className={`subtab-btn${sub === s.id ? ' active' : ''}`}
            onClick={() => setSub(s.id)}>{s.label}</button>
        ))}
      </div>

      {/* ── Overview: Spending Chart + Monthly Budget ─────── */}
      {sub === 'overview' && (
        <div>
          {hasTxData
            ? <SpendingChart summaries={summaries} budget={budget} />
            : (
              <div className="bento-card" style={{ cursor: 'default', textAlign: 'center' }}>
                <div style={{ fontSize: 13, color: '#4d6080', padding: '12px 0' }}>
                  💸 No transaction data yet — connect your Transactions sheet in Config.
                </div>
              </div>
            )
          }

          <div className="bento-card" style={{ marginTop: 16, cursor: 'default' }}>
            <div className="bento-card-title" style={{ marginBottom: 14 }}>📊 Monthly Budget</div>

            {budgetLoading && (
              <div style={{ fontSize: 13, color: '#6b7fa8', padding: '8px 0' }}>Loading budget…</div>
            )}

            {!budgetLoading && budgetMissing && (
              <div style={{ fontSize: 13, color: '#4d6080' }}>
                SAT_SHEET_ID not configured — set it in Apps Script → Script Properties.
              </div>
            )}

            {!budgetLoading && budgetReady && !budgetMissing && budgetRows.length === 0 && (
              <div style={{ fontSize: 13, color: '#4d6080' }}>No rows found in the Budget tab.</div>
            )}

            {!budgetLoading && budgetRows.length > 0 && (
              <table style={{ width: '100%', borderCollapse: 'collapse', fontSize: 13 }}>
                <tbody>
                  {budgetRows.map((r, i) => {
                    const isHeader = r.value === null;
                    const hasSplit = r.ahmed !== null || r.victoria !== null;
                    return isHeader
                      ? (
                        <tr key={i}>
                          <td colSpan={hasSplit ? 4 : 2} style={{
                            paddingTop: i === 0 ? 0 : 14,
                            paddingBottom: 4,
                            fontWeight: 700,
                            fontSize: 11,
                            textTransform: 'uppercase',
                            letterSpacing: '0.06em',
                            color: '#c9a84c',
                            borderBottom: '1px solid #1e3060',
                          }}>{r.label}</td>
                        </tr>
                      )
                      : (
                        <tr key={i} style={{ borderBottom: '1px solid #0d1b3e' }}>
                          <td style={{ padding: '7px 0', color: '#dde1f0', width: '55%' }}>{r.label}</td>
                          <td style={{ padding: '7px 0', textAlign: 'right', fontWeight: 600, color: '#c9a84c' }}>
                            {fmtMoney(r.value)}
                          </td>
                          {hasSplit && (
                            <React.Fragment>
                              <td style={{ padding: '7px 0 7px 16px', textAlign: 'right', color: '#5c9eff', fontSize: 12 }}>
                                {fmtMoney(r.ahmed)}
                              </td>
                              <td style={{ padding: '7px 0 7px 8px', textAlign: 'right', color: '#c97ef2', fontSize: 12 }}>
                                {fmtMoney(r.victoria)}
                              </td>
                            </React.Fragment>
                          )}
                        </tr>
                      );
                  })}
                </tbody>
              </table>
            )}

            {!budgetReady && !budgetLoading && (
              <div style={{ fontSize: 12, color: '#4d6080' }}>
                Click the Finances tab to load budget data.
              </div>
            )}
          </div>
        </div>
      )}

      {/* ── Bill Tracker ─────────────────────────────────── */}
      {sub === 'bills' && (
        <BillTrackerView bills={bills} billsLoading={billsLoading} onToggle={onBillToggle} />
      )}

// ---- Milestones tab ---------------------------------------------------------

function MilestonesTab({ milestones, flags, tasks, onAction, busy }) {
  if (!milestones || milestones.length === 0) {
    return (
      <div className="empty-state">
        <div style={{ fontSize: 32, marginBottom: 12 }}>🎯</div>
        <div style={{ color: '#dde1f0', marginBottom: 8 }}>No upcoming milestones</div>
        <div style={{ fontSize: 12, color: '#4d6080', maxWidth: 380, margin: '0 auto', lineHeight: 1.6 }}>
          Add all-day events to calendars listed in Config → <code style={{ background: '#13244d', padding: '1px 5px', borderRadius: 3 }}>gap_calendars</code> whose
          titles contain keywords from <code style={{ background: '#13244d', padding: '1px 5px', borderRadius: 3 }}>milestone_keywords</code> (e.g. Trip, Vacation, Wedding).
        </div>
      </div>
    );
  }

  const activeFlags = flags.filter(f => !f.resolved && !f.acknowledged);

  return (
    <div>
      {milestones.map((m, i) => {
        const relFlags = activeFlags.filter(f =>
          matchesMilestone(m, f.flag + ' ' + f.reason)
        );
        const relTasks = tasks.filter(t =>
          matchesMilestone(m, t.task + ' ' + t.notes)
        );
        const isSoon  = m.daysUntil <= 30;
        const hasHigh = relFlags.some(f => f.urgency === 'High');

        return (
          <div key={i} className={`milestone-card${hasHigh ? ' urgent' : ''}`}>
            <div className="milestone-header">
              <span className="milestone-name">{m.label}</span>
              <span className={`milestone-countdown${isSoon ? ' soon' : ''}`}>
                {m.daysUntil === 0 ? 'Today'
                  : m.daysUntil === 1 ? 'Tomorrow'
                  : `in ${m.daysUntil} days`}
              </span>
            </div>

            <div className="milestone-section-label">🚩 Related Flags ({relFlags.length})</div>
            {relFlags.length === 0
              ? <div className="milestone-empty">No active flags tied to this milestone</div>
              : relFlags.map(flag => (
                  <FlagCard key={flag.id} flag={flag} onAction={onAction} busy={busy} />
                ))
            }

            <div className="milestone-section-label">✅ Related Tasks ({relTasks.length})</div>
            {relTasks.length === 0
              ? <div className="milestone-empty">No open tasks tied to this milestone</div>
              : relTasks.map((task, ti) => (
                  <TaskCard key={task.id || ti} task={task}
                    onComplete={() => {}} onEdit={() => {}} completing={false} />
                ))
            }

            <div style={{ fontSize: 11, color: '#3d5280', marginTop: 14, paddingTop: 12, borderTop: '1px solid #13244d' }}>
              📅 {m.date} · {m.calendarName}
            </div>
          </div>
        );
      })}
    </div>
  );
}

// ---- Spending chart (Home tab) ----------------------------------------------

function SpendingChart({ summaries, budget }) {
  const txRows   = summaries.filter(s => s.source === '[AUTO] Transactions');
  const totalRow = txRows.find(s => s.metric.startsWith('Total Spending'));
  const otherRow = txRows.find(s => s.metric.startsWith('Other ('));
  const catRows  = txRows.filter(s =>
    !s.metric.startsWith('Total Spending') && !s.metric.startsWith('Other (')
  );

  // Parse "$1,234 [full month] vs $2,345 in Jan (±N%)" or "$1,234 (first month)"
  function parseDollars(value = '') {
    const dollars  = [...value.matchAll(/\$([0-9,]+)/g)].map(m => parseInt(m[1].replace(/,/g, '')));
    const hasPrev  = /\bvs\s+\$/.test(value);
    const curr     = dollars[0] || 0;
    const prev     = hasPrev ? (dollars[1] || 0) : 0;
    const prevMon  = (value.match(/\bin\s+([A-Z][a-z]{2})\b/) || [])[1] || null;
    return { curr, prev, prevMon };
  }

  const totalData  = totalRow ? parseDollars(totalRow.value) : null;
  const mthMatch   = (catRows[0] || totalRow)?.metric.match(/—\s+(\w+)$/);
  const currMonth  = mthMatch ? mthMatch[1] : '';
  const prevMonth  = totalData?.prevMon ||
    catRows.map(r => parseDollars(r.value).prevMon).find(Boolean) || '';

  const data = catRows.map(s => ({
    label: s.metric.replace(/\s+—\s+\w+$/, ''),
    ...parseDollars(s.value),
  }));

  const maxVal = Math.max(...data.map(d => Math.max(d.curr, d.prev)), 1);
  const otherMatch = otherRow?.metric.match(/Other \((\d+)/);
  const otherCount = otherMatch ? otherMatch[1] : null;
  const otherAmt   = otherRow ? parseDollars(otherRow.value).curr : 0;

  // Build budget lookup: normalised label → numeric monthly budget amount
  const budgetMap = {};
  if (budget && budget.rows) {
    budget.rows.forEach(function(r) {
      if (r.value === null) return; // skip section headers
      var key = String(r.label).toLowerCase().trim();
      var num = typeof r.value === 'number'
        ? r.value
        : parseFloat(String(r.value).replace(/[$,]/g, '')) || null;
      if (num !== null) budgetMap[key] = num;
    });
  }

  return (
    <div className="bento-card" style={{ gridColumn: '1 / -1', cursor: 'default' }}>
      {/* Header */}
      <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'baseline', marginBottom: 16 }}>
        <div className="bento-card-title" style={{ marginBottom: 0 }}>
          💸 Spending — {currMonth || '…'}
        </div>
        {totalData && totalData.curr > 0 && (
          <div style={{ textAlign: 'right' }}>
            <span style={{ fontSize: 18, fontWeight: 800, color: '#c9a84c' }}>
              ${totalData.curr.toLocaleString()}
            </span>
            {prevMonth && totalData.prev > 0 && (
              <span style={{ fontSize: 11, color: '#6b7fa8', marginLeft: 8 }}>
                vs ${totalData.prev.toLocaleString()} in {prevMonth}
              </span>
            )}
          </div>
        )}
      </div>

      {data.length === 0 ? (
        <div style={{ fontSize: 13, color: '#4d6080' }}>No transaction data yet</div>
      ) : (
        <>
          {/* Category bars */}
          <div style={{ display: 'flex', flexDirection: 'column', gap: 10 }}>
            {data.map((d, i) => {
              const currW    = (d.curr / maxVal * 100).toFixed(1);
              const prevW    = (d.prev / maxVal * 100).toFixed(1);
              const delta    = d.prev > 0 ? Math.round(((d.curr - d.prev) / d.prev) * 100) : null;
              const deltaClr = delta == null ? '#6b7fa8'
                : delta > 20  ? '#ef5350'
                : delta < -10 ? '#66bb6a'
                : '#6b7fa8';
              const budgeted = budgetMap[d.label.toLowerCase().trim()] ?? null;
              const variance = budgeted !== null ? Math.round(d.curr - budgeted) : null;
              return (
                <div key={i}>
                  <div style={{ display: 'flex', justifyContent: 'space-between', marginBottom: 4, alignItems: 'baseline' }}>
                    <span style={{ fontSize: 13, color: '#dde1f0', overflow: 'hidden', textOverflow: 'ellipsis', whiteSpace: 'nowrap', maxWidth: '55%' }}>
                      {d.label}
                    </span>
                    <div style={{ display: 'flex', gap: 8, alignItems: 'baseline', flexShrink: 0 }}>
                      {d.prev > 0 && <span style={{ fontSize: 11, color: '#4d6080' }}>${d.prev.toLocaleString()}</span>}
                      <span style={{ fontSize: 13, fontWeight: 700, color: '#c9a84c' }}>${d.curr.toLocaleString()}</span>
                      {delta != null && (
                        <span style={{ fontSize: 11, color: deltaClr, minWidth: 36, textAlign: 'right' }}>
                          {delta >= 0 ? '+' : ''}{delta}%
                        </span>
                      )}
                    </div>
                  </div>
                  {/* Current month bar — gold */}
                  <div style={{ height: 7, background: '#13244d', borderRadius: 4, overflow: 'hidden', marginBottom: 2 }}>
                    <div style={{ height: '100%', width: currW + '%', background: '#c9a84c', borderRadius: 4, transition: 'width 0.5s ease' }} />
                  </div>
                  {/* Prior month bar — steel blue */}
                  {d.prev > 0 && (
                    <div style={{ height: 4, background: '#0d1b3e', borderRadius: 2, overflow: 'hidden' }}>
                      <div style={{ height: '100%', width: prevW + '%', background: '#3d5fa0', borderRadius: 2, transition: 'width 0.5s ease' }} />
                    </div>
                  )}
                  {/* Budget vs. actual annotation — only when a matching budget row is found */}
                  {budgeted !== null && (
                    <div style={{ display: 'flex', gap: 10, marginTop: 4, fontSize: 11 }}>
                      <span style={{ color: '#4d6080' }}>Budget: ${Math.round(budgeted).toLocaleString()}</span>
                      {variance !== null && (
                        <span style={{ color: variance > 0 ? '#ef5350' : '#66bb6a', fontWeight: 600 }}>
                          {variance > 0 ? '▲' : '▼'} ${Math.abs(variance).toLocaleString()} {variance > 0 ? 'over' : 'under'}
                        </span>
                      )}
                    </div>
                  )}
                </div>
              );
            })}
          </div>

          {/* Legend + Other footnote */}
          <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center', marginTop: 14, paddingTop: 12, borderTop: '1px solid #1e3060', flexWrap: 'wrap', gap: 8 }}>
            <div style={{ display: 'flex', gap: 16 }}>
              <div style={{ display: 'flex', alignItems: 'center', gap: 5 }}>
                <div style={{ width: 12, height: 7, background: '#c9a84c', borderRadius: 2 }} />
                <span style={{ fontSize: 11, color: '#6b7fa8' }}>{currMonth}</span>
              </div>
              {prevMonth && (
                <div style={{ display: 'flex', alignItems: 'center', gap: 5 }}>
                  <div style={{ width: 12, height: 4, background: '#3d5fa0', borderRadius: 2 }} />
                  <span style={{ fontSize: 11, color: '#6b7fa8' }}>{prevMonth}</span>
                </div>
              )}
            </div>
            {otherCount && otherAmt > 0 && (
              <span style={{ fontSize: 11, color: '#4d6080' }}>
                + {otherCount} other categories: ${otherAmt.toLocaleString()}
              </span>
            )}
          </div>
        </>
      )}
    </div>
  );
}

// ---- Home tab ---------------------------------------------------------------

function HomeTab({ flags, tasks, projects, shopping, pto, milestones, summaries, status, onNavigate }) {
  const activeFlags    = flags.filter(f => !f.resolved && !f.acknowledged);
  const highFlags      = activeFlags.filter(f => f.urgency === 'High');
  const topFlag        = highFlags[0] || activeFlags[0];
  const pendingTasks   = tasks;
  const overdueTasks   = tasks.filter(t => t.isOverdue);
  const nextTask       = pendingTasks.find(t => t.dueDate) || pendingTasks[0];
  const pendingShopping = shopping.reduce((sum, s) => sum + s.items.filter(i => !i.done).length, 0);
  const vacRemaining   = pto?.remaining?.vacationDays;
  const persRemaining  = pto?.remaining?.personalHours;
  const nextPTO        = pto?.nextPTO;

  return (
    <div className="bento-grid">
      {/* Flags */}
      <div className="bento-card" onClick={() => onNavigate('flags')}>
        <div className="bento-card-title">🚩 Active Flags</div>
        {activeFlags.length === 0 ? (
          <div style={{ fontSize: 15, color: '#43a047', fontWeight: 600 }}>✓ All clear</div>
        ) : (
          <>
            <div className="bento-card-main">{activeFlags.length}</div>
            <div className="bento-card-sub">
              {status?.high   > 0 && <span style={{ color: '#e53935', fontWeight: 700, marginRight: 8 }}>{status.high} high</span>}
              {status?.medium > 0 && <span style={{ color: '#f9a825', fontWeight: 700, marginRight: 8 }}>{status.medium} med</span>}
              {status?.low    > 0 && <span style={{ color: '#43a047', fontWeight: 700 }}>{status.low} low</span>}
            </div>
            {topFlag && <div className="bento-item" style={{ fontSize: 12, color: '#aab5d0' }}>{topFlag.flag}</div>}
          </>
        )}
      </div>

      {/* Tasks */}
      <div className="bento-card" onClick={() => onNavigate('tasks')}>
        <div className="bento-card-title">✅ Tasks</div>
        <div className="bento-card-main">{pendingTasks.length}</div>
        <div className="bento-card-sub">
          {overdueTasks.length > 0
            ? <span style={{ color: '#ff6b6b' }}>{overdueTasks.length} overdue</span>
            : 'open tasks'}
        </div>
        {nextTask && (
          <div className="bento-item" style={{ fontSize: 12, color: '#aab5d0' }}>Next: {nextTask.task}</div>
        )}
      </div>

      {/* Projects */}
      <div className="bento-card" onClick={() => onNavigate('projects')}>
        <div className="bento-card-title">📂 Projects</div>
        {projects.length === 0 ? (
          <div style={{ fontSize: 13, color: '#4d6080' }}>No projects yet</div>
        ) : (
          <>
            <div className="bento-card-main">{projects.length}</div>
            <div className="bento-card-sub">active projects</div>
            <div className="bento-card-list">
              {projects.slice(0, 3).map(p => {
                const pending = p.tasks.filter(t => t.status !== 'Done').length;
                return (
                  <div key={p.projectId} className="bento-item">
                    {p.projectName}
                    {pending > 0 && <span style={{ color: '#c9a84c', marginLeft: 6 }}>({pending})</span>}
                  </div>
                );
              })}
            </div>
          </>
        )}
      </div>

      {/* Shopping */}
      <div className="bento-card" onClick={() => onNavigate('shopping')}>
        <div className="bento-card-title">🛒 Shopping</div>
        {shopping.length === 0 ? (
          <div style={{ fontSize: 13, color: '#4d6080' }}>No lists connected</div>
        ) : (
          <>
            <div className="bento-card-main">{pendingShopping}</div>
            <div className="bento-card-sub">items to get</div>
            <div className="bento-card-list">
              {shopping.map(s => {
                const n = s.items.filter(i => !i.done).length;
                return (
                  <div key={s.tabId} className="bento-item">
                    {s.storeName}
                    <span style={{ color: n === 0 ? '#43a047' : '#c9a84c', marginLeft: 6 }}>{n === 0 ? '✓' : n}</span>
                  </div>
                );
              })}
            </div>
          </>
        )}
      </div>

      {/* PTO */}
      <div className="bento-card" onClick={() => onNavigate('pto')}>
        <div className="bento-card-title">🌴 PTO</div>
        {pto == null ? (
          <div style={{ fontSize: 13, color: '#4d6080' }}>Click to load PTO data</div>
        ) : (
          <>
            <div className="bento-card-main" style={{ fontSize: 24 }}>
              {vacRemaining} <span style={{ fontSize: 14, fontWeight: 400, color: '#6b7fa8' }}>vacation days</span>
            </div>
            {persRemaining != null && (
              <div className="bento-card-sub">{persRemaining} personal hrs remaining</div>
            )}
            {nextPTO && (
              <div className="bento-item" style={{ fontSize: 12, color: '#aab5d0' }}>
                Next: {nextPTO.label} · {nextPTO.daysUntil}d away
              </div>
            )}
          </>
        )}
      </div>

      {/* Milestones */}
      <div className="bento-card" onClick={() => onNavigate('milestones')}>
        <div className="bento-card-title">🎯 Milestones</div>
        {milestones.length === 0 ? (
          <div style={{ fontSize: 13, color: '#4d6080' }}>No upcoming milestones</div>
        ) : (
          <>
            <div className="bento-card-main">{milestones.length}</div>
            <div className="bento-card-sub">upcoming events</div>
            <div className="bento-card-list">
              {milestones.slice(0, 3).map((m, i) => {
                const relCount = [
                  ...flags.filter(f => !f.resolved && !f.acknowledged),
                  ...tasks,
                ].filter(item =>
                  matchesMilestone(m,
                    (item.flag || item.task || '') + ' ' +
                    (item.reason || item.notes || ''))
                ).length;
                return (
                  <div key={i} className="bento-item">
                    {m.label}
                    <span style={{ color: '#c9a84c', marginLeft: 6 }}>{m.daysUntil}d</span>
                    {relCount > 0 && (
                      <span style={{ color: '#6b7fa8', marginLeft: 6 }}>
                        · {relCount} item{relCount !== 1 ? 's' : ''}
                      </span>
                    )}
                  </div>
                );
              })}
            </div>
          </>
        )}
      </div>

      {/* Spending Chart */}
      <SpendingChart summaries={summaries} />
    </div>
  );
}

                  <span className="interest-cat-pill">{interest.category}</span>

function AddInterestModal({ onSave, onClose, busy }) {
  const [person,   setPerson]   = React.useState('Ahmed');
  const [interest, setInterest] = React.useState('');
  const [category, setCategory] = React.useState('Other');
  const [notes,    setNotes]    = React.useState('');

  function handleKeyDown(e) {
    if (e.key === 'Enter' && interest.trim()) onSave({ person, interest, category, notes });
    if (e.key === 'Escape') onClose();
  }

  return (
    <div className="modal-overlay" onClick={e => e.target === e.currentTarget && onClose()}>
      <div className="modal" style={{ maxWidth: 400 }}>
        <h2>Log Interest</h2>

        <label className="form-label">Person *</label>
        <select className="form-input" value={person} onChange={e => setPerson(e.target.value)}>
          <option value="Ahmed">Ahmed</option>
          <option value="Victoria">Victoria</option>
        </select>

        <label className="form-label">Interest *</label>
        <input
          className="form-input"
          value={interest}
          onChange={e => setInterest(e.target.value)}
          onKeyDown={handleKeyDown}
          placeholder="e.g. specialty coffee, visit Round Rock TX"
          autoFocus
        />

        <label className="form-label">Category</label>
        <select className="form-input" value={category} onChange={e => setCategory(e.target.value)}>
          {INTEREST_CATEGORIES_UI.map(c => <option key={c} value={c}>{c}</option>)}
        </select>

        <label className="form-label">Notes (optional)</label>
        <input
          className="form-input"
          value={notes}
          onChange={e => setNotes(e.target.value)}
          onKeyDown={handleKeyDown}
          placeholder="e.g. mentioned during grocery trip"
        />

        <div className="modal-actions">
          <button className="btn" onClick={onClose}>Cancel</button>
          <button
            className="btn btn-primary"
            disabled={!interest.trim() || busy}
            onClick={() => onSave({ person, interest, category, notes })}
          >
            Log Interest
          </button>
        </div>
      </div>
    </div>
  );
}

function App() {
  const [apiUrl,   setApiUrl]   = useState(() => stored('vera_url'));
  const [apiToken, setApiToken] = useState(() => stored('vera_token'));
  const [showSettings, setShowSettings] = useState(() => !stored('vera_url'));
  const [activeTab,    setActiveTab]    = useState('home');
  const [filterActive, setFilterActive] = useState(true);
  const [loading,  setLoading]  = useState(false);
  const [tabLoading, setTabLoading] = useState({});
  const [busy,     setBusy]     = useState(false);
  const [error,    setError]    = useState(null);
  const [lastUpdated, setLastUpdated] = useState(null);
  const [status,     setStatus]     = useState(null);
  const [flags,      setFlags]      = useState([]);
  const [tasks,      setTasks]      = useState([]);
  const [summaries,  setSummaries]  = useState([]);
  const [projects,   setProjects]   = useState([]);
  const [goals,      setGoals]      = useState([]);
  const [interests,  setInterests]  = useState([]);
  const [shopping,   setShopping]   = useState([]);
  const [pto,        setPTO]        = useState(null);
  const [budget,     setBudget]     = useState(null); // { ok, rows, configured } | null
  const [bills,      setBills]      = useState(null); // { ok, bills, currentMonth } | null
  const [homeFront,  setHomeFront]  = useState(null); // { recipes, items } | null
  const [ideas,      setIdeas]      = useState([]);   // idea cards (Issue #18)
  const [itineraries,      setItineraries]      = useState({}); // { [tripKey]: 'loading' | { items, tripMeta:{startDate,endDate} } }
  const [itinItemModal,    setItinItemModal]    = useState(null); // null | { mode:'add'|'edit', tripKey, item? }
  const [packingItems,     setPackingItems]     = useState({}); // { [tripKey]: 'loading' | { items: [...] } }
  const [tripMeta,         setTripMeta]         = useState({}); // { [tripKey]: { context, notes } | 'loading' }
  const [packingFocusTripKey, setPackingFocusTripKey] = useState(null);
  const [chatMessages, setChatMessages] = useState([{ role: 'vera', text: VERA_CHAT_WELCOME }]);
  const [chatInput,    setChatInput]    = useState('');
  const [addItemModal, setAddItemModal] = useState(false);
  const [toast,         setToast]         = useState(null);
  const [completingIds, setCompletingIds] = useState({});
  const [taskModal,        setTaskModal]        = useState(null); // null | { mode:'add' } | { mode:'edit', task }
  const [projectTaskModal, setProjectTaskModal] = useState(null); // null | { mode:'add', project } | { mode:'edit', task }
  const [goalModal,        setGoalModal]        = useState(null); // null | { mode:'add', status? } | { mode:'edit', goal }
  const [interestModal,    setInterestModal]    = useState(false); // true = show AddInterestModal
  const [dragGoalId,       setDragGoalId]       = useState(null);
  const [dragOverCol,      setDragOverCol]      = useState(null);
  const toastTimer = useRef(null);

  const milestones = pto?.milestones || [];

  const loadAll = useCallback(async (url, token, activeOnly) => {
    if (!url || !token) return;
    setLoading(true);
    setError(null);
    try {
      const [s, f, t, sm] = await Promise.all([
        apiGet(url, token, { action: 'status' }),
        apiGet(url, token, { action: 'flags', filter: activeOnly ? 'active' : '' }),
        apiGet(url, token, { action: 'tasks' }),
        apiGet(url, token, { action: 'summaries' }),
      ]);
      setStatus(s);
      // Sort flags: High first, then Medium, then Low
      const order = { High: 0, Medium: 1, Low: 2 };
      const sorted = (f.flags || []).sort((a, b) =>
        (order[a.urgency] ?? 3) - (order[b.urgency] ?? 3)
      );
      setFlags(sorted);
      setTasks(t.tasks || []);
      setSummaries(sm.summaries || []);
      setLastUpdated(new Date());
    } catch (err) {
      setError(err.message);
    }
    setLoading(false);
  }, []);

  // Load on mount and when filter changes
  useEffect(() => {
    if (apiUrl && apiToken) loadAll(apiUrl, apiToken, filterActive);
  }, [apiUrl, apiToken, filterActive, loadAll]);

  // Pre-load lazy tab data so the Home tab has something to show
  useEffect(() => {
    if (apiUrl && apiToken) {
      loadProjects(apiUrl, apiToken);
      loadGoals(apiUrl, apiToken);
      loadShopping(apiUrl, apiToken);
      loadPTO(apiUrl, apiToken);
    }
  }, [apiUrl, apiToken]); // eslint-disable-line react-hooks/exhaustive-deps

  function showToast(msg, isError) {
    setToast({ msg, isError: !!isError });
    if (toastTimer.current) clearTimeout(toastTimer.current);
    toastTimer.current = setTimeout(() => setToast(null), 3000);
  }

  async function handleAction(action, id, days) {
    setBusy(true);
    setError(null);

    // Optimistic UI update — show result immediately so the user
    // sees the badge change before loadAll re-filters the list
    setFlags(prev => prev.map(f => {
      if (f.id !== id) return f;
      if (action === 'acknowledge') return { ...f, acknowledged: true };
      if (action === 'resolve')     return { ...f, resolved: true };
      if (action === 'snooze')      return { ...f, snoozedUntil: 'soon' };
      return f;
    }));

    try {
      const params = { id };
      if (days != null) params.days = days;
      await apiAction(apiUrl, apiToken, action, params);

      const labels = {
        acknowledge: '✓ Flag acknowledged',
        resolve:     '✓ Flag resolved',
        snooze:      '💤 Flag snoozed for ' + (days || 2) + 'd',
      };
      showToast(labels[action] || '✓ Done');

      // Short delay lets the user see the state change badge before
      // loadAll re-fetches and filters the flag out of the active view
      setTimeout(() => loadAll(apiUrl, apiToken, filterActive), 1500);
    } catch (err) {
      setError('Action failed: ' + err.message);
      // Revert optimistic update by re-fetching real state
      await loadAll(apiUrl, apiToken, filterActive);
    }
    setBusy(false);
  }

  async function handleComplete(id) {
    if (!id) return;
    setCompletingIds(prev => ({ ...prev, [id]: true }));
    try {
      const res = await apiAction(apiUrl, apiToken, 'complete_task', { id });
      if (res.recurring && res.nextDueDate) {
        showToast(`✓ Done! 🔁 Next occurrence scheduled for ${res.nextDueDate}`);
      } else {
        showToast('✓ Task marked done');
      }
      setTimeout(() => loadAll(apiUrl, apiToken, filterActive), 1500);
    } catch (err) {
      setError('Could not complete task: ' + err.message);
      setCompletingIds(prev => { const n = { ...prev }; delete n[id]; return n; });
    }
  }

  async function loadProjects(url, token) {

    setTabLoading(prev => ({ ...prev, projects: true }));
    try {

      setProjects(data.projects || []);

    setTabLoading(prev => ({ ...prev, projects: false }));

  async function loadItinerary(tripKey, startDate, endDate) {
    if (!tripKey || !apiUrl || !apiToken) return;
    // Mark as loading with sentinel string (truthy, prevents double-load)
    setItineraries(prev => ({ ...prev, [tripKey]: 'loading' }));
    try {
      const data = await apiGet(apiUrl, apiToken,
        { action: 'itinerary', tripKey, startDate, endDate });
      // Store result alongside tripMeta so handlers can reload without selectedTrip
      setItineraries(prev => ({
        ...prev,
        [tripKey]: { ...data, tripMeta: { startDate, endDate } }
      }));
    } catch (err) {
      setError('Could not load itinerary: ' + err.message);
      // Remove sentinel on error so user can retry
      setItineraries(prev => { const n = { ...prev }; delete n[tripKey]; return n; });
    }
  }

    setBusy(true);
    try {
      await apiGet(apiUrl, apiToken, { action: 'update_itinerary_item', ...params });
      showToast('✓ Updated');
      setItinItemModal(null);
      const meta = itineraries[params.tripKey] && itineraries[params.tripKey].tripMeta;
      if (meta) loadItinerary(params.tripKey, meta.startDate, meta.endDate);
    } catch (err) { setError('Could not update itinerary item: ' + err.message); }
    setBusy(false);
  }

  async function handleDeleteItineraryItem(id, tripKey) {
    if (!confirm('Delete this itinerary item?')) return;
    setBusy(true);
    try {
      await apiGet(apiUrl, apiToken, { action: 'delete_itinerary_item', id });
      showToast('🗑 Deleted');
      const meta = tripKey && itineraries[tripKey] && itineraries[tripKey].tripMeta;
      if (meta) loadItinerary(tripKey, meta.startDate, meta.endDate);
    } catch (err) { setError('Could not delete itinerary item: ' + err.message); }
    setBusy(false);
  }

  // ---- Packing handlers -------------------------------------------------------

  async function loadTripMeta(tripKey) {
    if (!tripKey || !apiUrl || !apiToken) return;
    setTripMeta(function(prev) { return Object.assign({}, prev, { [tripKey]: 'loading' }); });
    try {
      const data = await apiGet(apiUrl, apiToken, { action: 'get_trip_meta', tripKey });
      setTripMeta(function(prev) {
        return Object.assign({}, prev, { [tripKey]: { context: data.context || '', notes: data.notes || '' } });
      });
    } catch(err) {
      setTripMeta(function(prev) { const n = Object.assign({}, prev); delete n[tripKey]; return n; });
    }
  }

  async function handleSetTripMeta(tripKey, context, notes) {
    if (!apiUrl || !apiToken) return;
    try {
      await apiGet(apiUrl, apiToken, { action: 'set_trip_meta', tripKey, context: context || '', notes: notes || '' });
      setTripMeta(function(prev) {
        return Object.assign({}, prev, { [tripKey]: { context: context || '', notes: notes || '' } });
      });
    } catch(err) { setError('Could not save trip context: ' + err.message); }
  }

  async function loadPacking(tripKey) {
    if (!tripKey || !apiUrl || !apiToken) return;
    setPackingItems(function(prev) { return Object.assign({}, prev, { [tripKey]: 'loading' }); });
    try {
      const data = await apiGet(apiUrl, apiToken, { action: 'get_packing', tripKey });
      setPackingItems(function(prev) { return Object.assign({}, prev, { [tripKey]: { items: data.items || [] } }); });
      if (data.meta && data.meta.context !== undefined) {
        setTripMeta(function(prev) {
          return Object.assign({}, prev, { [tripKey]: { context: data.meta.context || '', notes: data.meta.notes || '' } });
        });
      }
    } catch(err) {
      setPackingItems(function(prev) { const n = Object.assign({}, prev); delete n[tripKey]; return n; });
      setError('Could not load packing list: ' + err.message);
    }
  }

  async function handleGeneratePacking(tripKey, startDate, endDate) {
    if (!apiUrl || !apiToken) return;
    setBusy(true);
    setPackingItems(function(prev) { return Object.assign({}, prev, { [tripKey]: 'loading' }); });
    try {
      const data = await apiGet(apiUrl, apiToken, { action: 'generate_packing', tripKey, startDate, endDate });
      setPackingItems(function(prev) { return Object.assign({}, prev, { [tripKey]: { items: data.items || [] } }); });
      if (data.meta) {
        setTripMeta(function(prev) {
          return Object.assign({}, prev, { [tripKey]: { context: (data.meta.context || ''), notes: '' } });
        });
      }
      showToast('✨ Packing list generated by VERA');
    } catch(err) {
      setPackingItems(function(prev) { const n = Object.assign({}, prev); delete n[tripKey]; return n; });
      setError('Generate failed: ' + err.message);
    }
    setBusy(false);
  }

  async function handleTogglePackingItem(id, tripKey, currentChecked) {
    // Optimistic update
    setPackingItems(function(prev) {
      const entry = prev[tripKey];
      if (!entry || entry === 'loading') return prev;
      return Object.assign({}, prev, {
        [tripKey]: Object.assign({}, entry, {
          items: entry.items.map(function(it) {
            return it.id === id ? Object.assign({}, it, { checked: !currentChecked }) : it;
          }),
        }),
      });
    });
    try {
      await apiGet(apiUrl, apiToken, { action: 'update_packing_item', id, checked: String(!currentChecked) });
    } catch(err) {
      setError('Could not update item');
      loadPacking(tripKey); // revert
    }
  }

  async function handleAddPackingItem(tripKey, person, category, item) {
    if (!apiUrl || !apiToken) return;
    setBusy(true);
    try {
      await apiGet(apiUrl, apiToken, { action: 'add_packing_item', tripKey, person, category, item });
      await loadPacking(tripKey);
    } catch(err) { setError('Could not add packing item: ' + err.message); }
    setBusy(false);
  }

  async function handleDeletePackingItem(id, tripKey) {
    // Optimistic remove
    setPackingItems(function(prev) {
      const entry = prev[tripKey];
      if (!entry || entry === 'loading') return prev;
      return Object.assign({}, prev, {
        [tripKey]: Object.assign({}, entry, { items: entry.items.filter(function(it) { return it.id !== id; }) }),
      });
    });
    try {
      await apiGet(apiUrl, apiToken, { action: 'delete_packing_item', id });
    } catch(err) {
      setError('Could not delete packing item');
      loadPacking(tripKey);
    }
  }

  function handleGoToPacking(tripKey) {
    // Force re-trigger even if same key by clearing first
    setPackingFocusTripKey(null);
    setTimeout(function() { setPackingFocusTripKey(tripKey); }, 0);
  }

  // ---- End packing handlers ---------------------------------------------------

  function handleConnect(url, token) {
    setApiUrl(url);
    setApiToken(token);
    setShowSettings(false);
    loadAll(url, token, filterActive);
    loadProjects(url, token);
    loadGoals(url, token);
    loadInterests(url, token);
    loadIdeas(url, token);
    loadShopping(url, token);
    loadPTO(url, token);
  }

  // ---- Render ----

  const isConfigured = apiUrl && apiToken;

  return (
    <>
      {/* Header */}
      <div className="header">
        <div className="logo">
          <span className="logo-name">VERA</span>
          <span className="logo-sub">Chief of Staff</span>
        </div>
        <div className="header-actions">
          {lastUpdated && (
            <span className="last-updated">Updated {timeAgo(lastUpdated)}</span>
          )}
          {isConfigured && (
            <button
              className="btn btn-refresh"
              style={{ fontSize: 12, padding: '5px 14px' }}
              disabled={loading}
              onClick={() => loadAll(apiUrl, apiToken, filterActive)}
            >
              {loading ? '⟳ Loading…' : '⟳ Refresh'}
            </button>
          )}
          <button className="btn-settings" onClick={() => setShowSettings(true)} title="Settings">⚙</button>
        </div>
      </div>

      {/* Task add/edit modal */}
      {taskModal && (
        <TaskFormModal
          task={taskModal.task || null}
          onSave={handleSaveTask}
          onClose={() => setTaskModal(null)}
          busy={busy}
        />
      )}

      {/* Project task add/edit modal */}
      {projectTaskModal && (
        <ProjectTaskModal
          mode={projectTaskModal.mode}
          task={projectTaskModal.task || null}
          onSave={handleSaveProjectTask}
          onClose={() => setProjectTaskModal(null)}
          busy={busy}
        />
      )}

      {/* Add shopping item modal */}
      {addItemModal && shopping.length > 0 && (
        <AddItemModal
          stores={shopping}
          onSave={handleAddShoppingItem}
          onClose={() => setAddItemModal(false)}
          busy={busy}
        />
      )}

      {/* Settings modal */}
      {showSettings && (
        <SettingsModal
          initial={{ url: apiUrl, token: apiToken }}
          onSave={handleConnect}
          onClose={isConfigured ? () => setShowSettings(false) : null}
        />
      )}

      {/* Not connected yet */}
      {!isConfigured && !showSettings && (
        <div className="main">
          <div className="empty-state">
            <div style={{ fontSize: 40, marginBottom: 16 }}>🔌</div>
            <div style={{ fontSize: 16, color: '#dde1f0', marginBottom: 8 }}>Not connected</div>
            <div style={{ marginBottom: 20 }}>Click the ⚙ icon to add your API URL and token</div>
          </div>
        </div>
      )}

      {/* Connected UI */}
      {isConfigured && (
        <>
          <StatusBar status={status} loading={loading} />

          <div className="tabs">
            {['home', 'chat', 'flags', 'tasks', 'projects', 'shopping', 'home_front', 'pto', 'travel', 'finances', 'milestones', 'goals', 'interests', 'ideas', 'summaries'].map(tab => (
              <button
                key={tab}
                className={`tab-btn ${activeTab === tab ? 'active' : ''}`}
                onClick={() => {
                  setActiveTab(tab);
                  if (tab === 'projects')   loadProjects(apiUrl, apiToken);
                  if (tab === 'goals')      loadGoals(apiUrl, apiToken);
                  if (tab === 'interests')  loadInterests(apiUrl, apiToken);
                  if (tab === 'ideas')      loadIdeas(apiUrl, apiToken);
                  if (tab === 'shopping')   loadShopping(apiUrl, apiToken);
                  if (tab === 'home_front') loadHomeFront(apiUrl, apiToken);
                  if (tab === 'pto')        loadPTO(apiUrl, apiToken);
                  if (tab === 'travel')     loadPTO(apiUrl, apiToken); // upcomingTravel lives in PTO stats
                  if (tab === 'finances') { loadBudget(apiUrl, apiToken); loadBills(apiUrl, apiToken); }
                }}
              >
                {tab === 'home'       ? `🏠 Home` : ''}
                {tab === 'chat'       ? `💬 Chat` : ''}
                {tab === 'flags'      ? `🚩 Flags${status ? ` (${status.activeFlags})` : ''}` : ''}
                {tab === 'tasks'      ? `✅ Tasks${tasks.length ? ` (${tasks.length})` : ''}` : ''}
                {tab === 'projects'   ? `📂 Projects${projects.length ? ` (${projects.length})` : ''}` : ''}
                {tab === 'goals'      ? `🎯 Yearly Goals${goals.length ? ` (${goals.length})` : ''}` : ''}
                {tab === 'interests'  ? `💛 Interests${interests.length ? ` (${interests.length})` : ''}` : ''}
                {tab === 'ideas'      ? `💡 Ideas${ideas.length ? ` (${ideas.length})` : ''}` : ''}
                {tab === 'shopping'   ? `🛒 Shopping` : ''}
                {tab === 'home_front' ? `🏡 Home Front` : ''}
                {tab === 'pto'        ? `🌴 PTO Planner` : ''}
                {tab === 'travel'     ? `✈️ Travel` : ''}
                {tab === 'finances'   ? `💰 Finances` : ''}
                {tab === 'milestones' ? `🎯 Milestones${milestones.length ? ` (${milestones.length})` : ''}` : ''}
                {tab === 'summaries'  ? `📊 Summaries` : ''}
              </button>
            ))}
          </div>

          <div className="main">
            {error && <div className="error-banner">⚠️ {error}</div>}

            {/* Flags tab */}
            {activeTab === 'flags' && (
              <>
                <div className="toolbar">
                  <button
                    className={`filter-toggle ${filterActive ? 'on' : ''}`}
                    onClick={() => setFilterActive(v => !v)}
                  >
                    {filterActive ? '● Active only' : '○ All flags'}
                  </button>
                  <span className="count-badge">{flags.length} shown</span>
                </div>

                {loading && flags.length === 0
                  ? <div className="loading-text">Loading flags…</div>
                  : flags.length === 0
                    ? <div className="empty-state">
                        <div style={{ fontSize: 32, marginBottom: 12 }}>🎉</div>
                        <div>No {filterActive ? 'active ' : ''}flags — you're all clear!</div>
                      </div>
                    : flags.map(flag => (
                        <FlagCard
                          key={flag.id}
                          flag={flag}
                          onAction={handleAction}
                          busy={busy}
                        />
                      ))
                }
              </>
            )}

            {/* Tasks tab */}
            {activeTab === 'tasks' && (
              <>
                <div className="toolbar">
                  <button
                    className="btn btn-primary"
                    style={{ fontSize: 12 }}
                    onClick={() => setTaskModal({ mode: 'add' })}
                  >
                    + Add Task
                  </button>
                  <span className="count-badge">{tasks.length} open</span>
                </div>
                {loading && tasks.length === 0
                  ? <div className="loading-text">Loading tasks…</div>
                  : tasks.length === 0
                    ? <div className="empty-state">No open tasks found in the Tasks tab.</div>
                    : tasks.map((task, i) => (
                        <TaskCard
                          key={task.id || i}
                          task={task}
                          onComplete={handleComplete}
                          onEdit={t => setTaskModal({ mode: 'edit', task: t })}
                          completing={!!completingIds[task.id]}
                        />
                      ))
                }
              </>
            )}

            {/* Summaries tab */}
            {activeTab === 'summaries' && (
              loading && summaries.length === 0
                ? <div className="loading-text">Loading summaries…</div>
                : <SummariesTab summaries={summaries} />
            )}

            {/* Home tab */}
            {activeTab === 'home' && (
              <HomeTab
                flags={flags}
                tasks={tasks}
                projects={projects}
                shopping={shopping}
                pto={pto}
                milestones={milestones}
                summaries={summaries}
                status={status}
                onNavigate={tab => {
                  setActiveTab(tab);
                  if (tab === 'projects')  loadProjects(apiUrl, apiToken);
                  if (tab === 'shopping')  loadShopping(apiUrl, apiToken);
                  if (tab === 'pto')       loadPTO(apiUrl, apiToken);
                }}
              />
            )}

            {/* Chat tab */}
            {activeTab === 'chat' && (
              <ChatPanel
                apiUrl={apiUrl}
                apiToken={apiToken}
                messages={chatMessages}
                setMessages={setChatMessages}
                input={chatInput}
                setInput={setChatInput}
              />
            )}

            {/* Projects tab */}
            {activeTab === 'projects' && (
              tabLoading.projects
                ? <div className="loading-text">Loading projects…</div>
                : <ProjectsTab
                    projects={projects}
                    onCompleteTask={handleCompleteProjectTask}
                    onAddTask={p => setProjectTaskModal({ mode: 'add', project: p })}
                    onEditTask={t => setProjectTaskModal({ mode: 'edit', task: t })}
                    onDeleteTask={handleDeleteProjectTask}
                    busy={busy}
                  />
            )}

            {/* Yearly Goals tab */}
            {activeTab === 'goals' && (
              tabLoading.goals
                ? <div className="loading-text">Loading goals…</div>
                : <GoalsTab
                    goals={goals}
                    dragGoalId={dragGoalId}
                    dragOverCol={dragOverCol}
                    onDragStart={id => setDragGoalId(id)}
                    onDragOver={col => setDragOverCol(col)}
                    onDrop={async (newStatus) => {
                      if (!dragGoalId || !newStatus) { setDragGoalId(null); setDragOverCol(null); return; }
                      const id = dragGoalId;
                      setDragGoalId(null);
                      setDragOverCol(null);
                      // Optimistic update
                      setGoals(prev => prev.map(g => g.id === id ? { ...g, status: newStatus } : g));
                      try {
                        await apiGet(apiUrl, apiToken, { action: 'update_goal', id, status: newStatus });
                      } catch (err) {
                        setError('Failed to move goal: ' + err.message);
                        loadGoals(apiUrl, apiToken);
                      }
                    }}
                    onAddGoal={status => setGoalModal({ mode: 'add', status: status || 'To Do' })}
                    onEditGoal={g => setGoalModal({ mode: 'edit', goal: g })}
                    onDeleteGoal={async (id) => {
                      if (!window.confirm('Delete this goal?')) return;
                      setGoals(prev => prev.filter(g => g.id !== id));
                      try {
                        await apiGet(apiUrl, apiToken, { action: 'delete_goal', id });
                      } catch (err) {
                        setError('Failed to delete goal: ' + err.message);
                        loadGoals(apiUrl, apiToken);
                      }
                    }}
                    busy={busy}
                  />
            )}

            {/* Shared Interests tab */}
            {activeTab === 'interests' && (
              tabLoading.interests
                ? <div className="loading-text">Loading interests…</div>
                : <SharedInterestTab
                    interests={interests}
                    onDelete={handleDeleteInterest}
                    onAdd={() => setInterestModal(true)}
                    busy={busy}
                  />
            )}

            {/* Ideas tab */}
            {activeTab === 'ideas' && (
              tabLoading.ideas
                ? <div className="loading-text">Loading ideas…</div>
                : <IdeasTab
                    ideas={ideas}
                    onAdd={handleAddIdea}
                    onPromote={handlePromoteIdea}
                    onArchive={handleArchiveIdea}
                    busy={busy}
                  />
            )}

            {/* Shopping tab */}
            {activeTab === 'shopping' && (
              tabLoading.shopping
                ? <div className="loading-text">Loading shopping lists…</div>
                : <ShoppingTab
                    stores={shopping}
                    onToggle={handleToggleShopping}
                    onAddItem={() => setAddItemModal(true)}
                    busy={busy}
                  />
            )}

            {/* Home Front tab */}
            {activeTab === 'home_front' && (
              <HomeFrontTab
                homeFront={homeFront}
                loading={!!tabLoading.home_front}
                busy={busy}
                onRecordService={handleRecordService}
                onRecipeToShopping={handleRecipeToShopping}
              />
            )}

            {/* PTO tab */}
            {activeTab === 'pto' && (
              tabLoading.pto
                ? <div className="loading-text">Loading PTO data…</div>
                : <PTOTab
                    stats={pto}
                    onTriggerBuffer={handleTriggerBuffer}
                    busy={busy}
                  />
            )}

            {/* Travel tab */}
            {activeTab === 'travel' && (
              tabLoading.pto
                ? <div className="loading-text">Loading travel data…</div>
                : <TravelTab
                    pto={pto}
                    itineraries={itineraries}
                    packingItems={packingItems}
                    tripMeta={tripMeta}
                    packingFocusTripKey={packingFocusTripKey}
                    busy={busy}
                    onSelectTrip={function(trip) {
                      if (!itineraries[trip.tripKey])
                        loadItinerary(trip.tripKey, trip.startDate, trip.endDate);
                    }}
                    onExpandTrip={function(trip) {
                      if (!itineraries[trip.tripKey])
                        loadItinerary(trip.tripKey, trip.startDate, trip.endDate);
                    }}
                    onAddItinItem={function(tripKey, sd, ed) {
                      setItinItemModal({ mode: 'add', tripKey, tripStartDate: sd, tripEndDate: ed });
                    }}
                    onEditItinItem={function(item, tripKey, sd, ed) {
                      setItinItemModal({ mode: 'edit', item, tripKey, tripStartDate: sd, tripEndDate: ed });
                    }}
                    onDeleteItinItem={handleDeleteItineraryItem}
                    onSetTripMeta={handleSetTripMeta}
                    onLoadTripMeta={loadTripMeta}
                    onLoadPacking={loadPacking}
                    onGeneratePacking={handleGeneratePacking}
                    onTogglePackingItem={handleTogglePackingItem}
                    onAddPackingItem={handleAddPackingItem}
                    onDeletePackingItem={handleDeletePackingItem}
                    onGoToPacking={handleGoToPacking}
                  />
            )}

            {/* Finances tab */}
            {activeTab === 'finances' && (
              <FinancesTab
                summaries={summaries}
                budget={budget}
                budgetLoading={!!tabLoading.finances}
                bills={bills}
                billsLoading={!!tabLoading.bills}
                onBillToggle={handleBillToggle}
              />
            )}

            {/* Milestones tab */}
            {activeTab === 'milestones' && (
              <MilestonesTab
                milestones={milestones}
                flags={flags}
                tasks={tasks}
                onAction={handleAction}
                busy={busy}
              />
            )}
          </div>
        </>
      )}

      {/* Goal modal */}
      {goalModal && (
        <GoalModal
          mode={goalModal.mode}
          goal={goalModal.goal}
          defaultStatus={goalModal.status}
          onSave={handleSaveGoal}
          onClose={() => setGoalModal(null)}
          busy={busy}
        />
      )}

      {/* Add Interest modal */}
      {interestModal && (
        <AddInterestModal
          onSave={handleSaveInterest}
          onClose={() => setInterestModal(false)}
          busy={busy}
        />
      )}

      {/* Add / Edit Itinerary Item modal */}
      {itinItemModal && (
        <AddItineraryItemModal
          mode={itinItemModal.mode}
          item={itinItemModal.item}
          tripKey={itinItemModal.tripKey}
          onSave={itinItemModal.mode === 'edit' ? handleUpdateItineraryItem : handleAddItineraryItem}
          onClose={() => setItinItemModal(null)}
          busy={busy}
        />
      )}

      {/* Toast notification */}
      {toast && (
        <div className={`toast${toast.isError ? ' error' : ''}`}>
          {toast.msg}
        </div>
      )}
    </>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
