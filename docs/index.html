function ItineraryView({ trip, itinerary, loading, busy,
                         tripContext, onSetContext, onSetTraveler, onLoadContext, onGoToPacking,
                         onAdd, onEdit, onDelete,
                         apiUrl, apiToken }) {
  if (loading) return <div className="loading-text">Loading itinerary…</div>;

  const items   = (itinerary && itinerary.items) || [];
  const notices = computeItineraryNotices(items);
  const [viewMode,       setViewMode]       = React.useState('agenda'); // 'agenda' | 'summary' | 'visa'
  const [travelerFilter, setTravelerFilter] = React.useState(
    (tripContext && tripContext !== 'loading' && tripContext.traveler) || 'Both'
  ); // 'Ahmed' | 'Victoria' | 'Both'

  // ── Visa check state ────────────────────────────────────────────────────────
  function guessDestination(label) {
    if (!label) return '';
    // Strip common prefixes: "Vacation: X", "Trip to X", "Trip: X"
    var s = label.replace(/^(vacation|trip|travel|holiday|visit)\s*:?\s*(to\s+)?/i, '').trim();
    // Strip trailing suffixes like "Cruise", "Tour", "2026"
    s = s.replace(/\s+(cruise|tour|road\s*trip|\d{4})$/i, '').trim();
    return s;
  }
  const [visaCountry,  setVisaCountry]  = React.useState(function() { return guessDestination(trip && trip.label); });
  const [visaResults,  setVisaResults]  = React.useState(null);
  const [visaLoading,  setVisaLoading]  = React.useState(false);
  const [visaNote,     setVisaNote]     = React.useState('');

  function handleVisaCheck() {
    if (!visaCountry.trim() || !apiUrl || !apiToken) return;
    setVisaLoading(true);
    setVisaResults(null);
    setVisaNote('');
    apiGet(apiUrl, apiToken, { action: 'get_visa_requirements', destination: visaCountry.trim() })
      .then(function(r) {
        setVisaResults(r.results || []);
        setVisaNote(r.note || '');
      })
      .catch(function(err) { setVisaNote('Error: ' + err.message); })
      .finally(function() { setVisaLoading(false); });
  }
  // ──────────────────────────────────────────────────────────────────────────

  // ── Flight status state ────────────────────────────────────────────────────
  const [flightStatuses, setFlightStatuses] = React.useState({});
  const [statusLoading,  setStatusLoading]  = React.useState(false);
  const [expandedFlight, setExpandedFlight] = React.useState(null);

  function refreshFlightStatuses() {
    if (!trip || !trip.tripKey || !apiUrl || !apiToken || statusLoading) return;
    setStatusLoading(true);
    apiGet(apiUrl, apiToken, { action: 'flight_statuses', tripKey: trip.tripKey })
      .then(function(r) { if (r.ok) setFlightStatuses(r.statuses || {}); })
      .catch(function() {})
      .finally(function() { setStatusLoading(false); });
  }

  React.useEffect(function() {
    refreshFlightStatuses();
    var timer = setInterval(refreshFlightStatuses, 120000); // auto-refresh every 2 min
    return function() { clearInterval(timer); };
  }, []); // eslint-disable-line react-hooks/exhaustive-deps
  // ──────────────────────────────────────────────────────────────────────────

  // Lazy-load trip context on first render if not already fetched
  React.useEffect(function() {
    if (tripContext === undefined && onLoadContext) onLoadContext();
  }, []); // eslint-disable-line react-hooks/exhaustive-deps

  // Sync travelerFilter when tripContext finishes loading from backend
  React.useEffect(function() {
    if (tripContext && tripContext !== 'loading' && tripContext.traveler) {
      setTravelerFilter(tripContext.traveler);
    }
  }, [tripContext && tripContext !== 'loading' ? tripContext.traveler : undefined]); // eslint-disable-line react-hooks/exhaustive-deps

  // ── Build ordered day list ─────────────────────────────────────────────────
  const tripDays = getDayRange(trip.startDate, trip.endDate);

  // Pre-compute hotel checkout date map: itemId → checkoutDate
  var hotelCheckoutDates = {};
  items.forEach(function(item) {
    if ((item.type !== 'hotel' && item.type !== 'cruise') || !item.metadata) return;
    try { var m = JSON.parse(item.metadata); if (m.checkoutDate) hotelCheckoutDates[item.id] = m.checkoutDate; } catch(e) {}
  });

  // ── Gap detection (missing hotel / missing transport) ──────────────────────
  var gaps = computeItineraryGaps(items, tripDays, hotelCheckoutDates);
  var missingHotelDays     = {};
  var missingTransportDays = {};
  gaps.forEach(function(g) {
    if (g.type === 'missing_hotel')     missingHotelDays[g.date]     = true;
    if (g.type === 'missing_transport') missingTransportDays[g.date] = g.subtype;
  });
  // Merge gaps into the notices array so the "💡 VERA Notices" block shows them too
  var allNotices = notices.concat(gaps);
  // ──────────────────────────────────────────────────────────────────────────

  // Apply traveler filter — synthetic rows always pass; untagged items show for all filters
  var displayItems = travelerFilter === 'Both' ? items : items.filter(function(item) {
    if (item._synthetic) return true;
    var m = {};
    try { m = JSON.parse(item.metadata || '{}'); } catch(e) {}
    var t = m.traveler || 'Both';
    return t === 'Both' || t === travelerFilter;
  });

  const byDay    = {};
  displayItems.forEach(function(item) {
    const d = item.date || '__other__';
    if (!byDay[d]) byDay[d] = [];
    byDay[d].push(item);
  });
  // Ensure every trip day exists in byDay (even if empty)
  tripDays.forEach(function(d) { if (!byDay[d]) byDay[d] = []; });

  // Inject synthetic hotel checkout entries so checkout day shows "Check out" row
  items.forEach(function(item) {
    var cd = hotelCheckoutDates[item.id];
    if (!cd) return;
    if (!byDay[cd]) byDay[cd] = [];
    byDay[cd].push({
      _synthetic: true,
      id: item.id + '_checkout',
      type: 'hotel',
      title: item.title,
      date: cd,
      startTime: item.endTime || '',
      endTime: '',
      location: item.location || '',
      notes: '',
      source: item.source,
      metadata: item.metadata,
    });
  });

  // ── Resolve default hotel check-in / check-out times ─────────────────────
  // For multiday hotel stays with no explicit times:
  //   Check-in  default = 15:00, pushed later if a flight arrives after 15:00 that day
  //   Check-out default = 10:00, pulled earlier if a flight/train departs before 10:00 that day
  Object.keys(byDay).forEach(function(d) {
    var snapshot = byDay[d].slice(); // read originals before map replaces entries
    byDay[d] = byDay[d].map(function(item) {
      if (item.type !== 'hotel') return item;
      if (item._synthetic) {
        // Checkout row — resolve default time
        if (item.startTime) return item; // explicit time already set
        var co = '10:00';
        snapshot.forEach(function(o) {
          if (o._synthetic) return;
          if ((o.type === 'flight' || o.type === 'train') && o.startTime && o.startTime < co) co = o.startTime;
        });
        return Object.assign({}, item, { startTime: co, _defaultTime: true });
      } else if (hotelCheckoutDates[item.id]) {
        // Check-in row — resolve default time
        if (item.startTime) return item; // explicit time already set
        var ci = '15:00';
        snapshot.forEach(function(o) {
          if (o.type === 'flight' && !o._synthetic && o.endTime && o.endTime > ci) ci = o.endTime;
        });
        return Object.assign({}, item, { startTime: ci, _defaultTime: true });
      }
      return item;
    });
  });
  // ─────────────────────────────────────────────────────────────────────────

  // Full ordered list: pre-trip days → trip days → post-trip days → undated
  const outOfRange = Object.keys(byDay)
    .filter(function(d) { return d !== '__other__' && tripDays.indexOf(d) === -1; })
    .sort();
  const preTripDays  = outOfRange.filter(function(d) { return trip.startDate && d < trip.startDate; });
  const postTripDays = outOfRange.filter(function(d) { return !trip.startDate || d > (trip.endDate || trip.startDate); });
  const orderedDays  = preTripDays.concat(tripDays).concat(postTripDays);
  if (byDay['__other__'] && byDay['__other__'].length) orderedDays.push('__other__');
  // ──────────────────────────────────────────────────────────────────────────

  return (
    <div>
      {/* Trip header */}
      <div style={{ marginBottom: 16, paddingBottom: 12, borderBottom: '1px solid #2a3a50' }}>
        {/* Row 1: title + dates */}
        <div style={{ marginBottom: 8 }}>
          <div style={{ fontWeight: 700, fontSize: 16, color: '#e8eaed' }}>{trip.label}</div>
          <div style={{ color: '#8ab4f8', fontSize: 13 }}>{trip.startDate} → {trip.endDate}</div>
        </div>
        {/* Row 2: context badge + action buttons */}
        <div style={{ display: 'flex', alignItems: 'center', gap: 10, flexWrap: 'wrap' }}>
          <TripContextBadge
            context={tripContext && tripContext !== 'loading' ? tripContext.context : ''}
            onSetContext={function(ctx) { if (onSetContext) onSetContext(ctx); }}
            busy={busy}
          />
          {/* Traveler filter toggle */}
          <div style={{ display: 'flex', gap: 4 }}>
            {['Ahmed', 'Victoria', 'Both'].map(function(t) {
              var colors = t === 'Ahmed'    ? { on: '#5c9eff', bg: '#0d2040' }
                         : t === 'Victoria' ? { on: '#b87cff', bg: '#1a0d30' }
                         :                   { on: '#4a9060', bg: '#0d1a10' };
              return (
                <button key={t} onClick={function() { setTravelerFilter(t); if (onSetTraveler) onSetTraveler(t); }}
                  style={{ padding: '3px 10px', borderRadius: 6, cursor: 'pointer',
                           fontSize: 11, fontWeight: 600,
                           border: travelerFilter === t ? '1.5px solid ' + colors.on : '1.5px solid transparent',
                           background: travelerFilter === t ? colors.bg : '#1e2a3a',
                           color: travelerFilter === t ? colors.on : '#6b7fa8' }}>
                  {t}
                </button>
              );
            })}
          </div>
          <div style={{ marginLeft: 'auto', display: 'flex', gap: 6, flexShrink: 0 }}>
            {onGoToPacking && (
              <button onClick={onGoToPacking} disabled={busy}
                style={{ padding: '5px 11px', borderRadius: 6, border: '1px solid #2a3a50',
                         background: 'transparent', color: '#8ab4f8', fontWeight: 600,
                         cursor: 'pointer', fontSize: 13 }}>
                🧳 Packing
              </button>
            )}
            {['agenda','summary','visa'].map(function(mode) {
              var labels = { agenda: '🗒 Agenda', summary: '📋 Summary', visa: '🛂 Visa' };
              var active = viewMode === mode;
              return (
                <button key={mode} onClick={function() { setViewMode(mode); }}
                  style={{ padding: '5px 11px', borderRadius: 6, fontSize: 13, fontWeight: 600,
                           cursor: 'pointer',
                           border: active ? '1px solid #5c9eff' : '1px solid #2a3a50',
                           background: active ? '#0d2040' : 'transparent',
                           color: active ? '#5c9eff' : '#8ab4f8' }}>
                  {labels[mode]}
                </button>
              );
            })}
            <button onClick={onAdd} disabled={busy}
              style={{ padding: '5px 14px', borderRadius: 6, border: 'none',
                       background: '#8ab4f8', color: '#0d1117', fontWeight: 600,
                       cursor: 'pointer', fontSize: 13 }}>
              + Add Item
            </button>
          </div>
        </div>
      </div>

      {/* Empty state */}
      {items.length === 0 && tripDays.length === 0 && (
        <div style={{ textAlign: 'center', padding: '40px 20px', color: '#5f6368', fontSize: 14 }}>
          <div style={{ fontSize: 32, marginBottom: 10 }}>🗺️</div>
          <div>No itinerary items yet.</div>
          <div style={{ marginTop: 6, fontSize: 12 }}>
            Add flights, hotels, or notes above. Calendar events within the trip dates appear automatically.
          </div>
        </div>
      )}

      {/* VERA Notices */}
      {allNotices.length > 0 && (
        <div style={{ background: '#0a1a2e', border: '1px solid #1e3a5f', borderRadius: 8,
                      padding: '10px 14px', marginBottom: 16 }}>
          <div style={{ fontWeight: 700, color: '#8ab4f8', fontSize: 12, marginBottom: 8 }}>
            💡 VERA Notices
          </div>
          {allNotices.map(function(n, ni) {
            var hrs    = Math.floor((n.gapMins || 0) / 60);
            var mins   = (n.gapMins || 0) % 60;
            var gapStr = hrs > 0 ? hrs + 'h' + (mins ? ' ' + mins + 'm' : '') : mins + 'm';
            var dateStr = n.date && n.date !== '__other__' ? formatAgendaDate(n.date) + ': ' : '';

            if (n.type === 'overlap') {
              return (
                <div key={ni} style={{ color: '#e8b44a', fontSize: 12, marginBottom: 5 }}>
                  ⚠️ {dateStr}<em>"{n.a.title}"</em> and <em>"{n.b.title}"</em> overlap at {n.a.startTime}
                </div>
              );
            }
            if (n.type === 'flight_gap') {
              return (
                <div key={ni} style={{ color: '#9ab4d8', fontSize: 12, marginBottom: 5 }}>
                  ✈ {dateStr}Lands {n.from.endTime}, next event "{n.to.title}" at {n.to.startTime} — {gapStr} gap. Consider adding a transfer or stop.
                </div>
              );
            }
            if (n.type === 'timeline_gap') {
              return (
                <div key={ni} style={{ color: '#6b7fa8', fontSize: 12, marginBottom: 5 }}>
                  ⏱ {dateStr}{gapStr} free after "{n.from.title}" ({n.from.endTime || n.from.startTime} → {n.to.startTime})
                </div>
              );
            }
            if (n.type === 'missing_hotel') {
              return (
                <div key={ni} style={{ color: '#e05a5a', fontSize: 12, marginBottom: 5 }}>
                  🏨 {dateStr}No accommodation planned
                </div>
              );
            }
            if (n.type === 'missing_transport') {
              var tLabel = n.subtype === 'arrival' ? 'No arrival transport planned' : 'No departure transport planned';
              return (
                <div key={ni} style={{ color: '#e05a5a', fontSize: 12, marginBottom: 5 }}>
                  ✈ {dateStr}{tLabel}
                </div>
              );
            }
            return null;
          })}
        </div>
      )}

      {/* ── Live Flight Status Ticker ────────────────────────────────────── */}
      {Object.keys(flightStatuses).length > 0 && (function() {
        var now     = Date.now();
        var tickerFlights = items.filter(function(item) {
          if (item.type !== 'flight' || !flightStatuses[item.id]) return false;
          var depMs = new Date((item.date || '') + 'T' + (item.startTime || '00:00') + ':00').getTime();
          return !isNaN(depMs) && (depMs - now) < 24 * 60 * 60 * 1000 && (depMs - now) > -2 * 60 * 60 * 1000;
        });
        if (tickerFlights.length === 0) return null;
        return (
          <div style={{ background: '#071428', border: '1px solid #1e3a5f', borderRadius: 8,
                        padding: '10px 14px', marginBottom: 16 }}>
            <div style={{ display: 'flex', alignItems: 'center', justifyContent: 'space-between',
                          marginBottom: 8 }}>
              <div style={{ fontWeight: 700, color: '#8ab4f8', fontSize: 12 }}>
                ✈ LIVE FLIGHT STATUS
              </div>
              <button onClick={refreshFlightStatuses} disabled={statusLoading}
                style={{ background: 'transparent', border: 'none', color: '#8ab4f8',
                         cursor: 'pointer', fontSize: 11, padding: '2px 6px' }}>
                {statusLoading ? 'Refreshing…' : '🔄 Refresh'}
              </button>
            </div>
            {tickerFlights.map(function(item) {
              var fs = flightStatuses[item.id];
              var meta = {};
              try { meta = JSON.parse(item.metadata || '{}'); } catch(e) {}
              var flightNum = (meta.flightNum || '').toUpperCase();
              var depTime = fs.dep_estimated || fs.dep_scheduled || item.startTime || '';
              var lastMin = fs.lastChecked ? Math.round((Date.now() - fs.lastChecked) / 60000) : null;
              return (
                <div key={item.id} style={{ display: 'flex', alignItems: 'center', gap: 8,
                                            padding: '4px 0', borderTop: '1px solid #1a2a3a',
                                            fontSize: 12 }}>
                  <span style={{ fontWeight: 700, color: '#e8eaed', minWidth: 60 }}>{flightNum || item.title}</span>
                  <FlightStatusBadge status={fs} />
                  {fs.gate && (
                    <span style={{ color: '#6b7fa8' }}>Gate {fs.gate}</span>
                  )}
                  {depTime && (
                    <span style={{ color: '#9aa0a6' }}>Departs {depTime}</span>
                  )}
                  {lastMin !== null && (
                    <span style={{ color: '#3a4a60', marginLeft: 'auto', fontSize: 10 }}>
                      {lastMin < 1 ? 'just now' : lastMin + 'min ago'}
                    </span>
                  )}
                </div>
              );
            })}
          </div>
        );
      })()}

      {/* ── Visa mode ───────────────────────────────────────────────────── */}
      {viewMode === 'visa' && (
        <div style={{ padding: '16px 0' }}>
          <div style={{ marginBottom: 16 }}>
            <div style={{ fontSize: 12, color: '#8ab4f8', marginBottom: 6 }}>Destination Country</div>
            <div style={{ display: 'flex', gap: 8 }}>
              <input
                style={{ flex: 1, background: '#0d1520', border: '1px solid #2a3a50', borderRadius: 6,
                         padding: '7px 12px', color: '#dde1f0', fontSize: 13, outline: 'none' }}
                placeholder="e.g. Japan, United States, France…"
                value={visaCountry}
                onChange={function(e) { setVisaCountry(e.target.value); setVisaResults(null); }}
                onKeyDown={function(e) { if (e.key === 'Enter') handleVisaCheck(); }}
              />
              <button
                onClick={handleVisaCheck}
                disabled={visaLoading || !visaCountry.trim()}
                style={{ padding: '7px 16px', borderRadius: 6, border: 'none', fontWeight: 600,
                         fontSize: 13, cursor: 'pointer',
                         background: visaLoading ? '#2a3a50' : '#5c9eff', color: '#0d1117' }}>
                {visaLoading ? 'Checking…' : 'Check'}
              </button>
            </div>
          </div>

          {visaNote && (
            <div style={{ background: '#1a1e2e', border: '1px solid #3a4060', borderRadius: 8,
                          padding: '10px 14px', fontSize: 13, color: '#8ab4f8', marginBottom: 12 }}>
              ℹ️ {visaNote}
            </div>
          )}

          {visaResults && visaResults.length === 0 && !visaNote && (
            <div style={{ textAlign: 'center', padding: '24px 0', color: '#5c7080', fontSize: 13 }}>
              No results found. Try the full English country name.
            </div>
          )}

          {(visaResults || []).map(function(person, pi) {
            var vc = VISA_COLOR;
            return (
              <div key={pi} style={{ marginBottom: 10 }}>
                <div style={{ fontSize: 12, color: '#5c7080', fontWeight: 600, marginBottom: 6,
                              textTransform: 'uppercase', letterSpacing: '0.05em' }}>{person.name}</div>
                {(person.passports || []).map(function(p, i) {
                  var c = (vc && vc[p.color]) || { bg:'#1a1e2e', border:'#3a4060', text:'#8ab4f8' };
                  return (
                    <div key={i} style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center',
                                          background: c.bg, border: '1px solid ' + c.border, borderRadius: 8,
                                          padding: '10px 14px', marginBottom: 6 }}>
                      <span style={{ fontSize: 13, color: '#dde1f0' }}>🌍 {p.passportCountry}</span>
                      <span style={{ fontWeight: 700, fontSize: 13, color: c.text }}>{p.label}</span>
                    </div>
                  );
                })}
              </div>
            );
          })}

          {!visaResults && !visaLoading && (
            <div style={{ textAlign: 'center', color: '#3a4060', fontSize: 12, marginTop: 8 }}>
              Enter a destination and press Check
            </div>
          )}
          <div style={{ fontSize: 11, color: '#3a4060', marginTop: 16 }}>
            Data: Passport Index dataset · Always verify with official embassy sources before travel.
          </div>
        </div>
      )}

      {/* ── Summary mode ────────────────────────────────────────────────── */}
      {viewMode === 'summary' && orderedDays
        .filter(function(d) { return d !== '__other__'; })
        .map(function(day, dayIdx) {
          var dayItems  = byDay[day] || [];
          var isInRange = tripDays.indexOf(day) !== -1;
          var dayNum    = isInRange ? tripDays.indexOf(day) + 1 : null;
          var hasFlight = dayItems.some(function(i) { return i.type === 'flight'; });
          var dayTag = '';
          if (hasFlight) {
            if (day === trip.startDate)    dayTag = '🛬 Arrival Day';
            else if (day === trip.endDate) dayTag = '🛫 Departure Day';
            else                           dayTag = '✈ Travel Day';
          }

          var timedItems = dayItems
            .filter(function(i) { return i.startTime; })
            .sort(function(a, b) { return a.startTime < b.startTime ? -1 : 1; });
          var freeBlocks = [];
          for (var k = 0; k < timedItems.length - 1; k++) {
            var curr     = timedItems[k];
            var nextItem = timedItems[k + 1];
            var gapStart = curr.endTime || curr.startTime;
            var gapMins  = timeToMins(nextItem.startTime) - timeToMins(gapStart);
            if (gapMins >= 60) {
              freeBlocks.push({ start: gapStart, end: nextItem.startTime, mins: gapMins });
            }
          }

          var hasGap = missingHotelDays[day] || missingTransportDays[day];

          return (
            <div key={day} style={{ background: '#0a1220',
                                    border: '1px solid ' + (hasGap ? '#3a1a1a' : '#2a3a50'),
                                    borderRadius: 10, padding: '14px 16px', marginBottom: 12 }}>
              <div style={{ display: 'flex', alignItems: 'center', gap: 8, marginBottom: 10 }}>
                <div style={{ fontWeight: 700, color: '#8ab4f8', fontSize: 14 }}>
                  {dayNum ? 'Day ' + dayNum + ' — ' : ''}{formatAgendaDate(day)}
                </div>
                {dayTag && (
                  <span style={{ fontSize: 11, fontWeight: 600, color: '#5c9eff',
                                 background: '#0d2040', borderRadius: 10, padding: '2px 8px' }}>
                    {dayTag}
                  </span>
                )}
              </div>

              {dayItems.length === 0 ? (
                <div style={{ color: '#3a4a60', fontSize: 12, fontStyle: 'italic' }}>No events scheduled</div>
              ) : (
                <div>
                  <div style={{ color: '#6b7fa8', fontSize: 12, marginBottom: 8 }}>
                    {dayItems.length} event{dayItems.length !== 1 ? 's' : ''} scheduled
                  </div>
                  {timedItems.concat(dayItems.filter(function(i) { return !i.startTime; })).map(function(item) {
                    var hotelLabel = (item.type === 'hotel' || item.type === 'arranged_stay')
                      ? (item._synthetic
                          ? (item.type === 'arranged_stay' ? 'Leaving — ' : 'Check out — ')
                          : hotelCheckoutDates[item.id]
                            ? (item.type === 'arranged_stay' ? 'Arriving — ' : 'Check in — ')
                            : null)
                      : null;
                    return (
                      <div key={item.id} style={{ fontSize: 13, color: '#dde1f0', marginBottom: 5,
                                                  display: 'flex', gap: 8, alignItems: 'baseline' }}>
                        <span style={{ fontSize: 15 }}>{ITIN_TYPE_ICON[item.type] || '📝'}</span>
                        <span style={{ flex: 1 }}>
                          {hotelLabel && (
                            <span style={{ color: '#8ab4f8', fontSize: 11, fontWeight: 600 }}>{hotelLabel}</span>
                          )}
                          {item.title}
                        </span>
                        {item.startTime && (
                          <span style={{ color: item._defaultTime ? '#4a5870' : '#6b7fa8',
                                         fontSize: 12, flexShrink: 0,
                                         fontStyle: item._defaultTime ? 'italic' : 'normal' }}>
                            {item.startTime}{item.endTime && !item._synthetic && !hotelCheckoutDates[item.id] ? ' → ' + item.endTime : ''}
                          </span>
                        )}
                      </div>
                    );
                  })}
                  {freeBlocks.length > 0 && (
                    <div style={{ marginTop: 10, paddingTop: 8, borderTop: '1px solid #1a2435' }}>
                      <div style={{ fontSize: 11, color: '#4a6040', fontWeight: 600, marginBottom: 4 }}>🟢 Free time</div>
                      {freeBlocks.map(function(fb, fi) {
                        var h = Math.floor(fb.mins / 60), m = fb.mins % 60;
                        var dur = (h > 0 ? h + 'h ' : '') + (m > 0 ? m + 'm' : '');
                        return (
                          <div key={fi} style={{ fontSize: 12, color: '#5a8050', marginBottom: 2 }}>
                            {fb.start} – {fb.end} ({dur.trim()})
                          </div>
                        );
                      })}
                    </div>
                  )}
                </div>
              )}
              {/* Gap warnings: shown regardless of whether day has items */}
              {hasGap && (
                <div style={{ marginTop: 8, paddingTop: 8, borderTop: '1px solid #2a1515' }}>
                  {missingHotelDays[day] && (
                    <div style={{ fontSize: 11, color: '#c05050', fontWeight: 600, marginBottom: 3 }}>
                      🏨 No accommodation planned
                    </div>
                  )}
                  {missingTransportDays[day] && (
                    <div style={{ fontSize: 11, color: '#c05050', fontWeight: 600, marginBottom: 3 }}>
                      {missingTransportDays[day] === 'arrival'
                        ? '✈ No arrival transport planned'
                        : '✈ No departure transport planned'}
                    </div>
                  )}
                </div>
              )}
            </div>
          );
        })
      }

      {/* ── Agenda mode ─────────────────────────────────────────────────── */}
      {viewMode === 'agenda' && orderedDays.map(function(day, dayIdx) {
        const dayItems  = byDay[day] || [];
        const isInRange = tripDays.indexOf(day) !== -1;
        const dayNum    = isInRange ? tripDays.indexOf(day) + 1 : null;
        const isEmpty   = dayItems.length === 0;

        const hasFlight = dayItems.some(function(i) { return i.type === 'flight'; });
        let dayTag = '';
        if (hasFlight) {
          if (day === trip.startDate)    dayTag = '🛬 Arrival Day';
          else if (day === trip.endDate) dayTag = '🛫 Departure Day';
          else                           dayTag = '✈ Travel Day';
        }

        let headerLabel;
        if (day === '__other__')    headerLabel = 'Other';
        else if (dayNum !== null)   headerLabel = 'Day ' + dayNum + ' — ' + formatAgendaDate(day);
        else                        headerLabel = formatAgendaDate(day);

        return (
          <div key={day} style={{ marginBottom: 20 }}>
            {/* Day header */}
            <div style={{ display: 'flex', alignItems: 'center', gap: 8,
                          borderBottom: '1px solid #2a3a50', paddingBottom: 6, marginBottom: 10 }}>
              <div style={{ fontWeight: 700, color: '#8ab4f8', fontSize: 13, letterSpacing: 0.3 }}>
                {headerLabel}
              </div>
              {dayTag && (
                <span style={{ fontSize: 11, fontWeight: 600, color: '#5c9eff',
                               background: '#0d2040', borderRadius: 10,
                               padding: '2px 8px', whiteSpace: 'nowrap' }}>
                  {dayTag}
                </span>
              )}
            </div>

            {/* Empty day placeholder */}
            {isEmpty && (
              <div style={{ color: '#3a4a60', fontSize: 12, fontStyle: 'italic',
                            padding: '6px 0 6px 64px' }}>
                No events scheduled
              </div>
            )}

            {/* Items */}
            {dayItems.map(function(item) {
              // Parse metadata once — used by both the time column and end-time span
              var itemMeta = {};
              if (item.metadata) { try { itemMeta = JSON.parse(item.metadata); } catch(e){} }
              return (
                <div key={item.id} style={{
                  display: 'flex', alignItems: 'flex-start', gap: 10,
                  padding: '9px 6px', borderBottom: '1px solid #1a2435',
                }}>
                  {/* Time + optional departure TZ badge */}
                  {(function() {
                    // Calendar items store startTz (departure TZ); manual items store timezone
                    var depTz = itemMeta.startTz || itemMeta.timezone || '';
                    var tzLabel = depTz ? (ITIN_TZ_ABBR[depTz] || depTz.split('/').pop()) : '';
                    return (
                      <div style={{ width: 54, flexShrink: 0, textAlign: 'right',
                                    paddingTop: 3, fontVariantNumeric: 'tabular-nums' }}>
                        <div style={{ color: item._defaultTime ? '#4a5870' : '#6b7fa8',
                                      fontSize: 12, fontStyle: item._defaultTime ? 'italic' : 'normal' }}>
                          {item.startTime || React.createElement('span', { style: { color: '#3a4a60' } }, '·')}
                        </div>
                        {tzLabel && (
                          <div style={{ fontSize: 10, color: '#4d6080', marginTop: 1 }}>{tzLabel}</div>
                        )}
                      </div>
                    );
                  })()}
                  {/* Icon */}
                  <div style={{ fontSize: 17, flexShrink: 0, paddingTop: 1 }}>
                    {ITIN_TYPE_ICON[item.type] || '📝'}
                  </div>
                  {/* Content */}
                  <div style={{ flex: 1, minWidth: 0 }}>
                    <div style={{ color: '#e8eaed', fontSize: 14, fontWeight: 500,
                                  whiteSpace: 'nowrap', overflow: 'hidden', textOverflow: 'ellipsis',
                                  cursor: item.type === 'flight' && flightStatuses[item.id] ? 'pointer' : 'default' }}
                         onClick={item.type === 'flight' && flightStatuses[item.id]
                           ? function() { setExpandedFlight(expandedFlight === item.id ? null : item.id); }
                           : undefined}>
                      {(item.type === 'hotel' || item.type === 'arranged_stay') && (item._synthetic || hotelCheckoutDates[item.id]) && (
                        <span style={{ color: item.type === 'arranged_stay' ? '#a89060' : '#8ab4f8',
                                       fontSize: 10, fontWeight: 600,
                                       display: 'block', textTransform: 'uppercase', letterSpacing: 0.5,
                                       marginBottom: 1, overflow: 'visible', whiteSpace: 'nowrap' }}>
                          {item._synthetic
                            ? (item.type === 'arranged_stay' ? '← Leaving' : '← Check out')
                            : (item.type === 'arranged_stay' ? 'Arriving →' : 'Check in →')}
                        </span>
                      )}
                      {item.title}
                      {item.endTime && item.startTime && !item._synthetic && !hotelCheckoutDates[item.id] && (function() {
                        var arrTz    = itemMeta.endTz || '';
                        var arrLabel = arrTz ? (ITIN_TZ_ABBR[arrTz] || arrTz.split('/').pop()) : '';
                        return (
                          <span style={{ color: '#6b7fa8', fontWeight: 400, fontSize: 12, marginLeft: 8 }}>
                            → {item.endTime}
                            {arrLabel && (
                              <span style={{ fontSize: 10, color: '#4d6080', marginLeft: 4 }}>{arrLabel}</span>
                            )}
                          </span>
                        );
                      })()}
                    </div>
                    {/* Flight status badge */}
                    {item.type === 'flight' && flightStatuses[item.id] && (
                      <div style={{ marginTop: 3, display: 'flex', alignItems: 'center', gap: 6 }}>
                        <FlightStatusBadge status={flightStatuses[item.id]} />
                        <span style={{ fontSize: 10, color: '#3a4a60' }}>tap for details</span>
                      </div>
                    )}
                    {/* Expandable flight detail */}
                    {item.type === 'flight' && expandedFlight === item.id && flightStatuses[item.id] && (function() {
                      var fs  = flightStatuses[item.id];
                      var lastMin = fs.lastChecked ? Math.round((Date.now() - fs.lastChecked) / 60000) : null;
                      return (
                        <div style={{ background: '#071428', border: '1px solid #1a2a3a', borderRadius: 6,
                                      padding: '8px 10px', marginTop: 6, fontSize: 12, color: '#9aa0a6' }}>
                          <div style={{ display: 'grid', gridTemplateColumns: '80px 1fr', gap: '4px 8px' }}>
                            <span style={{ color: '#6b7fa8' }}>Departure</span>
                            <span>
                              {fs.dep_scheduled && <span>Sched {fs.dep_scheduled}</span>}
                              {fs.dep_estimated && fs.dep_estimated !== fs.dep_scheduled && (
                                <span style={{ color: fs.delay_min > 0 ? '#e8b44a' : '#4ac84a' }}>
                                  {' → '}{fs.dep_estimated}
                                  {fs.delay_min > 0 && <span> (+{fs.delay_min}min)</span>}
                                </span>
                              )}
                              {fs.dep_actual && <span style={{ color: '#4ac89a' }}> · Actual {fs.dep_actual}</span>}
                            </span>
                            <span style={{ color: '#6b7fa8' }}>Arrival</span>
                            <span>
                              {fs.arr_scheduled && <span>Sched {fs.arr_scheduled}</span>}
                              {fs.arr_estimated && fs.arr_estimated !== fs.arr_scheduled && (
                                <span style={{ color: '#9ab4d8' }}>{' → '}{fs.arr_estimated}</span>
                              )}
                              {fs.arr_actual && <span style={{ color: '#4ac89a' }}> · Actual {fs.arr_actual}</span>}
                            </span>
                            {(fs.gate || fs.terminal) && (
                              <>
                                <span style={{ color: '#6b7fa8' }}>Gate / Terminal</span>
                                <span>{fs.gate || '—'} / {fs.terminal || '—'}</span>
                              </>
                            )}
                          </div>
                          {lastMin !== null && (
                            <div style={{ color: '#3a4a60', marginTop: 6, fontSize: 10 }}>
                              Last updated: {lastMin < 1 ? 'just now' : lastMin + ' min ago'}
                            </div>
                          )}
                        </div>
                      );
                    })()}
                    {item.location && (
                      <div style={{ color: '#9aa0a6', fontSize: 12, marginTop: 2 }}>📍 {item.location}</div>
                    )}
                    {item.notes && (
                      <div style={{ color: '#5f6368', fontSize: 12, fontStyle: 'italic', marginTop: 2 }}>
                        {item.notes}
                      </div>
                    )}
                    {item.type === 'calendar' && item.metadata && (function() {
                      try {
                        var m = JSON.parse(item.metadata);
                        return m.calendarName
                          ? React.createElement('div', { style: { color: '#4d6080', fontSize: 11, marginTop: 2 } },
                              '📅 ' + m.calendarName)
                          : null;
                      } catch(e) { return null; }
                    })()}
                  </div>
                  {/* Edit/delete (manual items only, not synthetic checkout rows) */}
                  {item.source !== 'calendar' && !item._synthetic && (
                    <div style={{ display: 'flex', gap: 4, flexShrink: 0 }}>
                      <button onClick={function() { onEdit(item); }} disabled={busy} title="Edit"
                        style={{ background: 'transparent', border: 'none', color: '#8ab4f8',
                                 cursor: 'pointer', fontSize: 14, padding: '2px 6px' }}>✏️</button>
                      <button onClick={function() { onDelete(item.id); }} disabled={busy} title="Delete"
                        style={{ background: 'transparent', border: 'none', color: '#9aa0a6',
                                 cursor: 'pointer', fontSize: 14, padding: '2px 6px' }}>🗑</button>
                    </div>
                  )}
                </div>
              );
            })}
          </div>
        );
      })}
    </div>
  );
}

// Accordion panel: all trips as expandable sections within "My Itinerary" sub-tab
function TravelItineraryPanel({
  trips, itineraries, tripMeta, busy, autoExpandKey,
  onExpandTrip, onAddItinItem, onEditItinItem, onDeleteItinItem,
  onSetTripMeta, onLoadTripMeta, onGoToPacking,
  apiUrl, apiToken,
}) {
  const [expanded, setExpanded] = React.useState(function() {
    return autoExpandKey ? new Set([autoExpandKey]) : new Set();
  });

  // Auto-expand when user clicks a trip card in My Trips
  React.useEffect(function() {
    if (!autoExpandKey) return;
    setExpanded(function(prev) {
      if (prev.has(autoExpandKey)) return prev;
      const next = new Set(prev);
      next.add(autoExpandKey);
      return next;
    });
  }, [autoExpandKey]);

  function toggleTrip(tripKey, t) {
    setExpanded(function(prev) {
      const next = new Set(prev);
      if (next.has(tripKey)) {
        next.delete(tripKey);
      } else {
        next.add(tripKey);
        // Lazy-load itinerary on first open
        if (!itineraries[tripKey]) onExpandTrip(t);
        // Lazy-load trip meta on first open
        if (onLoadTripMeta && tripMeta && tripMeta[tripKey] === undefined) onLoadTripMeta(tripKey);
      }
      return next;
    });
  }

  if (!trips || trips.length === 0) {
    return (
      <div className="empty-state">
        <div style={{ fontSize: 36, marginBottom: 12 }}>✈️</div>
        <div>No upcoming trips found.</div>
        <div style={{ fontSize: 12, color: '#4d6080', marginTop: 8 }}>
          Add multi-day travel events to your calendar to see them here.
        </div>
      </div>
    );
  }

  return (
    <div>
      {trips.map(function(t) {
        const tripKey   = `${t.startDate}|${t.label}`;
        const isOpen    = expanded.has(tripKey);
        const tripData  = itineraries[tripKey];
        const isLoading = tripData === 'loading';

        return (
          <div key={tripKey} style={{ marginBottom: 12, border: '1px solid #2a3a50',
                                      borderRadius: 10, overflow: 'hidden' }}>

            {/* Accordion header */}
            <div onClick={() => toggleTrip(tripKey, t)}
              style={{ display: 'flex', alignItems: 'center', gap: 12, padding: '12px 16px',
                       background: isOpen ? '#131e2e' : '#0d1117', cursor: 'pointer',
                       userSelect: 'none', transition: 'background .15s' }}>
              <div style={{ flex: 1 }}>
                <div style={{ fontWeight: 700, fontSize: 15, color: '#dde1f0' }}>{t.label}</div>
                <div style={{ fontSize: 12, color: '#6b7fa8', marginTop: 2 }}>{t.startDate} – {t.endDate}</div>
              </div>
              <div style={{ fontSize: 12, fontWeight: 600, color: '#5c9eff', background: '#0d2040',
                            borderRadius: 12, padding: '3px 10px', whiteSpace: 'nowrap' }}>
                <DaysAway n={t.daysAway} format="plain" />
              </div>
              <div style={{ fontSize: 16, color: '#8ab4f8',
                            transform: isOpen ? 'rotate(180deg)' : 'rotate(0deg)',
                            transition: 'transform .2s', lineHeight: 1 }}>
                ▾
              </div>
            </div>

            {/* Accordion body */}
            {isOpen && (
              <div style={{ padding: '0 16px 16px', background: '#0d1117',
                            borderTop: '1px solid #2a3a50' }}>
                {isLoading ? (
                  <div style={{ padding: '24px 0', textAlign: 'center',
                                color: '#6b7fa8', fontSize: 13 }}>
                    Loading itinerary…
                  </div>
                ) : (
                  <ItineraryView
                    trip={{ ...t, tripKey }}
                    itinerary={tripData}
                    loading={false}
                    busy={busy}
                    tripContext={tripMeta ? tripMeta[tripKey] : undefined}
                    onSetContext={function(ctx) {
                      if (onSetTripMeta) {
                        var cur = (tripMeta && tripMeta[tripKey]) || {};
                        onSetTripMeta(tripKey, ctx, '', cur.traveler || '');
                      }
                    }}
                    onSetTraveler={function(tv) {
                      if (onSetTripMeta) {
                        var cur = (tripMeta && tripMeta[tripKey]) || {};
                        onSetTripMeta(tripKey, cur.context || '', '', tv);
                      }
                    }}
                    onLoadContext={function() { if (onLoadTripMeta) onLoadTripMeta(tripKey); }}
                    onGoToPacking={function() { if (onGoToPacking) onGoToPacking(tripKey); }}
                    onAdd={function() { onAddItinItem(tripKey, t.startDate, t.endDate); }}
                    onEdit={function(item) { onEditItinItem(item, tripKey, t.startDate, t.endDate); }}
                    onDelete={function(id) { onDeleteItinItem(id, tripKey); }}
                    apiUrl={apiUrl}
                    apiToken={apiToken}
                  />
                )}
              </div>
            )}
          </div>
        );
      })}
    </div>
  );
}

// ---- Packing Panel ----------------------------------------------------------

function PackingPanel({
  trips, packingItems, tripMeta, busy, focusTripKey,
  onLoadPacking, onSetTripMeta, onGeneratePacking,
  onToggleItem, onAddItem, onDeleteItem,
}) {
  const [expanded,   setExpanded]   = React.useState(function() {
    return focusTripKey ? new Set([focusTripKey]) : new Set();
  });
  const [personTab,  setPersonTab]  = React.useState({}); // { [tripKey]: 'all'|'ahmed'|'victoria'|'shared' }
  const [addForm,    setAddForm]    = React.useState(null); // null | { tripKey, person, category, item }

  // Auto-expand when focusTripKey changes
  React.useEffect(function() {
    if (!focusTripKey) return;
    setExpanded(function(prev) {
      const next = new Set(prev);
      next.add(focusTripKey);
      return next;
    });
    if (!packingItems[focusTripKey]) onLoadPacking(focusTripKey);
  }, [focusTripKey]);

  function toggleEntry(tripKey) {
    setExpanded(function(prev) {
      const next = new Set(prev);
      if (next.has(tripKey)) {
        next.delete(tripKey);
      } else {
        next.add(tripKey);
        if (!packingItems[tripKey]) onLoadPacking(tripKey);
      }
      return next;
    });
  }

  if (!trips || trips.length === 0) {
    return (
      <div className="empty-state">
        <div style={{ fontSize: 36, marginBottom: 12 }}>🎒</div>
        <div>No upcoming trips found.</div>
        <div style={{ fontSize: 12, color: '#4d6080', marginTop: 8 }}>
          Trips pulled from your shared calendar will appear here.
        </div>
      </div>
    );
  }

  return (
    <div>
      {trips.map(function(t) {
        const tripKey   = t.startDate + '|' + t.label;
        const isOpen    = expanded.has(tripKey);
        const packData  = packingItems[tripKey];
        const isLoading = packData === 'loading';
        const items     = (packData && packData !== 'loading') ? packData.items : [];
        const meta      = (tripMeta && tripMeta[tripKey] && tripMeta[tripKey] !== 'loading')
                          ? tripMeta[tripKey] : { context: '', notes: '' };

        const total   = items.length;
        const checked = items.filter(function(it) { return it.checked; }).length;
        const pct     = total > 0 ? Math.round((checked / total) * 100) : 0;

        const curPerson = (personTab[tripKey] || 'all');
        const filteredItems = curPerson === 'all'
          ? items
          : items.filter(function(it) { return it.person === curPerson; });

        // Group by person + category
        function buildSections(itemList) {
          const personOrder = ['ahmed', 'victoria', 'shared'];
          const sections    = {};
          itemList.forEach(function(it) {
            const p = it.person || 'shared';
            if (!sections[p]) sections[p] = {};
            if (!sections[p][it.category]) sections[p][it.category] = [];
            sections[p][it.category].push(it);
          });
          return curPerson === 'all'
            ? personOrder.filter(function(p) { return sections[p]; }).map(function(p) { return { person: p, cats: sections[p] }; })
            : (sections[curPerson] ? [{ person: curPerson, cats: sections[curPerson] }] : []);
        }
        const sections = buildSections(filteredItems);

        const PERSON_LABEL = { ahmed: '👤 Ahmed', victoria: '👤 Victoria', shared: '🤝 Shared' };

        const hasAiItems = items.some(function(it) { return it.source === 'ai'; });

        return (
          <div key={tripKey} style={{ marginBottom: 12, border: '1px solid #2a3a50',
                                      borderRadius: 10, overflow: 'hidden' }}>
            {/* Accordion header */}
            <div onClick={function() { toggleEntry(tripKey); }}
              style={{ display: 'flex', alignItems: 'center', gap: 12, padding: '12px 16px',
                       background: isOpen ? '#131e2e' : '#0d1117', cursor: 'pointer',
                       userSelect: 'none', transition: 'background .15s' }}>
              <div style={{ flex: 1 }}>
                <div style={{ fontWeight: 700, fontSize: 15, color: '#dde1f0' }}>{t.label}</div>
                <div style={{ fontSize: 12, color: '#6b7fa8', marginTop: 2 }}>{t.startDate} – {t.endDate}</div>
              </div>
              {meta.context && (
                <span style={{
                  fontSize: 11, fontWeight: 600,
                  color: CONTEXT_COLORS[meta.context] || '#5c9eff',
                  background: (CONTEXT_COLORS[meta.context] || '#5c9eff') + '22',
                  borderRadius: 10, padding: '2px 8px', whiteSpace: 'nowrap',
                }}>
                  {meta.context}
                </span>
              )}
              {total > 0 && (
                <span style={{ fontSize: 12, color: pct === 100 ? '#56cc9d' : '#6b7fa8', whiteSpace: 'nowrap' }}>
                  {checked}/{total} packed
                </span>
              )}
              <div style={{ fontSize: 16, color: '#8ab4f8',
                            transform: isOpen ? 'rotate(180deg)' : 'rotate(0deg)',
                            transition: 'transform .2s', lineHeight: 1 }}>▾</div>
            </div>

            {/* Accordion body */}
            {isOpen && (
              <div style={{ padding: '14px 16px', background: '#0d1117',
                            borderTop: '1px solid #2a3a50' }}>

                {/* Context editor */}
                <div style={{ display: 'flex', alignItems: 'center', gap: 8, marginBottom: 14 }}>
                  <span style={{ fontSize: 12, color: '#6b7fa8', flexShrink: 0 }}>Trip context:</span>
                  <TripContextBadge
                    context={meta.context}
                    onSetContext={function(ctx) { onSetTripMeta(tripKey, ctx, meta.notes || ''); }}
                    busy={busy}
                  />
                </div>

                {/* Progress bar */}
                {total > 0 && (
                  <div style={{ marginBottom: 14 }}>
                    <div style={{ height: 6, background: '#1a2435', borderRadius: 3, overflow: 'hidden', marginBottom: 5 }}>
                      <div style={{
                        height: '100%', width: pct + '%',
                        background: pct === 100 ? '#56cc9d' : '#5c9eff',
                        transition: 'width .3s ease', borderRadius: 3,
                      }} />
                    </div>
                    <div style={{ fontSize: 11, color: '#6b7fa8' }}>
                      {checked} of {total} items packed ({pct}%)
                    </div>
                  </div>
                )}

                {/* Person filter pills */}
                <div style={{ display: 'flex', gap: 6, marginBottom: 14, flexWrap: 'wrap' }}>
                  {['all', 'ahmed', 'victoria', 'shared'].map(function(p) {
                    const label = p === 'all' ? 'All' : p === 'ahmed' ? 'Ahmed' : p === 'victoria' ? 'Victoria' : 'Shared';
                    const active = curPerson === p;
                    return (
                      <button key={p}
                        onClick={function() { setPersonTab(function(prev) { return Object.assign({}, prev, { [tripKey]: p }); }); }}
                        style={{
                          padding: '4px 12px', borderRadius: 12, border: 'none', fontSize: 12,
                          fontWeight: active ? 700 : 400, cursor: 'pointer',
                          background: active ? '#1e3a5f' : '#131e2e',
                          color: active ? '#8ab4f8' : '#6b7fa8',
                        }}>
                        {label}
                      </button>
                    );
                  })}
                </div>

                {/* Generate button */}
                <button
                  disabled={busy || isLoading}
                  onClick={function() {
                    if (hasAiItems && !window.confirm('Regenerating will replace VERA\'s suggestions. Manually added items are kept. Continue?')) return;
                    onGeneratePacking(tripKey, t.startDate, t.endDate);
                  }}
                  style={{
                    padding: '7px 14px', borderRadius: 6, border: '1px solid #2a3a50',
                    background: '#0d1a2e', color: '#8ab4f8', fontWeight: 600,
                    cursor: busy || isLoading ? 'default' : 'pointer', fontSize: 13,
                    marginBottom: 16, opacity: busy || isLoading ? .5 : 1,
                  }}>
                  {isLoading ? '⏳ Generating…' : (hasAiItems ? '✨ Regenerate' : '✨ Generate with VERA')}
                </button>

                {/* Loading state */}
                {isLoading && (
                  <div style={{ color: '#6b7fa8', fontSize: 13, textAlign: 'center', padding: '12px 0' }}>
                    VERA is building your packing list…
                  </div>
                )}

                {/* Empty state */}
                {!isLoading && total === 0 && (
                  <div style={{ color: '#3a4a60', fontSize: 13, fontStyle: 'italic',
                                textAlign: 'center', padding: '12px 0' }}>
                    No items yet. Click Generate to build your packing list.
                  </div>
                )}

                {/* Item list — grouped by person section → category */}
                {!isLoading && sections.map(function(sec) {
                  const catNames = Object.keys(sec.cats).sort();
                  return (
                    <div key={sec.person} style={{ marginBottom: 16 }}>
                      {curPerson === 'all' && (
                        <div style={{ fontSize: 11, fontWeight: 700, color: '#4d6080',
                                      letterSpacing: .5, marginBottom: 8, paddingTop: 4,
                                      borderTop: '1px solid #1a2435' }}>
                          {PERSON_LABEL[sec.person] || sec.person.toUpperCase()}
                        </div>
                      )}
                      {catNames.map(function(cat) {
                        return (
                          <div key={cat} style={{ marginBottom: 10 }}>
                            <div style={{ fontSize: 11, color: '#5c7090', fontWeight: 600,
                                          marginBottom: 4, letterSpacing: .3 }}>
                              {PACK_CAT_ICON[cat] || '📦'} {cat}
                            </div>
                            {sec.cats[cat].map(function(it) {
                              return (
                                <div key={it.id} style={{
                                  display: 'flex', alignItems: 'center', gap: 8,
                                  padding: '4px 0', borderBottom: '1px solid #111a28',
                                }}>
                                  <input type="checkbox" checked={it.checked}
                                    onChange={function() { onToggleItem(it.id, tripKey, it.checked); }}
                                    style={{ cursor: 'pointer', accentColor: '#5c9eff', flexShrink: 0 }}
                                  />
                                  <span style={{
                                    flex: 1, fontSize: 13,
                                    color: it.checked ? '#4d6080' : '#dde1f0',
                                    textDecoration: it.checked ? 'line-through' : 'none',
                                  }}>
                                    {it.item}
                                    {it.source === 'manual' && (
                                      <span style={{ fontSize: 10, color: '#3a5070',
                                                     marginLeft: 6, fontStyle: 'italic' }}>manual</span>
                                    )}
                                  </span>
                                  <button onClick={function() { onDeleteItem(it.id, tripKey); }}
                                    style={{ background: 'none', border: 'none', color: '#3a4a60',
                                             cursor: 'pointer', fontSize: 14, padding: '0 4px',
                                             lineHeight: 1 }}>
                                    🗑
                                  </button>
                                </div>
                              );
                            })}
                          </div>
                        );
                      })}
                    </div>
                  );
                })}

                {/* Add item form */}
                {addForm && addForm.tripKey === tripKey ? (
                  <div style={{ display: 'flex', gap: 6, flexWrap: 'wrap', marginTop: 10,
                                padding: '10px 12px', background: '#0a1220',
                                borderRadius: 8, border: '1px solid #2a3a50' }}>
                    <select value={addForm.person}
                      onChange={function(ev) { setAddForm(function(prev) { return Object.assign({}, prev, { person: ev.target.value }); }); }}
                      style={{ padding: '5px 8px', borderRadius: 6, border: '1px solid #2a3a50',
                               background: '#131e2e', color: '#dde1f0', fontSize: 12 }}>
                      <option value="ahmed">Ahmed</option>
                      <option value="victoria">Victoria</option>
                      <option value="shared">Shared</option>
                    </select>
                    <input type="text" placeholder="Category" value={addForm.category}
                      list={'pack-cats-' + tripKey}
                      onChange={function(ev) { setAddForm(function(prev) { return Object.assign({}, prev, { category: ev.target.value }); }); }}
                      style={{ width: 120, padding: '5px 8px', borderRadius: 6, border: '1px solid #2a3a50',
                               background: '#131e2e', color: '#dde1f0', fontSize: 12 }}
                    />
                    <datalist id={'pack-cats-' + tripKey}>
                      {Object.keys(PACK_CAT_ICON).map(function(c) { return <option key={c} value={c} />; })}
                    </datalist>
                    <input type="text" placeholder="Item name" value={addForm.item}
                      onChange={function(ev) { setAddForm(function(prev) { return Object.assign({}, prev, { item: ev.target.value }); }); }}
                      onKeyDown={function(ev) {
                        if (ev.key === 'Enter' && addForm.item.trim() && addForm.category.trim()) {
                          onAddItem(tripKey, addForm.person, addForm.category.trim(), addForm.item.trim());
                          setAddForm(null);
                        }
                        if (ev.key === 'Escape') setAddForm(null);
                      }}
                      style={{ flex: 1, minWidth: 120, padding: '5px 8px', borderRadius: 6,
                               border: '1px solid #2a3a50', background: '#131e2e',
                               color: '#dde1f0', fontSize: 12 }}
                    />
                    <button
                      disabled={busy || !addForm.item.trim() || !addForm.category.trim()}
                      onClick={function() {
                        if (!addForm.item.trim() || !addForm.category.trim()) return;
                        onAddItem(tripKey, addForm.person, addForm.category.trim(), addForm.item.trim());
                        setAddForm(null);
                      }}
                      style={{ padding: '5px 12px', borderRadius: 6, border: 'none',
                               background: '#5c9eff', color: '#0d1117', fontWeight: 700,
                               cursor: 'pointer', fontSize: 13 }}>
                      + Add
                    </button>
                    <button onClick={function() { setAddForm(null); }}
                      style={{ padding: '5px 10px', borderRadius: 6, border: '1px solid #2a3a50',
                               background: 'none', color: '#6b7fa8', cursor: 'pointer', fontSize: 12 }}>
                      Cancel
                    </button>
                  </div>
                ) : (
                  <button
                    onClick={function() {
                      setAddForm({ tripKey, person: curPerson === 'all' ? 'ahmed' : curPerson, category: '', item: '' });
                    }}
                    style={{ marginTop: 8, padding: '5px 12px', borderRadius: 6,
                             border: '1px dashed #2a3a50', background: 'transparent',
                             color: '#6b7fa8', cursor: 'pointer', fontSize: 12 }}>
                    ➕ Add item
                  </button>
                )}
              </div>
            )}
          </div>
        );
      })}
    </div>
  );
}

// ---- Recommendations Panel (Issue #73) ---------------------------------------

function RecommendationsPanel({ trips, recommendations, busy, onLoadRecs, onGenerateRecs, onAcceptRec, onDismissRec, onGoToItinerary }) {
  const [expanded,      setExpanded]      = React.useState({});
  const [showDismissed, setShowDismissed] = React.useState({});
  const [filter,        setFilter]        = React.useState({}); // { [tripKey]: 'all'|'dining'|'activities'|'added' }

  const DINING_TYPES    = { dining: 1, reservation: 1, coffee: 1, nightlife: 1, winery: 1 };
  const ACTIVITY_TYPES  = { city_tour: 1, museum: 1, beach: 1, mountain: 1, camera: 1, show: 1,
                             spa: 1, skiing: 1, snorkeling: 1, theme_park: 1, shopping: 1, market: 1 };

  function getFilter(tripKey)     { return filter[tripKey] || 'all'; }
  function setTripFilter(tk, val) { setFilter(function(p) { return Object.assign({}, p, { [tk]: val }); }); }

  return (
    <div>
      {trips.length === 0 && (
        <div className="empty-state">
          <div style={{ fontSize: 36, marginBottom: 12 }}>✨</div>
          <div>No upcoming trips found.</div>
        </div>
      )}
      {trips.map(function(t) {
        const tripKey  = t.startDate + '|' + t.label;
        const recData  = recommendations[tripKey];
        const isLoading = recData === 'loading';
        const recs      = (recData && recData !== 'loading') ? recData : [];
        const isOpen    = !!expanded[tripKey];
        const hasAiRecs = recs.some(function(r) { return r.source === 'ai'; });

        // Filter recs for display
        const curFilter  = getFilter(tripKey);
        const visibleRecs = recs.filter(function(r) {
          if (r.status === 'dismissed' && !showDismissed[tripKey]) return false;
          if (curFilter === 'dining')     return !!DINING_TYPES[r.type];
          if (curFilter === 'activities') return !!ACTIVITY_TYPES[r.type];
          if (curFilter === 'added')      return r.status === 'added';
          return true; // 'all'
        });
        const pendingCount   = recs.filter(function(r) { return r.status === 'pending'; }).length;
        const dismissedCount = recs.filter(function(r) { return r.status === 'dismissed'; }).length;

        return (
          <div key={tripKey} style={{ marginBottom: 12, background: '#0e1e35', border: '1px solid #1e3a5f', borderRadius: 10 }}>
            {/* Accordion header */}
            <div
              style={{ padding: '12px 16px', cursor: 'pointer', display: 'flex', alignItems: 'center', gap: 10 }}
              onClick={function() {
                setExpanded(function(p) { return Object.assign({}, p, { [tripKey]: !p[tripKey] }); });
                if (!recData && !isLoading) onLoadRecs(tripKey);
              }}
            >
              <span style={{ fontSize: 18 }}>✨</span>
              <div style={{ flex: 1 }}>
                <div style={{ fontWeight: 700, color: '#dde1f0', fontSize: 15 }}>{t.label}</div>
                <div style={{ fontSize: 12, color: '#6b7fa8' }}>{t.startDate} – {t.endDate}</div>
              </div>
              {pendingCount > 0 && (
                <span style={{ background: '#1a3a6e', color: '#8ab4f8', fontSize: 11, fontWeight: 700,
                               padding: '2px 8px', borderRadius: 10 }}>
                  {pendingCount} pick{pendingCount !== 1 ? 's' : ''}
                </span>
              )}
              <span style={{ color: '#4d6080', fontSize: 12 }}>{isOpen ? '▲' : '▼'}</span>
            </div>

            {/* Accordion body */}
            {isOpen && (
              <div style={{ padding: '0 16px 16px' }}>
                {/* Generate button */}
                <div style={{ marginBottom: 14, display: 'flex', alignItems: 'center', gap: 10 }}>
                  <button
                    disabled={busy || isLoading}
                    onClick={function() { onGenerateRecs(tripKey, t.startDate, t.endDate); }}
                    style={{ background: '#1a3a6e', color: '#8ab4f8', border: '1px solid #2a4a7e',
                             borderRadius: 8, padding: '7px 14px', fontSize: 13, cursor: 'pointer', fontWeight: 600 }}
                  >
                    {isLoading ? '⏳ Generating…' : (hasAiRecs ? '✨ Regenerate' : '✨ Get VERA\'s Picks')}
                  </button>
                  {recs.length > 0 && (
                    <span style={{ fontSize: 12, color: '#6b7fa8' }}>
                      {recs.filter(function(r) { return r.status === 'added'; }).length} added ·{' '}
                      {recs.filter(function(r) { return r.status === 'pending'; }).length} pending
                    </span>
                  )}
                </div>

                {/* Filter pills */}
                {recs.length > 0 && (
                  <div style={{ display: 'flex', gap: 6, flexWrap: 'wrap', marginBottom: 12 }}>
                    {['all', 'dining', 'activities', 'added'].map(function(f) {
                      return (
                        <button key={f} onClick={function() { setTripFilter(tripKey, f); }}
                          style={{ background: curFilter === f ? '#1a3a6e' : 'transparent',
                                   color: curFilter === f ? '#8ab4f8' : '#4d6080',
                                   border: '1px solid ' + (curFilter === f ? '#2a4a7e' : '#1e3a5f'),
                                   borderRadius: 20, padding: '3px 10px', fontSize: 11,
                                   cursor: 'pointer', textTransform: 'capitalize' }}>
                          {f === 'all' ? 'All' : f === 'dining' ? '🍽 Dining' : f === 'activities' ? '🏛 Activities' : '✅ Added'}
                        </button>
                      );
                    })}
                  </div>
                )}

                {/* Rec cards */}
                {isLoading && <div style={{ color: '#4d6080', fontSize: 13, padding: '8px 0' }}>Searching for the best picks…</div>}

                {!isLoading && recs.length === 0 && (
                  <div style={{ color: '#4d6080', fontSize: 13, padding: '8px 0' }}>
                    Click "Get VERA's Picks" to generate personalized recommendations for this trip.
                  </div>
                )}

                {!isLoading && visibleRecs.map(function(rec) {
                  const isDismissed = rec.status === 'dismissed';
                  const isAdded     = rec.status === 'added';
                  return (
                    <div key={rec.id} style={{
                      background: isDismissed ? '#080f1a' : isAdded ? '#0a1a14' : '#0a1a2e',
                      border: '1px solid ' + (isDismissed ? '#111a2a' : isAdded ? '#1a4a2e' : '#1e3a5f'),
                      borderRadius: 8, padding: '11px 14px', marginBottom: 10,
                      opacity: isDismissed ? 0.5 : 1,
                    }}>
                      {/* Card header: icon + date + type + price + actions */}
                      <div style={{ display: 'flex', alignItems: 'flex-start', gap: 8, marginBottom: 6 }}>
                        <span style={{ fontSize: 16, flexShrink: 0 }}>{ITIN_TYPE_ICON[rec.type] || '📝'}</span>
                        <div style={{ flex: 1 }}>
                          <div style={{ fontWeight: 700, color: isDismissed ? '#4d6080' : isAdded ? '#4caf50' : '#dde1f0',
                                        fontSize: 14, lineHeight: '1.2' }}>
                            {isAdded && '✅ '}{rec.title}
                          </div>
                          <div style={{ fontSize: 11, color: '#4d6080', marginTop: 2 }}>
                            {rec.date && formatAgendaDate && formatAgendaDate(rec.date) + ' · '}
                            {rec.type && rec.type.replace(/_/g, ' ').replace(/\b\w/g, function(c) { return c.toUpperCase(); })}
                            {rec.priceRange && ' · ' + rec.priceRange}
                          </div>
                        </div>
                        {/* Action buttons */}
                        {!isAdded && !isDismissed && (
                          <div style={{ display: 'flex', gap: 5, flexShrink: 0 }}>
                            <button
                              disabled={busy}
                              onClick={function() { onAcceptRec(rec.id, tripKey); }}
                              title="Add to Itinerary"
                              style={{ background: '#0a3a1a', color: '#4caf50', border: '1px solid #1a5a2e',
                                       borderRadius: 6, padding: '4px 9px', fontSize: 12, cursor: 'pointer', fontWeight: 600 }}
                            >+ Add</button>
                            <button
                              disabled={busy}
                              onClick={function() { onDismissRec(rec.id); }}
                              title="Dismiss"
                              style={{ background: 'transparent', color: '#4d6080', border: '1px solid #1e3a5f',
                                       borderRadius: 6, padding: '4px 8px', fontSize: 12, cursor: 'pointer' }}
                            >✕</button>
                          </div>
                        )}
                        {isAdded && (
                          <button
                            onClick={function() { onGoToItinerary(tripKey); }}
                            style={{ background: 'transparent', color: '#4caf50', border: '1px solid #1a5a2e',
                                     borderRadius: 6, padding: '4px 9px', fontSize: 11, cursor: 'pointer' }}
                          >View →</button>
                        )}
                      </div>

                      {/* Description */}
                      {rec.description && (
                        <div style={{ fontSize: 13, color: '#9ab4d8', marginBottom: 5, lineHeight: '1.4' }}>
                          {rec.description}
                        </div>
                      )}

                      {/* Rationale */}
                      {rec.rationale && (
                        <div style={{ fontSize: 11, color: '#5c7a9a', fontStyle: 'italic', marginBottom: 5 }}>
                          💡 {rec.rationale}
                        </div>
                      )}

                      {/* Link */}
                      {rec.link && !isDismissed && (
                        <a href={rec.link} target="_blank" rel="noopener noreferrer"
                           style={{ fontSize: 11, color: '#5c9eff', textDecoration: 'none' }}>
                          🔗 {rec.link.replace(/^https?:\/\/(www\.)?/, '').split('/')[0]}
                        </a>
                      )}
                    </div>
                  );
                })}

                {/* Show dismissed toggle */}
                {!isLoading && dismissedCount > 0 && (
                  <button
                    onClick={function() { setShowDismissed(function(p) { return Object.assign({}, p, { [tripKey]: !p[tripKey] }); }); }}
                    style={{ background: 'transparent', color: '#4d6080', border: 'none', fontSize: 11,
                             cursor: 'pointer', padding: '4px 0' }}
                  >
                    {showDismissed[tripKey] ? '▲ Hide dismissed' : '▼ Show ' + dismissedCount + ' dismissed'}
                  </button>
                )}
              </div>
            )}
          </div>
        );
      })}
    </div>
  );
}
