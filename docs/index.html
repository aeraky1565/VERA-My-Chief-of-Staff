function FinancialGoalsTab({ goals, goalsLoading, busy, onLoad, onAdd, onUpdate, onDelete, apiUrl, apiToken }) {
  const [modal,      setModal]      = React.useState(null); // null | 'add' | goal-obj
  const [simGoal,    setSimGoal]    = React.useState(null); // goal being simulated
  const [projections,setProjections]= React.useState({});

  // Compute projections client-side for display
  React.useEffect(function() {
    if (!goals || goals.length === 0) return;
    var now = new Date();
    var projs = {};
    goals.forEach(function(g) {
      var remaining = g.targetAmount - g.currentAmount;
      if (remaining <= 0) { projs[g.id] = { achieved: true }; return; }
      if (!g.monthlyContribution) { projs[g.id] = { noContribution: true }; return; }
      var r = (g.apy || 0) / 100 / 12;
      var months;
      if (r > 0) {
        var lo = 0, hi = 1200, mid = 0;
        for (var iter = 0; iter < 80; iter++) {
          mid = (lo + hi) / 2;
          var fv = g.currentAmount * Math.pow(1+r,mid) + g.monthlyContribution*(Math.pow(1+r,mid)-1)/r;
          if (fv < g.targetAmount) lo = mid; else hi = mid;
        }
        months = mid;
      } else {
        months = remaining / g.monthlyContribution;
      }
      var projDate = new Date(now.getTime() + months * 30.4375 * 86400000);
      var targetDate = g.targetDate ? new Date(g.targetDate + 'T12:00:00') : null;
      var daysEarlyOrLate = targetDate ? Math.ceil((targetDate - projDate) / 86400000) : null;
      projs[g.id] = {
        projectedDate:   projDate.toISOString().slice(0,10),
        monthsRemaining: Math.round(months * 10) / 10,
        onTrack:         targetDate ? projDate <= targetDate : true,
        daysEarlyOrLate: daysEarlyOrLate
      };
    });
    setProjections(projs);
  }, [goals]);

  React.useEffect(function() { if (goals === null && onLoad) onLoad(); }, []);

  if (goalsLoading || goals === null) return <div className="loading-text">Loading financial goals…</div>;

  var active    = (goals||[]).filter(function(g) { return g.status === 'Active'; });
  var achieved  = (goals||[]).filter(function(g) { return g.status === 'Achieved'; });
  var other     = (goals||[]).filter(function(g) { return g.status !== 'Active' && g.status !== 'Achieved'; });

  var totalTarget  = active.reduce(function(s,g) { return s + g.targetAmount; }, 0);
  var totalCurrent = active.reduce(function(s,g) { return s + g.currentAmount; }, 0);
  var totalMonthly = active.reduce(function(s,g) { return s + (g.monthlyContribution||0); }, 0);

  return (
    <div>
      {/* Summary row */}
      {active.length > 0 && (
        <div style={{ display:'grid', gridTemplateColumns:'repeat(3,1fr)', gap:10, marginBottom:20 }}>
          {[
            { label:'Active Goals', value: active.length },
            { label:'Total Saved', value: fmtMoney(totalCurrent) + ' / ' + fmtMoney(totalTarget) },
            { label:'Monthly Committed', value: fmtMoney(totalMonthly) + '/mo' },
          ].map(function(s) {
            return (
              <div key={s.label} style={{ background:'#141826', border:'1px solid #2a3050', borderRadius:10, padding:'12px 16px' }}>
                <div style={{ fontSize:10, color:'#5c7080', textTransform:'uppercase', letterSpacing:'0.05em', marginBottom:4 }}>{s.label}</div>
                <div style={{ fontSize:15, fontWeight:700, color:'#dde1f0' }}>{s.value}</div>
              </div>
            );
          })}
        </div>
      )}

      {/* Add button */}
      <div style={{ display:'flex', justifyContent:'space-between', alignItems:'center', marginBottom:16 }}>
        <div style={{ fontSize:16, fontWeight:700, color:'#dde1f0' }}>🎯 Financial Goals</div>
        <button className="btn-primary" onClick={() => setModal('add')}>+ Add Goal</button>
      </div>

      {goals.length === 0 && (
        <div className="empty-state">
          <div style={{ fontSize:36, marginBottom:10 }}>🎯</div>
          <div>No financial goals yet.</div>
          <div style={{ fontSize:12, color:'#4d6080', marginTop:6 }}>
            Add goals like House Down Payment or Travel Fund, then simulate what-if scenarios.
          </div>
          <button className="btn-primary" style={{ marginTop:14 }}
            onClick={() => apiGet(apiUrl, apiToken, { action:'seed_financial_goals' }).then(onLoad)}>
            Seed from Life Plan Doc
          </button>
        </div>
      )}

      {active.map(function(g) {
        return <GoalCard key={g.id} goal={g} projection={projections[g.id]}
          onEdit={setModal} onDelete={onDelete} onSimulate={setSimGoal} busy={busy} />;
      })}

      {achieved.length > 0 && (
        <div style={{ marginTop:8 }}>
          <div style={{ fontSize:12, color:'#4ade80', fontWeight:700, marginBottom:8, textTransform:'uppercase', letterSpacing:'0.05em' }}>✓ Achieved</div>
          {achieved.map(function(g) {
            return <GoalCard key={g.id} goal={g} projection={projections[g.id]}
              onEdit={setModal} onDelete={onDelete} onSimulate={setSimGoal} busy={busy} />;
          })}
        </div>
      )}

      {other.map(function(g) {
        return <GoalCard key={g.id} goal={g} projection={projections[g.id]}
          onEdit={setModal} onDelete={onDelete} onSimulate={setSimGoal} busy={busy} />;
      })}

      {/* Goal form modal */}
      {modal && (
        <GoalFormModal
          goal={modal === 'add' ? null : modal}
          busy={busy}
          onClose={() => setModal(null)}
          onSave={async function(form) {
            if (modal === 'add') await onAdd(form);
            else await onUpdate(modal.id, form);
            setModal(null);
          }}
        />
      )}

      {/* Simulator modal */}
      {simGoal && (
        <ScenarioSimulatorModal
          goal={simGoal}
          apiUrl={apiUrl}
          apiToken={apiToken}
          busy={busy}
          onClose={() => setSimGoal(null)}
        />
      )}
    </div>
  );
}

              fontSize: 13, padding: '6px 0', cursor: 'pointer',
              borderBottom: i < checkedItems.length - 1 ? '1px solid #1a2a50' : 'none',

        </div>

}

// ---- Purchase History Tab (Issue #111) --------------------------------------

function PurchaseHistoryTab({ items }) {
  const [filter, setFilter] = React.useState('');
  const filtered = (items || []).filter(item =>
    !filter || item.normalized.toLowerCase().includes(filter.toLowerCase())
  );
  const confColor = { default: '#5f6a8a', learning: '#c9a84c', building: '#e8a020', calibrated: '#43a047' };

  function relDate(ds) {
    if (!ds) return '—';
    const diff = Math.round((new Date() - new Date(ds + 'T00:00:00')) / 86400000);
    if (diff === 0) return 'Today';
    if (diff === 1) return 'Yesterday';
    if (diff < 30) return diff + 'd ago';
    if (diff < 365) return Math.round(diff / 30) + 'mo ago';
    return Math.round(diff / 365) + 'yr ago';
  }

  if (!items || items.length === 0) {
    return (
      <div className="empty-state" style={{ padding: 40 }}>
        <div style={{ fontSize: 32, marginBottom: 12 }}>📊</div>
        <div>No purchase history yet.</div>
        <div style={{ fontSize: 13, color: '#6b7fa8', marginTop: 8 }}>
          Log a shopping run or scan a receipt in Chat to get started.
        </div>
      </div>
    );
  }

  return (
    <div>
      <input
        placeholder="Search items…"
        value={filter} onChange={e => setFilter(e.target.value)}
        style={{
          width: '100%', boxSizing: 'border-box', background: '#0d1b3e',
          border: '1px solid #1e3060', borderRadius: 6, color: '#dde1f0',
          padding: '8px 12px', fontSize: 13, marginBottom: 16,
        }}
      />
      <div style={{ display: 'grid', gridTemplateColumns: 'repeat(auto-fill, minmax(200px, 1fr))', gap: 10 }}>
        {filtered.map((item, i) => (
          <div key={i} style={{
            background: '#0d1b3e', border: '1px solid #1e3060', borderRadius: 8, padding: '12px 14px',
          }}>
            <div style={{ fontSize: 14, fontWeight: 600, color: '#dde1f0', marginBottom: 6, textTransform: 'capitalize' }}>
              {item.normalized}
            </div>
            <div style={{ fontSize: 12, color: '#8a9abf', lineHeight: 1.6 }}>
              <div>Last: {relDate(item.lastDate)}{item.lastStore ? ' (' + item.lastStore + ')' : ''}</div>
              <div>Every ~{item.avgDays}d</div>
              {item.estimatedNext && <div style={{ color: '#c9a84c' }}>Next: {item.estimatedNext}</div>}
            </div>
            <div style={{
              marginTop: 8, display: 'inline-block', fontSize: 10, fontWeight: 700,
              color: confColor[item.confidence] || '#5f6a8a',
              background: (confColor[item.confidence] || '#5f6a8a') + '22',
              borderRadius: 20, padding: '2px 8px', textTransform: 'uppercase', letterSpacing: '0.5px',
            }}>
              {item.confidence}
            </div>
          </div>
        ))}
      </div>
    </div>
  );
}

// ---- Shopping tab -----------------------------------------------------------

function ShoppingTab({ stores, onToggle, onAddItem, onDelete, onEdit, busy, onLogRun }) {
  const [activeStore,   setActiveStore]   = React.useState(null);
  const [editingIndex,  setEditingIndex]  = React.useState(null); // { tabId, index } | null
  const [editText,      setEditText]      = React.useState('');
  const [logRunModal,   setLogRunModal]   = React.useState(false);

  React.useEffect(() => {
    if (stores.length > 0) {
      setActiveStore(prev =>
        stores.find(s => s.tabId === prev) ? prev : stores[0].tabId
      );
    } else {
      setActiveStore(null);
    }
  }, [stores]);

  if (!stores.length) {
    return (
      <div className="empty-state">
        <div style={{ fontSize: 32, marginBottom: 12 }}>🛒</div>
        <div>No shopping list connected.</div>
        <div style={{ fontSize: 13, color: '#6b7fa8', marginTop: 8 }}>
          Set <code style={{ background: '#13244d', padding: '1px 6px', borderRadius: 4 }}>SHOPPING_LIST_DOC_ID</code> in Script Properties to connect your Google Doc.
        </div>
      </div>
    );
  }

  const current      = stores.find(s => s.tabId === activeStore);
  const checkedItems = current ? current.items.filter(i => i.done).map(i => i.text) : [];

  return (
    <div>
      {/* Store sub-tabs */}
      <div style={{
        display: 'flex', gap: 2, flexWrap: 'wrap', alignItems: 'center',
        borderBottom: '1px solid #1e3060', marginBottom: 20,
      }}>
        {stores.map(s => {
          const pending  = s.items.filter(i => !i.done).length;
          const isActive = s.tabId === activeStore;
          return (
            <button
              key={s.tabId}
              onClick={() => setActiveStore(s.tabId)}
              style={{
                background: isActive ? '#0d1b3e' : 'none',
                border: 'none', cursor: 'pointer',
                padding: '9px 16px', fontSize: 13, fontWeight: 600,
                color: isActive ? '#c9a84c' : '#8a9abf',
                borderBottom: isActive ? '2px solid #c9a84c' : '2px solid transparent',
                marginBottom: -1, display: 'flex', alignItems: 'center', gap: 7,
                borderRadius: '4px 4px 0 0',
              }}
            >
              {s.storeName}
              <span style={{
                background: pending === 0 ? 'rgba(67,160,71,0.2)' : 'rgba(201,168,76,0.15)',
                color: pending === 0 ? '#43a047' : '#c9a84c',
                borderRadius: 20, padding: '1px 7px', fontSize: 11, fontWeight: 700,
              }}>
                {pending === 0 ? '✓' : pending}
              </span>
            </button>
          );
        })}
        {/* Action buttons */}
        <React.Fragment>
          {checkedItems.length > 0 && (
            <button
              style={{
                background: 'none', border: '1px solid #c9a84c', borderRadius: 6,
                color: '#c9a84c', fontSize: 12, fontWeight: 600,
                padding: '5px 12px', cursor: busy ? 'wait' : 'pointer',
                marginLeft: 4, marginBottom: 4, flexShrink: 0,
              }}
              disabled={busy}
              onClick={() => setLogRunModal(true)}
            >
              📦 Log Shopping Run ({checkedItems.length})
            </button>
          )}
          <button
            className="btn btn-primary"
            style={{ fontSize: 12, marginLeft: checkedItems.length > 0 ? 4 : 'auto', marginBottom: 4, flexShrink: 0 }}
            disabled={busy}
            onClick={() => onAddItem && onAddItem(activeStore)}
          >
            + Add Item
          </button>
        </React.Fragment>
      </div>

      {/* Item list */}
      {current && (
        current.items.length === 0
          ? <div className="empty-state" style={{ padding: 32 }}>This store has no items listed.</div>
          : <div style={{ display: 'flex', flexDirection: 'column', gap: 6 }}>
              {[...current.items].sort((a, b) => a.done - b.done).map((item, i) => {
                const isEditing  = editingIndex !== null &&
                                   editingIndex.tabId === current.tabId &&
                                   editingIndex.index === item.index;
                const isVERA     = item.text.startsWith('🤖');
                return (
                  <div key={i} style={{
                    display: 'flex', alignItems: 'center', gap: 12,
                    padding: '11px 16px', borderRadius: 8,
                    background: item.done ? 'rgba(67,160,71,0.05)' : '#0d1b3e',
                    border: '1px solid ' + (item.done ? 'rgba(67,160,71,0.15)' : '#1e3060'),
                    opacity: isVERA && !item.done ? 0.82 : 1,
                    transition: 'background 0.15s',
                  }}>
                    {/* Checkbox — disabled while editing */}
                    <input type="checkbox" checked={item.done} readOnly
                      onClick={e => { e.stopPropagation(); if (!busy && !isEditing) onToggle(current.tabId, item.index, item.done); }}
                      style={{ accentColor: '#43a047', width: 16, height: 16, flexShrink: 0, cursor: isEditing ? 'default' : 'pointer' }} />

                    {/* Inline edit mode */}
                    {isEditing ? (
                      <React.Fragment>
                        <input
                          autoFocus
                          value={editText}
                          onChange={e => setEditText(e.target.value)}
                          onKeyDown={e => {
                            if (e.key === 'Enter') { e.preventDefault(); if (editText.trim()) { onEdit(current.tabId, item.index, editText); setEditingIndex(null); } }
                            if (e.key === 'Escape') setEditingIndex(null);
                          }}
                          style={{ flex: 1, background: '#13244d', border: '1px solid #c9a84c', borderRadius: 4,
                                   color: '#e8eaed', padding: '4px 8px', fontSize: 14 }}
                        />
                        <button onClick={() => { if (editText.trim()) { onEdit(current.tabId, item.index, editText); setEditingIndex(null); } }}
                          disabled={!editText.trim()}
                          style={{ background: '#c9a84c', border: 'none', borderRadius: 4, color: '#0d1b3e',
                                   fontWeight: 700, fontSize: 12, padding: '4px 10px', cursor: editText.trim() ? 'pointer' : 'default' }}>
                          Save
                        </button>
                        <button onClick={() => setEditingIndex(null)}
                          style={{ background: 'none', border: '1px solid #2a3a60', borderRadius: 4,
                                   color: '#8a9abf', fontSize: 12, padding: '4px 10px', cursor: 'pointer' }}>
                          Cancel
                        </button>
                      </React.Fragment>
                    ) : (
                      <React.Fragment>
                        <span style={{ flex: 1, fontSize: 14, color: item.done ? '#4a5a7a' : '#dde1f0',
                                       textDecoration: item.done ? 'line-through' : 'none',
                                       cursor: busy ? 'wait' : 'pointer' }}
                              onClick={() => !busy && onToggle(current.tabId, item.index, item.done)}>
                          {item.text}
                        </span>
                        {/* VERA suggestion chip */}
                        {isVERA && !item.done && (
                          <span style={{
                            fontSize: 9, fontWeight: 700, color: '#c9a84c',
                            background: 'rgba(201,168,76,0.12)', border: '1px solid rgba(201,168,76,0.3)',
                            borderRadius: 20, padding: '1px 6px', flexShrink: 0, letterSpacing: '0.5px',
                          }}>VERA</span>
                        )}
                        {/* Edit button */}
                        <button title="Edit" onClick={e => { e.stopPropagation(); setEditingIndex({ tabId: current.tabId, index: item.index }); setEditText(item.text); }}
                          style={{ background: 'none', border: 'none', cursor: 'pointer', color: '#5f6a8a',
                                   fontSize: 13, padding: '0 4px', flexShrink: 0 }}>✎</button>
                        {/* Delete button */}
                        <button title="Delete" onClick={e => { e.stopPropagation(); onDelete && onDelete(current.tabId, item.index); }}
                          style={{ background: 'none', border: 'none', cursor: 'pointer', color: '#5f6a8a',
                                   fontSize: 13, padding: '0 4px', flexShrink: 0 }}>✕</button>
                      </React.Fragment>
                    )}
                  </div>
                );
              })}
            </div>
      )}

      {/* Log Run confirmation modal */}
      {logRunModal && current && (
        <LogRunModal
          store={current.storeName}
          checkedItems={checkedItems}
          busy={busy}
          onClose={() => setLogRunModal(false)}
          onConfirm={(selectedItems) => {
            setLogRunModal(false);
            onLogRun && onLogRun(current.tabId, selectedItems);
          }}
        />
      )}
    </div>
  );
}

// ---- Add shopping item modal ------------------------------------------------

function AddItemModal({ stores, onSave, onClose, busy, initialStore }) {
  const [selectedStore, setSelectedStore] = React.useState(initialStore || stores[0]?.tabId || '');
  const [text, setText] = React.useState('');

  function handleKey(e) {
    if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); if (text.trim() && selectedStore) onSave(selectedStore, text.trim()); }
    if (e.key === 'Escape') onClose();
  }

  return (
    <div className="modal-overlay" onClick={e => e.target === e.currentTarget && onClose()}>
      <div className="modal">
        <h2>+ Add Shopping Item</h2>
        <p>Choose a store and type the item to add.</p>

        <div className="form-group">
          <label className="form-label">Store</label>
          <div style={{ display: 'flex', gap: 8, flexWrap: 'wrap' }}>
            {stores.map(s => (
              <button
                key={s.tabId}
                onClick={() => setSelectedStore(s.tabId)}
                style={{
                  padding: '6px 14px', borderRadius: 6, fontSize: 13, fontWeight: 600,
                  cursor: 'pointer', border: 'none',
                  background: selectedStore === s.tabId ? '#c9a84c' : '#13244d',
                  color: selectedStore === s.tabId ? '#0d1b3e' : '#8a9abf',
                }}
              >
                {s.storeName}
              </button>
            ))}
          </div>
        </div>

        <div className="form-group">
          <label className="form-label">Item</label>
          <input
            className="form-input"
            value={text}
            onChange={e => setText(e.target.value)}
            onKeyDown={handleKey}
            placeholder="Item name…"
            autoFocus
          />
        </div>

        <div className="modal-actions">
          <button className="btn btn-ghost" onClick={onClose}>Cancel</button>
          <button
            className="btn btn-primary"
            onClick={() => text.trim() && selectedStore && onSave(selectedStore, text.trim())}
            disabled={busy || !text.trim() || !selectedStore}
          >
            Add Item
          </button>
        </div>
      </div>
    </div>
  );
}

// ---- Yearly Goals Kanban tab ------------------------------------------------

const GOAL_STATUSES = ['Resolutions', 'To Do', 'Doing', 'Parked', 'Done'];
const GOAL_COL_COLORS = {
  'Resolutions': '#7c5cbf',
  'To Do':       '#1565c0',
  'Doing':       '#c9a84c',
  'Parked':      '#4d6080',
  'Done':        '#43a047',
};

function GoalsTab({ goals, dragGoalId, dragOverCol, onDragStart, onDragOver, onDrop, onAddGoal, onEditGoal, onDeleteGoal, busy }) {
  return (
    <div>
      <div style={{ marginBottom: 14, color: '#8ab4f8', fontSize: 13 }}>
        Drag goal cards between columns to update their status.
      </div>
      <div className="kanban-board">
        {GOAL_STATUSES.map(col => {
          const colGoals = goals.filter(g => g.status === col);
          const isOver   = dragOverCol === col;
          return (
            <div
              key={col}
              className={`kanban-col${isOver ? ' drag-over' : ''}`}
              onDragOver={e => { e.preventDefault(); onDragOver(col); }}
              onDrop={e => { e.preventDefault(); onDrop(col); }}
              onDragLeave={() => { if (dragOverCol === col) onDragOver(null); }}
            >
              <div className="kanban-col-header">
                <span className="kanban-col-title" style={{ color: GOAL_COL_COLORS[col] }}>{col}</span>
                <span className="kanban-col-count">{colGoals.length}</span>
              </div>

              {colGoals.map(goal => (
                <div
                  key={goal.id}
                  className={`goal-card${dragGoalId === goal.id ? ' dragging' : ''}`}
                  draggable
                  onDragStart={() => onDragStart(goal.id)}
                  onDragEnd={() => { onDragStart(null); onDragOver(null); }}
                >
                  <div className="goal-card-title">{goal.title}</div>
                  <div className="goal-card-meta">
                    {goal.category && <span className="goal-cat-pill">{goal.category}</span>}
                    <span className="goal-year-badge">{goal.year}</span>
                  </div>
                  {goal.progress > 0 && (
                    <div className="goal-progress-bar">
                      <div className="goal-progress-fill" style={{ width: goal.progress + '%' }} />
                    </div>
                  )}
                  <div className="goal-card-actions">
                    <button className="btn-edit" title="Edit" disabled={busy} onClick={() => onEditGoal(goal)}>✏️</button>
                    <button className="btn-edit" title="Delete" disabled={busy} onClick={() => onDeleteGoal(goal.id)} style={{ color: '#e53935' }}>🗑</button>
                  </div>
                </div>
              ))}

              <button className="kanban-add-btn" onClick={() => onAddGoal(col)}>+ Add goal</button>
            </div>
          );
        })}
      </div>
    </div>
  );
}

function GoalModal({ mode, goal, defaultStatus, onSave, onClose, busy }) {

        <h2>{mode === 'edit' ? 'Edit Goal' : 'Add Goal'}</h2>
        <label className="form-label">Title *</label>
        <input className="form-input" value={title} onChange={e => setTitle(e.target.value)} placeholder="Goal title" autoFocus />

        <label className="form-label">Description</label>
        <textarea className="form-input" rows={2} value={description} onChange={e => setDescription(e.target.value)} placeholder="Optional detail" style={{ resize: 'vertical' }} />

        <select className="form-input" value={status} onChange={e => setStatus(e.target.value)}>

            <label className="form-label">Year</label>
            <input className="form-input" type="number" value={year} onChange={e => setYear(e.target.value)} />

        {mode === 'edit' && (
          <>
            <label className="form-label">Progress ({progress}%)</label>

        <textarea className="form-input" rows={2} value={notes} onChange={e => setNotes(e.target.value)} placeholder="Optional notes" style={{ resize: 'vertical' }} />

          <button className="btn" onClick={onClose}>Cancel</button>

            onClick={() => onSave({ title, description, status, category, year, progress, notes })}>
            {mode === 'edit' ? 'Save Changes' : 'Add Goal'}
          </button>
        </div>
      </div>
    </div>
  );
}

const PRIORITY_COLORS = { High: '#e53935', Medium: '#f9a825', Low: '#43a047' };

function ProjectsTab({ projects, onCompleteTask, onAddTask, onEditTask, onDeleteTask, busy }) {
  const [activeProject, setActiveProject] = React.useState(null);

  // Auto-select first project when list loads or changes
  React.useEffect(() => {
    if (projects.length > 0) {
      setActiveProject(prev =>
        projects.find(p => p.projectId === prev) ? prev : projects[0].projectId
      );
    } else {
      setActiveProject(null);
    }
  }, [projects]);

  if (!projects.length) {
    return (
      <div className="empty-state">
        <div style={{ fontSize: 32, marginBottom: 12 }}>🏗️</div>
        <div>No projects yet — ask VERA in the Chat tab to create one.</div>
        <div style={{ fontSize: 13, color: '#6b7fa8', marginTop: 8 }}>
          Try: "Create a project for planning our Europe trip"
        </div>
      </div>
    );
  }

  const current = projects.find(p => p.projectId === activeProject);

  return (
    <div>
      {/* Project sub-tabs */}
      <div style={{
        display: 'flex', gap: 2, flexWrap: 'wrap',
        borderBottom: '1px solid #1e3060', marginBottom: 20,
      }}>
        {projects.map(p => {
          const pending  = p.tasks.filter(t => t.status !== 'Done').length;
          const isActive = p.projectId === activeProject;
          return (
            <button
              key={p.projectId}
              onClick={() => setActiveProject(p.projectId)}
              style={{
                background: isActive ? '#0d1b3e' : 'none',
                border: 'none', cursor: 'pointer',
                padding: '9px 16px', fontSize: 13, fontWeight: 600,
                color: isActive ? '#c9a84c' : '#8a9abf',
                borderBottom: isActive ? '2px solid #c9a84c' : '2px solid transparent',
                marginBottom: -1, display: 'flex', alignItems: 'center', gap: 7,
                borderRadius: '4px 4px 0 0',
              }}
            >
              {p.projectName}
              <span style={{
                background: pending === 0 ? 'rgba(67,160,71,0.2)' : 'rgba(201,168,76,0.15)',
                color: pending === 0 ? '#43a047' : '#c9a84c',
                borderRadius: 20, padding: '1px 7px', fontSize: 11, fontWeight: 700,
              }}>
                {pending === 0 ? '✓' : pending}
              </span>
            </button>
          );
        })}
      </div>

      {/* Selected project task list */}
      {current && (
        <div>
          {/* Toolbar: task count + Add Task button */}
          <div style={{ display: 'flex', alignItems: 'center', justifyContent: 'space-between', marginBottom: 12 }}>
            <span style={{ fontSize: 12, color: '#6b7fa8' }}>
              {current.tasks.filter(t => t.status !== 'Done').length} pending · {current.tasks.length} total
            </span>
            <button
              className="btn btn-primary"
              style={{ fontSize: 12 }}
              disabled={busy}
              onClick={() => onAddTask && onAddTask(current)}
            >
              + Add Task
            </button>
          </div>

          <div style={{ display: 'flex', flexDirection: 'column', gap: 6 }}>
            {current.tasks.map((t, i) => {
              const done = t.status === 'Done';
              return (
                <div key={i} style={{
                  display: 'flex', alignItems: 'center', gap: 12,
                  padding: '10px 14px', borderRadius: 8,
                  background: done ? 'rgba(67,160,71,0.05)' : '#0d1b3e',
                  border: '1px solid ' + (done ? 'rgba(67,160,71,0.15)' : '#1e3060'),
                }}>
                  <input
                    type="checkbox"
                    checked={done}
                    disabled={done || busy}
                    onChange={() => !done && onCompleteTask(t.rowNum)}
                    style={{ accentColor: '#43a047', width: 16, height: 16, cursor: done ? 'default' : 'pointer', flexShrink: 0 }}
                  />
                  <span style={{
                    flex: 1, fontSize: 14,
                    color: done ? '#4a5a7a' : '#dde1f0',
                    textDecoration: done ? 'line-through' : 'none',
                  }}>
                    {t.task}
                  </span>
                  {t.priority && !done && (
                    <span style={{
                      fontSize: 11, fontWeight: 700,
                      color: PRIORITY_COLORS[t.priority] || '#8a9abf',
                    }}>
                      {t.priority}
                    </span>
                  )}
                  {t.dueDate && !done && (
                    <span style={{ fontSize: 11, color: '#6b7fa8' }}>{t.dueDate}</span>
                  )}
                  {!done && (
                    <>
                      <button
                        className="btn-edit"
                        disabled={busy}
                        onClick={() => onEditTask && onEditTask(t)}
                        title="Edit task"
                        style={{ fontSize: 13 }}
                      >
                        ✏️
                      </button>
                      <button
                        className="btn-edit"
                        disabled={busy}
                        onClick={() => onDeleteTask && onDeleteTask(t.rowNum)}
                        title="Delete task"
                        style={{ fontSize: 13, opacity: 0.7 }}
                      >
                        🗑️
                      </button>
                    </>
                  )}
                </div>
              );
            })}
          </div>

          {/* Progress bar */}
          {(() => {
            const total = current.tasks.length;
            const done  = current.tasks.filter(t => t.status === 'Done').length;
            const pct   = total > 0 ? Math.round((done / total) * 100) : 0;
            return (
              <div style={{ marginTop: 20 }}>
                <div style={{ display: 'flex', justifyContent: 'space-between', fontSize: 12, color: '#6b7fa8', marginBottom: 6 }}>
                  <span>{done} of {total} tasks complete</span>
                  <span>{pct}%</span>
                </div>
                <div style={{ height: 4, background: '#1e3060', borderRadius: 2 }}>
                  <div style={{ height: '100%', width: pct + '%', background: pct === 100 ? '#43a047' : '#c9a84c', borderRadius: 2, transition: 'width 0.3s' }} />
                </div>
              </div>
            );
          })()}
        </div>
      )}
    </div>
  );
}

// ---- PTOPersonView (single person's PTO content) ----------------------------

function PTOPersonView({ stats, onTriggerBuffer, busy }) {
  if (!stats) {
    return (
      <div className="empty-state">
        <div style={{ fontSize: 36, marginBottom: 12 }}>🌴</div>
        <div>No PTO data loaded yet.</div>
        <div style={{ fontSize: 13, color: '#6b7fa8', marginTop: 8 }}>
          Make sure the PTO config rows are seeded in the Config tab, then refresh.
        </div>
      </div>
    );
  }

  const { used, planned, remaining, config: cfg, burnDown: bd, threeToOneStatus: tto,
          bufferStatus, nextPTO, events, holidays, clearWindows, milestones, upcomingTravel, year } = stats;

  const vacTotal     = (cfg.vacationDays  || 20) + (cfg.rolloverDays || 0);
  const persTotal    = cfg.personalHours  || 48;
  const persUsed     = used.personalHours    || 0;
  const persPlanned  = planned.personalHours || 0;
  const persRemain   = remaining.personalHours ?? (persTotal - persUsed - persPlanned);

  function hrsLabel(hrs) {
    if (!hrs) return '0 hrs';
    const d = hrs / 8;
    const days = Number.isInteger(d) ? d + ' day' + (d !== 1 ? 's' : '') : d.toFixed(1) + ' days';
    return hrs + ' hrs (' + days + ')';
  }

  const paceColor = (bd?.paceStatus === 'ahead') ? '#43a047'
                  : (bd?.paceStatus === 'behind') ? '#e53935' : '#f9a825';

  function pctBar(val, max, color) {
    const pct = max > 0 ? Math.min(100, (val / max) * 100) : 0;
    return (
      <div className="pto-bar-track">
        <div className="pto-bar-fill" style={{ width: pct + '%', background: color }} />
      </div>
    );
  }

  function DotRow({ label, target, usedN, plannedN, hint }) {
    const dots = Array.from({ length: target }).map((_, i) => {
      let bg = 'transparent', border;
      if (i < usedN)               { bg = '#c9a84c'; border = '#c9a84c'; }
      else if (i < usedN + plannedN) { bg = '#3d5fa0'; border = '#3d5fa0'; }
      else                          { border = '#2a3a5e'; }
      return (
        <span key={i} className="pto-dot"
          style={{ background: bg, border: '2px solid ' + border }}
          title={
            i < usedN
              ? '🟡 Used — this block has already been taken'
              : i < usedN + plannedN
              ? '🔵 Planned — on the calendar but not yet taken'
              : '⬜ To schedule — book this to hit your target'
          }
        />
      );
    });
    const done  = usedN + plannedN;
    const left  = target - done;
    return (
      <div className="pto-row">
        <span style={{ flex: 1, fontSize: 13, color: '#dde1f0', cursor: hint ? 'help' : 'default' }}
              title={hint || undefined}>
          {label}{hint ? ' ℹ️' : ''}
        </span>
        <span>{dots}</span>
        <span style={{ fontSize: 11, color: '#6b7fa8', minWidth: 110, textAlign: 'right' }}>
          {done}/{target}
          {usedN > 0 ? ' (' + usedN + ' used' : ''}
          {plannedN > 0 ? (usedN > 0 ? ', ' : ' (') + plannedN + ' planned' : ''}
          {(usedN > 0 || plannedN > 0) ? ')' : ''}
          {left > 0 ? ' · ' + left + ' to go' : ''}
        </span>
      </div>
    );
  }

  const plannedEvents  = (events || []).filter(ev => ev.status === 'Planned');
  const usedEvents     = (events || []).filter(ev => ev.status === 'Used');
  const allPTOEvents   = [...plannedEvents, ...usedEvents];
  const upcomingHols   = (holidays || []).filter(h => {
    const d = h.date ? new Date(h.date + 'T00:00:00') : null;
    return d && d >= new Date();
  });

  return (
    <div>
      {/* Section 1: Balance Cards */}
      <div className="pto-grid-2">
        {/* Vacation */}
        <div className="pto-card">
          <div className="pto-section-title">🏖️ Vacation</div>
          <div className="pto-balance-num" style={{ color: '#c9a84c' }}>
            {remaining.vacationDays}
            <span style={{ fontSize: 14, fontWeight: 400, color: '#6b7fa8', marginLeft: 6 }}>days left</span>
          </div>
          <div className="pto-balance-sub">
            {used.vacationDays} used · {planned.vacationDays} planned
            {cfg.rolloverDays > 0
              ? <> · <span style={{color:'#c9a84c'}}>{cfg.vacationDays}d annual + {cfg.rolloverDays}d rollover = {vacTotal}d total</span></>
              : <> · {vacTotal} total allotted</>
            }
          </div>
          {pctBar(used.vacationDays + planned.vacationDays, vacTotal, '#c9a84c')}
        </div>

        {/* Personal Time */}
        <div className="pto-card">
          <div className="pto-section-title">☀️ Personal Time</div>
          <div className="pto-balance-num" style={{ color: '#5c9eff' }}>
            {persRemain}
            <span style={{ fontSize: 14, fontWeight: 400, color: '#6b7fa8', marginLeft: 6 }}>hrs left</span>
          </div>
          <div className="pto-balance-sub">
            {hrsLabel(persUsed)} used · {persTotal} hrs total ({Math.floor(persTotal / 8)} days)
          </div>
          {pctBar(persUsed + persPlanned, persTotal, '#5c9eff')}
        </div>
      </div>

      {/* Section 2: Burn-Down Pace */}
      <div className="pto-section">
        <div className="pto-section-title">📉 Burn-Down Pace ({year})</div>
        {[
          { label: 'Ideal used by today', val: (bd?.idealUsedToDate || 0).toFixed(1) + 'd', pct: cfg.vacationDays ? Math.min(100, ((bd?.idealUsedToDate || 0) / cfg.vacationDays) * 100) : 0, color: '#6b7fa8', badge: null },
          { label: 'Actually used',       val: (bd?.actualUsedToDate || 0).toFixed(1) + 'd', pct: cfg.vacationDays ? Math.min(100, ((bd?.actualUsedToDate || 0) / cfg.vacationDays) * 100) : 0, color: paceColor,
            badge: bd?.paceGap > 0 ? '✅ +' + Math.abs(bd.paceGap).toFixed(1) + 'd ahead'
                 : bd?.paceGap < 0 ? '⚠ ' + Math.abs(bd.paceGap).toFixed(1) + 'd behind'
                 : '✓ on track' },
          { label: 'Projected year-end', val: (bd?.projectedYearEnd || 0).toFixed(1) + 'd', pct: cfg.vacationDays ? Math.min(100, ((bd?.projectedYearEnd || 0) / cfg.vacationDays) * 100) : 0,
            color: (bd?.projectedUnused || 0) > 1 ? '#f9a825' : '#43a047',
            badge: (bd?.projectedUnused || 0) > 0 ? '(' + (bd.projectedUnused).toFixed(1) + ' unused — risk)' : null },
        ].map((row, i) => (
          <div key={i} style={{ marginBottom: i < 2 ? 14 : 0 }}>
            <div style={{ display: 'flex', justifyContent: 'space-between', fontSize: 12, marginBottom: 5 }}>
              <span style={{ color: '#8a9abf' }}>{row.label}</span>
              <span style={{ color: row.color, fontWeight: 700 }}>
                {row.val}
                {row.badge && <span style={{ color: '#8a9abf', fontWeight: 400, marginLeft: 6 }}>{row.badge}</span>}
              </span>
            </div>
            <div className="pto-bar-track">
              <div className="pto-bar-fill" style={{ width: row.pct + '%', background: row.color }} />
            </div>
          </div>
        ))}
        {nextPTO && (
          <div style={{ marginTop: 14, fontSize: 12, color: '#6b7fa8' }}>
            Next PTO: <span style={{ color: '#c9a84c', fontWeight: 600 }}>{nextPTO.label}</span>
            {' · '}{nextPTO.startDate}{' · '}<DaysAway n={nextPTO.daysUntil} />
          </div>
        )}
      </div>

      {/* Section 3: 3-2-1 Strategy */}
      <div className="pto-section">
        <div className="pto-section-title"
             style={{ cursor: 'help' }}
             title="A balanced PTO strategy: 3 short breaks + 2 full weeks + 1 long trip per year. Gold dots = used, blue = planned, empty = still to schedule.">
          🎯 3-2-1 PTO Strategy
        </div>
        <DotRow
          label="3 Long Weekends"
          hint="1–3 workdays off. Take a Friday or Monday to turn a weekend into a 3–4 day break without burning many days."
          target={tto?.longWeekends?.target || 3} usedN={tto?.longWeekends?.used || 0} plannedN={tto?.longWeekends?.planned || 0} />
        <DotRow
          label="2 Mid-Size Weeks"
          hint="4–7 workdays off. A full week away — enough time to truly decompress and recharge."
          target={tto?.midSizeWeeks?.target  || 2} usedN={tto?.midSizeWeeks?.used  || 0} plannedN={tto?.midSizeWeeks?.planned  || 0} />
        <DotRow
          label="1 Big Pivot"
          hint="8+ workdays off. One extended trip or reset each year. Book early — these windows are hard to find later in the year."
          target={tto?.bigPivot?.target      || 1} usedN={tto?.bigPivot?.used      || 0} plannedN={tto?.bigPivot?.planned      || 0} />
      </div>

      {/* Section 4: Buffer Status */}
      <div className="pto-section">
        <div className="pto-section-title"
             style={{ cursor: 'help' }}
             title="Buffer days are flexible personal days held in reserve for last-minute needs — an unexpected sick day, a mental health break, or a spontaneous long weekend. Click 'Trigger a Buffer Day' to log one.">
          🛡️ Buffer Days
        </div>
        <div style={{ display: 'flex', alignItems: 'center', gap: 16, flexWrap: 'wrap' }}>
          <div>
            {Array.from({ length: bufferStatus?.total || 3 }).map((_, i) => (
              <span key={i} className="pto-dot"
                style={{ background: i < (bufferStatus?.remaining || 0) ? '#c9a84c' : '#1e3060',
                         border: '2px solid ' + (i < (bufferStatus?.remaining || 0) ? '#c9a84c' : '#2a3a5e'),
                         marginRight: 8 }}
                title={
                  i < (bufferStatus?.remaining || 0)
                    ? '🟡 Buffer day available — use for an unexpected personal need or a spontaneous day off'
                    : '⬫ Buffer day used'
                }
              />
            ))}
            <span style={{ fontSize: 13, color: '#8a9abf', verticalAlign: 'middle' }}>
              {bufferStatus?.remaining ?? '?'}/{bufferStatus?.total ?? 3} available
            </span>
          </div>
          {(bufferStatus?.remaining || 0) > 0 && (
            <button
              className="btn btn-ghost"
              style={{ fontSize: 12, marginLeft: 'auto' }}
              disabled={busy}
              onClick={onTriggerBuffer}
            >
              🛡️ Trigger a Buffer Day
            </button>
          )}
        </div>
      </div>

      {/* Section 5: VERA Suggestions */}
      {(clearWindows || []).length > 0 && (
        <div className="pto-section">
          <div className="pto-section-title">💡 VERA-Suggested PTO Windows</div>
          {(clearWindows || []).map((w, i) => (
            <div key={i} className="pto-row">
              <span style={{ fontWeight: 700, color: '#c9a84c', fontSize: 14, minWidth: 150 }}>
                {w.startDate} – {w.endDate}
              </span>
              <span className="pto-pill" style={{ background: '#13244d', color: '#8a9abf' }}>
                {w.workdays} workdays
              </span>
              <span style={{ fontSize: 12, color: '#43a047', marginLeft: 'auto' }}>← added to Vera calendar</span>
            </div>
          ))}
        </div>
      )}

      {/* Section 6: Upcoming PTO Events */}
      {allPTOEvents.length > 0 && (
        <div className="pto-section">
          <div className="pto-section-title">📅 PTO Events ({year})</div>
          {allPTOEvents.map((ev, i) => (
            <div key={i} className="pto-row">
              <span className="pto-pill"
                style={{ background: ev.status === 'Used' ? '#0f3020' : '#1e3060',
                         color: ev.status === 'Used' ? '#69f0ae' : '#c9d9ff', minWidth: 60, textAlign: 'center' }}>
                {ev.status === 'Used' ? '✓ Done' : 'Planned'}
              </span>
              <span style={{ flex: 1, fontWeight: 600, color: '#dde1f0', fontSize: 13 }}>{ev.label}</span>
              <span style={{ fontSize: 11, color: '#6b7fa8' }}>{ev.startDate}{ev.endDate && ev.endDate !== ev.startDate ? ' – ' + ev.endDate : ''}</span>
              <span style={{ fontSize: 12, color: '#c9a84c', fontWeight: 700 }}>
                {ev.type === 'Vacation' ? (ev.weekdays || '?') + 'd' : (ev.hours || '?') + 'h'}
              </span>
              <span className="pto-pill"
                style={{ background: ev.type === 'Vacation' ? '#1e3060' : '#3d2e10',
                         color: ev.type === 'Vacation' ? '#8ab0d8' : '#ffd54f' }}>
                {ev.type === 'Vacation' ? 'Vacation' : 'Personal'}
              </span>
            </div>
          ))}
        </div>
      )}

      {/* Section 7: Shared Chaos Travel */}
      {(upcomingTravel || []).length > 0 && (
        <div className="pto-section">
          <div className="pto-section-title">✈️ Upcoming Travel (Shared Chaos)</div>
          {(upcomingTravel || []).map((t, i) => (
            <div key={i} className="pto-row">
              <span style={{ flex: 1, fontWeight: 600, color: '#dde1f0', fontSize: 13 }}>{t.label}</span>
              <span style={{ fontSize: 11, color: '#6b7fa8' }}>{t.startDate} – {t.endDate}</span>
              <span style={{ fontSize: 12, color: '#5c9eff' }}><DaysAway n={t.daysAway} /></span>
            </div>
          ))}
        </div>
      )}

      {/* Section 8: Milestone Countdowns */}
      {(milestones || []).length > 0 && (
        <div className="pto-section">
          <div className="pto-section-title">📍 Upcoming Milestones</div>
          {(milestones || []).map((m, i) => (
            <div key={i} className="pto-row">
              <span style={{ flex: 1, fontWeight: 600, color: '#dde1f0', fontSize: 13 }}>{m.label}</span>
              <span style={{ fontSize: 11, color: '#6b7fa8' }}>{m.calendarName}</span>
              <span style={{ fontSize: 13, color: '#c9a84c', fontWeight: 700 }}><DaysAway n={m.daysUntil} format="plain" /></span>
            </div>
          ))}
        </div>
      )}

      {/* Section 9: Company Holidays */}
      {upcomingHols.length > 0 && (
        <div className="pto-section">
          <div className="pto-section-title">🏢 Remaining Company Holidays ({year})</div>
          <div style={{ display: 'flex', flexWrap: 'wrap', gap: 8 }}>
            {upcomingHols.map((h, i) => (
              <span key={i} style={{ background: '#13244d', border: '1px solid #1e3060', borderRadius: 6, padding: '4px 10px', fontSize: 12 }}>
                <span style={{ color: '#6b7fa8', marginRight: 6 }}>{h.date}</span>
                <span style={{ color: '#dde1f0' }}>{h.label}</span>
              </span>
            ))}
          </div>
        </div>
      )}
    </div>
  );
}

function PTOTab({ ahmedStats, victoriaStats, onTriggerBuffer, onTriggerVictoriaBuffer, busy, loadError, onReload }) {
  const [ptoSub, setPtoSub] = React.useState('ahmed');

  if (!ahmedStats && !victoriaStats) {
    return (
      <div className="empty-state">
        <div style={{ fontSize: 36, marginBottom: 12 }}>🌴</div>
        <div>No PTO data loaded yet.</div>
        {loadError
          ? <div style={{ fontSize: 12, color: '#e57373', marginTop: 8, fontFamily: 'monospace', background: '#1a0000', padding: '8px 12px', borderRadius: 6, maxWidth: 480, wordBreak: 'break-word' }}>
              Error: {loadError}
            </div>
          : <div style={{ fontSize: 13, color: '#6b7fa8', marginTop: 8 }}>
              Make sure <code style={{ background: '#13244d', padding: '1px 6px', borderRadius: 4 }}>pto_*</code> rows are seeded in the Config tab, then refresh.
            </div>
        }
        {onReload && <button className="btn btn-ghost" style={{ marginTop: 12, fontSize: 12 }} onClick={onReload}>↺ Retry</button>}
      </div>
    );
  }

  const subTabs = [
    { id: 'ahmed',    label: 'Ahmed' },
    { id: 'victoria', label: 'Victoria' },
  ];

  return (
    <div>
      <div className="subtab-row">
        {subTabs.map(s => (
          <button key={s.id}
            className={`subtab-btn${ptoSub === s.id ? ' active' : ''}`}
            onClick={() => setPtoSub(s.id)}>
            {s.label}
          </button>
        ))}
      </div>
      {ptoSub === 'ahmed' && (
        <PTOPersonView stats={ahmedStats} onTriggerBuffer={onTriggerBuffer} busy={busy} />
      )}
      {ptoSub === 'victoria' && (
        <PTOPersonView stats={victoriaStats} onTriggerBuffer={onTriggerVictoriaBuffer} busy={busy} />
      )}
    </div>
  );
}

// ---- Add Bill Modal ---------------------------------------------------------

function AddBillModal({ onClose, onSave, busy }) {
  const [form, setForm] = React.useState({
    bill: '', amount: '', dueDay: '', frequency: 'Monthly',
    category: '', account: 'Shared', notes: '', type: 'Expense',
  });
  function set(k, v) { setForm(function(p) { return Object.assign({}, p, { [k]: v }); }); }

  function handleSubmit(e) {
    e.preventDefault();
    if (!form.bill.trim()) return;
    onSave({
      bill:      form.bill.trim(),
      amount:    form.amount !== '' ? form.amount : undefined,
      dueDay:    form.dueDay !== '' ? form.dueDay : undefined,
      frequency: form.frequency,
      category:  form.category.trim(),
      account:   form.account,
      notes:     form.notes.trim(),
      type:      form.type,
    });
  }

  var freqOptions = ['Monthly', 'Bi-weekly', 'Quarterly', 'Annual', 'One-time'];
  var acctOptions = [
    { label: 'Ahmed',    color: '#5c9eff', bg: '#0d2040' },
    { label: 'Victoria', color: '#b87cff', bg: '#1a0d30' },
    { label: 'Shared',   color: '#4a9060', bg: '#0d1a10' },
  ];
  var isIncome = form.type === 'Income';

  return (
    <div className="modal-overlay" onClick={onClose}>
      <div className="modal-box" style={{ maxWidth: 420 }} onClick={function(e) { e.stopPropagation(); }}>
        <div style={{ fontWeight: 700, fontSize: 16, color: '#dde1f0', marginBottom: 16 }}>
          {isIncome ? '+ Add Income' : '+ Add Bill'}
        </div>
        <form onSubmit={handleSubmit}>
          {/* Type toggle */}
          <div className="form-group">
            <label className="form-label">Type</label>
            <div style={{ display: 'flex', gap: 6 }}>
              {['Expense', 'Income'].map(function(t) {
                var active = form.type === t;
                var color  = t === 'Income' ? '#66bb6a' : '#ef5350';
                return (
                  <button key={t} type="button" onClick={function() { set('type', t); }}
                    style={{ padding: '4px 16px', borderRadius: 8, cursor: 'pointer', fontSize: 12, fontWeight: 600,
                             border: active ? '1.5px solid ' + color : '1.5px solid #2a3a4a',
                             background: active ? ('rgba(' + (t === 'Income' ? '102,187,106' : '239,83,80') + ',.12)') : '#1e2a3a',
                             color: active ? color : '#6b7fa8' }}>
                    {t === 'Income' ? '💰 Income' : '📤 Expense'}
                  </button>
                );
              })}
            </div>
          </div>
          <div className="form-group">
            <label className="form-label">{isIncome ? 'Income Name *' : 'Bill Name *'}</label>
            <input className="form-input" value={form.bill} onChange={function(e) { set('bill', e.target.value); }}
              placeholder={isIncome ? 'e.g. Verizon Paycheck, Freelance' : 'e.g. Netflix, Rent, Car Insurance'} autoFocus />
          </div>
          <div style={{ display: 'flex', gap: 10 }}>
            <div className="form-group" style={{ flex: 1 }}>
              <label className="form-label">Amount ($)</label>
              <input className="form-input" type="number" min="0" step="0.01" value={form.amount}
                onChange={function(e) { set('amount', e.target.value); }}
                placeholder="Variable / unknown" />
            </div>
            <div className="form-group" style={{ flex: 1 }}>
              <label className="form-label">{isIncome ? 'Pay Day (1–31)' : 'Due Day (1–31)'}</label>
              <input className="form-input" type="number" min="1" max="31" value={form.dueDay}
                onChange={function(e) { set('dueDay', e.target.value); }}
                placeholder="e.g. 15" />
            </div>
          </div>
          <div className="form-group">
            <label className="form-label">Frequency</label>
            <div style={{ display: 'flex', gap: 6, flexWrap: 'wrap' }}>
              {freqOptions.map(function(f) {
                var active = form.frequency === f;
                return (
                  <button key={f} type="button"
                    onClick={function() { set('frequency', f); }}
                    style={{ padding: '4px 12px', borderRadius: 8, cursor: 'pointer', fontSize: 12, fontWeight: 600,
                             border: active ? '1.5px solid #5c9eff' : '1.5px solid #2a3a4a',
                             background: active ? '#0d2040' : '#1e2a3a', color: active ? '#5c9eff' : '#6b7fa8' }}>
                    {f}
                  </button>
                );
              })}
            </div>
          </div>
          <div className="form-group">
            <label className="form-label">Category</label>
            <input className="form-input" value={form.category}
              onChange={function(e) { set('category', e.target.value); }}
              placeholder={isIncome ? 'e.g. Salary, Freelance' : 'e.g. Subscriptions, Utilities, Insurance'} />
          </div>
          <div className="form-group">
            <label className="form-label">Account</label>
            <div style={{ display: 'flex', gap: 6 }}>
              {acctOptions.map(function(a) {
                var active = form.account === a.label;
                return (
                  <button key={a.label} type="button"
                    onClick={function() { set('account', a.label); }}
                    style={{ padding: '4px 12px', borderRadius: 8, cursor: 'pointer', fontSize: 12, fontWeight: 600,
                             border: active ? '1.5px solid ' + a.color : '1.5px solid #2a3a4a',
                             background: active ? a.bg : '#1e2a3a', color: active ? a.color : '#6b7fa8' }}>
                    {a.label}
                  </button>
                );
              })}
            </div>
          </div>
          <div className="form-group">
            <label className="form-label">Notes</label>
            <input className="form-input" value={form.notes}
              onChange={function(e) { set('notes', e.target.value); }}
              placeholder="Optional notes" />
          </div>
          <div style={{ display: 'flex', gap: 10, justifyContent: 'flex-end', marginTop: 8 }}>
            <button type="button" onClick={onClose}
              style={{ padding: '8px 18px', borderRadius: 8, background: '#1e2a3a', border: '1px solid #2a3a4a',
                       color: '#6b7fa8', cursor: 'pointer', fontSize: 13 }}>Cancel</button>
            <button type="submit" disabled={busy || !form.bill.trim()}
              style={{ padding: '8px 18px', borderRadius: 8, border: 'none', cursor: 'pointer', fontSize: 13, fontWeight: 600,
                       background: isIncome ? '#2e6e35' : '#5c9eff', color: '#fff',
                       opacity: busy || !form.bill.trim() ? 0.5 : 1 }}>
              {busy ? 'Saving…' : (isIncome ? 'Add Income' : 'Add Bill')}
            </button>
          </div>
        </form>
      </div>
    </div>
  );
}

// ---- TxPicker modal (select a transaction to link to a fixed-amount bill) ----

function TxPicker({ billName, billAmount, txList, onSelect, onClose }) {
  var [selectedIdx, setSelectedIdx] = React.useState('');

  // Sort: if bill amount is known, show closest-amount transactions first
  var sorted = (txList || []).slice().sort(function(a, b) {
    if (billAmount != null) {
      var da = Math.abs(Math.abs(a.amount) - billAmount);
      var db = Math.abs(Math.abs(b.amount) - billAmount);
      return da - db;
    }
    return 0;
  });

  function confirm() {
    var idx = parseInt(selectedIdx, 10);
    if (!isNaN(idx) && sorted[idx]) onSelect(sorted[idx]);
  }

  return (
    <div className="modal-overlay" onClick={onClose}>
      <div className="modal-box" style={{ maxWidth: 440 }} onClick={function(e) { e.stopPropagation(); }}>
        <div style={{ fontWeight: 700, fontSize: 15, color: '#dde1f0', marginBottom: 8 }}>Link Transaction</div>
        <div style={{ fontSize: 12, color: '#6b7fa8', marginBottom: 14 }}>
          Which transaction corresponds to "<span style={{ color: '#dde1f0' }}>{billName}</span>"?
        </div>
        {sorted.length === 0
          ? <div style={{ fontSize: 12, color: '#4d6080', marginBottom: 14 }}>No transactions loaded — visit Finances tab first.</div>
          : (
            <select value={selectedIdx} onChange={function(e) { setSelectedIdx(e.target.value); }}
              style={{ width: '100%', padding: '8px 10px', borderRadius: 8, background: '#0d1b3e',
                       border: '1px solid #1e3060', color: '#dde1f0', fontSize: 13, marginBottom: 14 }}>
              <option value="">— select a transaction —</option>
              {sorted.map(function(tx, i) {
                var amt = Math.abs(tx.amount).toLocaleString(undefined, { minimumFractionDigits: 2, maximumFractionDigits: 2 });
                return <option key={i} value={String(i)}>{tx.description}   ${amt}</option>;
              })}
            </select>
          )
        }
        <div style={{ display: 'flex', gap: 8, justifyContent: 'flex-end' }}>
          <button type="button" onClick={onClose}
            style={{ padding: '7px 16px', borderRadius: 8, background: '#1e2a3a', border: '1px solid #2a3a4a',
                     color: '#6b7fa8', cursor: 'pointer', fontSize: 13 }}>Cancel</button>
          <button type="button" disabled={selectedIdx === ''} onClick={confirm}
            style={{ padding: '7px 16px', borderRadius: 8, background: '#5c9eff', border: 'none',
                     color: '#fff', cursor: selectedIdx !== '' ? 'pointer' : 'not-allowed', fontSize: 13, fontWeight: 600,
                     opacity: selectedIdx === '' ? 0.5 : 1 }}>
            Link
          </button>
        </div>
      </div>
    </div>
  );
}

// ---- Bill Tracker sub-view --------------------------------------------------

function BillTrackerView({ bills, calBills, billsLoading, txList, onToggle, onCalToggle }) {
  var todayDate  = new Date().getDate();
  var todayStr   = new Date().toISOString().slice(0, 10);
  var [hoveredRow,    setHoveredRow]    = React.useState(null);
  var [txOverrides,   setTxOverrides]   = React.useState({}); // { rowKey: candidateIdx } — variable bills cycling
  var [txManualMap,   setTxManualMap]   = React.useState({}); // { rowKey: {description,amount} } — manually linked tx for fixed bills
  var [txPickerTarget, setTxPickerTarget] = React.useState(null); // { rowKey, billName, billAmount } | null

  function ordinal(n) {
    const s = ['th','st','nd','rd'], v = n % 100;
    return s[(v - 20) % 10] || s[v] || s[0];
  }

  function statusBadge(b) {
    if (b.paid) return { label: '✅ Paid', color: '#66bb6a', bg: 'rgba(102,187,106,.12)' };
    // For calendar bills, use the actual due date string for comparison
    var d = null;
    if (b.dueDate) {
      d = Math.round((new Date(b.dueDate + 'T12:00:00') - new Date(todayStr + 'T12:00:00')) / 86400000);
    } else if (b.dueDay != null) {
      d = b.dueDay - todayDate;
    }
    if (d != null && d < 0)            return { label: '🔴 Overdue',  color: '#ef5350', bg: 'rgba(239,83,80,.12)' };
    if (d != null && d >= 0 && d <= 5) return { label: d === 0 ? '⚠️ Due today' : '⚠️ Due in ' + d + 'd', color: '#f5a623', bg: 'rgba(245,166,35,.12)' };
    if (b.dueDate) return { label: '📅 ' + b.dueDate.slice(5), color: '#5c9eff', bg: 'rgba(92,158,255,.10)' };
    return { label: b.dueDay ? '📅 ' + b.dueDay + ordinal(b.dueDay) : '📅 —', color: '#5c9eff', bg: 'rgba(92,158,255,.10)' };
  }

  function handleChipClick(candidates, rowKey, e) {
    e.stopPropagation();
    if (!candidates || candidates.length === 0) return;
    var overrideIdx = txOverrides[rowKey];
    var next;
    if (overrideIdx === undefined) {
      next = 0;  // first click: start at candidates[0]
    } else if (overrideIdx >= candidates.length) {
      next = undefined;  // was at "none" slot: wrap back to default (txMatch)
    } else {
      next = overrideIdx + 1;  // advance to next candidate or none slot
    }
    setTxOverrides(function(prev) {
      var u = Object.assign({}, prev);
      if (next === undefined) { delete u[rowKey]; } else { u[rowKey] = next; }
      return u;
    });
  }

  if (billsLoading) return <div style={{ fontSize: 13, color: '#6b7fa8', padding: 16 }}>Loading bills…</div>;

  // ── Merge calendar + sheet bills ─────────────────────────────────────────
  var sheetByTitle = {};
  ((bills && bills.bills) || []).forEach(function(b) {
    sheetByTitle[b.bill.trim().toLowerCase()] = b;
  });

  // Calendar bills — merge sheet row if title matches
  var calMerged = (calBills || []).map(function(c) {
    var match = sheetByTitle[c.title.trim().toLowerCase()];
    return {
      bill:      c.title,
      title:     c.title,
      amount:    match ? match.amount : c.amount,
      dueDay:    match ? match.dueDay : null,
      dueDate:   c.date,
      frequency: c.isRecurring ? 'Recurring' : 'One-time',
      category:  (match && match.category) || c.category || '',
      account:   (match && match.account)  || '',
      paid:      match ? match.paid : (c.paid || false),
      row:       match ? match.row  : null,
      notes:     (match && match.notes)    || c.notes || '',
      source:    'calendar',
      isRecurring: c.isRecurring,
      txMatch:      match ? (match.txMatch || null) : null,
      txCandidates: match ? (match.txCandidates || []) : [],
      _calBill:  c,  // original cal object for toggle
    };
  });

  // Sheet-only bills (no calendar match)
  var sheetOnly = ((bills && bills.bills) || []).filter(function(b) {
    return !calMerged.find(function(c) { return c.bill.toLowerCase() === b.bill.toLowerCase(); });
  }).map(function(b) { return Object.assign({}, b, { source: 'manual' }); });

  var allBills = calMerged.concat(sheetOnly);

  if (allBills.length === 0) return (
    <div className="empty-state" style={{ marginTop: 8 }}>
      <div style={{ fontSize: 32, marginBottom: 12 }}>🧾</div>
      <div style={{ color: '#dde1f0', marginBottom: 6 }}>No bills found</div>
      <div style={{ fontSize: 12, color: '#4d6080' }}>Add bill events to your calendar or click "+ Add Bill".</div>
    </div>
  );

  // Group by category
  var grouped = {}, uncategorised = [];
  allBills.forEach(function(b) {
    var cat = (b.category || '').trim();
    if (!cat) { uncategorised.push(b); return; }
    if (!grouped[cat]) grouped[cat] = [];
    grouped[cat].push(b);
  });
  var cats = Object.keys(grouped).sort();
  if (uncategorised.length) cats.push('');

  var unpaidSoon = allBills.filter(function(b) {
    if (b.paid) return false;
    if (b.dueDate) {
      var d = Math.round((new Date(b.dueDate + 'T12:00:00') - new Date(todayStr + 'T12:00:00')) / 86400000);
      return d >= 0 && d <= 5;
    }
    return b.dueDay != null && (b.dueDay - todayDate) >= 0 && (b.dueDay - todayDate) <= 5;
  }).length;

  function handleToggle(b) {
    if (b.source === 'calendar' && b.row === null) {
      // Not yet in sheet — auto-create on first toggle
      if (onCalToggle) onCalToggle(b._calBill);
    } else {
      if (onToggle) onToggle(b.row);
    }
  }

  return (
    <div>
      {unpaidSoon > 0 && (
        <div style={{ background: 'rgba(245,166,35,.1)', border: '1px solid rgba(245,166,35,.3)', borderRadius: 8, padding: '8px 12px', marginBottom: 14, fontSize: 12, color: '#f5a623' }}>
          ⚠️ {unpaidSoon} bill{unpaidSoon > 1 ? 's' : ''} due within 5 days
        </div>
      )}
      {cats.map(function(cat) {
        var items = (cat ? grouped[cat] : uncategorised).slice().sort(function(a, b) {
          // Sort calendar bills by due date first, then sheet bills by due day
          var da = a.dueDate || (a.dueDay ? todayStr.slice(0,8) + String(a.dueDay).padStart(2,'0') : '9999');
          var db = b.dueDate || (b.dueDay ? todayStr.slice(0,8) + String(b.dueDay).padStart(2,'0') : '9999');
          return da.localeCompare(db);
        });
        return (
          <div key={cat || '__none'} style={{ marginBottom: 18 }}>
            {cat && (
              <div style={{ fontSize: 11, fontWeight: 700, textTransform: 'uppercase', letterSpacing: '0.06em', color: '#c9a84c', borderBottom: '1px solid #1e3060', paddingBottom: 4, marginBottom: 8 }}>
                {cat}
              </div>
            )}
            {items.map(function(b, i) {
              var badge   = statusBadge(b);
              var acctClr = b.account === 'Ahmed' ? '#5c9eff' : b.account === 'Victoria' ? '#c97ef2' : '#2bb5a0';
              var rowKey  = b.row || (b.bill + '__' + (b.dueDate || b.dueDay || ''));
              return (
                <div key={i}
                  onMouseEnter={function() { setHoveredRow(rowKey); }}
                  onMouseLeave={function() { setHoveredRow(null); }}
                  style={{ display: 'flex', alignItems: 'center', gap: 8, padding: '8px 4px', margin: '0 -4px', borderBottom: '1px solid #0d1b3e', cursor: 'default', borderRadius: 4, background: hoveredRow === rowKey ? 'rgba(92,158,255,0.05)' : 'transparent', transition: 'background 0.15s' }}>
                  {/* Name + badges + notes */}
                  <div style={{ flex: 1, minWidth: 0 }}>
                    <div style={{ display: 'flex', alignItems: 'center', gap: 5, flexWrap: 'nowrap' }}>
                      <span style={{ fontSize: 13, color: b.paid ? '#4d6080' : '#dde1f0', fontWeight: 500, overflow: 'hidden', textOverflow: 'ellipsis', whiteSpace: 'nowrap' }}>{b.bill}</span>
                      {/* Account chip */}
                      {b.account && (
                        <span style={{ fontSize: 10, padding: '1px 6px', borderRadius: 8, border: '1px solid ' + acctClr, color: acctClr, whiteSpace: 'nowrap', flexShrink: 0 }}>{b.account}</span>
                      )}
                      {/* Source badge */}
                      {b.source === 'calendar' && (
                        <span style={{ fontSize: 9, padding: '1px 5px', borderRadius: 6, background: '#0d1a2a', border: '1px solid #1e3a5a', color: '#4a7aa8', whiteSpace: 'nowrap', flexShrink: 0 }}>
                          {b.isRecurring ? '↻' : '1×'} Cal
                        </span>
                      )}
                      {/* ── Manual link chip / button — shown for ALL bills ── */}
                      {(function() {
                        var manualTx = txManualMap[rowKey];
                        if (manualTx) {
                          var amt = Math.abs(manualTx.amount).toLocaleString(undefined, { minimumFractionDigits: 0, maximumFractionDigits: 2 });
                          return (
                            <span
                              title={manualTx.description + ' · click to change'}
                              onClick={function(e) { e.stopPropagation(); setTxPickerTarget({ rowKey: rowKey, billName: b.bill, billAmount: b.amount }); }}
                              style={{ fontSize: 10, padding: '1px 6px', borderRadius: 8,
                                       border: '1px solid rgba(92,158,255,0.4)', color: '#5c9eff',
                                       background: 'rgba(92,158,255,0.08)', whiteSpace: 'nowrap',
                                       flexShrink: 0, cursor: 'pointer' }}>
                              🔗 ${amt}
                            </span>
                          );
                        }
                        if (!txList || txList.length === 0) return null;
                        return (
                          <span
                            title="Click to link a transaction to this bill"
                            onClick={function(e) { e.stopPropagation(); setTxPickerTarget({ rowKey: rowKey, billName: b.bill, billAmount: b.amount }); }}
                            style={{ fontSize: 10, padding: '1px 6px', borderRadius: 8,
                                     border: '1px solid rgba(107,127,168,0.3)', color: '#6b7fa8',
                                     background: 'transparent', whiteSpace: 'nowrap',
                                     flexShrink: 0, cursor: 'pointer' }}>
                            🔗 Link tx
                          </span>
                        );
                      })()}
                      {/* ── Auto-match cycling chip — variable bills only, hidden when manually linked ── */}
                      {b.amount === null && !txManualMap[rowKey] && (function() {
                        var candidates  = b.txCandidates || [];
                        var overrideIdx = txOverrides[rowKey];
                        var effectiveTx;
                        if (overrideIdx === undefined) {
                          effectiveTx = b.txMatch || null;
                        } else if (overrideIdx >= candidates.length) {
                          effectiveTx = null; // "none" slot
                        } else {
                          effectiveTx = candidates[overrideIdx] || null;
                        }
                        var canCycle = candidates.length > 0;
                        if (!effectiveTx && overrideIdx !== undefined) {
                          return (
                            <span
                              title="No transaction linked · click to restore auto-match"
                              onClick={function(e) { handleChipClick(candidates, rowKey, e); }}
                              style={{ fontSize: 10, padding: '1px 6px', borderRadius: 8,
                                       border: '1px solid rgba(107,127,168,0.25)', color: '#4d6080',
                                       background: 'transparent', whiteSpace: 'nowrap',
                                       flexShrink: 0, cursor: 'pointer' }}>
                              💳 ∅
                            </span>
                          );
                        }
                        if (!effectiveTx) return null;
                        var isOverridden = overrideIdx !== undefined && overrideIdx < candidates.length && (
                          !b.txMatch || effectiveTx.description !== b.txMatch.description || effectiveTx.amount !== b.txMatch.amount
                        );
                        var color  = isOverridden ? '#f5a623'                : '#66bb6a';
                        var border = isOverridden ? 'rgba(245,166,35,0.4)'  : 'rgba(102,187,106,0.4)';
                        var bg     = isOverridden ? 'rgba(245,166,35,0.08)' : 'rgba(102,187,106,0.08)';
                        var label  = (isOverridden ? '↺ 💳 $' : '💳 $') +
                                     Math.abs(effectiveTx.amount).toLocaleString(undefined, { minimumFractionDigits: 0, maximumFractionDigits: 2 });
                        return (
                          <span
                            title={(effectiveTx.description || '') + (canCycle ? ' · click to try next / clear' : '')}
                            onClick={canCycle ? function(e) { handleChipClick(candidates, rowKey, e); } : undefined}
                            style={{ fontSize: 10, padding: '1px 6px', borderRadius: 8,
                                     border: '1px solid ' + border, color: color, background: bg,
                                     whiteSpace: 'nowrap', flexShrink: 0,
                                     cursor: canCycle ? 'pointer' : 'default' }}>
                            {label}
                          </span>
                        );
                      })()}
                    </div>
                    {b.notes && <div style={{ fontSize: 11, color: '#4d6080', marginTop: 1, overflow: 'hidden', textOverflow: 'ellipsis', whiteSpace: 'nowrap' }}>{b.notes}</div>}
                  </div>
                  {/* Amount */}
                  <div style={{ fontSize: 13, fontWeight: 700, color: b.paid ? '#4d6080' : '#c9a84c', whiteSpace: 'nowrap' }}>
                    {b.amount != null ? '$' + Number(b.amount).toLocaleString(undefined, { minimumFractionDigits: 0, maximumFractionDigits: 2 }) : '—'}
                  </div>
                  {/* Frequency or due day */}
                  <div style={{ fontSize: 11, color: '#6b7fa8', whiteSpace: 'nowrap', width: 60, textAlign: 'center' }}>
                    {b.source === 'calendar'
                      ? (b.isRecurring ? 'Recurring' : 'One-time')
                      : (b.frequency && b.frequency !== 'Monthly' ? b.frequency : (b.dueDay ? b.dueDay + ordinal(b.dueDay) : ''))}
                  </div>
                  {/* Paid / status toggle — only the pill button toggles paid state */}
                  <button
                    style={{ fontSize: 11, padding: '3px 10px', borderRadius: 12, border: '1px solid ' + badge.color, background: badge.bg, color: badge.color, cursor: 'pointer', whiteSpace: 'nowrap', minWidth: 92 }}
                    onClick={function() { handleToggle(b); }}
                  >{badge.label}</button>
                </div>
              );
            })}
          </div>
        );
      })}
      {/* TxPicker modal — inside the outer div so it renders in context */}
      {txPickerTarget && (
        <TxPicker
          billName={txPickerTarget.billName}
          billAmount={txPickerTarget.billAmount}
          txList={txList}
          onSelect={function(tx) {
            setTxManualMap(function(prev) {
              var u = Object.assign({}, prev);
              u[txPickerTarget.rowKey] = tx;
              return u;
            });
            setTxPickerTarget(null);
          }}
          onClose={function() { setTxPickerTarget(null); }}
        />
      )}
    </div>
  );
}

// ---- Home Front tab (Issues #21, #40, #46, #47) -----------------------------

function HomestewardView({ items, loading, busy, onRecordService }) {
  if (loading) return <div style={{ fontSize: 13, color: '#6b7fa8', padding: 16 }}>Loading home items…</div>;
  if (!items.length) return (
    <div className="empty-state" style={{ marginTop: 8 }}>
      <div style={{ fontSize: 32, marginBottom: 12 }}>🏠</div>
      <div style={{ color: '#dde1f0', marginBottom: 6 }}>No home items yet</div>
      <div style={{ fontSize: 12, color: '#4d6080' }}>Add rows to the Home Items tab in your Life OS sheet.</div>
    </div>
  );

  function warrantyBadge(days) {
    if (days === null || days === undefined) return null;
    if (days < 0)  return { label: '🔴 Expired',       color: '#ef5350', bg: 'rgba(239,83,80,.12)' };
    if (days <= 30) return { label: `🟡 Expires in ${days}d`, color: '#f5a623', bg: 'rgba(245,166,35,.12)' };
    return { label: '🟢 Valid',           color: '#66bb6a', bg: 'rgba(102,187,106,.12)' };
  }
  function serviceBadge(days) {
    if (days === null || days === undefined) return null;
    if (days < 0)  return { label: '🔴 Overdue',      color: '#ef5350', bg: 'rgba(239,83,80,.12)' };
    if (days <= 14) return { label: `🟡 Due in ${days}d`, color: '#f5a623', bg: 'rgba(245,166,35,.12)' };
    return { label: '🟢 Scheduled',       color: '#66bb6a', bg: 'rgba(102,187,106,.12)' };
  }
  function badge(b, label, color, bg) {
    return <span style={{ fontSize: 10, padding: '2px 7px', borderRadius: 10, border: `1px solid ${color}`, color, background: bg, whiteSpace: 'nowrap' }}>{label}</span>;
  }

  // Group by category
  const grouped = {}, uncategorised = [];
  items.forEach(item => {
    const cat = (item.category || '').trim();
    if (!cat) { uncategorised.push(item); return; }
    if (!grouped[cat]) grouped[cat] = [];
    grouped[cat].push(item);
  });
  const cats = Object.keys(grouped).sort();
  if (uncategorised.length) cats.push('');

  // Alert: items with overdue service
  const overdueCount = items.filter(i => i.serviceDays !== null && i.serviceDays < 0).length;
  const dueSoonCount = items.filter(i => i.serviceDays !== null && i.serviceDays >= 0 && i.serviceDays <= 14).length;

  return (
    <div>
      {overdueCount > 0 && (
        <div style={{ background: 'rgba(239,83,80,.1)', border: '1px solid rgba(239,83,80,.3)', borderRadius: 8, padding: '8px 12px', marginBottom: 14, fontSize: 12, color: '#ef5350' }}>
          🔴 {overdueCount} item{overdueCount > 1 ? 's' : ''} overdue for service
        </div>
      )}
      {!overdueCount && dueSoonCount > 0 && (
        <div style={{ background: 'rgba(245,166,35,.1)', border: '1px solid rgba(245,166,35,.3)', borderRadius: 8, padding: '8px 12px', marginBottom: 14, fontSize: 12, color: '#f5a623' }}>
          🟡 {dueSoonCount} item{dueSoonCount > 1 ? 's' : ''} due for service within 14 days
        </div>
      )}

      {cats.map(cat => {
        const catItems = (cat ? grouped[cat] : uncategorised);
        return (
          <div key={cat || '__none'} style={{ marginBottom: 20 }}>
            {cat && (
              <div style={{ fontSize: 11, fontWeight: 700, textTransform: 'uppercase', letterSpacing: '0.06em', color: '#c9a84c', borderBottom: '1px solid #1e3060', paddingBottom: 4, marginBottom: 8 }}>
                {cat}
              </div>
            )}
            {catItems.map((item, i) => {
              const wb = warrantyBadge(item.warrantyDays);
              const sb = serviceBadge(item.serviceDays);
              return (
                <div key={i} style={{ padding: '10px 0', borderBottom: '1px solid #0d1b3e' }}>
                  <div style={{ display: 'flex', alignItems: 'center', gap: 8, flexWrap: 'wrap' }}>
                    <span style={{ fontSize: 13, fontWeight: 600, color: '#dde1f0', flex: 1, minWidth: 120 }}>{item.item}</span>
                    {item.warrantyExpiry && wb && badge(null, wb.label, wb.color, wb.bg)}
                    {item.nextService && sb && badge(null, sb.label, sb.color, sb.bg)}
                    <button
                      style={{ fontSize: 11, padding: '3px 10px', borderRadius: 12, border: '1px solid #2a4070', background: 'none', color: '#8899cc', cursor: item.intervalMonths ? 'pointer' : 'not-allowed', opacity: item.intervalMonths ? 1 : 0.4, whiteSpace: 'nowrap' }}
                      onClick={() => item.intervalMonths && onRecordService(item.row)}
                      disabled={busy || !item.intervalMonths}
                      title={item.intervalMonths ? 'Record service & schedule next' : 'Set Interval (mo) to enable scheduling'}
                    >✓ Record Service</button>
                  </div>
                  <div style={{ display: 'flex', gap: 16, marginTop: 4, flexWrap: 'wrap' }}>
                    {item.warrantyExpiry && <span style={{ fontSize: 11, color: '#6b7fa8' }}>🛡️ Warranty: {item.warrantyExpiry}</span>}
                    {item.lastService   && <span style={{ fontSize: 11, color: '#6b7fa8' }}>🔧 Last: {item.lastService}</span>}
                    {item.nextService   && <span style={{ fontSize: 11, color: '#6b7fa8' }}>📅 Next: {item.nextService}</span>}
                    {item.intervalMonths && <span style={{ fontSize: 11, color: '#6b7fa8' }}>↻ Every {item.intervalMonths}mo</span>}
                  </div>
                  {item.notes && <div style={{ fontSize: 11, color: '#4d6080', marginTop: 2 }}>{item.notes}</div>}
                </div>
              );
            })}
          </div>
        );
      })}
    </div>
  );
}
