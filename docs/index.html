function AddCountryModal({ upcomingTravel, existingCountries, onSave, onClose, busy }) {
  var currentYear = new Date().getFullYear();
  var [country,   setCountry]   = React.useState('');
  var [city,      setCity]      = React.useState('');
  var [year,      setYear]      = React.useState(String(currentYear));
  var [traveller, setTraveller] = React.useState('Both');
  var [tripKey,   setTripKey]   = React.useState('');
  var [occasion,  setOccasion]  = React.useState('');

  // Autocomplete: list of known countries from existing entries
  var knownCountries = React.useMemo(function() {
    var seen = {};
    (existingCountries || []).forEach(function(e) { if (e.Country) seen[e.Country] = true; });
    return Object.keys(seen).sort();
  }, [existingCountries]);

  var flagPreview = country.trim() ? countryToIso(country.trim()) : null;

  function handleSave() {
    if (!country.trim() || !year) return;
    onSave({ country: country.trim(), city: city.trim(), year: parseInt(year, 10),
             traveller, tripKey, notes: occasion.trim() });
  }

  return (
    <div className="modal-overlay" onClick={function(e) { if (e.target === e.currentTarget) onClose(); }}>
      <div className="modal" style={{ maxWidth: 480 }}>
        <h2>🌍 Add Country Visit</h2>

        {/* Country */}
        <div className="form-group">
          <label className="form-label">
            Country *
            {flagPreview && (
              <span style={{ marginLeft: 8 }}><CountryFlag name={country.trim()} size={20} /></span>
            )}
          </label>
          <input className="form-input" list="country-autocomplete" value={country} autoFocus
            onChange={function(e) { setCountry(e.target.value); }}
            placeholder="e.g. France, Japan, United States…" />
          <datalist id="country-autocomplete">
            {knownCountries.map(function(c) { return React.createElement('option', { key: c, value: c }); })}
          </datalist>
        </div>

        {/* City */}
        <div className="form-group">
          <label className="form-label">City <span style={{ color: '#5f6368', fontWeight: 400 }}>(optional)</span></label>
          <input className="form-input" value={city}
            onChange={function(e) { setCity(e.target.value); }}
            placeholder="e.g. Paris, Tokyo, New York…" />
        </div>

        {/* Year + Traveller */}
        <div style={{ display: 'flex', gap: 8, marginBottom: 12 }}>
          <div className="form-group" style={{ flex: 1, marginBottom: 0 }}>
            <label className="form-label">Year *</label>
            <input className="form-input" type="number" value={year} min="1950" max="2099"
              onChange={function(e) { setYear(e.target.value); }} />
          </div>
          <div className="form-group" style={{ flex: 2, marginBottom: 0 }}>
            <label className="form-label">Who *</label>
            <div style={{ display: 'flex', gap: 6, paddingTop: 6 }}>
              {['Ahmed', 'Victoria', 'Both'].map(function(t) {
                var colors = t === 'Ahmed'   ? { on: '#5c9eff', bg: '#0d2040', off: '#1e2a3a' }
                           : t === 'Victoria'? { on: '#b87cff', bg: '#1a0d30', off: '#1e2a3a' }
                           :                  { on: '#4a9060', bg: '#0d1a10', off: '#1e2a3a' };
                return (
                  <button key={t} onClick={function() { setTraveller(t); }}
                    style={{ flex: 1, padding: '6px 0', borderRadius: 7, cursor: 'pointer',
                             fontSize: 12, fontWeight: 600,
                             border: traveller === t ? '2px solid ' + colors.on : '2px solid transparent',
                             background: traveller === t ? colors.bg : colors.off,
                             color: traveller === t ? colors.on : '#6b7fa8' }}>
                    {t}
                  </button>
                );
              })}
            </div>
          </div>
        </div>

        {/* Trip (optional dropdown) */}
        <div className="form-group">
          <label className="form-label">Trip <span style={{ color: '#5f6368', fontWeight: 400 }}>(optional — links to itinerary)</span></label>
          <select className="form-input" value={tripKey}
            onChange={function(e) { setTripKey(e.target.value); }}
            style={{ color: tripKey ? '#e8eaed' : '#6b7fa8' }}>
            <option value="">— no trip link —</option>
            {(upcomingTravel || []).map(function(t) {
              var tk = t.startDate + '|' + t.label;
              return <option key={tk} value={tk}>{t.label} ({t.startDate})</option>;
            })}
          </select>
        </div>

        {/* Occasion */}
        <div className="form-group">
          <label className="form-label">Occasion <span style={{ color: '#5f6368', fontWeight: 400 }}>(optional)</span></label>
          <input className="form-input" value={occasion}
            onChange={function(e) { setOccasion(e.target.value); }}
            placeholder="e.g. Honeymoon, Engagement, In-Laws Trip, Solo Adventure…" />
        </div>

        {/* Actions */}
        <div style={{ display: 'flex', gap: 8, justifyContent: 'flex-end', marginTop: 8 }}>
          <button onClick={onClose} disabled={busy}
            style={{ padding: '8px 18px', borderRadius: 7, border: '1px solid #2a3a50',
                     background: 'transparent', color: '#8ab4f8', cursor: 'pointer' }}>
            Cancel
          </button>
          <button onClick={handleSave} disabled={busy || !country.trim() || !year}
            style={{ padding: '8px 18px', borderRadius: 7, border: 'none',
                     background: !country.trim() || !year ? '#1e2a3a' : '#8ab4f8',
                     color: !country.trim() || !year ? '#4a5a70' : '#0d1117',
                     fontWeight: 600, cursor: !country.trim() || !year ? 'default' : 'pointer' }}>
            Save Visit
          </button>
        </div>
      </div>
    </div>
  );
}

function CountriesVisitedPanel({ entries, upcomingTravel, busy, loaded, onLoad, onAdd, onDelete, onGoToItinerary }) {
  var [filterYear,      setFilterYear]      = React.useState('all');
  var [filterTraveller, setFilterTraveller] = React.useState('all');
  var [expanded,        setExpanded]        = React.useState(new Set());
  var [showModal,       setShowModal]       = React.useState(false);

  // Lazy-load on first mount
  React.useEffect(function() {
    if (!loaded && onLoad) onLoad();
  }, []); // eslint-disable-line react-hooks/exhaustive-deps

  var allEntries = entries || [];

  // Distinct years (desc)
  var years = React.useMemo(function() {
    var seen = {};
    allEntries.forEach(function(e) { if (e.Year) seen[String(e.Year)] = true; });
    return Object.keys(seen).sort(function(a, b) { return b - a; });
  }, [allEntries]);

  // Apply filters
  var filtered = allEntries.filter(function(e) {
    if (filterYear      !== 'all' && String(e.Year)      !== filterYear)      return false;
    if (filterTraveller !== 'all' && e.Traveller !== filterTraveller) return false;
    return true;
  });

  // Group by country
  var byCountry = {};
  filtered.forEach(function(e) {
    var c = e.Country || '(Unknown)';
    if (!byCountry[c]) byCountry[c] = [];
    byCountry[c].push(e);
  });
  var countryNames = Object.keys(byCountry).sort();

  // Lifetime stats (not affected by filter)
  var statCountries   = new Set(allEntries.map(function(e) { return e.Country; })).size;
  var statAhmed       = new Set(allEntries.filter(function(e) { return e.Traveller === 'Ahmed';    }).map(function(e) { return e.Country; })).size;
  var statVictoria    = new Set(allEntries.filter(function(e) { return e.Traveller === 'Victoria'; }).map(function(e) { return e.Country; })).size;
  var statBoth        = new Set(allEntries.filter(function(e) { return e.Traveller === 'Both';     }).map(function(e) { return e.Country; })).size;

  function toggleExpand(c) {
    setExpanded(function(prev) {
      var next = new Set(prev);
      if (next.has(c)) next.delete(c); else next.add(c);
      return next;
    });
  }

  var TRAVELLER_STYLE = {
    Ahmed:    { color: '#5c9eff', bg: '#0d2040' },
    Victoria: { color: '#b87cff', bg: '#1a0d30' },
    Both:     { color: '#4a9060', bg: '#0d1a10' },
  };

  function TravellerPill(props) {
    var s = TRAVELLER_STYLE[props.who] || { color: '#8ab4f8', bg: '#0d2040' };
    return (
      <span style={{ fontSize: 10, fontWeight: 600, padding: '1px 7px', borderRadius: 10,
                     color: s.color, background: s.bg, whiteSpace: 'nowrap' }}>
        {props.who}
      </span>
    );
  }

  if (!loaded) {
    return <div className="loading-text">Loading countries…</div>;
  }

  return (
    <div>
      {/* Header bar */}
      <div style={{ display: 'flex', alignItems: 'center', justifyContent: 'space-between',
                    marginBottom: 14, flexWrap: 'wrap', gap: 8 }}>
        <div style={{ fontSize: 13, color: '#8ab4f8', fontWeight: 600 }}>
          🌍 {statCountries} {statCountries === 1 ? 'country' : 'countries'}
          <span style={{ color: '#4a5a70', fontWeight: 400, marginLeft: 10 }}>
            👤 Ahmed: {statAhmed} &nbsp;·&nbsp; 👤 Victoria: {statVictoria} &nbsp;·&nbsp; 👫 Together: {statBoth}
          </span>
        </div>
        <button onClick={function() { setShowModal(true); }} disabled={busy}
          style={{ padding: '5px 14px', borderRadius: 6, border: 'none',
                   background: '#8ab4f8', color: '#0d1117', fontWeight: 600,
                   cursor: 'pointer', fontSize: 13, flexShrink: 0 }}>
          + Add Visit
        </button>
      </div>

      {/* Filter row */}
      <div style={{ marginBottom: 14 }}>
        {/* Year filter */}
        <div style={{ display: 'flex', gap: 6, flexWrap: 'wrap', marginBottom: 6, alignItems: 'center' }}>
          <span style={{ fontSize: 11, color: '#5f6368', marginRight: 2 }}>Year:</span>
          {['all'].concat(years).map(function(y) {
            var active = filterYear === y;
            return (
              <button key={y} onClick={function() { setFilterYear(y); }}
                style={{ padding: '3px 10px', borderRadius: 12, cursor: 'pointer', fontSize: 11,
                         border: active ? '1.5px solid #5c9eff' : '1.5px solid #2a3a50',
                         background: active ? '#0d2040' : 'transparent',
                         color: active ? '#8ab4f8' : '#5f6368', fontWeight: active ? 600 : 400 }}>
                {y === 'all' ? 'All' : y}
              </button>
            );
          })}
        </div>
        {/* Traveller filter */}
        <div style={{ display: 'flex', gap: 6, flexWrap: 'wrap', alignItems: 'center' }}>
          <span style={{ fontSize: 11, color: '#5f6368', marginRight: 2 }}>Who:</span>
          {[['all','All','#5f6368','transparent'],
            ['Ahmed','Ahmed','#5c9eff','#0d2040'],
            ['Victoria','Victoria','#b87cff','#1a0d30'],
            ['Both','Together','#4a9060','#0d1a10']].map(function(opt) {
            var key = opt[0], label = opt[1], activeColor = opt[2], activeBg = opt[3];
            var active = filterTraveller === key;
            return (
              <button key={key} onClick={function() { setFilterTraveller(key); }}
                style={{ padding: '3px 10px', borderRadius: 12, cursor: 'pointer', fontSize: 11,
                         border: active ? '1.5px solid ' + activeColor : '1.5px solid #2a3a50',
                         background: active ? activeBg : 'transparent',
                         color: active ? activeColor : '#5f6368', fontWeight: active ? 600 : 400 }}>
                {label}
              </button>
            );
          })}
        </div>
      </div>

      {/* Empty state */}
      {allEntries.length === 0 && (
        <div className="empty-state">
          <div style={{ fontSize: 40, marginBottom: 12 }}>🌍</div>
          <div style={{ color: '#dde1f0', marginBottom: 6 }}>No countries recorded yet.</div>
          <div style={{ fontSize: 12, color: '#4d6080', marginBottom: 16 }}>
            Start building your travel history.
          </div>
          <button onClick={function() { setShowModal(true); }}
            style={{ padding: '8px 20px', borderRadius: 7, border: 'none',
                     background: '#8ab4f8', color: '#0d1117', fontWeight: 600, cursor: 'pointer' }}>
            + Add First Visit
          </button>
        </div>
      )}

      {/* No results after filter */}
      {allEntries.length > 0 && countryNames.length === 0 && (
        <div style={{ color: '#4d6080', fontSize: 13, textAlign: 'center', padding: '24px 0' }}>
          No entries match the current filter.
        </div>
      )}

      {/* Country accordion list */}
      {countryNames.map(function(cName) {
        var cEntries  = byCountry[cName];
        // flag rendered inline via CountryFlag component
        var isOpen    = expanded.has(cName);
        // Collect distinct traveller types for this country
        var travTypes = Array.from(new Set(cEntries.map(function(e) { return e.Traveller; }))).sort();

        return (
          <div key={cName} style={{ background: '#0a1220', border: '1px solid #2a3a50',
                                    borderRadius: 10, marginBottom: 10, overflow: 'hidden' }}>
            {/* Country header row — clickable to expand */}
            <div onClick={function() { toggleExpand(cName); }}
              style={{ display: 'flex', alignItems: 'center', gap: 10,
                       padding: '12px 16px', cursor: 'pointer',
                       borderBottom: isOpen ? '1px solid #2a3a50' : 'none' }}>
              <span style={{ flexShrink: 0, lineHeight: 0 }}><CountryFlag name={cName} size={28} /></span>
              <span style={{ fontWeight: 700, fontSize: 14, color: '#e8eaed', flex: 1 }}>{cName}</span>
              <span style={{ fontSize: 11, color: '#5f6368', marginRight: 6 }}>
                ×{cEntries.length} {cEntries.length === 1 ? 'visit' : 'visits'}
              </span>
              <div style={{ display: 'flex', gap: 4, marginRight: 6 }}>
                {travTypes.map(function(t) { return <TravellerPill key={t} who={t} />; })}
              </div>
              <span style={{ color: '#4a5a70', fontSize: 13 }}>{isOpen ? '▲' : '▼'}</span>
            </div>

            {/* Expanded city rows */}
            {isOpen && (
              <div style={{ background: '#0d1520' }}>
                {cEntries
                  .slice()
                  .sort(function(a, b) { return b.Year - a.Year; })
                  .map(function(entry) {
                    var ts         = TRAVELLER_STYLE[entry.Traveller] || TRAVELLER_STYLE.Both;
                    var hasTripKey = entry['Trip Key'] && String(entry['Trip Key']).trim();
                    var tripLabel  = hasTripKey
                      ? (upcomingTravel || []).find(function(t) {
                          return (t.startDate + '|' + t.label) === entry['Trip Key'];
                        })
                      : null;
                    var tripName   = tripLabel ? tripLabel.label : (hasTripKey ? hasTripKey.split('|')[1] || hasTripKey : null);

                    return (
                      <div key={entry.ID}
                        style={{ display: 'flex', alignItems: 'center', gap: 8, flexWrap: 'wrap',
                                 padding: '8px 16px 8px 48px', borderBottom: '1px solid #131e2e' }}
                        onMouseEnter={function(ev) { ev.currentTarget.querySelector('.del-btn') && (ev.currentTarget.querySelector('.del-btn').style.opacity = '1'); }}
                        onMouseLeave={function(ev) { ev.currentTarget.querySelector('.del-btn') && (ev.currentTarget.querySelector('.del-btn').style.opacity = '0'); }}>
                        <span style={{ color: '#8ab4f8', fontSize: 13, marginRight: 2 }}>📍</span>
                        <span style={{ fontSize: 13, color: '#dde1f0', fontWeight: 500, minWidth: 0, flex: '0 0 auto' }}>
                          {entry.City || <span style={{ color: '#3a4a60', fontStyle: 'italic' }}>no city</span>}
                        </span>
                        <span style={{ fontSize: 12, color: '#5f6368' }}>{entry.Year}</span>
                        {entry.Notes && (
                          <span style={{ fontSize: 11, color: '#c8a84a', fontStyle: 'italic' }}>
                            ✨ {entry.Notes}
                          </span>
                        )}
                        <TravellerPill who={entry.Traveller} />
                        {hasTripKey && (
                          <span onClick={function(ev) {
                                  ev.stopPropagation();
                                  if (onGoToItinerary) onGoToItinerary(entry['Trip Key']);
                                }}
                            style={{ fontSize: 11, color: '#8ab4f8', cursor: 'pointer',
                                     textDecoration: 'underline', flexShrink: 0 }}>
                            → {tripName}
                          </span>
                        )}
                        <button className="del-btn" onClick={function(ev) {
                                  ev.stopPropagation();
                                  if (window.confirm('Delete this visit entry?')) onDelete(entry.ID);
                                }}
                          style={{ marginLeft: 'auto', background: 'transparent', border: 'none',
                                   color: '#9aa0a6', cursor: 'pointer', fontSize: 14, padding: '0 4px',
                                   opacity: 0, transition: 'opacity 0.15s', flexShrink: 0 }}>
                          🗑
                        </button>
                      </div>
                    );
                  })}
              </div>
            )}
          </div>
        );
      })}

      {/* Add Visit modal */}
      {showModal && (
        <AddCountryModal
          upcomingTravel={upcomingTravel}
          existingCountries={allEntries}
          busy={busy}
          onSave={function(data) { onAdd(data); setShowModal(false); }}
          onClose={function() { setShowModal(false); }}
        />
      )}
    </div>
  );
}

  var [notes,     setNotes]     = React.useState('');

    var seen = {};
    (entries || []).forEach(function(e) { if (e.Country) seen[e.Country] = true; });
    return Object.keys(seen).sort();
  }, [entries]);
  var knownDreamTrips = React.useMemo(function() {
    var seen = {};
    (entries || []).forEach(function(e) { if (e['Dream Trip']) seen[e['Dream Trip']] = true; });

  }, [entries]);

    <div className="modal-overlay" onClick={function(e) { if (e.target === e.currentTarget) onClose(); }}>
      <div className="modal" style={{ maxWidth: 480 }}>
        <h2>🪣 Add Bucket List Destination</h2>

        {/* Country */}
        <div className="form-group">
          <label className="form-label">
            Country *
            {flagPreview && <span style={{ marginLeft: 8 }}><CountryFlag name={country.trim()} size={20} /></span>}
          </label>
          <input className="form-input" list="bl-country-ac" value={country} autoFocus
            onChange={function(e) { setCountry(e.target.value); }}
            placeholder="e.g. Japan, France, New Zealand…" />
          <datalist id="bl-country-ac">
            {knownCountries.map(function(c) { return React.createElement('option', { key: c, value: c }); })}
          </datalist>
        </div>

        {/* City */}
        <div className="form-group">
          <label className="form-label">City <span style={{ color: '#5f6368', fontWeight: 400 }}>(optional)</span></label>
          <input className="form-input" value={city}
            onChange={function(e) { setCity(e.target.value); }}
            placeholder="e.g. Tokyo, Paris, Queenstown…" />
        </div>

        {/* Target Year + Who */}
        <div style={{ display: 'flex', gap: 8, marginBottom: 12 }}>
          <div className="form-group" style={{ flex: 1, marginBottom: 0 }}>
            <label className="form-label">Target Year <span style={{ color: '#5f6368', fontWeight: 400 }}>(optional)</span></label>
            <input className="form-input" type="number" value={targetYear} min="2024" max="2099"
              onChange={function(e) { setTargetYear(e.target.value); }}
              placeholder="2027" />
          </div>
          <div className="form-group" style={{ flex: 2, marginBottom: 0 }}>
            <label className="form-label">Who</label>
            <div style={{ display: 'flex', gap: 6, paddingTop: 6 }}>
              {['Ahmed', 'Victoria', 'Both'].map(function(t) {
                var colors = t === 'Ahmed'   ? { on: '#5c9eff', bg: '#0d2040' }
                           : t === 'Victoria'? { on: '#b87cff', bg: '#1a0d30' }
                           :                  { on: '#4a9060', bg: '#0d1a10' };
                return (
                  <button key={t} onClick={function() { setTraveller(t); }}
                    style={{ flex: 1, padding: '6px 0', borderRadius: 7, cursor: 'pointer',
                             fontSize: 12, fontWeight: 600,
                             border: traveller === t ? '2px solid ' + colors.on : '2px solid transparent',
                             background: traveller === t ? colors.bg : '#1e2a3a',
                             color: traveller === t ? colors.on : '#6b7fa8' }}>
                    {t}
                  </button>
                );
              })}
            </div>
          </div>
        </div>

        {/* Stars */}
        <div className="form-group">
          <label className="form-label">Priority <span style={{ color: '#5f6368', fontWeight: 400 }}>(optional)</span></label>
          <div style={{ display: 'flex', gap: 4 }}>
            {[1,2,3,4,5].map(function(n) {
              return (
                <button key={n} type="button"
                  onClick={function() { setStars(stars === n ? 0 : n); }}
                  style={{ fontSize: 22, background: 'none', border: 'none', cursor: 'pointer',
                           color: n <= stars ? '#f0b429' : '#2a3a50', padding: '2px 3px' }}>
                  ★
                </button>
              );
            })}
            {stars > 0 && (
              <button type="button" onClick={function() { setStars(0); }}
                style={{ fontSize: 11, color: '#5f6368', background: 'none', border: 'none',
                         cursor: 'pointer', marginLeft: 4, alignSelf: 'center' }}>
                clear
              </button>
            )}
          </div>
        </div>

        {/* Dream Trip */}
        <div className="form-group">
          <label className="form-label">Dream Trip <span style={{ color: '#5f6368', fontWeight: 400 }}>(optional — groups multi-country trips)</span></label>
          <input className="form-input" list="bl-trip-ac" value={dreamTrip}
            onChange={function(e) { setDreamTrip(e.target.value); }}
            placeholder="e.g. Riviera Trip, Scandinavian Adventure…" />
          <datalist id="bl-trip-ac">
            {knownDreamTrips.map(function(t) { return React.createElement('option', { key: t, value: t }); })}
          </datalist>
        </div>

        {/* Notes */}
        <div className="form-group">
          <label className="form-label">Notes <span style={{ color: '#5f6368', fontWeight: 400 }}>(optional)</span></label>
          <input className="form-input" value={notes}
            onChange={function(e) { setNotes(e.target.value); }}
            placeholder="Why do you want to visit? Any specific plans…" />
        </div>

        {/* Actions */}
        <div style={{ display: 'flex', gap: 8, justifyContent: 'flex-end', marginTop: 8 }}>
          <button onClick={onClose} disabled={busy}
            style={{ padding: '8px 18px', borderRadius: 7, border: '1px solid #2a3a50',
                     background: 'transparent', color: '#8ab4f8', cursor: 'pointer' }}>
            Cancel
          </button>
          <button onClick={handleSave} disabled={busy || !country.trim()}
            style={{ padding: '8px 18px', borderRadius: 7, border: 'none',
                     background: !country.trim() ? '#1e2a3a' : '#8ab4f8',
                     color: !country.trim() ? '#4a5a70' : '#0d1117',
                     fontWeight: 600, cursor: !country.trim() ? 'default' : 'pointer' }}>
            Add to List
          </button>
        </div>
      </div>
    </div>
  );
}

// ---- Activity list for a single bucket entry --------------------------------
function ActivityList({ bucketId, activities, busy, onAdd, onToggle, onDelete }) {
  var [text, setText] = React.useState('');
  var todo = (activities || []).filter(function(a) { return String(a.Done) !== 'yes'; });
  var done = (activities || []).filter(function(a) { return String(a.Done) === 'yes'; });

  function submit() {
    if (!text.trim() || busy) return;
    onAdd(bucketId, text.trim());
    setText('');
  }

  return (
    <div style={{ marginTop: 10, paddingTop: 10, borderTop: '1px solid rgba(255,255,255,0.06)' }}>
      {todo.map(function(a) {
        return (
          <div key={a.ID} style={{ display:'flex', alignItems:'center', gap:8, marginBottom:6 }}>
            <input type="checkbox" checked={false} onChange={function() { onToggle(a.ID, 'yes'); }} disabled={busy}
              style={{ accentColor:'#5c9eff', cursor:'pointer', flexShrink:0 }} />
            <span style={{ flex:1, fontSize:13, color:'#dde1f0' }}>{a.Activity}</span>
            <button onClick={function() { onDelete(a.ID); }} disabled={busy}
              style={{ background:'none', border:'none', color:'#4d6080', cursor:'pointer', fontSize:13, padding:'0 2px' }}>🗑</button>
          </div>
        );
      })}
      {done.map(function(a) {
        return (
          <div key={a.ID} style={{ display:'flex', alignItems:'center', gap:8, marginBottom:6, opacity:0.45 }}>
            <input type="checkbox" checked={true} onChange={function() { onToggle(a.ID, ''); }} disabled={busy}
              style={{ accentColor:'#5c9eff', cursor:'pointer', flexShrink:0 }} />
            <span style={{ flex:1, fontSize:13, color:'#dde1f0', textDecoration:'line-through' }}>{a.Activity}</span>
            <button onClick={function() { onDelete(a.ID); }} disabled={busy}
              style={{ background:'none', border:'none', color:'#4d6080', cursor:'pointer', fontSize:13, padding:'0 2px' }}>🗑</button>
          </div>
        );
      })}
      <div style={{ display:'flex', gap:6, marginTop:8 }}>
        <input
          value={text}
          onChange={function(ev) { setText(ev.target.value); }}
          onKeyDown={function(ev) { if (ev.key === 'Enter') submit(); }}
          placeholder="Add activity… (Enter to save)"
          style={{ flex:1, fontSize:12, background:'rgba(255,255,255,0.05)', border:'1px solid rgba(255,255,255,0.12)',
                   borderRadius:6, padding:'5px 9px', color:'#dde1f0', outline:'none' }}
        />
        <button onClick={submit} disabled={!text.trim() || busy}
          style={{ background:'rgba(92,158,255,0.15)', border:'1px solid rgba(92,158,255,0.3)',
                   color:'#5c9eff', borderRadius:6, padding:'5px 10px', fontSize:13, cursor:'pointer' }}>＋</button>
      </div>
    </div>
  );
}

function BucketVisaStrip({ country, apiUrl, apiToken }) {
  const [results, setResults] = React.useState(null);
  React.useEffect(function() {
    if (!apiUrl || !apiToken || !country) return;
    apiGet(apiUrl, apiToken, { action: 'get_visa_requirements', destination: country })
      .then(function(r) { setResults(r.results || []); })
      .catch(function() { setResults([]); });
  }, [country]);
  if (!results || results.length === 0) return null;
  var vc = VISA_COLOR;
  return (
    <div style={{ display: 'flex', gap: 5, flexWrap: 'wrap', marginTop: 4 }} onClick={function(e) { e.stopPropagation(); }}>
      {results.map(function(person) {
        var best = (person.passports || [])[0];
        if (!best) return null;
        var c = (vc && vc[best.color]) || { text: '#8ab4f8', bg: '#1a1e2e', border: '#3a4060' };
        return (
          <span key={person.name}
            title={person.passports.map(function(p) { return p.passportCountry + ': ' + p.label; }).join(' | ')}
            style={{ fontSize: 10, fontWeight: 700, color: c.text, background: c.bg,
                     border: '1px solid ' + c.border, borderRadius: 8, padding: '1px 7px',
                     cursor: 'default' }}>
            🛂 {person.name} · {best.label}
          </span>
        );
      })}
    </div>
  );
}

function BucketListPanel({ entries, busy, onLoad, onAdd, onMarkVisited, onDelete,
                           onAddActivity, onToggleActivity, onDeleteActivity, apiUrl, apiToken }) {
  var [filterWho,      setFilterWho]      = React.useState('all');
  var [filterMinStars, setFilterMinStars] = React.useState(0);
  var [showVisited,    setShowVisited]    = React.useState(false);
  var [expanded,       setExpanded]       = React.useState(new Set());
  var [expandedTrips,  setExpandedTrips]  = React.useState(new Set());
  var [showModal,      setShowModal]      = React.useState(false);

  // Load on first mount
  React.useEffect(function() {
    if (entries === null && onLoad) onLoad();
  }, []);

  function toggleExpand(key, isTripSet) {
    var setter = isTripSet ? setExpandedTrips : setExpanded;
    setter(function(prev) {
      var next = new Set(prev);
      next.has(key) ? next.delete(key) : next.add(key);
      return next;
    });
  }

  if (entries === null || entries === 'loading') {
    return <div className="empty-state" style={{ color: '#5f6368' }}>Loading…</div>;
  }

  var wishlist   = entries.filter(function(e) { return e.Visited !== 'yes'; });
  var visitedArr = entries.filter(function(e) { return e.Visited === 'yes'; });

  var filtered = wishlist
    .filter(function(e) { return filterWho === 'all' || e.Traveller === filterWho; })
    .filter(function(e) { return !filterMinStars || Number(e.Stars) >= filterMinStars; });

  // Group by country A-Z
  var byCountry = {};
  filtered.forEach(function(e) {
    if (!byCountry[e.Country]) byCountry[e.Country] = [];
    byCountry[e.Country].push(e);
  });
  var countryNames = Object.keys(byCountry).sort();

  // Group by Dream Trip
  var byDreamTrip = {};
  filtered.filter(function(e) { return e['Dream Trip']; }).forEach(function(e) {
    var k = e['Dream Trip'];
    if (!byDreamTrip[k]) byDreamTrip[k] = [];
    byDreamTrip[k].push(e);
  });
  var dreamTripNames = Object.keys(byDreamTrip).sort();

  function StarDisplay({ n, size }) {
    n = Number(n) || 0;
    return (
      <span style={{ fontSize: size || 12, lineHeight: 1 }}>
        {[1,2,3,4,5].map(function(i) {
          return <span key={i} style={{ color: i <= n ? '#f0b429' : '#2a3a50' }}>★</span>;
        })}
      </span>
    );
  }

  function EntryRow({ e, showVisitedBtn }) {
    var [open, setOpen] = React.useState(false);
    var acts = e.activities || [];
    var ts = e.Traveller === 'Ahmed'    ? { color: '#5c9eff', bg: '#0d2040' }
           : e.Traveller === 'Victoria' ? { color: '#b87cff', bg: '#1a0d30' }
           :                             { color: '#4a9060', bg: '#0d1a10' };
    return (
      <div style={{ borderBottom: '1px solid #0d1520', opacity: e.Visited === 'yes' ? 0.45 : 1 }}>
        {/* Main row */}
        <div style={{ display: 'flex', alignItems: 'center', gap: 8, padding: '8px 16px' }}>
          <div style={{ flex: 1, minWidth: 0 }}>
            <span style={{ fontSize: 13, color: '#dde1f0', fontWeight: 500 }}>
              {e.City || <span style={{ color: '#5f6368', fontStyle: 'italic' }}>Country-level</span>}
            </span>
            {e['Dream Trip'] && (
              <span style={{ marginLeft: 8, fontSize: 10, color: '#5c9eff', background: '#0d2040',
                             borderRadius: 10, padding: '1px 7px' }}>
                {e['Dream Trip']}
              </span>
            )}
            {!open && acts.length > 0 && (
              <span style={{ marginLeft: 8, fontSize: 10, color: '#4d6080' }}>
                {acts.filter(function(a) { return String(a.Done) === 'yes'; }).length}/{acts.length} activities
              </span>
            )}
          </div>
          {e['Target Year'] ? (
            <span style={{ fontSize: 11, color: '#5c9eff', background: '#0d2040',
                           borderRadius: 10, padding: '2px 8px', whiteSpace: 'nowrap' }}>
              {e['Target Year']}
            </span>
          ) : null}
          {Number(e.Stars) > 0 && <StarDisplay n={e.Stars} />}
          <span style={{ fontSize: 11, fontWeight: 600, color: ts.color, background: ts.bg,
                         borderRadius: 10, padding: '2px 8px', whiteSpace: 'nowrap' }}>
            {e.Traveller || 'Both'}
          </span>
          {showVisitedBtn && e.Visited !== 'yes' && (
            <button
              onClick={function() {
                if (window.confirm('Mark "' + (e.City || e.Country) + '" as visited? It will move to the Visited section.')) {
                  onMarkVisited(e.ID);
                }
              }}
              disabled={busy}
              style={{ fontSize: 11, color: '#4a9060', background: 'transparent',
                       border: '1px solid #2a4a30', borderRadius: 6,
                       padding: '3px 8px', cursor: 'pointer', whiteSpace: 'nowrap' }}>
              Mark Visited
            </button>
          )}
          {/* Expand/collapse activities */}
          <button onClick={function() { setOpen(function(v) { return !v; }); }}
            title={open ? 'Collapse activities' : 'Expand activities'}
            style={{ fontSize: 11, color: '#4d6080', background: 'none', border: 'none',
                     cursor: 'pointer', padding: '2px 4px', whiteSpace: 'nowrap' }}>
            {open ? '▼' : '▶'}
          </button>
          <button onClick={function() { if (window.confirm('Remove "' + (e.City || e.Country) + '" from bucket list?')) onDelete(e.ID); }}
            disabled={busy}
            style={{ fontSize: 13, color: '#4a5a70', background: 'none', border: 'none',
                     cursor: 'pointer', padding: '2px 4px' }}>
            🗑
          </button>
        </div>
        {/* Activities panel */}
        {open && (
          <div style={{ padding: '0 16px 12px 16px' }}>
            <ActivityList
              bucketId={e.ID}
              activities={acts}
              busy={busy}
              onAdd={onAddActivity}
              onToggle={onToggleActivity}
              onDelete={onDeleteActivity}
            />
          </div>
        )}
      </div>
    );
  }

  return (
    <div>
      {/* Header bar */}
      <div style={{ display: 'flex', flexWrap: 'wrap', alignItems: 'center', gap: 10, marginBottom: 16 }}>
        <div style={{ display: 'flex', alignItems: 'center', gap: 8 }}>
          <span style={{ fontSize: 13, fontWeight: 700, color: '#dde1f0' }}>
            🪣 {filtered.length} destination{filtered.length !== 1 ? 's' : ''}
          </span>
          <span style={{ fontSize: 11, color: '#5f6368' }}>·</span>
          <span style={{ fontSize: 11, color: '#6b7fa8' }}>{countryNames.length} countries</span>
        </div>

        {/* Who filter */}
        <div style={{ display: 'flex', gap: 4 }}>
          {['all','Ahmed','Victoria','Both'].map(function(w) {
            var label = w === 'all' ? 'All' : w;
            var active = filterWho === w;
            var c = w === 'Ahmed' ? '#5c9eff' : w === 'Victoria' ? '#b87cff' : w === 'Both' ? '#4a9060' : '#6b7fa8';
            return (
              <button key={w} onClick={function() { setFilterWho(w); }}
                style={{ padding: '3px 10px', borderRadius: 20, cursor: 'pointer',
                         fontSize: 11, fontWeight: 600, border: 'none',
                         background: active ? c + '22' : '#1e2a3a',
                         color: active ? c : '#5f6368',
                         outline: active ? '1px solid ' + c + '55' : 'none' }}>
                {label}
              </button>
            );
          })}
        </div>

        {/* Stars filter */}
        <div style={{ display: 'flex', gap: 4 }}>
          {[[0,'Any ★'],[3,'3★+'],[4,'4★+'],[5,'5★']].map(function(pair) {
            var val = pair[0], lbl = pair[1];
            var active = filterMinStars === val;
            return (
              <button key={val} onClick={function() { setFilterMinStars(val); }}
                style={{ padding: '3px 10px', borderRadius: 20, cursor: 'pointer',
                         fontSize: 11, fontWeight: 600, border: 'none',
                         background: active ? '#f0b42922' : '#1e2a3a',
                         color: active ? '#f0b429' : '#5f6368',
                         outline: active ? '1px solid #f0b42955' : 'none' }}>
                {lbl}
              </button>
            );
          })}
        </div>

        <div style={{ marginLeft: 'auto', display: 'flex', gap: 8, alignItems: 'center' }}>
          {visitedArr.length > 0 && (
            <button onClick={function() { setShowVisited(function(v) { return !v; }); }}
              style={{ fontSize: 11, color: showVisited ? '#4a9060' : '#5f6368', background: 'none',
                       border: '1px solid ' + (showVisited ? '#2a4a30' : '#2a3a50'),
                       borderRadius: 6, padding: '4px 10px', cursor: 'pointer' }}>
              {showVisited ? '✓ Visited shown' : '☐ Show visited'}
            </button>
          )}
          <button onClick={function() { setShowModal(true); }} disabled={busy}
            style={{ padding: '6px 14px', borderRadius: 7, border: 'none',
                     background: '#8ab4f8', color: '#0d1117', fontWeight: 700,
                     fontSize: 12, cursor: 'pointer' }}>
            + Add
          </button>
        </div>
      </div>

      {filtered.length === 0 && wishlist.length === 0 && (
        <div className="empty-state">
          <div style={{ fontSize: 36, marginBottom: 12 }}>🌍</div>
          <div style={{ color: '#dde1f0', marginBottom: 6 }}>No destinations yet</div>
          <div style={{ fontSize: 12, color: '#4d6080' }}>Add countries or cities you dream of visiting.</div>
        </div>
      )}

      {/* By Country accordion */}
      {countryNames.length > 0 && (
        <div style={{ marginBottom: 16 }}>
          <div style={{ fontSize: 11, fontWeight: 700, color: '#5f6368', letterSpacing: 1,
                        textTransform: 'uppercase', marginBottom: 8 }}>
            By Country
          </div>
          {countryNames.map(function(cName) {
            var cEntries = byCountry[cName];
            var isOpen   = expanded.has(cName);
            var maxStars = Math.max.apply(null, cEntries.map(function(e) { return Number(e.Stars) || 0; }));
            var travTypes = Array.from(new Set(cEntries.map(function(e) { return e.Traveller; }))).sort();
            return (
              <div key={cName} style={{ background: '#0a1220', border: '1px solid #2a3a50',
                                        borderRadius: 10, marginBottom: 8, overflow: 'hidden' }}>
                <div onClick={function() { toggleExpand(cName, false); }}
                  style={{ display: 'flex', alignItems: 'center', gap: 10, padding: '11px 16px',
                           cursor: 'pointer', borderBottom: isOpen ? '1px solid #2a3a50' : 'none' }}>
                  <span style={{ flexShrink: 0, lineHeight: 0 }}><CountryFlag name={cName} size={26} /></span>
                  <div style={{ flex: 1, minWidth: 0 }}>
                    <div style={{ fontWeight: 700, fontSize: 14, color: '#e8eaed' }}>{cName}</div>
                    {apiUrl && apiToken && <BucketVisaStrip country={cName} apiUrl={apiUrl} apiToken={apiToken} />}
                  </div>
                  <span style={{ fontSize: 11, color: '#5f6368', marginRight: 4, flexShrink: 0 }}>
                    ×{cEntries.length} {cEntries.length === 1 ? 'destination' : 'destinations'}
                  </span>
                  {maxStars > 0 && (
                    <span style={{ fontSize: 11, marginRight: 4 }}>
                      {[1,2,3,4,5].map(function(i) {
                        return <span key={i} style={{ color: i <= maxStars ? '#f0b429' : '#2a3a50' }}>★</span>;
                      })}
                    </span>
                  )}
                  <div style={{ display: 'flex', gap: 3, marginRight: 4 }}>
                    {travTypes.map(function(t) {
                      var c = t === 'Ahmed' ? '#5c9eff' : t === 'Victoria' ? '#b87cff' : '#4a9060';
                      var bg = t === 'Ahmed' ? '#0d2040' : t === 'Victoria' ? '#1a0d30' : '#0d1a10';
                      return (
                        <span key={t} style={{ fontSize: 10, fontWeight: 600, color: c, background: bg,
                                               borderRadius: 10, padding: '1px 7px' }}>
                          {t}
                        </span>
                      );
                    })}
                  </div>
                  <span style={{ color: '#4a5a70', fontSize: 12 }}>{isOpen ? '▲' : '▼'}</span>
                </div>
                {isOpen && (
                  <div style={{ background: '#0d1520' }}>
                    {cEntries.map(function(e) { return <EntryRow key={e.ID} e={e} showVisitedBtn={true} />; })}
                  </div>
                )}
              </div>
            );
          })}
        </div>
      )}

      {/* Dream Trips section */}
      {dreamTripNames.length > 0 && (
        <div style={{ marginBottom: 16 }}>
          <div style={{ fontSize: 11, fontWeight: 700, color: '#5f6368', letterSpacing: 1,
                        textTransform: 'uppercase', marginBottom: 8 }}>
            Dream Trips
          </div>
          {dreamTripNames.map(function(tripName) {
            var tEntries = byDreamTrip[tripName];
            var isOpen   = expandedTrips.has(tripName);
            var countries = Array.from(new Set(tEntries.map(function(e) { return e.Country; })));
            return (
              <div key={tripName} style={{ background: '#0a1220', border: '1px solid #1e3a5a',
                                           borderRadius: 10, marginBottom: 8, overflow: 'hidden' }}>
                <div onClick={function() { toggleExpand(tripName, true); }}
                  style={{ display: 'flex', alignItems: 'center', gap: 10, padding: '11px 16px',
                           cursor: 'pointer', borderBottom: isOpen ? '1px solid #1e3a5a' : 'none' }}>
                  <span style={{ fontSize: 18 }}>🌍</span>
                  <span style={{ fontWeight: 700, fontSize: 14, color: '#8ab4f8', flex: 1 }}>{tripName}</span>
                  <span style={{ fontSize: 11, color: '#5f6368', marginRight: 4 }}>
                    {tEntries.length} destination{tEntries.length !== 1 ? 's' : ''}
                    {countries.length > 1 ? ' · ' + countries.length + ' countries' : ''}
                  </span>
                  <span style={{ color: '#4a5a70', fontSize: 12 }}>{isOpen ? '▲' : '▼'}</span>
                </div>
                {isOpen && (
                  <div style={{ background: '#0d1520', padding: '8px 16px' }}>
                    {tEntries.map(function(e) {
                      return (
                        <div key={e.ID} style={{ display: 'flex', alignItems: 'center', gap: 8,
                                                  padding: '5px 0', borderBottom: '1px solid #0d1520' }}>
                          <span style={{ lineHeight: 0 }}><CountryFlag name={e.Country} size={18} /></span>
                          <span style={{ fontSize: 13, color: '#dde1f0', flex: 1 }}>
                            {e.Country}{e.City ? ' → ' + e.City : ''}
                          </span>
                          {e['Target Year'] ? (
                            <span style={{ fontSize: 11, color: '#5c9eff', background: '#0d2040',
                                           borderRadius: 10, padding: '1px 7px' }}>
                              {e['Target Year']}
                            </span>
                          ) : null}
                          {Number(e.Stars) > 0 && (
                            <span style={{ fontSize: 11 }}>
                              {[1,2,3,4,5].map(function(i) {
                                return <span key={i} style={{ color: i <= Number(e.Stars) ? '#f0b429' : '#2a3a50' }}>★</span>;
                              })}
                            </span>
                          )}
                        </div>
                      );
                    })}
                  </div>
                )}
              </div>
            );
          })}
        </div>
      )}

      {/* Visited section */}
      {showVisited && visitedArr.length > 0 && (
        <div style={{ marginBottom: 16 }}>
          <div style={{ fontSize: 11, fontWeight: 700, color: '#4a9060', letterSpacing: 1,
                        textTransform: 'uppercase', marginBottom: 8 }}>
            Visited ✓
          </div>
          {Object.entries(
            visitedArr.reduce(function(acc, e) {
              if (!acc[e.Country]) acc[e.Country] = [];
              acc[e.Country].push(e);
              return acc;
            }, {})
          ).sort(function(a, b) { return a[0] < b[0] ? -1 : 1; }).map(function(pair) {
            var cName = pair[0], cEntries = pair[1];
            var isOpen = expanded.has('v_' + cName);
            return (
              <div key={cName} style={{ background: '#0a1220', border: '1px solid #1e2a30',
                                        borderRadius: 10, marginBottom: 8, overflow: 'hidden', opacity: 0.55 }}>
                <div onClick={function() { toggleExpand('v_' + cName, false); }}
                  style={{ display: 'flex', alignItems: 'center', gap: 10, padding: '10px 16px',
                           cursor: 'pointer', borderBottom: isOpen ? '1px solid #1e2a30' : 'none' }}>
                  <span style={{ flexShrink: 0, lineHeight: 0 }}><CountryFlag name={cName} size={22} /></span>
                  <span style={{ fontWeight: 600, fontSize: 13, color: '#8a9abf', flex: 1 }}>{cName}</span>
                  <span style={{ fontSize: 11, color: '#4a5a70', marginRight: 4 }}>
                    ×{cEntries.length} · visited
                  </span>
                  <span style={{ color: '#3a4a60', fontSize: 12 }}>{isOpen ? '▲' : '▼'}</span>
                </div>
                {isOpen && (
                  <div style={{ background: '#0d1520' }}>
                    {cEntries.map(function(e) { return <EntryRow key={e.ID} e={e} showVisitedBtn={false} />; })}
                  </div>
                )}
              </div>
            );
          })}
        </div>
      )}

      {/* Add modal */}
      {showModal && (
        <AddBucketItemModal
          entries={entries}
          busy={busy}
          onSave={function(fields) { onAdd(fields); setShowModal(false); }}
          onClose={function() { setShowModal(false); }}
        />
      )}
    </div>
  );
}

// ---- Traveler Profiles + Visa Check (Issue #123) ----------------------------

const VISA_COLOR = {
  green:  { bg: '#0a2a1a', border: '#1a7a3a', text: '#4ade80' },
  yellow: { bg: '#2a2200', border: '#7a6500', text: '#fbbf24' },
  red:    { bg: '#2a0a0a', border: '#7a1a1a', text: '#f87171' },
  grey:   { bg: '#1a1e2e', border: '#3a4060', text: '#8ab4f8' },
};

function ProfilesView({ profiles, loading, busy, onSave, onDelete }) {
  const [modal, setModal] = React.useState(null); // null | 'new' | profile-obj
  const [form, setForm]   = React.useState({});

  // Group by name (name is the combining key)
  const groups = {};
  (profiles || []).forEach(function(p) {
    const n = p.name || 'Unknown';
    if (!groups[n]) groups[n] = [];
    groups[n].push(p);
  });
  const names = Object.keys(groups).sort();

  function openNew(defaultName) {
    setForm({ name: defaultName || '', passportCountry:'', passportExpiry:'', specialDocs:'', notes:'' });
    setModal('new');
  }
  function openEdit(p) { setForm({ ...p }); setModal(p); }
  function closeModal() { setModal(null); setForm({}); }

  async function handleSave() {
    if (!form.name || !form.passportCountry) return;
    await onSave({ ...form, id: modal === 'new' ? '' : modal.id });
    closeModal();
  }

  return (
    <div>
      <div style={{ display:'flex', justifyContent:'space-between', alignItems:'center', marginBottom:16 }}>
        <div style={{ fontSize:16, fontWeight:700, color:'#dde1f0' }}>👤 Traveler Profiles</div>
        <button className="btn-primary" onClick={() => openNew()} disabled={busy}>+ Add Person</button>
      </div>

      {loading && <div className="loading-text">Loading profiles…</div>}
      {!loading && names.length === 0 && (
        <div className="empty-state">
          <div style={{ fontSize:32, marginBottom:10 }}>🛂</div>
          <div>No traveler profiles yet.</div>
          <div style={{ fontSize:12, color:'#4d6080', marginTop:6 }}>Add a person and their passport(s) to enable visa checking.</div>
        </div>
      )}

      {names.map(function(name) {
        const passports = groups[name];
        return (
          <div key={name} style={{ background:'#141826', border:'1px solid #2a3050', borderRadius:10, marginBottom:14, overflow:'hidden' }}>
            {/* Person header */}
            <div style={{ display:'flex', justifyContent:'space-between', alignItems:'center', padding:'12px 18px', background:'#0e1220' }}>
              <div style={{ fontWeight:700, color:'#dde1f0', fontSize:16 }}>{name}</div>
              <button className="btn-sm" onClick={() => openNew(name)} disabled={busy}>+ Passport</button>
            </div>
            {/* One row per passport */}
            {passports.map(function(p, pi) {
              var expiry   = p.passportExpiry ? new Date(p.passportExpiry) : null;
              var daysLeft = expiry ? Math.ceil((expiry - new Date()) / 86400000) : null;
              var expiryColor = daysLeft === null ? '#5c7080' : daysLeft < 0 ? '#f87171' : daysLeft < 180 ? '#f87171' : daysLeft < 365 ? '#fbbf24' : '#4ade80';
              return (
                <div key={p.id} style={{ padding:'12px 18px', borderTop:'1px solid #1a2040', display:'flex', justifyContent:'space-between', alignItems:'flex-start', gap:12 }}>
                  <div style={{ flex:1, minWidth:0 }}>
                    <div style={{ fontSize:14, fontWeight:600, color:'#dde1f0', marginBottom:3 }}>🌍 {p.passportCountry}</div>
                    {p.passportExpiry && (
                      <div style={{ fontSize:12, color: expiryColor, marginBottom: p.specialDocs || p.notes ? 3 : 0 }}>
                        Expires {p.passportExpiry}
                        <span style={{ marginLeft:6 }}>
                          {daysLeft === null ? '' : daysLeft < 0 ? '⚠️ EXPIRED' : '(' + daysLeft + 'd left)'}
                        </span>
                      </div>
                    )}
                    {p.specialDocs && <div style={{ fontSize:12, color:'#8ab4f8', marginBottom:2 }}>📋 {p.specialDocs}</div>}
                    {p.notes      && <div style={{ fontSize:12, color:'#5c7080' }}>{p.notes}</div>}
                  </div>
                  <div style={{ display:'flex', gap:6, flexShrink:0 }}>
                    <button className="btn-sm" onClick={() => openEdit(p)}>✏️</button>
                    <button className="btn-sm btn-danger" onClick={() => onDelete(p.id)} disabled={busy}>✕</button>
                  </div>
                </div>
              );
            })}
          </div>
        );
      })}

      {modal && (
        <div className="modal-overlay" onClick={closeModal}>
          <div className="modal-box" onClick={e => e.stopPropagation()}>
            <div className="modal-title">{modal === 'new' ? 'Add Passport' : 'Edit Passport'}</div>
            {[
              { key:'name',            label:'Person Name',      placeholder:'e.g. Ahmed' },
              { key:'passportCountry', label:'Passport Country', placeholder:'e.g. Egypt' },
              { key:'passportExpiry',  label:'Expiry Date',      type:'date' },
              { key:'specialDocs',     label:'Special Docs',     placeholder:'e.g. US Green Card, UK Ancestry Visa' },
              { key:'notes',           label:'Notes',            placeholder:'e.g. Renewed 2024' },
            ].map(function(f) {
              return (
                <div key={f.key} style={{ marginBottom:12 }}>
                  <div style={{ fontSize:12, color:'#8ab4f8', marginBottom:4 }}>{f.label}</div>
                  <input
                    className="modal-input"
                    type={f.type || 'text'}
                    placeholder={f.placeholder || ''}
                    value={form[f.key] || ''}
                    onChange={e => setForm(prev => ({ ...prev, [f.key]: e.target.value }))}
                  />
                </div>
              );
            })}
            <div style={{ display:'flex', gap:10, marginTop:16 }}>
              <button className="btn-primary" onClick={handleSave} disabled={busy || !form.name || !form.passportCountry}>Save</button>
              <button className="btn-secondary" onClick={closeModal}>Cancel</button>
            </div>
          </div>
        </div>
      )}
    </div>
  );
}

function VisaCheckView({ profiles, upcomingTrips, busy, onCheck, visaResults, visaLoading, visaNote }) {
  const [destination, setDestination] = React.useState('');

  function handleCheck() { if (destination.trim()) onCheck(destination.trim()); }

  const trips = (upcomingTrips || []).map(function(t) { return t.label; });

  const vc = VISA_COLOR;

  return (
    <div>
      <div style={{ fontSize:16, fontWeight:700, color:'#dde1f0', marginBottom:16 }}>🛂 Visa Requirements</div>

      {profiles.length === 0 && (
        <div style={{ background:'#1a1e2e', border:'1px solid #3a4060', borderRadius:8, padding:'12px 16px', marginBottom:16, fontSize:13, color:'#8ab4f8' }}>
          ⚠️ Add traveler profiles (with passport countries) in the Profiles tab first.
        </div>
      )}

      <div style={{ display:'flex', gap:10, marginBottom:20, alignItems:'flex-end' }}>
        <div style={{ flex:1 }}>
          <div style={{ fontSize:12, color:'#8ab4f8', marginBottom:6 }}>Destination Country</div>
          <input
            className="modal-input"
            style={{ margin:0 }}
            placeholder="e.g. France, Japan, United States…"
            value={destination}
            onChange={e => setDestination(e.target.value)}
            onKeyDown={e => e.key === 'Enter' && handleCheck()}
            list="trip-destinations"
          />
          <datalist id="trip-destinations">
            {trips.map(function(t, i) { return <option key={i} value={t} />; })}
          </datalist>
        </div>
        <button className="btn-primary" onClick={handleCheck} disabled={busy || visaLoading || !destination.trim() || profiles.length === 0}>
          {visaLoading ? 'Checking…' : 'Check Visa'}
        </button>
      </div>

      {visaNote && (
        <div style={{ background:'#1a1e2e', border:'1px solid #3a4060', borderRadius:8, padding:'12px 16px', marginBottom:16, fontSize:13, color:'#8ab4f8' }}>
          ℹ️ {visaNote}
        </div>
      )}

      {visaResults && visaResults.length > 0 && (
        <div>
          <div style={{ fontSize:13, color:'#5c7080', marginBottom:10 }}>
            Results for <strong style={{ color:'#dde1f0' }}>{destination}</strong>
          </div>
          {visaResults.map(function(r, i) {
            // Best passport = first (sorted green→red in backend)
            var best = (r.passports && r.passports[0]) || {};
            var bc   = vc[best.color] || vc.grey;
            return (
              <div key={i} style={{ background:'#141826', border:'1px solid #2a3050', borderRadius:10, marginBottom:12, overflow:'hidden' }}>
                {/* Person header */}
                <div style={{ display:'flex', justifyContent:'space-between', alignItems:'center', padding:'12px 18px', borderBottom: r.passports && r.passports.length > 1 ? '1px solid #2a3050' : 'none' }}>
                  <div style={{ fontWeight:700, color:'#dde1f0', fontSize:15 }}>{r.name}</div>
                  {/* Best option badge */}
                  <div style={{ background: bc.bg, border:'1px solid ' + bc.border, borderRadius:6, padding:'3px 10px', fontSize:13, fontWeight:600, color: bc.text }}>
                    {best.label}
                  </div>
                </div>
                {/* Per-passport rows (only shown if >1 passport) */}
                {r.passports && r.passports.length > 1 && r.passports.map(function(pp, pi) {
                  var c = vc[pp.color] || vc.grey;
                  return (
                    <div key={pi} style={{ display:'flex', justifyContent:'space-between', alignItems:'center', padding:'9px 18px', background:'#0e1220', borderTop: pi > 0 ? '1px solid #1a2040' : 'none' }}>
                      <div style={{ fontSize:13, color:'#8ab4f8' }}>🌍 {pp.passportCountry}</div>
                      <div style={{ fontSize:13, fontWeight:600, color: c.text }}>{pp.label}</div>
                    </div>
                  );
                })}
                {/* Single passport — show country under header */}
                {r.passports && r.passports.length === 1 && (
                  <div style={{ padding:'0 18px 10px', fontSize:12, color:'#5c7080' }}>🌍 {r.passports[0].passportCountry}</div>
                )}
              </div>
            );
          })}
          <div style={{ fontSize:11, color:'#3a4060', marginTop:12 }}>
            Data source: Passport Index (ilyankou/passport-index-dataset). Check official embassy sources before travel.
          </div>
        </div>
      )}
    </div>
  );
}

// ---- Travel Tab -------------------------------------------------------------

function TravelTab({ pto, itineraries, packingItems, tripMeta, packingFocusTripKey, itineraryFocusTripKey, busy,
                     countries, countriesLoaded,
                     onSelectTrip, onExpandTrip,
                     onAddItinItem, onEditItinItem, onDeleteItinItem,
                     onSetTripMeta, onLoadTripMeta,
                     onLoadPacking, onGeneratePacking,
                     onTogglePackingItem, onAddPackingItem, onDeletePackingItem,
                     onGoToPacking,
                     onLoadCountries, onAddCountry, onDeleteCountry,
                     bucketList, onLoadBucketList, onAddBucketItem, onMarkBucketVisited, onDeleteBucketItem,
                     onAddBucketActivity, onToggleBucketActivity, onDeleteBucketActivity,
                     recommendations, onLoadRecs, onGenerateRecs, onAcceptRec, onDismissRec,
                     profiles, profilesLoading, onSaveProfile, onDeleteProfile,
                     apiUrl, apiToken }) {
  const [sub,           setSub]           = React.useState('trips');
  const [autoExpandKey, setAutoExpandKey] = React.useState(null);

  const upcomingTravel = (pto && pto.ahmedStats && pto.ahmedStats.upcomingTravel) || [];

  // Load tripMeta for all trips when the My Trips tab is active
  React.useEffect(function() {
    if (sub !== 'trips' || !onLoadTripMeta) return;
    upcomingTravel.forEach(function(t) {
      var tk = t.startDate + '|' + t.label;
      if (!tripMeta || tripMeta[tk] === undefined) onLoadTripMeta(tk);
    });
  }, [sub, upcomingTravel.length]);

  // Auto-switch to packing sub-tab when packingFocusTripKey changes
  React.useEffect(function() {
    if (!packingFocusTripKey) return;
    setSub('packing');
    setAutoExpandKey(packingFocusTripKey);
  }, [packingFocusTripKey]);

  // Auto-switch to itinerary sub-tab and expand the correct trip when
  // "View Full Itinerary" is clicked from the Active Travel Card on the Home tab.
  React.useEffect(function() {
    if (!itineraryFocusTripKey || !upcomingTravel.length) return;
    setSub('itinerary');
    setAutoExpandKey(itineraryFocusTripKey);
    var t = upcomingTravel.find(function(t) {
      return (t.startDate + '|' + t.label) === itineraryFocusTripKey;
    });
    if (t) onSelectTrip({ ...t, tripKey: itineraryFocusTripKey });
  }, [itineraryFocusTripKey, upcomingTravel.length]); // eslint-disable-line

  function handleTripClick(t) {
    const tripKey = `${t.startDate}|${t.label}`;
    onSelectTrip({ ...t, tripKey }); // triggers loadItinerary if not cached
    setAutoExpandKey(tripKey);       // tells accordion to open this trip
    setSub('itinerary');
  }

  const subTabs = [
    { id: 'trips',      label: '✈️ My Trips' },
    { id: 'itinerary',  label: '🗺️ My Itinerary' },
    { id: 'packing',    label: '🎒 Packing' },
    { id: 'discover',   label: '✨ Discover' },
    { id: 'budget',     label: '💰 Budget' },
    { id: 'countries',  label: '🌍 Countries' },
    { id: 'bucketlist', label: '🪣 Bucket List' },
    { id: 'profiles',   label: '👤 Profiles' },
  ];

  return (
    <div>
      {/* Sub-tab pills */}
      <div className="subtab-row">
        {subTabs.map(s => (
          <button
            key={s.id}
            className={`subtab-btn${sub === s.id ? ' active' : ''}`}
            onClick={() => setSub(s.id)}
          >{s.label}</button>
        ))}
      </div>

      {/* My Trips — live from PTO upcomingTravel */}
      {sub === 'trips' && (
        upcomingTravel.length === 0
          ? (
            <div className="empty-state">
              <div style={{ fontSize: 36, marginBottom: 12 }}>✈️</div>
              <div>No upcoming travel found.</div>
              <div style={{ fontSize: 12, color: '#4d6080', marginTop: 8 }}>
                Travel events are pulled from your shared "AE&amp;VV - Our Joint Chaos" calendar.
              </div>
            </div>
          )
          : (
            <div>
              {upcomingTravel.map((t, i) => {
                const tripKey = `${t.startDate}|${t.label}`;
                const meta    = tripMeta && tripMeta[tripKey] && tripMeta[tripKey] !== 'loading'
                                  ? tripMeta[tripKey] : null;
                // Read-only traveler badge from persisted tripMeta
                const traveler = (meta && meta.traveler) || 'Both';
                const tvColor  = traveler === 'Ahmed' ? '#5c9eff' : traveler === 'Victoria' ? '#b87cff' : '#4a9060';
                const tvBg     = traveler === 'Ahmed' ? '#0d2040' : traveler === 'Victoria' ? '#1a0d30' : '#0d1a10';
                // Read-only context chip
                const ctx      = meta && meta.context;
                const ctxColor = (CONTEXT_COLORS && CONTEXT_COLORS[ctx]) || '#5c9eff';
                return (
                  <div key={i} className="bento-card"
                    style={{ cursor: 'pointer', transition: 'border-color .15s' }}
                    onClick={() => handleTripClick(t)}>
                    <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'flex-start' }}>
                      <div>
                        <div style={{ fontWeight: 700, fontSize: 15, color: '#dde1f0', marginBottom: 4 }}>
                          {t.label}
                        </div>
                        <div style={{ fontSize: 12, color: '#6b7fa8', marginBottom: 8 }}>{t.startDate} – {t.endDate}</div>
                        {/* Read-only context + traveler — set these in My Itinerary */}
                        <div style={{ display: 'flex', alignItems: 'center', gap: 6 }}>
                          {ctx ? (
                            <span style={{ fontSize: 11, fontWeight: 600, color: ctxColor,
                                           background: ctxColor + '22', borderRadius: 20,
                                           padding: '2px 9px', border: '1px solid ' + ctxColor + '44' }}>
                              {ctx}
                            </span>
                          ) : (
                            <span style={{ fontSize: 11, color: '#3a4a60', fontStyle: 'italic' }}>No context</span>
                          )}
                          <span style={{ fontSize: 11, fontWeight: 600, color: tvColor,
                                         background: tvBg, borderRadius: 10,
                                         padding: '2px 8px', border: '1px solid ' + tvColor + '33' }}>
                            {traveler}
                          </span>
                        </div>
                      </div>
                      <div style={{ display: 'flex', alignItems: 'center', gap: 12 }}>
                        <div style={{ fontSize: 13, color: '#5c9eff', fontWeight: 600, whiteSpace: 'nowrap' }}>
                          <DaysAway n={t.daysAway} />
                        </div>
                        <div style={{ fontSize: 12, color: '#8ab4f8' }}>View Itinerary →</div>
                      </div>
                    </div>
                  </div>
                );
              })}
            </div>
          )
      )}

      {/* My Itinerary — accordion across all trips */}
      {sub === 'itinerary' && (
        <div>
          {/* Discover badge — show when any loaded trip has pending recs */}
          {(function() {
            var totalPending = 0;
            upcomingTravel.forEach(function(t) {
              var recs = recommendations && recommendations[t.startDate + '|' + t.label];
              if (Array.isArray(recs)) totalPending += recs.filter(function(r) { return r.status === 'pending'; }).length;
            });
            if (!totalPending) return null;
            return (
              <div
                style={{ background: '#0d2040', border: '1px solid #1a3a6e', borderRadius: 8,
                          padding: '8px 14px', marginBottom: 12, cursor: 'pointer',
                          display: 'flex', alignItems: 'center', gap: 8 }}
                onClick={function() { setSub('discover'); }}
              >
                <span style={{ fontSize: 15 }}>✨</span>
                <span style={{ fontSize: 13, color: '#8ab4f8', fontWeight: 600 }}>
                  {totalPending} VERA pick{totalPending !== 1 ? 's' : ''} available →
                </span>
                <span style={{ fontSize: 11, color: '#4d6080' }}>See Discover tab</span>
              </div>
            );
          })()}
          <TravelItineraryPanel
            trips={upcomingTravel}
            itineraries={itineraries}
            tripMeta={tripMeta}
            busy={busy}
            autoExpandKey={autoExpandKey}
            onExpandTrip={onExpandTrip}
            onAddItinItem={onAddItinItem}
            onEditItinItem={onEditItinItem}
            onDeleteItinItem={onDeleteItinItem}
            onSetTripMeta={onSetTripMeta}
            onLoadTripMeta={onLoadTripMeta}
            onGoToPacking={onGoToPacking}
            apiUrl={apiUrl}
            apiToken={apiToken}
          />
        </div>
      )}

      {/* Packing sub-tab */}
      {sub === 'packing' && (
        <PackingPanel
          trips={upcomingTravel}
          packingItems={packingItems}
          tripMeta={tripMeta}
          busy={busy}
          focusTripKey={autoExpandKey}
          onLoadPacking={onLoadPacking}
          onSetTripMeta={onSetTripMeta}
          onGeneratePacking={onGeneratePacking}
          onToggleItem={onTogglePackingItem}
          onAddItem={onAddPackingItem}
          onDeleteItem={onDeletePackingItem}
        />
      )}

      {/* Discover sub-tab — AI trip recommendations */}
      {sub === 'discover' && (
        <RecommendationsPanel
          trips={upcomingTravel}
          recommendations={recommendations || {}}
          busy={busy}
          onLoadRecs={onLoadRecs}
          onGenerateRecs={onGenerateRecs}
          onAcceptRec={onAcceptRec}
          onDismissRec={onDismissRec}
          onGoToItinerary={function(tripKey) {
            var trip = upcomingTravel.find(function(tt) {
              return (tt.startDate + '|' + tt.label) === tripKey;
            });
            if (trip) {
              onSelectTrip(Object.assign({}, trip, { tripKey: tripKey }));
              setAutoExpandKey(tripKey);
            }
            setSub('itinerary');
          }}
        />
      )}

      {/* Countries visited sub-tab */}
      {sub === 'countries' && (
        <CountriesVisitedPanel
          entries={countries}
          upcomingTravel={upcomingTravel}
          busy={busy}
          loaded={countriesLoaded}
          onLoad={onLoadCountries}
          onAdd={onAddCountry}
          onDelete={onDeleteCountry}
          onGoToItinerary={function(tripKey) {
            var trip = upcomingTravel.find(function(t) {
              return (t.startDate + '|' + t.label) === tripKey;
            });
            if (trip) {
              onSelectTrip(Object.assign({}, trip, { tripKey: tripKey }));
              setAutoExpandKey(tripKey);
            }
            setSub('itinerary');
          }}
        />
      )}

      {/* Bucket List */}
      {sub === 'bucketlist' && (
        <BucketListPanel
          entries={bucketList}
          trips={upcomingTravel}
          busy={busy}
          onLoad={onLoadBucketList}
          onAdd={onAddBucketItem}
          onMarkVisited={onMarkBucketVisited}
          onDelete={onDeleteBucketItem}
          onAddActivity={onAddBucketActivity}
          onToggleActivity={onToggleBucketActivity}
          onDeleteActivity={onDeleteBucketActivity}
          apiUrl={apiUrl}
          apiToken={apiToken}
        />
      )}

      {/* Budget placeholder */}
      {sub === 'budget' && (
        <div className="empty-state">
          <div style={{ fontSize: 36, marginBottom: 12 }}>💰</div>

function fmtMoney(n) {
  if (n == null || n === '') return '—';
  return '$' + Number(n).toLocaleString('en-US', { minimumFractionDigits: 0, maximumFractionDigits: 0 });
}

function fmtGoalDate(d) {
  if (!d) return '—';
  var dt = new Date(d + 'T12:00:00');
  return dt.toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' });
}

function projectionChip(proj, targetDate) {
  if (!proj) return null;
  if (proj.achieved) return <span style={{ fontSize:11, fontWeight:700, color:'#4ade80', background:'#0a2a1a', border:'1px solid #1a7a3a', borderRadius:8, padding:'2px 8px' }}>✓ Achieved</span>;
  if (proj.noContribution) return <span style={{ fontSize:11, fontWeight:700, color:'#fbbf24', background:'#2a2200', border:'1px solid #7a6500', borderRadius:8, padding:'2px 8px' }}>⚠ No contribution set</span>;
  if (!proj.projectedDate) return null;
  var onTrack = proj.onTrack !== false;
  var dEl     = proj.daysEarlyOrLate;
  var label   = onTrack
    ? (dEl !== null ? (dEl === 0 ? 'On target' : dEl + 'd early') : 'On track')
    : (dEl !== null ? Math.abs(dEl) + 'd late' : 'Off track');
  return (
    <span style={{ fontSize:11, fontWeight:700,
                   color: onTrack ? '#4ade80' : '#f87171',
                   background: onTrack ? '#0a2a1a' : '#2a0a0a',
                   border: '1px solid ' + (onTrack ? '#1a7a3a' : '#7a1a1a'),
                   borderRadius:8, padding:'2px 8px' }}>
      {onTrack ? '✓' : '⚠'} {label}
    </span>
  );
}

function ScenarioSimulatorModal({ goal, apiUrl, apiToken, busy, onClose }) {
  const [changeType,    setChangeType]    = React.useState('one-time');
  const [amount,        setAmount]        = React.useState('');
  const [description,   setDescription]  = React.useState('');
  const [result,        setResult]        = React.useState(null);
  const [loading,       setLoading]       = React.useState(false);
  const [saving,        setSaving]        = React.useState(false);
  const [saved,         setSaved]         = React.useState(false);

  async function runSim() {
    if (!amount) return;
    setLoading(true);
    setResult(null);
    try {
      const data = await apiGet(apiUrl, apiToken, { action:'simulate_scenario', goalId:goal.id, changeType, amount });
      if (data.ok) setResult(data.result);
    } catch(e) {}
    setLoading(false);
  }

  async function saveScenario() {
    if (!result) return;
    setSaving(true);
    try {
      await apiGet(apiUrl, apiToken, { action:'save_scenario', goalId:goal.id, label:description||changeType+' $'+amount, changeType, amount, notes:description });
      setSaved(true);
    } catch(e) {}
    setSaving(false);
  }

  const VC = VISA_COLOR; // reuse color map: green/yellow/red/grey
  const baseColor = result ? (result.baseline.onTrack ? VC.green : VC.red) : VC.grey;
  const scenColor = result ? (result.atRisk ? VC.red : result.scenario.noContribution ? VC.red : VC.green) : VC.grey;

  return (
    <div className="modal-overlay" onClick={onClose}>
      <div className="modal-box" style={{ maxWidth:480 }} onClick={e => e.stopPropagation()}>
        <div className="modal-title">🔮 What-If Simulator</div>
        <div style={{ fontSize:13, color:'#8ab4f8', marginBottom:16 }}>
          {goal.name} — {fmtMoney(goal.targetAmount)}{goal.targetDate ? ' by ' + fmtGoalDate(goal.targetDate) : ''}

        {/* Change type toggle */}
        <div style={{ display:'flex', gap:8, marginBottom:12 }}>
          {[['one-time','💳 One-time purchase'],['recurring','🔄 Recurring expense']].map(function([v,l]) {
            var active = changeType === v;
            return (
              <button key={v} onClick={() => { setChangeType(v); setResult(null); }}
                style={{ flex:1, padding:'8px', borderRadius:8, cursor:'pointer', fontWeight:600, fontSize:12,
                         border: active ? '1.5px solid #5c9eff' : '1.5px solid #2a3a50',
                         background: active ? '#0d2040' : '#0d1520', color: active ? '#5c9eff' : '#8ab4f8' }}>
                {l}
              </button>

        </div>

        <div style={{ marginBottom:12 }}>
          <div style={{ fontSize:12, color:'#8ab4f8', marginBottom:4 }}>Amount ($)</div>
          <input className="modal-input" type="number" min="0" placeholder="e.g. 30000"

        <div style={{ marginBottom:16 }}>
          <div style={{ fontSize:12, color:'#8ab4f8', marginBottom:4 }}>Description (optional)</div>

        <button className="btn-primary" style={{ width:'100%', marginBottom:16 }}
          onClick={runSim} disabled={loading || !amount}>
          {loading ? 'Calculating…' : 'Run Simulation'}
        </button>

        {result && (
          <div style={{ marginBottom:16 }}>
            {/* Baseline */}
            <div style={{ background:baseColor.bg, border:'1px solid '+baseColor.border, borderRadius:8, padding:'12px 14px', marginBottom:8 }}>
              <div style={{ fontSize:11, color:'#5c7080', marginBottom:4, textTransform:'uppercase' }}>Without this change</div>
              <div style={{ fontSize:14, fontWeight:700, color:baseColor.text }}>
                {result.baseline.achieved ? '✓ Already achieved' :
                 result.baseline.noContribution ? 'No contribution set' :
                 result.baseline.projectedDate ? fmtGoalDate(result.baseline.projectedDate) : '—'}
              </div>
              {result.baseline.daysEarlyOrLate !== null && !result.baseline.achieved && (
                <div style={{ fontSize:12, color:'#8ab4f8', marginTop:2 }}>
                  {result.baseline.onTrack ? result.baseline.daysEarlyOrLate + ' days early' : Math.abs(result.baseline.daysEarlyOrLate) + ' days late'}
                </div>
              )}
            </div>
            {/* Scenario */}
            <div style={{ background:scenColor.bg, border:'1px solid '+scenColor.border, borderRadius:8, padding:'12px 14px', marginBottom:10 }}>
              <div style={{ fontSize:11, color:'#5c7080', marginBottom:4, textTransform:'uppercase' }}>
                With {changeType === 'one-time' ? '$'+Number(amount).toLocaleString()+' purchase' : '$'+Number(amount).toLocaleString()+'/mo increase'}
              </div>
              <div style={{ fontSize:14, fontWeight:700, color:scenColor.text }}>
                {result.scenario.noContribution ? 'Goal becomes unreachable' :
                 result.scenario.projectedDate ? fmtGoalDate(result.scenario.projectedDate) : '—'}

              {result.delayDays > 0 && (
                <div style={{ fontSize:12, color:'#fbbf24', marginTop:2 }}>Delay: {result.delayLabel}</div>
